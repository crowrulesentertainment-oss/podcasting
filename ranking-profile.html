<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking Profile • CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting-platform.css?v=6"><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=5" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script><script src="js/podcasting-config.js"></script><script src="js/podcasting-platform.js" defer></script><script src="js/ranking-intelligence-v64.js" defer></script></head><body><main class="cr-shell"><section class="hero"><div><div class="eyebrow">CrowRules Podcasting • V6.6</div><h1>RANKING<br>PROFILE.</h1><p>Score history, rank trajectory, momentum and personalized match intelligence.</p><a class="btn" href="social-rankings.html">← Rankings</a> <a class="btn" id="compare" href="ranking-compare.html">Compare</a> <a class="btn" href="community.html">Community</a></div></section><section class="section"><div id="profile" class="card panel">Loading ranking profile…</div></section><section class="section"><div class="card panel"><h2>Score History</h2><div class="form-grid"><div class="field"><label>Window</label><select id="window"><option value="24">24H</option><option value="168">7D</option><option value="720">30D</option></select></div></div><p class="muted">Historical snapshots captured by the ranking worker.</p><div id="chart" style="overflow-x:auto"></div></div></section><section class="section"><div class="card panel"><h2>Ranking Intelligence</h2><div id="intelligence" class="grid"></div></div></section></main><script>document.addEventListener('crow:ready',async()=>{const $=x=>document.getElementById(x),E=CrowPodcasting.esc;const id=new URLSearchParams(location.search).get('user');if(!id){$('profile').innerHTML='<div class="notice">No ranking profile selected.</div>';return}const ps=await CrowPodcasting.rows('cr_podcast_profiles_v5','user_id,handle,display_name,avatar_url,bio,is_public',{eq:{user_id:id},limit:1});const p=ps[0];if(!p||!p.is_public){$('profile').innerHTML='<div class="notice">This ranking profile is unavailable.</div>';return}let snaps=[];async function loadSnaps(){snaps=await CrowRankingV67.profileHistory(id,500);renderChart()}await loadSnaps();const latest=snaps[snaps.length-1]||{};const prev=snaps.length>1?snaps[snaps.length-2]:null;const delta=prev?Number(latest.social_score||0)-Number(prev.social_score||0):0;const rising=delta>0;const shows=await CrowPodcasting.rows('podcasts','id,title,status,artwork_url',{eq:{creator_id:id},limit:100});const creator=shows.some(x=>x.status==='published');let match=null;try{if(CrowPodcasting.user&&CrowPodcasting.user.id!==id){const m=await CrowRankingV642.personalized(50);match=m.find(x=>x.user_id===id)||null}}catch(e){}$('profile').innerHTML='<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'+(p.avatar_url?'<img src="'+E(p.avatar_url)+'" style="width:96px;height:96px;border-radius:50%;object-fit:cover" alt="">':'')+'<div><div class="eyebrow">'+(creator?'🎙️ CREATOR':'🎧 LISTENER')+'</div><h2>'+E(p.display_name||'Listener')+'</h2><p class="muted">@'+E(p.handle||'listener')+'</p><span class="badge">'+(rising?'🔥 Rising':'Steady')+'</span></div></div><div class="grid" style="margin-top:18px"><div class="card panel"><b>Social Score</b><h2>'+E(Number(latest.social_score||0).toFixed(0))+'</h2></div><div class="card panel"><b>Rank</b><h2>#'+E(latest.rank_position||'—')+'</h2></div><div class="card panel"><b>24h Change</b><h2>'+(delta>=0?'+':'')+E(delta.toFixed(0))+'</h2></div><div class="card panel"><b>Published Shows</b><h2>'+E(shows.filter(x=>x.status==='published').length)+'</h2></div></div>';if(!snaps.length){$('chart').innerHTML='<div class="notice">Historical snapshots are still accumulating.</div>'}else{const pts=snaps.slice(-30),max=Math.max(...pts.map(x=>Number(x.social_score||0)),1);$('chart').innerHTML='<div style="display:flex;align-items:end;gap:5px;height:180px;padding:12px">'+pts.map(x=>{const h=Math.max(4,Number(x.social_score||0)/max*150);return '<div title="'+E(new Date(x.captured_at).toLocaleString())+' • Score '+E(x.social_score)+'" style="width:14px;height:'+h+'px;background:linear-gradient(180deg,#8b5cf6,#06b6d4);border-radius:4px 4px 0 0"></div>'}).join('')+'</div><small class="muted">Last '+pts.length+' captured snapshots • newest at right</small>'}$('intelligence').innerHTML='<div class="card panel"><b>Reputation</b><p>'+E(Number(latest.reputation_score||0).toFixed(0))+'</p></div><div class="card panel"><b>Momentum</b><p>'+E(Number(latest.velocity_score||0).toFixed(1))+'</p></div><div class="card panel"><b>Engagement</b><p>'+E(Number(latest.engagement_score||0).toFixed(0))+'</p></div><div class="card panel"><b>Affinity</b><p>'+E(Number(latest.affinity_score||0).toFixed(0))+'</p></div><div class="card panel"><b>Similarity</b><p>'+E(Number(latest.similarity_score||0).toFixed(0))+'</p></div>'+(match?'<div class="card panel"><b>Why You Match</b><p>'+E(match.explanation||'Recommended through the CrowRules discovery engine.')+'</p><span class="badge">Match '+E(match.match_score)+'%</span></div>':'');})</script></body></html>
