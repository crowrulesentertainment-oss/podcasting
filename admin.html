<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcasting Admin — CrowRules Live Operations</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=1" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script><style>
:root{--live:#35f2a1;--warn:#ffd166;--bad:#ff5268;--panel:rgba(12,16,28,.88);--line:rgba(255,255,255,.1)}.admin-live{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.pill,.btn{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--panel);color:inherit}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:7px}.connected .dot{background:var(--live);box-shadow:0 0 12px var(--live);animation:pulse 1.3s infinite}.error .dot{background:var(--bad)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;backdrop-filter:blur(10px)}.card{transition:.2s}.card.flash{box-shadow:0 0 0 2px var(--live),0 0 25px #35f2a133}.stat{font-size:2rem;font-weight:800}.muted{opacity:.58;font-size:.78rem}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:15px;margin-top:15px}.feed{display:grid;gap:8px;max-height:450px;overflow:auto}.event{display:grid;grid-template-columns:75px 1fr auto;gap:9px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#ffffff05}.event.new{animation:in .35s}.etype{font-size:.67rem;font-weight:800}.event strong{display:block}.event span{font-size:.75rem;opacity:.58}.alert-panel{position:fixed;right:16px;bottom:16px;width:min(390px,calc(100vw - 32px));z-index:9999;display:grid;gap:8px}.alert{background:#101625f5;border:1px solid #ffffff1c;border-left:3px solid var(--live);border-radius:13px;padding:13px;box-shadow:0 15px 45px #0008;animation:in .25s}.alert.warn{border-left-color:var(--warn)}.alert.bad{border-left-color:var(--bad)}.alert b{display:block}.alert small{opacity:.65}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{cursor:pointer;border-radius:10px}.btn:hover{background:#ffffff12}.online{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.online div{padding:11px;border:1px solid var(--line);border-radius:11px}.online b{display:block;font-size:1.35rem}.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.filters button{border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:5px 9px;cursor:pointer}.filters .active{background:#35f2a11f;border-color:#35f2a166}@keyframes pulse{50%{opacity:.45;transform:scale(.8)}}@keyframes in{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}@media(max-width:760px){.layout{grid-template-columns:1fr}.event{grid-template-columns:58px 1fr}.event time{display:none}}
</style></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">ADMIN COMMAND CENTER · LIVE OPERATIONS</div><h1>Podcasting <span class="gradient">control.</span></h1><div id="status" class="notice">Connecting to CrowRules…</div><div class="admin-live"><div id="rt" class="pill"><span class="dot"></span><span id="rtText">REALTIME CONNECTING</span></div><div class="pill">Last sync <span id="sync" class="muted">—</span></div><div class="actions"><button id="refresh" class="btn">↻ Refresh</button><button id="sound" class="btn">🔔 Sound ON</button><button id="clear" class="btn">Clear activity</button></div></div><section id="metrics" class="grid"></section><div class="layout"><section class="panel"><h2>Live Operations Feed</h2><div id="filters" class="filters"></div><div id="feed" class="feed"><div class="muted">Waiting for live activity…</div></div></section><aside class="panel"><h2>Platform Monitor</h2><div class="online"><div><b id="session">0</b><span class="muted">SESSION EVENTS</span></div><div><b id="tables">0</b><span class="muted">ACTIVE TABLES</span></div></div><div id="monitor"></div></aside></div></main><div id="alerts" class="alert-panel" aria-live="polite"></div>
<script>
(()=>{const T=['members','podcasts','podcast_episodes','podcast_follows','podcast_listens','podcast_subscriptions','membership_plans'];const L={members:'Members',podcasts:'Podcasts',podcast_episodes:'Episodes',podcast_follows:'Follows',podcast_listens:'Listens',podcast_subscriptions:'Subscriptions',membership_plans:'Plans'};const S={events:[],counts:{},tables:new Set(),channel:null,filter:'all',busy:false,sound:true};const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const now=()=>new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});function sync(){$('sync').textContent=now()}function status(ok,text){$('rt').classList.toggle('connected',ok);$('rt').classList.toggle('error',!ok);$('rtText').textContent=text}function metrics(){$('metrics').innerHTML=T.map(t=>`<article id="m-${t}" class="card"><div class="stat">${esc(S.counts[t]??'—')}</div><div>${L[t]}</div><small class="muted">LIVE COUNT</small></article>`).join('')}function filters(){$('filters').innerHTML=['all',...T].map(t=>`<button class="${S.filter===t?'active':''}" data-f="${t}">${t==='all'?'All':L[t]}</button>`).join('');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;filters();render()})}function render(){let a=S.filter==='all'?S.events:S.events.filter(x=>x.table===S.filter);$('feed').innerHTML=a.length?a.map((x,i)=>`<div class="event ${i===0?'new':''}"><div class="etype">${esc(x.type)}</div><div><strong>${esc(L[x.table]||x.table)}</strong><span>${esc(x.label)}</span></div><time class="muted">${x.time}</time></div>`).join(''):'<div class="muted">No matching activity.</div>'}function monitor(){ $('monitor').innerHTML=T.map(t=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ffffff12"><b>${L[t]}</b><span class="muted">${S.tables.has(t)?'LIVE EVENT':'LISTENING'}</span></div>`).join('')}function beep(){if(!S.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=660;g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08)}catch(_){}}function alertBox(x){const d=document.createElement('div');d.className='alert';d.innerHTML=`<b>● ${esc(x.type)} · ${esc(L[x.table]||x.table)}</b><small>${esc(x.label)} · ${x.time}</small>`;$('alerts').prepend(d);setTimeout(()=>d.remove(),6500);beep()}function add(table,type,row){const label=row?.title||row?.name||row?.email||row?.slug||row?.id||'Database record changed';const x={table,type,label,time:now()};S.events.unshift(x);S.events=S.events.slice(0,100);S.tables.add(table);$('session').textContent=S.events.length;$('tables').textContent=S.tables.size;render();monitor();const m=$('m-'+table);if(m){m.classList.remove('flash');void m.offsetWidth;m.classList.add('flash');setTimeout(()=>m.classList.remove('flash'),900)}alertBox(x);sync()}async function counts(){if(!window.CROW_SUPABASE||!window.CROW_CONFIG||S.busy)return;S.busy=true;try{const r=await CROW_SUPABASE.functions.invoke(CROW_CONFIG.adminFunction,{body:{action:'tables'}});if(r.error)throw r.error;if(!r.data?.ok)throw Error(r.data?.error||'Administrator authorization required.');S.counts=r.data.counts||{};metrics();sync();$('status').textContent='Administrator authenticated · live operations active.'}catch(e){$('status').textContent=e.message||'Admin API error.'}finally{S.busy=false}}async function realtime(){const sb=window.CROW_SUPABASE;if(!sb)return;if(S.channel)try{await sb.removeChannel(S.channel)}catch(_){}let c=sb.channel('podcasting-admin-operations');T.forEach(t=>{c=c.on('postgres_changes',{event:'*',schema:'public',table:t},p=>{add(t,p.eventType||'CHANGE',p.new||p.old||{});counts()})});S.channel=c;await c.subscribe(x=>{if(x==='SUBSCRIBED'){status(true,'REALTIME CONNECTED');monitor()}else if(x==='CHANNEL_ERROR'||x==='TIMED_OUT'){status(false,'REALTIME ERROR')}else if(x==='CLOSED'){status(false,'REALTIME RECONNECTING')}})}async function boot(){if(!window.__CROW_USER){$('status').textContent='Sign in with an administrator account.';status(false,'SIGN IN REQUIRED');return}if(!window.CROW_SUPABASE){status(false,'SUPABASE ERROR');return}filters();monitor();await counts();await realtime();setInterval(()=>{if(!document.hidden)counts()},30000)}$('refresh').onclick=counts;$('clear').onclick=()=>{S.events=[];S.tables.clear();$('session').textContent='0';$('tables').textContent='0';render();monitor()};$('sound').onclick=()=>{S.sound=!S.sound;$('sound').textContent=S.sound?'🔔 Sound ON':'🔕 Sound OFF'};addEventListener('crow:ready',boot,{once:true});setTimeout(()=>{if(window.__CROW_AUTH_READY)boot()},2500);addEventListener('beforeunload',()=>{if(S.channel&&window.CROW_SUPABASE)window.CROW_SUPABASE.removeChannel(S.channel)})})();
</script></body></html>
