<style>
:root{--bg:#05050b;--panel:#0d0f1a;--panel2:#111426;--line:rgba(148,163,184,.16);--text:#f8fafc;--muted:#98a2b3;--cyan:#22d3ee;--purple:#a78bfa;--green:#34d399;--red:#fb7185;--amber:#fbbf24;--shadow:0 24px 80px rgba(0,0,0,.4);--r:20px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(34,211,238,.1),transparent 28%),radial-gradient(circle at 90% 0%,rgba(167,139,250,.11),transparent 30%),linear-gradient(180deg,#05050b,#080a12 50%,#05050b);color:var(--text);font-family:Montserrat,system-ui,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}button,select{font:inherit}.shell{width:min(1440px,calc(100% - 32px));margin:auto}.top{position:sticky;top:0;z-index:50;background:rgba(5,5,11,.84);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.nav{min-height:74px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}.brand img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(34,211,238,.28))}.brand b{font:800 13px Orbitron;letter-spacing:.08em}.brand span{color:var(--cyan)}.links{display:flex;gap:4px;justify-content:center;flex:1}.links a{padding:9px 10px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.1em;border-radius:9px}.links a:hover{background:rgba(255,255,255,.05);color:#fff}.btn{border:1px solid var(--line);background:rgba(255,255,255,.035);color:#fff;border-radius:11px;padding:10px 13px;font-size:10px;font-weight:800;letter-spacing:.08em;cursor:pointer}.btn:hover{border-color:rgba(34,211,238,.45)}.btn.primary{border:0;background:linear-gradient(135deg,#22d3ee,#8b5cf6)}.btn.danger{color:#fecdd3;border-color:rgba(251,113,133,.3)}.btn.good{color:#bbf7d0;border-color:rgba(52,211,153,.3)}.hero{padding:56px 0 25px;display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.eyebrow{font-size:9px;letter-spacing:.2em;color:var(--cyan);font-weight:800}.hero h1{font:800 clamp(38px,6vw,76px)/.95 Orbitron;margin:12px 0 18px;letter-spacing:-.045em}.hero p{max-width:780px;color:var(--muted);font-size:14px;line-height:1.75}.panel{background:linear-gradient(180deg,rgba(17,20,38,.92),rgba(9,11,20,.88));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.pad{padding:20px}.status{padding:22px;display:flex;flex-direction:column;justify-content:space-between}.statusline{display:flex;justify-content:space-between;gap:12px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--green);box-shadow:0 0 16px rgba(52,211,153,.7)}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.metric{padding:17px;min-height:112px}.metric small{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.metric strong{display:block;font:700 28px Orbitron;margin-top:13px}.metric em{display:block;color:var(--muted);font-size:10px;font-style:normal;margin-top:6px}.section{padding:25px 0}.head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}.head h2{margin:0;font:700 20px Orbitron}.head span{color:var(--muted);font-size:9px;letter-spacing:.15em}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:9px;max-height:520px;overflow:auto}.row{display:flex;gap:11px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025)}.main{min-width:0;flex:1}.main b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main small{display:block;color:var(--muted);font-size:9px;line-height:1.5;margin-top:4px}.pill{padding:5px 8px;border:1px solid var(--line);border-radius:999px;font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.live{color:#bbf7d0;border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.07)}.warn{color:#fde68a;border-color:rgba(251,191,36,.3)}.select{background:#0a0d18;color:#fff;border:1px solid var(--line);border-radius:9px;padding:7px;font-size:9px}.empty,.notice{padding:15px;border:1px solid var(--line);border-radius:13px;color:var(--muted);font-size:10px;line-height:1.6}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}.table th{color:var(--muted);font-size:8px;letter-spacing:.12em;text-transform:uppercase}.actions{display:flex;gap:5px;flex-wrap:wrap}.security{color:var(--muted);font-size:10px;line-height:1.7}.security strong{color:#fff}.toast{position:fixed;right:18px;bottom:18px;z-index:100;max-width:420px;padding:13px 15px;background:#111526;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;font-size:11px}.toast.on{opacity:1;transform:none}.gate{min-height:75vh;display:grid;place-items:center}.gate .panel{max-width:620px;padding:40px;text-align:center}.gate h1{font:700 30px Orbitron}.spinner{width:25px;height:25px;border:2px solid rgba(255,255,255,.12);border-top-color:var(--cyan);border-radius:50%;animation:s .8s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}footer{border-top:1px solid var(--line);padding:28px 0;margin-top:30px;text-align:center;color:#687386;font-size:9px;letter-spacing:.14em}
@media(max-width:1100px){.hero,.two,.three{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr)}.links{display:none}}@media(max-width:650px){.shell{width:calc(100% - 20px)}.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:43px}.metric strong{font-size:24px}.user a{display:none}}

<div id="app"><div class="gate"><div class="panel"><div class="spinner"></div><p style="color:var(--muted)">Authenticating operations access…</p></div></div></div><div id="toast" class="toast"></div>
<script>
(()=>{"use strict";
const C=window.CROW_CONFIG||{},S=window.supabase?.createClient?window.supabase.createClient(C.supabaseUrl||"",C.supabaseKey||"",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}}):null;
const $=s=>document.querySelector(s),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),fmt=n=>Number(n||0).toLocaleString(),ago=x=>x?new Date(x).toLocaleString():"—";
let user=null,state={workspace:null,reports:[],comments:[],live:[],launch:0,events:[],audit:[],stats:{follows:0,subscriptions:0,comments:0,saves:0,recommendations:0,followEvents:[],dailyMetrics:[]}};const roles=["admin","super_admin","owner","administrator"];
function toast(x){const e=$("#toast");e.textContent=x;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),3200)}
function isAdmin(u){const r=u?.app_metadata?.roles;return roles.includes(u?.app_metadata?.role)||(Array.isArray(r)&&r.some(x=>roles.includes(x)))}
function logo(){return C.logoUrl||"https://cevylpnoexugwgygvtgu.supabase.co/storage/v1/object/public/images/podcastinglogo.png"}
function nav(){return '<header class="top"><div class="shell nav"><a class="brand" href="home.html"><img src="'+esc(logo())+'"><b>CROWRULES <span>/ PODCASTING</span></b></a><nav class="links"><a href="#overview">OVERVIEW</a><a href="#creators">CREATORS</a><a href="#moderation">MODERATION</a><a href="#publishing">PUBLISHING</a><a href="#live">LIVE OPS</a><a href="#analytics">ANALYTICS</a><a href="#events">EVENTS</a></nav><div class="user"><a href="account.html" class="btn">ACCOUNT</a><button class="btn" id="signout">SIGN OUT</button></div></div></header>'}
async function fn(action,body={}){const r=await S.functions.invoke("crowrules-admin-api",{body:{action,...body}});if(r.error)throw r.error;if(r.data?.ok===false)throw new Error(r.data.error||"Admin API request failed");return r.data}
async function load(){
 state.workspace=await fn("creator_workspace");
 const since30=new Date(Date.now()-29*864e5).toISOString().slice(0,10); const [rep,com,live,launch,events,audit,followCount,subCount,commentCount,saveCount,recommendationCount,followEvents,dailyMetrics]=await Promise.all([
  S.from("podcast_member_reports").select("id,reporter_user_id,reported_user_id,reason,status,admin_notes,created_at,resolved_at,resolved_by"),
  S.from("cr_podcast_social_comments_v5").select("id,user_id,episode_id,body,created_at,updated_at"),
  S.from("cr_podcast_live").select("*").order("is_live",{ascending:false}).order("updated_at",{ascending:false}),
  S.rpc("podcast_launch_interest_count"),
  S.from("podcast_workflow_events").select("id,creator_id,task_id,event_type,message,created_at").order("created_at",{ascending:false}).limit(60),
  S.from("cr_podcast_admin_audit").select("id,admin_user_id,action,entity_type,entity_id,details,created_at").order("created_at",{ascending:false}).limit(60),
  S.from("podcast_follows").select("id",{count:"exact",head:true}),
  S.from("podcast_subscriptions").select("id",{count:"exact",head:true}).eq("status","active"),
  S.from("cr_podcast_social_comments_v5").select("id",{count:"exact",head:true}),
  S.from("podcast_user_saved_episodes").select("id",{count:"exact",head:true}),
  S.from("podcast_recommendation_events").select("id",{count:"exact",head:true}), S.from("podcast_follows").select("podcast_id,created_at").gte("created_at",since30+"T00:00:00Z").order("created_at",{ascending:true}).limit(10000), S.from("podcast_recommendation_daily_metrics").select("metric_date,episode_id,podcast_id,creator_id,impressions,plays,progresses,completes,skips,saves,follows,seconds").gte("metric_date",since30).order("metric_date",{ascending:true}).limit(20000)
 ]);
 state.reports=rep.data||[];state.comments=com.data||[];state.live=live.data||[];state.launch=Number(launch.data||0);state.events=events.data||[];state.audit=audit.data||[];
 state.stats={follows:followCount.count||0,subscriptions:subCount.count||0,comments:commentCount.count||0,saves:saveCount.count||0,recommendations:recommendationCount.count||0,followEvents:followEvents.data||[],dailyMetrics:dailyMetrics.data||[]};
 render();
}
function render(){
 const w=state.workspace||{},ms=w.members||[],cs=w.creators||[],orphan=w.orphaned_podcasts||[],allPods=cs.flatMap(c=>c.podcasts||[]),allEps=allPods.flatMap(p=>p.episodes||[]),open=state.reports.filter(x=>!["resolved","dismissed"].includes(String(x.status||"").toLowerCase())),live=state.live.filter(x=>x.is_live);
 $("#app").innerHTML=nav()+`
 <main class="shell">
 <section class="hero" id="overview"><div><div class="eyebrow">CROWRULES PODCASTING • OPERATIONS CENTER</div><h1>RUN THE<br>PODCAST<br>UNIVERSE.</h1><p>Creator management, member administration, moderation, publishing operations, live network control, launch intelligence and system event monitoring — in one protected command center.</p><div class="toolbar"><button class="btn primary" id="refresh">REFRESH ALL</button><a class="btn" href="creator/studio.html">CREATOR STUDIO</a><a class="btn" href="creator/live-admin.html">LIVE CONSOLE</a><a class="btn" href="launch.html">LAUNCH CENTER</a></div></div>
 <div class="panel status"><div class="statusline"><div><div class="eyebrow">CONTROL PLANE</div><h2 style="font:700 20px Orbitron;margin:9px 0">Admin Online</h2></div><span><i class="dot"></i> <b>SECURE</b></span></div><div style="border-top:1px solid var(--line);padding-top:17px;margin-top:25px"><small style="color:var(--muted)">SIGNED-IN OPERATOR</small><strong style="display:block;margin-top:6px;word-break:break-word">${esc(user.email||user.id)</strong><small style="display:block;color:var(--muted);margin-top:6px">Auth role: ${esc(user.app_metadata?.role||"admin")</small></div></div></section>
 <section class="grid">
 <div class="panel metric"><small>Members</small><strong>${fmt(ms.length)</strong><em>Directory accounts</em></div><div class="panel metric"><small>Creators</small><strong>${fmt(cs.length)</strong><em>Creator workspace</em></div><div class="panel metric"><small>Podcasts</small><strong>${fmt(w.podcast_count)</strong><em>Show catalog</em></div><div class="panel metric"><small>Episodes</small><strong>${fmt(allEps.length)</strong><em>Episode inventory</em></div><div class="panel metric"><small>Live Now</small><strong>${fmt(live.length)</strong><em>Active broadcasts</em></div><div class="panel metric"><small>Launch Interest</small><strong>${fmt(state.launch)</strong><em>Pre-launch signals</em></div>
 </section>
 <section class="section" id="stats"><div class="head"><h2>Audience & Content Statistics</h2><span>LIVE CATALOG SIGNALS</span></div><div class="grid">
 <div class="panel metric"><small>Total Episode Plays</small><strong>${fmt(allEps.reduce((n,e)=>n+Number(e.play_count||0),0))}</strong><em>Across catalog</em></div>
 <div class="panel metric"><small>Published Episodes</small><strong>${fmt(allEps.filter(e=>String(e.status||"").toLowerCase()==="published").length)}</strong><em>Public inventory</em></div>
 <div class="panel metric"><small>Draft Episodes</small><strong>${fmt(allEps.filter(e=>["draft","review","pending_review"].includes(String(e.status||"").toLowerCase())).length)}</strong><em>In production</em></div>
 <div class="panel metric"><small>Scheduled Episodes</small><strong>${fmt(allEps.filter(e=>String(e.status||"").toLowerCase()==="scheduled").length)}</strong><em>Queued releases</em></div>
 <div class="panel metric"><small>Podcast Follows</small><strong>${fmt(state.stats.follows)}</strong><em>Audience relationships</em></div>
 <div class="panel metric"><small>Active Subscriptions</small><strong>${fmt(state.stats.subscriptions)}</strong><em>Current plans</em></div>
 <div class="panel metric"><small>Comments</small><strong>${fmt(state.stats.comments)}</strong><em>Community activity</em></div>
 <div class="panel metric"><small>Saved Episodes</small><strong>${fmt(state.stats.saves)}</strong><em>Listener library</em></div>
 <div class="panel metric"><small>Recommendation Events</small><strong>${fmt(state.stats.recommendations)}</strong><em>Discovery signals</em></div>
 <div class="panel metric"><small>Open Reports</small><strong>${fmt(open.length)}</strong><em>Moderation workload</em></div>
 <div class="panel metric"><small>Avg Plays / Episode</small><strong>${fmt(allEps.length?Math.round(allEps.reduce((n,e)=>n+Number(e.play_count||0),0)/allEps.length):0)}</strong><em>Catalog average</em></div>
 <div class="panel metric"><small>Live Audience</small><strong id="liveAudienceTotal">0</strong><em>Realtime connections</em></div>
 </div><div class="notice" style="margin-top:12px"><strong>Stats boundary:</strong> catalog metrics are derived from records already loaded into the Operations Center. Audience relationships use the existing Podcasting tables and their current RLS policies; blocked reads are surfaced rather than bypassed.</div></section>
 <section class="section" id="creators"><div class="head"><h2>Creator & User Management</h2><span>IDENTITY • ROLES • CATALOG</span></div><div class="panel pad"><div class="tablewrap"><table class="table"><thead><tr><th>Member</th><th>Role</th><th>Status</th><th>Creator</th><th>Shows</th><th>Episodes</th><th>Published</th><th>Action</th></tr></thead><tbody>
 ${cs.slice(0,80).map(c=>{const m=c.member||{};return '<tr><td><b>'+esc(c.display_name||c.name||"Creator")+'</b><br><span style="color:var(--muted)">'+esc(m.email||c.account_email||"No email")+'</span></td><td>'+esc(m.role||c.account_role||"—")+'</td><td>'+esc(m.status||c.account_status||"—")+'</td><td>'+esc(c.discipline||c.role||"Creator")+'</td><td>'+fmt(c.podcast_count)+'</td><td>'+fmt(c.episode_count)+'</td><td>'+fmt(c.published_episode_count)+'</td><td><div class="actions">'+(m.id?'<select class="select roleSelect" data-mid="'+esc(m.id)+'"><option value="Member" '+(String(m.role||"").toLowerCase()==="member"?"selected":"")+'">Member</option><option value="Creator" '+(String(m.role||"").toLowerCase()==="creator"?"selected":"")+'">Creator</option><option value="Moderator" '+(String(m.role||"").toLowerCase()==="moderator"?"selected":"")+'">Moderator</option><option value="Admin" '+(String(m.role||"").toLowerCase()==="admin"?"selected":"")+'">Admin</option></select><button class="btn roleBtn" data-mid="'+esc(m.id)+'">SAVE ROLE</button>':"—")+'</div></td></tr>'}).join("")||'<tr><td colspan="8" class="empty">No creator records returned.</td></tr>'
 </tbody></table></div><div class="notice" style="margin-top:12px"><strong>Role changes:</strong> the existing <code>crowrules-admin-api</code> server function performs privileged role synchronization. Only owner/super_admin operators can change administrator roles. Browser metadata is never the write authority.</div></div></section>
 <section class="section two" id="moderation"><div class="panel pad"><div class="head"><h2>Moderation Queue</h2><span>${fmt(open.length) OPEN REPORTS</span></div><div class="list">
 ${open.slice(0,40).map(r=>'<div class="row"><div class="main"><b>'+esc(r.reason||"Community report")+'</b><small>Reporter '+esc(r.reporter_user_id||"—")+' → '+esc(r.reported_user_id||"—")+' • '+ago(r.created_at)+'</small></div><span class="pill warn">'+esc(r.status||"open")+'</span><select class="select reportSelect" data-id="'+esc(r.id)+'"><option>open</option><option>reviewing</option><option>resolved</option><option>dismissed</option></select><button class="btn reportBtn" data-id="'+esc(r.id)+'">APPLY</button></div>').join("")||'<div class="empty">No open reports returned.</div>'
 </div></div><div class="panel pad"><div class="head"><h2>Recent Comments</h2><span>COMMUNITY SIGNAL</span></div><div class="list">
 ${state.comments.slice(0,40).map(c=>'<div class="row"><div class="main"><b>'+esc(c.body||"Comment")+'</b><small>User '+esc(c.user_id||"—")+' • Episode '+esc(c.episode_id||"—")+' • '+ago(c.created_at)+'</small></div></div>').join("")||'<div class="empty">No comments returned or RLS is blocking this administrative read.</div>'
 </div></div></section>
 <section class="section" id="publishing"><div class="head"><h2>Podcast & Episode Publishing Control</h2><span>SERVER-AUTHORIZED WRITES</span></div><div class="panel pad"><div class="tablewrap"><table class="table"><thead><tr><th>Episode</th><th>Podcast</th><th>Status</th><th>Scheduled</th><th>Plays</th><th>Controls</th></tr></thead><tbody>
 ${allEps.slice(0,100).map(e=>'<tr><td><b>'+esc(e.title||"Untitled")+'</b><br><span style="color:var(--muted)">'+esc(e.id)+'</span></td><td>'+esc((allPods.find(p=>p.id===e.podcast_id)||{}).title||e.podcast_id||"—")+'</td><td><span class="pill">'+esc(e.status||"—")+'</span></td><td>'+ago(e.scheduled_at)+'</td><td>'+fmt(e.play_count)+'</td><td><div class="actions"><button class="btn good epBtn" data-id="'+esc(e.id)+'" data-status="published">PUBLISH</button><button class="btn epBtn" data-id="'+esc(e.id)+'" data-status="draft">DRAFT</button><button class="btn epBtn" data-id="'+esc(e.id)+'" data-status="archived">ARCHIVE</button></div></td></tr>').join("")||'<tr><td colspan="6" class="empty">No episodes returned.</td></tr>'
 </tbody></table></div><div class="notice" style="margin-top:12px"><strong>Publishing boundary:</strong> episode status writes go through the existing protected <code>crowrules-admin-api</code> and are audited. No service-role key is exposed to the browser.</div></div></section>
 <section class="section" id="live"><div class="head"><h2>Live Broadcast Control</h2><span>REALTIME NETWORK</span></div><div class="panel pad"><div class="list">
 ${state.live.map(x=>'<div class="row"><div class="main"><b>'+esc(x.title||x.show_name||"Untitled broadcast")+'</b><small>'+esc(x.show_name||"CrowRules Podcasting")+' • '+fmt(x.listener_count)+' listeners • updated '+ago(x.updated_at)+'</small></div><span class="pill '+(x.is_live?"live":"")+'">'+(x.is_live?"LIVE":"OFFLINE")+'</span><div class="actions">'+(x.is_live?'<button class="btn danger liveBtn" data-id="'+esc(x.id)+'" data-live="false">END LIVE</button>':'<button class="btn good liveBtn" data-id="'+esc(x.id)+'" data-live="true">START LIVE</button>')+'</div></div>').join("")||'<div class="empty">No live records returned.</div>'
 </div><div class="notice" style="margin-top:12px"><strong>Transport note:</strong> these controls change the CrowRules live-state record. They do not create a missing ingest/provider connection; use Live Console for transport setup.</div></div></section>
 <section class="section" id="analytics"><div class="head"><h2>Analytics Command Center</h2><span>24H • 7D • 30D • REALTIME</span></div><div class="grid" id="analyticsMetrics"><div class="panel metric"><small>24H Plays</small><strong>—</strong><em>Last 24 hours</em></div><div class="panel metric"><small>7D Plays</small><strong>—</strong><em>Last 7 days</em></div><div class="panel metric"><small>30D Plays</small><strong>—</strong><em>Last 30 days</em></div><div class="panel metric"><small>30D Listening Hours</small><strong>—</strong><em>Tracked seconds</em></div><div class="panel metric"><small>30D Completion Rate</small><strong>—</strong><em>Completes ÷ plays</em></div><div class="panel metric"><small>30D Follows</small><strong>—</strong><em>New follows</em></div></div><div class="two" style="margin-top:14px"><div class="panel pad"><div class="head"><h2>Plays Over Time</h2><span>30 DAYS</span></div><div id="playsTrend" class="list"></div></div><div class="panel pad"><div class="head"><h2>Follows Over Time</h2><span>30 DAYS</span></div><div id="followsTrend" class="list"></div></div></div><div class="three" style="margin-top:14px"><div class="panel pad"><div class="head"><h2>Top Podcasts</h2><span>30D PLAYS</span></div><div id="topPodcasts" class="list"></div></div><div class="panel pad"><div class="head"><h2>Top Episodes</h2><span>30D PLAYS</span></div><div id="topEpisodes" class="list"></div></div><div class="panel pad"><div class="head"><h2>Top Creators</h2><span>30D PLAYS</span></div><div id="topCreators" class="list"></div></div></div><div class="panel pad" style="margin-top:14px"><div class="head"><h2>Listener vs Creator Traffic</h2><span>REALTIME PRESENCE</span></div><div class="grid"><div class="panel metric"><small>Listener</small><strong id="analyticsListenerTraffic">0</strong><em>Active connections</em></div><div class="panel metric"><small>Creator</small><strong id="analyticsCreatorTraffic">0</strong><em>Active connections</em></div><div class="panel metric"><small>Launch</small><strong id="analyticsLaunchTraffic">0</strong><em>Active connections</em></div><div class="panel metric"><small>Listener Share</small><strong id="analyticsTrafficMix">0%</strong><em>Of active Podcasting audience</em></div></div></div><div class="notice" style="margin-top:12px"><strong>Analytics boundary:</strong> historical analytics use the existing daily metrics and follow-event tables under their current RLS policies. No new table, service-role key, or privileged browser access was added.</div><div class="three" style="margin-top:14px"><div class="panel pad"><div class="head"><h2>Launch Intelligence</h2><span>JAN 1, 2027</span></div><div style="font:700 46px Orbitron;margin:12px 0">${fmt(state.launch)}</div><div class="notice">Current launch-interest count from the existing <code>podcast_launch_interest_count()</code> RPC.</div></div><div class="panel pad"><div class="head"><h2>Pipeline Health</h2><span>CREATOR OPS</span></div><div class="list">${cs.slice(0,12).map(c=>'<div class="row"><div class="main"><b>'+esc(c.display_name||c.name||"Creator")+'</b><small>'+fmt(c.podcast_count)+' shows • '+fmt(c.published_episode_count)+' published • '+fmt(c.draft_episode_count)+' draft</small></div><span class="pill '+(String(c.account_status).toLowerCase()==="active"?"live":"")+'">'+esc(c.account_status||"—")+'</span></div>').join("")||'<div class="empty">No creator health rows.</div>'}</div></div><div class="panel pad"><div class="head"><h2>Catalog Integrity</h2><span>DATA QUALITY</span></div><div class="list"><div class="row"><div class="main"><b>Orphaned podcasts</b><small>Shows without a valid creator relationship.</small></div><strong>${fmt(orphan.length)}</strong></div><div class="row"><div class="main"><b>Episodes awaiting publish</b><small>Draft/review/scheduled lifecycle inventory.</small></div><strong>${fmt(allEps.filter(e=>["draft","review","pending_review","scheduled"].includes(String(e.status||"").toLowerCase())).length)}</strong></div><div class="row"><div class="main"><b>Open moderation reports</b><small>Community reports requiring review.</small></div><strong>${fmt(open.length)}</strong></div></div></div></div></section><section class="section two" id="events"><div class="panel pad"><div class="head"><h2>System Event Monitor</h2><span>WORKFLOW EVENTS</span></div><div class="list">
 ${state.events.slice(0,40).map(x=>'<div class="row"><div class="main"><b>'+esc(x.event_type||"event")+'</b><small>'+esc(x.message||"")+' • creator '+esc(x.creator_id||"—")+' • '+ago(x.created_at)+'</small></div></div>').join("")||'<div class="empty">No workflow events returned.</div>'
 </div></div><div class="panel pad"><div class="head"><h2>Admin Audit Trail</h2><span>PRIVILEGED ACTIONS</span></div><div class="list">
 ${state.audit.slice(0,40).map(x=>'<div class="row"><div class="main"><b>'+esc(x.action||"admin action")+'</b><small>'+esc(x.entity_type||"")+' '+esc(x.entity_id||"")+' • '+ago(x.created_at)+'</small></div></div>').join("")||'<div class="empty">No admin audit records returned.</div>'
 </div></div></section>
 <section class="section panel pad"><div class="head"><h2>Operations Security Boundary</h2><span>NO SERVICE ROLE IN BROWSER</span></div><div class="security"><strong>Protected architecture:</strong> the browser authenticates the current operator with <code>auth.getUser()</code>, then uses the existing authenticated <code>crowrules-admin-api</code> Edge Function for privileged catalog and role operations. Direct moderation/live reads and writes remain subject to the project's existing RLS policies; if a table intentionally blocks browser access, the UI reports that instead of bypassing RLS.</div></section>
 </main><footer>CROWRULES PODCASTING • OPERATIONS CENTER • ONE COMPANY. ONE UNIVERSE. • PRE-LAUNCH: JANUARY 1, 2027</footer>`;
 bind();
}
function renderAnalytics(allPods,allEps,cs){
 const m=state.stats.dailyMetrics||[], f=state.stats.followEvents||[], now=Date.now();
 const byDate={};m.forEach(x=>{const k=String(x.metric_date).slice(0,10);if(!byDate[k])byDate[k]={plays:0,seconds:0,completes:0};byDate[k].plays+=Number(x.plays||0);byDate[k].seconds+=Number(x.seconds||0);byDate[k].completes+=Number(x.completes||0)});
 const dates=Object.keys(byDate).sort(),cut24=new Date(now-24*36e5).toISOString().slice(0,10),cut7=new Date(now-7*864e5).toISOString().slice(0,10);
 const agg=ds=>ds.reduce((a,d)=>({plays:a.plays+byDate[d].plays,seconds:a.seconds+byDate[d].seconds,completes:a.completes+byDate[d].completes}),{plays:0,seconds:0,completes:0});
 const a24=agg(dates.filter(d=>d>=cut24)),a7=agg(dates.filter(d=>d>=cut7)),a30=agg(dates),follows30=f.filter(x=>new Date(x.created_at).getTime()>=now-30*864e5).length;
 const metric=(l,v,n)=>'<div class="panel metric"><small>'+l+'</small><strong>'+v+'</strong><em>'+n+'</em></div>';const box=$("#analyticsMetrics");if(box)box.innerHTML=[metric("24H Plays",fmt(a24.plays),"Last 24 hours"),metric("7D Plays",fmt(a7.plays),"Last 7 days"),metric("30D Plays",fmt(a30.plays),"Last 30 days"),metric("30D Listening Hours",(a30.seconds/3600).toFixed(1),"Tracked seconds"),metric("30D Completion Rate",(a30.plays?a30.completes/a30.plays*100:0).toFixed(1)+"%","Completes ÷ plays"),metric("30D Follows",fmt(follows30),"New follows")].join("");
 const row=(label,value)=>'<div class="row"><div class="main"><b>'+esc(label)+'</b></div><strong>'+fmt(value)+'</strong></div>';const p=$("#playsTrend"),ft=$("#followsTrend");if(p)p.innerHTML=dates.slice(-30).map(d=>row(new Date(d+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}),byDate[d].plays)).join("")||'<div class="empty">No daily analytics returned.</div>';const fBy={};f.forEach(x=>{const k=new Date(x.created_at).toISOString().slice(0,10);fBy[k]=(fBy[k]||0)+1});if(ft)ft.innerHTML=dates.slice(-30).map(d=>row(new Date(d+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}),fBy[d]||0)).join("")||'<div class="empty">No follow history returned.</div>';
 const names={},eps={},creators={};allPods.forEach(p=>names[p.id]=p.title||"Untitled podcast");allEps.forEach(e=>eps[e.id]=e.title||"Untitled episode");cs.forEach(x=>creators[x.id]=x.display_name||x.name||"Creator");const pod={},ep={},cr={};m.forEach(x=>{const n=Number(x.plays||0);if(!n)return;pod[x.podcast_id||"unknown"]=(pod[x.podcast_id||"unknown"]||0)+n;ep[x.episode_id]=(ep[x.episode_id]||0)+n;cr[x.creator_id||"unknown"]=(cr[x.creator_id||"unknown"]||0)+n});const top=(id,map,label)=>{const e=$(id),arr=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,10);if(e)e.innerHTML=arr.map((x,i)=>'<div class="row"><span class="pill">'+(i+1)+'</span><div class="main"><b>'+esc(label(x[0]))+'</b><small>30-day plays</small></div><strong>'+fmt(x[1])+'</strong></div>').join("")||'<div class="empty">No 30-day play data returned.</div>'};top("#topPodcasts",pod,k=>names[k]||k);top("#topEpisodes",ep,k=>eps[k]||k);top("#topCreators",cr,k=>creators[k]||k);
}
function mountAudiencePresence(){
 const key="ops-"+(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));
 const channels={
  listener:S.channel("crowrules-podcasting-visitors-listener",{config:{presence:{key}}}),
  creator:S.channel("crowrules-podcasting-visitors-creator",{config:{presence:{key}}}),
  launch:S.channel("crowrules-podcasting-visitors-launch",{config:{presence:{key}}}),
  all:S.channel("crowrules-podcasting-visitors-all",{config:{presence:{key}}})
 };
 const count=ch=>Object.values(ch.presenceState()).reduce((n,v)=>n+(Array.isArray(v)?v.length:0),0);
 const paint=()=>{const x={listener:count(channels.listener),creator:count(channels.creator),launch:count(channels.launch),all:count(channels.all)};const total=x.all||x.listener+x.creator+x.launch;$("#liveListenerVisitors").textContent=fmt(x.listener);$("#liveCreatorVisitors").textContent=fmt(x.creator);$("#analyticsListenerTraffic")&&($("#analyticsListenerTraffic").textContent=fmt(x.listener));$("#analyticsCreatorTraffic")&&($("#analyticsCreatorTraffic").textContent=fmt(x.creator));$("#analyticsLaunchTraffic")&&($("#analyticsLaunchTraffic").textContent=fmt(x.launch));const mix=total?Math.round(x.listener/total*100):0;$("#analyticsTrafficMix")&&($("#analyticsTrafficMix").textContent=mix+"%");$("#liveLaunchVisitors").textContent=fmt(x.launch);$("#liveAudienceTotal").textContent=fmt(total);$("#liveAudienceUpdated").textContent="Last synced "+new Date().toLocaleTimeString();$("#liveAudienceStatus").textContent=total?"Live audience telemetry connected.":"Live audience telemetry connected — no active visitors detected.";};
 Object.values(channels).forEach(ch=>ch.on("presence",{event:"sync"},paint).on("presence",{event:"join"},paint).on("presence",{event:"leave"},paint).subscribe());
 paint();
}
function bind(){
 $("#signout").onclick=async()=>{await S.auth.signOut();location.href="home.html"};
 $("#refresh").onclick=async()=>{try{await load();toast("Operations Center refreshed.")}catch(e){toast(e.message)}};
 document.querySelectorAll(".roleSelect").forEach(s=>{const cell=s.closest("tr")?.children?.[1];if(cell&&["Member","Creator","Moderator","Admin"].includes(cell.textContent.trim()))s.value=cell.textContent.trim()});
 document.querySelectorAll(".roleBtn").forEach(b=>b.onclick=async()=>{const id=b.dataset.mid,s=document.querySelector('.roleSelect[data-mid="'+id+'"]');try{await fn("set_member_role",{member_id:id,role:s.value});toast("Member role synchronized.");await load()}catch(e){toast(e.message)}});
 document.querySelectorAll(".epBtn").forEach(b=>b.onclick=async()=>{try{await fn("update",{table:"podcast_episodes",filters:{id:b.dataset.id},data:{status:b.dataset.status,updated_at:new Date().toISOString(),published_at:b.dataset.status==="published"?new Date().toISOString():null}});toast("Episode status updated.");await load()}catch(e){toast(e.message)}});
 document.querySelectorAll(".reportBtn").forEach(b=>b.onclick=async()=>{const s=document.querySelector('.reportSelect[data-id="'+b.dataset.id+'"]');try{const r=await fn("update",{table:"podcast_member_reports",filters:{id:b.dataset.id},data:{status:s.value,resolved_at:["resolved","dismissed"].includes(s.value)?new Date().toISOString():null,resolved_by:["resolved","dismissed"].includes(s.value)?user.id:null}});if(r?.ok===false)throw new Error(r.error||"Moderation update failed");toast("Moderation report updated.");await load()}catch(e){toast("Moderation write blocked: "+e.message)}});
 document.querySelectorAll(".liveBtn").forEach(b=>b.onclick=async()=>{try{const live=b.dataset.live==="true",patch=live?{is_live:true,started_at:new Date().toISOString(),ended_at:null,updated_at:new Date().toISOString()}:{is_live:false,ended_at:new Date().toISOString(),updated_at:new Date().toISOString()};const r=await fn("update",{table:"cr_podcast_live",filters:{id:b.dataset.id},data:patch});if(r?.ok===false)throw new Error(r.error||"Live control failed");toast(live?"Broadcast marked LIVE.":"Broadcast marked OFFLINE.");await load()}catch(e){toast("Live control blocked: "+e.message)}});
}
async function realtime(){const c=S.channel("crowrules-ops-center");c.on("postgres_changes",{event:"*",schema:"public",table:"cr_podcast_live"},()=>load().catch(()=>{}));c.on("postgres_changes",{event:"*",schema:"public",table:"podcast_episodes"},()=>load().catch(()=>{}));c.on("postgres_changes",{event:"*",schema:"public",table:"podcast_member_reports"},()=>load().catch(()=>{}));c.subscribe()}
async function boot(){
 if(!S){
  $("#app").innerHTML='<div class="gate"><div class="panel"><h1>AUTH CONFIGURATION ERROR</h1><p style="color:var(--muted)">Supabase configuration is missing from this Operations Center.</p><a class="btn" href="home.html">RETURN HOME</a></div></div>';
  return;
 }
 try{
  const sessionResult=await Promise.race([
   S.auth.getSession(),
   new Promise((_,reject)=>setTimeout(()=>reject(new Error("Authentication service timed out. Please refresh and try again.")),10000))
  ]);
  if(sessionResult.error)throw sessionResult.error;
  if(!sessionResult.data?.session){
   $("#app").innerHTML='<div class="gate"><div class="panel"><div class="eyebrow">CROWRULES PODCASTING</div><h1>ADMIN SIGN-IN REQUIRED</h1><p style="color:var(--muted)">Sign in with an account that has a trusted administrator role.</p><a class="btn primary" href="login.html">SIGN IN</a></div></div>';
   return;
  }
  const userResult=await Promise.race([
   S.auth.getUser(),
   new Promise((_,reject)=>setTimeout(()=>reject(new Error("Could not verify the signed-in operator with Supabase Auth.")),10000))
  ]);
  if(userResult.error||!userResult.data?.user)throw userResult.error||new Error("No authenticated operator found.");
  user=userResult.data.user;
  if(!isAdmin(user)){
   $("#app").innerHTML='<div class="gate"><div class="panel"><div class="eyebrow">ACCESS CONTROL</div><h1>ACCESS DENIED</h1><p style="color:var(--muted);line-height:1.7">This account is authenticated but is not marked as an administrator. Administrator status must come from trusted app metadata/server configuration.</p><a class="btn" href="home.html">RETURN HOME</a></div></div>';
   return;
  }
  try{await load();await realtime();mountAudiencePresence()}catch(e){
   $("#app").innerHTML='<div class="gate"><div class="panel"><h1>OPERATIONS LOAD FAILED</h1><p style="color:var(--muted)">'+esc(e.message)+'</p><button class="btn primary" onclick="location.reload()">RETRY</button></div></div>';
  }
  S.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT")location.href="home.html"});
 }catch(e){
  $("#app").innerHTML='<div class="gate"><div class="panel"><div class="eyebrow">CROWRULES PODCASTING</div><h1>AUTHENTICATION FAILED</h1><p style="color:var(--muted);line-height:1.7">'+esc(e.message||"Unable to verify the current session.")+'</p><div class="toolbar" style="justify-content:center"><a class="btn primary" href="login.html">SIGN IN AGAIN</a><button class="btn" onclick="location.reload()">RETRY</button></div></div></div>';
 }
}
boot();
