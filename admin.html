<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcasting Admin — CrowRules</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">ADMIN COMMAND CENTER</div><h1>Podcasting <span class="gradient">control.</span></h1><div id="status" class="notice">Administrator authorization required.</div><div id="metrics" class="grid" style="margin-top:18px"></div></main><script>addEventListener("crow:ready",async()=>{if(!__CROW_USER){status.textContent="Sign in with an administrator account.";return}const r=await CROW_SUPABASE.functions.invoke(CROW_CONFIG.adminFunction,{body:{action:"tables"}});if(r.error){status.textContent=r.error.message;return}if(!r.data?.ok){status.textContent=r.data?.error||"Administrator authorization required.";return}status.textContent="Authenticated administrator. Metrics come from the protected Admin API.";const names=["podcasts","podcast_episodes","podcast_follows","podcast_listens","podcast_subscriptions","membership_plans"];metrics.innerHTML=names.map(n=>'<div class="card"><div class="stat">'+(r.data.counts?.[n]??"—")+'</div><p>'+n.replaceAll("_"," ")+'</p></div>').join("")});</script></body></html>
