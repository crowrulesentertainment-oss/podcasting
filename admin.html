<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcasting Admin</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script><link rel="stylesheet" href="css/podcasting-v8.css?v=20261007-v8.0.0"><script src="js/podcasting-v8.js?v=20261007-v8.0.0" defer></script></head><body><div id="cr-app" data-cr-shell="crowrules-podcasting-sitewide-v7"></div><main class="page"><div class="form-wrap"><span class="eyebrow">CONTROL ROOM</span><h1 class="dash-title">Podcasting Admin</h1><div class="panel"><div class="field"><label>HOLIDAY THEME</label><select id="theme"><option>standard</option><option>halloween</option><option>christmas</option><option>thanksgiving</option><option>newyear</option><option>valentines</option><option>spring</option></select></div><div class="field"><label><input id="enabled" type="checkbox" checked> ENABLE REALISTIC HOLIDAY THEMES</label></div><button class="btn primary" id="save">SAVE THEME</button><div id="msg" class="status"></div></div></div></main><script>addEventListener('load',async()=>{const{data:{user}}=await CROW_PODCASTING.auth.getUser();if(!user)return location.href='login.html';const{data:admin}=await CROW_PODCASTING.from('crp_admins').select('role').eq('user_id',user.id).maybeSingle();if(!admin)return document.querySelector('.form-wrap').innerHTML='<div class="panel"><h2>Access denied</h2><p class="status">Podcasting administrators only.</p></div>';const{data:s}=await CROW_PODCASTING.from('crp_site_settings').select('*').eq('site_key','podcasting').maybeSingle();if(s){theme.value=s.holiday_theme;enabled.checked=s.holiday_enabled}save.onclick=async()=>{const{error}=await CROW_PODCASTING.from('crp_site_settings').update({holiday_theme:theme.value,holiday_enabled:enabled.checked,updated_at:new Date().toISOString()}).eq('site_key','podcasting');msg.textContent=error?.message||'Theme saved.'}})</script><div id="cr-player" data-cr-player="crowrules-podcasting-sitewide-v7"></div></body></html>
