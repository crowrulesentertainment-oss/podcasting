<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05050b">
<title>Admin Command Center • CrowRules Podcasting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--bg:#05050b;--panel:rgba(12,13,25,.82);--line:rgba(148,163,184,.16);--text:#f7f7fb;--muted:#9aa3b5;--cyan:#22d3ee;--purple:#a78bfa;--green:#34d399;--red:#fb7185;--shadow:0 24px 80px rgba(0,0,0,.38);--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% 0%,rgba(34,211,238,.11),transparent 28%),radial-gradient(circle at 85% 8%,rgba(167,139,250,.12),transparent 30%),linear-gradient(180deg,#05050b 0%,#090a12 52%,#05050b 100%);color:var(--text);font-family:Montserrat,system-ui,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.shell{width:min(1380px,calc(100% - 36px));margin:auto}.topbar{position:sticky;top:0;z-index:50;background:rgba(5,5,11,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.nav{min-height:78px;display:flex;align-items:center;gap:22px}.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}.brand img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(34,211,238,.3))}.brand b{font-family:Orbitron;letter-spacing:.08em;font-size:14px}.brand span{color:var(--cyan)}.links{display:flex;gap:8px;flex:1;justify-content:center}.links a,.user a{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted);padding:10px 12px;border-radius:10px}.links a:hover,.user a:hover{color:var(--text);background:rgba(255,255,255,.05)}.user{display:flex;align-items:center;gap:6px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text);border-radius:12px;padding:11px 15px;font-weight:800;font-size:11px;letter-spacing:.08em;transition:.2s}.btn:hover{transform:translateY(-1px);border-color:rgba(34,211,238,.45)}.btn.primary{border:0;background:linear-gradient(135deg,#22d3ee,#8b5cf6);box-shadow:0 10px 30px rgba(34,211,238,.16)}.btn.small{padding:8px 10px;font-size:10px}.hero{padding:68px 0 32px;display:grid;grid-template-columns:1.35fr .65fr;gap:26px;align-items:stretch}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--cyan);font-weight:800;text-transform:uppercase}.hero h1{font:800 clamp(38px,6vw,78px)/.94 Orbitron;margin:13px 0 18px;letter-spacing:-.04em}.hero p{max-width:760px;color:var(--muted);line-height:1.75;font-size:15px}.panel{background:linear-gradient(180deg,rgba(18,19,35,.9),rgba(9,10,18,.82));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.status-card{padding:24px;display:flex;flex-direction:column;justify-content:space-between}.status-top{display:flex;justify-content:space-between;align-items:center;gap:15px}.status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--green);box-shadow:0 0 18px rgba(52,211,153,.75);margin-right:8px}.status-dot.off{background:var(--red);box-shadow:0 0 18px rgba(251,113,133,.55)}.identity{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}.identity strong{display:block;margin-top:6px;word-break:break-word}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.metric{padding:20px;min-height:128px}.metric small{color:var(--muted);font-size:10px;letter-spacing:.14em;font-weight:800;text-transform:uppercase}.metric strong{display:block;font:700 34px Orbitron;margin-top:15px}.metric em{display:block;color:var(--muted);font-style:normal;font-size:11px;margin-top:7px}.section{padding:28px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}.section-head h2{font:700 22px Orbitron;margin:0}.section-head span{color:var(--muted);font-size:10px;letter-spacing:.16em}.two{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.pad{padding:22px}.list{display:grid;gap:10px}.row{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:14px}.row-main{min-width:0;flex:1}.row-main b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-main small{display:block;color:var(--muted);margin-top:5px;font-size:10px;line-height:1.5}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.pill.live{color:#a7f3d0;border-color:rgba(52,211,153,.28);background:rgba(52,211,153,.08)}.pill.off{color:#cbd5e1}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick a{padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.quick b{display:block;font-size:12px}.quick small{display:block;color:var(--muted);margin-top:6px;line-height:1.5}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.notice{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--muted);font-size:11px;line-height:1.6}.notice strong{color:var(--text)}.log{max-height:310px;overflow:auto}.log .row{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px}.check{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.check:last-child{border-bottom:0}.check b{font-size:11px}.check small{color:var(--muted);display:block;margin-top:4px}.ok{color:var(--green)}.bad{color:var(--red)}.footer{border-top:1px solid var(--line);margin-top:50px;padding:28px 0;color:#687386;font-size:10px;letter-spacing:.12em;text-align:center}.toast{position:fixed;right:20px;bottom:20px;z-index:100;max-width:420px;padding:14px 16px;border-radius:14px;background:#101321;border:1px solid var(--line);box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;font-size:12px}.toast.on{opacity:1;transform:none}.gate{min-height:70vh;display:grid;place-items:center}.gate .panel{width:min(620px,100%);padding:38px;text-align:center}.gate h1{font:700 32px Orbitron}.spinner{width:24px;height:24px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:1000px){.hero,.two{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.links{display:none}}@media(max-width:620px){.shell{width:min(100% - 24px,1380px)}.nav{min-height:68px}.brand img{width:44px;height:44px}.brand b{font-size:11px}.user a:not(.btn){display:none}.hero{padding-top:42px}.grid{grid-template-columns:1fr}.quick{grid-template-columns:1fr}.hero h1{font-size:42px}.status-card{min-height:220px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="gate"><div class="panel"><div class="spinner"></div><p style="color:var(--muted)">Authenticating administrator…</p></div></div></div>
<script>
(()=>{"use strict";
const C=window.CROW_CONFIG||{};
const S=window.supabase?.createClient?window.supabase.createClient(C.supabaseUrl||"",C.supabaseKey||""):null;
const $=s=>document.querySelector(s);
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const fmt=n=>Number(n||0).toLocaleString();
const time=x=>x?new Date(x).toLocaleString():"—";
let user=null,channel=null,logItems=[];
const adminRoles=["admin","super_admin","owner","administrator"];
function log(message,type="INFO"){logItems.unshift({message,type,at:new Date()});logItems=logItems.slice(0,40);renderLog()}
function toast(message){const e=$("#toast");if(!e)return;e.textContent=message;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),3500)}
function logo(){return C.logoUrl||"https://cevylpnoexugwgygvtgu.supabase.co/storage/v1/object/public/images/podcastinglogo.png"}
function hasAdminRole(u){const roles=u?.app_metadata?.roles;return adminRoles.includes(u?.app_metadata?.role)||(Array.isArray(roles)&&roles.some(r=>adminRoles.includes(r)))}
function nav(){return '<header class="topbar"><div class="shell nav"><a class="brand" href="home.html"><img src="'+esc(logo())+'" alt=""><b>CROWRULES <span>/ PODCASTING</span></b></a><nav class="links"><a href="home.html">HOME</a><a href="listener/index.html">LISTEN</a><a href="creator/index.html">CREATE</a><a href="creator/studio.html">STUDIO</a><a href="creator/live-admin.html">LIVE</a></nav><div class="user"><a href="account.html">ACCOUNT</a><button class="btn small" id="signout">SIGN OUT</button></div></div></header>'}
function shell(){document.body.insertAdjacentHTML("afterbegin","<div id='toast' class='toast'></div>")}
function gate(title,body,actions=""){document.getElementById("app").innerHTML='<div class="gate"><div class="panel"><div class="eyebrow">CROWRULES PODCASTING • ADMIN</div><h1>'+title+'</h1><p style="color:var(--muted);line-height:1.7">'+body+'</p>'+actions+'</div></div>'}
async function count(table,filter){if(!S)return{count:0,error:new Error("Supabase client unavailable")};let q=S.from(table).select("*",{count:"exact",head:true});if(filter)q=filter(q);const r=await q;return{count:r.count||0,error:r.error}}
async function getLive(){if(!S)return{data:[],error:new Error("Supabase unavailable")};return await S.from("cr_podcast_live").select("*").order("is_live",{ascending:false}).order("updated_at",{ascending:false}).limit(30)}
function renderLog(){const e=$("#activityLog");if(!e)return;e.innerHTML=logItems.length?logItems.map(x=>'<div class="row"><div class="row-main"><b>'+esc(x.message)+'</b><small>'+esc(x.type)+' • '+time(x.at)+'</small></div></div>').join(""):'<div class="notice">Admin activity will appear here as the command center checks services and receives realtime events.</div>'}
async function loadDashboard(){
document.getElementById("app").innerHTML=nav()+`<main class="shell">
<section class="hero">
<div><div class="eyebrow">REALTIME OPERATIONS • ADMIN COMMAND CENTER</div><h1>CONTROL<br>THE<br>UNIVERSE.</h1><p>One operational dashboard for CrowRules Podcasting. Monitor the live network, creator catalog, listener activity, platform health and Supabase connectivity without exposing privileged server keys in the browser.</p><div class="toolbar"><button class="btn primary" id="refresh">REFRESH ALL</button><a class="btn" href="creator/live-admin.html">OPEN LIVE OPS</a><a class="btn" href="creator/studio.html">CREATOR STUDIO</a></div></div>
<div class="panel status-card"><div class="status-top"><div><div class="eyebrow">SYSTEM STATUS</div><h2 style="font:700 20px Orbitron;margin:10px 0">Admin Online</h2></div><span><i class="status-dot" id="statusDot"></i><b id="statusText">CHECKING</b></span></div><div class="identity"><small style="color:var(--muted)">AUTHENTICATED ADMIN</small><strong>${esc(user.email||user.id)}</strong><small style="color:var(--muted);display:block;margin-top:7px">Role: ${esc(user.app_metadata?.role||"admin")} • User ID: ${esc(user.id)}</small></div></div>
</section>
<section class="grid">
<div class="panel metric"><small>Podcasts</small><strong id="mPodcasts">—</strong><em>Creator catalog</em></div>
<div class="panel metric"><small>Episodes</small><strong id="mEpisodes">—</strong><em>Episode inventory</em></div>
<div class="panel metric"><small>Published</small><strong id="mPublished">—</strong><em>Public episodes</em></div>
<div class="panel metric"><small>Live Now</small><strong id="mLive">—</strong><em>Active broadcasts</em></div>
</section>
<section class="section two">
<div class="panel pad"><div class="section-head"><h2>Live Network</h2><span id="liveStamp">CHECKING</span></div><div id="liveList" class="list"><div class="notice">Loading live network…</div></div></div>
<div class="panel pad"><div class="section-head"><h2>Command Links</h2><span>FAST ACCESS</span></div><div class="quick">
<a href="creator/podcasts.html"><b>Podcast Operations</b><small>Manage creator shows and catalog records.</small></a>
<a href="creator/episodes.html"><b>Episode Operations</b><small>Manage drafts, publishing and episode inventory.</small></a>
<a href="creator/subscriptions.html"><b>Subscriptions</b><small>Review the listener monetization surface.</small></a>
<a href="creator/payouts.html"><b>Payouts</b><small>Open creator Stripe payout operations.</small></a>
<a href="listener/rankings.html"><b>Rankings</b><small>Inspect public engagement signals.</small></a>
<a href="launch.html"><b>Launch Center</b><small>Review the January 1, 2027 launch experience.</small></a>
</div></div>
</section>
<section class="section two">
<div class="panel pad"><div class="section-head"><h2>Platform Health</h2><span>LIVE CHECKS</span></div><div id="health" class="list"><div class="notice">Running diagnostics…</div></div></div>
<div class="panel pad"><div class="section-head"><h2>Admin Activity</h2><span>LOCAL SESSION</span></div><div id="activityLog" class="list log"></div></div>
</section>
<section class="section panel pad"><div class="section-head"><h2>Security Boundary</h2><span>PUBLISHABLE CLIENT</span></div><div class="notice"><strong>Browser safety:</strong> this dashboard uses the public Supabase publishable key only. It does not use a service-role key, and sensitive administrative mutations should remain behind RLS-protected tables or Supabase Edge Functions. Supabase's current guidance recommends <code>auth.getUser()</code> for an authenticated user identity and warns against using client-visible metadata as an authorization substitute. See the Supabase security documentation for the server-side boundary.</div></section>
</main><footer class="footer">CROWRULES PODCASTING • ADMIN COMMAND CENTER • ONE COMPANY. ONE UNIVERSE. • PRE-LAUNCH TARGET: JANUARY 1, 2027</footer>`;
renderLog();
$("#signout").onclick=async()=>{await S.auth.signOut();location.href="home.html"};
$("#refresh").onclick=()=>refreshAll();
}
async function refreshAll(){
log("Starting platform refresh");
const[p,e,pub,live]=await Promise.all([count("podcasts"),count("podcast_episodes"),count("podcast_episodes",q=>q.eq("status","published")),getLive()]);
$("#mPodcasts").textContent=p.error?"ERR":fmt(p.count);$("#mEpisodes").textContent=e.error?"ERR":fmt(e.count);$("#mPublished").textContent=pub.error?"ERR":fmt(pub.count);
const active=(live.data||[]).filter(x=>x.is_live);$("#mLive").textContent=live.error?"ERR":fmt(active.length);$("#liveStamp").textContent=new Date().toLocaleTimeString();
const dot=$("#statusDot"),st=$("#statusText");if(p.error&&e.error){dot.classList.add("off");st.textContent="DEGRADED";log("Database checks returned errors","ERROR")}else{dot.classList.remove("off");st.textContent="ONLINE";log("Database connectivity verified","OK")}
renderLive(live);await diagnostics(p,e,pub,live);log("Platform refresh complete","OK");
}
function renderLive(r){const box=$("#liveList");if(!box)return;if(r.error){box.innerHTML='<div class="notice"><strong>Live query failed.</strong> '+esc(r.error.message)+'</div>';return}if(!r.data?.length){box.innerHTML='<div class="notice">No live broadcast records are currently available.</div>';return}box.innerHTML=r.data.map(x=>'<div class="row"><div class="row-main"><b>'+esc(x.title||x.show_name||"Untitled broadcast")+'</b><small>'+esc(x.show_name||x.channel||"CrowRules Podcasting")+' • Updated '+time(x.updated_at||x.started_at)+'</small></div><span class="pill '+(x.is_live?"live":"off")+'">'+(x.is_live?"● LIVE":"OFFLINE")+'</span><strong>'+fmt(x.listener_count)+' listeners</strong></div>').join("")}
async function diagnostics(p,e,pub,live){const h=$("#health");if(!h)return;const checks=[["Supabase client",!!S,"Browser client initialized"],["Authenticated admin",!!user&&hasAdminRole(user),"Signed-in role check"],["Podcasts table",!p.error,p.error?.message||fmt(p.count)+" rows accessible"],["Episodes table",!e.error,e.error?.message||fmt(e.count)+" rows accessible"],["Published query",!pub.error,pub.error?.message||fmt(pub.count)+" published episodes"],["Live network",!live.error,live.error?.message||(live.data?.length||0)+" live records returned"]];h.innerHTML=checks.map(c=>'<div class="check"><div><b>'+esc(c[0])+'</b><small>'+esc(c[2])+'</small></div><strong class="'+(c[1]?"ok":"bad")+'">'+(c[1]?"READY":"CHECK")+'</strong></div>').join("")}
async function startRealtime(){if(!S)return;if(channel)await S.removeChannel(channel);channel=S.channel("crowrules-admin-live");channel.on("postgres_changes",{event:"*",schema:"public",table:"cr_podcast_live"},payload=>{log("Realtime live-network event: "+payload.eventType,"LIVE");refreshAll()}).subscribe((status,error)=>{if(status==="SUBSCRIBED")log("Supabase Realtime channel subscribed","OK");if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){log("Realtime channel error: "+(error?.message||status),"ERROR");toast("Realtime connection needs attention.")}})}
async function boot(){shell();if(!S){gate("SUPABASE UNAVAILABLE","The public Supabase client could not be initialized. Check config.js before using Admin.");return}const{data,error}=await S.auth.getUser();if(error||!data.user){gate("ADMIN SIGN-IN REQUIRED","Sign in to a CrowRules account with an administrator role to open this command center.",'<a class="btn primary" href="login.html">SIGN IN</a>');return}user=data.user;if(!hasAdminRole(user)){gate("ACCESS DENIED","This account is authenticated but is not marked as an administrator. Assign an admin role through your trusted server-side/auth configuration; do not grant admin status from browser-editable user metadata.",'<a class="btn" href="home.html">RETURN HOME</a>');return}await loadDashboard();await refreshAll();await startRealtime();S.auth.onAuthStateChange((event,next)=>{if(event==="SIGNED_OUT")location.href="home.html";if(next)user=next})}
boot();
})();
</script>
</body>
</html>
