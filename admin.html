-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px #34d399}.dot.off{background:var(--amber);box-shadow:0 0 10px #fbbf24}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.metric{padding:15px;min-height:106px;overflow:hidden}.metric small{display:block;color:var(--muted);font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.metric strong{display:block;font:700 clamp(22px,2.4vw,30px) Orbitron;margin-top:13px;overflow-wrap:anywhere}.metric em{display:block;color:var(--muted);font-size:9px;font-style:normal;margin-top:7px}.section{padding:20px 0}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.head h2{font:700 17px Orbitron;margin:0}.head span{font-size:8px;color:var(--muted);letter-spacing:.14em}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.list{display:grid;gap:8px;max-height:460px;overflow:auto}.item{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#ffffff04;min-width:0}.main{flex:1;min-width:0}.main b{display:block;font-size:11px;overflow-wrap:anywhere}.main small{display:block;color:var(--muted);font-size:9px;line-height:1.5;margin-top:4px;overflow-wrap:anywhere}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;font-size:8px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}.ok{color:#bbf7d0;border-color:#34d39955}.warn{color:#fde68a;border-color:#fbbf2455}.bad{color:#fecdd3;border-color:#fb718555}.empty,.notice{padding:13px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:10px;line-height:1.65}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}.table th{color:var(--muted);font-size:8px;letter-spacing:.1em;text-transform:uppercase}.select{max-width:130px;background:#090d19;color:white;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:9px}.toast{position:fixed;right:16px;bottom:16px;z-index:80;max-width:420px;padding:13px 15px;background:#11182a;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;font-size:11px}.toast.on{opacity:1;transform:none}.gate{min-height:70vh;display:grid;place-items:center;padding:24px}.gate .panel{max-width:580px;padding:30px;text-align:center}.gate h1{font:700 26px Orbitron}.gate p{color:var(--muted);font-size:12px;line-height:1.7}.foot{border-top:1px solid var(--line);padding:25px 0;margin-top:24px;text-align:center;color:#667085;font-size:8px;letter-spacing:.13em}.livebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.timestamp{font-size:9px;color:var(--muted)}code{color:#a5f3fc}

<script>
(function(){"use strict";
var C=window.CROW_CONFIG||{},S=window.supabase&&window.supabase.createClient&&C.supabaseUrl&&C.supabaseKey?window.supabase.createClient(C.supabaseUrl,C.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}}):null;
var $=function(s){return document.querySelector(s)},esc=function(x){return String(x==null?"":x).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]})},fmt=function(n){return Number(n||0).toLocaleString()},stamp=function(x){return x?new Date(x).toLocaleString():"—"};
var user=null,channels=[],refreshTimer=null,heartbeat=null,refreshBusy=false,lastRefresh=0;
var state={workspace:{},reports:[],comments:[],live:[],events:[],audit:[],warnings:[],stats:{},presence:{listener:0,creator:0,launch:0,all:0},realtime:"Connecting",lastUpdated:null};
var adminRoles=["admin","super_admin","owner","administrator"];
function toast(s){var e=$("#toast");if(!e)return;e.textContent=s;e.classList.add("on");window.setTimeout(function(){e.classList.remove("on")},3500)}
function isAdmin(u){var a=u&&u.app_metadata||{},r=a.roles;return adminRoles.indexOf(a.role)>=0||(Array.isArray(r)&&r.some(function(x){return adminRoles.indexOf(x)>=0}))}
function logo(){return C.logoUrl||"https://cevylpnoexugwgygvtgu.supabase.co/storage/v1/object/public/images/podcastinglogo.png"}
function showGate(title,msg,actions){$("#app").innerHTML='<div class="gate"><div class="panel"><div class="eyebrow">CROWRULES PODCASTING / SECURE OPERATIONS</div><h1>'+esc(title)+'</h1><p>'+esc(msg)+'</p><div class="toolbar" style="justify-content:center">'+(actions||"")+'</div></div></div>'}
function nav(){return '<header class="top"><div class="shell nav"><a class="brand" href="home.html"><img alt="" src="'+esc(logo())+'"><b>CROWRULES <span>/ PODCASTING</span></b></a><nav class="links"><a href="#overview">OVERVIEW</a><a href="#catalog">CATALOG</a><a href="#audience">AUDIENCE</a><a href="#moderation">MODERATION</a><a href="#liveops">LIVE OPS</a><a href="#activity">ACTIVITY</a></nav><div class="user"><a class="btn" href="account.html">ACCOUNT</a> <button class="btn" id="signout">SIGN OUT</button></div></div></header>'}
function card(label,value,detail,id){return '<div class="panel metric"><small>'+label+'</small><strong'+(id?' id="'+id+'"':'')+'>'+value+'</strong><em>'+detail+'</em></div>'}
function item(title,detail,tag){return '<div class="item"><div class="main"><b>'+esc(title)+'</b><small>'+esc(detail)+'</small></div>'+(tag?'<span class="pill">'+esc(tag)+'</span>':'')+'</div>'}
function render(){
 var w=state.workspace||{},creators=w.creators||[],members=w.members||[],pods=creators.reduce(function(a,c){return a.concat(c.podcasts||[])},[]),eps=pods.reduce(function(a,p){return a.concat(p.episodes||[])},[]),reports=state.reports||[],open=reports.filter(function(x){return !["resolved","dismissed","closed"].includes(String(x.status||"").toLowerCase())}),live=(state.live||[]).filter(function(x){return x.is_live===true||String(x.status||"").toLowerCase()==="live"}),st=state.stats||{};
 $("#app").innerHTML=nav()+'<main class="shell"><section class="hero" id="overview"><div><div class="eyebrow">REALTIME CONTROL PLANE / ADMIN ONLY</div><h1>RUN THE<br>PODCAST<br>UNIVERSE.</h1><p>Live audience presence, catalog health, creator operations, moderation, subscriptions and broadcast status. Metrics update from Supabase Realtime events with a periodic refresh fallback.</p><div class="toolbar"><button class="btn primary" id="refresh">REFRESH NOW</button><a class="btn" href="creator/studio.html">CREATOR STUDIO</a><a class="btn" href="creator/live-admin.html">LIVE CONSOLE</a><a class="btn" href="launch.html">LAUNCH CENTER</a></div></div><div class="panel status"><div class="statusline"><div><div class="eyebrow">OPERATOR SESSION</div><h2>Access verified</h2></div><span class="pill ok"><i class="dot"></i> ADMIN</span></div><div><div class="muted" style="font-size:9px">SIGNED-IN OPERATOR</div><b style="display:block;margin-top:6px;overflow-wrap:anywhere">'+esc(user.email||user.id)+'</b><div class="muted" style="font-size:9px;margin-top:7px">Trusted role: '+esc(user.app_metadata&&user.app_metadata.role||"admin")+'</div><div class="livebar" style="margin-top:20px;border-top:1px solid var(--line);padding-top:14px"><span class="pill '+(state.realtime==="Connected"?"ok":"warn")+'"><i class="dot '+(state.realtime==="Connected"?"":"off")+'"></i><span id="rtState">'+esc(state.realtime)+'</span></span><span class="timestamp" id="lastUpdated">Updated '+esc(stamp(state.lastUpdated))+'</span></div></div></div></section>
<section class="section"><div class="head"><h2>Live Network Snapshot</h2><span>REALTIME PRESENCE + DATABASE COUNTS</span></div><div class="grid">'+card("Active Visitors",fmt(state.presence.all||state.presence.listener+state.presence.creator+state.presence.launch),"Presence across tracked site areas","mVisitors")+card("Listener Area",fmt(state.presence.listener),"Live presence sessions","mListeners")+card("Creator Area",fmt(state.presence.creator),"Live creator sessions","mCreators")+card("Launch Page",fmt(state.presence.launch),"Live launch-page sessions","mLaunch")+card("Live Broadcasts",fmt(live.length),"Rows currently marked live","mLive")+card("Active Subscriptions",fmt(st.subscriptions),"Rows with active status","mSubs")+'</div><div class="notice" style="margin-top:10px">Presence numbers count connected browser sessions in the channels below, not unique people. Subscription and catalog totals depend on table availability and current Row Level Security permissions.</div></section>
<section class="section" id="catalog"><div class="head"><h2>Catalog & Community</h2><span>DATABASE-BACKED SNAPSHOT</span></div><div class="grid">'+card("Members",fmt(members.length),"Returned member directory","mMemberCount")+card("Creators",fmt(creators.length),"Creator workspace","mCreatorCount")+card("Podcasts",fmt(w.podcast_count!=null?w.podcast_count:pods.length),"Creator catalog","mPodcastCount")+card("Episodes",fmt(eps.length),"Loaded episode inventory","mEpisodeCount")+card("Published",fmt(eps.filter(function(e){return String(e.status||"").toLowerCase()==="published"}).length),"Published episode records","mPublished")+card("Episode Plays",fmt(eps.reduce(function(n,e){return n+Number(e.play_count||0)},0)),"Sum of available play counters","mPlays")+card("Podcast Follows",fmt(st.follows),"Relationship count","mFollows")+card("Comments",fmt(st.comments),"Community comments","mComments")+card("Saved Episodes",fmt(st.saves),"Listener library records","mSaves")+card("Recommendations",fmt(st.recommendations),"Recommendation events","mRecommendations")+card("Open Reports",fmt(open.length),"Awaiting moderation","mReports")+card("Launch Interest",fmt(state.launch),"Launch counter RPC","mInterest")+'</div></section>
<section class="section two" id="audience"><div class="panel pad"><div class="head"><h2>Realtime Audience Presence</h2><span>SUPABASE PRESENCE</span></div><div class="list" id="presenceRows">'+item("Listener pages",state.presence.listener+" connected sessions","LIVE")+item("Creator pages",state.presence.creator+" connected sessions","LIVE")+item("Launch page",state.presence.launch+" connected sessions","LIVE")+item("All tracked pages",state.presence.all+" connected sessions","TOTAL")+'</div><p class="timestamp" id="presenceStatus">Presence channels initializing…</p></div><div class="panel pad"><div class="head"><h2>Realtime Connection Health</h2><span>EVENT SUBSCRIPTIONS</span></div><div class="list" id="healthRows">'+item("Supabase client",S?"Configured":"Missing config",S?"OK":"ERROR")+item("Authentication","Server-verified operator","OK")+item("Database change feed",state.realtime,"CONNECTING")+item("Periodic refresh","Every 30 seconds","BACKUP")+'</div><p class="timestamp">If Realtime publication or table SELECT policies are not configured, affected panels fall back to periodic reads and report warnings.</p></div></section>
<section class="section two" id="moderation"><div class="panel pad"><div class="head"><h2>Moderation Queue</h2><span>OPEN REPORTS</span></div><div class="list" id="reportList">'+(open.slice(0,30).map(function(x){return item(x.reason||"Community report","Status: "+(x.status||"open")+" • "+stamp(x.created_at),x.status||"OPEN")}).join("")||'<div class="empty">No open reports returned.</div>')+'</div></div><div class="panel pad"><div class="head"><h2>Recent Comments</h2><span>COMMUNITY SIGNAL</span></div><div class="list" id="commentList">'+((state.comments||[]).slice(0,25).map(function(x){return item(x.body||"Comment", "User "+(x.user_id||"—")+" • "+stamp(x.created_at),"COMMENT")}).join("")||'<div class="empty">No comments returned.</div>')+'</div></div></section>
<section class="section two" id="liveops"><div class="panel pad"><div class="head"><h2>Live Broadcast Operations</h2><span>LIVE STATUS</span></div><div class="list" id="liveList">'+(state.live.slice(0,35).map(function(x){return item(x.title||x.name||x.channel_name||"Untitled broadcast","Status "+(x.is_live?"LIVE":x.status||"offline")+" • updated "+stamp(x.updated_at),x.is_live?"LIVE":"OFFLINE")}).join("")||'<div class="empty">No live broadcast records returned. Confirm the live table and RLS policy.</div>')+'</div></div><div class="panel pad"><div class="head"><h2>Creator & Show Directory</h2><span>TOP RECENT WORKSPACE</span></div><div class="list" id="creatorList">'+(creators.slice(0,35).map(function(c){var p=c.podcasts||[];return item(c.display_name||c.name||"Creator",p.length+" shows • "+Number(c.episode_count||p.reduce(function(n,x){return n+(x.episodes||[]).length},0))+" episodes",c.status||"CREATOR")}).join("")||'<div class="empty">No creator workspace data returned.</div>')+'</div></div></section>
<section class="section two" id="activity"><div class="panel pad"><div class="head"><h2>Workflow Events</h2><span>RECENT ACTIVITY</span></div><div class="list" id="eventList">'+(state.events.slice(0,35).map(function(x){return item(x.event_type||"Event",(x.message||"")+" • "+stamp(x.created_at),"EVENT")}).join("")||'<div class="empty">No workflow events returned.</div>')+'</div></div><div class="panel pad"><div class="head"><h2>Read Health & Audit</h2><span>NON-FATAL WARNINGS</span></div><div class="list" id="warningList">'+(state.warnings.map(function(x){return item(x,"Read warning","WARNING")}).join("")||'<div class="empty">No read warnings currently reported.</div>')+'</div><div class="head" style="margin-top:20px"><h2>Admin Audit Trail</h2><span>PRIVILEGED ACTIVITY</span></div><div class="list" id="auditList">'+(state.audit.slice(0,15).map(function(x){return item(x.action||"Admin action",(x.entity_type||"")+" "+(x.entity_id||"")+" • "+stamp(x.created_at),"AUDIT")}).join("")||'<div class="empty">No audit records returned.</div>')+'</div></div></section>
<section class="section panel pad"><div class="head"><h2>Security Boundary</h2><span>SERVER-SIDE AUTHORIZATION REQUIRED</span></div><p class="muted" style="font-size:10px;line-height:1.8">This page verifies the signed-in user with Supabase Auth and requires a trusted <code>app_metadata</code> administrator role. Privileged operations should be enforced by the <code>crowrules-admin-api</code> Edge Function. The browser never uses a service-role key. Realtime subscriptions and reads remain governed by Supabase table grants, publication settings and Row Level Security.</p></section></main><footer class="foot">CROWRULES PODCASTING • OPERATIONS CENTER • ONE COMPANY. ONE UNIVERSE.</footer>';
 bind();
}
function safeQuery(p,label,empty){return p.then(function(r){if(r.error){state.warnings.push(label+": "+r.error.message);return {data:empty||[],count:0}}return r}).catch(function(e){state.warnings.push(label+": "+(e.message||"request failed"));return {data:empty||[],count:0}})}
function safeRpc(p,label,fallback){return p.then(function(r){if(r.error){state.warnings.push(label+": "+r.error.message);return {data:fallback}}return r}).catch(function(e){state.warnings.push(label+": "+(e.message||"request failed"));return {data:fallback}})}
function load(){
 if(refreshBusy)return Promise.resolve();refreshBusy=true;state.warnings=[];
 var since=new Date(Date.now()-30*864e5).toISOString();
 return Promise.all([
  S.functions.invoke("crowrules-admin-api",{body:{action:"creator_workspace"}}).then(function(r){if(r.error)throw r.error;if(r.data&&r.data.ok===false)throw new Error(r.data.error||"Creator workspace rejected request");state.workspace=r.data||{};return true}).catch(function(e){state.workspace=state.workspace||{};state.warnings.push("Creator workspace: "+(e.message||"request failed"));return false}),
  safeQuery(S.from("podcast_member_reports").select("id,reporter_user_id,reported_user_id,reason,status,created_at,updated_at").order("created_at",{ascending:false}).limit(100),"Moderation reports",[]),
  safeQuery(S.from("cr_podcast_social_comments_v5").select("id,user_id,episode_id,body,created_at").order("created_at",{ascending:false}).limit(60),"Comments",[]),
  safeQuery(S.from("cr_podcast_live").select("*").order("updated_at",{ascending:false}).limit(80),"Live broadcasts",[]),
  safeRpc(S.rpc("podcast_launch_interest_count"),"Launch interest",0),
  safeQuery(S.from("podcast_workflow_events").select("id,creator_id,task_id,event_type,message,created_at").order("created_at",{ascending:false}).limit(60),"Workflow events",[]),
  safeQuery(S.from("cr_podcast_admin_audit").select("id,admin_user_id,action,entity_type,entity_id,created_at").order("created_at",{ascending:false}).limit(60),"Admin audit",[]),
  safeQuery(S.from("podcast_follows").select("id",{count:"exact",head:true}),"Follow count",[]),
  safeQuery(S.from("podcast_subscriptions").select("id",{count:"exact",head:true}).eq("status","active"),"Active subscription count",[]),
  safeQuery(S.from("cr_podcast_social_comments_v5").select("id",{count:"exact",head:true}),"Comment count",[]),
  safeQuery(S.from("podcast_user_saved_episodes").select("id",{count:"exact",head:true}),"Saved episode count",[]),
  safeQuery(S.from("podcast_recommendation_events").select("id",{count:"exact",head:true}),"Recommendation count",[]),
  safeQuery(S.from("podcast_recommendation_daily_metrics").select("plays,seconds,completes,metric_date").gte("metric_date",since.slice(0,10)).limit(10000),"Daily metrics",[])
 ]).then(function(r){
  state.reports=r[1].data||[];state.comments=r[2].data||[];state.live=r[3].data||[];state.launch=Number(r[4].data||0);state.events=r[5].data||[];state.audit=r[6].data||[];
  state.stats={follows:r[7].count||0,subscriptions:r[8].count||0,comments:r[9].count||0,saves:r[10].count||0,recommendations:r[11].count||0,metrics:r[12].data||[]};
  state.lastUpdated=new Date();render();refreshLiveCounters();return true;
 }).catch(function(e){state.warnings.push("Dashboard refresh: "+(e.message||"unknown error"));render();return false}).finally(function(){refreshBusy=false});
}
function refreshLiveCounters(){
 var st=state.stats||{},w=state.workspace||{},cs=w.creators||[],pods=cs.reduce(function(a,c){return a.concat(c.podcasts||[])},[]),eps=pods.reduce(function(a,p){return a.concat(p.episodes||[])},[]);
 var vals={mVisitors:state.presence.all||state.presence.listener+state.presence.creator+state.presence.launch,mListeners:state.presence.listener,mCreators:state.presence.creator,mLaunch:state.presence.launch,mLive:state.live.filter(function(x){return x.is_live===true||String(x.status||"").toLowerCase()==="live"}).length,mSubs:st.subscriptions||0,mMemberCount:(w.members||[]).length,mCreatorCount:cs.length,mPodcastCount:w.podcast_count!=null?w.podcast_count:pods.length,mEpisodeCount:eps.length,mPublished:eps.filter(function(e){return String(e.status||"").toLowerCase()==="published"}).length,mPlays:eps.reduce(function(n,e){return n+Number(e.play_count||0)},0),mFollows:st.follows||0,mComments:st.comments||0,mSaves:st.saves||0,mRecommendations:st.recommendations||0,mReports:state.reports.filter(function(x){return !["resolved","dismissed","closed"].includes(String(x.status||"").toLowerCase())}).length,mInterest:state.launch||0};
 Object.keys(vals).forEach(function(k){var e=$("#"+k);if(e)e.textContent=fmt(vals[k])});
 var last=$("#lastUpdated");if(last)last.textContent="Updated "+stamp(state.lastUpdated);
 var rt=$("#rtState");if(rt)rt.textContent=state.realtime;
 var wr=$("#warningList");if(wr)wr.innerHTML=state.warnings.map(function(x){return item(x,"Read warning","WARNING")}).join("")||'<div class="empty">No read warnings currently reported.</div>';
 var h=$("#healthRows");if(h)h.innerHTML=item("Supabase client","Client configured","OK")+item("Authentication","Server-verified operator","OK")+item("Database change feed",state.realtime,state.realtime==="Connected"?"OK":"WAITING")+item("Periodic refresh","Every 30 seconds","BACKUP");
 var p=$("#presenceRows");if(p)p.innerHTML=item("Listener pages",state.presence.listener+" connected sessions","LIVE")+item("Creator pages",state.presence.creator+" connected sessions","LIVE")+item("Launch page",state.presence.launch+" connected sessions","LIVE")+item("All tracked pages",state.presence.all+" connected sessions","TOTAL");
}
function bind(){
 var sign=$("#signout");if(sign)sign.onclick=function(){S.auth.signOut().finally(function(){location.href="home.html"})};
 var refresh=$("#refresh");if(refresh)refresh.onclick=function(){load().then(function(){toast("Dashboard refreshed.")})};
}
function startPresence(){
 var key="ops-"+(window.crypto&&crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));
 var specs=[["listener","crowrules-podcasting-visitors-listener"],["creator","crowrules-podcasting-visitors-creator"],["launch","crowrules-podcasting-visitors-launch"],["all","crowrules-podcasting-visitors-all"]];
 var states={};
 function paint(){
  specs.forEach(function(s){var ch=states[s[0]];if(ch){var ps=ch.presenceState();state.presence[s[0]]=Object.keys(ps).reduce(function(n,k){return n+(Array.isArray(ps[k])?ps[k].length:0)},0)}});
  var total=state.presence.all||state.presence.listener+state.presence.creator+state.presence.launch;state.presence.all=total;
  var e=$("#presenceStatus");if(e)e.textContent="Presence synced "+new Date().toLocaleTimeString()+" • "+total+" tracked sessions";
  refreshLiveCounters();
 }
 specs.forEach(function(spec){var ch=S.channel(spec[1],{config:{presence:{key:key+"-"+spec[0]}}});states[spec[0]]=ch;channels.push(ch);ch.on("presence",{event:"sync"},paint).on("presence",{event:"join"},paint).on("presence",{event:"leave"},paint).subscribe(function(status){if(status==="SUBSCRIBED"){state.realtime="Connected";paint();}else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){state.realtime="Degraded";refreshLiveCounters()}})});
}
function startRealtime(){
 var defs=[["cr_podcast_live"],["podcast_episodes"],["podcast_member_reports"],["cr_podcast_social_comments_v5"],["podcast_follows"],["podcast_subscriptions"],["podcast_workflow_events"]];
 defs.forEach(function(d){var ch=S.channel("ops-db-"+d[0]+"-"+Math.random().toString(36).slice(2,7));ch.on("postgres_changes",{event:"*",schema:"public",table:d[0]},function(){if(Date.now()-lastRefresh>1800){lastRefresh=Date.now();load()}});channels.push(ch);ch.subscribe(function(status){if(status==="SUBSCRIBED"){state.realtime="Connected";refreshLiveCounters()}else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){state.realtime="Degraded";refreshLiveCounters()}})});
 startPresence();
 if(refreshTimer)clearInterval(refreshTimer);refreshTimer=window.setInterval(function(){load()},30000);
}
function timeout(p,ms,label){return Promise.race([p,new Promise(function(_,reject){window.setTimeout(function(){reject(new Error(label))},ms)})])}
function boot(){
 if(!S){showGate("SUPABASE CONFIGURATION ERROR","The Supabase client or config.js keys are missing. Check window.CROW_CONFIG.supabaseUrl and supabaseKey.",'<a class="btn" href="home.html">RETURN HOME</a>');return}
 S.auth.onAuthStateChange(function(event){if(event==="SIGNED_OUT")location.href="home.html"});
 timeout(S.auth.getUser(),10000,"Supabase Auth timed out while verifying this session.").then(function(r){
  if(r.error||!r.data||!r.data.user)throw r.error||new Error("No signed-in operator session was found.");
  user=r.data.user;if(!isAdmin(user)){showGate("ACCESS DENIED","Your session is valid, but trusted app_metadata does not grant Operations Center access.",'<a class="btn" href="home.html">RETURN HOME</a>');return}
  state.realtime="Connecting";render();load().then(function(){startRealtime()});
 }).catch(function(e){showGate("SECURE ACCESS FAILED",e.message||"Unable to verify the current session.",'<a class="btn primary" href="login.html?redirect=admin.html">SIGN IN AGAIN</a> <button class="btn" id="retryAuth">RETRY</button>');var b=$("#retryAuth");if(b)b.onclick=function(){location.reload()}});
}
window.addEventListener("beforeunload",function(){if(refreshTimer)clearInterval(refreshTimer);if(heartbeat)clearInterval(heartbeat);channels.forEach(function(c){try{S.removeChannel(c)}catch(e){}})});
boot();
})();
</script>
</body></html>
