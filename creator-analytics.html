<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Analytics — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">CREATOR INTELLIGENCE</div><h1>Analytics <span class="gradient">that move with you.</span></h1><div id="auth" class="notice">Loading analytics…</div><div id="stats" class="grid"></div><section class="section"><div class="card"><h2>Recent listening activity</h2><div id="recent">Loading…</div></div></section></main><script>addEventListener("crow:ready",async()=>{if(!__CROW_USER){auth.textContent="Sign in to view creator analytics.";return}const p=await CROW_SUPABASE.from("podcasts").select("id,title,total_plays,listener_count").eq("creator_id",__CROW_USER.id);const ps=p.data||[],ids=[];let plays=0,listeners=0;for(const x of ps){plays+=Number(x.total_plays||0);listeners+=Number(x.listener_count||0);const e=await CROW_SUPABASE.from("podcast_episodes").select("id,title,play_count").eq("podcast_id",x.id);ids.push(...(e.data||[]).map(v=>v.id))}let sessions=[];if(ids.length){const l=await CROW_SUPABASE.from("podcast_listens").select("episode_id,seconds_listened,completed,created_at").in("episode_id",ids).order("created_at",{ascending:false}).limit(100);sessions=l.data||[]}const hours=sessions.reduce((n,x)=>n+Number(x.seconds_listened||0),0)/3600;stats.innerHTML=[[""+plays,"Total plays"],[""+listeners,"Listeners"],[""+sessions.length,"Recent sessions"],[hours.toFixed(1),"Hours listened"]].map(x=>'<div class="card"><div class="stat">'+x[0]+'</div><p>'+x[1]+'</p></div>').join("");recent.innerHTML=sessions.slice(0,20).map(x=>'<div class="activity-row"><span>'+new Date(x.created_at).toLocaleString()+'</span><strong>'+Math.round(Number(x.seconds_listened||0)/60)+' min</strong><span class="pill">'+(x.completed?"completed":"in progress")+"</span></div>").join("")||"<p>No listening data yet.</p>";auth.textContent="Analytics synced with Supabase.";});</script></body></html>
