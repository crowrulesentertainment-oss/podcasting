<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03040a">
<meta name="description" content="CrowRules Podcasting launches January 1, 2027.">
<title>CrowRules Podcasting | Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#03040a;--text:#f7f8ff;--muted:#9da5bc;--cyan:#63e9ff;--purple:#9b6cff;--pink:#ff64d8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Montserrat,Arial,sans-serif}
body{overflow:hidden}
.launch{position:relative;min-height:100vh;display:grid;place-items:center;isolation:isolate;overflow:hidden;background:
radial-gradient(circle at 50% 48%,rgba(99,233,255,.12),transparent 17%),
radial-gradient(circle at 20% 20%,rgba(155,108,255,.10),transparent 28%),
radial-gradient(circle at 82% 78%,rgba(255,100,216,.08),transparent 25%),#03040a}
.noise{position:absolute;inset:0;opacity:.12;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}
.stars,.stars:before,.stars:after{position:absolute;inset:-20%;content:"";background-image:radial-gradient(circle,rgba(255,255,255,.8) 0 1px,transparent 1.5px);background-size:120px 120px;animation:drift 28s linear infinite}
.stars:before{transform:scale(1.7);opacity:.35;animation-duration:45s}.stars:after{transform:scale(2.4);opacity:.18;animation-duration:65s}
.grid{position:absolute;left:-10%;right:-10%;bottom:-28%;height:65%;transform:perspective(420px) rotateX(63deg);transform-origin:bottom;opacity:.28;background-image:linear-gradient(rgba(99,233,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(99,233,255,.13) 1px,transparent 1px);background-size:70px 70px;animation:gridmove 9s linear infinite;mask-image:linear-gradient(to top,black,transparent)}
.ring{position:absolute;border:1px solid rgba(99,233,255,.18);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);animation:expand 5s ease-out infinite}
.r1{width:28vw;height:28vw}.r2{width:48vw;height:48vw;animation-delay:1.2s}.r3{width:72vw;height:72vw;animation-delay:2.4s}
.core{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 18px 6px var(--cyan),0 0 55px 18px rgba(155,108,255,.45);animation:core 2s ease-in-out infinite}
.content{position:relative;z-index:5;width:min(920px,92vw);text-align:center;padding:28px}
.mark{width:78px;height:78px;margin:0 auto 28px;border:1px solid rgba(99,233,255,.6);border-radius:22px;display:grid;place-items:center;font:700 25px Orbitron,sans-serif;letter-spacing:-2px;background:rgba(8,12,24,.7);box-shadow:0 0 40px rgba(99,233,255,.14);animation:mark 1.2s ease both}
.eyebrow{font:600 11px Orbitron,sans-serif;letter-spacing:.38em;color:var(--cyan);text-transform:uppercase;margin-bottom:22px}
h1{font:700 clamp(42px,8vw,94px)/.92 Orbitron,sans-serif;letter-spacing:-.055em;margin:0;text-transform:uppercase;text-shadow:0 0 35px rgba(99,233,255,.13);animation:title 1.3s .2s ease both}
h1 span{display:block;background:linear-gradient(90deg,#fff 20%,var(--cyan) 48%,#fff 72%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
.subtitle{max-width:620px;margin:25px auto 30px;color:var(--muted);font-size:15px;line-height:1.8;animation:rise 1.2s .45s ease both}
.date{font:600 14px Orbitron,sans-serif;letter-spacing:.22em;color:#fff;margin-bottom:24px;animation:rise 1.2s .55s ease both}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:680px;margin:0 auto 28px;animation:rise 1.2s .65s ease both}
.unit{min-width:0;padding:18px 8px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.035);backdrop-filter:blur(12px);border-radius:14px;box-shadow:inset 0 1px rgba(255,255,255,.06)}
.number{font:600 clamp(27px,5vw,54px)/1 Orbitron,sans-serif;letter-spacing:-.04em;color:#fff}.label{margin-top:9px;font-size:9px;letter-spacing:.25em;color:#7f899f;text-transform:uppercase}
.status{font:600 10px Orbitron,sans-serif;letter-spacing:.25em;color:var(--cyan);text-transform:uppercase;animation:pulse 2s infinite}
.progress{height:2px;width:min(680px,80vw);margin:18px auto 0;background:rgba(255,255,255,.08);overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--cyan),var(--pink));box-shadow:0 0 16px var(--cyan);transition:width 1s linear}
.live{display:none}.live .countdown{display:none}.live .status{color:#fff}.live .status:after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cyan);margin-left:9px;box-shadow:0 0 14px var(--cyan)}
@keyframes drift{to{transform:translate3d(90px,55px,0)}}@keyframes gridmove{to{background-position:0 70px,70px 0}}@keyframes expand{0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}@keyframes core{50%{transform:scale(1.8);box-shadow:0 0 30px 10px var(--cyan),0 0 80px 28px rgba(155,108,255,.5)}}@keyframes mark{from{opacity:0;transform:scale(.7) rotate(-8deg)}to{opacity:1;transform:none}}@keyframes title{from{opacity:0;transform:translateY(20px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes shine{to{background-position:220% center}}@keyframes pulse{50%{opacity:.45}}
@media(max-width:560px){.countdown{gap:6px}.unit{padding:14px 4px}.subtitle{font-size:13px}.eyebrow{letter-spacing:.22em}.date{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
<link rel="stylesheet" href="css/global-navigation.css">
<script src="js/domain-service-loader.js" defer></script>
<script src="js/domain-service-loader.js" defer></script>
<script src="js/global-navigation.js" defer></script>
</head>
<body>
<main class="launch" id="launch">
<div class="stars"></div><div class="grid"></div><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div><div class="noise"></div>
<section class="content" aria-label="CrowRules Podcasting launch countdown">
<div class="mark">CR</div>
<div class="eyebrow">CROWRULES ENTERTAINMENT · PODCASTING</div>
<h1>THE SIGNAL<br><span>GOES LIVE.</span></h1>
<p class="subtitle">A new audio universe is forming. Shows, voices, stories and creators come together January 1st, 2027.</p>
<div class="date">LAUNCH · JANUARY 1 · 2027 · 12:00 AM PACIFIC</div>
<div class="countdown" aria-live="polite">
<div class="unit"><div class="number" id="days">000</div><div class="label">Days</div></div>
<div class="unit"><div class="number" id="hours">00</div><div class="label">Hours</div></div>
<div class="unit"><div class="number" id="minutes">00</div><div class="label">Minutes</div></div>
<div class="unit"><div class="number" id="seconds">00</div><div class="label">Seconds</div></div>
</div>
<div class="status" id="status">TRANSMISSION COUNTDOWN ACTIVE</div>
<div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>
</section>
</main>
<script>
(function(){
"use strict";
const target=Date.parse("2027-01-01T00:00:00-08:00");
const start=Date.parse("2026-01-01T00:00:00-08:00");
const root=document.getElementById("launch");
const d=document.getElementById("days"),h=document.getElementById("hours"),m=document.getElementById("minutes"),s=document.getElementById("seconds"),status=document.getElementById("status"),bar=document.getElementById("bar");
function pad(v,n){return String(v).padStart(n,"0")}
function tick(){
 const now=Date.now(), left=target-now;
 if(left<=0){
   d.textContent="000";h.textContent="00";m.textContent="00";s.textContent="00";
   status.textContent="NOW LIVE · ENTERING PODCASTING";
   root.classList.add("live");
   bar.style.width="100%";
   setTimeout(()=>window.location.replace("home.html"),900);
   return;
 }
 const total=Math.floor(left/1000);
 d.textContent=pad(Math.floor(total/86400),3);
 h.textContent=pad(Math.floor(total/3600)%24,2);
 m.textContent=pad(Math.floor(total/60)%60,2);
 s.textContent=pad(total%60,2);
 const pct=Math.max(0,Math.min(100,((now-start)/(target-start))*100));
 bar.style.width=pct+"%";
}
tick();
setInterval(tick,1000);
})();
</script>
</body>
</html>
