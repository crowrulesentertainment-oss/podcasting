<script>
(() => {
  "use strict";

  /*
   * CrowRules Podcasting
   * Official Launch:
   * January 1, 2027 — 12:00:00 AM Pacific Time
   *
   * January 1, 2027 is Pacific Standard Time (UTC-8).
   */
  const LAUNCH_TIMESTAMP =
    Date.UTC(2027, 0, 1, 8, 0, 0);

  const daysEl =
    document.getElementById("countdown-days");

  const hoursEl =
    document.getElementById("countdown-hours");

  const minutesEl =
    document.getElementById("countdown-minutes");

  const secondsEl =
    document.getElementById("countdown-seconds");

  const countdownEl =
    document.getElementById("countdown");

  const statusEl =
    document.getElementById("launch-status");

  const yearEl =
    document.getElementById("current-year");

  let countdownTimer = null;

  function pad(value, length = 2) {
    return String(value).padStart(length, "0");
  }

  function setText(element, value) {
    if (element) {
      element.textContent = value;
    }
  }

  function launchIsLive() {
    setText(daysEl, "000");
    setText(hoursEl, "00");
    setText(minutesEl, "00");
    setText(secondsEl, "00");

    if (statusEl) {
      statusEl.innerHTML =
        '<span aria-hidden="true">●</span> CROWRULES PODCASTING IS LIVE';
    }

    if (countdownEl) {
      countdownEl.setAttribute(
        "aria-label",
        "CrowRules Podcasting is now live"
      );
    }

    document.body.classList.add(
      "podcasting-launched"
    );

    if (countdownTimer) {
      clearInterval(countdownTimer);
      countdownTimer = null;
    }
  }

  function updateCountdown() {
    const now = Date.now();

    const difference =
      LAUNCH_TIMESTAMP - now;

    /*
     * Launch moment has arrived.
     */
    if (difference <= 0) {
      launchIsLive();
      return;
    }

    /*
     * Calculate actual remaining time.
     */
    const totalSeconds =
      Math.floor(difference / 1000);

    const days =
      Math.floor(totalSeconds / 86400);

    const hours =
      Math.floor(
        (totalSeconds % 86400) / 3600
      );

    const minutes =
      Math.floor(
        (totalSeconds % 3600) / 60
      );

    const seconds =
      totalSeconds % 60;

    /*
     * Update the actual display.
     */
    setText(
      daysEl,
      pad(days, 3)
    );

    setText(
      hoursEl,
      pad(hours)
    );

    setText(
      minutesEl,
      pad(minutes)
    );

    setText(
      secondsEl,
      pad(seconds)
    );

    /*
     * Accessibility label.
     */
    if (countdownEl) {
      countdownEl.setAttribute(
        "aria-label",
        `${days} days, ${hours} hours, ${minutes} minutes, ${seconds} seconds until CrowRules Podcasting launches`
      );
    }
  }

  /*
   * Current calendar year.
   */
  if (yearEl) {
    yearEl.textContent =
      new Date().getFullYear();
  }

  /*
   * Initial calculation.
   */
  updateCountdown();

  /*
   * Update every second.
   */
  countdownTimer =
    setInterval(
      updateCountdown,
      1000
    );

  /*
   * Recalculate when the visitor returns
   * to the browser tab.
   */
  document.addEventListener(
    "visibilitychange",
    () => {
      if (!document.hidden) {
        updateCountdown();
      }
    }
  );

})();
</script>
