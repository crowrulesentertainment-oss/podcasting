<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>Financial Statements | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>:root{--bg:#05050b;--p:#0d0e19;--c:#55e7ff;--v:#a879ff;--g:#69f5ae;--m:#98a0b8;--b:rgba(255,255,255,.1)}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(85,231,255,.1),transparent 30%),var(--bg);color:#fff;font-family:Montserrat,system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:30px 16px 80px}.hero{padding:35px 0}.ey{font:800 10px Orbitron;letter-spacing:.18em;color:var(--c)}h1{font:800 clamp(38px,6vw,68px)/.98 Orbitron;margin:10px 0}h1 span{color:var(--c)}p{color:var(--m);line-height:1.7}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--b);border-radius:11px;padding:11px 15px;background:rgba(255,255,255,.04);color:#fff;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--c),var(--v));color:#05050b;border:0}.form,.statement{background:rgba(13,14,25,.9);border:1px solid var(--b);border-radius:18px;padding:20px;margin-top:18px}.form{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field label{display:block;color:var(--m);font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}.field input{background:#080914;border:1px solid var(--b);border-radius:9px;color:#fff;padding:11px}.statement h2{font:800 18px Orbitron}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:15px 0}.metric{border:1px solid var(--b);border-radius:12px;padding:12px}.metric small{color:var(--m);font-size:8px;text-transform:uppercase}.metric b{display:block;font:800 18px Orbitron;margin-top:7px}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(105,245,174,.1);color:var(--g);font-size:9px;font-weight:900}.notice{padding:30px;border:1px dashed var(--b);border-radius:16px; </head><body><header class="site-header"><div class="site-header-inner"><a class="brand" href="creator-dashboard.html"><span class="brand-mark">CR</span><span class="brand-text"><span class="brand-name">CROW<span class="glow">RULES</span></span><span class="brand-section">PODCASTING</span></span></a><nav class="main-navigation"><a href="creator-revenue-analytics.html">Analytics</a><a href="revenue-reconciliation.html">Reconciliation</a><a href="payouts.html">Payouts</a></nav></div></header><main class="wrap"><section class="hero"><div class="ey">FINANCIAL CENTER · STATEMENTS 19.0</div><h1>CREATOR <span>STATEMENTS.</span></h1><p>Monthly creator statements unify recorded revenue, platform fees, refunds, disputes, adjusted earnings, and payout activity.</p></section><section class="form"><div class="field"><label>Period start</label><input id="start" type="date"></div><div class="field"><label>Period end</label><input id="end" type="date"></div><button class="btn primary" id="generate">Generate Statement</button></section><div id="msg"></div><section id="list"><div class="notice">Loading statements…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>(async()=>{const db=supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabasePublishableKey),list=document.getElementById('list'),msg=document.getElementById('msg');const money=(n,c)=>new Intl.NumberFormat('en-US',{style:'currency',currency:(c||'usd').toUpperCase()}).format(Number(n||0)/100);const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html?redirect=creator-financial-statements.html';return}const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1),last=new Date(now.getFullYear(),now.getMonth()+1,0);document.getElementById('start').value=first.toISOString().slice(0,10);document.getElementById('end').value=last.toISOString().slice(0,10);async function load(){const r=await db.rpc('get_my_podcast_monthly_statement_center');if(r.error)throw r.error;const a=r.data||[];list.innerHTML=a.length?a.map(s=>'<article class="statement"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="ey">'+esc(s.statement_month)+' · '+esc(s.currency.toUpperCase())+'</div><h2>Monthly Creator Statement</h2></div><span class="status">RECONCILED VIEW</span></div><div class="metrics"><div class="metric"><small>Transactions</small><b>'+esc(s.transaction_count)+'</b></div><div class="metric"><small>Gross</small><b>'+money(s.gross_cents,s.currency)+'</b></div><div class="metric"><small>Platform Fee</small><b>'+money(s.platform_fee_cents,s.currency)+'</b></div><div class="metric"><small>Refunds</small><b>'+money(s.refunds_cents,s.currency)+'</b></div><div class="metric"><small>Disputes</small><b>'+money(s.disputes_cents,s.currency)+'</b></div><div class="metric"><small>Adjusted Creator Net</small><b>'+money(s.adjusted_creator_net_cents,s.currency)+'</b></div><div class="metric"><small>Paid Out</small><b>'+money(s.paid_out_cents,s.currency)+'</b></div><div class="metric"><small>Pending Payout</small><b>'+money(s.pending_payout_cents,s.currency)+'</b></div></div><div class="actions"><button class="btn" onclick="window.print()">Print / Save PDF</button><a class="btn" href="creator-finance-reconciliation.html">View Adjustments</a></div></article>').join(''):'<div class="notice">No monthly financial activity has been recorded yet.</div>'}
document.getElementById('generate').onclick=()=>{msg.textContent='Monthly center is generated from reconciled ledger data. Use Print / Save PDF on the applicable month.'};
load().catch(e=>msg.textContent=e.message||'Unable to load statements.')</script><script src="js/config.js"></script><script>(async()=>{const db=supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabasePublishableKey),list=document.getElementById('list'),msg=document.getElementById('msg');const money=(n,c)=>new Intl.NumberFormat('en-US',{style:'currency',currency:(c||'usd').toUpperCase()}).format(Number(n||0)/100);const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html?redirect=creator-financial-statements.html';return}const now=new Date(),first=new Date(now.getFullYear(),now.getMonth(),1),last=new Date(now.getFullYear(),now.getMonth()+1,0);document.getElementById('start').value=first.toISOString().slice(0,10);document.getElementById('end').value=last.toISOString().slice(0,10);async function load(){const r=await db.rpc('get_my_podcast_financial_statements');if(r.error)throw r.error;const a=r.data||[];list.innerHTML=a.length?a.map(s=>'<article class="statement"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="ey">'+esc(s.period_start)+' → '+esc(s.period_end)+'</div><h2>'+esc(s.currency.toUpperCase())+' Creator Statement</h2></div><span class="status">'+esc(s.status)+'</span></div><div class="metrics"><div class="metric"><small>Gross</small><b>'+money(s.gross_cents,s.currency)+'</b></div><div class="metric"><small>Refunds</small><b>'+money(s.refund_cents,s.currency)+'</b></div><div class="metric"><small>Net</small><b>'+money(s.net_cents,s.currency)+'</b></div><div class="metric"><small>Paid Out</small><b>'+money(s.paid_out_cents,s.currency)+'</b></div><div class="metric"><small>Pending</small><b>'+money(s.pending_cents,s.currency)+'</b></div></div><div class="actions"><button class="btn" onclick="window.print()">Print / Save PDF</button></div></article>').join(''):'<div class="notice">No statements yet. Choose a period above and generate your first statement.</div>'}document.getElementById('generate').onclick=async()=>{const a=document.getElementById('start').value,b=document.getElementById('end').value;if(!a||!b||a>b){msg.textContent='Choose a valid statement period.';return}msg.textContent='Generating statement…';const r=await db.rpc('generate_my_podcast_statement',{p_start:a,p_end:b});if(r.error){msg.textContent=r.error.message;return}msg.textContent='Statement generated.';await load()};load().catch(e=>msg.textContent=e.message||'Unable to load statements.')})()</script></body></html>
