<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><meta name="description" content="CrowRules Podcasting member preferences."><title>Member Preferences | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/professional-experience.css"><style>.x{width:min(900px,calc(100% - 32px));margin:auto;padding:50px 0}.hero,.panel{padding:28px;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:rgba(13,15,28,.82)}.ey{color:#39e7ff;font:800 .7rem Orbitron;letter-spacing:.18em}.hero h1{font:800 clamp(2rem,6vw,4.5rem) Orbitron;margin:12px 0}.hero p,.muted{color:#9da4bd;line-height:1.6}.panel{margin-top:16px}.pref{display:flex;align-items:center;justify-content:space-between;padding:17px 0;border-bottom:1px solid rgba(255,255,255,.07);color:#fff;font-weight:700}.pref:last-of-type{border-bottom:0}.pref input{width:20px;height:20px;accent-color:#39e7ff}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.btn{min-height:42px;padding:0 14px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.04);color:#fff;font-weight:800}.primary{border-color:rgba(57,231,255,.3);background:rgba(57,231,255,.08)}</style></head><body><main id="main-content" class="x"><section class="hero"><div class="ey">MEMBER CENTER</div><h1>Preferences</h1><p>Control Podcasting notifications and member experience settings. Account identity and security are managed exclusively in Account Center.</p><div class="actions"><a class="btn primary" href="member-hub.html">← Member Hub</a><a class="btn" href="account-center.html">Account Center</a></div></section><section class="panel"><form id="form"><label class="pref">Follow activity <input id="follows" type="checkbox"></label><label class="pref">New episodes <input id="episodes" type="checkbox"></label><label class="pref">Comments <input id="comments" type="checkbox"></label><label class="pref">Reactions <input id="reactions" type="checkbox"></label><label class="pref">Member follows <input id="members" type="checkbox"></label><div class="actions"><button class="btn primary" type="submit">Save Preferences</button><span id="msg" class="muted"></span></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>(async()=>{const c=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY),u=(await c.auth.getUser()).data.user;if(!u){location.href='login.html?redirect=member-settings.html';return}const r=await c.from('podcast_notification_preferences').select('*').eq('user_id',u.id).maybeSingle(),d=r.data||{};document.getElementById('follows').checked=d.follows!==false;document.getElementById('episodes').checked=d.new_episodes!==false;document.getElementById('comments').checked=d.comments!==false;document.getElementById('reactions').checked=d.reactions!==false;document.getElementById('members').checked=d.member_follows!==false;document.getElementById('form').onsubmit=async e=>{e.preventDefault();const p={user_id:u.id,follows:follows.checked,new_episodes:episodes.checked,comments:comments.checked,reactions:reactions.checked,member_follows:members.checked,updated_at:new Date().toISOString()},x=await c.from('podcast_notification_preferences').upsert(p,{onConflict:'user_id'});msg.textContent=x.error?'Could not save preferences.':'Preferences saved.'}})()</script><script src="js/professional-experience.js"></script></body></html>
