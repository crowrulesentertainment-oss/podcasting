<html lang="en">

<style>
:root{--cyan:#00dcff;--purple:#8b5cf6;--bg:#05050b;--muted:rgba(255,255,255,.64);--good:#7df7c7;--bad:#ff8b8b}
body{background:radial-gradient(circle at 20% 0%,rgba(0,220,255,.08),transparent 30%),radial-gradient(circle at 90% 10%,rgba(139,92,246,.1),transparent 32%),var(--bg)}
.wrap{max-width:1240px}.page{padding:32px 0 90px}.hidden{display:none!important}
.card{background:rgba(13,13,23,.92);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:20px}
.hero{position:relative;overflow:hidden;min-height:500px;border:1px solid rgba(255,255,255,.1);border-radius:30px;background:#080811;display:grid;grid-template-columns:360px 1fr;gap:38px;padding:38px;align-items:end}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,11,.97),rgba(5,5,11,.7) 48%,rgba(5,5,11,.25));z-index:0}.hero>*{position:relative;z-index:1}
.hero-art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.eyebrow{letter-spacing:.18em;font-size:.72rem;color:var(--cyan);font-weight:800}.title{font-size:clamp(2.7rem,6vw,6rem);line-height:.92;margin:12px 0}.desc{max-width:760px;color:var(--muted);line-height:1.7}
.chips,.actions,.stats{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.chip,.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:7px 12px;font-size:.78rem}.live,.ok{color:var(--good)}
.section{margin-top:52px}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.section-head h2{margin:4px 0;font-size:2rem}.subtle{color:var(--muted);font-size:.84rem}
.featured{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.episode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.episode img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:15px}.player audio{width:100%;margin-top:16px}
.search{width:min(340px,100%);background:#08080f;border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:11px}
.readiness{margin-top:14px;padding:15px;border-color:rgba(139,92,246,.28)}.status-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status{padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.04);font-size:.78rem}.bad{color:var(--bad)}
.subscribe-busy{opacity:.72;pointer-events:none}.subscribe-busy:before{content:"";display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;margin-right:8px;vertical-align:-2px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.chat-layout{display:grid;grid-template-columns:230px 1fr;gap:16px}.rooms,.chat{background:rgba(10,10,18,.94);border:1px solid rgba(255,255,255,.09);border-radius:22px}.rooms{padding:12px}.room{width:100%;text-align:left;background:rgba(255,255,255,.04);border:1px solid transparent;color:#fff;border-radius:13px;padding:12px;margin-bottom:8px;cursor:pointer}.room.active{border-color:rgba(0,220,255,.55);background:rgba(0,220,255,.08)}.room small{display:block;color:var(--muted);margin-top:4px}
.chat{min-height:540px;display:grid;grid-template-rows:auto 1fr auto}.chat-head{padding:16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between}.messages{padding:16px;overflow:auto;max-height:430px}.msg{padding:10px 12px;background:rgba(255,255,255,.045);border-radius:14px;margin-bottom:9px}.msg-top{font-size:.75rem;font-weight:800}.msg-time{color:rgba(255,255,255,.35);font-weight:400;margin-left:7px}.msg-body{margin-top:4px;line-height:1.5;word-break:break-word}.compose{padding:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:8px}.compose input{flex:1;background:#07070d;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px}
.analytics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric strong{display:block;font-size:1.8rem;margin-top:6px}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding:25px}.hero-art{max-width:310px}.featured{grid-template-columns:1fr}.episode-grid{grid-template-columns:repeat(2,1fr)}.analytics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.episode-grid{grid-template-columns:1fr}.chat-layout{grid-template-columns:1fr}.analytics{grid-template-columns:1fr 1fr}.section-head{align-items:flex-start;flex-direction:column}}
</style>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
</head>
<body>
<div data-nav></div>
<main class="wrap page">
<div id="loading" class="card" style="text-align:center;padding:90px"><div class="eyebrow">CROWRULES PODCASTING</div><h2>Loading podcast…</h2><p class="subtle">Connecting to the podcast universe.</p></div>
<div id="error" class="card hidden" style="text-align:center;padding:70px"><div class="eyebrow">PODCAST SYSTEM</div><h2 id="errorTitle">Podcast could not load</h2><p id="errorText" class="subtle"></p><button id="retry" class="btn primary">Retry</button></div>
<div id="app" class="hidden"><section id="hero"></section><section class="section" id="featuredSection"></section><section class="section hidden" id="continueSection"></section><section class="section" id="episodesSection"></section><section class="section" id="chatSection"></section><section class="section hidden" id="creatorSection"></section></div>
</main>
<script>
(()=>{"use strict";
const cfg=window.CROW_CONFIG||{},qs=new URLSearchParams(location.search),requestedId=(qs.get("id")||qs.get("podcast_id")||"").trim();
const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),wait=(p,ms=12000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error("Supabase request timed out.")),ms))]);
let sb=null,user=null,podcast=null,podcastId=null,episodes=[],progress={},rooms=[],activeRoom=null,chatChannel=null,presenceChannel=null,authSub=null,rt=[],busy=false;
async function client(){if(sb)return sb;if(window.CROW_SUPABASE)sb=window.CROW_SUPABASE;if(!sb&&window.CROW_BOOTSTRAP){try{sb=await wait(window.CROW_BOOTSTRAP(),10000)}catch(e){console.warn(e)}}if(!sb&&window.supabase?.createClient&&cfg.supabaseUrl&&cfg.supabaseKey)sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});if(!sb)throw Error("Supabase client could not be initialized.");return sb}
async function rows(table,filters={},select="*",limit){const c=await client();let q=c.from(table).select(select);for(const[k,v]of Object.entries(filters)){if(typeof v==="string"&&v.startsWith("eq."))q=q.eq(k,v.slice(3));else q=q.eq(k,v)}if(limit)q=q.limit(limit);const r=await wait(q);if(r.error)throw Error("Supabase "+table+": "+r.error.message);return r.data||[]}
async function getUser(){const c=await client();const r=await c.auth.getUser();return r.data?.user||null}
function errText(e){const m=e?.message||String(e);return /permission denied/i.test(m)?"You do not have permission to access this data.":/JWT|authentication/i.test(m)?"Your sign-in session has expired. Please sign in again.":m}
async function load(){if(!requestedId)throw Error("No podcast was specified.");const c=await client();const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(requestedId);let q=c.from("podcasts").select("id,title,slug,category,description,artwork_url,author_name,language,is_live,listener_count,status,creator_id").eq("status","published");q=uuid?q.eq("id",requestedId):q.eq("slug",requestedId);const p=await wait(q.maybeSingle());if(p.error)throw Error("Podcast lookup failed: "+p.error.message);if(!p.data)throw Error("This podcast is unavailable or not published.");podcast=p.data;podcastId=p.data.id;document.title=podcast.title+" — CrowRules Podcasting";user=await getUser();const e=await wait(c.from("podcast_episodes").select("id,title,slug,description,episode_number,season_number,published_at,duration_seconds,audio_url,video_url,thumbnail_url,play_count,status,access_level").eq("podcast_id",podcastId).eq("status","published").order("published_at",{ascending:false}));if(e.error)throw Error("Episode lookup failed: "+e.error.message);episodes=e.data||[];try{progress={};if(user){const p=await rows("podcast_episode_progress",{user_id:"eq."+user.id},"episode_id,percent_complete,completed,last_played_at",12);p.forEach(x=>progress[x.episode_id]=x)}}catch{}try{rooms=await rows("podcast_chat_rooms",{podcast_id:"eq."+podcastId},"id,podcast_id,slug,name,description,is_live,sort_order,created_at");}catch{rooms=[]}}
function hero(){const a=podcast.artwork_url||"assets/podcast-placeholder.svg";$("#hero").innerHTML='<section class="hero" style="background-image:url('+JSON.stringify(a)+');background-size:cover;background-position:center"><img class="hero-art" src="'+esc(a)+'" alt="'+esc(podcast.title)+' artwork"><div><div class="eyebrow">'+esc(podcast.category||"PODCAST")+'</div><h1 class="title">'+esc(podcast.title)+'</h1><div class="chips">'+(podcast.author_name?'<span class="chip">By '+esc(podcast.author_name)+'</span>':"")+(podcast.language?'<span class="chip">'+esc(String(podcast.language).toUpperCase())+'</span>':"")+(podcast.is_live?'<span class="chip live">● LIVE NOW</span>':"")+'</div><p class="desc">'+esc(podcast.description||"A CrowRules Podcasting show.")+'</p><div class="stats"><span id="rtStatus" class="chip">○ CONNECTING</span><span class="stat">♥ <b id="followers">—</b> followers</span><span class="stat">◆ <b id="subs">—</b> subscribers</span><span class="stat">▶ <b>'+Number(podcast.listener_count||0).toLocaleString()+'</b> listeners</span></div><div class="actions"><button id="follow" class="btn">Follow</button><button id="subscribe" class="btn primary">Subscribe</button><button id="share" class="btn">Share</button><a class="btn" href="podcasts.html">All Podcasts</a></div><div id="readiness" class="card readiness hidden"></div></div></section>'}
async function counts(){const c=await client();const [f,s]=await Promise.all([wait(c.from("podcast_follows").select("id",{count:"exact",head:true}).eq("podcast_id",podcastId)).catch(()=>({count:0})),wait(c.from("podcast_subscriptions").select("id",{count:"exact",head:true}).eq("podcast_id",podcastId).in("status",["active","trialing"])).catch(()=>({count:0}))]);$("#followers").textContent=Number(f.count||0).toLocaleString();$("#subs").textContent=Number(s.count||0).toLocaleString()}
async function product(){const p=await rows("cr_podcast_monetization_products",{podcast_id:"eq."+podcastId,product_type:"eq.membership",active:"eq.true"},"id,name,amount_cents,interval,active,product_type",1);if(!p[0])throw Error("This podcast does not have an active membership product yet.");return p[0]}
function badge(ok,label,value){return '<span class="status '+(ok?"ok":"bad")+'"><b>'+(ok?"✓":"●")+'</b> '+esc(label)+': '+esc(value)+'</span>'}
async function readiness(p){if(!user)return;const box=$("#readiness"),b=$("#subscribe");try{const c=await client(),r=await c.functions.invoke(cfg.membershipCheckoutFunction||"create-podcast-checkout",{body:{action:"readiness",product_id:p.id}});let d=r.data||{};if(r.error&&r.error.context){try{d=await r.error.context.clone().json()}catch{}}if(r.error||d.ready!==true){const checks=d.checks||{},caps=d.capabilities||{},req=d.requirements||{},blocks=Array.isArray(d.blockers)?d.blockers:[];box.classList.remove("hidden");box.innerHTML='<div class="eyebrow">SUBSCRIPTIONS</div><b>Stripe setup needs attention</b><div class="status-grid">'+badge(!!checks.charges_enabled,"Charges",checks.charges_enabled?"enabled":"not enabled")+badge(!!checks.card_payments,"Card payments",caps.card_payments||"unavailable")+badge(!!checks.transfers,"Transfers",caps.transfers||"unavailable")+badge(!!checks.payouts_enabled,"Payouts",checks.payouts_enabled?"enabled":"not enabled")+'</div>'+(req.currently_due?.length?'<div class="subtle" style="margin-top:7px"><b>Requirements:</b> '+esc(req.currently_due.join(", "))+'</div>':"")+(blocks[0]?'<div class="subtle" style="margin-top:7px"><b>Blocker:</b> '+esc(blocks[0])+'</div>':"")+'<a class="btn" style="margin-top:10px" href="creator-payouts.html?stripe_return=1">Continue Stripe Setup</a>';b.disabled=true;return}box.classList.remove("hidden");box.innerHTML='<div class="eyebrow">SUBSCRIPTIONS</div><b class="ok">✓ Stripe checkout is ready</b><div class="subtle" style="margin-top:5px">'+esc(p.name||"Membership")+' · $'+(Number(p.amount_cents||0)/100).toFixed(2)+' / '+esc(p.interval||"billing period")+'</div><div class="status-grid">'+badge(true,"Charges","enabled")+badge(true,"Card payments","active")+badge(true,"Transfers","active")+badge(true,"Payouts","enabled")+'</div>';b.disabled=false}catch(e){console.warn("Readiness:",e);box.classList.remove("hidden");box.innerHTML='<div class="eyebrow">SUBSCRIPTIONS</div><b>Stripe readiness check failed</b><div class="subtle" style="margin-top:6px">'+esc(errText(e))+'</div><button class="btn" id="recheck" style="margin-top:10px">Recheck</button>';$("#recheck").onclick=()=>readiness(p);b.disabled=false}}
async function checkout(){if(busy)return;if(!user){location.href="account.html?returnTo="+encodeURIComponent(location.href);return}const b=$("#subscribe");if(b.dataset.subscribed==="1"){location.href="subscriptions.html?podcast_id="+encodeURIComponent(podcastId);return}busy=true;b.disabled=true;b.classList.add("subscribe-busy");b.textContent="Connecting to Stripe…";try{const p=await product(),c=await client(),r=await c.functions.invoke(cfg.membershipCheckoutFunction||"create-podcast-checkout",{body:{action:"readiness",product_id:p.id}});let d=r.data||{};if(r.error&&r.error.context){try{d=await r.error.context.clone().json()}catch{}}if(r.error||d.ready!==true)throw Error(d.blockers?.[0]||d.error||r.error?.message||"Stripe subscription checkout is not ready yet.");const success=new URL(location.href);success.searchParams.set("checkout","success");const cancel=new URL(location.href);cancel.searchParams.set("checkout","cancelled");const x=await c.functions.invoke(cfg.membershipCheckoutFunction||"create-podcast-checkout",{body:{product_id:p.id,origin:cfg.siteUrl||location.origin+"/podcasting/",success_url:success.toString(),cancel_url:cancel.toString()}});if(x.error){let m=x.error.message||"Unable to start checkout.";try{if(x.error.context){const j=await x.error.context.clone().json();m=j.error||m;if(j.details?.blockers?.length)m=j.details.blockers[0]}}catch{}throw Error(m)}if(!x.data?.url)throw Error("Stripe Checkout did not return a URL.");location.href=x.data.url}catch(e){const box=$("#readiness");box.classList.remove("hidden");box.innerHTML='<div class="eyebrow">SUBSCRIPTIONS</div><b>Checkout could not start</b><div class="subtle" style="margin-top:6px">'+esc(errText(e))+'</div><button class="btn primary" id="retryCheckout" style="margin-top:10px">Try Again</button>';$("#retryCheckout").onclick=checkout;b.disabled=false;b.classList.remove("subscribe-busy");b.textContent="Subscribe"}finally{busy=false}}
async function bindHero(){const c=await client(),f=$("#follow"),b=$("#subscribe");try{if(user){const q=await c.from("podcast_follows").select("id").eq("podcast_id",podcastId).eq("user_id",user.id).maybeSingle();f.textContent=q.data?"Following":"Follow";const s=await c.from("podcast_subscriptions").select("id").eq("podcast_id",podcastId).eq("user_id",user.id).in("status",["active","trialing"]).maybeSingle();b.dataset.subscribed=s.data?"1":"0";b.textContent=s.data?"Subscribed":"Subscribe";const p=await product();readiness(p)}else{b.disabled=false}}catch(e){console.warn(e)}f.onclick=async()=>{if(!user){location.href="account.html?returnTo="+encodeURIComponent(location.href);return}f.disabled=true;const following=f.textContent==="Following";const q=following?await c.from("podcast_follows").delete().eq("podcast_id",podcastId).eq("user_id",user.id):await c.from("podcast_follows").insert({podcast_id:podcastId,user_id:user.id});if(q.error&&q.error.code!=="23505")alert(q.error.message);f.textContent=following?"Follow":"Following";f.disabled=false;counts()};b.onclick=checkout;$("#share").onclick=async()=>{try{if(navigator.share)await navigator.share({title:podcast.title,text:"Listen on CrowRules Podcasting",url:location.href});else{await navigator.clipboard.writeText(location.href);$("#share").textContent="Copied!"}}catch{}}}
function showReturn(){const s=new URLSearchParams(location.search).get("checkout");if(!s)return;const box=$("#readiness");box.classList.remove("hidden");box.innerHTML=s==="success"?'<div class="eyebrow">SUBSCRIPTION</div><b class="ok">✓ Checkout completed</b><div class="subtle" style="margin-top:6px">Stripe is confirming the subscription. Your subscriber status will update automatically.</div><a class="btn" style="margin-top:10px" href="subscriptions.html?podcast_id='+encodeURIComponent(podcastId)+'">Open My Subscriptions</a>':'<div class="eyebrow">SUBSCRIPTION</div><b>Checkout cancelled</b><div class="subtle" style="margin-top:6px">No subscription was created.</div>';const q=new URLSearchParams(location.search);q.delete("checkout");q.delete("session_id");history.replaceState({},document.title,location.pathname+(q.toString()?"?"+q:"")+location.hash)}
function featured(){const e=episodes[0];$("#featuredSection").innerHTML='<div class="section-head"><div><div class="eyebrow">NOW PLAYING</div><h2>Featured Episode</h2></div></div>'+(e?'<div class="featured"><div class="card"><img src="'+esc(e.thumbnail_url||podcast.artwork_url||"assets/podcast-placeholder.svg")+'" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px"><h2>'+esc(e.title)+'</h2><p class="desc">'+esc(e.description||"")+'</p><div class="player">'+(e.audio_url?'<audio controls preload="metadata" src="'+esc(e.audio_url)+'"></audio>':'<div class="subtle">Audio is not published yet.</div>')+'</div></div><div class="card"><div class="eyebrow">SHOW NOTES</div><p class="desc">'+esc(e.description||"No additional notes yet.")+'</p><a class="btn primary" href="episode.html?id='+encodeURIComponent(e.id)+'">Open Episode</a></div></div>':'<div class="card">No published episodes yet.</div>')}
function episodeList(){const sec=$("#episodesSection");sec.innerHTML='<div class="section-head"><div><div class="eyebrow">THE LIBRARY</div><h2>Episodes</h2><div class="subtle">'+episodes.length+' published episodes</div></div><input id="episodeSearch" class="search" placeholder="Search episodes…"></div><div id="episodeGrid" class="episode-grid"></div>';const draw=()=>{const q=$("#episodeSearch").value.toLowerCase();const list=episodes.filter(e=>(e.title+" "+(e.description||"")).toLowerCase().includes(q));$("#episodeGrid").innerHTML=list.map(e=>'<article class="card episode"><img src="'+esc(e.thumbnail_url||podcast.artwork_url||"assets/podcast-placeholder.svg")+'"><div class="eyebrow" style="margin-top:10px">EP '+esc(e.episode_number||"")+'</div><h3>'+esc(e.title)+'</h3><p class="subtle">'+esc(e.description||"")+'</p><a class="btn primary" href="episode.html?id='+encodeURIComponent(e.id)+'">Listen Now</a></article>').join("")||'<div class="card">No matching episodes.</div>'};$("#episodeSearch").oninput=draw;draw()}
function continueList(){const list=episodes.filter(e=>progress[e.id]&&!progress[e.id].completed).slice(0,6),sec=$("#continueSection");if(!user||!list.length){sec.classList.add("hidden");return}sec.classList.remove("hidden");sec.innerHTML='<div class="section-head"><div><div class="eyebrow">YOUR LIBRARY</div><h2>Continue Listening</h2></div></div><div class="episode-grid">'+list.map(e=>'<article class="card episode"><img src="'+esc(e.thumbnail_url||podcast.artwork_url||"assets/podcast-placeholder.svg")+'"><h3>'+esc(e.title)+'</h3><p class="subtle">'+Math.round(Number(progress[e.id].percent_complete||0))+'% complete</p><a class="btn" href="episode.html?id='+encodeURIComponent(e.id)+'">Continue</a></article>').join("")+'</div>'}
async function chat(){const sec=$("#chatSection");sec.innerHTML='<div class="section-head"><div><div class="eyebrow">COMMUNITY</div><h2>Live Chat</h2><div class="subtle">Realtime chat when rooms are available.</div></div></div><div class="chat-layout"><aside class="rooms"><div id="rooms"></div></aside><div class="chat"><div class="chat-head"><div><b id="roomTitle">Live Chat</b><div id="roomDesc" class="subtle"></div></div><div id="online" class="live">● 0 online</div></div><div id="messages" class="messages"></div><div class="compose"><input id="chatInput" maxlength="1000" placeholder="'+(user?"Write a message…":"Sign in to chat…")+'"><button id="send" class="btn primary">Send</button></div></div></div>';renderRooms();if(rooms[0])await roomSelect(rooms[0].id);else{$("#messages").innerHTML='<div class="subtle">Chat rooms are unavailable. The podcast is still available.</div>';$("#chatInput").disabled=true}$("#send").onclick=send;$("#chatInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();send()}}}
function renderRooms(){const b=$("#rooms");if(!rooms.length){b.innerHTML='<div class="subtle">No chat rooms available.</div>';return}b.innerHTML=rooms.map(r=>'<button class="room '+(activeRoom?.id===r.id?"active":"")+'" data-room="'+esc(r.id)+'"><b>'+esc(r.name)+'</b><small>'+(r.is_live?"🔴 Live":"Offline")+' · '+esc(r.description||"Community")+'</small></button>').join("");b.querySelectorAll("[data-room]").forEach(x=>x.onclick=()=>roomSelect(x.dataset.room))}
async function roomSelect(id){if(chatChannel)try{await chatChannel.unsubscribe()}catch{}if(presenceChannel)try{await presenceChannel.unsubscribe()}catch{}activeRoom=rooms.find(r=>r.id===id);if(!activeRoom)return;renderRooms();$("#roomTitle").textContent=activeRoom.name;$("#roomDesc").textContent=activeRoom.description||"";try{const m=await rows("podcast_chat_messages",{room_id:"eq."+id,is_hidden:false},"id,display_name,message,created_at",100);$("#messages").innerHTML=m.length?m.map(x=>'<div class="msg"><div class="msg-top">'+esc(x.display_name||"Member")+' <span class="msg-time">'+new Date(x.created_at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+'</span></div><div class="msg-body">'+esc(x.message)+'</div></div>').join(""):'<div class="subtle">No messages yet.</div>'}catch(e){$("#messages").innerHTML='<div class="subtle">'+esc(errText(e))+'</div>'}const c=await client();chatChannel=c.channel("podcast-chat-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"podcast_chat_messages",filter:"room_id=eq."+id},p=>{if(!p.new.is_hidden){const el=document.createElement("div");el.className="msg";el.innerHTML='<div class="msg-top">'+esc(p.new.display_name||"Member")+'</div><div class="msg-body">'+esc(p.new.message)+'</div>';$("#messages").appendChild(el)}}).subscribe();presenceChannel=c.channel("podcast-presence-"+id,{config:{presence:{key:user?.id||crypto.randomUUID()}}}).on("presence",{event:"sync"},()=>$("#online").textContent="● "+Object.keys(presenceChannel.presenceState()).length+" online").subscribe(async s=>{if(s==="SUBSCRIBED")try{await presenceChannel.track({user_id:user?.id||null})}catch{}})}
async function send(){const input=$("#chatInput"),text=input.value.trim();if(!text)return;if(!user){location.href="account.html?returnTo="+encodeURIComponent(location.href);return}if(!activeRoom)return;const c=await client(),name=user.user_metadata?.full_name||user.email?.split("@")[0]||"Member",r=await c.from("podcast_chat_messages").insert({room_id:activeRoom.id,user_id:user.id,display_name:name,message:text,is_hidden:false});if(r.error)alert(r.error.message);else input.value=""}
async function creator(){if(!user||podcast.creator_id!==user.id)return;const sec=$("#creatorSection");sec.classList.remove("hidden");sec.innerHTML='<div class="card"><div class="eyebrow">CREATOR VIEW</div><h2>Podcast Studio</h2><p class="subtle">You are viewing your podcast as its creator.</p><div class="actions"><a class="btn" href="creator-dashboard.html?podcast_id='+encodeURIComponent(podcastId)+'">Creator Studio</a><a class="btn primary" href="create-episode.html?podcast_id='+encodeURIComponent(podcastId)+'">Create Episode</a><a class="btn" href="creator-payouts.html">Creator Payouts</a></div></div>'}
function realtime(){const c=sb;if(!c)return;rt.forEach(x=>{try{c.removeChannel(x)}catch{}});rt=[];const base="podcast-page-"+podcastId;const p=c.channel(base+"-all").on("postgres_changes",{event:"UPDATE",schema:"public",table:"podcasts",filter:"id=eq."+podcastId},x=>{podcast={...podcast,...x.new};document.title=podcast.title+" — CrowRules Podcasting";hero();bindHero()}).on("postgres_changes",{event:"*",schema:"public",table:"podcast_episodes",filter:"podcast_id=eq."+podcastId},async()=>{try{const c=await client(),e=await wait(c.from("podcast_episodes").select("id,title,slug,description,episode_number,published_at,duration_seconds,audio_url,thumbnail_url,play_count,status").eq("podcast_id",podcastId).eq("status","published").order("published_at",{ascending:false}));if(!e.error){episodes=e.data||[];featured();episodeList();continueList()}}catch{}}).on("postgres_changes",{event:"*",schema:"public",table:"podcast_follows",filter:"podcast_id=eq."+podcastId},counts).on("postgres_changes",{event:"*",schema:"public",table:"podcast_subscriptions",filter:"podcast_id=eq."+podcastId},counts).subscribe(s=>{if(s==="SUBSCRIBED"){$("#rtStatus").textContent="● LIVE SYNC";$("#rtStatus").className="chip live"}});rt.push(p)}
async function auth(){const c=await client();if(!c.auth)return;try{authSub?.unsubscribe?.()}catch{}authSub=c.auth.onAuthStateChange(async(_e,s)=>{user=s?.user||null;try{progress={};if(user){const p=await rows("podcast_episode_progress",{user_id:"eq."+user.id},"episode_id,percent_complete,completed",12);p.forEach(x=>progress[x.episode_id]=x)}}catch{}continueList();bindHero();chat();creator()}).data?.subscription||null}
async function boot(){try{await load();hero();featured();continueList();episodeList();await chat();await bindHero();await counts();realtime();await creator();await auth();$("#loading").classList.add("hidden");$("#app").classList.remove("hidden");showReturn()}catch(e){console.error(e);$("#loading").classList.add("hidden");$("#error").classList.remove("hidden");$("#errorText").textContent=errText(e)}}
$("#retry").onclick=()=>location.reload();boot();
})();
</script>
