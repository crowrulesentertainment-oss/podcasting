<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b">
<title>Podcast — CrowRules Podcasting</title>
<link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/app.js" defer></script>
<style>
.show-page{padding:44px 0 90px}.show-hero{display:grid;grid-template-columns:320px 1fr;gap:38px;align-items:center;padding:34px;border:1px solid rgba(255,255,255,.08);border-radius:28px;background:linear-gradient(135deg,rgba(20,20,35,.96),rgba(5,5,11,.98))}.show-art{width:100%;aspect-ratio:1;border-radius:22px;object-fit:cover;background:#10101a}.show-title{font-size:clamp(2.6rem,6vw,5.5rem);line-height:.95;margin:.15em 0}.show-description,.episode-desc{color:rgba(255,255,255,.68);line-height:1.7}.show-meta,.show-actions,.episode-meta{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.pill{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.07);font-size:.78rem;color:rgba(255,255,255,.72)}.episode-section{margin-top:54px}.episode-card{display:grid;grid-template-columns:180px 1fr;gap:22px;padding:18px;margin-bottom:18px;border-radius:22px}.episode-art{width:180px;aspect-ratio:1;border-radius:16px;object-fit:cover}.loading-state,.empty-state{text-align:center;padding:80px 20px}.section-heading{margin-bottom:20px}.section-heading h2{font-size:2rem}@media(max-width:800px){.show-hero{grid-template-columns:1fr;padding:22px}.show-art{max-width:300px;margin:auto}.episode-card{grid-template-columns:1fr}.episode-art{width:100%;max-width:220px}}
</style></head>
<body><div data-nav></div><main class="wrap show-page">
<div id="loading" class="loading-state">Loading podcast…</div><section id="show" hidden></section><section id="episodeSection" class="episode-section" hidden><div class="section-heading"><div class="eyebrow">THE SHOW</div><h2>Latest Episodes</h2><span id="episodeCount" class="pill"></span></div><div id="episodes"></div></section>
</main>
<script>
(()=>{"use strict";
const cfg=window.CROW_CONFIG||{},id=new URLSearchParams(location.search).get("id");
const loading=document.getElementById("loading"),show=document.getElementById("show"),section=document.getElementById("episodeSection"),episodes=document.getElementById("episodes"),count=document.getElementById("episodeCount");
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const timeout=(p,ms=8000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error("Supabase request timed out.")),ms))]);
async function rest(table,params){const u=cfg.supabaseUrl+"/rest/v1/"+table+"?"+new URLSearchParams(params);const r=await timeout(fetch(u,{headers:{apikey:cfg.supabaseKey,Authorization:"Bearer "+cfg.supabaseKey,Accept:"application/json"},cache:"no-store"}));if(!r.ok)throw Error("Supabase returned HTTP "+r.status);return r.json()}
function fail(e){loading.hidden=true;show.hidden=false;
  const subscribeBtn=document.getElementById("subscribeBtn");
  if(subscribeBtn)subscribeBtn.addEventListener("click",async()=>{subscribeBtn.disabled=true;subscribeBtn.textContent="Connecting to Stripe…";try{let sb=window.CROW_SUPABASE;if(!sb&&window.supabase&&cfg.supabaseUrl&&cfg.supabaseKey)sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});if(!sb)throw Error("Supabase is unavailable.");const {data:{session}}=await sb.auth.getSession();if(!session){location.href="account.html?returnTo="+encodeURIComponent(location.href);return}const products=await rest("cr_podcast_monetization_products",{select:"id,amount_cents,interval",podcast_id:"eq."+p.id,product_type:"eq.membership",active:"eq.true"});const product=products[0];if(!product)throw Error("This podcast does not have an active Stripe subscription yet.");const result=await sb.functions.invoke("create-podcast-checkout",{body:{product_id:product.id,origin:cfg.siteUrl,success_url:cfg.siteUrl+"podcast.html?id="+encodeURIComponent(p.id)+"&checkout=success",cancel_url:cfg.siteUrl+"podcast.html?id="+encodeURIComponent(p.id)+"&checkout=canceled"}});if(result.error)throw result.error;if(result.data?.url){location.href=result.data.url;return}throw Error(result.data?.error||"Stripe Checkout did not return a URL.");}catch(e){alert(e.message||"Unable to start subscription.");subscribeBtn.disabled=false;subscribeBtn.textContent="Subscribe — $9.99/mo";}});show.innerHTML='<div class="card empty-state"><div class="eyebrow">CONNECTION ISSUE</div><h2>Podcast could not load</h2><p>'+esc(e?.message||"Please try again.")+'</p><a class="btn primary" href="podcasts.html">Back to Podcasts</a><button class="btn" onclick="location.reload()">Retry</button></div>'}
async function load(){
 if(!id){fail(Error("No podcast was specified."));return}
 try{
  const rows=await rest("podcasts",{select:"id,title,slug,category,description,artwork_url,author_name,language,explicit_content,is_live,listener_count,status",id:"eq."+id,status:"eq.published"});
  const p=rows[0];if(!p){fail(Error("This podcast is unavailable."));return}
  document.title=p.title+" — CrowRules Podcasting";
  show.innerHTML='<div class="show-hero"><img class="show-art" src="'+esc(p.artwork_url||"assets/podcast-placeholder.svg")+'" alt="'+esc(p.title)+' artwork"><div><div class="eyebrow">'+esc(p.category||"PODCAST")+'</div><h1 class="show-title">'+esc(p.title)+'</h1><div class="show-meta">'+(p.author_name?'<span class="pill">By '+esc(p.author_name)+'</span>':"")+(p.language?'<span class="pill">'+esc(p.language.toUpperCase())+'</span>':"")+(p.is_live?'<span class="pill">● Live</span>':"")+'</div><p class="show-description">'+esc(p.description||"A CrowRules Podcasting show.")+'</p><div class="show-actions"><button id="subscribeBtn" class="btn primary" type="button">Subscribe — $9.99/mo</button><a class="btn" href="podcasts.html">All Podcasts</a><a class="btn" href="discover.html">Explore</a></div></div></div>';
  loading.hidden=true;show.hidden=false;
  let eps=[];try{eps=await rest("podcast_episodes",{select:"id,title,description,episode_number,season_number,published_at,duration_seconds,thumbnail_url,play_count,status",podcast_id:"eq."+p.id,status:"eq.published",order:"published_at.desc"});}catch(e){console.warn(e)}
  section.hidden=false;count.textContent=eps.length+" "+(eps.length===1?"episode":"episodes");
  if(!eps.length){episodes.innerHTML='<div class="card empty-state"><div class="eyebrow">COMING SOON</div><h3>No published episodes yet.</h3></div>';return}
  episodes.innerHTML=eps.map(e=>'<article class="card episode-card"><img class="episode-art" src="'+esc(e.thumbnail_url||p.artwork_url||"assets/podcast-placeholder.svg")+'" alt="'+esc(e.title)+' artwork"><div><div class="eyebrow">'+esc(e.episode_number?"EPISODE "+e.episode_number:"EPISODE")+'</div><h3>'+esc(e.title)+'</h3><div class="episode-meta">'+(e.published_at?'<span class="pill">'+new Date(e.published_at).toLocaleDateString()+'</span>':"")+(e.duration_seconds?'<span class="pill">'+Math.round(Number(e.duration_seconds)/60)+" min</span>":"")+'</div><p class="episode-desc">'+esc(e.description||"Listen to this episode of "+p.title+".")+'</p><a class="btn primary" href="episode.html?id='+encodeURIComponent(e.id)+'">Listen Now</a></div></article>').join("")
 }catch(e){fail(e)}
}
load();
})();
</script></body></html>
