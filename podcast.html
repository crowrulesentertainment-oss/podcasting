<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcast | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/global-navigation.css">
<link rel="stylesheet" href="css/site.css"></head><body><main class="page"><div id="app" class="hero"><span class="eyebrow">PODCAST</span><h1>LOADING <span>SHOW.</span></h1><p>Connecting to CrowRules…</p></div><section id="episodes" class="grid"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/domain-service-loader.js" defer></script>
<script src="js/global-navigation.js" defer></script>
<script>(async()=>{const q=new URLSearchParams(location.search),id=q.get("id"),slug=q.get("slug"),app=document.getElementById("app"),out=document.getElementById("episodes");const esc=s=>String(s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));try{const db=supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabaseAnonKey);let r=id?await db.from("podcasts").select("id,title,slug,description,category").eq("id",id).eq("status","published").maybeSingle():await db.from("podcasts").select("id,title,slug,description,category").eq("slug",slug).eq("status","published").maybeSingle();if(r.error||!r.data)throw r.error||new Error("not found");const p=r.data;app.innerHTML='<span class="eyebrow">'+esc(p.category||"PODCAST")+'</span><h1>'+esc(p.title)+'</h1><p>'+esc(p.description||"")+'</p><div class="actions"><a class="btn" href="podcasts.html">ALL PODCASTS</a></div>';const e=await db.from("episodes").select("id,title,description,published_at").eq("podcast_id",p.id).eq("status","published").order("published_at",{ascending:false}).limit(60);if(e.error)throw e.error;out.innerHTML=(e.data||[]).map(x=>'<article class="card"><h2>'+esc(x.title)+'</h2><p>'+esc(x.description||"")+'</p></article>').join("")||'<div class="status">No published episodes yet.</div>'}catch(e){app.innerHTML='<span class="eyebrow">PODCAST</span><h1>SHOW <span>UNAVAILABLE.</span></h1><p>The requested podcast could not be loaded.</p><div class="actions"><a class="btn primary" href="podcasts.html">BACK TO PODCASTS</a></div>'}})();</script></body></html>
