<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Podcast | CrowRules Podcasting</title>
<meta name="description" content="Listen to a CrowRules Podcast, explore episodes, follow the show and discover its creator.">
<meta name="theme-color" content="#05050b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="css/crowrules-cinematic.css">
<style>
.show-shell{max-width:1180px;margin:auto}.show-hero{padding:70px 0 35px}.show-card{display:grid;grid-template-columns:300px 1fr;gap:36px;padding:34px;border:1px solid rgba(255,255,255,.1);border-radius:30px;background:linear-gradient(145deg,rgba(9,12,25,.96),rgba(35,17,58,.88));box-shadow:0 30px 90px rgba(0,0,0,.3)}.show-art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:24px;background:#10102a}.kicker{color:#00e5ff;font:900 .72rem Orbitron;letter-spacing:.16em;text-transform:uppercase}.show-title{font:900 clamp(2.2rem,6vw,5.4rem)/.95 Orbitron;margin:12px 0}.show-desc{color:#b8c0d4;line-height:1.8;max-width:800px}.show-meta{display:flex;gap:12px;flex-wrap:wrap;color:#9da5bd;font-size:.78rem;margin:20px 0}.pill{padding:7px 11px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.04)}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{cursor:pointer}.section{padding:28px 0 70px}.section-head{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:18px}.section-head h2{font:900 1.6rem Orbitron;margin:0}.section-head p{color:#9da5bd;margin:6px 0 0}.episode-list{display:grid;gap:12px}.episode{display:grid;grid-template-columns:100px 1fr auto;gap:18px;align-items:center;padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:20px;background:rgba(255,255,255,.035);transition:.2s}.episode:hover{border-color:rgba(0,229,255,.3);transform:translateY(-2px)}.episode img{width:100px;height:100px;object-fit:cover;border-radius:15px;background:#11112a}.episode-num{color:#00e5ff;font:900 .68rem Orbitron;text-transform:uppercase}.episode h3{margin:5px 0;font-weight:900}.episode p{color:#9da5bd;font-size:.8rem;line-height:1.5;margin:0}.episode-action{white-space:nowrap}.creator{padding:24px;border:1px solid rgba(255,255,255,.08);border-radius:22px;background:rgba(255,255,255,.025)}.creator-name{font:900 1.1rem Orbitron}.creator-bio{color:#9da5bd;line-height:1.7}.empty{padding:35px;text-align:center;color:#9da5bd;border:1px dashed rgba(255,255,255,.12);border-radius:20px}.live{color:#36e29b}@media(max-width:800px){.show-card{grid-template-columns:1fr}.show-art{max-width:300px}.episode{grid-template-columns:75px 1fr}.episode img{width:75px;height:75px}.episode-action{grid-column:2}.show-shell{width:92%}}
</style>
</head>
<body data-crowrules-division="podcasting">
<header class="nav"><a class="brand" href="index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header>
<main class="show-shell">
<section class="show-hero"><div id="showCard" class="show-card"><img id="art" class="show-art" alt="Podcast artwork"><div><div id="kicker" class="kicker">PODCAST SHOW</div><h1 id="title" class="show-title">Loading…</h1><div id="description" class="show-desc"></div><div id="meta" class="show-meta"></div><div class="actions"><button id="follow" class="btn" type="button">Follow Show</button><a class="btn secondary" href="podcasts.html">Browse Podcasts</a></div></div></div></section>
<section class="section"><div class="section-head"><div><h2>EPISODES</h2><p id="episodeCount">Loading episodes…</p></div></div><div id="episodes" class="episode-list"><div class="empty">Loading the show library…</div></div></section>
<section class="section"><div class="section-head"><div><h2>CREATOR</h2><p>The person behind this show.</p></div></div><div id="creator" class="creator"><div class="empty">Loading creator information…</div></div></section>
</main>
<footer class="footer">CrowRules Podcasting · Listen. Create. Share.</footer>
<script src="assets/js/supabase.js"></script><script src="assets/js/crowrules-player.js"></script><script src="js/crowrules-membership.js"></script><script src="js/crowrules-cinematic.js"></script>
<script>
(async()=>{
const sb=window.crowSupabase;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const num=n=>new Intl.NumberFormat("en-US").format(Number(n||0));
const date=v=>v?new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric",year:"numeric"}).format(new Date(v)):"";
const p=new URLSearchParams(location.search);const key=p.get("id")||p.get("podcast")||p.get("slug");
if(!key){document.getElementById("title").textContent="Podcast not specified";return}
let q=sb.from("podcasts").select("*").limit(1);
q=key.match(/^[0-9a-f-]{36}$/i)?q.eq("id",key):q.eq("slug",key);
const {data:show,error}=await q.maybeSingle();
if(error||!show){document.getElementById("title").textContent="Podcast not found";document.getElementById("description").textContent="Return to the podcast library and choose a show.";return}
document.title=(show.title||"Podcast")+" | CrowRules Podcasting";
document.getElementById("title").textContent=show.title||"Untitled Podcast";
document.getElementById("description").textContent=show.description||"A CrowRules Podcasting show.";
document.getElementById("art").src=show.artwork_url||"";
document.getElementById("kicker").innerHTML=(show.is_live?'<span class="live">● LIVE SIGNAL</span> · ':'')+esc(show.category||"PODCAST SHOW");
document.getElementById("meta").innerHTML='<span class="pill">▶ '+num(show.total_plays)+' plays</span><span class="pill">🎧 '+num(show.listener_count)+' listeners</span><span class="pill">'+(show.is_featured?"⭐ Featured":"Independent Show")+'</span>';
const er=await sb.from("podcast_episodes").select("id,title,slug,description,episode_number,season_number,published_at,duration_seconds,thumbnail_url,audio_url,status,play_count").eq("podcast_id",show.id).eq("status","published").order("published_at",{ascending:false});
const episodes=er.data||[];document.getElementById("episodeCount").textContent=episodes.length+" published episode"+(episodes.length===1?"":"s");
document.getElementById("episodes").innerHTML=episodes.length?episodes.map((e,i)=>'<article class="episode"><img src="'+esc(e.thumbnail_url||show.artwork_url||"")+'" alt="" loading="lazy"><div><div class="episode-num">S'+(e.season_number||1)+' · E'+(e.episode_number||episodes.length-i)+'</div><h3>'+esc(e.title||"Untitled Episode")+'</h3><p>'+esc(e.description||"Listen to this episode of "+show.title+".")+'</p><p>'+date(e.published_at)+(e.duration_seconds?" · "+Math.round(e.duration_seconds/60)+" min":"")+" · "+num(e.play_count)+" plays</p></div><div class="episode-action"><a class="btn" href="episode.html?id='+encodeURIComponent(e.id)+'">Listen</a></div></article>').join(""):'<div class="empty">No published episodes yet.</div>';
const {data:u}=await sb.auth.getUser();let followed=false;
if(u.user){const f=await sb.from("podcast_follows").select("id").eq("user_id",u.user.id).eq("podcast_id",show.id).maybeSingle();followed=!!f.data}
const fb=document.getElementById("follow");fb.textContent=followed?"Following ✓":"Follow Show";
fb.onclick=async()=>{const {data:user}=await sb.auth.getUser();if(!user){location.href="login.html";return}if(followed){const r=await sb.from("podcast_follows").delete().eq("user_id",user.user.id).eq("podcast_id",show.id);if(!r.error){followed=false;fb.textContent="Follow Show"}}else{const r=await sb.from("podcast_follows").upsert({user_id:user.user.id,podcast_id:show.id},{onConflict:"user_id,podcast_id"});if(!r.error){followed=true;fb.textContent="Following ✓"}}};
let creator=null;if(show.creator_id){const cr=await sb.from("podcast_member_profiles").select("display_name,username,bio,avatar_url,badge,is_public").eq("user_id",show.creator_id).maybeSingle();creator=cr.data}
document.getElementById("creator").innerHTML=creator?'<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'+(creator.avatar_url?'<img src="'+esc(creator.avatar_url)+'" alt="" style="width:76px;height:76px;border-radius:50%;object-fit:cover">':'')+'<div><div class="creator-name">'+esc(creator.display_name||creator.username||"CrowRules Creator")+'</div><div class="creator-bio">'+esc(creator.bio||"Creator on CrowRules Podcasting.")+'</div></div></div>':'<div class="empty">Creator profile information is not public yet.</div>';
})();
</script>
</body>
</html>
