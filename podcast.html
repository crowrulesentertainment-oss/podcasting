<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05050b"><title>Podcast | CrowRules Podcasting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/podcasting.css">
<style>
:root{--bg:#05050b;--panel:#0d0f1b;--line:rgba(255,255,255,.1);--text:#f7f8ff;--muted:#9da4bd;--cyan:#42e8ff;--purple:#9a6cff;--pink:#ff4fd8}
*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Montserrat,Arial,sans-serif;background:radial-gradient(circle at 15% 10%,rgba(66,232,255,.1),transparent 28%),radial-gradient(circle at 85% 15%,rgba(154,108,255,.12),transparent 30%),linear-gradient(180deg,#03040a,#080a14 55%,#04050a)}a{color:inherit;text-decoration:none}
.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.page{padding:105px 0 70px}.hero{display:grid;grid-template-columns:360px 1fr;gap:34px;align-items:center}.art{aspect-ratio:1;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#11162a;box-shadow:0 30px 90px #0008}.art img{width:100%;height:100%;object-fit:cover}.fallback{height:100%;display:grid;place-items:center;font:800 48px Orbitron;color:var(--cyan);background:radial-gradient(circle at 30% 20%,#42e8ff40,transparent 30%),radial-gradient(circle at 70% 80%,#ff4fd833,transparent 30%)}.eyebrow,.chip{display:inline-block;padding:7px 11px;border:1px solid #42e8ff44;border-radius:999px;color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.08em}.hero h1{font:800 clamp(34px,6vw,68px)/1.05 Orbitron;margin:16px 0}.hero h1 span{background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}.desc{color:var(--muted);font-size:15px;line-height:1.8}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#ffffff0d;font-size:11px;font-weight:800;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#05050b}.subscribe{border:0;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff}.section{margin-top:32px;padding:24px;border:1px solid var(--line);border-radius:22px;background:#0d0f1bcc}.section h2{font:700 18px Orbitron;margin:0 0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.stat{padding:12px;border:1px solid var(--line);border-radius:14px;background:#ffffff09}.stat b{display:block;font:700 17px Orbitron}.stat small{color:var(--muted);font-size:9px}.creator{display:flex;gap:12px;align-items:center;margin:20px 0}.creator img,.creator-mark{width:42px;height:42px;border-radius:50%;object-fit:cover}.creator-mark{display:grid;place-items:center;background:#10152a;color:var(--cyan);font-weight:800}.creator small{display:block;color:var(--muted);font-size:9px}.creator b{font-size:12px}.episode{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}.episode:first-child{border-top:0}.episode-left{display:flex;gap:13px;min-width:0}.episode-art{width:70px;height:70px;border-radius:13px;object-fit:cover;background:#121528;flex:none}.episode h3{margin:0 0 6px;font-size:14px}.episode p{margin:0;color:var(--muted);font-size:10px;line-height:1.6}.premium{display:inline-block;margin-left:6px;padding:3px 6px;border-radius:999px;color:#ff9ce9;border:1px solid #ff4fd844;font-size:8px}.membership{display:flex;justify-content:space-between;align-items:center;gap:20px}.price{font:800 22px Orbitron}.price small{font:500 9px Montserrat;color:var(--muted)}.error,.loading{min-height:70vh;display:grid;place-content:center;justify-items:center;gap:9px;color:var(--muted);text-align:center}.error strong,.loading strong{font:700 18px Orbitron;color:var(--text)}.spinner{width:34px;height:34px;border:2px solid #fff2;border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.hero{grid-template-columns:1fr}.art{max-width:420px;margin:auto}.stats{grid-template-columns:1fr 1fr}.membership{flex-direction:column;align-items:flex-start}.episode{align-items:flex-start}.episode-art{width:60px;height:60px}}
</style></head>
<body data-cr-no-monetization-strip>
<div id="app"><div class="loading"><div class="spinner"></div><strong>LOADING PODCAST</strong><span>Connecting to CrowRules…</span></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/global-navigation.js"></script>
<script>
(()=>{"use strict";
const cfg=window.CROWRULES_CONFIG||{},app=document.getElementById("app"),db=window.supabase&&cfg.supabaseUrl&&cfg.supabaseAnonKey?window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true} }):null;
const q=new URLSearchParams(location.search),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const money=(n,c="usd")=>new Intl.NumberFormat(undefined,{style:"currency",currency:String(c).toUpperCase()}).format((Number(n)||0)/100);const dur=n=>{n=Number(n||0);if(!n)return"—";const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?h+"h "+String(m).padStart(2,"0")+"m":m+"m "+String(s).padStart(2,"0")+"s"};
function fail(t,m){app.innerHTML='<div class="error"><strong>'+esc(t)+'</strong><span>'+esc(m)+'</span><a class="btn" href="podcasts.html">BACK TO PODCASTS</a></div>'}
async function load(){if(!db)return fail("Configuration error","The CrowRules data connection could not initialize.");
let pid=q.get("id")||q.get("podcast_id"),slug=q.get("slug")||(!pid?"bonded-in-mystery":null);
if(!pid&&slug){const r=await db.from("podcasts").select("id").eq("slug",slug).eq("status","published").maybeSingle();if(r.error)throw r.error;pid=r.data?.id;if(pid&&!q.get("slug"))history.replaceState(null,"","podcast.html?slug="+encodeURIComponent(slug))}
if(!pid)return fail("Podcast not found","Use a valid podcast ID or slug.");
const pR=await db.from("podcasts").select("id,title,slug,category,description,artwork_url,website_url,status,is_featured,is_live,listener_count,total_plays,creator_id").eq("id",pid).eq("status","published").maybeSingle();if(pR.error)throw pR.error;if(!pR.data)return fail("Podcast not found","This podcast is not published.");
const p=pR.data;const [cr,ep,prod]=await Promise.all([
db.from("creators").select("id,name,avatar_url").eq("id",p.creator_id).maybeSingle(),
db.from("podcast_episodes").select("id,title,description,episode_number,season_number,published_at,duration_seconds,thumbnail_url,play_count,access_level,status").eq("podcast_id",pid).eq("status","published").order("published_at",{ascending:false}),
db.from("cr_podcast_monetization_products").select("id,name,description,currency,amount_cents,interval,active").eq("podcast_id",pid).eq("product_type","membership").eq("active",true).order("created_at",{ascending:false}).limit(1).maybeSingle()
]);render(p,cr.data,ep.data||[],prod.data||null)}
function render(p,c,eps,prod){document.title=(p.title||"Podcast")+" | CrowRules Podcasting";const cover=p.artwork_url?'<img id="cover" src="'+esc(p.artwork_url)+'" alt="'+esc(p.title)+' cover artwork">':'<div class="fallback">CR</div>';const creator=c?'<div class="creator">'+(c.avatar_url?'<img src="'+esc(c.avatar_url)+'" alt="">':'<div class="creator-mark">CR</div>')+'<div><small>CREATED BY</small><b>'+esc(c.name)+'</b></div></div>':'';const cards=eps.map(e=>'<article class="episode"><div class="episode-left">'+(e.thumbnail_url?'<img class="episode-art" src="'+esc(e.thumbnail_url)+'" alt="">':'<div class="episode-art fallback" style="display:grid;font-size:20px">CR</div>')+'<div><h3>'+esc(e.title)+(e.access_level==="premium"?'<span class="premium">PREMIUM</span>':'')+'</h3><p>'+esc(e.episode_number?"Episode "+e.episode_number:"Episode")+(e.published_at?" · "+esc(new Date(e.published_at).toLocaleDateString()):"")+" · "+esc(dur(e.duration_seconds))+(Number(e.play_count)?" · "+esc(e.play_count)+" plays":"")+'</p><p>'+esc(e.description||"")+'</p></div></div><a class="btn" href="episode.html?id='+encodeURIComponent(e.id)+'">OPEN</a></article>').join("");
const member=prod?'<section class="section membership"><div><h2>'+esc(prod.name||"Podcast Membership")+'</h2><p class="desc">'+esc(prod.description||"Support this podcast and unlock premium access.")+'</p></div><div><div class="price">'+money(prod.amount_cents,prod.currency)+' <small>/ '+esc(prod.interval||"month")+'</small></div><a class="btn subscribe" href="support.html?podcast_id='+encodeURIComponent(p.id)+'" style="margin-top:10px;width:100%">SUBSCRIBE</a></div></section>':'';
app.innerHTML='<main class="page"><div class="wrap"><section class="hero"><div class="art">'+cover+'</div><div><span class="eyebrow">'+esc((p.category||"PODCAST").toUpperCase())+(p.is_live?" · LIVE":"")+'</span><h1><span>'+esc(p.title)+'</span></h1><p class="desc">'+esc(p.description||"No description yet.")+'</p>'+creator+'<div class="stats"><div class="stat"><b>'+eps.length+'</b><small>EPISODES</small></div><div class="stat"><b>'+esc(p.listener_count??0)+'</b><small>LISTENERS</small></div><div class="stat"><b>'+esc(p.total_plays??0)+'</b><small>PLAYS</small></div></div><div class="actions"><a class="btn subscribe" href="'+(prod?"support.html?podcast_id="+encodeURIComponent(p.id):"support.html")+'">'+(prod?"SUBSCRIBE · "+money(prod.amount_cents,prod.currency)+"/MO":"MEMBERSHIP")+'</a><button class="btn" id="share" type="button">↗ SHARE</button>'+(p.website_url?'<a class="btn primary" href="'+esc(p.website_url)+'" target="_blank" rel="noopener">WEBSITE</a>':'')+'<a class="btn" href="podcasts.html">← ALL PODCASTS</a></div><div id="shareStatus" style="color:var(--muted);font-size:10px;margin-top:8px"></div></div></section>'+member+'<section class="section"><h2>Episodes</h2>'+(cards||'<p class="desc">No published episodes are available yet.</p>')+'</section><section class="section"><h2>Keep Exploring</h2><div class="actions"><a class="btn primary" href="podcasts.html">PODCAST DIRECTORY</a><a class="btn" href="discover.html">DISCOVER</a><a class="btn" href="my-library.html">MY LIBRARY</a></div></section></div></main>';
const sh=document.getElementById("share"),ss=document.getElementById("shareStatus");sh.onclick=async()=>{try{if(navigator.share)await navigator.share({title:p.title,text:"Listen to "+p.title+" on CrowRules Podcasting.",url:location.href});else{await navigator.clipboard?.writeText(location.href);ss.textContent="Link copied."}}catch(e){if(e.name!=="AbortError")ss.textContent="Share unavailable."}}}
load().catch(e=>{console.error(e);fail("Unable to load podcast",e.message||"Please try again.")});
})();
</script></body></html>
