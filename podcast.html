<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05050b"><title>Podcast | CrowRules Podcasting</title>
<link rel="stylesheet" href="css/podcasting.css">
<link rel="stylesheet" href="css/global-navigation.css">
</head>
<body data-cr-no-monetization-strip>
<div id="app"><div class="loading"><div class="spinner"></div><strong>LOADING PODCAST</strong><span>Connecting to CrowRules…</span></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/member-state.js"></script><script src="js/member-actions.js"></script><script src="js/global-navigation.js"></script>
<script>
(()=>{"use strict";
const cfg=window.CROWRULES_CONFIG||{},app=document.getElementById("app"),db=window.supabase&&cfg.supabaseUrl&&cfg.supabaseAnonKey?window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true} }):null;
const q=new URLSearchParams(location.search),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const money=(n,c="usd")=>new Intl.NumberFormat(undefined,{style:"currency",currency:String(c).toUpperCase()}).format((Number(n)||0)/100);const dur=n=>{n=Number(n||0);if(!n)return"—";const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?h+"h "+String(m).padStart(2,"0")+"m":m+"m "+String(s).padStart(2,"0")+"s"};
function fail(t,m){app.innerHTML='<div class="error"><strong>'+esc(t)+'</strong><span>'+esc(m)+'</span><a class="btn" href="podcasts.html">BACK TO PODCASTS</a></div>'}
async function load(){if(!db)return fail("Configuration error","The CrowRules data connection could not initialize.");
let pid=q.get("id")||q.get("podcast_id"),slug=q.get("slug")||(!pid?"bonded-in-mystery":null);
if(!pid&&slug){const r=await db.from("podcasts").select("id").eq("slug",slug).eq("status","published").maybeSingle();if(r.error)throw r.error;pid=r.data?.id;if(pid&&!q.get("slug"))history.replaceState(null,"","podcast.html?slug="+encodeURIComponent(slug))}
if(!pid)return fail("Podcast not found","Use a valid podcast ID or slug.");
const pR=await db.from("podcasts").select("id,title,slug,category,description,artwork_url,website_url,status,is_featured,is_live,listener_count,total_plays,creator_id").eq("id",pid).eq("status","published").maybeSingle();if(pR.error)throw pR.error;if(!pR.data)return fail("Podcast not found","This podcast is not published.");
const p=pR.data;const [cr,ep,prod]=await Promise.all([
db.from("creators").select("id,name,avatar_url").eq("id",p.creator_id).maybeSingle(),
db.from("podcast_episodes").select("id,title,description,episode_number,season_number,published_at,duration_seconds,thumbnail_url,play_count,access_level,status").eq("podcast_id",pid).eq("status","published").order("published_at",{ascending:false}),
db.from("cr_podcast_monetization_products").select("id,name,description,currency,amount_cents,interval,active").eq("podcast_id",pid).eq("product_type","membership").eq("active",true).order("created_at",{ascending:false}).limit(1).maybeSingle()
]);render(p,cr.data,ep.data||[],prod.data||null)}
function render(p,c,eps,prod){
  document.title=(p.title||"Podcast")+" | CrowRules Podcasting";
  const cover=p.artwork_url
    ? '<img src="'+esc(p.artwork_url)+'" alt="'+esc(p.title)+' cover artwork">'
    : '<div class="fallback">CR</div>';
  const creator=c
    ? '<div class="showroom-creator">'+(c.avatar_url
      ? '<img src="'+esc(c.avatar_url)+'" alt="">'
      : '<div class="showroom-creator-mark">CR</div>')+
      '<div><small>CREATED BY</small><b>'+esc(c.name)+'</b></div></div>'
    : '';
  const tiles=eps.map(e=>{
    const art=e.thumbnail_url
      ? '<img src="'+esc(e.thumbnail_url)+'" alt="'+esc(e.title)+' artwork" loading="lazy">'
      : '<div class="fallback">CR</div>';
    const premium=e.access_level==="premium"
      ? '<span class="episode-tile-badge">PREMIUM</span>' : '';
    return '<article class="episode-tile">'+
      '<div class="episode-tile-art">'+art+premium+'</div>'+
      '<div class="episode-tile-body">'+
        '<h3>'+esc(e.title)+'</h3>'+
        '<div class="episode-tile-meta">'+
          esc(e.episode_number?"Episode "+e.episode_number:"Episode")+
          (e.published_at?" · "+esc(new Date(e.published_at).toLocaleDateString()):"")+
          " · "+esc(dur(e.duration_seconds))+
          (Number(e.play_count)?" · "+esc(e.play_count)+" plays":"")+
        '</div>'+
        '<p class="episode-tile-description">'+esc(e.description||"No description yet.")+'</p>'+
        '<div class="episode-tile-actions"><div class="episode-member-actions"><button class="btn member-action" type="button" data-save-episode="'+esc(e.id)+'">Save</button><button class="btn member-action" type="button" data-favorite-episode="'+esc(e.id)+'">Favorite</button></div><a class="btn" href="episode.html?id='+encodeURIComponent(e.id)+'">OPEN EPISODE</a></div>'+
      '</div></article>';
  }).join("");
  const member=prod
    ? '<section class="showroom-membership">'+
        '<div><h2>'+esc(prod.name||"Podcast Membership")+'</h2>'+
        '<p>'+esc(prod.description||"Support this podcast and unlock premium access.")+'</p></div>'+
        '<div><div class="showroom-membership-price">'+money(prod.amount_cents,prod.currency)+
        '<small>/ '+esc(prod.interval||"month")+'</small></div>'+
        '<a class="btn subscribe" href="support.html?podcast_id='+encodeURIComponent(p.id)+'">SUBSCRIBE</a></div>'+
      '</section>'
    : '';
  app.innerHTML='<main class="podcast-showroom"><div class="wrap">'+
    '<section class="showroom-hero"><div class="showroom-grid">'+
      '<div class="showroom-cover">'+cover+
        (p.is_live?'<span class="showroom-cover-badge">● LIVE NOW</span>':'')+
      '</div>'+
      '<div class="showroom-copy">'+
        '<div class="showroom-kicker">'+esc((p.category||"PODCAST").toUpperCase())+
          (p.is_featured?" · FEATURED":"")+'</div>'+
        '<h1><span>'+esc(p.title)+'</span></h1>'+
        '<p class="showroom-description">'+esc(p.description||"No description yet.")+'</p>'+
        creator+
        '<div class="showroom-actions member-showroom-actions">'+
          '<a class="btn subscribe" href="'+(prod?"support.html?podcast_id="+encodeURIComponent(p.id):"support.html")+'">'+(prod?"JOIN MEMBERSHIP":"MEMBERSHIP")+'</a>'+          '<button class="btn member-action" type="button" data-follow-podcast="'+esc(p.id)+'">Follow</button>'+
          '<button class="btn" id="share" type="button">↗ SHARE</button>'+
          (p.website_url?'<a class="btn primary" href="'+esc(p.website_url)+'" target="_blank" rel="noopener">WEBSITE</a>':'')+
          '<a class="btn" href="podcasts.html">ALL PODCASTS</a>'+
        '</div>'+
        '<div id="shareStatus" class="podcast-detail-share-status"></div>'+
      '</div>'+
      '<aside class="showroom-side">'+
        '<div class="showroom-stat"><b>'+eps.length+'</b><span>EPISODES</span></div>'+
        '<div class="showroom-stat"><b>'+esc(p.listener_count??0)+'</b><span>LISTENERS</span></div>'+
        '<div class="showroom-stat"><b>'+esc(p.total_plays??0)+'</b><span>TOTAL PLAYS</span></div>'+
      '</aside>'+
    '</div></section>'+
    (member?'<section class="showroom-section">'+member+'</section>':'')+
    '<section class="showroom-section">'+
      '<div class="showroom-section-head"><div><h2>Latest Episodes</h2><p>Explore the latest stories from '+esc(p.title)+'</p></div></div>'+
      (tiles?'<div class="episode-wall">'+tiles+'</div>':'<div class="showroom-empty"><strong>No published episodes yet</strong><span>New episodes will appear here when they are published.</span></div>')+
    '</section>'+
    '<section class="showroom-section"><div class="showroom-section-head"><div><h2>Explore CrowRules</h2><p>Keep discovering podcasts and member experiences.</p></div></div>'+
      '<div class="showroom-footer-nav"><a class="btn primary" href="podcasts.html">PODCAST DIRECTORY</a><a class="btn" href="discover.html">DISCOVER</a><a class="btn" href="my-library.html">MY LIBRARY</a><a class="btn" href="creators.html">CREATORS</a></div>'+
    '</section>'+
  '</div></main>';
  const sh=document.getElementById("share"),ss=document.getElementById("shareStatus");
  sh.onclick=async()=>{try{if(navigator.share)await navigator.share({title:p.title,text:"Listen to "+p.title+" on CrowRules Podcasting.",url:location.href});else{await navigator.clipboard?.writeText(location.href);ss.textContent="Link copied."}}catch(e){if(e.name!=="AbortError")ss.textContent="Share unavailable."}};
}
load().catch(e=>{console.error(e);fail("Unable to load podcast",e.message||"Please try again.")});
})();
</script></body></html>
