<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Podcast</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/podcasting-platform.css?v=1"><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=5" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script><script src="js/podcasting-config.js?v=1"></script><script src="js/podcasting-platform.js?v=1" defer></script><script src="js/podcasting-player.js?v=1" defer></script></head><body><main class="cr-shell"><section id="show" class="hero"></section><section class="section"><div class="section-head"><h2>Membership plans</h2><small>Creator-controlled pricing and benefits</small></div><div id="plans" class="grid"></div></section><section class="section"><div class="section-head"><h2>Episodes</h2></div><div id="episodes" class="grid"></div></section></main><div id="modal" class="modal"><div class="modal-box"><h2>Subscribe to this podcast</h2><p class="muted">Your CrowRules universal account is used for access and entitlement tracking.</p><div id="modalBody"></div><button class="btn" onclick="document.querySelector('#modal').classList.remove('open')">Close</button></div></div><script>let podcastId;document.addEventListener('crow:ready',async()=>{podcastId=new URLSearchParams(location.search).get('id');if(!podcastId){document.querySelector('#show').innerHTML='<div><h1>Podcast not specified.</h1></div>';return}const p=(await CrowPodcasting.rows('podcasts','*',{eq:{id:podcastId},limit:1}))[0]|| (await CrowPodcasting.rows('podcasting_podcast_directory','*',{eq:{id:podcastId},limit:1}))[0];if(!p)return;document.title='CrowRules Podcasting — '+p.title;document.querySelector('#show').innerHTML='<div><div class="eyebrow">'+CrowPodcasting.esc(p.category||'Podcast')+'</div><h1>'+CrowPodcasting.esc(p.title)+'</h1><p>'+CrowPodcasting.esc(p.description||'')+'</p><div class="notice">'+CrowPodcasting.fmt(p.listener_count||0)+' followers • '+CrowPodcasting.fmt(p.total_plays||0)+' plays</div></div><div class="hero-orb" style="background:url('+JSON.stringify(p.artwork_url||'')+') center/cover"><div class="orb-text">CROWRULES<br>PODCASTING</div></div>';const plans=await CrowPodcasting.rows('cr_podcast_monetization_products','*',{eq:{podcast_id:podcastId,product_type:'membership',active:true},order:'display_order',ascending:true});document.querySelector('#plans').innerHTML=plans.length?plans.map(x=>'<article class="card panel"><h3 style="font:700 17px Orbitron">'+CrowPodcasting.esc(x.name)+'</h3><p class="muted">'+CrowPodcasting.esc(x.description||'')+'</p><div style="font:800 27px Orbitron;margin:15px 0">$'+(Number(x.amount_cents||0)/100).toFixed(2)+' <span class="muted" style="font-size:11px">/'+CrowPodcasting.esc(x.interval||'month')+'</span></div><ul class="muted">'+(Array.isArray(x.features)?x.features.map(f=>'<li>'+CrowPodcasting.esc(f)+'</li>').join(''):'<li>Premium podcast access</li>')+'</ul><button class="btn primary" onclick="subscribe(\''+x.id+'\')">Subscribe</button></article>').join(''):'<div class="card panel">This creator currently offers free listening only.</div>';const eps=await CrowPodcasting.rows('podcast_episodes','id,title,description,audio_url,thumbnail_url,published_at,duration_seconds,status',{eq:{podcast_id:podcastId,status:'published'},order:'published_at',ascending:false,limit:50});document.querySelector('#episodes').innerHTML=eps.map(e=>'<article class="card pod-card"><div class="art" style="background-image:url('+JSON.stringify(e.thumbnail_url||p.artwork_url||'')+')"></div><div class="pod-body"><h3>'+CrowPodcasting.esc(e.title)+'</h3><p>'+CrowPodcasting.esc(e.description||'')+'</p><div class="pod-meta"><span>'+new Date(e.published_at||Date.now()).toLocaleDateString()+'</span><button class="btn" onclick=\'CrowPodcastPlayer.play('+JSON.stringify({...e,podcast_title:p.title}).replace(/'/g,"&#39;")+')\'>Play</button></div></div></article>').join('')||'<div class="card panel">No published episodes yet.</div>'});window.subscribe=async id=>{document.querySelector('#modal').classList.add('open');document.querySelector('#modalBody').innerHTML='<div class="notice">Creating secure Stripe checkout…</div>';try{const r=await CrowPodcasting.edge('podcast-subscription-checkout',{product_id:id,podcast_id:podcastId,origin:location.origin+location.pathname.replace(/[^/]*$/,'')});location.href=r.url}catch(e){document.querySelector('#modalBody').innerHTML='<div class="notice">'+CrowPodcasting.esc(e.message)+'</div>'}};</script></body></html>
