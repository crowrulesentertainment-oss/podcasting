<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05050b"><title>Podcast | CrowRules Podcasting</title>
<link rel="stylesheet" href="css/podcasting.css">
<link rel="stylesheet" href="css/global-navigation.css">
</head>
<body data-cr-no-monetization-strip>
<div id="app"><div class="loading"><div class="spinner"></div><strong>LOADING PODCAST</strong><span>Connecting to CrowRules…</span></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/member-state.js"></script><script src="js/member-actions.js"></script><script src="js/global-navigation.js"></script>
<script>
(()=>{"use strict";
const cfg=window.CROWRULES_CONFIG||{},app=document.getElementById("app"),db=window.supabase&&cfg.supabaseUrl&&cfg.supabaseAnonKey?window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true} }):null;
const q=new URLSearchParams(location.search),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const money=(n,c="usd")=>new Intl.NumberFormat(undefined,{style:"currency",currency:String(c).toUpperCase()}).format((Number(n)||0)/100);const dur=n=>{n=Number(n||0);if(!n)return"—";const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?h+"h "+String(m).padStart(2,"0")+"m":m+"m "+String(s).padStart(2,"0")+"s"};
function fail(t,m){app.innerHTML='<div class="error"><strong>'+esc(t)+'</strong><span>'+esc(m)+'</span><a class="btn" href="podcasts.html">BACK TO PODCASTS</a></div>'}
async function load(){if(!db)return fail("Configuration error","The CrowRules data connection could not initialize.");
let pid=q.get("id")||q.get("podcast_id"),slug=q.get("slug")||(!pid?"bonded-in-mystery":null);
if(!pid&&slug){const r=await db.from("podcasts").select("id").eq("slug",slug).eq("status","published").maybeSingle();if(r.error)throw r.error;pid=r.data?.id;if(pid&&!q.get("slug"))history.replaceState(null,"","podcast.html?slug="+encodeURIComponent(slug))}
if(!pid)return fail("Podcast not found","Use a valid podcast ID or slug.");
const pR=await db.from("podcasts").select("id,title,slug,category,description,artwork_url,website_url,status,is_featured,is_live,listener_count,total_plays,creator_id").eq("id",pid).eq("status","published").maybeSingle();if(pR.error)throw pR.error;if(!pR.data)return fail("Podcast not found","This podcast is not published.");
const p=pR.data;const [cr,ep,prod]=await Promise.all([
db.from("creators").select("id,name,avatar_url").eq("id",p.creator_id).maybeSingle(),
db.from("podcast_episodes").select("id,title,description,episode_number,season_number,published_at,duration_seconds,thumbnail_url,play_count,access_level,status").eq("podcast_id",pid).eq("status","published").order("published_at",{ascending:false}),
db.from("cr_podcast_monetization_products").select("id,name,description,currency,amount_cents,interval,active").eq("podcast_id",pid).eq("product_type","membership").eq("active",true).order("created_at",{ascending:false}).limit(1).maybeSingle()
]);render(p,cr.data,ep.data||[],prod.data||null)}
async function getContinueEpisodes(eps){try{const s=await db.auth.getSession();if(!s.data?.session)return[];const r=await db.rpc("get_my_podcast_playback_progress",{p_episode_id:null});if(r.error||!Array.isArray(r.data))return[];const ids=new Set(eps.map(e=>e.id));return r.data.filter(x=>ids.has(x.episode_id)&&!x.completed&&Number(x.verified_seconds||0)>0).sort((a,b)=>new Date(b.updated_at||0)-new Date(a.updated_at||0)).slice(0,10).map(x=>({episode:eps.find(e=>e.id===x.episode_id),progress:x}));}catch(_){return[]}}
async function getRecommended(p){try{const r=await db.from("podcasts").select("id,title,slug,category,description,artwork_url,listener_count,total_plays,is_featured").eq("status","published").neq("id",p.id).eq("category",p.category||"").order("is_featured",{ascending:false}).order("total_plays",{ascending:false}).limit(10);return r.data||[]}catch(_){return[]}}
function railCard(e){const isEpisode=!!e.id&&("thumbnail_url" in e||"episode_number" in e||"access_level" in e);if(!isEpisode)return '<article class="ps-rail-card"><a href="podcast.html?slug='+encodeURIComponent(e.slug||"")+'"><div class="ps-rail-art">'+(e.artwork_url?'<img src="'+esc(e.artwork_url)+'" alt="" loading="lazy">':'<span>CR</span>')+'</div><div class="ps-rail-copy"><b>'+esc(e.title||"Untitled")+'</b><small>'+esc(e.category||"Podcast")+'</small></div></a></article>';return '<article class="ps-rail-card"><a href="episode.html?id='+encodeURIComponent(e.id)+'"><div class="ps-rail-art">'+(e.thumbnail_url?'<img src="'+esc(e.thumbnail_url)+'" alt="" loading="lazy">':'<span>CR</span>')+(e.access_level==="premium"?'<em>PREMIUM</em>':"")+'</div><div class="ps-rail-copy"><b>'+esc(e.title||"Untitled Episode")+'</b><small>'+esc(e.episode_number?"Episode "+e.episode_number:"Episode")+(e.duration_seconds?" · "+esc(dur(e.duration_seconds)):"")+'</small></div></a></article>'}
function rail(title,kicker,items,emptyText){return '<section class="ps-rail-section" data-rail="'+kicker.toLowerCase().replace(/\s+/g,"-")+'"><div class="ps-rail-head"><div><span>'+esc(kicker)+'</span><h2>'+esc(title)+'</h2></div><div class="ps-rail-arrows"><button type="button" data-rail-prev aria-label="Previous '+esc(title)+'">‹</button><button type="button" data-rail-next aria-label="Next '+esc(title)+'">›</button></div></div><div class="ps-rail-track">'+(items.length?items.map(x=>railCard(x.episode||x)).join(""):'<div class="ps-rail-empty">'+esc(emptyText)+'</div>')+'</div></section>'}
async function render(p,c,eps,prod){
 document.title=(p.title||"Podcast")+" | CrowRules Podcasting";
 const cover=p.artwork_url?'<img src="'+esc(p.artwork_url)+'" alt="'+esc(p.title)+' cover artwork">':'<div class="fallback">CR</div>';
 const creator=c?'<div class="showroom-creator">'+(c.avatar_url?'<img src="'+esc(c.avatar_url)+'" alt="">':'<div class="showroom-creator-mark">CR</div>')+'<div><small>CREATED BY</small><b>'+esc(c.name)+'</b></div></div>':'';
 const latest=eps.slice(0,12),premium=eps.filter(e=>e.access_level==="premium").slice(0,12),continued=await getContinueEpisodes(eps),recommended=await getRecommended(p),continueItems=continued.map(x=>({...x.episode,_progress:x.progress}));
 const episodes=eps.map(e=>'<article class="psv2-episode"><div class="psv2-episode-art">'+(e.thumbnail_url?'<img src="'+esc(e.thumbnail_url)+'" alt="" loading="lazy">':'<div class="fallback">CR</div>')+(e.access_level==="premium"?'<span class="episode-tile-badge">PREMIUM</span>':'')+'</div><div class="psv2-episode-copy"><h3>'+esc(e.title)+'</h3><div class="psv2-episode-meta">'+esc(e.episode_number?"Episode "+e.episode_number:"Episode")+(e.published_at?" · "+esc(new Date(e.published_at).toLocaleDateString()):"")+" · "+esc(dur(e.duration_seconds))+(Number(e.play_count)?" · "+esc(e.play_count)+" plays":"")+'</div><p class="psv2-episode-desc">'+esc(e.description||"No description yet.")+'</p><div class="psv2-episode-actions"><button class="btn" type="button" data-save-episode="'+esc(e.id)+'">Save</button><button class="btn" type="button" data-favorite-episode="'+esc(e.id)+'">Favorite</button><a class="btn primary" href="episode.html?id='+encodeURIComponent(e.id)+'">OPEN</a></div></div></article>').join("");
 const member=prod?'<div class="psv2-membership"><div><h2>'+esc(prod.name||"Podcast Membership")+'</h2><p>'+esc(prod.description||"Support this podcast and unlock premium access.")+'</p></div><div class="psv2-price">'+money(prod.amount_cents,prod.currency)+'<small>/ '+esc(prod.interval||"month")+'</small><a class="btn primary" href="support.html?podcast_id='+encodeURIComponent(p.id)+'">JOIN MEMBERSHIP</a></div></div>':'';
 app.innerHTML='<main class="podcast-showroom-v2"><div class="wrap"><section class="psv2-hero"><div class="psv2-backdrop">'+(p.artwork_url?'<img src="'+esc(p.artwork_url)+'" alt="">':'')+'</div><div class="psv2-content"><div class="psv2-eyebrow">'+esc((p.category||"PODCAST").toUpperCase())+(p.is_featured?" · FEATURED":"")+'</div><h1 class="psv2-title"><span>'+esc(p.title)+'</span></h1><p class="psv2-description">'+esc(p.description||"No description yet.")+'</p>'+creator+'<div class="psv2-actions"><a class="btn primary" href="'+(prod?"support.html?podcast_id="+encodeURIComponent(p.id):"support.html")+'">'+(prod?"JOIN MEMBERSHIP":"MEMBERSHIP")+'</a><button class="btn" id="share" type="button">↗ SHARE</button>'+(p.website_url?'<a class="btn" href="'+esc(p.website_url)+'" target="_blank" rel="noopener">WEBSITE</a>':'')+'<a class="btn" href="podcasts.html">ALL PODCASTS</a></div><div class="psv2-member-row"><button class="btn psv2-action" type="button" data-follow-podcast="'+esc(p.id)+'">Follow</button></div><div id="shareStatus" class="psv2-status"></div><div class="psv2-metrics"><div class="psv2-metric"><b>'+eps.length+'</b><span>EPISODES</span></div><div class="psv2-metric"><b>'+esc(p.listener_count??0)+'</b><span>LISTENERS</span></div><div class="psv2-metric"><b>'+esc(p.total_plays??0)+'</b><span>PLAYS</span></div></div></div><div class="psv2-art-panel"><div class="psv2-art">'+cover+(p.is_live?'<span class="psv2-live">● LIVE NOW</span>':'')+'</div></div></section>'+(member?'<section class="psv2-section">'+member+'</section>':'')+'<section class="ps-rails">'+rail("Latest Episodes","LATEST",latest,"New episodes will appear here.")+rail("Premium Episodes","PREMIUM",premium,"Premium episodes will appear here when available.")+rail("Continue Listening","YOUR LISTENING",continueItems,"Sign in and start listening to build your Continue Listening rail.")+rail("Recommended","RECOMMENDED",recommended,"More podcasts in this category will appear here.")+'</section><section class="psv2-section"><div class="psv2-bottom"><a class="btn primary" href="discover.html">DISCOVER</a><a class="btn" href="my-library.html">MY LIBRARY</a><a class="btn" href="creators.html">CREATORS</a></div></section></div></main>';
 document.querySelectorAll("[data-rail]").forEach(section=>{const track=section.querySelector(".ps-rail-track"),prev=section.querySelector("[data-rail-prev]"),next=section.querySelector("[data-rail-next]"),step=()=>Math.max(260,Math.floor(track.clientWidth*.72));prev.onclick=()=>track.scrollBy({left:-step(),behavior:"smooth"});next.onclick=()=>track.scrollBy({left:step(),behavior:"smooth"});const sync=()=>{prev.disabled=track.scrollLeft<8;next.disabled=track.scrollLeft+track.clientWidth>=track.scrollWidth-8};track.addEventListener("scroll",sync,{passive:true});window.addEventListener("resize",sync);sync()});
 const sh=document.getElementById("share"),ss=document.getElementById("shareStatus");sh.onclick=async()=>{try{if(navigator.share)await navigator.share({title:p.title,text:"Listen to "+p.title+" on CrowRules Podcasting.",url:location.href});else{await navigator.clipboard?.writeText(location.href);ss.textContent="Link copied."}}catch(e){if(e.name!=="AbortError")ss.textContent="Share unavailable."}};
}
load().catch(e=>{console.error(e);fail("Unable to load podcast",e.message||"Please try again.")});
})();
</script></body></html>
