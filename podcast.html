<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcast — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main id="show" class="wrap hero"></main><section class="wrap section"><h2>Episodes</h2><div id="episodes" class="grid two"></div></section><script>addEventListener("crow:ready",async()=>{const id=new URLSearchParams(location.search).get("id");const r=await CROW_APP.query("podcasts","*",{eq:{id}}),p=r.data?.[0];if(!p){show.innerHTML='<div class="notice">Podcast not found.</div>';return}document.title=p.title+" — CrowRules Podcasting";show.innerHTML='<div class="eyebrow">'+(p.category||"PODCAST")+'</div><h1>'+p.title+'</h1><p class="lead">'+(p.description||"")+'</p><div class="actions"><button id="follow" class="btn primary">Follow show</button><a class="btn" href="'+CROW_CONFIG.supabaseUrl+'/functions/v1/podcast-rss?slug='+encodeURIComponent(p.slug)+'">RSS Feed</a></div>';follow.onclick=async()=>{if(!__CROW_USER){location.href="account.html";return}const r=await CROW_SUPABASE.from("podcast_follows").upsert({user_id:__CROW_USER.id,podcast_id:id},{onConflict:"user_id,podcast_id"});alert(r.error?r.error.message:"Podcast followed.");};const e=await CROW_APP.query("podcast_episodes","*",{eq:{podcast_id:id},order:"published_at",ascending:false,limit:100});episodes.innerHTML=(e.data||[]).map(v=>'<article class="card"><span class="eyebrow">EPISODE '+(v.episode_number||"")+'</span><h3>'+v.title+'</h3><p>'+((v.description||"").slice(0,220))+'</p><button class="btn primary" onclick="location.href=\'episode.html?id='+v.id+'\'">Listen</button></article>').join("")||'<div class="notice">No published episodes yet.</div>'});</script></body></html>
