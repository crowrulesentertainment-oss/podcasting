<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Podcast</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/podcasting-platform.css?v=5"><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=5" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script><script src="js/podcasting-config.js"></script><script src="js/podcasting-platform.js" defer></script><script src="js/podcasting-player.js" defer></script></head><body><main class="cr-shell"><section id="show" class="hero"></section><section class="section"><div class="card panel" id="listenerTools"></div></section><section class="section"><div class="section-head"><h2>Membership Plans</h2></div><div id="plans" class="grid"></div></section><section class="section"><div class="section-head"><h2>Episodes</h2><small>Listen • save • react • discuss • share</small></div><div id="episodes" class="grid"></div></section><section class="section"><div class="section-head"><h2>Reviews</h2></div><div id="reviewForm" class="card panel"></div><div id="reviews" class="grid"></div></section></main><div id="playlistModal" class="modal"><div class="modal-box"><h2>Add to Playlist</h2><div id="playlistBody"></div><button class="btn" onclick="closeModal()">Close</button></div></div><script>
let podcastId,podcastData,episodes=[];const $=id=>document.getElementById(id),E=v=>CrowPodcasting.esc(v);
function closeModal(){$('playlistModal').classList.remove('open')}
async function requireUser(){if(!CrowPodcasting.user){alert('Please sign in with your CrowRules account first.');location.href='https://crowrulesentertainment-oss.github.io/crowrulesentertainment/account.html';throw Error('Sign in required')}return true}
async function renderComments(ep){const box=$('comments-'+ep.id);const rows=await CrowPodcasting.getSocialComments(ep.id);box.innerHTML=rows.map(x=>'<div class="card panel" style="margin:8px 0"><small>'+E(x.user_id)+'</small><p>'+E(x.body)+'</p><button class="btn" onclick="replyComment(\''+E(ep.id)+'\',\''+E(x.id)+'\')">Reply</button><button class="btn" onclick="followCommenter(\''+E(x.user_id)+'\')">Follow</button></div>').join('')||'<div class="notice">No comments yet.</div>'}
window.replyComment=async(e,p)=>{await requireUser();const b=prompt('Reply');if(b?.trim()){await CrowPodcasting.addSocialComment(e,b,p);await renderComments(episodes.find(x=>x.id===e))}}
window.followCommenter=async id=>{await requireUser();try{await CrowPodcasting.followListener(id);alert('Listener followed.')}catch(e){alert(e.message)}}
window.commentEp=async id=>{await requireUser();const b=prompt('Comment on this episode');if(b?.trim()){await CrowPodcasting.addSocialComment(id,b);await renderComments(episodes.find(x=>x.id===id))}}
window.playlistEp=async id=>{await requireUser();const ps=await CrowPodcasting.getMyPlaylists();$('playlistBody').innerHTML='<p>Select a playlist:</p>'+ps.map(p=>'<button class="btn" style="margin:4px" onclick="addPlaylist(\''+E(p.id)+'\',\''+E(id)+'\')">'+E(p.name)+'</button>').join('')+'<hr><input id="newPL" placeholder="New playlist name"><button class="btn primary" onclick="newPlaylist(\''+E(id)+'\')">Create & Add</button>';$('playlistModal').classList.add('open')}
window.addPlaylist=async(p,e)=>{await CrowPodcasting.addToPlaylist(p,e);closeModal();alert('Added to playlist.')}
window.newPlaylist=async e=>{const n=$('newPL').value.trim();if(!n)return;const p=await CrowPodcasting.createPlaylist(n,'',true);await CrowPodcasting.addToPlaylist(p.id,e);closeModal()}
window.shareEp=async id=>{const e=episodes.find(x=>x.id===id);if(await CrowPodcasting.shareEpisode(e))alert('Episode link shared or copied.')}
window.reactEp=async id=>{await requireUser();const old=await CrowPodcasting.getReaction(id);await CrowPodcasting.setReaction(id,old?'':'like');document.querySelector('#react-'+id).textContent=old?'♥ React':'♥ Liked'}
document.addEventListener('crow:ready',async()=>{podcastId=new URLSearchParams(location.search).get('id');if(!podcastId){$('show').innerHTML='<div><h1>Podcast not specified.</h1></div>';return}podcastData=(await CrowPodcasting.rows('podcasts','*',{eq:{id:podcastId},limit:1}))[0]||(await CrowPodcasting.rows('podcasting_podcast_directory','*',{eq:{id:podcastId},limit:1}))[0];if(!podcastData)return;document.title='CrowRules Podcasting — '+podcastData.title;$('show').innerHTML='<div><div class="eyebrow">'+E(podcastData.category||'Podcast')+'</div><h1>'+E(podcastData.title)+'</h1><p>'+E(podcastData.description||'')+'</p><div class="notice">'+CrowPodcasting.fmt(podcastData.listener_count||0)+' followers • '+CrowPodcasting.fmt(podcastData.total_plays||0)+' plays</div></div><div class="hero-orb" style="background:url('+JSON.stringify(podcastData.artwork_url||'')+') center/cover"><div class="orb-text">CROWRULES<br>PODCASTING</div></div>';$('listenerTools').innerHTML='<button id="follow" class="btn">Follow Podcast</button> <a class="btn" href="listener-dashboard.html">Dashboard</a> <a class="btn" href="social.html">Community</a>';const f=await CrowPodcasting.isFollowing(podcastId);$('follow').textContent=f?'✓ Following':'＋ Follow Podcast';$('follow').onclick=async()=>{try{const now=await CrowPodcasting.isFollowing(podcastId);await(now?CrowPodcasting.unfollowPodcast(podcastId):CrowPodcasting.followPodcast(podcastId));$('follow').textContent=now?'＋ Follow Podcast':'✓ Following'}catch(e){alert(e.message)}};const plans=await CrowPodcasting.rows('cr_podcast_monetization_products','*',{eq:{podcast_id:podcastId,product_type:'membership',active:true},order:'display_order',ascending:true});$('plans').innerHTML=plans.length?plans.map(x=>'<article class="card panel"><h3>'+E(x.name)+'</h3><p>'+E(x.description||'')+'</p><strong>'+CrowPodcasting.formatMoney(x.amount_cents)+' / '+E(x.interval||'month')+'</strong><br><button class="btn primary" onclick="subscribe(\''+E(x.id)+'\')">Subscribe</button></article>').join(''):'<div class="card panel">Free listening is currently available.</div>';episodes=await CrowPodcasting.rows('podcast_episodes','id,podcast_id,title,description,audio_url,thumbnail_url,published_at,duration_seconds,status',{eq:{podcast_id:podcastId,status:'published'},order:'published_at',ascending:false,limit:50});$('episodes').innerHTML=episodes.map(e=>'<article class="card pod-card"><div class="art" style="background-image:url('+JSON.stringify(e.thumbnail_url||podcastData.artwork_url||'')+')"></div><div class="pod-body"><h3>'+E(e.title)+'</h3><p>'+E(e.description||'')+'</p><div class="pod-meta"><button class="btn primary" onclick="playEp(\''+E(e.id)+'\')">▶ Play</button><button class="btn" onclick="saveEp(\''+E(e.id)+'\')">☆ Save</button><button id="react-'+E(e.id)+'" class="btn" onclick="reactEp(\''+E(e.id)+'\')">♥ React</button><button class="btn" onclick="commentEp(\''+E(e.id)+'\')">💬 Comment</button><button class="btn" onclick="playlistEp(\''+E(e.id)+'\')">♫ Playlist</button><button class="btn" onclick="shareEp(\''+E(e.id)+'\')">↗ Share</button></div><div id="comments-'+E(e.id)+'" style="margin-top:14px"></div></div></article>').join('')||'<div class="card panel">No published episodes yet.</div>';window.playEp=id=>{const e=episodes.find(x=>x.id===id);if(e)CrowPodcastPlayer.play({...e,podcast_title:podcastData.title,artwork_url:podcastData.artwork_url})};window.saveEp=async id=>{await requireUser();const yes=await CrowPodcasting.isSaved(id);await(yes?CrowPodcasting.unsaveEpisode(id):CrowPodcasting.saveEpisode(id));alert(yes?'Removed from saved.':'Saved.');};for(const e of episodes)renderComments(e);const channel=await CrowPodcasting.subscribeSocialRealtime({comments:p=>{if(p.new?.episode_id)renderComments(episodes.find(x=>x.id===p.new.episode_id))}});const reviews=await CrowPodcasting.getReviews(podcastId);$('reviews').innerHTML=reviews.map(r=>'<article class="card panel"><strong>'+('★'.repeat(Number(r.rating||0)))+('☆'.repeat(5-Number(r.rating||0)))+'</strong><p>'+E(r.body||'')+'</p><small>'+new Date(r.created_at).toLocaleDateString()+'</small></article>').join('')||'<div class="notice">No reviews yet.</div>';if(CrowPodcasting.user){$('reviewForm').innerHTML='<select id="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select> <input id="reviewBody" placeholder="Your review"><button class="btn primary" id="submitReview">Publish Review</button>';$('submitReview').onclick=async()=>{await CrowPodcasting.reviewPodcast(podcastId,$('rating').value,$('reviewBody').value);location.reload()}}else $('reviewForm').innerHTML='<div class="notice">Sign in to leave a review.</div>'});
window.subscribe=async id=>{try{const r=await CrowPodcasting.edge('podcast-subscription-checkout',{product_id:id,podcast_id:podcastId,origin:location.origin+location.pathname.replace(/[^/]*$/,'')});location.href=r.url}catch(e){alert(e.message)}};
</script></body></html>
