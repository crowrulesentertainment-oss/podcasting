<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05050b">
<title>Podcast — CrowRules Podcasting</title>
<link rel="stylesheet" href="css/podcasting.css?v=20261003-14">
<script src="js/config.js?v=20261003-13"></script>
<style>
:root{--bg:#05050b;--panel:#0d1019;--line:#ffffff18;--text:#f5f7fb;--muted:#9aa5b8;--cyan:#00dcff;--purple:#8b5cf6;--green:#7df7c7;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#00dcff12,transparent 30%),radial-gradient(circle at 90% 10%,#8b5cf615,transparent 32%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1240px,calc(100% - 32px));margin:auto}.page{padding:34px 0 90px}.hidden{display:none!important}.card{background:#0d1019e8;border:1px solid var(--line);border-radius:24px}.eyebrow{font-size:.7rem;font-weight:900;letter-spacing:.18em;color:var(--cyan)}.muted{color:var(--muted);line-height:1.65}.loading{text-align:center;padding:90px 24px}.loading h1{font-size:clamp(2rem,5vw,4rem);margin:12px 0}.spinner{width:34px;height:34px;border:3px solid #ffffff18;border-top-color:var(--cyan);border-radius:50%;margin:25px auto 0;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.diagnostic{margin-top:18px;padding:18px;text-align:left;background:#070a12;border-radius:16px;border:1px solid var(--line)}.diagnostic code{color:#9feaff;word-break:break-word}.hero{display:grid;grid-template-columns:330px 1fr;gap:38px;align-items:end;padding:38px;overflow:hidden;min-height:480px;background:#080910}.art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px}.title{font-size:clamp(2.6rem,6vw,5.8rem);line-height:.92;margin:10px 0 16px}.chips,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.chip{border:1px solid var(--line);background:#ffffff08;border-radius:999px;padding:7px 11px;font-size:.76rem}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#ffffff08;color:#fff;border-radius:11px;padding:10px 15px;text-decoration:none;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#00bfe0,#7c4cf3);border:0}.section{margin-top:42px}.section h2{font-size:2rem}.episode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.episode{overflow:hidden;padding:0}.episode img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.episode-body{padding:17px}.episode h3{margin:0 0 7px}.episode p{color:var(--muted);line-height:1.55}.audio{width:100%;margin-top:10px}.system{padding:18px}.system-row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.ok{color:var(--green)}.bad{color:var(--red)}@media(max-width:800px){.hero{grid-template-columns:1fr;padding:24px}.hero .art{max-width:330px}.episode-grid{grid-template-columns:1fr}}
</style>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script>
</head>
<body>
<div id="root" class="wrap page">
<section id="loading" class="card loading">
 <div class="eyebrow">PODCAST SYSTEM</div>
 <h1>Loading podcast universe…</h1>
 <p id="loadingText" class="muted">Starting the CrowRules Podcasting engine.</p>
 <div class="spinner" aria-hidden="true"></div>
 <div id="diagnostic" class="diagnostic hidden"></div>
</section>
<section id="app" class="hidden">
 <div id="hero" class="card hero"></div>
 <section class="section">
  <h2>Episodes</h2>
  <div id="episodes" class="episode-grid"></div>
 </section>
 <section class="section card system">
  <div class="eyebrow">SYSTEM STATUS</div>
  <div class="system-row"><span>Podcast JavaScript</span><strong class="ok">Running</strong></div>
  <div class="system-row"><span>Supabase Data API</span><strong id="dbStatus">Checking…</strong></div>
  <div class="system-row"><span>Authentication</span><strong id="authStatus">Background</strong></div>
  <div class="actions" style="margin-top:15px"><a class="btn" href="podcasts.html">← All Podcasts</a><button class="btn" id="retry">Reload Podcast</button></div>
 </section>
</section>
</div>
<script>
(function(){
"use strict";
var cfg=window.CROW_CONFIG||{};
var loading=document.getElementById("loading");
var loadingText=document.getElementById("loadingText");
var diagnostic=document.getElementById("diagnostic");
var app=document.getElementById("app");
var hero=document.getElementById("hero");
var episodesEl=document.getElementById("episodes");
var dbStatus=document.getElementById("dbStatus");
var authStatus=document.getElementById("authStatus");
var esc=function(v){return String(v==null?"":v).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var rest=function(path){
 var url=String(cfg.supabaseUrl||"").replace(/\/$/,"")+"/rest/v1/"+path;
 return fetch(url,{headers:{"apikey":cfg.supabaseKey||"","Authorization":"Bearer "+(cfg.supabaseKey||""),"Accept":"application/json"},cache:"no-store"}).then(function(r){
   return r.text().then(function(t){var data=null;try{data=t?JSON.parse(t):null}catch(e){}
     if(!r.ok){throw new Error("HTTP "+r.status+(data&&data.message?": "+data.message:t?" — "+t.slice(0,180):""))}
     return data;
   });
 });
};
function fail(e){
 var msg=String(e&&e.message||e||"Unknown JavaScript error");
 loadingText.textContent="The loading sequence stopped before the podcast could render.";
 diagnostic.classList.remove("hidden");
 diagnostic.innerHTML="<strong>Diagnostic:</strong><br><code>"+esc(msg)+"</code><br><br><span class='muted'>This is the new isolated loader. Optional sitewide scripts are not part of the critical path.</span>";
}
function show(){
 loading.classList.add("hidden");app.classList.remove("hidden");
}
function render(p,eps){
 document.title=(p.title||"Podcast")+" — CrowRules Podcasting";
 var art=esc(p.artwork_url||"assets/podcast-placeholder.svg");
 hero.innerHTML="<img class='art' src='"+art+"' alt='"+esc(p.title||"Podcast")+" artwork'><div><div class='eyebrow'>CROWRULES PODCASTING</div><h1 class='title'>"+esc(p.title||"Untitled Podcast")+"</h1><p class='muted'>"+esc(p.description||"A CrowRules Podcasting show.")+"</p><div class='chips'><span class='chip'>"+esc(p.category||"Podcast")+"</span>"+(p.author_name?"<span class='chip'>"+esc(p.author_name)+"</span>":"")+(p.is_live?"<span class='chip'>● Live</span>":"")+"</div><div class='actions' style='margin-top:20px'><a class='btn primary' href='podcasts.html'>Browse Podcasts</a></div></div>";
 if(!eps.length){episodesEl.innerHTML="<div class='card' style='padding:25px;grid-column:1/-1'><strong>No published episodes yet.</strong><p class='muted'>This podcast is published, but no published episodes are available.</p></div>";return}
 episodesEl.innerHTML=eps.map(function(e){var thumb=esc(e.thumbnail_url||p.artwork_url||"assets/podcast-placeholder.svg");return "<article class='card episode'><img src='"+thumb+"' alt='"+esc(e.title)+"' loading='lazy'><div class='episode-body'><div class='eyebrow'>EPISODE "+esc(e.episode_number||"")+"</div><h3>"+esc(e.title||"Untitled Episode")+"</h3><p>"+esc(e.description||"")+"</p>"+(e.audio_url?"<audio class='audio' controls preload='none' src='"+esc(e.audio_url)+"'></audio>":"")+"</div></article>"}).join("");
}
async function load(){
 var pid=new URLSearchParams(location.search).get("id");
 if(!pid){throw new Error("No podcast ID was supplied in the URL.")}
 if(!cfg.supabaseUrl||!cfg.supabaseKey){throw new Error("CrowRules Supabase configuration is missing.")}
 loadingText.textContent="Connecting directly to the CrowRules Data API…";
 var uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(pid);
 var filter=uuid?"id=eq."+encodeURIComponent(pid):"slug=eq."+encodeURIComponent(pid);
 var cols="*";
 var rows=await rest("podcasting_podcast_directory?select="+encodeURIComponent(cols)+"&status=eq.published&"+filter+"&limit=1");
 if(!rows||!rows.length){
   rows=await rest("podcasts?select="+encodeURIComponent(cols)+"&status=eq.published&"+filter+"&limit=1");
 }
 if(!rows||!rows.length)throw new Error("Podcast not found. The show may not be published yet.");
 var p=rows[0];loadingText.textContent="Loading published episodes…";
 var eps=await rest("podcast_episodes?select=id,title,slug,description,episode_number,season_number,published_at,duration_seconds,audio_url,video_url,thumbnail_url,play_count,status,access_level&podcast_id=eq."+encodeURIComponent(p.id)+"&status=eq.published&order=published_at.desc");
 dbStatus.textContent="Connected";dbStatus.className="ok";
 render(p,eps||[]);show();
 // Auth is strictly optional and starts only after rendering.
 setTimeout(function(){
   var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=function(){
     try{
       if(window.supabase&&window.supabase.createClient){
         var client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
         client.auth.getSession().then(function(){authStatus.textContent="Available";authStatus.className="ok"}).catch(function(){authStatus.textContent="Optional / unavailable"});
       }
     }catch(e){authStatus.textContent="Optional / unavailable"}
   };s.onerror=function(){authStatus.textContent="Optional / unavailable"};document.head.appendChild(s);
 },0);
}
document.getElementById("retry").onclick=function(){location.reload()};
window.addEventListener("error",function(e){if(!app.classList.contains("hidden"))return;fail(e.error||e.message)});
window.addEventListener("unhandledrejection",function(e){if(!app.classList.contains("hidden"))fail(e.reason)});
load().catch(fail);
setTimeout(function(){
 if(!app.classList.contains("hidden"))return;
 diagnostic.classList.remove("hidden");
 diagnostic.innerHTML="<strong>Loader watchdog:</strong> JavaScript is running, but the core request has not completed yet.<br><br><span class='muted'>The page is now isolated from the previous bootstrap, auth, realtime, Stripe, chat, and sitewide scripts.</span>";
},12000);
})();
</script>
</body>
</html>
