<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05050b"><meta name="description" content="Listen to this podcast on CrowRules Podcasting.">
<title>Podcast | CrowRules Podcasting</title>
<link rel="stylesheet" href="css/podcasting.css">
<link rel="stylesheet" href="css/global-navigation.css">
<style>
.psv3-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0}.psv3-tools input,.psv3-tools select{background:#0b0b14;color:inherit;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:11px 13px;min-height:42px}.psv3-tools input{flex:1 1 260px}.psv3-tools select{flex:0 1 190px}.psv3-count{opacity:.7;font-size:.82rem;letter-spacing:.08em}.psv3-grid{display:grid;gap:16px}.psv3-episode{display:grid;grid-template-columns:minmax(130px,190px) 1fr;gap:18px;padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.025)}.psv3-episode-art{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:12px;background:#080812}.psv3-episode-art img{width:100%;height:100%;object-fit:cover}.psv3-episode-art .badge{position:absolute;left:8px;top:8px;font-size:.68rem;padding:5px 7px;border-radius:7px;background:#000b;color:#fff}.psv3-meta{opacity:.7;font-size:.8rem;margin:6px 0 10px}.psv3-desc{opacity:.84;line-height:1.5;margin:0 0 12px}.psv3-actions{display:flex;gap:8px;flex-wrap:wrap}.psv3-empty{padding:28px;border:1px dashed rgba(255,255,255,.14);border-radius:14px;opacity:.72}.psv3-live-dot{display:inline-flex;gap:7px;align-items:center}.psv3-live-dot i{width:8px;height:8px;border-radius:50%;background:#f44;box-shadow:0 0 12px #f44}@media(max-width:700px){.psv3-episode{grid-template-columns:1fr}.psv3-episode-art{max-height:220px}}
</style></head>
<body data-cr-no-monetization-strip>
<div id="app"><div class="loading"><div class="spinner"></div><strong>LOADING PODCAST</strong><span>Connecting to CrowRules…</span></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script>
<script src="js/platform-data.js"></script><script src="js/member-state.js"></script><script src="js/member-actions.js"></script><script src="js/domain-service-loader.js" defer></script>
<script src="js/domain-service-loader.js" defer></script>
<script src="js/domain-service-loader.js" defer></script>
<script src="js/domain-service-loader.js" defer></script>
<script src="js/domain-service-loader.js" defer></script>
<script src="js/domain-service-loader.js" defer></script>
<script src="js/domain-service-loader.js" defer></script>
<script src="js/global-navigation.js" defer></script>
<script>
(()=>{"use strict";
const cfg=window.CROWRULES_CONFIG||{},app=document.getElementById("app"),db=window.supabase&&cfg.supabaseUrl&&cfg.supabaseAnonKey?window.CrowRulesData.getClient()if(!n)return"—";const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?h+"h "+String(m).padStart(2,"0")+"m":m+"m "+String(s).padStart(2,"0")+"s"};
function fail(t,m){app.innerHTML='<div class="error"><strong>'+esc(t)+'</strong><span>'+esc(m)+'</span><a class="btn" href="podcasts.html">BACK TO PODCASTS</a></div>'}
async function load(){if(!db)return fail("Configuration error","The CrowRules data connection could not initialize.");
let pid=q.get("id")||q.get("podcast_id"),slug=q.get("slug")||(!pid?"bonded-in-mystery":null);
if(!pid&&slug){const r=await db.from("podcasts").select("id").eq("slug",slug).eq("status","published").maybeSingle();if(r.error)throw r.error;pid=r.data?.id;if(pid&&!q.get("slug"))history.replaceState(null,"","podcast.html?slug="+encodeURIComponent(slug))}
if(!pid)return fail("Podcast not found","Use a valid podcast ID or slug.");
const pR=await db.from("podcasts").select("id,title,slug,category,description,artwork_url,website_url,status,is_featured,is_live,listener_count,total_plays,creator_id").eq("id",pid).eq("status","published").maybeSingle();if(pR.error)throw pR.error;if(!pR.data)return fail("Podcast not found","This podcast is not published.");
const p=pR.data;
const [cr,ep,prod,audience]=await Promise.all([
db.from("creators").select("id,name,avatar_url").eq("id",p.creator_id).maybeSingle(),
db.from("podcast_episodes").select("id,title,description,episode_number,season_number,published_at,duration_seconds,thumbnail_url,play_count,access_level,status").eq("podcast_id",pid).eq("status","published").order("published_at",{ascending:false}),
db.from("cr_podcast_monetization_products").select("id,name,description,currency,amount_cents,interval,active").eq("podcast_id",pid).eq("product_type","membership").eq("active",true).order("created_at",{ascending:false}).limit(1).maybeSingle(),
db.rpc("get_podcast_audience_counts",{p_podcast_id:pid})
]);
if(ep.error)throw ep.error;
const counts=audience?.error?{follower_count:0,subscriber_count:0}:(audience.data?.[0]||audience.data||{follower_count:0,subscriber_count:0});
render(p,cr.data,ep.data||[],prod.data||null,Number(counts.follower_count)||0,Number(counts.subscriber_count)||0)}
async function getContinueEpisodes(eps){try{const user=await window.CrowRulesData.getUser();if(!user)return[];const r=await db.rpc("get_my_podcast_playback_progress",{p_episode_id:null});if(r.error||!Array.isArray(r.data))return[];const ids=new Set(eps.map(e=>e.id));return r.data.filter(x=>ids.has(x.episode_id)&&!x.completed&&Number(x.verified_seconds||0)>0).sort((a,b)=>new Date(b.updated_at||0)-new Date(a.updated_at||0)).slice(0,10).map(x=>({episode:eps.find(e=>e.id===x.episode_id),progress:x}));}catch(_){return[]}}
async function getRecommended(p){try{const r=await db.from("podcasts").select("id,title,slug,category,description,artwork_url,listener_count,total_plays,is_featured").eq("status","published").neq("id",p.id).eq("category",p.category||"").order("is_featured",{ascending:false}).order("total_plays",{ascending:false}).limit(10);return r.data||[]}catch(_){return[]}}
function railCard(e){const isEpisode=!!e.id&&("thumbnail_url" in e||"episode_number" in e||"access_level" in e);if(!isEpisode)return '<article class="ps-rail-card"><a href="podcast.html?slug='+encodeURIComponent(e.slug||"")+'"><div class="ps-rail-art">'+(e.artwork_url?'<img src="'+esc(e.artwork_url)+'" alt="" loading="lazy">':'<span>CR</span>')+'</div><div class="ps-rail-copy"><b>'+esc(e.title||"Untitled")+'</b><small>'+esc(e.category||"Podcast")+'</small></div></a></article>';const pp=Math.min(100,Math.max(0,Number(e._progress?.progress_percent||0))),hasProgress=pp>0&&!e._progress?.completed;return '<article class="ps-rail-card"><div class="ps-rail-art"><a href="episode.html?id='+encodeURIComponent(e.id)+'" aria-label="'+esc((hasProgress?"Resume ":"Play ")+(e.title||"episode"))+'">'+(e.thumbnail_url?'<img src="'+esc(e.thumbnail_url)+'" alt="" loading="lazy">':'<span>CR</span>')+(e.access_level==="premium"?'<em>PREMIUM</em>':"")+'</a></div><div class="ps-rail-copy"><b>'+esc(e.title||"Untitled Episode")+'</b><small>'+esc(e.episode_number?"Episode "+e.episode_number:"Episode")+(e.duration_seconds?" · "+esc(dur(e.duration_seconds)):"")+'</small>'+(hasProgress?'<div class="ps-rail-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pp+'"><i style="width:'+pp+'%"></i></div>':"")+'<div class="ps-rail-actions"><a class="ps-rail-play" href="episode.html?id='+encodeURIComponent(e.id)+'">'+(hasProgress?"▶ RESUME":"▶ PLAY")+'</a><button type="button" data-save-episode="'+esc(e.id)+'">Save</button><button type="button" data-favorite-episode="'+esc(e.id)+'">Favorite</button></div></div></article>'}
function rail(title,kicker,items,emptyText){return '<section class="ps-rail-section" data-rail="'+kicker.toLowerCase().replace(/\s+/g,"-")+'"><div class="ps-rail-head"><div><span>'+esc(kicker)+'</span><h2>'+esc(title)+'</h2></div><div class="ps-rail-arrows"><button type="button" data-rail-prev aria-label="Previous '+esc(title)+'">‹</button><button type="button" data-rail-next aria-label="Next '+esc(title)+'">›</button></div></div><div class="ps-rail-track">'+(items.length?items.map(x=>railCard(x.episode||x)).join(""):'<div class="ps-rail-empty">'+esc(emptyText)+'</div>')+'</div></section>'}
function episodeCard(e){const premium=e.access_level==="premium";return '<article class="psv3-episode" data-episode><div class="psv3-episode-art">'+(e.thumbnail_url?'<img src="'+esc(e.thumbnail_url)+'" alt="" loading="lazy">':'<div class="fallback">CR</div>')+(premium?'<span class="badge">PREMIUM</span>':"")+'</div><div><h3>'+esc(e.title||"Untitled Episode")+'</h3><div class="psv3-meta">'+esc(e.episode_number?"Episode "+e.episode_number:"Episode")+(e.season_number?" · Season "+esc(e.season_number):"")+(e.published_at?" · "+esc(new Date(e.published_at).toLocaleDateString()):"")+" · "+esc(dur(e.duration_seconds))+(Number(e.play_count)?" · "+esc(e.play_count)+" plays":"")+'</div><p class="psv3-desc">'+esc(e.description||"No description yet.")+'</p><div class="psv3-actions"><button class="btn" type="button" data-save-episode="'+esc(e.id)+'">SAVE</button><button class="btn" type="button" data-favorite-episode="'+esc(e.id)+'">FAVORITE</button><a class="btn primary" href="episode.html?id='+encodeURIComponent(e.id)+'">'+(premium?"OPEN PREMIUM":"OPEN EPISODE")+'</a></div></div></article>'}
async function render(p,c,eps,prod,followerCount,subscriberCount){
document.title=(p.title||"Podcast")+" | CrowRules Podcasting";
const cover=p.artwork_url?'<img src="'+esc(p.artwork_url)+'" alt="'+esc(p.title)+' cover artwork" decoding="async">':'<div class="fallback">CR</div>';
const creator=c?'<div class="showroom-creator">'+(c.avatar_url?'<img src="'+esc(c.avatar_url)+'" alt="" loading="lazy">':'<div class="showroom-creator-mark">CR</div>')+'<div><small>CREATED BY</small><b>'+esc(c.name)+'</b></div></div>':"";
const latest=eps.slice(0,12),premium=eps.filter(e=>e.access_level==="premium").slice(0,12),continued=await getContinueEpisodes(eps),recommended=await getRecommended(p),continueItems=continued.map(x=>({...x.episode,_progress:x.progress}));
const progressMap=new Map(continued.map(x=>[x.episode?.id,x.progress]));eps.forEach(e=>{if(progressMap.has(e.id))e._progress=progressMap.get(e.id)});
const seasons=[...new Set(eps.map(e=>e.season_number).filter(v=>v!==null&&v!==undefined&&String(v)!==""))].sort((a,b)=>Number(b)-Number(a));
const member=prod?'<div class="psv2-membership"><div><h2>'+esc(prod.name||"Podcast Membership")+'</h2><p>'+esc(prod.description||"Support this podcast and unlock premium access.")+'</p></div><div class="psv2-price">'+money(prod.amount_cents,prod.currency)+'<small>/ '+esc(prod.interval||"month")+'</small><a class="btn primary" href="support.html?podcast_id='+encodeURIComponent(p.id)+'">JOIN MEMBERSHIP</a></div></div>':"";
app.innerHTML='<main class="podcast-showroom-v2"><div class="wrap"><section class="psv2-hero"><div class="psv2-backdrop">'+(p.artwork_url?'<img src="'+esc(p.artwork_url)+'" alt="" aria-hidden="true">':"")+'</div><div class="psv2-content"><div class="psv2-eyebrow">'+esc((p.category||"PODCAST").toUpperCase())+(p.is_featured?" · FEATURED":"")+(p.is_live?' · <span class="psv3-live-dot"><i></i> LIVE</span>':"")+'</div><h1 class="psv2-title"><span>'+esc(p.title)+'</span></h1><p class="psv2-description">'+esc(p.description||"No description yet.")+'</p>'+creator+'<div class="psv2-actions"><a class="btn primary" href="'+(eps[0]?"episode.html?id="+encodeURIComponent(eps[0].id):(prod?"support.html?podcast_id="+encodeURIComponent(p.id):"support.html"))+'">'+(eps[0]?"▶ LATEST EPISODE":prod?"JOIN MEMBERSHIP":"MEMBERSHIP")+'</a><button class="btn" id="share" type="button">↗ SHARE</button>'+(p.website_url?'<a class="btn" href="'+esc(p.website_url)+'" target="_blank" rel="noopener noreferrer">WEBSITE</a>':"")+'<a class="btn" href="podcasts.html">ALL PODCASTS</a></div><div class="psv2-member-row"><button class="btn psv2-action" type="button" data-follow-podcast="'+esc(p.id)+'">FOLLOW PODCAST</button></div><div id="shareStatus" class="psv2-status" role="status" aria-live="polite"></div><div class="psv2-metrics"><div class="psv2-metric"><b>'+eps.length+'</b><span>EPISODES</span></div><div class="psv2-metric"><b>'+esc(followerCount)+'</b><span>FOLLOWERS</span></div><div class="psv2-metric"><b>'+esc(subscriberCount)+'</b><span>SUBSCRIBERS</span></div><div class="psv2-metric"><b>'+esc(p.total_plays??0)+'</b><span>PLAYS</span></div></div></div><div class="psv2-art-panel"><div class="psv2-art">'+cover+(p.is_live?'<span class="psv2-live">● LIVE NOW</span>':"")+'</div></div></section>'+(member?'<section class="psv2-section">'+member+'</section>':"")+'<section class="ps-rails">'+rail("Latest Episodes","LATEST",latest,"New episodes will appear here.")+rail("Premium Episodes","PREMIUM",premium,"Premium episodes will appear here when available.")+rail("Continue Listening","YOUR LISTENING",continueItems,"Sign in and start listening to build your Continue Listening rail.")+rail("Because You Listen to "+(p.category||"this podcast"),"PERSONALIZED",recommended,"Start listening to more shows to personalize this rail.")+'</section><section class="psv2-section"><div class="psv3-tools"><input id="episodeSearch" type="search" placeholder="Search episodes…" aria-label="Search episodes"><select id="seasonFilter" aria-label="Filter by season"><option value="">All seasons</option>'+seasons.map(s=>'<option value="'+esc(s)+'">Season '+esc(s)+'</option>').join("")+'</select><select id="accessFilter" aria-label="Filter by access"><option value="">All access</option><option value="free">Free</option><option value="premium">Premium</option></select><select id="sortEpisodes" aria-label="Sort episodes"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="plays">Most played</option></select><span class="psv3-count" id="episodeCount">'+eps.length+' EPISODES</span></div><div class="psv3-grid" id="episodeGrid">'+(eps.length?eps.map(episodeCard).join(""):'<div class="psv3-empty">No published episodes yet.</div>')+'</div></section><section class="psv2-section"><div class="psv2-bottom"><a class="btn primary" href="discover.html">DISCOVER</a><a class="btn" href="my-library.html">MY LIBRARY</a><a class="btn" href="creators.html">CREATORS</a></div></section></div></main>';
if(window.CrowRulesMemberActions){window.CrowRulesMemberActions.bind();window.CrowRulesMemberActions.hydrate();}
document.querySelectorAll("[data-rail]").forEach(section=>{const track=section.querySelector(".ps-rail-track"),prev=section.querySelector("[data-rail-prev]"),next=section.querySelector("[data-rail-next]"),step=()=>Math.max(260,Math.floor(track.clientWidth*.72));const sync=()=>{prev.disabled=track.scrollLeft<8;next.disabled=track.scrollLeft+track.clientWidth>=track.scrollWidth-8};prev.onclick=()=>track.scrollBy({left:-step(),behavior:"smooth"});next.onclick=()=>track.scrollBy({left:step(),behavior:"smooth"});track.addEventListener("scroll",sync,{passive:true});window.addEventListener("resize",sync);sync()});
const grid=document.getElementById("episodeGrid"),search=document.getElementById("episodeSearch"),season=document.getElementById("seasonFilter"),access=document.getElementById("accessFilter"),sort=document.getElementById("sortEpisodes"),count=document.getElementById("episodeCount");
function filterEpisodes(){const term=(search.value||"").trim().toLowerCase(),sv=season.value,av=access.value;let list=eps.filter(e=>(!term||(e.title||"").toLowerCase().includes(term)||(e.description||"").toLowerCase().includes(term))&&(!sv||String(e.season_number)===sv)&&(!av||String(e.access_level||"free")===av));if(sort.value==="oldest")list.reverse();if(sort.value==="plays")list.sort((a,b)=>(Number(b.play_count)||0)-(Number(a.play_count)||0));grid.innerHTML=list.length?list.map(episodeCard).join(""):'<div class="psv3-empty">No episodes match your filters.</div>';count.textContent=list.length+" EPISODE"+(list.length===1?"":"S")+" · "+eps.length+" TOTAL";if(window.CrowRulesMemberActions){window.CrowRulesMemberActions.bind();window.CrowRulesMemberActions.hydrate()}}
[search,season,access,sort].forEach(el=>el.addEventListener("input",filterEpisodes));[season,access,sort].forEach(el=>el.addEventListener("change",filterEpisodes));
const sh=document.getElementById("share"),ss=document.getElementById("shareStatus");sh.onclick=async()=>{try{if(navigator.share)await navigator.share({title:p.title,text:"Listen to "+p.title+" on CrowRules Podcasting.",url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);ss.textContent="Link copied."}else ss.textContent="Copy this page URL from your browser address bar."}catch(e){if(e.name!=="AbortError")ss.textContent="Share unavailable."}};
}
load().catch(e=>{console.error(e);fail("Unable to load podcast",e.message||"Please try again.")});
})();
</script></body></html>
