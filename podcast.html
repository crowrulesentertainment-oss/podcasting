<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcast — CrowRules</title><link rel="stylesheet" href="css/podcasting.css"><script type="module" src="js/app.js"></script></head><body><div data-nav></div><main class="page narrow"><section class="page-head" id="podcastHead"><p class="eyebrow">PODCAST</p><h1>Loading…</h1></section><section class="panel"><div id="podcastMeta"></div><div class="controls"><button class="btn primary" id="follow">Follow Podcast</button><a class="btn" id="rss" target="_blank" rel="noopener">RSS Feed</a></div></section><section class="rank-list" id="episodes"></section></main><script type="module">import{getSupabase}from"./js/supabase.js";const sb=await getSupabase(),slug=new URLSearchParams(location.search).get("slug");async function go(){if(!sb||!slug)return;const r=await sb.from("cr_podcasts_65").select("*").eq("slug",slug).eq("is_public",true).maybeSingle();if(!r.data)return;const p=r.data;document.title=p.title+" — CrowRules";document.querySelector("#podcastHead h1").textContent=p.title;document.getElementById("podcastMeta").innerHTML="<p>"+(p.description||"")+"</p><p>"+(p.is_original?"CROWRULES ORIGINAL · ":"")+(p.category||"Podcast")+"</p>";document.getElementById("rss").href="https://cevylpnoexugwgygvtgu.supabase.co/functions/v1/podcast-rss-feed-64?slug="+encodeURIComponent(slug);const e=await sb.from("cr_creator_episodes_61").select("*").eq("project_id",p.id).eq("status","published").order("published_at",{ascending:false});document.getElementById("episodes").innerHTML=(e.data||[]).map(x=>'<div class="rank-item"><div><b>'+x.title+'</b><small>'+new Date(x.published_at||x.created_at).toLocaleDateString()+"</small></div></div>").join("")||"<div class='panel'>Episodes will appear here when published.</div>"}go();</script></body></html>
