<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcast — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main id="show" class="wrap hero"></main><section class="wrap section"><h2>Episodes</h2><div id="episodes" class="grid two"></div></section><script>addEventListener("crow:ready",async function(){var id=new URLSearchParams(location.search).get("id");if(!id)return;var p=await CROW_APP.query("podcasts","*",{eq:{id:id}}),x=p.data&&p.data[0];if(!x){show.innerHTML='<div class="notice">Podcast not found.</div>';return}show.innerHTML='<div class="eyebrow">'+(x.category||"PODCAST")+'</div><h1>'+x.title+'</h1><p class="lead">'+(x.description||"")+'</p><div class="actions"><button id="follow" class="btn primary">Follow podcast</button></div>';var e=await CROW_APP.query("episodes","*",{eq:{podcast_id:id},order:"published_at",ascending:false});episodes.innerHTML=(e.data||[]).map(function(v){return '<article class="card"><span class="eyebrow">EPISODE '+(v.episode_number||"")+'</span><h3>'+v.title+'</h3><p>'+(v.description||"")+'</p><a class="btn" href="episode.html?id='+v.id+'">Listen</a></article>'}).join("")||'<div class="notice">No episodes yet.</div>';follow.onclick=async function(){if(!window.CROW_SUPABASE){alert("Configure Supabase first.");return}var u=await CROW_SUPABASE.auth.getUser();if(!u.data.user){location.href="account.html";return}var r=await CROW_SUPABASE.from("podcast_subscriptions").upsert({podcast_id:id,user_id:u.data.user.id},{onConflict:"podcast_id,user_id"});alert(r.error?r.error.message:"Added to your library.")}});</script></body></html>
