<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05050b">
<title>Podcast | CrowRules Podcasting</title>
<meta name="description" content="Explore a podcast, follow the show, browse episodes, and continue listening on CrowRules Podcasting.">
<meta property="og:title" content="Podcast | CrowRules Podcasting">
<meta property="og:description" content="Explore podcasts and episodes on CrowRules Podcasting.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/podcasting.css">
<style>
:root{--bg:#05050b;--panel:#0d0f1b;--line:rgba(255,255,255,.1);--text:#f7f8ff;--muted:#9da4bd;--cyan:#42e8ff;--purple:#9a6cff;--pink:#ff4fd8}
body{margin:0;min-height:100vh;color:var(--text);font-family:Montserrat,Arial,sans-serif;background:radial-gradient(circle at 15% 10%,rgba(66,232,255,.1),transparent 28%),radial-gradient(circle at 85% 15%,rgba(154,108,255,.12),transparent 30%),linear-gradient(180deg,#03040a,#080a14 55%,#04050a)}
a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 32px));margin:0 auto}.page{padding:110px 0 70px}.hero{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:34px;align-items:center}.art{aspect-ratio:1;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,#11162a,#24102f);box-shadow:0 30px 90px rgba(0,0,0,.4)}.art img{width:100%;height:100%;object-fit:cover;display:block}.fallback{height:100%;display:grid;place-items:center;font:800 48px Orbitron;color:var(--cyan);background:radial-gradient(circle at 30% 20%,rgba(66,232,255,.25),transparent 30%),radial-gradient(circle at 70% 80%,rgba(255,79,216,.2),transparent 30%)}.eyebrow{display:inline-block;padding:7px 11px;border:1px solid rgba(66,232,255,.25);border-radius:999px;color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.1em}.hero h1{font:800 clamp(34px,6vw,68px)/1.05 Orbitron;margin:16px 0}.hero h1 span{background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));-webkit-background-clip:text;color:transparent}.desc{color:var(--muted);font-size:15px;line-height:1.8;max-width:760px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.chip{padding:8px 11px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;font-size:10px;color:#cbd0df}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:11px;font-weight:800}.btn.primary{border:0;color:#05050b;background:linear-gradient(135deg,var(--cyan),var(--purple))}.section{margin-top:34px;padding:24px;border:1px solid var(--line);border-radius:22px;background:rgba(13,15,27,.8)}.section h2{font:700 18px Orbitron;margin:0 0 16px}.episode{padding:17px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;align-items:center}.episode:first-child{border-top:0}.episode h3{margin:0 0 6px;font-size:14px}.episode p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}.empty{color:var(--muted);font-size:12px;padding:12px 0}.loading,.error{padding:100px 20px;text-align:center;color:var(--muted)}.error strong{display:block;color:#ffdce2;margin-bottom:8px}@media(max-width:760px){.hero{grid-template-columns:1fr}.page{padding-top:90px}.art{max-width:420px;margin:auto}}

.btn.subscribe{background:linear-gradient(135deg,var(--pink),var(--purple));border:0;color:#fff}.btn.share{border-color:rgba(66,232,255,.3)}.share-status{width:100%;font-size:10px;color:var(--muted);min-height:14px}.spinner{width:34px;height:34px;border:2px solid rgba(255,255,255,.12);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}.loading{min-height:55vh;display:grid;place-content:center;gap:8px;text-align:center}.loading strong{font:700 15px Orbitron;color:var(--text)}.loading span{font-size:11px}.hero{position:relative}.hero:before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 15% 50%,rgba(66,232,255,.08),transparent 30%),radial-gradient(circle at 80% 30%,rgba(255,79,216,.08),transparent 28%);pointer-events:none;z-index:-1}.art{position:relative}.art:after{content:"";position:absolute;inset:0;border-radius:24px;box-shadow:inset 0 0 60px rgba(0,0,0,.3);pointer-events:none}.hero-copy{position:relative}.eyebrow.live{border-color:rgba(255,79,216,.35);color:#ff8ce6}.stats{display:grid;grid-template-columns:repeat(3,minmax(90px,1fr));gap:8px;margin:22px 0}.stat{padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035)}.stat b{display:block;font:700 17px Orbitron}.stat small{display:block;color:var(--muted);font-size:9px;margin-top:4px;text-transform:uppercase;letter-spacing:.08em}.creator{display:flex;align-items:center;gap:12px;margin:22px 0}.creator img,.creator-mark{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}.creator-mark{display:grid;place-items:center;font:700 13px Orbitron;color:var(--cyan);background:#10152a}.creator b{display:block;font-size:12px}.creator small{color:var(--muted);font-size:9px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.toolbar h2{margin:0}.episode{transition:transform .18s ease,border-color .18s ease}.episode:hover{transform:translateY(-2px);border-color:rgba(66,232,255,.28)}.episode-main{min-width:0}.episode-art{width:74px;height:74px;border-radius:14px;object-fit:cover;background:#121528;flex:none}.episode-left{display:flex;align-items:center;gap:14px;min-width:0}.episode-copy{min-width:0}.episode-copy h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.episode-copy p:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.section-note{color:var(--muted);font-size:10px;line-height:1.6;margin:-7px 0 16px}.footer-cta{text-align:center;padding:28px}.footer-cta h2{margin-bottom:8px}.footer-cta p{color:var(--muted);font-size:11px}.error{min-height:55vh;display:grid;place-content:center;justify-items:center;gap:5px}.error strong{font:700 18px Orbitron}.error .btn{margin-top:14px}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.episode{align-items:flex-start}.episode-left{align-items:flex-start}.episode-art{width:62px;height:62px}.episode .btn{min-height:38px;padding:0 11px}.toolbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body data-cr-no-monetization-strip>
<div id="app"><div class="loading"><div class="spinner"></div><strong>LOADING PODCAST</strong><span>Connecting to the CrowRules Podcasting universe…</span></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/global-navigation.js"></script>
<script>
(()=>{"use strict";
const cfg=window.CROWRULES_CONFIG||{};
if(!window.supabase||!cfg.supabaseUrl||!cfg.supabaseAnonKey){document.getElementById("app").innerHTML='<div class="error"><strong>Configuration error</strong><span>CrowRules Podcasting could not initialize its data connection.</span><a class="btn" href="podcasts.html">Back to Podcasts</a></div>';return}
const db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
const app=document.getElementById("app"),params=new URLSearchParams(location.search);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const id=()=>params.get("id")||params.get("podcast_id");
const slug=()=>params.get("slug");
const duration=s=>{s=Number(s||0);if(!s)return"—";const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+"h "+String(m).padStart(2,"0")+"m":m+"m "+String(x).padStart(2,"0")+"s"};
const date=v=>v?new Date(v).toLocaleDateString([],{year:"numeric",month:"short",day:"numeric"}):"";
const initials=v=>String(v||"CR").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
async function load(){
 let pid=id();
 if(!pid&&slug()){
   const sr=await db.from("podcasts").select("id").eq("slug",slug()).eq("status","published").maybeSingle();
   if(sr.error)throw sr.error;
   pid=sr.data?.id||null;
 }
 if(!pid){renderError("Podcast not found","This page needs a valid podcast ID or slug.");return}
 const {data:p,error}=await db.from("podcasts").select("id,title,slug,category,description,artwork_url,trailer_url,website_url,rss_url,status,is_featured,is_live,listener_count,total_plays,created_at,creator_id").eq("id",pid).maybeSingle();
 if(error)throw error;if(!p){renderError("Podcast not found","The podcast may have been removed or is not available.");return}
 const [cr,ep]=await Promise.all([
   db.from("creators").select("id,name,avatar_url,bio").eq("id",p.creator_id).maybeSingle(),
   db.from("podcast_episodes").select("id,title,slug,description,episode_number,season_number,published_at,duration_seconds,thumbnail_url,status,play_count,access_level").eq("podcast_id",pid).eq("status","published").order("published_at",{ascending:false})
 ]);
 if(ep.error)console.warn("Episode query:",ep.error);if(cr.error)console.warn("Creator query:",cr.error);
 render(p,cr.data,ep.data||[]);
}
function render(p,c,episodes){
 document.title=(p.title||"Podcast")+" | CrowRules Podcasting";
 const img=p.artwork_url?'<img src="'+esc(p.artwork_url)+'" alt="'+esc(p.title)+" cover artwork"+'" loading="eager" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'">':"";
 const fallback='<div class="fallback" style="'+(p.artwork_url?"display:none":"")+'">CR</div>';
 const creator=c?'<div class="creator">'+(c.avatar_url?'<img src="'+esc(c.avatar_url)+'" alt="" loading="lazy">':'<div class="creator-mark">'+esc(initials(c.name))+'</div>')+'<div><small>CREATED BY</small><b>'+esc(c.name||"CrowRules Creator")+'</b></div></div>':"";
 const episodeCards=episodes.map(e=>{
   const ea=e.thumbnail_url?'<img class="episode-art" src="'+esc(e.thumbnail_url)+'" alt="" loading="lazy">':'<div class="episode-art fallback" style="display:grid">CR</div>';
   const numbering=[e.season_number?"Season "+e.season_number:"",e.episode_number?"Episode "+e.episode_number:""].filter(Boolean).join(" · ")||"Episode";
   return '<article class="episode"><div class="episode-left">'+ea+'<div class="episode-copy"><h3>'+esc(e.title||"Untitled Episode")+'</h3><p>'+esc(numbering)+(e.published_at?" · "+esc(date(e.published_at)):"")+" · "+esc(duration(e.duration_seconds))+(e.access_level==="premium"?" · Premium":"")+'</p><p>'+esc(e.description||"")+'</p></div></div><a class="btn" href="episode.html?id='+encodeURIComponent(e.id)+'">OPEN</a></article>';
 }).join("");
 app.innerHTML='<main class="page"><div class="wrap"><section class="hero"><div class="art">'+img+fallback+'</div><div class="hero-copy"><span class="eyebrow '+(p.is_live?"live":"")+'">'+esc((p.category||"PODCAST").toUpperCase())+(p.is_live?" · LIVE":"")+'</span><h1><span>'+esc(p.title||"Untitled Podcast")+'</span></h1><p class="desc">'+esc(p.description||"No description has been added yet.")+'</p>'+creator+'<div class="stats"><div class="stat"><b>'+episodes.length+'</b><small>Published Episodes</small></div><div class="stat"><b>'+esc(p.listener_count??"—")+'</b><small>Listeners</small></div><div class="stat"><b>'+esc(p.total_plays??"—")+'</b><small>Total Plays</small></div></div><div class="actions">'+(p.website_url?'<a class="btn primary" href="'+esc(p.website_url)+'" target="_blank" rel="noopener noreferrer">VISIT WEBSITE</a>':"")+'<a class="btn" href="podcasts.html">← ALL PODCASTS</a></div></div></section><section class="section"><div class="toolbar"><h2>Episodes</h2><span class="chip">'+episodes.length+" published</span></div><p class="section-note">Browse the latest episodes from "+esc(p.title||"this podcast")+".</p>"+(episodeCards||'<div class="empty">No published episodes are available yet. New episodes will appear here when released.</div>')+'</section><section class="section footer-cta"><h2>Keep Exploring</h2><p>Discover more shows, creators, and stories across CrowRules Podcasting.</p><div class="actions" style="justify-content:center"><a class="btn primary" href="discover.html">EXPLORE DISCOVER</a><a class="btn" href="creators.html">MEET CREATORS</a></div></section></div></main>';
}
const share=document.getElementById("sharePodcast"),shareStatus=document.getElementById("shareStatus");
 if(share)share.addEventListener("click",async()=>{
   const shareUrl=location.href;
   try{
     if(navigator.share)await navigator.share({title:p.title||"CrowRules Podcast",text:"Listen to "+(p.title||"this podcast")+" on CrowRules Podcasting.",url:shareUrl});
     else if(navigator.clipboard){await navigator.clipboard.writeText(shareUrl);if(shareStatus)shareStatus.textContent="Link copied to clipboard.";}
     else window.prompt("Copy this podcast link:",shareUrl);
   }catch(e){if(e?.name!=="AbortError"&&shareStatus)shareStatus.textContent="Share cancelled or unavailable.";}
 });
function renderError(title,msg){app.innerHTML='<div class="error"><strong>'+esc(title)+'</strong><span>'+esc(msg)+'</span><a class="btn" href="podcasts.html">← BACK TO PODCASTS</a></div>'}
load().catch(e=>{console.error("Podcast page error",e);renderError("Unable to load podcast",e?.message||"Please try again.");});
})();
</script>
</body>
</html>
