<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b">
<title>Podcast — CrowRules Podcasting</title>
<link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/app.js" defer></script>
<style>
.show-page{padding:44px 0 90px}.show-hero{display:grid;grid-template-columns:320px 1fr;gap:38px;align-items:center;padding:34px;border:1px solid rgba(255,255,255,.08);border-radius:28px;background:linear-gradient(135deg,rgba(20,20,35,.96),rgba(5,5,11,.98))}.show-art{width:100%;aspect-ratio:1;border-radius:22px;object-fit:cover;background:#10101a}.show-title{font-size:clamp(2.6rem,6vw,5.5rem);line-height:.95;margin:.15em 0}.show-description,.episode-desc{color:rgba(255,255,255,.68);line-height:1.7}.show-meta,.show-actions,.episode-meta{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.pill,.stat-pill{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.07);font-size:.78rem;color:rgba(255,255,255,.72)}.episode-section,.chat-section{margin-top:54px}.section-heading{margin-bottom:20px}.section-heading h2{font-size:2rem}.episode-card{display:grid;grid-template-columns:180px 1fr;gap:22px;padding:18px;margin-bottom:18px;border-radius:22px}.episode-art{width:180px;aspect-ratio:1;border-radius:16px;object-fit:cover}.loading-state,.empty-state{text-align:center;padding:80px 20px}
.chat-shell{display:grid;grid-template-columns:250px 1fr;gap:16px}.chat-rooms,.chat-panel{border:1px solid rgba(255,255,255,.08);background:rgba(10,10,18,.9);border-radius:22px}.chat-rooms{padding:14px}.room-btn{display:block;width:100%;text-align:left;border:1px solid transparent;background:rgba(255,255,255,.035);color:#fff;padding:12px 13px;border-radius:13px;margin-bottom:8px;cursor:pointer}.room-btn.active{border-color:rgba(0,220,255,.5);background:rgba(0,220,255,.08)}.room-btn small{display:block;color:rgba(255,255,255,.48);margin-top:3px}.chat-panel{min-height:560px;display:grid;grid-template-rows:auto 1fr auto}.chat-head{padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:12px;align-items:center}.chat-head h3{margin:0}.chat-status{font-size:.75rem;color:#7df7c7}.chat-messages{padding:18px;overflow:auto;max-height:460px}.chat-message{padding:10px 12px;margin:0 0 10px;border-radius:14px;background:rgba(255,255,255,.045)}.chat-message .who{font-size:.75rem;font-weight:700;margin-bottom:4px}.chat-message .when{font-size:.68rem;color:rgba(255,255,255,.35);margin-left:7px}.chat-message .body{line-height:1.5;word-break:break-word}.chat-compose{padding:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:9px}.chat-compose input{flex:1;min-width:0;border:1px solid rgba(255,255,255,.12);background:#08080f;color:#fff;border-radius:12px;padding:12px}.chat-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chat-note{font-size:.75rem;color:rgba(255,255,255,.48)}.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#72f5bf;margin-right:6px}.add-room{margin-top:12px;width:100%}
@media(max-width:800px){.show-hero{grid-template-columns:1fr;padding:22px}.show-art{max-width:300px;margin:auto}.episode-card{grid-template-columns:1fr}.episode-art{width:100%;max-width:220px}.chat-shell{grid-template-columns:1fr}.chat-messages{max-height:420px}}
</style></head>
<body><div data-nav></div><main class="wrap show-page">
<div id="loading" class="loading-state">Loading podcast…</div>
<section id="show" hidden></section>
<section id="episodeSection" class="episode-section" hidden><div class="section-heading"><div class="eyebrow">THE SHOW</div><h2>Latest Episodes</h2><span id="episodeCount" class="pill"></span></div><div id="episodes"></div></section>
<section id="chatSection" class="chat-section" hidden>
  <div class="section-heading"><div class="eyebrow">COMMUNITY</div><h2>Live Chatroom</h2><p class="chat-note">One embedded chat with multiple rooms. General and the current Bonded in Mystery room are ready, and podcast owners can add more rooms.</p></div>
  <div class="chat-shell">
    <aside class="chat-rooms"><div id="roomList"></div><button id="addRoomBtn" class="btn add-room" type="button" hidden>＋ Add Room</button></aside>
    <div class="chat-panel">
      <div class="chat-head"><div><h3 id="chatRoomName">Live Chat</h3><div id="chatRoomSub" class="chat-note"></div></div><div class="chat-status"><span class="live-dot"></span><span id="chatOnline">Online</span></div></div>
      <div id="chatMessages" class="chat-messages"><div class="chat-note">Loading messages…</div></div>
      <div class="chat-compose"><input id="chatInput" maxlength="1000" placeholder="Sign in to join the conversation…" autocomplete="off"><button id="chatSend" class="btn primary" type="button">Send</button></div>
    </div>
  </div>
</section>
</main>
<script>
(()=>{"use strict";
const cfg=window.CROW_CONFIG||{},id=new URLSearchParams(location.search).get("id");
const loading=document.getElementById("loading"),show=document.getElementById("show"),section=document.getElementById("episodeSection"),episodes=document.getElementById("episodes"),count=document.getElementById("episodeCount"),chatSection=document.getElementById("chatSection");
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const timeout=(p,ms=9000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error("Supabase request timed out.")),ms))]);
async function rest(table,params,method="GET",body=null){
 const u=cfg.supabaseUrl+"/rest/v1/"+table+(params?"?"+new URLSearchParams(params):"");
 const h={apikey:cfg.supabaseKey,Authorization:"Bearer "+cfg.supabaseKey,Accept:"application/json"};
 if(body)h["Content-Type"]="application/json";
 const r=await timeout(fetch(u,{method,headers:h,body:body?JSON.stringify(body):undefined,cache:"no-store"}));
 if(!r.ok){let t="";try{t=await r.text()}catch{}throw Error("Supabase returned HTTP "+r.status+(t?": "+t.slice(0,180):""))}
 return r.status===204?null:r.json();
}
let sb=null,podcast=null,rooms=[],room=null,chatChannel=null,presenceChannel=null;
async function client(){if(sb)return sb;if(window.CROW_SUPABASE)sb=window.CROW_SUPABASE;else if(window.supabase)sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return sb}
async function user(){const c=await client();if(!c)return null;const r=await c.auth.getUser();return r.data?.user||null}
function buttonFixes(){
 const followBtn=document.getElementById("followBtn"),shareBtn=document.getElementById("shareBtn"),subscribeBtn=document.getElementById("subscribeBtn");
 followBtn.onclick=async()=>{const u=await user();if(!u){location.href="account.html?returnTo="+encodeURIComponent(location.href);return}followBtn.disabled=true;try{const following=followBtn.dataset.following==="1";const c=await client();if(following){const r=await c.from("podcast_follows").delete().eq("podcast_id",podcast.id).eq("user_id",u.id);if(r.error)throw r.error}else{const r=await c.from("podcast_follows").insert({podcast_id:podcast.id,user_id:u.id});if(r.error&&r.error.code!=="23505")throw r.error}await refreshCounts();}catch(e){alert(e.message||"Unable to update follow.")}finally{followBtn.disabled=false}};
 shareBtn.onclick=async()=>{try{if(navigator.share)await navigator.share({title:podcast.title,text:"Listen to "+podcast.title+" on CrowRules Podcasting",url:location.href});else{await navigator.clipboard.writeText(location.href);shareBtn.textContent="Link Copied";setTimeout(()=>shareBtn.textContent="Share",1600)}}catch{}};
 subscribeBtn.onclick=async()=>{subscribeBtn.disabled=true;subscribeBtn.textContent="Connecting to Stripe…";try{const c=await client();const session=(await c.auth.getSession()).data.session;if(!session){location.href="account.html?returnTo="+encodeURIComponent(location.href);return}const products=await rest("cr_podcast_monetization_products",{select:"id,amount_cents,interval",podcast_id:"eq."+podcast.id+",product_type=eq.membership,active=eq.true"});if(!products[0])throw Error("This podcast does not have an active Stripe subscription yet.");const r=await c.functions.invoke("create-podcast-checkout",{body:{product_id:products[0].id,origin:cfg.siteUrl,success_url:cfg.siteUrl+"podcast.html?id="+encodeURIComponent(podcast.id)+"&checkout=success",cancel_url:cfg.siteUrl+"podcast.html?id="+encodeURIComponent(podcast.id)+"&checkout=canceled"}});if(r.error)throw r.error;if(r.data?.url){location.href=r.data.url;return}throw Error(r.data?.error||"Stripe Checkout did not return a URL.");}catch(e){alert(e.message||"Unable to start subscription.");subscribeBtn.textContent="Subscribe — $9.99/mo";subscribeBtn.disabled=false}};
}
async function refreshCounts(){try{const follows=await rest("podcast_follows",{select:"user_id",podcast_id:"eq."+podcast.id});document.getElementById("followerCount").textContent=Number(follows.length||0).toLocaleString();const u=await user();const b=document.getElementById("followBtn");b.dataset.following=u&&follows.some(x=>x.user_id===u.id)?"1":"0";b.childNodes[0].nodeValue=b.dataset.following==="1"?"Following ":"Follow ";const subs=await rest("podcast_subscriptions",{select:"user_id",podcast_id:"eq."+podcast.id+",status=in.(active,trialing)"});document.getElementById("subscriberCount").textContent=Number(subs.length||0).toLocaleString()}catch(e){console.warn("Counts:",e)}}
function renderRooms(){const list=document.getElementById("roomList");list.innerHTML=rooms.map(r=>'<button class="room-btn '+(room&&room.id===r.id?"active":"")+'" data-room="'+esc(r.id)+'">'+esc(r.name)+(r.is_live?'<small><span class="live-dot"></span>Live now</small>':'<small>Community room</small>')+"</button>").join("");list.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>selectRoom(b.dataset.room));document.getElementById("addRoomBtn").hidden=true;user().then(async u=>{if(!u)return;try{const owner=await rest("podcasts",{select:"id",id:"eq."+podcast.id+",creator_id=eq."+u.id});document.getElementById("addRoomBtn").hidden=!owner.length}catch{}})}
async function loadRooms(){rooms=await rest("podcast_chat_rooms",{select:"id,podcast_id,slug,name,is_live,created_at",podcast_id:"eq."+podcast.id,order:"created_at.asc"});if(!rooms.length){try{const u=await user();if(u){await rest("podcast_chat_rooms","", "POST",{podcast_id:podcast.id,slug:"general",name:"General",is_live:false})}}catch{}rooms=await rest("podcast_chat_rooms",{select:"id,podcast_id,slug,name,is_live,created_at",podcast_id:"eq."+podcast.id,order:"created_at.asc"})}renderRooms();if(rooms.length)await selectRoom(room?.id||rooms[0].id)}
async function selectRoom(roomId){if(chatChannel)await chatChannel.unsubscribe();if(presenceChannel)await presenceChannel.unsubscribe();room=rooms.find(r=>r.id===roomId)||rooms[0];if(!room)return;renderRooms();document.getElementById("chatRoomName").textContent=room.name;document.getElementById("chatRoomSub").textContent=room.is_live?"Live conversation":"Community conversation";const box=document.getElementById("chatMessages");box.innerHTML='<div class="chat-note">Loading messages…</div>';try{const msgs=await rest("podcast_chat_messages",{select:"id,room_id,user_id,display_name,message,created_at,is_hidden",room_id:"eq."+room.id,is_hidden:"eq.false",order:"created_at.asc",limit:"100"});renderMessages(msgs)}catch(e){box.innerHTML='<div class="chat-note">'+esc(e.message)+'</div>'}
 const c=await client();if(!c)return;
 chatChannel=c.channel("podcast-chat-"+room.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"podcast_chat_messages",filter:"room_id=eq."+room.id},p=>{if(!p.new.is_hidden)appendMessage(p.new)}).subscribe();
 presenceChannel=c.channel("podcast-presence-"+room.id,{config:{presence:{key:(await user())?.id||crypto.randomUUID()}}}).on("presence",{event:"sync"},()=>{const state=presenceChannel.presenceState();document.getElementById("chatOnline").textContent=Object.keys(state).length+" online"}).subscribe(async status=>{if(status==="SUBSCRIBED"){const u=await user();await presenceChannel.track({user_id:u?.id||null,online_at:new Date().toISOString()})}});
}
function renderMessages(msgs){const box=document.getElementById("chatMessages");box.innerHTML="";if(!msgs.length){box.innerHTML='<div class="chat-note">No messages yet. Start the conversation.</div>';return}msgs.forEach(appendMessage)}
function appendMessage(m){const box=document.getElementById("chatMessages");if(box.querySelector('[data-empty]'))box.innerHTML="";const el=document.createElement("div");el.className="chat-message";el.innerHTML='<div class="who">'+esc(m.display_name||"Member")+' <span class="when">'+new Date(m.created_at).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+"</span></div><div class="body">"+esc(m.message)+"</div>";box.appendChild(el);box.scrollTop=box.scrollHeight}
async function sendMessage(){const input=document.getElementById("chatInput"),text=input.value.trim();if(!text||!room)return;const u=await user();if(!u){location.href="account.html?returnTo="+encodeURIComponent(location.href);return}const btn=document.getElementById("chatSend");btn.disabled=true;try{const name=u.user_metadata?.full_name||u.email?.split("@")[0]||"Member";const r=await rest("podcast_chat_messages","POST","POST",{room_id:room.id,user_id:u.id,display_name:name,message:text,is_hidden:false});input.value="";}catch(e){alert(e.message||"Unable to send message.")}finally{btn.disabled=false;input.focus()}}
document.getElementById("chatSend").onclick=sendMessage;document.getElementById("chatInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
document.getElementById("addRoomBtn").onclick=async()=>{const u=await user();if(!u)return;const name=prompt("New chat room name:");if(!name?.trim())return;const slug=name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,60);if(!slug)return;try{await rest("podcast_chat_rooms","POST","POST",{podcast_id:podcast.id,slug,name:name.trim().slice(0,80),is_live:false});await loadRooms()}catch(e){alert("Unable to add room: "+e.message)}};
async function fail(e){loading.hidden=true;show.hidden=false;show.innerHTML='<div class="card empty-state"><div class="eyebrow">CONNECTION ISSUE</div><h2>Podcast could not load</h2><p>'+esc(e?.message||"Please try again.")+'</p><a class="btn primary" href="podcasts.html">Back to Podcasts</a> <button class="btn" type="button" id="retryBtn">Retry</button></div>';document.getElementById("retryBtn").onclick=()=>location.reload()}
async function load(){
 if(!id){await fail(Error("No podcast was specified."));return}
 try{
  const rows=await rest("podcasts",{select:"id,title,slug,category,description,artwork_url,author_name,language,explicit_content,is_live,listener_count,status",id:"eq."+id+",status=eq.published"});podcast=rows[0];if(!podcast)throw Error("This podcast is unavailable.");
  document.title=podcast.title+" — CrowRules Podcasting";
  show.innerHTML='<div class="show-hero"><img class="show-art" src="'+esc(podcast.artwork_url||"assets/podcast-placeholder.svg")+'" alt="'+esc(podcast.title)+' artwork"><div><div class="eyebrow">'+esc(podcast.category||"PODCAST")+'</div><h1 class="show-title">'+esc(podcast.title)+'</h1><div class="show-meta">'+(podcast.author_name?'<span class="pill">By '+esc(podcast.author_name)+'</span>':"")+(podcast.language?'<span class="pill">'+esc(podcast.language.toUpperCase())+'</span>':"")+(podcast.is_live?'<span class="pill">● Live</span>':"")+'</div><p class="show-description">'+esc(podcast.description||"A CrowRules Podcasting show.")+'</p><div class="show-actions"><button id="subscribeBtn" class="btn primary" type="button">Subscribe — $9.99/mo</button><button id="followBtn" class="btn" type="button">Follow <span id="followerCount">0</span></button><span class="stat-pill">Subscribers <strong id="subscriberCount">0</strong></span><button id="shareBtn" class="btn" type="button">Share</button><a class="btn" href="podcasts.html">All Podcasts</a><a class="btn" href="discover.html">Explore</a></div></div></div>';
  loading.hidden=true;show.hidden=false;buttonFixes();await refreshCounts();
  let eps=[];try{eps=await rest("podcast_episodes",{select:"id,title,description,episode_number,season_number,published_at,duration_seconds,thumbnail_url,play_count,status",podcast_id:"eq."+podcast.id+",status=eq.published",order:"published_at.desc"})}catch(e){console.warn("Episodes:",e)}
  section.hidden=false;count.textContent=eps.length+" "+(eps.length===1?"episode":"episodes");episodes.innerHTML=eps.length?eps.map(e=>'<article class="card episode-card"><img class="episode-art" src="'+esc(e.thumbnail_url||podcast.artwork_url||"assets/podcast-placeholder.svg")+'" alt="'+esc(e.title)+' artwork"><div><div class="eyebrow">'+esc(e.episode_number?"EPISODE "+e.episode_number:"EPISODE")+'</div><h3>'+esc(e.title)+'</h3><div class="episode-meta">'+(e.published_at?'<span class="pill">'+new Date(e.published_at).toLocaleDateString()+'</span>':"")+(e.duration_seconds?'<span class="pill">'+Math.round(Number(e.duration_seconds)/60)+" min</span>":"")+'</div><p class="episode-desc">'+esc(e.description||"Listen to this episode of "+podcast.title+".")+'</p><a class="btn primary" href="episode.html?id='+encodeURIComponent(e.id)+'">Listen Now</a></div></article>').join(""):'<div class="card empty-state"><div class="eyebrow">COMING SOON</div><h3>No published episodes yet.</h3></div>';
  chatSection.hidden=false;await loadRooms();
 }catch(e){await fail(e)}
}
load();
})();
</script></body></html>
