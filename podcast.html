*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#00dcff12,transparent 30%),radial-gradient(circle at 90% 10%,#8b5cf615,transparent 32%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1240px,calc(100% - 32px));margin:auto}.page{padding:34px 0 90px}.hidden{display:none!important}.card{background:#0d1019e8;border:1px solid var(--line);border-radius:24px}.eyebrow{font-size:.7rem;font-weight:900;letter-spacing:.18em;color:var(--cyan)}.muted{color:var(--muted);line-height:1.65}.loading{text-align:center;padding:90px 24px}.loading h1{font-size:clamp(2rem,5vw,4rem);margin:12px 0}.spinner{width:34px;height:34px;border:3px solid #ffffff18;border-top-color:var(--cyan);border-radius:50%;margin:25px auto 0;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.diagnostic{margin-top:18px;padding:18px;text-align:left;background:#070a12;border-radius:16px;border:1px solid var(--line)}.diagnostic code{color:#9feaff;word-break:break-word}.hero{display:grid;grid-template-columns:330px 1fr;gap:38px;align-items:end;padding:38px;overflow:hidden;min-height:480px;background:#080910}.art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px}.title{font-size:clamp(2.6rem,6vw,5.8rem);line-height:.92;margin:10px 0 16px}.chips,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.chip{border:1px solid var(--line);background:#ffffff08;border-radius:999px;padding:7px 11px;font-size:.76rem}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#ffffff08;color:#fff;border-radius:11px;padding:10px 15px;text-decoration:none;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#00bfe0,#7c4cf3);border:0}.follow-btn.active{background:#00dcff18;border-color:#00dcff;color:#9feaff}.subscribe-btn{font-weight:800}.share-btn{font-weight:800;border-color:#00dcff45;background:#00dcff0d}.share-btn.copied{background:#7df7c718;border-color:#7df7c7;color:#7df7c7}.share-preview{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;margin-top:14px;padding:14px;border:1px solid #ffffff12;border-radius:16px;background:#ffffff06}.share-preview img{width:120px;height:120px;object-fit:cover;border-radius:12px;background:#080b14}.share-preview-title{font-size:1.05rem;font-weight:900;margin:3px 0 6px}.share-preview-description{color:var(--muted);font-size:.82rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.share-preview-url{margin-top:9px;color:#9feaff;font-size:.7rem;word-break:break-all}.share-panel{margin-top:14px;padding:18px;border:1px solid #00dcff35;border-radius:18px;background:linear-gradient(145deg,#080d17,#110b1e);box-shadow:0 18px 50px #0007}.share-panel.hidden{display:none}.share-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.share-title{font-size:1.25rem;font-weight:900;margin-top:4px}.share-close{border:1px solid #ffffff18;background:#ffffff08;color:#cbd3e5;border-radius:10px;width:36px;height:36px;cursor:pointer}.share-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.share-option{min-height:58px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #ffffff14;background:#ffffff07;color:#fff;border-radius:12px;font-weight:800;cursor:pointer;text-decoration:none}.share-option:hover{border-color:#00dcff55;background:#00dcff0d}.share-status{min-height:18px;margin-top:10px;text-align:center;color:var(--green);font-size:.75rem;font-weight:800}.data-warning{margin-top:12px;padding:12px 14px;border:1px solid #fbbf2440;background:#fbbf2409;border-radius:12px;color:#fde68a;font-size:.78rem}.data-warning button{margin-left:8px}.error-inline{color:var(--red);font-size:.78rem}.skeleton{background:linear-gradient(90deg,#ffffff06,#ffffff10,#ffffff06);background-size:200% 100%;animation:shimmer 1.4s infinite}@keyframes shimmer{to{background-position:-200% 0}}@media(max-width:600px){.share-preview{grid-template-columns:80px 1fr}.share-preview img{width:80px;height:80px}}.btn:disabled{opacity:.55;cursor:not-allowed}.section{margin-top:42px}.section h2{font-size:2rem}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:20px;text-align:center;background:#0d1019e8;border:1px solid var(--line);border-radius:18px}.stat-value{font-size:2rem;font-weight:900;line-height:1.1;color:#fff}.stat-label{margin-top:7px;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.ranking-controls{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:14px 0 18px}.period-tabs{display:flex;gap:8px;flex-wrap:wrap}.period-tab{border:1px solid var(--line);background:#ffffff06;color:var(--muted);border-radius:999px;padding:9px 15px;font-weight:800;cursor:pointer}.period-tab.active{background:linear-gradient(135deg,#00bfe0,#7c4cf3);border-color:transparent;color:#fff}.trend-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:18px}.trend-card{padding:22px;position:relative;overflow:hidden;background:linear-gradient(135deg,#101827,#0d1019)}.trend-card:after{content:"";position:absolute;inset:auto -30px -60px auto;width:150px;height:150px;border-radius:50%;background:#00dcff12}.trend-label{font-size:.68rem;font-weight:900;letter-spacing:.16em;color:var(--cyan)}.trend-rank{font-size:2.1rem;font-weight:950;margin:5px 0}.trend-name{font-size:1.15rem;font-weight:900}.trend-meta{color:var(--muted);font-size:.78rem;margin-top:5px}.trend-score{margin-top:14px;font-weight:900}.ranking-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.ranking-card{padding:18px}.ranking-card h3{margin:0 0 12px}.rank-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.rank-row:last-child{border-bottom:0}.rank-num{font-weight:900;color:var(--cyan)}.rank-row.rank-gold,.rank-row.rank-silver,.rank-row.rank-bronze{border-radius:14px;padding:13px 10px;margin:3px 0;border:1px solid transparent}.rank-row.rank-gold{background:linear-gradient(90deg,#ffd70018,transparent);border-color:#ffd70045}.rank-row.rank-silver{background:linear-gradient(90deg,#cbd5e118,transparent);border-color:#cbd5e145}.rank-row.rank-bronze{background:linear-gradient(90deg,#cd7f3218,transparent);border-color:#cd7f3245}.rank-medal{font-size:1.15rem;margin-left:3px}.growth{font-size:.68rem;font-weight:900;margin-top:3px}.growth.positive{color:var(--green)}.growth.negative{color:var(--red)}.growth.neutral{color:var(--muted)}.live-pulse{display:inline-flex;align-items:center;gap:8px;font-size:.68rem;font-weight:900;letter-spacing:.12em;color:#9feaff;border:1px solid #00dcff45;background:#00dcff0d;border-radius:999px;padding:7px 11px}.live-dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 0 #00dcff88;animation:pulse 1.7s infinite}@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}.rank-row.rank-up{animation:rankUp .7s ease both}.rank-row.rank-down{animation:rankDown .7s ease both}@keyframes rankUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@keyframes rankDown{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:none}}.rank-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank-meta{font-size:.72rem;color:var(--muted);margin-top:3px}.rank-score{font-weight:900;text-align:right}.rank-movement{font-size:.7rem;font-weight:900;margin-top:4px}.rank-movement.up{color:var(--green)}.rank-movement.down{color:var(--red)}.rank-movement.new{color:var(--cyan)}.episode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.episode{overflow:hidden;padding:0}.episode img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.episode-body{padding:17px}.episode h3{margin:0 0 7px}.episode p{color:var(--muted);line-height:1.55}.audio{width:100%;margin-top:10px}.system{padding:18px}.system-row{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.ok{color:var(--green)}.bad{color:var(--red)}@media(max-width:800px){.trend-grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr;padding:24px}.hero .art{max-width:330px}.stats-grid{grid-template-columns:repeat(2,1fr)}.ranking-grid{grid-template-columns:1fr}.episode-grid{grid-template-columns:1fr}}
</style>

<body>
<div data-nav></div>
<div id="root" class="wrap page">
<section id="loading" class="card loading">
 <div class="eyebrow">PODCAST SYSTEM</div>
 <h1>Loading podcast universe…</h1>
 <p id="loadingText" class="muted">Starting the CrowRules Podcasting engine.</p>
 <div class="spinner" aria-hidden="true"></div>
 <div id="diagnostic" class="diagnostic hidden"></div>
</section>
<section id="app" class="hidden">
 <div id="hero" class="card hero"></div>
 <section class="section">
  <div class="eyebrow">PODCAST STATS</div>
  <div id="statsGrid" class="stats-grid" aria-label="Podcast statistics"></div>
 </section>
 <section class="section">
  <div class="eyebrow">CROWRULES RANKINGS</div>
  <div class="ranking-controls"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h2 style="margin:0">Top Rankings</h2><span class="live-pulse"><span class="live-dot"></span>TRENDING NOW</span></div><div class="period-tabs" role="tablist" aria-label="Ranking period"><button class="period-tab active" data-period="today" type="button">Today</button><button class="period-tab" data-period="7_days" type="button">7 Days</button><button class="period-tab" data-period="30_days" type="button">30 Days</button><button class="period-tab" data-period="all_time" type="button">All Time</button></div></div>
  <div id="trendGrid" class="trend-grid"></div>
  <div id="rankingGrid" class="ranking-grid"></div>
 </section>
 <section class="section">
  <h2>Episodes</h2>
  <div id="episodes" class="episode-grid"></div>
 </section>
 <section class="section card system">
  <div class="eyebrow">SYSTEM STATUS</div>
  <div class="system-row"><span>Podcast JavaScript</span><strong class="ok">Running</strong></div>
  <div class="system-row"><span>Supabase Data API</span><strong id="dbStatus">Checking…</strong></div>
  <div class="system-row"><span>Authentication</span><strong id="authStatus">Background</strong></div>
  <div class="actions" style="margin-top:15px"><a class="btn" href="podcasts.html">← All Podcasts</a><button class="btn" id="retry">Reload Podcast</button></div>
 </section>
</section>

<script>
(function(){
"use strict";
var cfg=window.CROW_CONFIG||{};
var loading=document.getElementById("loading");
var loadingText=document.getElementById("loadingText");
var diagnostic=document.getElementById("diagnostic");
var app=document.getElementById("app");
var hero=document.getElementById("hero");
var episodesEl=document.getElementById("episodes");
var statsGrid=document.getElementById("statsGrid");
var rankingGrid=document.getElementById("rankingGrid");
var trendGrid=document.getElementById("trendGrid");
var rankingTabs=[].slice.call(document.querySelectorAll(".period-tab"));
var activePeriod="today";
var dbStatus=document.getElementById("dbStatus");
var authStatus=document.getElementById("authStatus");
var followBtn=null;
var followCount=null;
var subscribeBtn=null;
var shareBtn=null;
var sharePanel=null;
var authClient=null;
var currentPodcast=null;
var subscriptionProduct=null;
var esc=function(v){return String(v==null?"":v).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var escAttr=function(v){return esc(v).replace(/'/g,"&#39;")};
var optional=function(p,fallback){return p.then(function(v){return v}).catch(function(e){console.warn("Optional podcast request failed",e);return fallback})};
var rest=function(path){
 var url=String(cfg.supabaseUrl||"").replace(/\/$/,"")+"/rest/v1/"+path;
 return fetch(url,{headers:{"apikey":cfg.supabaseKey||"","Authorization":"Bearer "+(cfg.supabaseKey||""),"Accept":"application/json"},cache:"no-store"}).then(function(r){
   return r.text().then(function(t){var data=null;try{data=t?JSON.parse(t):null}catch(e){}
     if(!r.ok){throw new Error("HTTP "+r.status+(data&&data.message?": "+data.message:t?" — "+t.slice(0,180):""))}
     return data;
   });
 });
};
function shareUrls(){
 var u=encodeURIComponent(location.href),t=encodeURIComponent((currentPodcast&&currentPodcast.title||"CrowRules Podcast")+" — CrowRules Podcasting");
 return {facebook:"https://www.facebook.com/sharer/sharer.php?u="+u,x:"https://twitter.com/intent/tweet?url="+u+"&text="+t,reddit:"https://www.reddit.com/submit?url="+u+"&title="+t,email:"mailto:?subject="+t+"&body="+encodeURIComponent("Listen on CrowRules Podcasting: "+location.href)};
}
function updateSharePreview(){
 if(!currentPodcast)return;
 var art=document.getElementById("sharePreviewArt"),title=document.getElementById("sharePreviewTitle"),desc=document.getElementById("sharePreviewDescription"),url=document.getElementById("sharePreviewUrl");
 if(art){art.src=currentPodcast.artwork_url||"assets/podcast-placeholder.svg";art.onerror=function(){this.onerror=null;this.src="assets/podcast-placeholder.svg"}}
 if(title)title.textContent=currentPodcast.title||"CrowRules Podcast";
 if(desc)desc.textContent=currentPodcast.description||"Listen on CrowRules Podcasting.";
 if(url)url.textContent=location.href;
}
function setShareLinks(){var s=shareUrls();["Facebook","X","Reddit","Email"].forEach(function(k){var el=document.getElementById("share"+k);if(el)el.href=s[k.toLowerCase()]});}
function setShareStatus(msg){var el=document.getElementById("shareStatus");if(el){el.textContent=msg;clearTimeout(window.__shareTimer);window.__shareTimer=setTimeout(function(){el.textContent=""},2500)}}
function openSharePanel(){updateSharePreview();setShareLinks();sharePanel.classList.remove("hidden");}
async function copyPodcastLink(){
 try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(location.href);else{var i=document.createElement("input");i.value=location.href;document.body.appendChild(i);i.select();document.execCommand("copy");i.remove()}setShareStatus("Podcast link copied.");}
 catch(e){setShareStatus("Copy failed. You can use a social sharing option instead.");}
}
async function nativeSharePodcast(){
 var data={title:(currentPodcast&&currentPodcast.title||"CrowRules Podcast"),text:"Listen to "+(currentPodcast&&currentPodcast.title||"this podcast")+" on CrowRules Podcasting.",url:location.href};
 if(!navigator.share){setShareStatus("Native Share is not available in this browser.");return}
 try{if(navigator.canShare&&!navigator.canShare(data)){setShareStatus("This browser cannot share this link natively.");return}await navigator.share(data)}catch(e){if(!e||e.name!=="AbortError")setShareStatus("Native Share could not be opened.")}
}
async function sharePodcast(){
 var data={title:(currentPodcast&&currentPodcast.title||"CrowRules Podcast"),text:"Listen to "+(currentPodcast&&currentPodcast.title||"this podcast")+" on CrowRules Podcasting.",url:location.href};
 if(navigator.share&&(!navigator.canShare||navigator.canShare(data))){try{await navigator.share(data);return}catch(e){if(e&&e.name==="AbortError")return}}
 if(sharePanel.classList.contains("hidden"))openSharePanel();else sharePanel.classList.add("hidden");
}
function fail(e){
 var msg=String(e&&e.message||e||"Unknown JavaScript error");
 loadingText.textContent="The loading sequence stopped before the podcast could render.";
 diagnostic.classList.remove("hidden");
 diagnostic.innerHTML="<strong>Diagnostic:</strong><br><code>"+esc(msg)+"</code><br><br><span class='muted'>This is the new isolated loader. Optional sitewide scripts are not part of the critical path.</span>";
}
function show(){
 loading.classList.add("hidden");app.classList.remove("hidden");
}
function render(p,eps,stats,rankings){
 document.title=(p.title||"Podcast")+" — CrowRules Podcasting";
 var art=escAttr(p.artwork_url||"assets/podcast-placeholder.svg");
 hero.innerHTML="<img class='art' src='"+art+"' alt='"+esc(p.title||"Podcast")+" artwork'><div><div class='eyebrow'>CROWRULES PODCASTING</div><h1 class='title'>"+esc(p.title||"Untitled Podcast")+"</h1><p class='muted'>"+esc(p.description||"A CrowRules Podcasting show.")+"</p><div class='chips'><span class='chip'>"+esc(p.category||"Podcast")+"</span>"+(p.author_name?"<span class='chip'>"+esc(p.author_name)+"</span>":"")+(p.is_live?"<span class='chip'>● Live</span>":"")+"</div><div class='actions' style='margin-top:20px'><button class='btn follow-btn' id='followBtn' type='button'>♡ Follow <span id='followCount'>0</span></button><button class='btn primary subscribe-btn' id='subscribeBtn' type='button'>Subscribe</button><button class='btn share-btn' id='shareBtn' type='button'>↗ Share</button><a class='btn' href='podcasts.html'>Browse Podcasts</a><div id='sharePanel' class='share-panel hidden' style='flex-basis:100%'><div class='share-head'><div><div class='eyebrow'>CROWRULES SHARING</div><div class='share-title'>Share this podcast</div></div><button id='shareClose' class='share-close' type='button' aria-label='Close share panel'>✕</button></div><div class='share-preview'><img id='sharePreviewArt' src='assets/podcast-placeholder.svg' alt='Podcast artwork'><div><div class='share-preview-title' id='sharePreviewTitle'>Podcast</div><div class='share-preview-description' id='sharePreviewDescription'>Listen on CrowRules Podcasting.</div><div class='share-preview-url' id='sharePreviewUrl'></div></div></div><div class='share-grid'><a class='share-option' id='shareFacebook' href='#' target='_blank' rel='noopener'>Facebook</a><a class='share-option' id='shareX' href='#' target='_blank' rel='noopener'>𝕏 X</a><a class='share-option' id='shareReddit' href='#' target='_blank' rel='noopener'>Reddit</a><a class='share-option' id='shareEmail' href='#'>✉ Email</a><button class='share-option' id='shareCopy' type='button'>🔗 Copy Link</button><button class='share-option' id='shareNative' type='button'>↗ Native Share</button></div><div id='shareStatus' class='share-status' aria-live='polite'></div></div></div></div>";
 var s=stats||{};
 statsGrid.innerHTML="<div class='stat'><div class='stat-value'>"+Number(s.follower_count||0).toLocaleString()+"</div><div class='stat-label'>Followers</div></div><div class='stat'><div class='stat-value'>"+Number(s.episode_count||eps.length||0).toLocaleString()+"</div><div class='stat-label'>Episodes</div></div><div class='stat'><div class='stat-value'>"+Number(s.listen_count||0).toLocaleString()+"</div><div class='stat-label'>Listens</div></div><div class='stat'><div class='stat-value'>"+(Number(s.seconds_listened||0)/3600).toFixed(1)+"</div><div class='stat-label'>Hours Listened</div></div>";
 var r=rankings||{};
 function periodItems(type){return r[type]&&r[type][activePeriod]||[];}
 function pct(v,label){if(v===null||v===undefined||!isFinite(Number(v)))return "";var n=Number(v);return "<span class='growth "+(n>0?"positive":n<0?"negative":"neutral")+"'>"+(n>0?"+":"")+n.toFixed(1)+"% "+label+"</span>";}
 function movement(x){var m=String(x.movement||"").toLowerCase();var label=x.movement_label||"—";var growth=pct(x.follower_growth_percent,"followers")+pct(x.listener_growth_percent,"listeners")+pct(x.listening_time_growth_percent,"listening time");if(!growth&&x.previous_rank&&x.ranking){var delta=Number(x.previous_rank)-Number(x.ranking);if(delta){var p=(Math.abs(delta)/Math.max(Number(x.previous_rank),1))*100;growth="<span class='growth "+(delta>0?"positive":"negative")+"'>"+(delta>0?"+":"-")+p.toFixed(0)+"% rank momentum</span>";}}return "<div class='rank-movement "+(m==="up"?"up":m==="down"?"down":m==="new"?"new":"")+"'>"+esc(label)+"</div><div style='display:flex;gap:8px;flex-wrap:wrap'>"+growth+"</div>";}
 function rankingList(title,items,nameField,metaField){
   var html="<div class='card ranking-card'><h3>"+title+"</h3>";
   if(!items||!items.length) html+="<div class='muted'>No ranking data for this period yet.</div>";
   else html+=items.slice(0,5).map(function(x){var n=Number(x.ranking);var cls=n===1?"rank-gold":n===2?"rank-silver":n===3?"rank-bronze":"";var medal=n===1?"<span class='rank-medal'>🥇</span>":n===2?"<span class='rank-medal'>🥈</span>":n===3?"<span class='rank-medal'>🥉</span>":"";var anim=String(x.movement||"").toLowerCase();cls+=" "+(anim==="up"?"rank-up":anim==="down"?"rank-down":"");return "<div class='rank-row "+cls+"'><div class='rank-num'>#"+esc(x.ranking)+medal+"</div><div><div class='rank-name'>"+esc(x[nameField]||"Untitled")+"</div><div class='rank-meta'>"+metaField(x)+"</div>"+movement(x)+"</div><div class='rank-score'>"+Number(x.ranking_score||0).toLocaleString()+"</div></div>"}).join("");
   return html+"</div>";
 }
 var pi=periodItems("podcasts"),ei=periodItems("episodes"),hi=periodItems("hosts");
 var topP=pi[0],topE=ei[0],topH=hi[0];
 function spotlight(label,x,name,meta){if(!x)return "<div class='card trend-card'><div class='trend-label'>"+label+"</div><div class='trend-rank'>#1</div><div class='muted'>No ranking data yet.</div></div>";return "<div class='card trend-card'><div class='trend-label'>"+label+"</div><div class='trend-rank'>#1</div><div class='trend-name'>"+esc(x[name]||"Untitled")+"</div><div class='trend-meta'>"+meta(x)+"</div><div class='trend-score'>Score "+Number(x.ranking_score||0).toLocaleString()+" · "+esc(x.movement_label||"NEW")+"</div></div>";}
 trendGrid.innerHTML=spotlight("TRENDING PODCAST",topP,"podcast_title",function(x){return Number(x.followers||0).toLocaleString()+" followers · "+Number(x.listens||0).toLocaleString()+" listens";})+spotlight("TRENDING EPISODE",topE,"episode_title",function(x){return esc(x.podcast_title||"")+" · "+Number(x.listens||0).toLocaleString()+" listens";})+spotlight("TRENDING HOST",topH,"host_name",function(x){return Number(x.podcast_count||0).toLocaleString()+" podcasts · "+Number(x.listens||0).toLocaleString()+" listens";});
 rankingGrid.innerHTML=rankingList("Podcast Ranking",pi,"podcast_title",function(x){return Number(x.followers||0).toLocaleString()+" followers · "+Number(x.listens||0).toLocaleString()+" listens";})+rankingList("Episode Ranking",ei,"episode_title",function(x){return esc(x.podcast_title||"")+" · "+Number(x.play_count||0).toLocaleString()+" plays";})+rankingList("Host Ranking",hi,"host_name",function(x){return Number(x.podcast_count||0).toLocaleString()+" podcasts · "+Number(x.followers||0).toLocaleString()+" followers";});
 if(!eps.length){episodesEl.innerHTML="<div class='card' style='padding:25px;grid-column:1/-1'><strong>No published episodes yet.</strong><p class='muted'>This podcast is published, but no published episodes are available.</p></div>";return}
 episodesEl.innerHTML=eps.map(function(e){var thumb=escAttr(e.thumbnail_url||p.artwork_url||"assets/podcast-placeholder.svg");var audio=e.audio_url?"<audio class='audio' controls preload='none' src='"+escAttr(e.audio_url)+"'></audio>":"";return "<article class='card episode'><img src='"+thumb+"' alt='"+escAttr(e.title||"Episode artwork")+"' loading='lazy' onerror='this.onerror=null;this.src=\"assets/podcast-placeholder.svg\"'><div class='episode-body'><div class='eyebrow'>EPISODE "+esc(e.episode_number||"")+"</div><h3>"+esc(e.title||"Untitled Episode")+"</h3><p>"+esc(e.description||"")+"</p>"+audio+"</div></article>"}).join("");
}
async function load(){
 var pid=new URLSearchParams(location.search).get("id");
 if(!pid){throw new Error("No podcast ID was supplied in the URL.")}
 if(!cfg.supabaseUrl||!cfg.supabaseKey){throw new Error("CrowRules Supabase configuration is missing.")}
 loadingText.textContent="Connecting directly to the CrowRules Data API…";
 var uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(pid);
 var filter=uuid?"id=eq."+encodeURIComponent(pid):"slug=eq."+encodeURIComponent(pid);
 var cols="*";
 var rows=await rest("podcasting_podcast_directory?select="+encodeURIComponent(cols)+"&status=eq.published&"+filter+"&limit=1");
 if(!rows||!rows.length){
   rows=await rest("podcasts?select="+encodeURIComponent(cols)+"&status=eq.published&"+filter+"&limit=1");
 }
 if(!rows||!rows.length)throw new Error("Podcast not found. The show may not be published yet.");
 var p=rows[0]; currentPodcast=p;
 try {
   var products=await rest("cr_podcast_monetization_products?select=id,podcast_id,name,amount_cents,interval,active,product_type&podcast_id=eq."+encodeURIComponent(p.id)+"&product_type=eq.membership&active=eq.true&limit=1");
   subscriptionProduct=products&&products[0]||null;
 } catch(_) { subscriptionProduct=null; }
 loadingText.textContent="Loading published episodes…";
 var eps=await rest("podcast_episodes?select=*&podcast_id=eq."+encodeURIComponent(p.id)+"&status=eq.published&order=published_at.desc").catch(function(e){console.warn("Episodes unavailable",e);return[]});
 var statsRows=await rest("podcast_public_stats?select=episode_count,follower_count,listen_count,seconds_listened,completed_listens&podcast_id=eq."+encodeURIComponent(p.id)+"&limit=1").catch(function(e){console.warn("Stats unavailable",e);return[]});
 var stats=statsRows&&statsRows[0]||{episode_count:(eps||[]).length};
 loadingText.textContent="Building time-based podcast, episode and host rankings…";
 var rankResults=await Promise.all([
   rest("podcast_rankings_period_live?select=*&period_type=in.(today,7_days,30_days,all_time)&order=period_type.asc,ranking.asc&limit=100"),
   rest("episode_rankings_period_live?select=*&period_type=in.(today,7_days,30_days,all_time)&order=period_type.asc,ranking.asc&limit=100"),
   rest("host_rankings_period_live?select=*&period_type=in.(today,7_days,30_days,all_time)&order=period_type.asc,ranking.asc&limit=100"),
   rest("podcast_rankings_growth_live?select=*&period_type=in.(today,7_days,30_days,all_time)&limit=100"),
   rest("episode_rankings_growth_live?select=*&period_type=in.(today,7_days,30_days,all_time)&limit=100"),
   rest("host_rankings_growth_live?select=*&period_type=in.(today,7_days,30_days,all_time)&limit=100")
 ].map(function(p){return p.catch(function(e){console.warn("Ranking request unavailable",e);return[]})}));
 var rankings={podcasts:{},episodes:{},hosts:{}};
 var growth={podcasts:{},episodes:{},hosts:{}};
 ["today","7_days","30_days","all_time"].forEach(function(period){rankings.podcasts[period]=[];rankings.episodes[period]=[];rankings.hosts[period]=[];});
 (rankResults[0]||[]).forEach(function(x){(rankings.podcasts[x.period_type]||(rankings.podcasts[x.period_type]=[])).push(x);});
 (rankResults[1]||[]).forEach(function(x){(rankings.episodes[x.period_type]||(rankings.episodes[x.period_type]=[])).push(x);});
 (rankResults[2]||[]).forEach(function(x){(rankings.hosts[x.period_type]||(rankings.hosts[x.period_type]=[])).push(x);});
 (rankResults[3]||[]).forEach(function(x){growth.podcasts[x.period_type+"_"+x.podcast_id]=x;});
 (rankResults[4]||[]).forEach(function(x){growth.episodes[x.period_type+"_"+x.episode_id]=x;});
 (rankResults[5]||[]).forEach(function(x){growth.hosts[x.period_type+"_"+x.host_key]=x;});
 Object.keys(rankings.podcasts).forEach(function(period){rankings.podcasts[period].forEach(function(x){var g=growth.podcasts[period+"_"+x.podcast_id];if(g)Object.assign(x,g);});});
 Object.keys(rankings.episodes).forEach(function(period){rankings.episodes[period].forEach(function(x){var g=growth.episodes[period+"_"+x.episode_id];if(g)Object.assign(x,g);});});
 Object.keys(rankings.hosts).forEach(function(period){rankings.hosts[period].forEach(function(x){var g=growth.hosts[period+"_"+x.host_key];if(g)Object.assign(x,g);});});

 dbStatus.textContent="Connected";dbStatus.className="ok";
 window.__crowPodcast=p;window.__crowEpisodes=eps||[];window.__crowStats=stats;window.__crowRankings=rankings;render(p,eps||[],stats,rankings);show();
 followBtn=document.getElementById("followBtn");
 followCount=document.getElementById("followCount");
 subscribeBtn=document.getElementById("subscribeBtn");
 shareBtn=document.getElementById("shareBtn");
 sharePanel=document.getElementById("sharePanel");
 followBtn.onclick=function(){toggleFollow()};
 subscribeBtn.onclick=function(){startSubscription()};
 shareBtn.onclick=function(){sharePodcast()};
 document.getElementById("shareClose").onclick=function(){sharePanel.classList.add("hidden")};
 document.getElementById("shareCopy").onclick=function(){copyPodcastLink()};
 document.getElementById("shareNative").onclick=function(){nativeSharePodcast()};
 document.getElementById("shareFacebook").onclick=function(){setShareLinks()};
 document.getElementById("shareX").onclick=function(){setShareLinks()};
 document.getElementById("shareReddit").onclick=function(){setShareLinks()};
 document.getElementById("shareEmail").onclick=function(){setShareLinks()};
 if(!subscriptionProduct){subscribeBtn.disabled=true;subscribeBtn.textContent="Subscribe unavailable";}
 updateFollowState();
 async function ensureAuth(){
 if(authClient)return authClient;
 if(!window.supabase||!window.supabase.createClient)return null;
 authClient=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
 return authClient;
}
async function getUser(){var sb=await ensureAuth();if(!sb)return null;var r=await sb.auth.getUser();return r.data&&r.data.user||null;}
async function updateFollowState(){
 try{
   var sb=await ensureAuth(); if(!sb||!currentPodcast)return;
   var user=await getUser();
   var count=await sb.from("podcast_follows").select("id",{count:"exact",head:true}).eq("podcast_id",currentPodcast.id);
   if(typeof count.count==="number")followCount.textContent=count.count.toLocaleString();
   if(!user){followBtn.textContent="♡ Follow "+(followCount.textContent==="0"?"":followCount.textContent);return;}
   var own=await sb.from("podcast_follows").select("id").eq("podcast_id",currentPodcast.id).eq("user_id",user.id).limit(1);
   if(own.data&&own.data.length){followBtn.classList.add("active");followBtn.innerHTML="♥ Following <span id=\"followCount\">"+followCount.textContent+"</span>";}
   else{followBtn.classList.remove("active");followBtn.innerHTML="♡ Follow <span id=\"followCount\">"+followCount.textContent+"</span>";}
 }catch(e){console.warn("Follow state unavailable",e);}
}
async function toggleFollow(){
 try{
   var sb=await ensureAuth();if(!sb){alert("Sign-in is required to follow this podcast.");return;}
   var user=await getUser();if(!user){location.href="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/account.html?redirect="+encodeURIComponent(location.href);return;}
   followBtn.disabled=true;
   var own=await sb.from("podcast_follows").select("id").eq("podcast_id",currentPodcast.id).eq("user_id",user.id).maybeSingle();
   if(own.data&&own.data.length){var del=await sb.from("podcast_follows").delete().eq("id",own.data[0].id);if(del.error)throw del.error;}
   else{var ins=await sb.from("podcast_follows").insert({podcast_id:currentPodcast.id,user_id:user.id});if(ins.error)throw ins.error;}
   await updateFollowState();
 }catch(e){alert(e.message||"Unable to update your follow.");}finally{followBtn.disabled=false;}
}
async function sharePodcast(){
 try{
   var shareData={title:(currentPodcast&&currentPodcast.title||"CrowRules Podcast"),text:"Listen to "+(currentPodcast&&currentPodcast.title||"this podcast")+" on CrowRules Podcasting.",url:location.href};
   if(navigator.share&&(!navigator.canShare||navigator.canShare(shareData))){await navigator.share(shareData);return;}
   if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(location.href);shareBtn.classList.add("copied");shareBtn.textContent="✓ Link Copied";setTimeout(function(){shareBtn.classList.remove("copied");shareBtn.textContent="↗ Share"},1800);return;}
   var input=document.createElement("input");input.value=location.href;document.body.appendChild(input);input.select();document.execCommand("copy");input.remove();shareBtn.classList.add("copied");shareBtn.textContent="✓ Link Copied";setTimeout(function(){shareBtn.classList.remove("copied");shareBtn.textContent="↗ Share"},1800);
 }catch(e){if(e&&e.name==="AbortError")return;alert("Unable to share this podcast link.");}
}
async function startSubscription(){
 try{
   if(!subscriptionProduct)return;
   var sb=await ensureAuth();if(!sb){alert("Sign-in is required to subscribe.");return;}
   var user=await getUser();if(!user){location.href="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/account.html?redirect="+encodeURIComponent(location.href);return;}
   subscribeBtn.disabled=true;subscribeBtn.textContent="Opening checkout…";
   var session=await sb.auth.getSession();var token=session.data&&session.data.session&&session.data.session.access_token;if(!token)throw new Error("Your session has expired. Please sign in again.");
   var res=await fetch(String(cfg.supabaseUrl).replace(/\/$/,"")+"/functions/v1/"+encodeURIComponent(cfg.podcastCheckoutFunction||cfg.membershipCheckoutFunction||"create-podcast-checkout"),{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,"apikey":cfg.supabaseKey},body:JSON.stringify({product_id:subscriptionProduct.id,podcast_id:currentPodcast.id,origin:location.origin+"/podcasting/"})});
   var data=await res.json().catch(function(){return {}});if(!res.ok)throw new Error(data.error||"Unable to start subscription checkout.");
   if(!data.url)throw new Error("Stripe did not return a checkout URL.");location.href=data.url;
 }catch(e){alert(e.message||"Unable to start subscription.");subscribeBtn.disabled=false;subscribeBtn.textContent="Subscribe";}
}
// Auth is strictly optional and starts only after rendering.
 setTimeout(function(){
   var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=function(){
     try{
       if(window.supabase&&window.supabase.createClient){
         authClient=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
         authClient.auth.getSession().then(function(){authStatus.textContent="Available";authStatus.className="ok";updateFollowState()}).catch(function(){authStatus.textContent="Optional / unavailable"});
       }
     }catch(e){authStatus.textContent="Optional / unavailable"}
   };s.onerror=function(){authStatus.textContent="Optional / unavailable"};document.head.appendChild(s);
 },0);
}
rankingTabs.forEach(function(tab){tab.onclick=function(){rankingTabs.forEach(function(t){t.classList.remove("active")});tab.classList.add("active");activePeriod=tab.getAttribute("data-period")||"today";if(window.__crowRankings)render(window.__crowPodcast,window.__crowEpisodes,window.__crowStats,window.__crowRankings);};});
document.getElementById("retry").onclick=function(){location.reload()};
window.addEventListener("error",function(e){if(!app.classList.contains("hidden"))return;fail(e.error||e.message)});
window.addEventListener("unhandledrejection",function(e){if(!app.classList.contains("hidden"))fail(e.reason)});
load().catch(fail);
setTimeout(function(){
 if(!app.classList.contains("hidden"))return;
 diagnostic.classList.remove("hidden");
 diagnostic.innerHTML="<strong>Loader watchdog:</strong> JavaScript is running, but the core request has not completed yet.<br><br><span class='muted'>The page is now isolated from the previous bootstrap, auth, realtime, Stripe, chat, and sitewide scripts.</span>";
},12000);
})();
