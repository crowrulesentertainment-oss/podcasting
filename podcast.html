<style>

.wrap{max-width:1240px}.page{padding:34px 0 90px}.hero{position:relative;overflow:hidden;min-height:520px;border:1px solid rgba(255,255,255,.1);border-radius:30px;background:#080811;display:grid;grid-template-columns:380px 1fr;gap:42px;padding:42px;align-items:end}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,11,.96) 0%,rgba(5,5,11,.72) 44%,rgba(5,5,11,.25) 100%);z-index:0}.hero>*{position:relative;z-index:1}.hero-art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.55)}.eyebrow{letter-spacing:.18em;font-size:.72rem;color:var(--cyan);font-weight:800}.title{font-size:clamp(2.7rem,6vw,6rem);line-height:.92;margin:12px 0}.desc{max-width:720px;color:var(--muted);line-height:1.7}.chips,.actions,.stats{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.chip,.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:7px 12px;font-size:.78rem}.live{color:#7df7c7}.section{margin-top:54px}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.section-head h2{margin:4px 0;font-size:2rem}.subtle{color:var(--muted);font-size:.82rem}.featured{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.card{background:rgba(13,13,23,.9);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:20px}.player{width:100%;margin-top:18px}.player audio{width:100%}.episode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.episode{overflow:hidden}.episode img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:15px}.episode h3{margin:10px 0 6px}.episode p{color:var(--muted);line-height:1.55;font-size:.9rem}.progress{height:5px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));width:0}.chat-layout{display:grid;grid-template-columns:230px 1fr;gap:16px}.rooms,.chat{background:rgba(10,10,18,.94);border:1px solid rgba(255,255,255,.09);border-radius:22px}.rooms{padding:12px}.room{width:100%;text-align:left;background:rgba(255,255,255,.04);border:1px solid transparent;color:#fff;border-radius:13px;padding:12px;margin-bottom:8px;cursor:pointer}.room.active{border-color:rgba(0,220,255,.55);background:rgba(0,220,255,.08)}.room small{display:block;color:var(--muted);margin-top:4px}.chat{min-height:600px;display:grid;grid-template-rows:auto 1fr auto}.chat-head{padding:16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between}.messages{padding:16px;overflow:auto;max-height:470px}.msg{padding:10px 12px;background:rgba(255,255,255,.045);border-radius:14px;margin-bottom:9px}.msg-top{font-size:.75rem;font-weight:800}.msg-time{color:rgba(255,255,255,.35);font-weight:400;margin-left:7px}.msg-body{margin-top:4px;line-height:1.5;word-break:break-word}.reactions{display:flex;gap:5px;margin-top:7px}.react{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#fff;border-radius:9px;padding:4px 7px;cursor:pointer}.pin{padding:10px 14px;background:rgba(139,92,246,.1);border-bottom:1px solid rgba(139,92,246,.2);font-size:.82rem}.compose{padding:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:8px}.compose input{flex:1;background:#07070d;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px}.typing{padding:0 16px 8px;color:var(--muted);font-size:.75rem}.manager-modal{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:2000;display:grid;place-items:center;padding:18px}.manager{width:min(820px,100%);max-height:92vh;overflow:auto;background:#0b0b14;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:24px}.manager-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{background:#07070d;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:11px}.field textarea{min-height:90px}.manager-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.analytics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric strong{display:block;font-size:1.8rem;margin-top:6px}.search{width:min(340px,100%);background:#08080f;border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:11px}.hidden{display:none!important}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding:25px}.hero-art{max-width:310px}.featured{grid-template-columns:1fr}.episode-grid{grid-template-columns:repeat(2,1fr)}.analytics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.episode-grid{grid-template-columns:1fr}.analytics{grid-template-columns:1fr 1fr}.chat-layout{grid-template-columns:1fr}.manager-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{min-height:0}}

<body>
<div data-nav></div>
<main class="wrap page">
<div id="loading" class="card" style="text-align:center;padding:90px">Loading podcast universe…</div>
<div id="app" class="hidden">
<section id="hero"></section>
<section class="section" id="featuredSection"></section>
<section class="section hidden" id="continueSection"></section>
<section class="section" id="episodesSection"></section>
<section class="section" id="chatSection"></section>
<section class="section hidden" id="creatorSection"></section>
</div>
</main>
<div id="managerModal" class="manager-modal hidden">
<div class="manager">
<div class="section-head"><div><div class="eyebrow">COMMUNITY OPERATIONS</div><h2>Room Manager</h2><div class="subtle">Manage rooms, status, ordering, descriptions and moderators.</div></div><button class="btn" id="closeManager">Done</button></div>
<div id="managerRooms"></div>
<div id="editor" class="hidden">
<hr style="border-color:rgba(255,255,255,.08)">
<div class="manager-grid">
<label class="field"><span>Name</span><input id="roomName"></label>
<label class="field"><span>Slug</span><input id="roomSlug"></label>
<label class="field full"><span>Description</span><textarea id="roomDescription"></textarea></label>
<label class="field"><span>Status</span><select id="roomLive"><option value="false">Offline</option><option value="true">Live</option></select></label>
<label class="field"><span>Moderator User ID</span><input id="modUser" placeholder="Auth UUID"></label>
</div>
<div class="manager-actions"><button class="btn primary" id="saveRoom">Save Room</button><button class="btn" id="addMod">Add Moderator</button><button class="btn" id="deleteRoom">Delete Room</button><button class="btn" id="closeEditor">Close</button></div>
<div id="mods" class="subtle" style="margin-top:14px"></div>
</div>
<div class="manager-actions"><button class="btn primary" id="newRoom">＋ New Room</button></div>
</div>
</div>
<script>
(()=>{"use strict";
const cfg=window.CROW_CONFIG||{},pid=new URLSearchParams(location.search).get("id");
const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let sb=null,user=null,podcast=null,podcastId=null,episodes=[],rooms=[],room=null,chat=null,presence=null,editing=null,progress={},creatorMemberId=null,realtime=[],reconnectTimer=null,connectionState="connecting";
const timeout=(p,ms=10000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error("Supabase request timed out.")),ms))]);
async function client(){
 if(sb)return sb;
 try{
  if(window.CROW_BOOTSTRAP)sb=await timeout(window.CROW_BOOTSTRAP(),10000);
 }catch(e){console.warn("Shared Supabase bootstrap failed:",e?.message||e)}
 if(!sb&&window.CROW_SUPABASE)sb=window.CROW_SUPABASE;
 if(!sb&&window.supabase?.createClient&&cfg.supabaseUrl&&cfg.supabaseKey){
  try{sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}})}catch(e){console.warn("Direct Supabase client failed:",e?.message||e)}
 }
 if(!sb)throw Error("Supabase client could not be initialized. Check js/config.js and the Supabase library.");
 return sb
}
function setConnectionState(s){connectionState=s;const el=$("#connectionStatus");if(el){el.textContent=s==="connected"?"● LIVE SYNC":s==="reconnecting"?"↻ RECONNECTING":"○ OFFLINE";el.className="chip "+(s==="connected"?"live":"")}}
function scheduleReconnect(){clearTimeout(reconnectTimer);reconnectTimer=setTimeout(()=>setupRealtime(),2500)}
async function setupRealtime(){const c=await client();if(!c||!podcastId)return;setConnectionState("reconnecting");realtime.forEach(x=>{try{x.unsubscribe()}catch{}});realtime=[];const base="podcast-page-"+podcastId;
 const p=c.channel(base+"-podcast").on("postgres_changes",{event:"UPDATE",schema:"public",table:"podcasts",filter:"id=eq."+podcastId},p=>{podcast={...podcast,...p.new};renderHeroOnly()}).subscribe(s=>{if(s==="SUBSCRIBED"){setConnectionState("connected")}else if(s==="CHANNEL_ERROR"||s==="TIMED_OUT"||s==="CLOSED"){setConnectionState("offline");scheduleReconnect()}});
 const e=c.channel(base+"-episodes").on("postgres_changes",{event:"*",schema:"public",table:"podcast_episodes",filter:"podcast_id=eq."+podcastId},async()=>{try{episodes=await rest("podcast_episodes",{select:"id,title,slug,description,episode_number,season_number,published_at,duration_seconds,audio_url,video_url,thumbnail_url,play_count,status,access_level",podcast_id:"eq."+podcastId,status:"eq.published",order:"published_at.desc"});renderFeatured();renderContinue();renderEpisodes()}catch{}}).subscribe(s=>{if(s==="CHANNEL_ERROR"||s==="TIMED_OUT"||s==="CLOSED")scheduleReconnect()});
 const f=c.channel(base+"-follows").on("postgres_changes",{event:"*",schema:"public",table:"podcast_follows",filter:"podcast_id=eq."+podcastId},()=>refreshCounts()).subscribe(s=>{if(s==="CHANNEL_ERROR"||s==="TIMED_OUT"||s==="CLOSED")scheduleReconnect()});
 const sub=c.channel(base+"-subscriptions").on("postgres_changes",{event:"*",schema:"public",table:"podcast_subscriptions",filter:"podcast_id=eq."+podcastId},()=>refreshCounts()).subscribe(s=>{if(s==="CHANNEL_ERROR"||s==="TIMED_OUT"||s==="CLOSED")scheduleReconnect()});
 const roomsChannel=c.channel(base+"-rooms").on("postgres_changes",{event:"*",schema:"public",table:"podcast_chat_rooms",filter:"podcast_id=eq."+podcastId},async()=>{try{rooms=await rest("podcast_chat_rooms",{select:"id,podcast_id,slug,name,description,is_live,sort_order,created_at",podcast_id:"eq."+podcastId,order:"sort_order.asc,created_at.asc"});renderRoomButtons();if(room&&!rooms.some(x=>x.id===room.id)){room=null;if(chat)await chat.unsubscribe();if(presence)await presence.unsubscribe();if(rooms[0])await selectRoom(rooms[0].id)}}catch(e){console.warn("Room realtime refresh:",e.message)}}).subscribe(s=>{if(s==="CHANNEL_ERROR"||s==="TIMED_OUT"||s==="CLOSED")scheduleReconnect()});
 realtime.push(p,e,f,sub,roomsChannel)}
async function refreshCounts(){const c=await client();if(!c||!$("#followers"))return;const [f,s]=await Promise.all([c.from("podcast_follows").select("id",{count:"exact",head:true}).eq("podcast_id",podcastId),c.from("podcast_subscriptions").select("id",{count:"exact",head:true}).eq("podcast_id",podcastId).in("status",["active","trialing"])]);$("#followers").textContent=Number(f.count||0).toLocaleString();$("#subs").textContent=Number(s.count||0).toLocaleString()}
function renderHeroOnly(){const a=podcast.artwork_url||"assets/podcast-placeholder.svg";const h=$("#hero");if(!h)return;h.querySelector(".eyebrow").textContent=podcast.category||"PODCAST";h.querySelector(".title").textContent=podcast.title;const d=h.querySelector(".desc");if(d)d.textContent=podcast.description||"A CrowRules Podcasting show.";document.title=podcast.title+" — CrowRules Podcasting"}
async function getUser(){const c=await client();if(!c)return null;const r=await c.auth.getUser();return r.data?.user||null}
async function rest(table,params={},method="GET",body=null){const c=await client();if(!c)throw Error("Supabase client unavailable");if(method!=="GET"){const r=await timeout(c.from(table).insert(body),10000);if(r.error)throw Error("Supabase "+table+": "+r.error.message);return r.data||null}let q=c.from(table).select(params.select||"*");for(const [k,v] of Object.entries(params)){if(k==="select"||k==="order"||k==="limit")continue;if(typeof v!=="string"){q=q.eq(k,v);continue}if(v.startsWith("eq.")){q=q.eq(k,v.slice(3));continue}if(v.startsWith("in.(")&&v.endsWith(")")){q=q.in(k,v.slice(4,-1).split(",").map(x=>x.trim()).filter(Boolean));continue}const m=/^([a-z_]+)\\.(.*)$/i.exec(v);if(m&&typeof q[m[1]]==="function"){q=q[m[1]](k,m[2]);continue}q=q.eq(k,v)}if(params.order){for(const part of String(params.order).split(",").map(x=>x.trim()).filter(Boolean)){const bits=part.split(".");q=q.order(bits[0],{ascending:(bits[1]||"asc").toLowerCase()!=="desc",nullsFirst:false})}}if(params.limit)q=q.limit(Number(params.limit));const r=await timeout(q,10000);if(r.error)throw Error("Supabase "+table+": "+r.error.message+(r.error.code?" ["+r.error.code+"]":""));return r.data||[]}
function goAccount(){location.href="account.html?returnTo="+encodeURIComponent(location.href)}
async function load(){if(!pid)throw Error("No podcast was specified.");const c=await client();if(!c)throw Error("Supabase client could not be initialized.");const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(pid);const podcastSelect="id,title,slug,category,description,artwork_url,author_name,language,explicit_content,is_live,listener_count,status,creator_id";let q=c.from("podcasts").select(podcastSelect).eq("status","published");q=uuid?q.eq("id",pid):q.eq("slug",pid);const pr=await timeout(q.maybeSingle(),10000);if(pr.error)throw Error("Podcast lookup failed: "+pr.error.message+(pr.error.code?" ["+pr.error.code+"]":""));podcast=pr.data;if(!podcast)throw Error("This podcast is unavailable.");podcastId=podcast.id;try{const cr=await c.from("creators").select("id,member_id,name,discipline,is_active").eq("id",podcast.creator_id).limit(1).maybeSingle();if(!cr.error)creatorMemberId=cr.data?.member_id||null}catch{}document.title=podcast.title+" — CrowRules Podcasting";const er=await timeout(c.from("podcast_episodes").select("id,title,slug,description,episode_number,season_number,published_at,duration_seconds,audio_url,video_url,thumbnail_url,play_count,status,access_level").eq("podcast_id",podcastId).eq("status","published").order("published_at",{ascending:false}),10000);if(er.error)throw Error("Episode lookup failed: "+er.error.message+(er.error.code?" ["+er.error.code+"]":""));episodes=er.data||[];user=await getUser();await loadProgress();await loadRooms();renderAll()}
async function loadProgress(){if(!user)return;const r=await rest("podcast_episode_progress",{select:"episode_id,position_seconds,duration_seconds,percent_complete,last_played_at,completed",user_id:"eq."+user.id,order:"last_played_at.desc",limit:"12"});(r||[]).forEach(x=>progress[x.episode_id]=x)}
async function loadRooms(){try{rooms=await rest("podcast_chat_rooms",{select:"id,podcast_id,slug,name,description,is_live,sort_order,created_at",podcast_id:"eq."+podcastId,order:"sort_order.asc,created_at.asc"});if(!rooms.length&&user&&podcast.creator_id===user.id){try{await rest("podcast_chat_rooms",{},"POST",{podcast_id:podcastId,slug:"general",name:"General",description:"General community chat",is_live:false,sort_order:0});rooms=await rest("podcast_chat_rooms",{select:"id,podcast_id,slug,name,description,is_live,sort_order,created_at",podcast_id:"eq."+podcastId,order:"sort_order.asc,created_at.asc"})}catch(e){console.warn("Chat room bootstrap skipped:",e.message)}}}catch(e){console.warn("Podcast chat is unavailable:",e.message);rooms=[]}}
let authSubscription=null;
async function bindAuthState(){const c=await client();if(!c?.auth)return;try{authSubscription?.unsubscribe?.()}catch{};authSubscription=c.auth.onAuthStateChange(async(_event,session)=>{user=session?.user||null;try{await loadProgress()}catch{};renderContinue();if(podcast)bindHero();renderChat()}).data?.subscription||null}
function renderAll(){const a=podcast.artwork_url||"assets/podcast-placeholder.svg";$("#hero").innerHTML='<section class="hero" style="background-image:url('+JSON.stringify(a)+');background-size:cover;background-position:center"><img class="hero-art" src="'+esc(a)+'" alt="'+esc(podcast.title)+' artwork"><div><div class="eyebrow">'+esc(podcast.category||"PODCAST")+'</div><h1 class="title">'+esc(podcast.title)+'</h1><div class="chips">'+(podcast.author_name?(creatorMemberId?'<a class="chip" style="text-decoration:none" href="member-profile.html?user='+encodeURIComponent(creatorMemberId)+'">By '+esc(podcast.author_name)+'</a>':'<span class="chip">By '+esc(podcast.author_name)+'</span>'):"")+(podcast.language?'<span class="chip">'+esc(podcast.language.toUpperCase())+'</span>':"")+(podcast.is_live?'<span class="chip live">● LIVE NOW</span>':"")+'</div><p class="desc">'+esc(podcast.description||"A CrowRules Podcasting show.")+'</p><div class="stats"><span id="connectionStatus" class="chip">○ CONNECTING</span><span class="stat">♥ <b id="followers">—</b> followers</span><span class="stat">◆ <b id="subs">—</b> subscribers</span><span class="stat">▶ <b>'+Number(podcast.listener_count||0).toLocaleString()+'</b> listeners</span></div><div class="actions"><button id="follow" class="btn">Follow</button><button id="subscribe" class="btn primary">Subscribe</button><button id="share" class="btn">Share</button><a class="btn" href="podcasts.html">All Podcasts</a></div></div></section>';renderFeatured();renderContinue();renderEpisodes();renderChat();setupRealtime();if(user&&podcast.creator_id===user.id)renderCreator();bindHero()}
async function bindHero(){const c=await client();const followerCount=await timeout(c.from("podcast_follows").select("id",{count:"exact",head:true}).eq("podcast_id",podcastId),10000);$("#followers").textContent=Number(followerCount.count||0).toLocaleString();let following=false;if(user){const mineFollow=await c.from("podcast_follows").select("id").eq("podcast_id",podcastId).eq("user_id",user.id).maybeSingle();following=!!mineFollow.data}$("#follow").textContent=following?"Following":"Follow";const subCount=await timeout(c.from("podcast_subscriptions").select("id",{count:"exact",head:true}).eq("podcast_id",podcastId).in("status",["active","trialing"]),10000);$("#subs").textContent=Number(subCount.count||0).toLocaleString();let mine=false;if(user){const mineSub=await c.from("podcast_subscriptions").select("id,status").eq("podcast_id",podcastId).eq("user_id",user.id).in("status",["active","trialing"]).maybeSingle();mine=!!mineSub.data}$("#subscribe").textContent=mine?"Subscribed":"Subscribe";$("#follow").onclick=async()=>{if(!user)return goAccount();const followingNow=$("#follow").textContent==="Following";const q=followingNow?await c.from("podcast_follows").delete().eq("podcast_id",podcastId).eq("user_id",user.id):await c.from("podcast_follows").insert({podcast_id:podcastId,user_id:user.id});if(q.error&&q.error.code!=="23505")return alert(q.error.message);bindHero()};$("#share").onclick=async()=>{try{if(navigator.share)await navigator.share({title:podcast.title,text:"Listen on CrowRules Podcasting",url:location.href});else{await navigator.clipboard.writeText(location.href);$("#share").textContent="Copied!"}}catch{}};$("#subscribe").onclick=async()=>{if(mine){location.href="account.html";return}if(!user)return goAccount();const p=await rest("cr_podcast_monetization_products",{select:"id",podcast_id:"eq."+podcastId,product_type:"eq.membership",active:"eq.true",limit:"1"});if(!p[0])return alert("This podcast does not have an active subscription product yet.");const r=await c.functions.invoke("create-podcast-checkout",{body:{product_id:p[0].id,origin:cfg.siteUrl,success_url:location.href,cancel_url:location.href}});if(r.error){let detail=r.error.message||"Unable to start subscription.";try{const ctx=r.error.context;if(ctx&&typeof ctx.clone==="function"){const j=await ctx.clone().json();if(j?.error)detail=j.error}}catch{}alert(detail);return}if(r.data?.url)location.href=r.data.url;else alert(r.data?.error||"Stripe Checkout did not return a checkout URL.");}}
function renderFeatured(){const e=episodes[0];$("#featuredSection").innerHTML='<div class="section-head"><div><div class="eyebrow">NOW PLAYING</div><h2>Featured Episode</h2><div class="subtle">The latest published episode from '+esc(podcast.title)+'</div></div></div>'+(e?'<div class="featured"><div class="card"><img src="'+esc(e.thumbnail_url||podcast.artwork_url||"assets/podcast-placeholder.svg")+'" style="width:100%;border-radius:16px;aspect-ratio:16/9;object-fit:cover"><div class="eyebrow" style="margin-top:15px">EPISODE '+esc(e.episode_number||"")+'</div><h2>'+esc(e.title)+'</h2><p class="desc">'+esc(e.description||"")+'</p><div class="player">'+(e.audio_url?'<audio controls preload="metadata" src="'+esc(e.audio_url)+'"></audio>':'<div class="subtle">Audio player will appear when the episode audio is published.</div>')+'</div></div><div class="card"><div class="eyebrow">SHOW NOTES</div><h3>About this episode</h3><p class="desc">'+esc(e.description||"No additional notes yet.")+'</p><div class="chips"><span class="chip">'+(e.duration_seconds?Math.round(e.duration_seconds/60)+" min":"Podcast")+'</span><span class="chip">'+Number(e.play_count||0).toLocaleString()+' plays</span></div><a class="btn primary" href="episode.html?id='+encodeURIComponent(e.id)+'">Open Episode</a></div></div>':'<div class="card">No published episodes yet.</div>')}
function renderContinue(){const list=episodes.filter(e=>progress[e.id]&&!progress[e.id].completed).slice(0,6);const sec=$("#continueSection");if(!user||!list.length){sec.classList.add("hidden");return}sec.classList.remove("hidden");sec.innerHTML='<div class="section-head"><div><div class="eyebrow">YOUR LIBRARY</div><h2>Continue Listening</h2></div></div><div class="episode-grid">'+list.map(e=>'<article class="card episode"><img src="'+esc(e.thumbnail_url||podcast.artwork_url||"assets/podcast-placeholder.svg")+'"><h3>'+esc(e.title)+'</h3><div class="progress"><i style="width:'+Math.min(100,Number(progress[e.id].percent_complete||0))+'%"></i></div><p>'+Math.round(Number(progress[e.id].percent_complete||0))+'% complete</p><a class="btn" href="episode.html?id='+encodeURIComponent(e.id)+'">Continue</a></article>').join("")+'</div>'}
function renderEpisodes(){const sec=$("#episodesSection");sec.innerHTML='<div class="section-head"><div><div class="eyebrow">THE LIBRARY</div><h2>Episodes</h2><div class="subtle">'+episodes.length+' published episodes</div></div><input id="episodeSearch" class="search" placeholder="Search episodes…"></div><div id="episodeGrid" class="episode-grid"></div>';const draw=()=>{const q=$("#episodeSearch").value.toLowerCase();const list=episodes.filter(e=>(e.title+" "+(e.description||"")).toLowerCase().includes(q));$("#episodeGrid").innerHTML=list.map(e=>'<article class="card episode"><img src="'+esc(e.thumbnail_url||podcast.artwork_url||"assets/podcast-placeholder.svg")+'" alt=""><div class="eyebrow" style="margin-top:12px">EP '+esc(e.episode_number||"")+'</div><h3>'+esc(e.title)+'</h3><p>'+esc(e.description||"")+'</p><div class="chips"><span class="chip">'+(e.duration_seconds?Math.round(e.duration_seconds/60)+" min":"")+'</span><span class="chip">'+Number(e.play_count||0).toLocaleString()+' plays</span></div><a class="btn primary" href="episode.html?id='+encodeURIComponent(e.id)+'">Listen Now</a></article>').join("")||'<div class="card">No matching episodes.</div>'};$("#episodeSearch").oninput=draw;draw()}
async function renderChat(){const sec=$("#chatSection");sec.innerHTML='<div class="section-head"><div><div class="eyebrow">COMMUNITY</div><h2>Live Chat</h2><div class="subtle">Multiple rooms, live audience, reactions and pinned messages.</div></div></div><div class="chat-layout"><aside class="rooms"><div id="rooms"></div>'+(user&&podcast.creator_id===user.id?'<button id="manage" class="btn" style="width:100%">⚙ Manage Rooms</button>':"")+'</aside><div class="chat"><div class="chat-head"><div><b id="roomTitle">Live Chat</b><div id="roomDesc" class="subtle"></div></div><div id="online" class="live">● 0 online</div></div><div id="pin" class="pin hidden"></div><div id="messages" class="messages"></div><div id="typing" class="typing"></div><div class="compose"><input id="chatInput" maxlength="1000" placeholder="Sign in to chat…"><button id="send" class="btn primary">Send</button></div></div></div>';renderRoomButtons();if(rooms[0])await selectRoom(rooms[0].id);else{$("#roomTitle").textContent="Chat unavailable";$("#roomDesc").textContent="The podcast can still be listened to normally.";$("#messages").innerHTML='<div class="subtle">Community chat is temporarily unavailable.</div>';$("#chatInput").disabled=true;$("#send").disabled=true}if($("#manage"))$("#manage").onclick=openManager}
function renderRoomButtons(){const box=$("#rooms");if(!rooms.length){box.innerHTML='<div class="subtle" style="padding:12px">Chat rooms are temporarily unavailable. The podcast itself is still available.</div>';return}box.innerHTML=rooms.map(r=>'<button class="room '+(room?.id===r.id?"active":"")+'" data-id="'+esc(r.id)+'"><b>'+esc(r.name)+'</b><small>'+(r.is_live?"🔴 Live":"Offline")+' · '+esc(r.description||"Community room")+'</small></button>').join("");box.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>selectRoom(b.dataset.id))}
async function selectRoom(rid){if(chat)await chat.unsubscribe();if(presence)await presence.unsubscribe();room=rooms.find(r=>r.id===rid)||rooms[0];if(!room)return;renderRoomButtons();$("#roomTitle").textContent=room.name;$("#roomDesc").textContent=room.description||"";$("#messages").innerHTML='<div class="subtle">Loading messages…</div>';try{const msgs=await rest("podcast_chat_messages",{select:"id,room_id,user_id,display_name,message,created_at,is_hidden",room_id:"eq."+room.id,is_hidden:"eq.false",order:"created_at.asc",limit:"100"});const pins=await rest("podcast_chat_pins",{select:"message_id",room_id:"eq."+room.id,order:"created_at.desc",limit:"1"});renderMessages(msgs,pins)}catch(e){$("#messages").innerHTML='<div class="subtle">'+esc(e.message)+'</div>'}const c=await client();if(!c)return;chat=c.channel("podcast-hub-chat-"+room.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"podcast_chat_messages",filter:"room_id=eq."+room.id},p=>{if(!p.new.is_hidden)append(p.new)}).subscribe();presence=c.channel("podcast-hub-presence-"+room.id,{config:{presence:{key:user?.id||crypto.randomUUID()}}}).on("presence",{event:"sync"},()=>{$("#online").textContent="● "+Object.keys(presence.presenceState()).length+" online"}).on("broadcast",{event:"typing"},p=>{if(p.payload?.user_id!==user?.id){$("#typing").textContent=(p.payload?.name||"Someone")+" is typing…";clearTimeout(window.__typing);window.__typing=setTimeout(()=>$("#typing").textContent="",1200)}}).subscribe(async st=>{if(st==="SUBSCRIBED")await presence.track({user_id:user?.id||null})});bindChat()}
async function renderMessages(msgs,pins){const pinId=pins?.[0]?.message_id;const pm=msgs.find(m=>m.id===pinId);$("#pin").classList.toggle("hidden",!pm);if(pm)$("#pin").textContent="📌 "+pm.display_name+": "+pm.message;$("#messages").innerHTML="";if(!msgs.length){$("#messages").innerHTML='<div class="subtle">No messages yet. Start the conversation.</div>';return}for(const m of msgs)append(m)}
function append(m){const box=$("#messages"),el=document.createElement("div");el.className="msg";el.dataset.id=m.id;el.innerHTML='<div class="msg-top">'+esc(m.display_name||"Member")+' <span class="msg-time">'+new Date(m.created_at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+'</span></div><div class="msg-body">'+esc(m.message)+'</div><div class="reactions">'+["❤️","😂","🔥","👏","💯","👀"].map(x=>'<button class="react" data-r="'+x+'">'+x+'</button>').join("")+'</div>';box.appendChild(el);el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>react(m.id,b.dataset.r));box.scrollTop=box.scrollHeight}
async function react(mid,reaction){if(!user)return goAccount();const c=await client();const r=await c.from("podcast_chat_reactions").upsert({message_id:mid,user_id:user.id,reaction},{onConflict:"message_id,user_id,reaction"});if(r.error)console.warn(r.error)}
function bindChat(){const input=$("#chatInput");$("#send").onclick=send;input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};input.oninput=()=>{if(presence&&user)presence.send({type:"broadcast",event:"typing",payload:{user_id:user.id,name:user.user_metadata?.full_name||"Member"}})}}
async function send(){const input=$("#chatInput"),text=input.value.trim();if(!text)return;if(!user)return goAccount();const c=await client();const name=user.user_metadata?.full_name||user.email?.split("@")[0]||"Member";const r=await c.from("podcast_chat_messages").insert({room_id:room.id,user_id:user.id,display_name:name,message:text,is_hidden:false});if(r.error)alert(r.error.message);else input.value=""}
async function renderCreator(){const sec=$("#creatorSection");sec.classList.remove("hidden");const c=await client();const followers=await c.from("podcast_follows").select("id",{count:"exact",head:true}).eq("podcast_id",podcastId);const subs=await c.from("podcast_subscriptions").select("id",{count:"exact",head:true}).eq("podcast_id",podcastId).in("status",["active","trialing"]);const totalPlays=episodes.reduce((n,e)=>n+Number(e.play_count||0),0);const totalDuration=episodes.reduce((n,e)=>n+Number(e.duration_seconds||0),0);sec.innerHTML='<div class="section-head"><div><div class="eyebrow">CREATOR VIEW</div><h2>Podcast Intelligence</h2><div class="subtle">Private operational snapshot for the podcast owner.</div></div><div class="actions"><a class="btn" href="creator-dashboard.html?podcast_id='+encodeURIComponent(podcastId)+'">Creator Studio</a><a class="btn primary" href="create-episode.html?podcast_id='+encodeURIComponent(podcastId)+'">Create Episode</a></div></div><div class="analytics"><div class="card metric"><span class="subtle">Episodes</span><strong>'+episodes.length+'</strong></div><div class="card metric"><span class="subtle">Total Plays</span><strong>'+totalPlays.toLocaleString()+'</strong></div><div class="card metric"><span class="subtle">Followers</span><strong>'+Number(followers.count||0).toLocaleString()+'</strong></div><div class="card metric"><span class="subtle">Subscribers</span><strong>'+Number(subs.count||0).toLocaleString()+'</strong></div></div><div class="card" style="margin-top:14px"><div class="eyebrow">CATALOG HEALTH</div><p class="desc">'+episodes.length+' published episode'+(episodes.length===1?"":"s")+' · '+Math.round(totalDuration/60)+' total minutes · '+totalPlays.toLocaleString()+' combined plays.</p></div>'}
function openManager(){$("#managerModal").classList.remove("hidden");renderManagerRooms()}
function renderManagerRooms(){$("#managerRooms").innerHTML=rooms.map((r,i)=>'<div class="card" style="margin:9px 0"><b>'+esc(r.name)+'</b> <span class="chip">'+(r.is_live?"LIVE":"OFFLINE")+'</span><p class="subtle">'+esc(r.description||"No description")+'</p><div class="manager-actions"><button class="btn" data-edit="'+r.id+'">Edit</button><button class="btn" data-up="'+r.id+'" '+(i===0?"disabled":"")+'>↑</button><button class="btn" data-down="'+r.id+'" '+(i===rooms.length-1?"disabled":"")+'>↓</button></div></div>').join("");$("#managerRooms").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editRoom(b.dataset.edit));$("#managerRooms").querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>moveRoom(b.dataset.up,-1));$("#managerRooms").querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>moveRoom(b.dataset.down,1))}
function editRoom(id){editing=rooms.find(r=>r.id===id);$("#editor").classList.remove("hidden");$("#roomName").value=editing.name||"";$("#roomSlug").value=editing.slug||"";$("#roomDescription").value=editing.description||"";$("#roomLive").value=String(!!editing.is_live);$("#modUser").value="";loadMods()}
async function loadMods(){const r=await client();const x=await r.from("podcast_chat_room_moderators").select("id,user_id").eq("room_id",editing.id);$("#mods").innerHTML=x.data?.length?x.data.map(m=>'<div class="card" style="margin:6px 0;display:flex;justify-content:space-between"><span>'+esc(m.user_id)+'</span><button class="btn" data-remove="'+m.id+'">Remove</button></div>').join(""):"No moderators assigned.";$("#mods").querySelectorAll("[data-remove]").forEach(b=>b.onclick=async()=>{const z=await r.from("podcast_chat_room_moderators").delete().eq("id",b.dataset.remove);if(z.error)alert(z.error.message);loadMods()})}
$("#closeManager").onclick=()=>$("#managerModal").classList.add("hidden");$("#closeEditor").onclick=()=>$("#editor").classList.add("hidden");
$("#saveRoom").onclick=async()=>{if(!editing)return;const c=await client(),slug=$("#roomSlug").value.trim().toLowerCase().replace(/[^a-z0-9-]+/g,"-").replace(/(^-|-$)/g,"");const r=await c.from("podcast_chat_rooms").update({name:$("#roomName").value.trim(),slug,description:$("#roomDescription").value.trim(),is_live:$("#roomLive").value==="true"}).eq("id",editing.id);if(r.error)alert(r.error.message);else{rooms=await rest("podcast_chat_rooms",{select:"id,podcast_id,slug,name,description,is_live,sort_order,created_at",podcast_id:"eq."+podcastId,order:"sort_order.asc,created_at.asc"});renderManagerRooms();renderRoomButtons()}};
$("#newRoom").onclick=async()=>{const name=prompt("New chat room name");if(!name?.trim())return;const slug=name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,60),sort=rooms.length?Math.max(...rooms.map(r=>Number(r.sort_order||0)))+1:0,c=await client(),r=await c.from("podcast_chat_rooms").insert({podcast_id:podcastId,name:name.trim().slice(0,80),slug,description:"",is_live:false,sort_order:sort});if(r.error)alert(r.error.message);else{rooms=await rest("podcast_chat_rooms",{select:"id,podcast_id,slug,name,description,is_live,sort_order,created_at",podcast_id:"eq."+podcastId,order:"sort_order.asc,created_at.asc"});renderManagerRooms();renderRoomButtons()}};
$("#deleteRoom").onclick=async()=>{if(!editing||rooms.length<=1)return alert("Keep at least one room.");if(!confirm("Delete "+editing.name+"?"))return;const c=await client(),r=await c.from("podcast_chat_rooms").delete().eq("id",editing.id);if(r.error)alert(r.error.message);else{editing=null;$("#editor").classList.add("hidden");rooms=await rest("podcast_chat_rooms",{select:"id,podcast_id,slug,name,description,is_live,sort_order,created_at",podcast_id:"eq."+podcastId,order:"sort_order.asc,created_at.asc"});renderManagerRooms();renderRoomButtons()}};
$("#addMod").onclick=async()=>{if(!editing)return;const uid=$("#modUser").value.trim();if(!uid)return alert("Enter the moderator auth UUID.");const c=await client(),r=await c.from("podcast_chat_room_moderators").insert({room_id:editing.id,user_id:uid});if(r.error&&r.error.code!=="23505")alert(r.error.message);$("#modUser").value="";loadMods()};
async function moveRoom(id,delta){const i=rooms.findIndex(r=>r.id===id),j=i+delta;if(i<0||j<0||j>=rooms.length)return;const c=await client(),a=rooms[i],b=rooms[j];const x=await c.from("podcast_chat_rooms").update({sort_order:b.sort_order}).eq("id",a.id);const y=await c.from("podcast_chat_rooms").update({sort_order:a.sort_order}).eq("id",b.id);if(x.error||y.error)return alert((x.error||y.error).message);rooms=await rest("podcast_chat_rooms",{select:"id,podcast_id,slug,name,description,is_live,sort_order,created_at",podcast_id:"eq."+podcastId,order:"sort_order.asc,created_at.asc"});renderManagerRooms();renderRoomButtons()}
(async()=>{try{await load();$("#loading").classList.add("hidden");$("#app").classList.remove("hidden")}catch(e){$("#loading").innerHTML='<div class="eyebrow">PODCAST SYSTEM</div><h2>Podcast could not load</h2><p class="subtle">'+esc(e.message)+'</p><button class="btn primary" onclick="location.reload()">Retry</button>'}})();
})();
</script>
