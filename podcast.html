<html lang="en">

<script src="js/app.js?v=20261003-13" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=1" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
<style>
:root{--bg:#05050b;--panel:#0b0d16;--panel2:#101321;--line:#ffffff16;--text:#f5f7fb;--muted:#9aa5b8;--cyan:#00dcff;--purple:#8b5cf6;--green:#7df7c7;--yellow:#fbbf24;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#00dcff12,transparent 28%),radial-gradient(circle at 90% 10%,#8b5cf615,transparent 30%),var(--bg);color:var(--text)}button,input{font:inherit}.page{padding:34px 0 90px}.wrap{width:min(1240px,calc(100% - 32px));margin:auto}.hidden{display:none!important}.card{background:#0d1019e8;border:1px solid var(--line);border-radius:20px;padding:20px}.eyebrow{font-size:.7rem;font-weight:900;letter-spacing:.18em;color:var(--cyan)}.subtle{color:var(--muted);line-height:1.6}.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:330px 1fr;gap:38px;align-items:end;min-height:500px;padding:38px;border:1px solid var(--line);border-radius:30px;background:#080910}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#05050bf7 0%,#05050bb8 48%,#05050b35 100%);z-index:0}.hero>*{position:relative;z-index:1}.hero-art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:22px;box-shadow:0 25px 70px #0009}.title{font-size:clamp(2.7rem,6vw,5.8rem);line-height:.92;margin:10px 0 16px}.chips,.actions,.stats{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.chip,.stat{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#ffffff08;border-radius:999px;padding:7px 11px;font-size:.76rem}.actions{margin-top:20px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #ffffff1b;background:#ffffff08;color:#fff;border-radius:11px;padding:10px 15px;text-decoration:none;cursor:pointer}.btn:hover{background:#ffffff12}.btn.primary{background:linear-gradient(135deg,#00bfe0,#7c4cf3);border:0}.btn:disabled{opacity:.55;cursor:not-allowed}.subscription-state{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line)}.subscription-state.active{color:var(--green);background:#7df7c70d;border-color:#7df7c74d}.subscription-state.processing{color:#7dd3fc;background:#7dd3fc0d;border-color:#7dd3fc44}.subscription-state.past_due{color:var(--yellow);background:#fbbf2410;border-color:#fbbf2444}.subscription-state.cancelled{color:var(--red);background:#fb718510;border-color:#fb718544}.subscription-state.none{color:#aeb7c8;background:#ffffff07}.busy{opacity:.8;pointer-events:none}.section{margin-top:52px}.section-head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:17px}.section-head h2{margin:4px 0;font-size:2rem}.featured{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.featured img,.episode img{width:100%;object-fit:cover;border-radius:15px}.featured img{aspect-ratio:16/9}.episode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.episode{overflow:hidden}.episode img{aspect-ratio:16/9}.episode h3{margin:10px 0 6px}.episode p{color:var(--muted);line-height:1.55;font-size:.9rem}.player{margin-top:18px}.player audio{width:100%}.progress{height:5px;background:#ffffff0d;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple))}.search{width:min(340px,100%);background:#070912;border:1px solid var(--line);color:#fff;border-radius:11px;padding:10px}.status-box{margin-top:14px}.chat-layout{display:grid;grid-template-columns:220px 1fr;gap:15px}.rooms,.chat{background:#0a0d15e8;border:1px solid var(--line);border-radius:20px}.rooms{padding:11px}.room{width:100%;text-align:left;color:#fff;background:#ffffff06;border:1px solid transparent;border-radius:11px;padding:11px;margin-bottom:7px;cursor:pointer}.room.active{border-color:#00dcff66;background:#00dcff0d}.room small{display:block;color:var(--muted);margin-top:4px}.chat{min-height:560px;display:grid;grid-template-rows:auto 1fr auto}.chat-head{padding:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.messages{padding:15px;overflow:auto;max-height:440px}.msg{background:#ffffff06;border-radius:13px;padding:10px 12px;margin-bottom:8px}.msg-top{font-size:.75rem;font-weight:800}.msg-time{color:#ffffff4d;font-weight:400;margin-left:6px}.msg-body{margin-top:4px;line-height:1.5;word-break:break-word}.compose{padding:13px;border-top:1px solid var(--line);display:flex;gap:8px}.compose input{flex:1;background:#060810;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px}.loading{padding:90px 20px;text-align:center}.error{border-color:#fb718555}.ok{color:var(--green)}@media(max-width:900px){.hero{grid-template-columns:1fr;padding:25px}.hero-art{max-width:320px}.featured{grid-template-columns:1fr}.episode-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.wrap{width:min(100% - 20px,1240px)}.episode-grid{grid-template-columns:1fr}.chat-layout{grid-template-columns:1fr}.hero{min-height:0}.section-head{align-items:start;flex-direction:column}.search{width:100%}}
</style>
</head>
<body>
<div data-nav></div>
<main class="wrap page">
<section id="loading" class="card loading">
  <div class="eyebrow">PODCAST SYSTEM</div>
  <h2>Loading podcast universe…</h2>
  <p class="subtle">Connecting to CrowRules Podcasting.</p>
</section>
<div id="app" class="hidden">
  <section id="hero"></section>
  <section id="featured" class="section"></section>
  <section id="continue" class="section hidden"></section>
  <section id="episodes" class="section"></section>
  <section id="chatSection" class="section"></section>
</div>
</main>
<script>
(()=>{"use strict";
const cfg=window.CROW_CONFIG||{};
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const withTimeout=(promise,ms=10000)=>Promise.race([promise,new Promise((_,rej)=>setTimeout(()=>rej(new Error("Supabase request timed out.")),ms))]);
let sb=null,user=null,podcast=null,podcastId=null,episodes=[],progress={},rooms=[],room=null,chatChannel=null,realtimeChannel=null,authSub=null;

async function client(){
 if(sb)return sb;
 if(window.CROW_SUPABASE){sb=window.CROW_SUPABASE;return sb}
 if(typeof window.CROW_BOOTSTRAP==="function"){
   try{sb=await withTimeout(window.CROW_BOOTSTRAP(),12000);if(sb)return sb}catch(e){console.warn("CrowRules bootstrap:",e?.message||e)}
 }
 if(window.supabase?.createClient&&cfg.supabaseUrl&&cfg.supabaseKey){
   sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
   window.CROW_SUPABASE=sb;return sb
 }
 throw new Error("Supabase client could not be initialized.");
}
async function currentUser(){
 const c=await client();
 try{const r=await withTimeout(c.auth.getUser(),8000);return r.data?.user||null}catch{return null}
}
function showFatal(message){
 const l=$("#loading");l.classList.remove("hidden");l.innerHTML='<div class="eyebrow">PODCAST SYSTEM</div><h2>Podcast could not load</h2><p class="subtle">'+esc(message)+'</p><div class="actions" style="justify-content:center"><button class="btn primary" id="retry">Retry</button><a class="btn" href="podcasts.html">All Podcasts</a></div>';$("#retry").onclick=()=>location.reload()
}
function setHeroState(status){
 const el=$("#subscriptionStatus");if(!el)return;
 const map={active:["Active","active"],trialing:["Active","active"],processing:["Processing","processing"],past_due:["Past Due","past_due"],paused:["Paused","past_due"],canceled:["Cancelled","cancelled"],cancelled:["Cancelled","cancelled"]};
 const x=map[status]||["Not Subscribed","none"];el.className="subscription-state "+x[1];el.textContent=x[0]
}
async function getSubscription(){
 if(!user||!podcastId)return null;
 const c=await client();
 const r=await withTimeout(c.from("podcast_subscriptions").select("id,status,stripe_subscription_id,current_period_start,current_period_end,cancel_at_period_end,updated_at").eq("podcast_id",podcastId).eq("user_id",user.id).order("updated_at",{ascending:false}).limit(1).maybeSingle(),10000);
 if(r.error)throw r.error;return r.data||null
}
async function refreshSubscription(){
 const b=$("#subscribe");if(!b)return;
 if(!user){b.disabled=false;b.textContent="Subscribe";b.dataset.subscribed="0";setHeroState("none");return null}
 try{
   const s=await getSubscription();const active=!!s&&["active","trialing"].includes(s.status);
   setHeroState(s?.status||"none");b.dataset.subscribed=active?"1":"0";
   if(b.dataset.busy!=="1"){b.disabled=false;b.classList.remove("busy");b.textContent=active?"Subscribed ✓":"Subscribe"}
   return s
 }catch(e){console.warn("Subscription sync:",e?.message||e);return null}
}
async function refreshCounts(){
 const c=await client();if(!podcastId)return;
 const [f,s]=await Promise.all([
  c.from("podcast_follows").select("id",{count:"exact",head:true}).eq("podcast_id",podcastId),
  c.from("podcast_subscriptions").select("id",{count:"exact",head:true}).eq("podcast_id",podcastId).in("status",["active","trialing"])
 ]);
 if($("#followers"))$("#followers").textContent=Number(f.count||0).toLocaleString();
 if($("#subs"))$("#subs").textContent=Number(s.count||0).toLocaleString()
}
async function follow(){
 if(!user){location.href="account.html?auth=signin&returnTo="+encodeURIComponent(location.href);return}
 const c=await client(),b=$("#follow"),following=b.dataset.following==="1";
 const r=following?await c.from("podcast_follows").delete().eq("podcast_id",podcastId).eq("user_id",user.id):await c.from("podcast_follows").insert({podcast_id:podcastId,user_id:user.id});
 if(r.error&&r.error.code!=="23505")throw r.error;
 b.dataset.following=following?"0":"1";b.textContent=following?"Follow":"Following";refreshCounts()
}
async function readiness(product){
 const c=await client();
 const r=await c.functions.invoke("create-podcast-checkout",{body:{action:"readiness",product_id:product.id}});
 let d=r.data||{};
 if(r.error?.context){try{d=await r.error.context.clone().json()}catch{}}
 if(r.error||d.ready!==true)return {ready:false,data:d,error:r.error};
 return {ready:true,data:d}
}
async function activeProduct(){
 const c=await client();
 const r=await withTimeout(c.from("cr_podcast_monetization_products").select("id,name,amount_cents,interval,active").eq("podcast_id",podcastId).eq("product_type","membership").eq("active",true).order("created_at",{ascending:false}).limit(1),10000);
 if(r.error)throw r.error;return r.data?.[0]||null
}
async function startCheckout(){
 const b=$("#subscribe"),box=$("#subscriptionStatusBox");
 if(b.dataset.busy==="1")return;
 if(!user){location.href="account.html?auth=signin&returnTo="+encodeURIComponent(location.href);return}
 if(b.dataset.subscribed==="1"){location.href="subscriptions.html?podcast_id="+encodeURIComponent(podcastId);return}
 b.dataset.busy="1";b.disabled=true;b.classList.add("busy");b.textContent="Processing…";setHeroState("processing");
 try{
   const product=await activeProduct();
   if(!product)throw new Error("This podcast does not have an active subscription product yet.");
   const rd=await readiness(product);
   if(!rd.ready){const blockers=Array.isArray(rd.data?.blockers)?rd.data.blockers:[];throw new Error(blockers[0]||rd.data?.error||"Stripe checkout is not ready yet.")}
   if(box){box.classList.remove("hidden");box.innerHTML='<div class="eyebrow">SUBSCRIPTIONS</div><b class="ok">✓ Checkout ready</b><div class="subtle">Opening secure Stripe Checkout…</div>'}
   const key="cr_pending_subscription:"+user.id+":"+podcastId;
   localStorage.setItem(key,JSON.stringify({started_at:Date.now(),podcast_id:podcastId,product_id:product.id}));
   const success=new URL(location.href);success.searchParams.set("checkout","success");success.searchParams.set("session_id","{CHECKOUT_SESSION_ID}");
   const cancel=new URL(location.href);cancel.searchParams.set("checkout","cancelled");
   const c=await client();
   const r=await c.functions.invoke("create-podcast-checkout",{body:{product_id:product.id,origin:cfg.siteUrl,success_url:success.toString(),cancel_url:cancel.toString()}});
   if(r.error){let msg=r.error.message||"Unable to start subscription.";try{const j=await r.error.context?.clone().json();msg=j?.error||j?.details?.blockers?.[0]||msg}catch{}throw new Error(msg)}
   if(!r.data?.url)throw new Error(r.data?.error||"Stripe Checkout did not return a URL.");
   location.assign(r.data.url)
 }catch(e){
   b.dataset.busy="0";b.disabled=false;b.classList.remove("busy");b.textContent="Subscribe";setHeroState("none");
   if(box){box.classList.remove("hidden");box.innerHTML='<div class="eyebrow">SUBSCRIPTIONS</div><b>Checkout could not start</b><div class="subtle">'+esc(e?.message||"Please try again.")+'</div>'}
 }
}
async function verifyReturn(sessionId){
 const box=$("#subscriptionStatusBox");if(!user||!podcastId)return;
 for(let i=0;i<8;i++){
   const s=await refreshSubscription();
   if(s&&["active","trialing"].includes(s.status)){
     localStorage.removeItem("cr_pending_subscription:"+user.id+":"+podcastId);
     if(box)box.innerHTML='<div class="eyebrow">SUBSCRIPTION ACTIVE</div><b class="ok">✓ Your subscription is active.</b><div class="subtle">Your CrowRules subscription is connected to this account.</div>';
     cleanCheckoutUrl();return
   }
   await sleep(2000)
 }
 if(box)box.innerHTML='<div class="eyebrow">SUBSCRIPTION PROCESSING</div><b>✓ Stripe checkout completed</b><div class="subtle">Stripe has completed checkout and CrowRules is waiting for the subscription webhook. Your status will update automatically.</div><a class="btn" style="margin-top:10px" href="subscriptions.html?podcast_id='+encodeURIComponent(podcastId)+'">Check My Subscriptions</a>'
}
function cleanCheckoutUrl(){const u=new URL(location.href);u.searchParams.delete("checkout");u.searchParams.delete("session_id");history.replaceState({},document.title,u.pathname+(u.search?"?"+u.searchParams.toString():"")+u.hash)}
async function handleCheckoutReturn(){
 const q=new URLSearchParams(location.search),state=q.get("checkout");if(!state)return;
 const box=$("#subscriptionStatusBox");if(box)box.classList.remove("hidden");
 if(state==="cancelled"||state==="canceled"){if(user)localStorage.removeItem("cr_pending_subscription:"+user.id+":"+podcastId);await refreshSubscription();if(box)box.innerHTML='<div class="eyebrow">SUBSCRIPTION</div><b>Checkout cancelled</b><div class="subtle">No new subscription was created.</div>';cleanCheckoutUrl();return}
 if(state==="success"){setHeroState("processing");await verifyReturn(q.get("session_id"));return}
}
async function resumePending(){
 if(!user||!podcastId)return;
 const key="cr_pending_subscription:"+user.id+":"+podcastId;let p=null;try{p=JSON.parse(localStorage.getItem(key)||"null")}catch{}
 if(!p||Date.now()-Number(p.started_at||0)>30*60*1000)return;
 const b=$("#subscribe");if(!b)return;b.dataset.busy="1";b.disabled=true;b.classList.add("busy");b.textContent="Processing…";setHeroState("processing");
 for(let i=0;i<30;i++){const s=await refreshSubscription();if(s&&["active","trialing"].includes(s.status)){localStorage.removeItem(key);return}await sleep(2000)}
 b.dataset.busy="0";b.disabled=false;b.classList.remove("busy");await refreshSubscription()
}
function renderHero(){
 const art=podcast.artwork_url||"assets/podcast-placeholder.svg";
 $("#hero").innerHTML='<section class="hero"><img class="hero-art" src="'+esc(art)+'" alt="'+esc(podcast.title)+' artwork"><div><div class="eyebrow">'+esc(podcast.category||"PODCAST")+'</div><h1 class="title">'+esc(podcast.title)+'</h1><p class="subtle" style="max-width:720px">'+esc(podcast.description||"A CrowRules Podcasting show.")+'</p><div class="stats"><span class="stat">👥 <b id="followers">0</b> followers</span><span class="stat">★ <b id="subs">0</b> subscribers</span><span class="stat">● '+(podcast.is_live?"LIVE":"PUBLISHED")+'</span></div><div class="actions"><button class="btn" id="follow">Follow</button><button class="btn primary" id="subscribe">Subscribe</button><span id="subscriptionStatus" class="subscription-state none">Not Subscribed</span><button class="btn" id="share">Share</button><a class="btn" href="podcasts.html">All Podcasts</a></div><div id="subscriptionStatusBox" class="card status-box hidden"></div></div></section>';
 $("#follow").onclick=()=>follow().catch(e=>alert(e.message));$("#subscribe").onclick=()=>startCheckout();$("#share").onclick=async()=>{try{if(navigator.share)await navigator.share({title:podcast.title,text:"Listen on CrowRules Podcasting",url:location.href});else{await navigator.clipboard.writeText(location.href);$("#share").textContent="Copied!"}}catch{}}
}
function renderFeatured(){
 const e=episodes[0];$("#featured").innerHTML='<div class="section-head"><div><div class="eyebrow">NOW PLAYING</div><h2>Featured Episode</h2><div class="subtle">The latest published episode.</div></div></div>'+(!e?'<div class="card">No published episodes yet.</div>':'<div class="featured"><div class="card"><img src="'+esc(e.thumbnail_url||podcast.artwork_url||"assets/podcast-placeholder.svg")+'" alt=""><h2>'+esc(e.title)+'</h2><p class="subtle">'+esc(e.description||"")+'</p><div class="player">'+(e.audio_url?'<audio controls preload="metadata" src="'+esc(e.audio_url)+'"></audio>':'<span class="subtle">Audio will appear when published.</span>')+'</div></div><div class="card"><div class="eyebrow">EPISODE INFO</div><h3>About this episode</h3><p class="subtle">'+esc(e.description||"No additional notes yet.")+'</p><div class="chips"><span class="chip">'+(e.duration_seconds?Math.round(e.duration_seconds/60)+" min":"Podcast")+'</span><span class="chip">'+Number(e.play_count||0).toLocaleString()+" plays"+'</span></div><a class="btn primary" href="episode.html?id='+encodeURIComponent(e.id)+'">Open Episode</a></div></div>')
}
function renderContinue(){
 const list=episodes.filter(e=>progress[e.id]&&!progress[e.id].completed).slice(0,6),sec=$("#continue");if(!user||!list.length){sec.classList.add("hidden");return}sec.classList.remove("hidden");sec.innerHTML='<div class="section-head"><div><div class="eyebrow">YOUR LIBRARY</div><h2>Continue Listening</h2></div></div><div class="episode-grid">'+list.map(e=>'<article class="card episode"><img src="'+esc(e.thumbnail_url||podcast.artwork_url||"assets/podcast-placeholder.svg")+'" alt=""><h3>'+esc(e.title)+'</h3><div class="progress"><i style="width:'+Math.min(100,Number(progress[e.id].percent_complete||0))+'%"></i></div><p>'+Math.round(Number(progress[e.id].percent_complete||0))+'% complete</p><a class="btn" href="episode.html?id='+encodeURIComponent(e.id)+'">Continue</a></article>').join("")+'</div>'
}
function renderEpisodes(){
 $("#episodes").innerHTML='<div class="section-head"><div><div class="eyebrow">THE LIBRARY</div><h2>Episodes</h2><div class="subtle">'+episodes.length+' published episodes</div></div><input id="episodeSearch" class="search" placeholder="Search episodes…"></div><div id="episodeGrid" class="episode-grid"></div>';
 const draw=()=>{const q=($("#episodeSearch").value||"").toLowerCase();const list=episodes.filter(e=>(e.title+" "+(e.description||"")).toLowerCase().includes(q));$("#episodeGrid").innerHTML=list.map(e=>'<article class="card episode"><img src="'+esc(e.thumbnail_url||podcast.artwork_url||"assets/podcast-placeholder.svg")+'" alt=""><div class="eyebrow" style="margin-top:11px">EP '+esc(e.episode_number||"")+'</div><h3>'+esc(e.title)+'</h3><p>'+esc(e.description||"")+'</p><div class="chips"><span class="chip">'+(e.duration_seconds?Math.round(e.duration_seconds/60)+" min":"")+'</span><span class="chip">'+Number(e.play_count||0).toLocaleString()+" plays"+'</span></div><a class="btn primary" href="episode.html?id='+encodeURIComponent(e.id)+'">Listen Now</a></article>').join("")||'<div class="card">No matching episodes.</div>'};$("#episodeSearch").oninput=draw;draw()
}
async function loadProgress(){
 progress={};if(!user)return;
 const c=await client();const r=await c.from("podcast_episode_progress").select("episode_id,position_seconds,duration_seconds,percent_complete,last_played_at,completed").eq("user_id",user.id).order("last_played_at",{ascending:false}).limit(20);if(!r.error)(r.data||[]).forEach(x=>progress[x.episode_id]=x)
}
async function loadChat(){
 const sec=$("#chatSection");sec.innerHTML='<div class="section-head"><div><div class="eyebrow">COMMUNITY</div><h2>Live Chat</h2><div class="subtle">Chat is optional and will never block the podcast from loading.</div></div></div><div class="chat-layout"><aside class="rooms"><div id="roomList"><div class="subtle">Loading rooms…</div></div></aside><div class="chat"><div class="chat-head"><b id="roomTitle">Live Chat</b><span id="online" class="ok">● Live</span></div><div id="messages" class="messages"><div class="subtle">Select a room.</div></div><div class="compose"><input id="chatInput" maxlength="1000" placeholder="'+(user?"Write a message…":"Sign in to chat…")+'"><button class="btn primary" id="send">Send</button></div></div></div>';
 try{
  const c=await client();const r=await c.from("podcast_chat_rooms").select("id,slug,name,description,is_live,sort_order").eq("podcast_id",podcastId).order("sort_order",{ascending:true});if(r.error)throw r.error;rooms=r.data||[];renderRooms();
  $("#send").onclick=sendChat;$("#chatInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();sendChat()}}
 }catch(e){$("#roomList").innerHTML='<div class="subtle">Community chat is temporarily unavailable.</div>';$("#messages").innerHTML='<div class="subtle">'+esc(e.message)+'</div>'}
}
function renderRooms(){const box=$("#roomList");if(!rooms.length){box.innerHTML='<div class="subtle" style="padding:10px">No chat rooms are available yet.</div>';return}box.innerHTML=rooms.map(r=>'<button class="room '+(room?.id===r.id?"active":"")+'" data-room="'+esc(r.id)+'"><b>'+esc(r.name)+'</b><small>'+(r.is_live?"🔴 Live":"Offline")+' · '+esc(r.description||"Community room")+'</small></button>').join("");box.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>selectRoom(b.dataset.room))}
async function selectRoom(id){
 if(chatChannel){try{await chatChannel.unsubscribe()}catch{}chatChannel=null}room=rooms.find(r=>r.id===id)||rooms[0];if(!room)return;renderRooms();$("#roomTitle").textContent=room.name;$("#messages").innerHTML='<div class="subtle">Loading messages…</div>';
 try{
  const c=await client(),r=await c.from("podcast_chat_messages").select("id,user_id,display_name,message,created_at,is_hidden").eq("room_id",room.id).eq("is_hidden",false).order("created_at",{ascending:true}).limit(100);if(r.error)throw r.error;renderMessages(r.data||[]);
  chatChannel=c.channel("podcast-chat-"+room.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"podcast_chat_messages",filter:"room_id=eq."+room.id},p=>{if(!p.new?.is_hidden)appendMessage(p.new)}).subscribe()
 }catch(e){$("#messages").innerHTML='<div class="subtle">'+esc(e.message)+'</div>'}
}
function renderMessages(list){$("#messages").innerHTML="";if(!list.length){$("#messages").innerHTML='<div class="subtle">No messages yet. Start the conversation.</div>';return}list.forEach(appendMessage)}
function appendMessage(m){const box=$("#messages"),el=document.createElement("div");el.className="msg";el.innerHTML='<div class="msg-top">'+esc(m.display_name||"Member")+' <span class="msg-time">'+new Date(m.created_at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+'</span></div><div class="msg-body">'+esc(m.message)+'</div>';box.appendChild(el);box.scrollTop=box.scrollHeight}
async function sendChat(){const input=$("#chatInput"),text=input.value.trim();if(!text)return;if(!user){location.href="account.html?auth=signin&returnTo="+encodeURIComponent(location.href);return}if(!room)return;const c=await client(),name=user.user_metadata?.full_name||user.email?.split("@")[0]||"Member";const r=await c.from("podcast_chat_messages").insert({room_id:room.id,user_id:user.id,display_name:name,message:text,is_hidden:false});if(r.error)alert(r.error.message);else input.value=""}
async function setupRealtime(){
 const c=await client();if(!podcastId)return;
 if(realtimeChannel){try{await realtimeChannel.unsubscribe()}catch{}}
 realtimeChannel=c.channel("podcast-page-live-"+podcastId)
 .on("postgres_changes",{event:"UPDATE",schema:"public",table:"podcasts",filter:"id=eq."+podcastId},p=>{podcast={...podcast,...p.new};renderHero()})
 .on("postgres_changes",{event:"*",schema:"public",table:"podcast_episodes",filter:"podcast_id=eq."+podcastId},async()=>{const r=await c.from("podcast_episodes").select("id,title,slug,description,episode_number,season_number,published_at,duration_seconds,audio_url,video_url,thumbnail_url,play_count,status,access_level").eq("podcast_id",podcastId).eq("status","published").order("published_at",{ascending:false});if(!r.error){episodes=r.data||[];renderFeatured();renderContinue();renderEpisodes()}})
 .on("postgres_changes",{event:"*",schema:"public",table:"podcast_follows",filter:"podcast_id=eq."+podcastId},()=>refreshCounts())
 .on("postgres_changes",{event:"*",schema:"public",table:"podcast_subscriptions",filter:"podcast_id=eq."+podcastId},()=>{refreshCounts();refreshSubscription()})
 .subscribe()
}
async function load(){
 const pid=new URLSearchParams(location.search).get("id");if(!pid)throw new Error("No podcast was specified.");
 const c=await client();
 const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(pid);
 let q=c.from("podcasts").select("id,title,slug,category,description,artwork_url,author_name,language,explicit_content,is_live,listener_count,status,creator_id").eq("status","published");q=uuid?q.eq("id",pid):q.eq("slug",pid);
 const pr=await withTimeout(q.maybeSingle(),10000);if(pr.error)throw new Error("Podcast lookup failed: "+pr.error.message);if(!pr.data)throw new Error("This podcast is unavailable.");podcast=pr.data;podcastId=podcast.id;document.title=podcast.title+" — CrowRules Podcasting";
 const er=await withTimeout(c.from("podcast_episodes").select("id,title,slug,description,episode_number,season_number,published_at,duration_seconds,audio_url,video_url,thumbnail_url,play_count,status,access_level").eq("podcast_id",podcastId).eq("status","published").order("published_at",{ascending:false}),10000);if(er.error)throw new Error("Episode lookup failed: "+er.error.message);episodes=er.data||[];
 user=await currentUser();renderHero();await loadProgress();renderFeatured();renderContinue();renderEpisodes();await refreshCounts();await refreshSubscription();await loadChat();setupRealtime();await handleCheckoutReturn();resumePending();
 if(authSub)authSub.unsubscribe();authSub=c.auth.onAuthStateChange(async(_event,session)=>{user=session?.user||null;await loadProgress();renderContinue();await refreshSubscription();await refreshCounts()}).data?.subscription||null
 $("#loading").classList.add("hidden");$("#app").classList.remove("hidden")
}
load().catch(e=>{console.error("Podcast page:",e);showFatal(e?.message||"Unknown error.")});
})();
</script>
