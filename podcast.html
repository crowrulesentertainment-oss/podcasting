<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03040a"><title>Podcast | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/global-navigation.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/global-navigation.js" defer></script><script src="js/app.js" defer></script><script src="js/player.js" defer></script></head><body><main class="page shell"><div class="eyebrow">Podcast</div><h1 class="title" id="t">LOADING…</h1><p class="lede" id="d"></p><div class="actions"><button class="btn primary" id="follow">FOLLOW</button><button class="btn" id="support">SUPPORT CREATOR</button></div><section class="section"><h2>EPISODES</h2><div id="eps" class="grid"></div></section><script>addEventListener("DOMContentLoaded",async()=>{let id=new URLSearchParams(location.search).get("id"),p=(await CR.rows("podcasts",{limit:1,eq:["id",id]}))[0];if(!p)return;t.textContent=p.title;d.textContent=p.description||"A CrowRules Podcasting show.";let e=await CR.rows("cr_podcast_episodes",{limit:40,eq:["podcast_id",id],order:"episode_number",asc:true});eps.innerHTML=e.length?e.map(x=>CR.card(x,"episode")).join(""):'<div class="empty">No published episodes yet.</div>';follow.onclick=async()=>{if(!CR.C.user)return location.href="../membership/login.html";let r=await CR.C.db.from("podcast_follows").upsert({user_id:CR.C.user.id,podcast_id:id},{onConflict:"user_id,podcast_id"});if(!r.error)follow.textContent="FOLLOWING"};support.onclick=()=>location.href="monetization.html"})</script></main></body></html>
