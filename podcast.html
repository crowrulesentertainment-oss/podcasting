<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcast | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/global-navigation.css"><link rel="stylesheet" href="css/site.css"></head><body><main class="page"><div id="app" class="hero"><span class="eyebrow">PODCAST</span><h1>LOADING <span>SHOW.</span></h1><p>Connecting to CrowRules…</p></div><section id="episodes" class="grid"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/global-navigation.js" defer></script><script>const esc=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));(async()=>{const q=new URLSearchParams(location.search),id=q.get("id"),slug=q.get("slug"),app=document.getElementById("app"),out=document.getElementById("episodes");try{const db=supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabaseAnonKey);let p;if(id){const r=await db.from("podcasts").select("id,title,slug,description,category,artwork_url,status").eq("id",id).eq("status","published").maybeSingle();if(r.error)throw r.error;p=r.data}else if(slug){const r=await db.from("podcasts").select("id,title,slug,description,category,artwork_url,status").eq("slug",slug).eq("status","published").maybeSingle();if(r.error)throw r.error;p=r.data}if(!p)throw new Error("Podcast not found");app.innerHTML='<span class="eyebrow">'+esc(p.category||"PODCAST")+'</span><h1>'+esc(p.title)+'</h1><p>'+esc(p.description||"")+'</p><div class="actions"><a class="btn" href="podcasts.html">ALL PODCASTS</a></div>';const r=await db.from("episodes").select("id,title,description,published_at,audio_url,artwork_url").eq("podcast_id",p.id).eq("status","published").order("published_at",{ascending:false}).limit(60);if(r.error)throw r.error;out.innerHTML=(r.data||[]).map(e=>'<article class="card"><h2>'+esc(e.title)+'</h2><p>'+esc(e.description||"")+'</p>'+(e.audio_url?'<audio controls preload="none" style="width:100%" src="'+esc(e.audio_url)+'"></audio>':"")+'</article>').join("")||'<div class="status">No published episodes yet.</div>'}catch(e){app.innerHTML='<span class="eyebrow">PODCAST</span><h1>SHOW <span>UNAVAILABLE.</span></h1><p>The requested podcast could not be loaded.</p><div class="actions"><a class="btn primary" href="podcasts.html">BACK TO PODCASTS</a></div>'}})()</script></body></html>
