<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcast Directory — CrowRules</title><link rel="stylesheet" href="css/podcasting.css"><script type="module" src="js/app.js"></script></head><body><div data-nav></div><main class="page"><header class="page-head"><p class="eyebrow">CROWRULES PODCAST DIRECTORY</p><h1>One network. Many voices.</h1><p>Discover podcasts, creators and CrowRules Originals.</p><div class="search"><input id="directorySearch" placeholder="Search podcasts or creators…"><button class="btn primary" id="directoryGo">Search</button></div></header><section class="rank-list" id="directoryList"></section></main><script type="module">import{getSupabase}from"./js/supabase.js";const sb=await getSupabase(),box=document.getElementById("directoryList"),search=document.getElementById("directorySearch");async function load(){if(!sb){box.innerHTML="<div class='panel'>Connect Supabase to load the directory.</div>";return}let q=search.value.trim();let x=sb.from("cr_podcasts_65").select("*").eq("is_public",true).order("is_original",{ascending:false}).order("created_at",{ascending:false});if(q)x=x.ilike("title","%"+q+"%");const r=await x;if(r.error){box.textContent=r.error.message;return}box.innerHTML=(r.data||[]).map(p=>'<a class="rank-item" href="podcast.html?slug='+encodeURIComponent(p.slug)+'"><div><b>'+p.title.replaceAll("<","&lt;")+'</b><small>'+((p.is_original?"CROWRULES ORIGINAL · ":"")+p.category||"Podcast")+'</small></div><span>OPEN →</span></a>').join("")||"<div class='panel'>No podcasts found yet.</div>"}document.getElementById("directoryGo").onclick=load;load();</script></body></html>
