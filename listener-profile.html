<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listener Profile • CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting-platform.css?v=5"><script src="js/podcasting-config.js"></script><script src="js/podcasting-platform.js" defer></script><script src="js/podcasting-player.js" defer></script></head><body><main class="cr-shell"><section class="hero"><div><div class="eyebrow">CrowRules Podcasting • V5.1</div><h1 id="name">LISTENER</h1><p id="bio"></p><div id="stats" class="notice"></div><button id="follow" class="btn primary" style="display:none"></button></div></section><section class="section"><div class="section-head"><h2>Public Playlists</h2></div><div id="playlists" class="grid"></div></section><section class="section"><div class="section-head"><h2>Public Activity</h2></div><div id="activity" class="grid"></div></section></main><script>document.addEventListener('crow:ready',async()=>{const $=x=>document.getElementById(x),E=CrowPodcasting.esc;const key=new URLSearchParams(location.search).get('user');if(!key){$('name').textContent='Profile not specified';return}const p=await CrowPodcasting.getPublicProfile(key);if(!p){$('name').textContent='Profile unavailable';return}document.title='@'+(p.handle||p.display_name||'listener')+' • CrowRules Podcasting';$('name').textContent=p.display_name||'Listener';$('bio').textContent=p.handle?'@'+p.handle+' • '+(p.bio||''):p.bio||'';const s=await CrowPodcasting.getFollowerStats(p.user_id);$('stats').textContent=s.followers+' followers • '+s.following+' following';if(CrowPodcasting.user&&CrowPodcasting.user.id!==p.user_id){$('follow').style.display='inline-block';const f=await CrowPodcasting.rows('cr_podcast_user_follows_v5','follower_id',{eq:{follower_id:CrowPodcasting.user.id,followed_id:p.user_id},limit:1});$('follow').textContent=f.length?'✓ Following':'＋ Follow';$('follow').onclick=async()=>{if(f.length){await CrowPodcasting.unfollowListener(p.user_id);location.reload()}else{await CrowPodcasting.followListener(p.user_id);location.reload()}}}const ps=await CrowPodcasting.getPublicPlaylists(p.user_id);$('playlists').innerHTML=ps.map(x=>'<article class="card panel"><h3>♫ '+E(x.name)+'</h3><p>'+E(x.description||'')+'</p><a class="btn" href="playlist.html?id='+E(x.id)+'">Open Playlist</a></article>').join('')||'<div class="notice">No public playlists.</div>';const acts=await CrowPodcasting.rows('cr_podcast_activity_v5','*',{eq:{user_id:p.user_id,is_public:true},order:'created_at',ascending:false,limit:30});$('activity').innerHTML=acts.map(x=>'<article class="card panel"><span class="badge">'+E(x.activity_type)+'</span><p>'+new Date(x.created_at).toLocaleString()+'</p></article>').join('')||'<div class="notice">No public activity.</div>'})</script></body></html>
