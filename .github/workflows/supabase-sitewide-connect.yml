name: Ensure Supabase is connected on every Podcasting page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject universal Supabase bootstrap
        shell: python
        run: |
          from pathlib import Path
          marker = '<script src="js/crowrules-supabase-universal-v1.js?v=20261004-01" defer></script>'
          intelligence = '<script src="js/crow-podcasting-intelligence-v13.js?v=20261004-01" defer></script>'
          player = '<script src="js/crow-podcasting-player-v13-2.js?v=20261004-13" defer></script>'
          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              lower = text.lower()
              if marker in text:
                  additions = []
                  if intelligence not in text: additions.append(intelligence)
                  if player not in text: additions.append(player)
                  if additions:
                      pos = lower.find('</head>')
                      text = text[:pos] + '\n'.join(additions) + '\n' + text[pos:]
                      path.write_text(text, encoding='utf-8')
                      changed.append(str(path))
                  continue
              lower = text.lower()
              pos = lower.find('</head>')
              if pos < 0:
                  continue
              text = text[:pos] + marker + '\n' + intelligence + '\n' + player + '\n' + text[pos:]
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))
          print(f"Injected Supabase bootstrap into {len(changed)} HTML pages")
          for p in changed:
              print(p)
      - name: Commit sitewide injection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes required."
            exit 0
          fi
          git commit -m "Connect all Podcasting pages to Supabase"
          git push