name: Podcasting Edge Function CI Auditor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-function-audit:
    name: Scan + live Supabase registry check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify Supabase Management token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured. Add a scoped Supabase Management API token with edge_functions_read."
            exit 1
          fi

      - name: Fetch live Edge Function inventory
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request GET \
            --url "https://api.supabase.com/v1/projects/cevylpnoexugwgygvtgu/functions" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Accept: application/json" \
            --output live-functions.json
          node -e "const x=require('./live-functions.json'); if(!Array.isArray(x)){throw new Error('Unexpected Supabase function inventory response')}"

      - name: Run Edge Function auditor
        env:
          SUPABASE_FUNCTIONS_JSON: ${{ github.workspace }}/live-functions.json
        run: node scripts/audit-edge-functions.mjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: podcasting-edge-function-audit
          path: artifacts/edge-function-audit.*
          if-no-files-found: warn
