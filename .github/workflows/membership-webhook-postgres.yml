name: Membership Stripe webhook PostgreSQL integration

on:
  push:
    branches: [security/crowrulesplus-rls-review]
    paths:
      - 'supabase/tests/membership_webhook_postgres.integration.sql'
      - 'supabase/tests/membership-webhook-schema.setup.sql'
      - 'supabase/drafts/20261122150000_membership_webhook_reliability_candidate.sql'
      - 'supabase/tests/membership_webhook_concurrency.setup.sql'
      - '.github/workflows/membership-webhook-postgres.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/tests/membership_webhook_postgres.integration.sql'
      - 'supabase/tests/membership_webhook_concurrency.setup.sql'
      - '.github/workflows/membership-webhook-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webhook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d webhook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: webhook_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create disposable Supabase-like schema fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/membership-webhook-schema.setup.sql
      - name: Apply candidate SQL draft to disposable PostgreSQL only
        run: psql -v ON_ERROR_STOP=1 -f supabase/drafts/20261122150000_membership_webhook_reliability_candidate.sql
      - name: Run model and candidate SQL integration assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/membership_webhook_postgres.integration.sql
      - name: Prepare concurrency fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/membership_webhook_concurrency.setup.sql
      - name: Verify concurrent duplicate claims have one owner
        shell: bash
        run: |
          set -euo pipefail
          psql -Atqc "select webhook_race_it.claim('evt-parallel')" > /tmp/claim-a.txt &
          pid_a=$!
          psql -Atqc "select webhook_race_it.claim('evt-parallel')" > /tmp/claim-b.txt &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"
          cat /tmp/claim-a.txt /tmp/claim-b.txt
          claimed=$(cat /tmp/claim-a.txt /tmp/claim-b.txt | grep -Fxc claimed || true)
          busy=$(cat /tmp/claim-a.txt /tmp/claim-b.txt | grep -Fxc busy || true)
          if [[ "$claimed" -ne 1 || "$busy" -ne 1 ]]; then
            echo "Expected exactly one claimed and one busy response"
            exit 1
          fi
