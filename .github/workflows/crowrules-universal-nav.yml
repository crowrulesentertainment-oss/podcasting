name: CrowRules Podcasting — V7 Sitewide Navigation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install V7 navigation on every HTML page
        shell: python
        run: |
          from pathlib import Path
          import re

          CSS='css/podcasting.css?v=20261004'
          CONFIG='js/config.js?v=12'
          APP='js/app.js?v=12'
          changed=[]

          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8')
              original=s

              # Remove direct legacy navigation loaders. V7 is now the single owner.
              s=re.sub(r"""<script[^>]+src=["'][^"']*(?:podcasting-nav-v2|crowrules-podcasting-nav)[^"']*["'][^>]*>\s*</script>\s*""",'',s,flags=re.I)

              # Remove duplicate generated nav hosts, then create exactly one.
              s=re.sub(r"""<div\b[^>]*data-nav[^>]*>\s*</div>\s*""",'',s,flags=re.I)
              body=re.search(r'<body\b[^>]*>',s,flags=re.I)
              if body:
                  s=s[:body.end()]+'\n<div data-nav data-nav-owner="crowrules-podcasting-nav-v7"></div>'+s[body.end():]

              # Normalize shared stylesheet/config/app references.
              s=re.sub(r"""<link[^>]+href=["'][^"']*css/podcasting\.css(?:\?[^"']*)?["'][^>]*>\s*""",'',s,flags=re.I)
              s=re.sub(r"""<script[^>]+src=["'][^"']*js/config\.js(?:\?[^"']*)?["'][^>]*>\s*</script>\s*""",'',s,flags=re.I)
              s=re.sub(r"""<script[^>]+src=["'][^"']*js/app\.js(?:\?[^"']*)?["'][^>]*>\s*</script>\s*""",'',s,flags=re.I)

              if re.search(r'</head>',s,re.I):
                  tags=f'<link rel="stylesheet" href="{CSS}"><script src="{CONFIG}" defer></script><script src="{APP}" defer></script>'
                  s=re.sub(r'</head>',tags+'</head>',s,count=1,flags=re.I)

              if s!=original:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))

          print(f'Normalized {len(changed)} HTML pages')
          for p in changed:
              print(p)

      - name: Commit sitewide navigation
        run: |
          git config user.name "CrowRules Universal Navigation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git commit -m "Install CrowRules Podcasting V7 navigation on every page"
          git push
