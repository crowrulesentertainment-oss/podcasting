name: CrowRules Podcasting — Sitewide Navigation & Supabase
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upgrade every HTML page except launch.html
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://crowrulesentertainment-oss.github.io/podcasting"
          changed=0

          while IFS= read -r -d '' f; do
            rel="${f#./}"
            name="$(basename "$f")"
            [[ "$name" == "launch.html" ]] && continue
            grep -qi '</head>' "$f" || continue

            if ! grep -Fq "$BASE/css/podcasting.css" "$f" && ! grep -Fq 'css/podcasting.css' "$f"; then
              sed -i "s#</head>#<link rel=\"stylesheet\" href=\"$BASE/css/podcasting.css\">\\n</head>#I" "$f"
              changed=1
            fi

            if ! grep -Fq "$BASE/js/config.js" "$f" && ! grep -Fq 'js/config.js' "$f"; then
              sed -i "s#</head>#<script src=\"$BASE/js/config.js\" defer></script>\\n</head>#I" "$f"
              changed=1
            fi

            if ! grep -Fq "$BASE/js/app.js" "$f" && ! grep -Fq 'js/app.js' "$f"; then
              sed -i "s#</head>#<script src=\"$BASE/js/app.js\" defer></script>\\n</head>#I" "$f"
              changed=1
            fi

            if ! grep -Fq 'data-nav' "$f"; then
              sed -i '0,/<body[^>]*>/s#\(<body[^>]*>\)#\1\n<div data-nav></div>#I' "$f"
              changed=1
            fi
          done < <(find . -type f -name '*.html' -not -path './.git/*' -print0)

          if [[ "$changed" -eq 1 ]]; then
            git config user.name 'CrowRules Podcasting Automation'
            git config user.email 'actions@github.com'
            git add -A
            git commit -m 'Apply unified Podcasting navigation and Supabase bootstrap'
            git push
          else
            echo 'All applicable pages already use the unified shell.'
          fi
