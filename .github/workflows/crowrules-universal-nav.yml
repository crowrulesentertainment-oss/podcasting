name: CrowRules Podcasting — Legacy Normalizer (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize every non-launch Podcasting page
        run: node .github/scripts/rebuild-podcasting-v8.mjs
      - name: Commit normalization
        run: |
          git config user.name "CrowRules Podcasting"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '.github/scripts/rebuild-podcasting-v8.mjs'
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "chore: manual Podcasting page normalization [podcasting-v10]"
          git push
