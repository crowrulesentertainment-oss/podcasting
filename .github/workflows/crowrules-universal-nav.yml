name: CrowRules Podcasting — Universal Site Rebuild V9

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crowrules-podcasting-site-rebuild-v9
  cancel-in-progress: false

jobs:
  rebuild:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize every non-launch Podcasting page
        run: node .github/scripts/rebuild-podcasting-v8.mjs
      - name: Commit V9 rebuild
        run: |
          git config user.name "CrowRules Podcasting V9"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then echo "No HTML changes needed."; exit 0; fi
          git commit -m "chore: rebuild Podcasting pages to V9 [podcasting-v9]"
          git push
