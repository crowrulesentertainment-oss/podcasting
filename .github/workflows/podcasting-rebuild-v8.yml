name: CrowRules Podcasting V10 Rebuild

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/podcasting-rebuild-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crowrules-podcasting-v10-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[podcasting-v10]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize all site pages except index.html and launch.html
        run: node .github/scripts/rebuild-podcasting-v8.mjs
      - name: Commit normalized site
        run: |
          git config user.name "CrowRules Podcasting"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '.github/scripts/rebuild-podcasting-v8.mjs'
          if git diff --cached --quiet; then
            echo "No page changes required."
            exit 0
          fi
          git commit -m "chore: rebuild Podcasting site on V10 runtime [podcasting-v10]"
          git push
