name: CrowRules+ recovery SQL validation

on:
  push:
    branches: [security/crowrulesplus-rls-review]
  pull_request:
    branches: [main]
    paths:
      - 'supabase/drafts/20261122120000_crowrulesplus_foundation_recovery_draft.sql'
      - '.github/workflows/crowrulesplus-recovery-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crowrulesplus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crowrulesplus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create minimal Supabase-compatible test prerequisites
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d crowrulesplus_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid LANGUAGE sql STABLE
          AS $$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          CREATE TABLE public.members (
            user_id uuid,
            role text NOT NULL DEFAULT 'Member',
            status text NOT NULL DEFAULT 'Active'
          );
          CREATE TABLE public.ds_projects (id uuid PRIMARY KEY DEFAULT gen_random_uuid());
          GRANT SELECT ON public.members TO authenticated;
          ALTER TABLE public.members ENABLE ROW LEVEL SECURITY;
          CREATE POLICY members_select_own ON public.members
            FOR SELECT TO authenticated USING (user_id = (SELECT auth.uid()));
          SQL
      - name: Apply recovery draft to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d crowrulesplus_test -v ON_ERROR_STOP=1 \
            -f supabase/drafts/20261122120000_crowrulesplus_foundation_recovery_draft.sql
      - name: Verify schema, RLS, triggers, and admin helper
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d crowrulesplus_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            expected text[] := ARRAY[
              'crplus_admins','crplus_creators','crplus_projects','crplus_content',
              'crplus_live_channels','crplus_schedule','crplus_project_submissions',
              'crplus_project_tasks','crplus_project_credits','crplus_project_status_history',
              'crplus_entitlements','crplus_comments','crplus_follows','crplus_play_events',
              'crplus_ratings','crplus_notifications','crplus_collections',
              'crplus_collection_items','crplus_content_sources'
            ];
            missing text[];
            unprotected text[];
          BEGIN
            SELECT array_agg(t) INTO missing
            FROM unnest(expected) AS t
            WHERE to_regclass('public.' || t) IS NULL;
            IF missing IS NOT NULL THEN
              RAISE EXCEPTION 'Missing expected tables: %', missing;
            END IF;

            SELECT array_agg(c.relname) INTO unprotected
            FROM pg_class c
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public'
              AND c.relname = ANY(expected)
              AND c.relrowsecurity IS NOT TRUE;
            IF unprotected IS NOT NULL THEN
              RAISE EXCEPTION 'RLS not enabled: %', unprotected;
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname='trg_crplus_project_status_notification' AND NOT tgisinternal
            ) THEN RAISE EXCEPTION 'Project notification trigger missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname='trg_crplus_content_workflow_notification' AND NOT tgisinternal
            ) THEN RAISE EXCEPTION 'Content workflow trigger missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname='trg_crplus_schedule_notification' AND NOT tgisinternal
            ) THEN RAISE EXCEPTION 'Schedule notification trigger missing'; END IF;
          END $$;

          INSERT INTO auth.users(id) VALUES ('00000000-0000-0000-0000-000000000001');
          INSERT INTO public.members(user_id,role,status)
          VALUES ('00000000-0000-0000-0000-000000000001','Super_Admin','Active');
          SELECT set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000001',false);
          SET ROLE authenticated;
          DO $$
          BEGIN
            IF public.crplus_is_admin() IS NOT TRUE THEN
              RAISE EXCEPTION 'Existing members-based super_admin authorization was not preserved';
            END IF;
          END $$;
          RESET ROLE;

          -- Seed one published and one unpublished content item, each with a comment.
          INSERT INTO public.crplus_content(id,title,is_published)
          VALUES
            ('10000000-0000-0000-0000-000000000001','Published test',true),
            ('10000000-0000-0000-0000-000000000002','Unpublished test',false);
          INSERT INTO public.crplus_comments(id,user_id,content_id,body)
          VALUES
            ('20000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000001','Public comment'),
            ('20000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000002','Private comment');
          INSERT INTO public.crplus_notifications(id,user_id,title)
          VALUES ('30000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000001','Server notification');

          SET ROLE anon;
          DO $
          DECLARE visible_count integer;
          BEGIN
            SELECT count(*) INTO visible_count FROM public.crplus_comments;
            IF visible_count <> 1 THEN
              RAISE EXCEPTION 'Anonymous users must see comments only on published content; saw %', visible_count;
            END IF;
          END $;
          RESET ROLE;

          SET ROLE authenticated;
          DO $
          BEGIN
            BEGIN
              INSERT INTO public.crplus_comments(user_id,content_id,body,is_hidden,moderated_at,moderated_by)
              VALUES (
                (SELECT auth.uid()),
                '10000000-0000-0000-0000-000000000001',
                'Forged moderation',
                true,
                now(),
                (SELECT auth.uid())
              );
              RAISE EXCEPTION 'Comment insert accepted forged moderation fields';
            EXCEPTION WHEN insufficient_privilege THEN
              NULL;
            END;

            BEGIN
              UPDATE public.crplus_notifications
              SET title='Forged notification'
              WHERE id='30000000-0000-0000-0000-000000000001';
              RAISE EXCEPTION 'Notification title update unexpectedly succeeded';
            EXCEPTION WHEN insufficient_privilege THEN
              NULL;
            END;
          END $;
          UPDATE public.crplus_notifications
          SET is_read=true
          WHERE id='30000000-0000-0000-0000-000000000001';
          RESET ROLE;
          SQL
