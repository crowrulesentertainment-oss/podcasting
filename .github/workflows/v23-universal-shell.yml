name: Podcasting V23 Universal Shell Repair

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'css/sitewide-rebuild-v18.css'
      - 'js/sitewide-rebuild-v18.js'
      - 'scripts/apply-v23-universal-shell.py'
      - '.github/workflows/v23-universal-shell.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-all-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V23.5 responsive Halloween shell to every HTML page
        run: python3 scripts/apply-v23-universal-shell.py
      - name: Commit repository-wide HTML repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes required."
            exit 0
          fi
          git commit -m "V23.5 apply responsive Halloween shell to all HTML pages [skip ci]"
          git push
