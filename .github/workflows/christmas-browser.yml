name: Christmas desktop and mobile browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  christmas-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/christmas-http.log 2>&1 &
          echo $! > /tmp/christmas-http.pid
      - name: Run Christmas desktop and mobile scenarios
        run: |
          mkdir -p artifacts
          node tests/christmas-browser.mjs
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christmas-2026-browser-qa
          path: artifacts/
          if-no-files-found: warn
