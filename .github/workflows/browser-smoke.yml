name: Browser Runtime Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages
        run: sleep 15

      - name: Run browser smoke test
        env:
          CROWRULES_PODCASTING_BASE_URL: https://crowrulesentertainment-oss.github.io/podcasting/
        run: node tools/browser-smoke.mjs
