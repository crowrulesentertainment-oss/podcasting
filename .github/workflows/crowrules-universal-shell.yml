name: CrowRules Universal Shell Sync
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shell-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Podcasting HTML shell
        shell: python
        run: |
          from pathlib import Path
          import re

          CONFIG='js/config.js?v=11'
          APP='js/app.js?v=11'
          changed=[]

          for p in Path('.').glob('*.html'):
              if p.name == 'launch.html':
                  continue
              s=p.read_text(encoding='utf-8')
              original=s

              # Remove duplicate/old local shell references while preserving page-specific scripts.
              s=re.sub(r'<script[^>]+src=["'][^"']*/?js/config\.js(?:\?[^"']*)?["'][^>]*>\s*</script>\s*', '', s, flags=re.I)
              s=re.sub(r'<script[^>]+src=["'][^"']*/?js/app\.js(?:\?[^"']*)?["'][^>]*>\s*</script>\s*', '', s, flags=re.I)

              tags=f'<script src="{CONFIG}" defer></script><script src="{APP}" defer></script>'
              if re.search(r'</head>',s,re.I):
                  s=re.sub(r'</head>',tags+'</head>',s,count=1,flags=re.I)

              if s!=original:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))

          print('Normalized:',len(changed))
          for x in changed: print(x)

      - name: Commit normalized shell
        run: |
          git config user.name "CrowRules Universal Shell"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git commit -m "V11 normalize Universal Podcasting shell across pages"
          git push
