name: CrowRules Universal Page Enhancements

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize navigation, invite system, and Universal Audio Player V4
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path(".")
          changed = []

          for path in root.rglob("*.html"):
              if ".git" in path.parts:
                  continue

              original = path.read_text(encoding="utf-8")
              text = original
              relroot = "../" if len(path.parts) > 1 else ""

              canonical = (
                  f'<header class="nav">'
                  f'<a class="brand" href="{relroot}index.html">CROWRULES <span>PODCASTING</span></a>'
                  f'<nav class="navlinks"></nav>'
                  f'</header>'
              )

              header_re = r'<header\b[^>]*class=["\']nav["\'][^>]*>[\s\S]*?</header>'
              if re.search(header_re, text, re.I):
                  text = re.sub(header_re, canonical, text, count=1, flags=re.I)
              elif re.search(r'<body\b[^>]*>', text, re.I):
                  text = re.sub(r'(<body\b[^>]*>)', r'\1' + canonical, text, count=1, flags=re.I)

              text = re.sub(r'<script>\s*mountNav\([\s\S]*?</script>', "", text, flags=re.I)

              # Normalize any previous player URL, including V3/V4 cache variants.
              player_re = r'<script\s+src=["\'][^"\']*assets/js/crowrules-player\.js(?:\?[^"\']*)?["\']></script>'
              text = re.sub(player_re, "", text, flags=re.I)

              scripts = [
                  f'<script src="{relroot}js/crowrules-navigation.js"></script>',
                  f'<script src="{relroot}js/crowrules-invite.js"></script>',
                  f'<script src="{relroot}assets/js/crowrules-player.js?v=4"></script>',
                  f'<script src="{relroot}assets/js/crowrules-site-ux.js"></script>',
              ]

              for tag in scripts:
                  src = re.search(r'src="([^"]+)"', tag).group(1)
                  if src not in text:
                      body_end = re.search(r'</body>\s*</html>\s*$', text, re.I)
                      if body_end:
                          text = text[:body_end.start()] + tag + "\n" + text[body_end.start():]
                      else:
                          text += "\n" + tag + "\n"

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          print(f"Updated {len(changed)} HTML pages to Universal Audio Player V4")
          for item in changed:
              print(item)

      - name: Commit universal page enhancements
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi

          git config user.name "crowrules-bot"
          git config user.email "crowrules-bot@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Roll out Universal Audio Player V4 to all HTML pages [skip ci]"
          git push
