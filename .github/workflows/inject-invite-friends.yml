name: CrowRules Universal Page Enhancements

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-invite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize categories navigation and Invite Friends on every HTML page
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('.')
          changed=[]
          for path in root.rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text=path.read_text(encoding='utf-8')
              relroot='../' if len(path.parts)>1 else ''
              canonical=f'<header class="nav"><a class="brand" href="{relroot}index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header>'
              header_re=r'<header\b[^>]*class=["']nav["'][^>]*>[\s\S]*?</header>'
              if re.search(header_re,text,re.I):
                  text=re.sub(header_re,canonical,text,count=1,flags=re.I)
              elif re.search(r'<body\b[^>]*>',text,re.I):
                  text=re.sub(r'(<body\b[^>]*>)',r'\1'+canonical,text,count=1,flags=re.I)
              navrel=f'{relroot}js/crowrules-navigation.js'
              invrel=f'{relroot}js/crowrules-invite.js'
              tags=[]
              if navrel not in text: tags.append(f'<script src="{navrel}"></script>')
              if invrel not in text: tags.append(f'<script src="{invrel}"></script>')
              if tags:
                  tag='\n'.join(tags)
                  m=re.search(r'</body>\s*</html>\s*
          print(f'Updated {len(changed)} HTML pages')
          for x in changed: print(x)

      - name: Commit universal page enhancement links
        shell: bash
        run: |
          if git diff --quiet; then echo "No HTML changes needed."; exit 0; fi
          git config user.name "crowrules-bot"
          git config user.email "crowrules-bot@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git commit -m "Ensure universal CrowRules page enhancements [skip ci]"
          git push
