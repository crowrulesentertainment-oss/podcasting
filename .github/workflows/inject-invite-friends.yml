name: CrowRules Universal Page Enhancements

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-invite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Invite Friends is loaded on every HTML page
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('.')
          changed=[]
          for path in root.rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text=path.read_text(encoding='utf-8')
              if 'crowrules-invite.js' in text:
                  continue
              rel='../js/crowrules-invite.js' if len(path.parts)>1 else 'js/crowrules-invite.js'
              tag=f'<script src="{rel}"></script>'
              m=re.search(r'</body>\s*</html>\s*$',text,re.I)
              if m:
                  text=text[:m.start()]+tag+'\n'+text[m.start():]
              elif re.search(r'</body>\s*$',text,re.I):
                  text=re.sub(r'</body>\s*$',tag+'\n</body>',text,flags=re.I)
              else:
                  text+='\n'+tag+'\n'
              path.write_text(text,encoding='utf-8')
              changed.append(str(path))
          print(f'Updated {len(changed)} HTML pages')
          for x in changed: print(x)

      - name: Commit universal page enhancement links
        shell: bash
        run: |
          if git diff --quiet; then echo "No HTML changes needed."; exit 0; fi
          git config user.name "crowrules-bot"
          git config user.email "crowrules-bot@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git commit -m "Ensure universal CrowRules page enhancements [skip ci]"
          git push
