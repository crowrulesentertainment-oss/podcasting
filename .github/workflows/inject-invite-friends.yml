name: CrowRules Universal Page Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add universal invite and navigation scripts to every HTML page
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('.')
          changed=[]
          for path in root.rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text=path.read_text(encoding='utf-8')
              depth=len(path.parent.parts)
              rel_js='../js' if depth else 'js'
              additions=[]
              if 'crowrules-invite.js' not in text:
                  additions.append(f'<script src="{rel_js}/crowrules-invite.js"></script>')
              if 'crowrules-navigation.js' not in text:
                  additions.append(f'<script src="{rel_js}/crowrules-navigation.js"></script>')
              if not additions:
                  continue
              tag='\n'.join(additions)
              m=re.search(r'</body>\s*</html>\s*$',text,re.I)
              if m:
                  text=text[:m.start()]+tag+'\n'+text[m.start():]
              elif re.search(r'</body>\s*$',text,re.I):
                  text=re.sub(r'</body>\s*$',tag+'\n</body>',text,flags=re.I)
              else:
                  text+='\n'+tag+'\n'
              path.write_text(text,encoding='utf-8');changed.append(str(path))
          print(f'Updated {len(changed)} HTML pages')
          for x in changed: print(x)

      - name: Commit universal navigation
        shell: bash
        run: |
          if git diff --quiet; then echo "No HTML changes needed."; exit 0; fi
          git config user.name "crowrules-bot"
          git config user.email "crowrules-bot@users.noreply.github.com"
          git add '*.html' '**/*.html' .github/workflows/inject-invite-friends.yml js/crowrules-navigation.js
          git commit -m "Upgrade navigation and fix links across all HTML pages [skip ci]"
          git push
