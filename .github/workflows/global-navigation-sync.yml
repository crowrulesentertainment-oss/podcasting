name: Global Navigation 10.0 Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-navigation-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync global navigation includes
        run: node tools/inject-global-navigation.mjs

      - name: Commit synchronized pages
        run: |
          if git diff --quiet; then
            echo "All HTML pages already include Global Navigation 10.0."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '**/*.html'
          git commit -m "Sync Global Header & Navigation 10.0 across HTML pages"
          git push