name: Global Navigation Sync\n\non:\n  push:\n    branches: [main]\n  workflow_dispatch:\n\npermissions:\n  contents: write\n\nconcurrency:\n  group: global-navigation-sync\n  cancel-in-progress: true\n\njobs:\n  sync:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n          persist-credentials: true\n\n      - name: Sync global navigation includes\n        run: node tools/inject-global-navigation.mjs\n\n      - name: Commit synchronized pages\n        run: |\n          if git diff --quiet; then\n            echo "All HTML pages already include Global Navigation 3.0."\n            exit 0\n          fi\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add -- "*.html" "**/*.html"\n          git commit -m "Sync Global Header & Navigation 3.0 across HTML pages"\n          git push