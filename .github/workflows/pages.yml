name: Deploy CrowRules Podcasting to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build repository-wide navigation shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -a . _site
          rm -rf _site/.git _site/.github _site/_site
          find _site -type f -name '*.html' -print0 | while IFS= read -r -d '' file; do
            if ! grep -q 'js/global-navigation.js' "$file"; then
              if grep -qi '</body>' "$file"; then
                sed -i 's#</body>#<script src="/podcasting/js/global-navigation.js" defer></script></body>#I' "$file"
              elif grep -qi '</html>' "$file"; then
                sed -i 's#</html>#<script src="/podcasting/js/global-navigation.js" defer></script></html>#I' "$file"
              else
                printf '\n<script src="/podcasting/js/global-navigation.js" defer></script>\n' >> "$file"
              fi
            fi
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
