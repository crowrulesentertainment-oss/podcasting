name: Podcasting site checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          for file in assets/js/*.js; do
            node --check --input-type=module < "$file"
          done
      - name: Check pages, assets and public secrets
        run: node scripts/check-site.mjs
