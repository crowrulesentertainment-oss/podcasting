name: V7.25 Evidence Compliance Bot

on:
  push:
    paths:
      - "**/*.html"
      - "**/*.js"
      - ".github/workflows/evidence-compliance.yml"
      - "scripts/evidence-consumer-scan.mjs"
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.js"
      - ".github/workflows/evidence-compliance.yml"
      - "scripts/evidence-consumer-scan.mjs"
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Scan the entire repository instead of changed files"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  evidence-compliance:
    name: Scan changed HTML/JS consumers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only --diff-filter=ACMR "${BASE_SHA}" "${HEAD_SHA}" > /tmp/changed-files.txt
          elif [[ "${EVENT_NAME}" == "push" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only --diff-filter=ACMR "${BEFORE_SHA}" "${GITHUB_SHA}" > /tmp/changed-files.txt
          else
            git ls-files > /tmp/changed-files.txt
          fi
          {
            echo 'CROW_CHANGED_FILES<<EOF'
            cat /tmp/changed-files.txt
            echo EOF
          } >> "${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run V7.25 scanner
        env:
          CROW_CHANGED_FILES: ${{ env.CROW_CHANGED_FILES }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_scan }}" == "true" ]]; then
            node scripts/evidence-consumer-scan.mjs --all
          else
            node scripts/evidence-consumer-scan.mjs
          fi


      - name: Run V7.32 preventive change guard
        env:
          CROW_CHANGED_FILES: ${{ env.CROW_CHANGED_FILES }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_scan }}" == "true" ]]; then
            node scripts/evidence-change-guard-v732.mjs --all
          else
            node scripts/evidence-change-guard-v732.mjs
          fi

      - name: Upload V7.32 change-guard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-32-evidence-change-guard
          path: .evidence-compliance/change-guard.json
          if-no-files-found: ignore

      - name: V7.33 deployment gate
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/evidence-deployment-gate-v733.mjs

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-25-evidence-compliance-report
          path: .evidence-compliance/report.json
          if-no-files-found: ignore
