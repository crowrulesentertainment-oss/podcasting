<div class="auth-page">
<header class="auth-header"><a class="auth-brand" href="index.html">CROWRULES <span>· PODCASTING</span></a></header>
<main class="auth-main">
<section class="auth-card" aria-labelledby="title">
<span class="eyebrow">UNIVERSAL CROWRULES MEMBERSHIP</span>
<h1 id="title">RESET PASSWORD</h1>
<p id="sub" class="auth-sub">Enter your email and we'll send you a secure password-reset link.</p>
<div id="status" class="auth-status" role="status" aria-live="polite"></div>
<form id="request-form" class="form">
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
<button id="request-button" class="btn primary" type="submit">SEND RESET LINK</button>
</form>
<form id="update-form" class="form" style="display:none">
<div class="field"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></div>
<div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat your password"></div>
<button id="update-button" class="btn primary" type="submit">UPDATE PASSWORD</button>
</form>
<div class="auth-links"><a href="login.html">Back to login</a><a href="signup.html">Create an account</a></div>
</section>
</main>
<footer class="auth-footer"><b>CROWRULES PODCASTING</b> · Your Voice. Your Story. Your Universe.</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
(function(){
const sb=window.crSupabase, status=document.getElementById("status"), requestForm=document.getElementById("request-form"), updateForm=document.getElementById("update-form"), email=document.getElementById("email");
function show(msg,type){status.textContent=msg;status.className="auth-status show "+(type||"")}
function recovery(){return /type=recovery|access_token=|refresh_token=/.test(location.hash)||new URLSearchParams(location.search).get("code")}
function setRecoveryMode(){requestForm.style.display="none";updateForm.style.display="block";document.getElementById("title").textContent="CHOOSE A NEW PASSWORD";document.getElementById("sub").textContent="Set a new password for your CrowRules account."}
if(!sb){show("CrowRules authentication is temporarily unavailable. Please try again.","error");return}
sb.auth.onAuthStateChange(function(event){if(event==="PASSWORD_RECOVERY"){setRecoveryMode();show("Recovery session verified. Choose a new password.","success")}});
if(recovery()) setRecoveryMode();
requestForm.addEventListener("submit",async e=>{
e.preventDefault();const value=email.value.trim();if(!value)return;
document.body.classList.add("auth-loading");show("Sending your secure reset link…","success");
const {error}=await sb.auth.resetPasswordForEmail(value,{redirectTo:location.origin+location.pathname});
document.body.classList.remove("auth-loading");
if(error)show(error.message||"Unable to send reset link.","error");else show("Reset link sent. Check your email and follow the secure link to continue.","success");
});
updateForm.addEventListener("submit",async e=>{
e.preventDefault();const p=document.getElementById("new-password").value,c=document.getElementById("confirm-password").value;
if(p.length<8){show("Your new password must be at least 8 characters.","error");return}
if(p!==c){show("The passwords do not match.","error");return}
document.body.classList.add("auth-loading");show("Updating your password…","success");
const {error}=await sb.auth.updateUser({password:p});document.body.classList.remove("auth-loading");
if(error){show(error.message||"Unable to update your password.","error");return}
show("Password updated successfully. You can now sign in.","success");updateForm.style.display="none";document.getElementById("sub").textContent="Your CrowRules password has been updated.";setTimeout(()=>location.href="login.html",1800);
});
})();
</script>
<script src="js/app.js"></script>
