<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Chat — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/app.js" defer></script><style>
main{padding:48px 0}.chat{max-width:1050px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.box{border:1px solid rgba(255,255,255,.1);border-radius:24px;background:#0b0b14;overflow:hidden}.bar{padding:18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between}.messages{height:520px;overflow:auto;padding:20px}.msg{display:flex;gap:10px;margin-bottom:15px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#193b50,#49265e);font-weight:800}.name{font-weight:800;font-size:.82rem}.time{font-size:.68rem;color:#777;margin-left:8px}.text{margin-top:3px;color:#ddd;line-height:1.45}.compose{display:flex;gap:10px;padding:14px;border-top:1px solid rgba(255,255,255,.08)}input{flex:1;background:#05050b;color:#fff;border:1px solid #27273a;border-radius:14px;padding:13px}.pill{padding:7px 11px;border-radius:999px;background:#171722;font-size:.75rem}.empty{text-align:center;padding:80px 20px;color:#aaa}
</style></head><body><div data-nav></div><main class="wrap"><div class="chat"><div class="head"><div><div class="eyebrow">CROWRULES LIVE</div><h1>Live Chatroom</h1><p>Real-time conversation for the podcast community.</p></div><span id="status" class="pill">Connecting…</span></div><div class="box"><div class="bar"><strong id="roomName">Live Chat</strong><span id="online" class="pill">0 online</span></div><div id="messages" class="messages"><div class="empty">Loading conversation…</div></div><form id="form" class="compose"><input id="input" maxlength="500" placeholder="Sign in to join the conversation…" disabled><button class="btn primary" disabled>Send</button></form></div></div></main>
<script>
(()=>{const cfg=CROW_CONFIG||{},id=new URLSearchParams(location.search).get("id"),status=document.getElementById("status"),messages=document.getElementById("messages"),input=document.getElementById("input"),form=document.getElementById("form"),send=form.querySelector("button");const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function rest(t,p){const r=await fetch(cfg.supabaseUrl+"/rest/v1/"+t+"?"+new URLSearchParams(p),{headers:{apikey:cfg.supabaseKey,Authorization:"Bearer "+cfg.supabaseKey}});if(!r.ok)throw Error("Request failed");return r.json()}function sb(){return window.CROW_SUPABASE||window.supabase?.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true}})}function render(x){return '<div class="msg"><div class="avatar">'+esc((x.display_name||"L").slice(0,2).toUpperCase())+'</div><div><div><span class="name">'+esc(x.display_name||"Listener")+'</span><span class="time">'+new Date(x.created_at).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+'</span></div><div class="text">'+esc(x.message)+'</div></div></div>'}async function init(){if(!id)throw Error("Missing podcast id");const rooms=await rest("podcast_chat_rooms",{select:"id,name",podcast_id:"eq."+id});const room=rooms[0];if(!room)throw Error("No chatroom exists for this podcast.");document.getElementById("roomName").textContent=room.name;const rows=await rest("podcast_chat_messages",{select:"id,display_name,message,created_at",room_id:"eq."+room.id,is_hidden:"eq.false",order:"created_at.asc",limit:"100"});messages.innerHTML=rows.map(render).join("")||'<div class="empty">No messages yet. Be the first to say hello.</div>';messages.scrollTop=messages.scrollHeight;const client=sb();if(!client)return;const session=await client.auth.getUser();if(session.data.user){input.disabled=false;send.disabled=false;input.placeholder="Join the conversation…"}const channel=client.channel("podcast-chat-"+room.id);channel.on("postgres_changes",{event:"INSERT",schema:"public",table:"podcast_chat_messages",filter:"room_id=eq."+room.id},p=>{if(!p.new.is_hidden){messages.insertAdjacentHTML("beforeend",render(p.new));messages.scrollTop=messages.scrollHeight}});channel.on("presence",{event:"sync"},()=>{document.getElementById("online").textContent=Object.keys(channel.presenceState()).length+" online"});channel.subscribe(async s=>{status.textContent=s==="SUBSCRIBED"?"● Live":"Connecting…";if(s==="SUBSCRIBED")await channel.track({online_at:new Date().toISOString()})});form.onsubmit=async e=>{e.preventDefault();const u=(await client.auth.getUser()).data.user;if(!u){location.href="account.html?returnTo="+encodeURIComponent(location.href);return}const text=input.value.trim();if(!text)return;send.disabled=true;try{const name=u.user_metadata?.full_name||u.email?.split("@")[0]||"Listener";const r=await client.from("podcast_chat_messages").insert({room_id:room.id,user_id:u.id,display_name:name,message:text});if(r.error)throw r.error;input.value=""}catch(e){alert(e.message||"Unable to send message")}send.disabled=false}}init().catch(e=>{status.textContent="Offline";messages.innerHTML='<div class="empty">'+esc(e.message)+'</div>'})})();
</script></body></html>
