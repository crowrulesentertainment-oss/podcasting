<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05050b">
  <meta name="color-scheme" content="dark">

  <meta
    name="description"
    content="CrowRules Podcasting Creator Studio — create podcasts, manage episodes, grow your audience and manage creator monetization."
  >

  <title>Creator Studio | CrowRules Podcasting</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/podcasting.css">

  <style>
    :root {
      --bg:#05050b;
      --panel:#0c0d18;
      --panel2:#121321;
      --text:#f7f8ff;
      --muted:#9299b4;
      --dim:#69718c;
      --border:rgba(130,150,255,.16);
      --border2:rgba(130,150,255,.35);
      --cyan:#55e7ff;
      --purple:#a879ff;
      --pink:#ff6edb;
      --green:#69f5ae;
      --orange:#ffb86b;
      --red:#ff6d83;
      --shadow:0 25px 80px rgba(0,0,0,.42);
      --radius:22px;
    }

    * {
      box-sizing:border-box;
    }

    html {
      scroll-behavior:smooth;
    }

    body {
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family:Montserrat,system-ui,sans-serif;
      background:
        radial-gradient(circle at 10% 0%,rgba(85,231,255,.11),transparent 28%),
        radial-gradient(circle at 90% 10%,rgba(168,121,255,.12),transparent 30%),
        radial-gradient(circle at 50% 100%,rgba(255,110,219,.07),transparent 35%),
        var(--bg);
    }

    button,
    input,
    textarea,
    select {
      font:inherit;
    }

    button {
      cursor:pointer;
    }

    button:disabled {
      cursor:not-allowed;
      opacity:.55;
    }

    a {
      color:inherit;
      text-decoration:none;
    }

    .hidden {
      display:none !important;
    }

    /* LOADING */

    .loading {
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:30px;
    }

    .loading-card {
      width:min(560px,100%);
      padding:34px;
      text-align:center;
      border:1px solid var(--border);
      border-radius:26px;
      background:rgba(12,13,24,.92);
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
    }

    .loader {
      width:48px;
      height:48px;
      margin:0 auto 18px;
      border:2px solid rgba(255,255,255,.08);
      border-top-color:var(--cyan);
      border-right-color:var(--purple);
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform:rotate(360deg);
      }
    }

    /* TOP BAR */

    .studio-shell {
      min-height:100vh;
    }

    .topbar {
      position:sticky;
      top:0;
      z-index:50;
      min-height:74px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      padding:14px 28px;
      background:rgba(5,5,11,.78);
      border-bottom:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(20px);
    }

    .brand {
      display:flex;
      align-items:center;
      gap:13px;
      min-width:0;
    }

    .brand-mark {
      width:42px;
      height:42px;
      flex:0 0 42px;
      display:grid;
      place-items:center;
      border-radius:13px;
      background:linear-gradient(
        135deg,
        var(--cyan),
        var(--purple),
        var(--pink)
      );
      box-shadow:0 0 25px rgba(85,231,255,.18);
    }

    .brand-mark::after {
      content:"";
      width:15px;
      height:20px;
      border:2px solid #05050b;
      border-radius:8px;
    }

    .brand-title {
      font:800 15px Orbitron,sans-serif;
      letter-spacing:.12em;
      white-space:nowrap;
    }

    .brand-subtitle {
      margin-top:2px;
      color:var(--muted);
      font-size:10px;
      letter-spacing:.16em;
      text-transform:uppercase;
    }

    .actions {
      display:flex;
      align-items:center;
      gap:9px;
    }

    .top-btn,
    .btn {
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px 14px;
      background:rgba(255,255,255,.035);
      color:#eef0fb;
      font-size:11px;
      font-weight:800;
      transition:.2s;
    }

    .top-btn:hover,
    .btn:hover {
      border-color:var(--border2);
      transform:translateY(-1px);
      background:rgba(255,255,255,.07);
    }

    .user-chip {
      display:flex;
      align-items:center;
      gap:9px;
      padding:5px 10px 5px 5px;
      border:1px solid var(--border);
      border-radius:999px;
      background:rgba(255,255,255,.035);
    }

    .avatar {
      width:32px;
      height:32px;
      flex:0 0 32px;
      display:grid;
      place-items:center;
      border-radius:50%;
      object-fit:cover;
      background:linear-gradient(
        135deg,
        var(--cyan),
        var(--purple)
      );
      color:#05050b;
      font-size:11px;
      font-weight:900;
    }

    .user-name {
      max-width:150px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:11px;
      font-weight:800;
    }

    /* LAYOUT */

    .layout {
      width:min(1500px,100%);
      margin:auto;
      padding:28px;
      display:grid;
      grid-template-columns:240px minmax(0,1fr);
      gap:24px;
    }

    .sidebar {
      position:sticky;
      top:98px;
      height:max-content;
      padding:14px;
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:rgba(12,13,24,.88);
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
    }

    .label {
      padding:10px 12px 8px;
      color:#707895;
      font-size:9px;
      font-weight:800;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    .nav {
      display:grid;
      gap:5px;
    }

    .nav a,
    .nav button {
      width:100%;
      display:flex;
      align-items:center;
      gap:11px;
      border:0;
      border-radius:12px;
      padding:12px;
      background:transparent;
      color:#aeb4ca;
      text-align:left;
      font-size:11px;
      font-weight:800;
    }

    .nav a:hover,
    .nav button:hover,
    .nav .active {
      color:#fff;
      background:rgba(85,231,255,.08);
    }

    .icon {
      width:28px;
      height:28px;
      display:grid;
      place-items:center;
      border-radius:9px;
      background:rgba(255,255,255,.045);
      font-size:14px;
    }

    .divider {
      height:1px;
      margin:14px 4px;
      background:rgba(255,255,255,.07);
    }

    .mini {
      padding:14px;
      border-radius:15px;
      background:
        linear-gradient(
          135deg,
          rgba(85,231,255,.08),
          rgba(168,121,255,.08)
        );
      border:1px solid rgba(130,150,255,.12);
    }

    .mini-title {
      font:800 11px Orbitron,sans-serif;
      letter-spacing:.08em;
    }

    .mini-text {
      margin-top:7px;
      color:var(--muted);
      font-size:10px;
      line-height:1.6;
    }

    .main {
      min-width:0;
    }

    /* HERO */

    .hero {
      position:relative;
      overflow:hidden;
      min-height:255px;
      padding:34px;
      border:1px solid var(--border);
      border-radius:28px;
      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(85,231,255,.13),
          transparent 24%
        ),
        radial-gradient(
          circle at 95% 80%,
          rgba(255,110,219,.11),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          rgba(19,20,35,.96),
          rgba(8,9,17,.97)
        );
      box-shadow:var(--shadow);
    }

    .hero::after {
      content:"";
      position:absolute;
      width:330px;
      height:330px;
      right:-100px;
      top:-100px;
      border:1px solid rgba(85,231,255,.13);
      border-radius:50%;
      box-shadow:
        0 0 0 35px rgba(85,231,255,.025),
        0 0 0 70px rgba(85,231,255,.018);
    }

    .eyebrow {
      color:var(--cyan);
      font-size:10px;
      font-weight:800;
      letter-spacing:.2em;
      text-transform:uppercase;
    }

    .hero h1 {
      position:relative;
      z-index:1;
      margin:10px 0 8px;
      max-width:760px;
      font:800 clamp(28px,4vw,52px)/1.04 Orbitron,sans-serif;
      letter-spacing:-.03em;
    }

    .hero p {
      position:relative;
      z-index:1;
      max-width:700px;
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.8;
    }

    .hero-actions {
      position:relative;
      z-index:2;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:24px;
    }

    .primary {
      border:1px solid transparent;
      border-radius:12px;
      padding:12px 17px;
      color:#05050b;
      background:linear-gradient(
        135deg,
        var(--cyan),
        var(--purple)
      );
      font-size:11px;
      font-weight:900;
      box-shadow:0 10px 35px rgba(85,231,255,.13);
    }

    .secondary {
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px 17px;
      color:#fff;
      background:rgba(255,255,255,.045);
      font-size:11px;
      font-weight:800;
    }

    .primary:hover,
    .secondary:hover {
      transform:translateY(-2px);
    }

    /* STATS */

    .stats {
      margin-top:20px;
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:12px;
    }

    .stat {
      min-width:0;
      padding:18px;
      border:1px solid var(--border);
      border-radius:18px;
      background:rgba(12,13,24,.88);
      box-shadow:var(--shadow);
    }

    .stat-label {
      color:#8088a3;
      font-size:9px;
      font-weight:800;
      letter-spacing:.16em;
      text-transform:uppercase;
    }

    .stat-value {
      margin-top:8px;
      font:800 24px Orbitron,sans-serif;
    }

    .stat-detail {
      margin-top:5px;
      color:var(--dim);
      font-size:10px;
    }

    /* PANELS */

    .section {
      margin-top:24px;
    }

    .head {
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:15px;
      margin-bottom:13px;
    }

    .title {
      font:800 17px Orbitron,sans-serif;
      letter-spacing:.04em;
    }

    .subtitle {
      margin-top:4px;
      color:var(--dim);
      font-size:10px;
    }

    .link {
      border:0;
      background:none;
      color:var(--cyan);
      font-size:10px;
      font-weight:900;
    }

    .grid {
      display:grid;
      grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr);
      gap:18px;
    }

    .panel {
      min-width:0;
      padding:20px;
      border:1px solid var(--border);
      border-radius:20px;
      background:rgba(12,13,24,.88);
      box-shadow:var(--shadow);
    }

    .list {
      display:grid;
      gap:10px;
    }

    .row {
      display:grid;
      grid-template-columns:54px minmax(0,1fr) auto;
      align-items:center;
      gap:14px;
      padding:12px;
      border-radius:15px;
      border:1px solid rgba(255,255,255,.055);
      background:rgba(255,255,255,.025);
      transition:.2s;
    }

    .row:hover {
      border-color:var(--border2);
      transform:translateY(-1px);
    }

    .art {
      width:54px;
      height:54px;
      border-radius:14px;
      object-fit:cover;
      display:grid;
      place-items:center;
      background:linear-gradient(
        135deg,
        var(--cyan),
        var(--purple),
        var(--pink)
      );
      font:900 13px Orbitron;
      color:#05050b;
    }

    .name {
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:12px;
      font-weight:900;
    }

    .meta {
      margin-top:5px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      color:var(--dim);
      font-size:9px;
    }

    .status {
      display:inline-flex;
      align-items:center;
      gap:5px;
      border-radius:999px;
      padding:5px 8px;
      font-size:8px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .status::before {
      content:"";
      width:5px;
      height:5px;
      border-radius:50%;
      background:currentColor;
    }

    .published,
    .live {
      color:var(--green);
      background:rgba(105,245,174,.08);
    }

    .draft {
      color:var(--orange);
      background:rgba(255,184,107,.08);
    }

    .archived {
      color:#8790aa;
      background:rgba(135,144,170,.08);
    }

    /* QUICK TOOLS */

    .quick {
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }

    .quick-card {
      min-height:110px;
      padding:15px;
      border:1px solid var(--border);
      border-radius:16px;
      background:rgba(255,255,255,.025);
      color:#fff;
      text-align:left;
      transition:.2s;
    }

    .quick-card:hover {
      transform:translateY(-2px);
      border-color:var(--border2);
      background:rgba(255,255,255,.045);
    }

    .quick-icon {
      font-size:20px;
    }

    .quick-title {
      margin-top:10px;
      font-size:11px;
      font-weight:900;
    }

    .quick-text {
      margin-top:5px;
      color:#737b94;
      font-size:9px;
      line-height:1.5;
    }

    /* EPISODES */

    .episode {
      display:grid;
      grid-template-columns:45px minmax(0,1fr) auto;
      gap:12px;
      align-items:center;
      padding:11px;
      border-radius:14px;
      background:rgba(255,255,255,.025);
      border:1px solid rgba(255,255,255,.05);
    }

    .episode-number {
      width:45px;
      height:45px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:rgba(168,121,255,.1);
      color:var(--purple);
      font:800 11px Orbitron;
    }

    .episode-title {
      font-size:11px;
      font-weight:900;
    }

    .episode-meta {
      margin-top:4px;
      color:#747c95;
      font-size:9px;
    }

    .plays {
      text-align:right;
      color:#aeb4c8;
      font-size:9px;
      white-space:nowrap;
    }

    /* METRICS */

    .metrics {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
    }

    .metric {
      padding:14px;
      border-radius:14px;
      background:rgba(255,255,255,.025);
      border:1px solid rgba(255,255,255,.05);
    }

    .metric-label {
      color:#777f98;
      font-size:8px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .metric-value {
      margin-top:7px;
      font:800 18px Orbitron;
    }

    .empty {
      padding:30px 15px;
      text-align:center;
      color:#737b94;
      font-size:10px;
      border:1px dashed rgba(255,255,255,.08);
      border-radius:15px;
    }

    /* MODAL */

    .modal {
      position:fixed;
      inset:0;
      z-index:90;
      display:none;
      place-items:center;
      padding:20px;
      background:rgba(0,0,0,.72);
      backdrop-filter:blur(12px);
    }

    .modal.open {
      display:grid;
    }

    .modal-card {
      width:min(700px,100%);
      max-height:90vh;
      overflow:auto;
      padding:25px;
      border:1px solid var(--border2);
      border-radius:24px;
      background:#0c0d18;
      box-shadow:0 30px 100px rgba(0,0,0,.6);
    }

    .modal-head {
      display:flex;
      justify-content:space-between;
      gap:15px;
      align-items:start;
      margin-bottom:20px;
    }

    .modal-title {
      font:800 18px Orbitron;
    }

    .close {
      width:35px;
      height:35px;
      border:1px solid var(--border);
      border-radius:10px;
      background:rgba(255,255,255,.04);
      color:#fff;
    }

    .form {
      display:grid;
      gap:14px;
    }

    .field {
      display:grid;
      gap:7px;
    }

    .field label {
      color:#9ca3bb;
      font-size:9px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .field input,
    .field textarea,
    .field select {
      width:100%;
      border:1px solid var(--border);
      border-radius:12px;
      outline:0;
      background:#080912;
      color:#fff;
      padding:12px 13px;
    }

    .field textarea {
      min-height:120px;
      resize:vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color:var(--cyan);
      box-shadow:0 0 0 3px rgba(85,231,255,.07);
    }

    .modal-actions {
      display:flex;
      justify-content:flex-end;
      gap:10px;
      margin-top:20px;
    }

    /* TOAST */

    .toast {
      position:fixed;
      right:22px;
      bottom:22px;
      z-index:100;
      max-width:450px;
      padding:14px 17px;
      border:1px solid var(--border2);
      border-radius:14px;
      background:rgba(12,13,24,.97);
      box-shadow:var(--shadow);
      transform:translateY(25px);
      opacity:0;
      pointer-events:none;
      transition:.25s;
      font-size:10px;
      line-height:1.5;
    }

    .toast.show {
      transform:translateY(0);
      opacity:1;
    }

    .error-detail {
      margin-top:16px;
      padding:13px;
      text-align:left;
      border:1px solid rgba(255,109,131,.18);
      border-radius:12px;
      background:rgba(255,109,131,.05);
      color:#ffabb7;
      font:10px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
      white-space:pre-wrap;
      word-break:break-word;
    }

    /* RESPONSIVE */

    @media(max-width:1100px) {
      .stats {
        grid-template-columns:repeat(3,1fr);
      }

      .layout {
        grid-template-columns:1fr;
      }

      .sidebar {
        position:static;
      }

      .nav {
        display:flex;
        overflow:auto;
      }

      .nav a,
      .nav button {
        min-width:max-content;
      }

      .label,
      .divider,
      .mini {
        display:none;
      }
    }

    @media(max-width:800px) {
      .topbar {
        padding:12px 15px;
      }

      .layout {
        padding:15px;
      }

      .hero {
        padding:24px;
      }

      .stats {
        grid-template-columns:repeat(2,1fr);
      }

      .grid {
        grid-template-columns:1fr;
      }

      .metrics {
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:560px) {
      .brand-subtitle {
        display:none;
      }

      .user-name {
        display:none;
      }

      .hero h1 {
        font-size:30px;
      }

      .row {
        grid-template-columns:45px minmax(0,1fr);
      }

      .row > .status {
        grid-column:2;
        width:max-content;
      }

      .episode {
        grid-template-columns:40px minmax(0,1fr);
      }

      .plays {
        grid-column:2;
        text-align:left;
      }
    }

    @media(prefers-reduced-motion:reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior:auto !important;
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.001ms !important;
      }
    }
  </style>

<body>

<div id="app">
  <div class="loading">
    <div class="loading-card">
      <div class="loader"></div>

      <div style="font:800 14px Orbitron">
        INITIALIZING CREATOR STUDIO
      </div>

      <div style="margin-top:8px;color:var(--muted);font-size:10px">
        Connecting to your CrowRules Podcasting universe…
      </div>
    </div>
  </div>
</div>

<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite"
></div>

<!-- CREATE PODCAST MODAL -->

<div
  id="podcastModal"
  class="modal"
  aria-hidden="true"
>
  <div class="modal-card">

    <div class="modal-head">

      <div>
        <div class="eyebrow">
          Creator Studio
        </div>

    window.SUPABASE_PUBLISHABLE_KEY ||
    window.SUPABASE_ANON_KEY ||
    "sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-";

  /* ---------------------------------------------------------
     HELPERS
  --------------------------------------------------------- */

  function esc(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function num(value) {
    return new Intl.NumberFormat("en-US")
      .format(Number(value || 0));
  }

  function duration(seconds) {
    const total = Math.max(
      0,
      Number(seconds || 0)
    );

    if (total < 60) {
      return Math.round(total) + "s";
    }

    const minutes = Math.floor(total / 60);

    if (minutes < 60) {
      return minutes + "m";
    }

    const hours = Math.floor(minutes / 60);
    const remainder = minutes % 60;

    return hours + "h " + remainder + "m";
  }

  function initials(name) {
    return String(name || "CR")
      .trim()
      .split(/\s+/)
      .slice(0, 2)
      .map(value => value[0])
      .join("")
      .toUpperCase();
  }

  function slugify(value) {
    return String(value || "")
      .toLowerCase()
      .normalize("NFKD")
      .replace(/[^a-z0-9\s-]/g, "")
      .trim()
      .replace(/\s+/g, "-")
      .replace(/-+/g, "-")
      .replace(/^-|-$/g, "");
  }

  function showToast(message) {
    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {
      toast.classList.remove("show");
    }, 5000);
  }

  function fatal(title, message, detail = "") {
    clearTimeout(loadingTimer);

    app.innerHTML = `

          <div style="font-size:42px;margin-bottom:15px">

            font-size:10px;
            line-height:1.7
          ">
            ${esc(message)}
          </div>

          ${
            detail

  function requireClient() {
    if (!window.supabase) {
      throw new Error(
        "Supabase JavaScript failed to load. Verify the @supabase/supabase-js CDN script."
      );
    }

    if (!SUPABASE_URL) {
      throw new Error(
        "Supabase URL is missing."
      );
    }

    if (!SUPABASE_KEY) {
      throw new Error(
        "Supabase publishable key is missing."
      );
    }

    client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );
  }

  /* ---------------------------------------------------------
     AUTH
  --------------------------------------------------------- */

  async function getAuthenticatedUser() {
    const shared=window.CrowRulesAccount;
    if(!shared) throw new Error("CrowRules account services are unavailable.");
    const state=await Promise.resolve(shared.ready);
    return state?.user||null;
  }

     CREATOR
  --------------------------------------------------------- */

  async function loadCreator() {
    return window.CrowRulesAccount?.getState?.()?.creatorRecord || null;
  }

     PROFILE
  --------------------------------------------------------- */

  async function loadProfile() {
    return window.CrowRulesAccount?.getState?.()?.profile || null;

     CREATOR STATS
  --------------------------------------------------------- */

  async function loadStats() {

    const result =
      await client
        .from("podcast_creator_stats")
        .select(`
          user_id,
          podcast_count,
          published_episode_count,
          total_episode_count,
          total_plays,
          listening_seconds,
          follower_count,
          approved_comment_count,
          saved_episode_count,
          last_episode_at,
          crowpoints
        `)
        .eq(
          "user_id",
          currentUser.id
        )
        .maybeSingle();

    if (result.error) {
      console.warn(
        "Stats query:",
        result.error
      );

      return null;
    }

    return result.data;
  }

  /* ---------------------------------------------------------
     PODCASTS
  --------------------------------------------------------- */

  async function loadPodcasts() {

    if (!currentUser?.id) {
      return [];
    }

    const membershipResult =
      await client
        .from("podcast_creators")
        .select(`
          podcast_id,
          role,
          can_manage
        `)
        .eq(
          "user_id",
          currentUser.id
        );

    if (membershipResult.error) {
      console.warn(
        "Podcast membership query:",
        membershipResult.error
      );

      /*
       * The owner can still be discovered through the creator.
       * This fallback prevents an RLS read-policy problem from
       * making the Creator Studio appear empty.
       */

      if (!currentCreator?.id) {
        return [];
      }

      const ownerResult =
        await client
          .from("podcasts")
          .select(`
            id,
            creator_id,
            title,
            slug,
            category,
            description,
            artwork_url,
            trailer_url,
            website_url,
            rss_url,
            status,
            is_featured,
            is_live,
            listener_count,
            total_plays,
            created_at,
            updated_at,
            category_id
          `)
          .eq(
            "creator_id",
            currentCreator.id
          )
          .order("updated_at", {
            ascending: false
          });

      if (ownerResult.error) {
        console.warn(
          "Owner podcast query:",
          ownerResult.error
        );

        return [];
      }

      return ownerResult.data || [];
    }

    const ids = [
      ...new Set(
        (membershipResult.data || [])
          .map(row => row.podcast_id)
          .filter(Boolean)
      )
    ];

    /*
     * Always include podcasts owned by the creator.
     */

    let ownerQuery = [];

    if (currentCreator?.id) {

      const ownerResult =
        await client
          .from("podcasts")
          .select(`
            id,
            creator_id,
            title,
            slug,
            category,
            description,
            artwork_url,
            trailer_url,
            website_url,
            rss_url,
            status,
            is_featured,
            is_live,
            listener_count,
            total_plays,
            created_at,
            updated_at,
            category_id
          `)
          .eq(
            "creator_id",
            currentCreator.id
          );

      if (!ownerResult.error) {
        ownerQuery =
          ownerResult.data || [];
      }
    }

    let membershipPodcasts = [];

    if (ids.length) {

      const result =
        await client
          .from("podcasts")
          .select(`
            id,
            creator_id,
            title,
            slug,
            category,
            description,
            artwork_url,
            trailer_url,
            website_url,
            rss_url,
            status,
            is_featured,
            is_live,
            listener_count,
            total_plays,
            created_at,
            updated_at,
            category_id
          `)
          .in("id", ids)
          .order("updated_at", {
            ascending: false
          });

      if (!result.error) {
        membershipPodcasts =
          result.data || [];
      }
    }

    const combined = [
      ...ownerQuery,
      ...membershipPodcasts
    ];

    const unique = new Map();

    combined.forEach(podcast => {
      if (podcast?.id) {
        unique.set(
          podcast.id,
          podcast
        );
      }
    });

    return [...unique.values()]
      .sort(
        (a,b) =>
          new Date(b.updated_at || 0) -
          new Date(a.updated_at || 0)
      );
  }

     EPISODES
  --------------------------------------------------------- */

  async function loadEpisodes() {

    const ids =
      podcasts
        .map(podcast => podcast.id)
        .filter(Boolean);

    if (!ids.length) {
      return [];
    }

    const result =
      await client
        .from("podcast_episodes")
        .select(`
          id,
          podcast_id,
          title,
          slug,
          description,
          episode_number,
          season_number,
          published_at,
          duration_seconds,
          audio_url,
          video_url,
          thumbnail_url,
          transcript,
          show_notes,
          status,
          play_count,
          is_explicit,
          created_at,
          updated_at
        `)
        .in(
          "podcast_id",
          ids
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        )
        .limit(12);

    if (result.error) {
      console.warn(
        "Episode query:",
        result.error
      );

      return [];
    }

    return result.data || [];
  }

  function statusClass(status) {

    const value =
      String(status || "draft")
        .toLowerCase();

    if (value === "published") {
      return "published";
    }

    if (value === "live") {
      return "live";
    }

    if (value === "archived") {
      return "archived";
    }

    return "draft";

                                    index + 1
                                  )}
                                </div>

                                <div>

                                  <div class="episode-title">
                                    ${esc(
                                      episode.title
                                    )}
                                  </div>

                                  <div class="episode-meta">
                                    ${esc(
                                      podcast?.title ||
                                      "Podcast"
                                    )}
                                    ·
                                    ${
                                      episode.duration_seconds
                                        ? duration(
                                            episode.duration_seconds
                                          )
                                        : "No duration"
                                    }
                                    ·
                                    ${esc(
                                      statusText(
                                        episode.status
                                      )
                                    )}
                                  </div>

                                </div>

                                <div class="plays">
                                  ${num(
                                    episode.play_count
                                  )}
                                  plays
                                </div>

                              </article>
                            `;
                          }
                        ).join("")
                      : `
                        <div class="empty">
                          No episodes yet.
                          Your first episode starts here.
                        </div>
                      `
                  }

                </div>

              </div>

            </section>

            <section
              class="section"
              id="performance"
            >

              <div class="panel">

                <div class="head">

                  <div>
                    <div class="title">
                      Creator Performance
                    </div>

                    <div class="subtitle">
                      Your Podcasting network activity
                    </div>
                  </div>

                </div>

                <div class="metrics">

                  <div class="metric">
                    <div class="metric-label">
                      Listening Time
                    </div>

                    <div class="metric-value">
                      ${duration(
                        stats.listening_seconds
                      )}
                    </div>
                  </div>

                  <div class="metric">
                    <div class="metric-label">
                      Saved Episodes
                    </div>

                    <div class="metric-value">
                      ${num(
                        stats.saved_episode_count
                      )}
                    </div>
                  </div>

                  <div class="metric">
                    <div class="metric-label">
                      Comments
                    </div>

                    <div class="metric-value">
                      ${num(
                        stats.approved_comment_count
                      )}
                    </div>
                  </div>

                  <div class="metric">
                    <div class="metric-label">
                      Last Episode
                    </div>

                    <div class="metric-value">

                      ${
                        stats.last_episode_at
                          ? new Intl.DateTimeFormat(
                              "en-US",
                              {
                                month:"short",
                                day:"numeric",
                                year:"numeric"
                              }
                            ).format(
                              new Date(
                                stats.last_episode_at
                              )
                            )
                          : "—"
                      }

                    </div>
                  </div>

                </div>

              </div>

            </section>

          </main>

        </div>

      </div>
    `;

    bindDashboard();
  }

  /* ---------------------------------------------------------
     DASHBOARD EVENTS
  --------------------------------------------------------- */

  function bindDashboard() {

    document
      .querySelectorAll(
        "[data-action]"
      )
      .forEach(element => {

        element.addEventListener(
          "click",
          () => {

            const action =
              element.dataset.action;

            if (
              action ===
              "create-podcast"
            ) {
              openPodcastModal();
              return;
            }

            if (
              action ===
              "new-episode"
            ) {
              openEpisodeStudio();
            }

          }
        );

      });

    document
      .getElementById("logout")
      ?.addEventListener(
        "click",
        signOut
      );
  }

  /* ---------------------------------------------------------
     PODCAST MODAL
  --------------------------------------------------------- */

  function openPodcastModal() {

    const modal =
      document.getElementById(
        "podcastModal"
      );

    modal.classList.add("open");

    modal.setAttribute(
      "aria-hidden",
      "false"
    );

    setTimeout(
      () =>
        document
          .getElementById(
            "podcastTitle"
          )
          ?.focus(),
      50
    );
  }

  function closePodcastModal() {

    const modal =
      document.getElementById(
        "podcastModal"
      );

    modal.classList.remove("open");

    modal.setAttribute(
      "aria-hidden",
      "true"
    );

    document
      .getElementById(
        "podcastForm"
      )
      ?.reset();
  }

  /* ---------------------------------------------------------
     SECURE PODCAST CREATION
  --------------------------------------------------------- */

  async function createPodcast(event) {

    event.preventDefault();

    const button =
      document.getElementById(
        "createPodcastButton"
      );

    if (button) {
      button.disabled = true;
      button.textContent =
        "Creating Podcast…";
    }

    try {

      if (!currentUser) {
        throw new Error(
          "Your CrowRules session has expired. Please sign in again."
        );
      }

      /*
       * IMPORTANT:
       *
       * Do NOT send currentUser.id as podcasts.creator_id.
       *
       * The database now resolves the authenticated user's
       * CrowRules creator through:
       *
       * auth.users
       *    ↓
       * members
       *    ↓
       * creators
       *
       * using the secure create_podcast RPC.
       */

      const title =
        document
          .getElementById(
            "podcastTitle"
          )
          .value
          .trim();

      const category =
        document
          .getElementById(
            "podcastCategory"
          )
          .value
          .trim();

      const description =
        document
          .getElementById(
            "podcastDescription"
          )
          .value
          .trim();

      const artwork =
        document
          .getElementById(
            "podcastArtwork"
          )
          .value
          .trim();

      const website =
        document
          .getElementById(
            "podcastWebsite"
          )
          .value
          .trim();

      if (!title) {
        throw new Error(
          "Podcast name is required."
        );
      }

      /*
       * Create a client-side slug.
       *
       * The database also protects against
       * duplicate slugs.
       */

      const baseSlug =
        slugify(title);

      const slug =
        (
          baseSlug ||
          "podcast"
        ) +
        "-" +
        crypto
          .randomUUID()
          .slice(0,8);

      /*
       * SECURE SUPABASE RPC
       */

      const result =
        await client.rpc(
          "create_podcast",
          {
            p_title:title,
            p_slug:slug,
            p_category:
              category ||
              "Talk & Commentary",
            p_description:
              description ||
              null,
            p_artwork_url:
              artwork ||
              null,
            p_trailer_url:null,
            p_website_url:
              website ||
              null
          }
        );

      if (result.error) {

        console.error(
          "create_podcast RPC failed:",
          result.error
        );

        /*
         * Give the creator a useful message
         * instead of a generic database error.
         */

        if (
          result.error.message
            ?.toLowerCase()
            .includes(
              "no active crowrules creator"
            )
        ) {

          throw new Error(
            "Your CrowRules Creator profile is not linked to your membership account yet. Please complete your Creator Profile before creating a podcast."
          );
        }

        throw result.error;
      }

      if (!result.data) {
        throw new Error(
          "Supabase created no podcast record."
        );
      }

      console.log(
        "Podcast created successfully:",
        result.data
      );

      closePodcastModal();

      showToast(
        `"${result.data.title}" was created successfully.`
      );

      /*
       * Refresh everything.
       */

      await refreshDashboard();

    } catch (error) {

      console.error(
        "Podcast creation failed:",
        error
      );

      showToast(
        error?.message ||
        "Unable to create podcast."
      );

    } finally {

      if (button) {
        button.disabled = false;
        button.textContent =
          "Create Podcast";
      }

    }
  }

  /* ---------------------------------------------------------
     EPISODE ROUTING
  --------------------------------------------------------- */

  function openEpisodeStudio() {

    if (!podcasts.length) {

      showToast(
        "Create a podcast first, then add your first episode."
      );

      openPodcastModal();

      return;
    }

    location.href =
      "episode-studio.html?podcast=" +
      encodeURIComponent(
        podcasts[0].id
      );
  }

  /* ---------------------------------------------------------
     SIGN OUT
  --------------------------------------------------------- */

  async function signOut() {

    try {

      const result =
        await client.auth.signOut();

      if (result.error) {
        throw result.error;
      }

      location.replace(
        "login.html"
      );

    } catch (error) {

      console.error(
        "Sign out failed:",
        error
      );

      showToast(
        error?.message ||
        "Unable to sign out."
      );
    }
  }

  /* ---------------------------------------------------------
     REFRESH
  --------------------------------------------------------- */

  async function refreshDashboard() {

    currentProfile =
      await loadProfile();

    currentStats =
      await loadStats();

    currentCreator =
      await loadCreator();

    podcasts =
      await loadPodcasts();

    episodes =
      await loadEpisodes();

    render();
  }

  /* ---------------------------------------------------------
     INITIALIZATION
  --------------------------------------------------------- */

  async function initialize() {

    loadingTimer =
      setTimeout(
        () => {

          fatal(
            "Creator Studio could not initialize",
            "The connection did not finish within 15 seconds.",
            "Verify Supabase configuration, authentication and browser console errors."
          );

        },
        15000
      );

    try {

      requireClient();

      /*
       * Listen for future auth changes.
       */

      client.auth.onAuthStateChange(
        (event, session) => {

          if (
            initialized &&
            (
              event ===
              "SIGNED_OUT" ||
              !session
            )
          ) {

            location.replace(
              "login.html?redirect=creator-studio.html"
            );
          }

        }
      );

      /*
       * Get authenticated user.
       */

      currentUser =
        await getAuthenticatedUser();

      if (!currentUser) {

        location.replace(
          "login.html?redirect=creator-studio.html"
        );

        return;
      }

      /*
       * Load creator identity first.
       */

      currentCreator =
        await loadCreator();

      /*
       * This is deliberately not fatal.
       *
       * The user can see the dashboard,
       * but podcast creation will clearly
       * explain what needs to be fixed.
       */

      if (!currentCreator) {

        console.warn(
          "No active CrowRules creator profile found for this account."
        );

      }

      currentProfile =
        await loadProfile();

      currentStats =
        await loadStats();

      podcasts =
        await loadPodcasts();

      episodes =
        await loadEpisodes();

      initialized = true;

      clearTimeout(
        loadingTimer
      );

      render();

    } catch (error) {

      console.error(
        "Creator Studio initialization failed:",
        error
      );

      clearTimeout(
        loadingTimer
      );

      fatal(
        "Creator Studio could not load",
        error?.message ||
          "Unknown initialization error.",
        JSON.stringify(
          {
            name:
              error?.name ||
              null,
            message:
              error?.message ||
              null,
            code:
              error?.code ||
              null,
            details:
              error?.details ||
              null,
            hint:
              error?.hint ||
              null
          },
          null,
          2
        )
      );
    }
  }

  /* ---------------------------------------------------------
     STATIC EVENT HANDLERS
  --------------------------------------------------------- */

  document
    .getElementById(
      "closePodcastModal"
    )
    ?.addEventListener(
      "click",
      closePodcastModal
    );

  document
    .getElementById(
      "cancelPodcast"
    )
    ?.addEventListener(
      "click",
      closePodcastModal
    );

  document
    .getElementById(
      "podcastForm"
    )
    ?.addEventListener(
      "submit",
      createPodcast
    );

  document
    .getElementById(
      "podcastModal"
    )
    ?.addEventListener(
      "click",
      event => {

        if (
          event.target.id ===
          "podcastModal"
        ) {
          closePodcastModal();
        }

      }
    );

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Escape"
      ) {
        closePodcastModal();
      }

    }
  );

  /*
   * Catch JavaScript errors that would
   * otherwise leave the loading screen frozen.
   */

  window.addEventListener(
    "error",
    event => {

      console.error(
        "Global JavaScript error:",
        event.error || event.message
      );

    }
  );

  window.addEventListener(
    "unhandledrejection",
    event => {

      console.error(
        "Unhandled Promise rejection:",
        event.reason
      );

    }
  );

  initialize();

})();
</script>
