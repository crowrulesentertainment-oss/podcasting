<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In • CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"></head>
<body class="auth-page"><header class="site-header"><a class="brand" href="./"><span class="brand-mark">C</span><span><b>CrowRules</b><small>Podcasting</small></span></a><a class="text-btn" href="./">← Back to Podcasting</a></header>
<main class="auth-shell"><section class="auth-card"><div class="kicker">ONE ACCOUNT. ONE UNIVERSE.</div><h1 id="authTitle">Welcome back.</h1><p id="authSubtitle">Sign in to your CrowRules account.</p>
<div class="auth-tabs"><button id="loginTab" class="active">Sign In</button><button id="signupTab">Create Account</button></div>
<form id="authForm"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="6" required></label><label id="confirmWrap" class="hidden">Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="6"></label><button class="btn btn-primary wide" id="authSubmit" type="submit">Sign In</button></form>
<button id="googleBtn" class="btn btn-ghost wide">Continue with Google</button><button id="resetBtn" class="link-btn">Forgot your password?</button><p id="authMessage" class="form-message"></p><p class="fine-print">By creating an account, you agree to use CrowRules responsibly. Your authentication is handled by Supabase.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/podcasting.js"></script></body></html>
