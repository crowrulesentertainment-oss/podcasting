<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In • CrowRules Podcasting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/sitewide.css"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-card"><div class="kicker">ONE ACCOUNT. ONE UNIVERSE.</div><h1 id="authTitle">Welcome back.</h1><p id="authSubtitle">Sign in to your CrowRules account.</p>
<div class="auth-tabs"><button id="loginTab" class="active">Sign In</button><button id="signupTab">Create Account</button></div>
<div class="social-auth">
<button id="googleBtn" class="btn btn-ghost"><span class="social-icon">G</span> Continue with Google</button>
<button id="discordBtn" class="btn btn-ghost"><span class="social-icon">D</span> Continue with Discord</button>
<button id="twitchBtn" class="btn btn-ghost"><span class="social-icon">T</span> Continue with Twitch</button>
</div>
<div class="auth-divider">OR EMAIL</div>
<form id="authForm"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="6" required></label><label id="confirmWrap" class="hidden">Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="6"></label><button class="btn btn-primary wide" id="authSubmit" type="submit">Sign In</button></form>
<button id="resetBtn" class="link-btn">Forgot your password?</button><p id="authMessage" class="form-message"></p><p class="fine-print">Use one CrowRules account across the CrowRules universe. Social authentication is securely handled through Supabase Auth.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/podcasting.js"></script><script src="js/sitewide.js"></script></body></html>
