<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In • CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/sitewide.css"></head><body><main class="auth-shell"><section class="auth-card"><span class="eyebrow">ONE ACCOUNT. ONE UNIVERSE.</span><h1 id="authTitle">Welcome back.</h1><p id="authSubtitle">Sign in to your CrowRules account.</p><div class="tabs"><button id="loginTab" class="active">Sign In</button><button id="signupTab">Create Account</button></div><div class="social-stack"><button id="googleBtn" class="btn ghost">Continue with Google</button><button id="discordBtn" class="btn ghost">Continue with Discord</button><button id="twitchBtn" class="btn ghost">Continue with Twitch</button></div><div class="divider">or email</div><form id="authForm" class="form-stack"><input id="email" class="field" type="email" placeholder="Email address" autocomplete="email" required><input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password" required><button id="submitAuth" class="btn" type="submit">Sign In</button></form><button id="forgotBtn" class="text-btn" style="margin-top:16px">Forgot password?</button><div id="authMessage" class="message"></div><p style="font-size:10px">By continuing, you are using the CrowRules universal account system.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/podcasting.js"></script><script src="js/sitewide.js"></script></body></html>
