<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070d">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Explore CrowRules Podcasting charts, top shows, listener activity, follows and creator momentum.">
  <title>Podcast Rankings & Charts | CrowRules Podcasting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/podcasting.css">
  <style>
    :root{--chart-cyan:#67e8f9;--chart-purple:#a78bfa}
    [hidden]{display:none!important}
    html{scroll-behavior:smooth;scroll-padding-top:100px}
    body{margin:0;background:radial-gradient(ellipse at 8% 0,rgba(103,232,249,.10),transparent 32%),radial-gradient(ellipse at 94% 12%,rgba(167,139,250,.13),transparent 34%),#05070d}
    #app{min-height:100vh}
    #app .shell{width:min(1420px,calc(100% - 36px))}
    #app main{min-height:65vh;padding:20px 0 80px}
    #app .rank-controls .input{background:#080f18;color:#f5f7fb}
    #app button:focus-visible,#app a:focus-visible,#app input:focus-visible,#app select:focus-visible{outline:2px solid var(--chart-cyan);outline-offset:3px}
    #app .rank-spotlight-art,#app .rank-art{object-fit:cover}
    .rank-page-loading{max-width:850px;margin:32px auto;padding:clamp(22px,5vw,44px);border:1px solid rgba(103,232,249,.2);border-radius:20px;background:rgba(10,15,25,.92);box-shadow:0 24px 80px rgba(0,0,0,.25)}
    .rank-page-loading h1{font:800 clamp(24px,4vw,38px) Orbitron,sans-serif;margin:12px 0}
    .rank-page-loading p{color:#91a0b5;font-size:13px;line-height:1.8}
    .rank-page-loading .eyebrow{color:var(--chart-cyan);font:800 10px Orbitron,sans-serif;letter-spacing:.18em}
    .rank-loader{height:4px;overflow:hidden;border-radius:20px;background:#182236;margin:22px 0}
    .rank-loader span{display:block;width:34%;height:100%;background:linear-gradient(90deg,var(--chart-cyan),var(--chart-purple));animation:rank-loading 1.4s ease-in-out infinite}
    .rank-loading-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .rank-loading-actions a,.rank-loading-actions button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 15px;border:1px solid rgba(103,232,249,.25);border-radius:10px;background:rgba(103,232,249,.06);color:#f5f7fb;font:700 11px Montserrat,sans-serif;text-decoration:none;cursor:pointer}
    .rank-loading-actions a:hover,.rank-loading-actions button:hover{border-color:var(--chart-cyan);background:rgba(103,232,249,.12)}
    .rank-load-status{font-size:10px!important;letter-spacing:.08em;text-transform:uppercase}
    @keyframes rank-loading{from{transform:translateX(-120%)}to{transform:translateX(330%)}}
    @media(max-width:800px){#app .shell{width:min(100% - 24px,1420px)}}
    @media(max-width:480px){#app .shell{width:calc(100% - 20px)}#app .card{padding:15px}.rank-loading-actions>*{flex:1}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
  <script>window.CRPage="rankings";</script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script defer src="../js/podcasting.js?v=978d905"></script>
</head>
<body>
  <div id="app">
    <main class="shell">
      <section class="rank-page-loading" id="rankBootStatus" role="status" aria-live="polite">
        <div class="eyebrow">CROWRULES PODCASTING / LIVE CHARTS</div>
        <h1>Loading the charts…</h1>
        <p>Gathering published shows, play counts, listener activity and follows. Chart totals will reflect the data available in the podcast database.</p>
        <div class="rank-loader" aria-hidden="true"><span></span></div>
        <p class="rank-load-status">Connecting to the podcast universe</p>
        <div class="rank-loading-actions">
          <a href="index.html">LISTENER HOME</a>
          <a href="login.html">SIGN IN</a>
        </div>
      </section>
    </main>
  </div>
  <noscript><main class="shell"><section class="rank-page-loading"><h1>JavaScript is required</h1><p>Enable JavaScript to load live podcast rankings.</p><a href="index.html">Return to Listener Home</a></section></main></noscript>
  <script>
    (function(){
      "use strict";
      var finished=false;
      var app=document.getElementById("app");
      function checkPage(){
        if(finished||!app)return;
        var loader=document.getElementById("rankBootStatus");
        if(!loader){finished=true;return}
        if(Date.now()-started<10000)return;
        finished=true;
        loader.setAttribute("role","alert");
        loader.innerHTML='<div class="eyebrow">CROWRULES PODCASTING</div><h1>The charts are taking longer than expected.</h1><p>The rankings script may not have completed, or the database request may be unavailable. You can retry safely or continue browsing while we recover.</p><div class="rank-loading-actions"><button type="button" id="rankRetry">RETRY LOADING</button><a href="index.html">LISTENER HOME</a><a href="../home.html">PODCASTING HOME</a></div><p class="rank-load-status">No ranking data has been fabricated or substituted.</p>';
        var retry=document.getElementById("rankRetry");
        if(retry)retry.addEventListener("click",function(){location.reload()});
      }
      var started=Date.now();
      window.setInterval(checkPage,1000);
    })();
  </script>
</body>
</html>
