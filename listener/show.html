<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070d">
  <meta name="description" content="Explore podcast details, discover published episodes, listen, follow shows and join the conversation on CrowRules Podcasting.">
  <meta name="color-scheme" content="dark">
  <title>Podcast Show | CrowRules Podcasting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/podcasting.css">
  <style>
    :root{--show-cyan:#67e8f9;--show-purple:#a78bfa;--show-pink:#f472b6}
    [hidden]{display:none!important}
    html{scroll-behavior:smooth;scroll-padding-top:100px}
    body{background:radial-gradient(ellipse at 8% 0,rgba(103,232,249,.10),transparent 32%),radial-gradient(ellipse at 94% 12%,rgba(167,139,250,.13),transparent 34%),#05070d}
    #app{min-height:100vh}
    #app main{min-height:65vh}
    #app .shell{width:min(1420px,calc(100% - 36px))}
    #app .card{min-width:0}
    #app .show-hero{padding:clamp(20px,4vw,52px) 0 28px}
    #app .show-copy h1{overflow-wrap:anywhere}
    #app .show-art{max-width:100%;aspect-ratio:1;object-fit:cover;background:#0b1220}
    #app .show-actions{gap:9px}
    #app .show-actions .btn{min-height:42px}
    #app .show-meta{gap:10px 18px;line-height:1.7}
    #app .episode-tools{grid-template-columns:minmax(0,1fr) minmax(150px,220px)}
    #app .episode-tools .input{min-width:0}
    #app .episode-row{min-width:0}
    #app .episode-info b{overflow-wrap:anywhere}
    #app .episode-info small{white-space:normal;line-height:1.5}
    #app .episode-actions .btn{min-width:74px}
    #app #commentForm{margin-top:14px}
    #app #commentBody{min-height:100px;resize:vertical}
    #app #commentForm .btn{width:auto}
    #app a:focus-visible,#app button:focus-visible,#app input:focus-visible,#app select:focus-visible,#app textarea:focus-visible{outline:2px solid var(--show-cyan);outline-offset:3px}
    .show-loading{max-width:800px;margin:36px auto;padding:clamp(22px,5vw,44px);border:1px solid rgba(103,232,249,.2);border-radius:20px;background:rgba(10,15,25,.88)}
    .show-loading h1{font:800 clamp(24px,4vw,38px) Orbitron,sans-serif;margin:12px 0}
    .show-loading p{color:#91a0b5;font-size:13px;line-height:1.8}
    .show-loading .eyebrow{color:var(--show-cyan);font:800 10px Orbitron,sans-serif;letter-spacing:.18em}
    @media(max-width:800px){
      #app .shell{width:min(100% - 24px,1420px)}
      #app .show-hero{grid-template-columns:minmax(0,1fr);gap:20px}
      #app .show-art{width:min(100%,320px);margin:0 auto;grid-row:1}
      #app .episode-tools{grid-template-columns:minmax(0,1fr)}
      #app .episode-row{align-items:flex-start;flex-wrap:wrap}
      #app .episode-info{flex-basis:calc(100% - 56px)}
      #app .episode-actions{width:100%;padding-left:52px;flex-direction:row}
      #app .episode-actions .btn{flex:1}
    }
    @media(max-width:480px){
      #app .shell{width:calc(100% - 20px)}
      #app .card{padding:15px}
      #app .show-actions .btn{flex:1 1 42%}
      #app .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
      #app .episode-number{width:34px;height:34px}
      #app .episode-info{flex-basis:calc(100% - 46px)}
      #app .episode-actions{padding-left:0}
      #app .player.on{left:8px;right:8px;bottom:8px;flex-wrap:wrap}
      #app .player audio{width:100%;flex-basis:100%}
    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script>window.CRPage = "show";</script>
  <script defer src="../js/podcasting.js"></script>
</head>
<body>
  <div id="app">
    <main class="shell">
      <section class="show-loading" role="status" aria-live="polite">
        <div class="eyebrow">CROWRULES PODCASTING</div>
        <h1>Loading the show…</h1>
        <p>Preparing podcast details, the episode library and listener conversation.</p>
      </section>
    </main>
  </div>
  <noscript>
    <main class="shell"><section class="show-loading"><h1>JavaScript is required</h1><p>Enable JavaScript to load podcast details and the episode player.</p></section></main>
  </noscript>
</body>
</html>
