<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070d">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Discover the show, explore its episode library, follow creators, view listening stats and join the conversation on CrowRules Podcasting.">
  <title>Listen to the Show | CrowRules Podcasting</title>
  <meta property="og:site_name" content="CrowRules Podcasting">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Listen to the Show | CrowRules Podcasting">
  <meta property="og:description" content="Explore podcast episodes, creator memberships and conversations on CrowRules Podcasting.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/podcasting.css">
  <style>
    :root{--show-cyan:#67e8f9;--show-purple:#a78bfa;--show-ink:#05070d;--show-panel:rgba(11,16,29,.82);--show-line:rgba(148,163,184,.18)}
    body{background:radial-gradient(ellipse at 50% -18%,rgba(103,232,249,.16),transparent 42%),radial-gradient(ellipse at 100% 30%,rgba(167,139,250,.12),transparent 34%),linear-gradient(180deg,#05070d 0%,#080b14 52%,#05070d 100%);color:#eef5ff}
    #app .topbar{background:rgba(5,7,13,.78);backdrop-filter:blur(18px);border-bottom:1px solid rgba(103,232,249,.12);box-shadow:0 8px 40px rgba(0,0,0,.22)}
    #app .brand b{letter-spacing:.08em}#app .brand span{color:var(--show-cyan)}
    #app .links a{transition:color .2s ease,background .2s ease;border-radius:9px}#app .links a:hover{color:var(--show-cyan);background:rgba(103,232,249,.07)}
    #app .btn{border-radius:10px;letter-spacing:.055em;font-weight:800;transition:transform .2s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease}
    #app .btn:hover{transform:translateY(-2px);border-color:rgba(103,232,249,.55);box-shadow:0 8px 24px rgba(0,0,0,.22)}
    #app .btn.primary{background:linear-gradient(110deg,#67e8f9,#a78bfa);border-color:transparent;color:#080b14;text-shadow:none}
    #app .eyebrow{letter-spacing:.19em;color:#8deeff}
    #app .card{background:linear-gradient(145deg,rgba(13,19,34,.93),rgba(6,9,17,.96));border-color:rgba(148,163,184,.16);box-shadow:0 24px 80px rgba(0,0,0,.24)}
    #app .footer{border-top:1px solid rgba(148,163,184,.12);color:#7f8ca5}
    @media(max-width:800px){#app .topbar{position:relative}}
    @media(hover:none){#app .btn:hover{transform:none;box-shadow:none}}
    [hidden]{display:none!important}
    html{scroll-behavior:smooth;scroll-padding-top:100px}
    body{background:radial-gradient(ellipse at 8% 0,rgba(103,232,249,.10),transparent 32%),radial-gradient(ellipse at 94% 12%,rgba(167,139,250,.13),transparent 34%),#05070d}
    #app{min-height:100vh}
    #app .shell{width:min(1420px,calc(100% - 36px))}
    #app main{min-height:65vh;padding:32px 0 100px}
    #app .card{min-width:0}
    #app a:focus-visible,#app button:focus-visible,#app input:focus-visible,#app select:focus-visible,#app textarea:focus-visible{outline:2px solid var(--show-cyan);outline-offset:3px}
    @media(max-width:800px){#app .shell{width:calc(100% - 24px)}#app .nav{flex-wrap:wrap;padding-top:10px;padding-bottom:10px}#app .links{order:3;flex-basis:100%;justify-content:flex-start}#app .links a{padding:8px}#app main{padding-top:20px}}
    @media(max-width:480px){#app .shell{width:calc(100% - 20px)}#app .card{padding:15px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
<script src="../js/crowpoints.js" defer></script>
  <script defer src="../js/show-page.js?v=show-cinematic-theme-v23"></script>
</head>
<body>
  <div id="app">
    <main class="shell">
      <section class="card" aria-label="Podcast show" aria-busy="true">
        <div class="eyebrow">CROWRULES PODCASTING / SHOW PROFILE</div>
        <h1 style="font-family:Orbitron,sans-serif">Loading your show…</h1>
        <p class="muted">Preparing show details, published episodes, listener statistics and creator memberships.</p>
        <div aria-hidden="true" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:22px 0"><div style="height:76px;border-radius:12px;background:linear-gradient(100deg,#101827,#1a2638,#101827)"></div><div style="height:76px;border-radius:12px;background:linear-gradient(100deg,#101827,#1a2638,#101827)"></div><div style="height:76px;border-radius:12px;background:linear-gradient(100deg,#101827,#1a2638,#101827)"></div></div>
        <p><a href="index.html">← Browse all podcasts</a></p>
      </section>
    </main>
  </div>
  <noscript><main class="shell"><section class="card"><h1>JavaScript is required</h1><p>Enable JavaScript to load podcast details and the episode player.</p></section></main></noscript>
<script src="../js/online-presence.js"></script>
<script src="../js/global-audio-player.js"></script>
</body>
</html>
