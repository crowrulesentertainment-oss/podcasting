<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070812">
<meta name="description" content="View a CrowRules Podcasting member profile and connect with listeners and creators.">
<title>Member Profile | CrowRules Podcasting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="../config.js"></script>
<style>
:root{color-scheme:dark;--bg:#070812;--panel:#101427;--line:rgba(135,151,255,.22);--text:#f5f7ff;--muted:#a0aac3;--cyan:#6de7ff;--purple:#a98bff;--pink:#ff78c8;--good:#70f0ad;--bad:#ff718e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Montserrat,system-ui,sans-serif;background:radial-gradient(ellipse at 8% 0%,rgba(109,231,255,.12),transparent 33%),radial-gradient(ellipse at 96% 7%,rgba(169,139,255,.15),transparent 32%),linear-gradient(180deg,#070812,#0a0d18 60%,#06070d)}a{color:inherit;text-decoration:none}button{font:inherit}.shell{width:min(1050px,calc(100% - 28px));margin:auto}.top{border-bottom:1px solid var(--line);background:rgba(7,8,18,.92);padding:17px 0}.nav{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font:800 11px Orbitron,sans-serif;letter-spacing:.07em;color:var(--cyan)}.nav a:last-child{font-size:10px;font-weight:800;color:#d9e2fa}.hero{padding:35px 0 22px}.eyebrow{font-size:9px;letter-spacing:.22em;color:var(--cyan);font-weight:800}.hero h1{font:800 clamp(26px,4vw,42px)/1.2 Orbitron,sans-serif;margin:10px 0}.hero p{color:var(--muted);font-size:12px;line-height:1.8}.card{border:1px solid var(--line);border-radius:20px;background:rgba(15,18,33,.95);box-shadow:0 24px 70px rgba(0,0,0,.3);overflow:hidden}.cover{height:190px;background:linear-gradient(125deg,rgba(109,231,255,.25),rgba(169,139,255,.32),rgba(255,120,200,.2));background-size:cover;background-position:center;border-bottom:1px solid var(--line)}.body{padding:24px}.identity{display:flex;align-items:flex-end;gap:18px;margin-top:-75px;position:relative}.avatar{display:grid;place-items:center;width:126px;height:126px;flex:none;border-radius:50%;overflow:hidden;border:4px solid #101427;background:linear-gradient(135deg,rgba(109,231,255,.24),rgba(169,139,255,.3));box-shadow:0 0 0 1px rgba(109,231,255,.5);font:800 30px Orbitron,sans-serif}.avatar img{width:100%;height:100%;object-fit:cover}.nameblock{min-width:0;padding-bottom:8px}.name{font:800 clamp(18px,3vw,27px) Orbitron,sans-serif;overflow-wrap:anywhere}.handle{color:var(--cyan);font-size:11px;margin-top:8px;overflow-wrap:anywhere}.role{display:inline-block;margin-top:10px;padding:6px 9px;border:1px solid rgba(169,139,255,.3);border-radius:99px;color:#ddd2ff;background:rgba(169,139,255,.1);font-size:8px;font-weight:800;letter-spacing:.1em}.bio{max-width:780px;margin:20px 0;color:#dbe2f5;font-size:12px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}.stat{padding:14px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025)}.stat strong{display:block;font:700 22px Orbitron,sans-serif}.stat span{display:block;margin-top:6px;color:var(--muted);font-size:8px;font-weight:800;letter-spacing:.08em}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:11px 16px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035);color:var(--text);font-size:10px;font-weight:800;cursor:pointer}.btn.primary{border-color:rgba(109,231,255,.45);background:linear-gradient(100deg,rgba(109,231,255,.14),rgba(169,139,255,.2))}.btn:disabled{opacity:.58;cursor:wait}.status{font-size:10px;color:var(--muted);margin-top:13px;line-height:1.7}.status.good{color:var(--good)}.status.bad{color:#ffb7c5}.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}.toast{position:fixed;right:18px;bottom:18px;width:min(380px,calc(100% - 36px));padding:14px 16px;border:1px solid var(--line);border-radius:13px;background:#11162a;box-shadow:0 24px 70px #0008;font-size:11px;line-height:1.6}.toast.good{border-color:rgba(112,240,173,.4)}.toast.bad{border-color:rgba(255,113,142,.4)}footer{padding:25px 0;color:#77819b;text-align:center;font-size:9px}@media(max-width:560px){.shell{width:calc(100% - 18px)}.hero{padding:24px 0 15px}.cover{height:130px}.body{padding:15px}.identity{align-items:center;flex-direction:column;gap:10px;margin-top:-62px;text-align:center}.avatar{width:112px;height:112px}.nameblock{padding:0}.bio{text-align:center}.stats{gap:6px}.stat{padding:10px 5px}.stat strong{font-size:17px}.stat span{font-size:7px}.actions{display:grid;grid-template-columns:1fr 1fr}.btn{padding:10px 8px;font-size:9px}}
</style>
</head>
<body>
<header class="top"><div class="shell nav"><a class="brand" href="../home.html">CROWRULES / PODCASTING</a><a href="profile.html">MY PROFILE & COMMUNITY</a></div></header>
<main class="shell"><section class="hero"><div class="eyebrow">ONE ACCOUNT. ONE UNIVERSE.</div><h1>MEMBER PROFILE</h1><p>Discover listeners and creators, follow their journey, and send a friend request to connect.</p></section>
<section class="card" id="profileCard" aria-live="polite"><div class="empty">Loading member profile…</div></section><div id="status" class="status" role="status" aria-live="polite"></div></main>
<footer class="shell">CROWRULES PODCASTING · ONE COMPANY. ONE UNIVERSE.</footer><div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const C=window.CROW_CONFIG||{};const $=id=>document.getElementById(id);let db=null,viewer=null,target=null,followed=false,friendship=null;
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=v=>String(v||'CR').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'CR';
function toast(message,kind){const el=$('toast');el.textContent=message;el.className='toast '+(kind||'good');el.hidden=false;setTimeout(()=>{el.hidden=true},4000)}
function setStatus(message,kind){$('status').textContent=message||'';$('status').className='status '+(kind||'')}
function avatarHtml(url,name){return url&&/^https?:\/\//i.test(url)?'<img src="'+esc(url)+'" alt="Profile avatar" referrerpolicy="no-referrer" onerror="this.remove()">':esc(initials(name))}
function getFriendLabel(){if(!friendship)return '＋ SEND FRIEND REQUEST';if(friendship.status==='accepted')return '✓ FRIENDS';if(friendship.requester_id===viewer.id)return 'REQUEST SENT';return 'RESPOND TO REQUEST'}
function render(){
const name=target.display_name||target.username||'CrowRules Member',handle=target.username?'@'+target.username:'CrowRules Member',bio=target.bio||target.tagline||'This member has not added a bio yet.',role=target.role||'Listener',avatar=target.avatar_url||'',cover=target.cover_url||'';
$('profileCard').innerHTML='<div class="cover" style="'+(cover&&/^https?:\/\//i.test(cover)?'background-image:url(&quot;'+esc(cover)+'&quot;)':'')+'"></div><div class="body"><div class="identity"><div class="avatar">'+avatarHtml(avatar,name)+'</div><div class="nameblock"><div class="name">'+esc(name)+'</div><div class="handle">'+esc(handle)+'</div><span class="role">'+esc(String(role).toUpperCase())+'</span></div></div><p class="bio">'+esc(bio)+'</p><div class="stats"><div class="stat"><strong id="followers">—</strong><span>FOLLOWERS</span></div><div class="stat"><strong id="following">—</strong><span>FOLLOWING</span></div><div class="stat"><strong>'+(target.created_at?esc(new Date(target.created_at).getFullYear()):'—')+'</strong><span>MEMBER SINCE</span></div></div><div class="actions" id="actions"></div></div>';
const actions=$('actions');
if(!viewer){actions.innerHTML='<a class="btn primary" href="../login.html?redirect='+encodeURIComponent('listener/member-profile.html?user='+target.user_id)+'">SIGN IN TO CONNECT</a>';setStatus('Sign in to follow this member or send a friend request.');return}
if(viewer.id===target.user_id){actions.innerHTML='<a class="btn primary" href="profile.html">EDIT MY PROFILE</a>';setStatus('This is your public profile.');return}
const follow=document.createElement('button');follow.className='btn primary';follow.textContent=followed?'✓ FOLLOWING':'＋ FOLLOW';follow.addEventListener('click',toggleFollow);
const friend=document.createElement('button');friend.className='btn';friend.textContent=getFriendLabel();friend.disabled=!!friendship;friend.addEventListener('click',sendFriendRequest);
actions.append(follow,friend);if(friendship&&friendship.status==='pending'&&friendship.addressee_id===viewer.id){friend.disabled=false;friend.textContent='ACCEPT FRIEND REQUEST';friend.addEventListener('click',acceptRequest);}
if(friendship&&friendship.status==='pending'&&friendship.addressee_id===viewer.id){const decline=document.createElement('button');decline.className='btn';decline.textContent='DECLINE REQUEST';decline.addEventListener('click',()=>respondRequest('rejected',decline));actions.appendChild(decline)}
setStatus(friendship&&friendship.status==='accepted'?'You are friends.':friendship&&friendship.status==='pending'?(friendship.requester_id===viewer.id?'Friend request pending.':'This member sent you a friend request.'):'Connect with this member using the buttons above.');
}
async function refreshConnections(){
if(!viewer||!target||viewer.id===target.user_id){render();return}
const [f,fr]=await Promise.all([
db.from('podcast_member_follows').select('follower_user_id,followed_user_id').eq('follower_user_id',viewer.id).eq('followed_user_id',target.user_id).maybeSingle(),
db.from('friendships').select('id,requester_id,addressee_id,status,created_at').or('and(requester_id.eq.'+viewer.id+',addressee_id.eq.'+target.user_id+'),and(requester_id.eq.'+target.user_id+',addressee_id.eq.'+viewer.id+')').limit(1)
]);
if(f.error)console.warn('Follow state unavailable:',f.error.message);followed=!!f.data;
if(fr.error)console.warn('Friendship state unavailable:',fr.error.message);friendship=(fr.data||[])[0]||null;
render();
}
async function toggleFollow(e){const b=e.currentTarget;b.disabled=true;try{if(followed){const r=await db.from('podcast_member_follows').delete().eq('follower_user_id',viewer.id).eq('followed_user_id',target.user_id);if(r.error)throw r.error;followed=false;toast('You unfollowed this member.')}else{const r=await db.from('podcast_member_follows').insert({follower_user_id:viewer.id,followed_user_id:target.user_id});if(r.error&&r.error.code!=='23505')throw r.error;followed=true;toast('You are now following this member.')}await refreshConnections();await loadStats()}catch(err){console.error(err);toast('Follow update failed: '+(err.message||'Please try again.'),'bad')}finally{b.disabled=false}}
async function sendFriendRequest(e){const b=e.currentTarget;b.disabled=true;try{const r=await db.from('friendships').insert({requester_id:viewer.id,addressee_id:target.user_id,status:'pending'});if(r.error)throw r.error;toast('Friend request sent.');await refreshConnections()}catch(err){console.error(err);toast('Could not send friend request: '+(err.message||'Please try again.'),'bad');b.disabled=false}}
async function respondRequest(status,b){b.disabled=true;try{const r=await db.from('friendships').update({status}).eq('id',friendship.id).eq('addressee_id',viewer.id).eq('status','pending').select('id').maybeSingle();if(r.error)throw r.error;if(!r.data)throw new Error('This request has already been handled.');toast(status==='accepted'?'Friend request accepted.':'Friend request declined.');await refreshConnections()}catch(err){console.error(err);toast('Could not update request: '+(err.message||'Please try again.'),'bad');b.disabled=false}}
async function acceptRequest(e){respondRequest('accepted',e.currentTarget)}
async function loadStats(){const [a,b]=await Promise.all([db.from('podcast_member_follows').select('follower_user_id',{count:'exact',head:true}).eq('followed_user_id',target.user_id),db.from('podcast_member_follows').select('followed_user_id',{count:'exact',head:true}).eq('follower_user_id',target.user_id)]);$('followers').textContent=a.error?'—':Number(a.count||0).toLocaleString();$('following').textContent=b.error?'—':Number(b.count||0).toLocaleString()}
async function init(){
if(!C.supabaseUrl||!C.supabaseKey||!window.supabase?.createClient){$('profileCard').innerHTML='<div class="empty">Podcasting configuration is unavailable. Refresh and try again.</div>';return}
const id=new URLSearchParams(location.search).get('user')||new URLSearchParams(location.search).get('id');if(!id){$('profileCard').innerHTML='<div class="empty">No member was selected. Open a profile from the community network.</div>';return}
db=window.supabase.createClient(C.supabaseUrl,C.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
const au=await db.auth.getUser();viewer=au.data&&au.data.user||null;
const p=await db.from('podcast_member_profiles').select('user_id,display_name,username,bio,tagline,avatar_url,cover_url,is_public,created_at').eq('user_id',id).maybeSingle();
if(p.error)console.warn('Profile lookup:',p.error.message);
if(p.data&&p.data.is_public!==false)target=p.data;
if(!target){const m=await db.from('members').select('user_id,display_name,username,bio,avatar_url,role,created_at').eq('user_id',id).maybeSingle();if(m.error)console.warn('Member fallback:',m.error.message);target=m.data?Object.assign({},m.data,{is_public:true}):null}
if(!target){$('profileCard').innerHTML='<div class="empty">This profile is unavailable, private, or no longer exists.</div>';return}
if(viewer&&viewer.id!==target.user_id){await refreshConnections()}else render();
await loadStats();
}
init().catch(e=>{console.error('Member profile failed:',e);$('profileCard').innerHTML='<div class="empty">Could not load this profile. '+esc(e.message||'Please refresh and try again.')+'</div>'});
})();
</script>
</body></html>
