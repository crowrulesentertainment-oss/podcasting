<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050811"><title>Playlist | CrowRules Podcasting</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><style>
:root{--bg:#050811;--panel:#111827;--line:rgba(148,163,184,.2);--muted:#94a3b8;--cyan:#22d3ee;--purple:#a78bfa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 70% 0%,#31215a66,transparent 38%),linear-gradient(#050811,#0a1020 60%,#050811);color:#f8fafc;font-family:Montserrat,Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1100px,calc(100% - 32px));margin:auto}.top{position:sticky;top:0;background:#050811eF;border-bottom:1px solid var(--line);backdrop-filter:blur(15px);z-index:4}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font:800 12px Orbitron;letter-spacing:.1em}.brand span{color:var(--cyan)}.nav a:last-child{font-size:10px;color:var(--muted);font-weight:800}.hero{padding:65px 0 35px}.eyebrow{font:800 9px Orbitron;color:var(--cyan);letter-spacing:.2em}.hero h1{font:900 clamp(36px,7vw,70px)/1.05 Orbitron;margin:14px 0}.hero p{color:var(--muted);font-size:13px;line-height:1.8;max-width:650px}.meta{color:var(--muted);font-size:10px;letter-spacing:.1em}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 15px;border:1px solid var(--line);border-radius:9px;background:#ffffff08;color:#fff;font-size:10px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(100deg,#22d3ee44,#a78bfa44);border-color:#22d3ee66}.list{display:grid;gap:10px;padding:0 0 80px}.track{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:15px;background:#ffffff06}.track img{width:72px;height:72px;border-radius:11px;object-fit:cover;background:#111827}.trackmain{flex:1;min-width:0}.trackmain b{display:block;font-size:13px}.trackmain small{display:block;margin-top:6px;color:var(--muted);font-size:10px}.empty{padding:32px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}.status{min-height:22px;color:var(--muted);font-size:11px;margin:10px 0}@media(max-width:600px){.track{flex-wrap:wrap}.track img{width:58px;height:58px}.trackmain{min-width:calc(100% - 85px)}}
</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="../home.html">CROWRULES <span>PODCASTING</span></a><a href="dashboard.html">← MY LISTENING</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">YOUR PERSONAL COLLECTION</div><h1 id="playlistTitle">LOADING PLAYLIST…</h1><p id="playlistDescription">Your episodes, your listening universe.</p><div class="meta" id="playlistMeta">PRIVATE LISTENING COLLECTION</div><div class="actions"><button class="btn primary" id="playAll" type="button">▶ PLAY FIRST EPISODE</button><a class="btn" href="index.html#discover">DISCOVER MORE</a></div><div class="status" id="status" role="status" aria-live="polite"></div></section><section id="tracks" class="list"><div class="empty">Loading your playlist…</div></section></main>
<script>
(()=>{"use strict";const C=window.CROW_CONFIG||{},S=window.CrowRulesSupabase||(window.supabase?.createClient&&C.supabaseUrl&&C.supabaseKey?window.supabase.createClient(C.supabaseUrl,C.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}}):null);const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),logo=C.logoUrl||"";let tracks=[];
async function init(){if(!S){$("#status").textContent="Playlist service unavailable.";return}const {data:{session}}=await S.auth.getSession();if(!session){location.href="../login.html";return}const id=new URLSearchParams(location.search).get("id");if(!id){$("#status").textContent="No playlist was selected.";return}const p=await S.from("podcast_playlists").select("id,name,description,is_public,created_at").eq("id",id).eq("user_id",session.user.id).maybeSingle();if(p.error||!p.data){$("#status").textContent="This playlist could not be found or is not available to your account.";return}$("#playlistTitle").textContent=p.data.name;$("#playlistDescription").textContent=p.data.description||"Your personal episode collection.";$("#playlistMeta").textContent=(p.data.is_public?"PUBLIC":"PRIVATE")+" · CREATED "+new Date(p.data.created_at).toLocaleDateString();const items=await S.from("podcast_playlist_items").select("id,episode_id,position").eq("playlist_id",id).order("position",{ascending:true});if(items.error){$("#tracks").innerHTML='<div class="empty">Could not load playlist episodes.</div>';return}if(!items.data?.length){$("#tracks").innerHTML='<div class="empty">This playlist is empty. Save episodes from your favorite shows and add them to a collection when the playlist editor is available.</div>';return}const ep=await S.from("podcast_episodes").select("id,title,thumbnail_url,artwork_url,audio_url,video_url,duration_seconds,podcast_id").in("id",items.data.map(x=>x.episode_id));if(ep.error){$("#tracks").innerHTML='<div class="empty">Episode details are temporarily unavailable.</div>';return}const pods=await S.from("podcasts").select("id,title,artwork_url").in("id",[...new Set(ep.data.map(x=>x.podcast_id).filter(Boolean))]);const pm=new Map((pods.data||[]).map(x=>[x.id,x]));const em=new Map(ep.data.map(x=>[x.id,x]));tracks=items.data.filter(x=>em.has(x.episode_id)).map(x=>({item:x,episode:em.get(x.episode_id),podcast:pm.get(em.get(x.episode_id).podcast_id)||{}}));$("#tracks").innerHTML=tracks.map((t,i)=>'<article class="track"><img src="'+esc(t.episode.thumbnail_url||t.episode.artwork_url||t.podcast.artwork_url||logo)+'" alt=""><span class="trackmain"><b>'+esc(t.episode.title)+'</b><small>'+esc(t.podcast.title||"CrowRules Podcasting")+' · '+(t.episode.duration_seconds?Math.round(t.episode.duration_seconds/60)+" min":"Episode")+'</small></span><button class="btn primary" data-play="'+i+'" type="button">▶ PLAY</button><button class="btn" data-remove="'+esc(t.item.id)+'" type="button">REMOVE</button></article>').join("");$("#tracks").querySelectorAll("[data-play]").forEach(b=>b.addEventListener("click",()=>play(Number(b.dataset.play))));$("#tracks").querySelectorAll("[data-remove]").forEach(b=>b.addEventListener("click",async()=>{b.disabled=true;const {error}=await S.from("podcast_playlist_items").delete().eq("id",b.dataset.remove);if(error){b.disabled=false;$("#status").textContent="Could not remove this episode.";return}init()}));}
function play(i){const t=tracks[i],player=window.CROWRulesAudioPlayer;if(!t?.episode.audio_url||!player?.play){$("#status").textContent="The audio player is not ready or this episode has no audio.";return}player.play({url:t.episode.audio_url,title:t.episode.title,artist:t.podcast.title||"CrowRules Podcasting",artwork:t.episode.thumbnail_url||t.episode.artwork_url||t.podcast.artwork_url||logo,episodeId:t.episode.id,podcastId:t.episode.podcast_id},{autoplay:true})}
$("#playAll").addEventListener("click",()=>play(0));init();
})();
</script><script src="../js/global-audio-player.js"></script><script src="../js/sitewide.js" defer></script><script src="../js/theme-system.js" defer></script></body></html>
