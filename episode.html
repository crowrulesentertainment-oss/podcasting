<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Episode | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script><link rel="stylesheet" href="css/podcasting-v8.css?v=20261007-v8.0.0"><script src="js/podcasting-v8.js?v=20261007-v8.0.0" defer></script></head><body><div id="cr-app" data-cr-shell="crowrules-podcasting-sitewide-v7"></div><main class="page"><div id="episode" class="form-wrap"></div></main><div id="cr-player" data-cr-player="crowrules-podcasting-sitewide-v7"></div><script>
window.addEventListener('DOMContentLoaded',async()=>{const sb=window.CROW_PODCASTING,id=new URLSearchParams(location.search).get('id'),root=document.querySelector('#episode');if(!id){root.innerHTML='<div class="panel">Episode not found.</div>';return}const{data:e}=await sb.from('podcast_episodes').select('*,podcasts(id,title,artwork_url)').eq('id',id).maybeSingle();if(!e){root.innerHTML='<div class="panel">Episode not found.</div>';return}root.innerHTML='<img style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px" src="'+(e.thumbnail_url||e.podcasts?.artwork_url||'')+'" alt=""><span class="eyebrow">S'+(e.season_number||1)+' • E'+(e.episode_number||'')+'</span><h1 class="dash-title">'+e.title+'</h1><p class="hero-copy">'+(e.description||'')+'</p><div class="meta">'+Number(e.play_count||0).toLocaleString()+' PLAYS'+(e.published_at?' • '+new Date(e.published_at).toLocaleDateString():'')+'</div><div style="margin-top:22px"><button id="play" class="btn primary">PLAY EPISODE</button> <button id="queue" class="btn" type="button">ADD TO QUEUE</button> <button id="next" class="btn" type="button">PLAY NEXT</button> <a class="btn" href="show.html?id='+e.podcast_id+'">BACK TO SHOW</a></div>'+(e.show_notes?'<section><h2>Show notes</h2><div class="panel">'+e.show_notes+'</div></section>':'');document.querySelector('#play')?.addEventListener('click',()=>e.audio_url&&window.CrowPlayer.play({id:e.id,audio_url:e.audio_url,title:e.title,podcast_title:e.podcasts?.title,artwork_url:e.thumbnail_url||e.podcasts?.artwork_url}));const related=document.createElement('section');related.id='moreLikeThis';related.innerHTML='<div class="section-head"><div><span class="eyebrow">V9 ADAPTIVE DISCOVERY</span><h2>More Like This</h2></div></div><div id="moreLikeThisGrid" class="v9-shelf"></div>';root.parentNode.appendChild(related);try{const p=await window.CrowListener?.profile();const rows=await window.CrowListener?.moreLikeThis(p,e.id)||[];const grid=related.querySelector('#moreLikeThisGrid');const card=x=>{const art=x.thumbnail_url||x.podcasts?.artwork_url||'';return '<article class="v9-card"><div class="v9-art">'+(art?'<img src="'+art.replace(/"/g,'&quot;')+'" alt="" loading="lazy">':'CR')+'</div><div class="v9-body"><strong>'+String(x.title).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</strong><small>'+String(x.podcasts?.title||'CrowRules Podcasting')+'</small><div class="v9-actions"><button data-ml-play="'+x.id+'">PLAY</button><a href="episode.html?id='+encodeURIComponent(x.id)+'">DETAILS</a></div></div></article>'};grid.innerHTML=rows.length?rows.map(card).join(''):'<div class="v9-empty">Keep listening and CrowRules will build similar recommendations here.</div>';grid.querySelectorAll('[data-ml-play]').forEach(b=>b.onclick=()=>{const x=rows.find(v=>v.id===b.dataset.mlPlay);if(x)window.CrowPlayer.play({id:x.id,podcast_id:x.podcast_id,title:x.title,audio_url:x.audio_url,duration_seconds:x.duration_seconds,podcast_title:x.podcasts?.title,category:x.podcasts?.category,artwork_url:x.thumbnail_url||x.podcasts?.artwork_url})})}catch(_){};});
document.querySelector('#queue')?.addEventListener('click',async()=>{if(window.CrowPlayer){const ok=await window.CrowPlayer.addToQueue({id:e.id,audio_url:e.audio_url,title:e.title,podcast_title:e.podcasts?.title,artwork_url:e.thumbnail_url||e.podcasts?.artwork_url||''});document.querySelector('#queue').textContent=ok?'QUEUED':'SIGN IN TO QUEUE'}});document.querySelector('#next')?.addEventListener('click',async()=>{if(window.CrowPlayer){const ok=await window.CrowPlayer.playNext({id:e.id,audio_url:e.audio_url,title:e.title,podcast_title:e.podcasts?.title,artwork_url:e.thumbnail_url||e.podcasts?.artwork_url||''});document.querySelector('#next').textContent=ok?'PLAY NEXT ADDED':'SIGN IN TO QUEUE'}});</script></body></html>
