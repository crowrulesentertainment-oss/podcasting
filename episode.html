.episode-layout{display:grid;grid-template-columns:minmax(260px,390px) 1fr;gap:38px;align-items:start}.cover{aspect-ratio:1/1;border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,#16162c,#07070d);box-shadow:0 25px 80px rgba(0,0,0,.35)}.cover img{width:100%;height:100%;object-fit:cover}.cover-fallback{height:100%;display:grid;place-items:center;font:700 90px Orbitron;opacity:.25}
.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}.episode-title{font-size:clamp(34px,5vw,68px);line-height:1.02;margin:10px 0 18px}.episode-description{color:var(--muted);line-height:1.8;max-width:800px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chip{border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:8px 11px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.player{margin-top:25px;padding:18px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:var(--ep-card)}audio{width:100%}.video{margin-top:18px;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000}.video iframe,.video video{width:100%;height:100%;border:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:38px 0 80px}.panel{padding:25px;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:var(--ep-card)}.panel h2{margin-top:0}.panel-body{white-space:pre-wrap;color:var(--muted);line-height:1.8;font-size:13px}.related{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.related-card{padding:18px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(10,10,20,.7);text-decoration:none;color:inherit}.related-card h3{font-size:15px;line-height:1.4}.related-card p{color:var(--muted);font-size:11px}.notice{padding:70px 20px;text-align:center;color:var(--muted)}.hidden{display:none!important}
@media(max-width:900px){.episode-layout{grid-template-columns:1fr}.cover{max-width:520px;margin:auto}.content-grid,.related{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.episode-hero{padding-top:30px}.content-grid,.related{grid-template-columns:1fr}.episode-title{font-size:38px}}
</style>

<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search),slug=params.get("slug"),id=params.get("id");
let db,episode,user=null,lastSkipAt=0,completionTracked=false;
async function track(event_name,metadata={}){try{await db.from("analytics_events").insert({user_id:user?.id||null,event_name,property:"episode",page_url:location.href,content_id:episode?.id||null,content_type:"episode",watch_seconds:Math.floor(document.querySelector("audio")?.currentTime||0),duration_seconds:episode?.duration_seconds||null,metadata})}catch(err){console.debug("analytics event skipped",err)}}
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const date=v=>v?new Date(v).toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"}):"";
const dur=s=>{s=Number(s||0);if(!s)return"";const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h?h+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"):m+":"+String(sec).padStart(2,"0")};
function yt(v){try{const u=new URL(v);if(u.hostname.includes("youtu.be"))return u.pathname.slice(1);if(u.hostname.includes("youtube.com"))return u.searchParams.get("v")||u.pathname.split("/").pop();}catch{}return null}
function mediaUrl(v){const x=yt(v);return x?"https://img.youtube.com/vi/"+encodeURIComponent(x)+"/hqdefault.jpg":v}
function youtubeEmbed(v){const x=yt(v);return x?"https://www.youtube.com/embed/"+encodeURIComponent(x)+"?rel=0&modestbranding=1&enablejsapi=1&origin="+encodeURIComponent(location.origin):null}
function share(){if(navigator.share)navigator.share({title:episode.title,url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(location.href).then(()=>alert("Episode link copied."))}
let playRecorded=false;
async function recordPlay(){
 if(playRecorded||!episode?.id||!db)return;
 playRecorded=true;
 const r=await db.rpc("increment_podcast_episode_play",{p_episode_id:episode.id});
 if(r.error){console.warn("Play count update failed:",r.error);playRecorded=false;return}
 const count=Number(r.data||0);
 document.querySelectorAll("[data-play-count]").forEach(el=>el.textContent=count.toLocaleString());
}
function watchNativeMedia(){
 document.querySelectorAll("audio,video").forEach(media=>{
  media.addEventListener("play",()=>{recordPlay();track("podcast_play",{source:"native_media"})},{once:true});
  media.addEventListener("seeking",()=>{const now=Date.now();if(now-lastSkipAt>4000){lastSkipAt=now;track("podcast_skip",{position_seconds:Math.floor(media.currentTime)})}});
  media.addEventListener("ended",()=>{if(!completionTracked){completionTracked=true;track("podcast_completion",{completed:true})}});
 });
}
function initYouTubeCounter(embed){
 if(!embed)return;
 window.addEventListener("message",function(event){
  if(event.origin!=="https://www.youtube.com")return;
  try{
   const data=typeof event.data==="string"?JSON.parse(event.data):event.data;
   if(data?.event==="onStateChange" && Number(data.info)===1){recordPlay();track("podcast_play",{source:"youtube"});}
   if(data?.event==="onStateChange" && Number(data.info)===0 && !completionTracked){completionTracked=true;track("podcast_completion",{completed:true,source:"youtube"});}
   if(data?.event==="onStateChange" && Number(data.info)===2)track("podcast_skip",{source:"youtube"});
  }catch{}
 });
}
async function init(){
 try{
  const url=window.CROWRULES_SUPABASE_URL||window.SUPABASE_URL,key=window.CROWRULES_SUPABASE_PUBLISHABLE_KEY||window.SUPABASE_PUBLISHABLE_KEY||window.SUPABASE_ANON_KEY;
  if(!url||!key)throw Error("Supabase configuration missing");
  db=window.CrowRulesData.getClient()
  let q;
  if(id){ q=await db.rpc("get_podcast_episode_for_viewer",{p_episode_id:id}); }
  else if(slug){
   const sr=await db.from("podcast_episodes").select("id").eq("slug",slug).eq("status","published").maybeSingle();
   if(sr.error)throw sr.error;if(!sr.data)throw Error("Episode not found.");
   q=await db.rpc("get_podcast_episode_for_viewer",{p_episode_id:sr.data.id});
  } else throw Error("Episode not found.");
  if(q.error)throw q.error;if(!q.data?.length)throw Error("Episode not found.");
  episode=q.data[0];
  const ur=await window.CrowRulesData.getUser().then(user => ({data:{user}}));user=ur.data?.user||null;
  const p=await db.from("podcasts").select("id,title,slug,artwork_url,description,website_url").eq("id",episode.podcast_id).maybeSingle();
  if(p.error)throw p.error;
  const podcast=p.data||{};\n  const premiumLocked=episode.access_level==="premium" && !episode.has_premium_access;
  const related=await db.from("podcast_episodes").select("id,title,slug,episode_number,season_number,published_at,play_count,thumbnail_url").eq("podcast_id",episode.podcast_id).eq("status","published").neq("id",episode.id).order("published_at",{ascending:false}).limit(3);
  const art=mediaUrl(episode.thumbnail_url)||podcast.artwork_url;
  const embed=youtubeEmbed(episode.video_url);
  const audio=premiumLocked?'<div class="player"><div class="eyebrow">PREMIUM EPISODE</div><p>This episode is available to eligible CrowRules members.</p><div class="actions"><a class="btn primary" href="support.html">View Memberships</a></div></div>':(episode.audio_url?'<div class="player"><div class="eyebrow">AUDIO PLAYER</div><audio controls preload="metadata" src="'+esc(episode.audio_url)+'"></audio></div>':"");
  const video=episode.video_url?(embed?'<div class="video"><iframe src="'+esc(embed)+'" title="'+esc(episode.title)+'" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen></iframe></div>':'<div class="video"><video controls preload="metadata" src="'+esc(episode.video_url)+'"></video></div>'):"";
  $("app").innerHTML='<div class="episode-layout"><div><div class="cover">'+(art?'<img src="'+esc(art)+'" alt="'+esc(episode.title)+' cover art">':'<div class="cover-fallback">CR</div>')+'</div></div><div><div class="eyebrow">'+esc(podcast.title||"CrowRules Podcasting")+'</div><h1 class="episode-title">'+esc(episode.title)+'</h1><div class="chips"><span class="chip">S'+esc(episode.season_number||1)+' · E'+esc(episode.episode_number||"—")+'</span>'+(episode.duration_seconds?'<span class="chip">'+dur(episode.duration_seconds)+'</span>':"")+'<span class="chip"><span data-play-count>'+Number(episode.play_count||0).toLocaleString()+'</span> plays</span>'+(episode.is_explicit?'<span class="chip">Explicit</span>':"")+'<span class="chip">'+esc(date(episode.published_at))+'</span></div><p class="episode-description">'+esc(episode.description||"No description yet.")+'</p>'+audio+video+'<div class="actions"><button class="btn primary" id="share">Share Episode</button><button class="btn" id="saveEpisode" data-save-episode="${esc(episode.id)}" type="button">Save</button><button class="btn" id="followPodcast" data-follow-podcast="${esc(podcast.id)}" type="button">Follow</button><a class="btn" href="episodes.html">Browse Episodes</a>'+(podcast.slug?'<a class="btn" href="podcast.html?slug='+encodeURIComponent(podcast.slug)+'">View Podcast</a>':"")+'</div></div></div><div class="content-grid">'+(episode.show_notes?'<section class="panel"><h2>Show Notes</h2><div class="panel-body">'+esc(episode.show_notes)+'</div></section>':"")+(episode.transcript?'<section class="panel"><h2>Transcript</h2><div class="panel-body">'+esc(episode.transcript)+'</div></section>':"")+'</div>'+(related.data?.length?'<section><div class="eyebrow">MORE FROM THIS SHOW</div><div class="related">'+related.data.map(x=>'<a class="related-card" href="episode.html?slug='+encodeURIComponent(x.slug||x.id)+'"><div class="eyebrow">S'+esc(x.season_number||1)+' · E'+esc(x.episode_number||"—")+'</div><h3>'+esc(x.title)+'</h3><p>'+Number(x.play_count||0).toLocaleString()+' plays · '+esc(date(x.published_at))+'</p></a>').join("")+'</div></section>':"");
  $("share").onclick=share;
  watchNativeMedia();
  initYouTubeCounter(embed);
  window.CrowRulesMemberActions?.bind();
  window.CrowRulesMemberActions?.hydrate();
  document.querySelectorAll("audio,video").forEach(media=>{
    let lastSaved=0;
    const saveProgress=()=>{
      if(!user||!episode?.id||!Number.isFinite(media.duration)||media.duration<=0)return;
      const now=Date.now(); if(now-lastSaved<5000)return; lastSaved=now;
      const position=Math.max(0,Math.floor(media.currentTime||0)), duration=Math.max(0,Math.floor(media.duration||episode.duration_seconds||0));
      const percent=Math.min(100,(position/duration)*100), completed=percent>=95;
      db.from("podcast_episode_progress").upsert({user_id:user.id,episode_id:episode.id,position_seconds:position,duration_seconds:duration,percent_complete:percent,last_played_at:new Date().toISOString(),completed},{onConflict:"user_id,episode_id"}).then(r=>{if(r.error)console.debug("progress save skipped",r.error)});
    };
    media.addEventListener("timeupdate",saveProgress);
    media.addEventListener("pause",saveProgress);
    media.addEventListener("ended",saveProgress);
  });
  document.title=episode.title+" | CrowRules Podcasting";
 }catch(e){$("app").innerHTML='<div class="notice"><h1>Episode unavailable</h1><p>'+esc(e.message)+'</p><a class="btn primary" href="episodes.html">Return to Episodes</a></div>'}
}
init();
})();
</script>
<script>
(function(){
 const cfg=window.CROWRULES_CONFIG||{}; if(!cfg.supabaseUrl||!cfg.supabasePublishableKey)return;
 const db = window.CrowRulesData.getClient();
 const params=new URLSearchParams(location.search),episodeId=params.get("id")||params.get("episode_id");
 if(!episodeId)return;
 async function protect(){
  const accessToken=await window.CrowRulesData.getAccessToken();
  if(!accessToken)return;
  const r=await fetch(cfg.supabaseUrl+"/functions/v1/premium-media-url",{method:"POST",headers:{Authorization:"Bearer "+accessToken,"Content-Type":"application/json"},body:JSON.stringify({episode_id:episodeId})});
  if(!r.ok)return;
  const j=await r.json(),media=j.media||[];
  media.forEach(m=>{
   if(!m.signed_url)return;
   const el=document.querySelector(m.media_type==="video"?"video":"audio");
   if(el){el.src=m.signed_url;el.removeAttribute("data-public-url");el.load();}
  });
 }
 protect().catch(()=>{});
})();
</script></body></html>
