<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Episode | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script></head><body><div id="cr-app"></div><main class="page"><div id="episode" class="form-wrap"></div></main><div id="cr-player"></div><script>
window.addEventListener('DOMContentLoaded',async()=>{const sb=window.CROW_PODCASTING,id=new URLSearchParams(location.search).get('id'),root=document.querySelector('#episode');if(!id){root.innerHTML='<div class="panel">Episode not found.</div>';return}const{data:e}=await sb.from('podcast_episodes').select('*,podcasts(id,title,artwork_url)').eq('id',id).maybeSingle();if(!e){root.innerHTML='<div class="panel">Episode not found.</div>';return}root.innerHTML='<img style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px" src="'+(e.thumbnail_url||e.podcasts?.artwork_url||'')+'" alt=""><span class="eyebrow">S'+(e.season_number||1)+' • E'+(e.episode_number||'')+'</span><h1 class="dash-title">'+e.title+'</h1><p class="hero-copy">'+(e.description||'')+'</p><div class="meta">'+Number(e.play_count||0).toLocaleString()+' PLAYS'+(e.published_at?' • '+new Date(e.published_at).toLocaleDateString():'')+'</div><div style="margin-top:22px"><button id="play" class="btn primary">PLAY EPISODE</button> <a class="btn" href="show.html?id='+e.podcast_id+'">BACK TO SHOW</a></div>'+(e.show_notes?'<section><h2>Show notes</h2><div class="panel">'+e.show_notes+'</div></section>':'');document.querySelector('#play')?.addEventListener('click',()=>e.audio_url&&window.CrowPlayer.play({audio_url:e.audio_url,title:e.title,podcast_title:e.podcasts?.title,artwork_url:e.thumbnail_url||e.podcasts?.artwork_url}))});
</script></body></html>
