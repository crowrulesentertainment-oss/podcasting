<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Episode — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main id="episode" class="wrap hero"></main><section class="wrap section"><div class="card"><audio id="audio" controls style="width:100%"></audio></div></section><script>addEventListener("crow:ready",async function(){var id=new URLSearchParams(location.search).get("id"),r=await CROW_APP.query("episodes","*,podcasts(title)",{eq:{id:id}}),e=r.data&&r.data[0];if(!e){episode.innerHTML='<div class="notice">Episode not found.</div>';return}episode.innerHTML='<div class="eyebrow">'+((e.podcasts&&e.podcasts.title)||"PODCAST")+'</div><h1>'+e.title+'</h1><p class="lead">'+(e.description||"")+'</p><a class="btn" href="podcast.html?id='+e.podcast_id+'">View podcast</a>';audio.src=e.audio_url});</script></body></html>
