<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05030a">
<title>Listen | CrowRules Podcasting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="./css/crowrules-cinematic.css">
<style>
:root{--cr-cyan:#00e5ff;--cr-purple:#8b5cf6;--cr-pink:#ff2bd6;--cr-bg:#030308;--cr-panel:rgba(11,10,22,.82);--cr-line:rgba(255,255,255,.09);--cr-text:#f7f7fb;--cr-muted:#9299ae}
body{background:radial-gradient(circle at 20% 0%,rgba(0,229,255,.09),transparent 34%),radial-gradient(circle at 85% 20%,rgba(139,92,246,.12),transparent 38%),var(--cr-bg);color:var(--cr-text)}
.episode-shell{max-width:1180px;margin:auto;padding:50px 18px 150px}.hero{display:grid;grid-template-columns:360px 1fr;gap:38px;align-items:center}.art-wrap{position:relative}.art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:30px;border:1px solid var(--cr-line);box-shadow:0 30px 100px rgba(0,0,0,.5),0 0 70px rgba(139,92,246,.13);background:#090912}.art-ring{position:absolute;inset:-12px;border:1px solid rgba(0,229,255,.16);border-radius:38px;pointer-events:none}.eyebrow{font:800 .68rem Orbitron;letter-spacing:.2em;color:var(--cr-cyan)}h1{font:900 clamp(2.1rem,5vw,5rem)/1 Orbitron;margin:12px 0}.show{color:#c8cbe0;font-weight:700}.description{color:var(--cr-muted);line-height:1.8;max-width:720px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chip{padding:8px 11px;border:1px solid var(--cr-line);border-radius:999px;color:#aeb5c9;font-size:.72rem}
.player{margin-top:28px;padding:22px;border:1px solid var(--cr-line);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015));backdrop-filter:blur(18px)}.player-top{display:flex;align-items:center;justify-content:space-between;gap:15px}.track-status{font:700 .65rem Orbitron;letter-spacing:.13em;color:#777f95}.time{font:700 .72rem Orbitron;color:#8d95aa}.range{width:100%;accent-color:var(--cr-cyan);cursor:pointer}.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0}.ctrl{width:44px;height:44px;border:1px solid var(--cr-line);border-radius:50%;background:#0a0a13;color:#fff;cursor:pointer}.ctrl:hover{border-color:var(--cr-cyan);box-shadow:0 0 22px rgba(0,229,255,.15)}.play{width:58px;height:58px;background:linear-gradient(135deg,var(--cr-cyan),var(--cr-purple));color:#030308;font-weight:900}.player-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.speed,.sleep{background:#080811;color:#d9dbea;border:1px solid var(--cr-line);padding:9px;border-radius:10px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.btnx{border:1px solid var(--cr-line);background:rgba(255,255,255,.04);color:#fff;border-radius:12px;padding:11px 14px;cursor:pointer}.btnx:hover{border-color:var(--cr-cyan)}.section{margin-top:28px;padding:26px;border:1px solid var(--cr-line);border-radius:24px;background:var(--cr-panel)}.section h2{font:800 1rem Orbitron;letter-spacing:.08em}.notes,.transcript{color:#bbc1d2;line-height:1.85}.comment-form{display:grid;gap:10px}.comment-form textarea{min-height:100px;padding:13px;background:#07070e;border:1px solid var(--cr-line);border-radius:13px;color:#fff}.comment{padding:15px 0;border-bottom:1px solid var(--cr-line)}.comment strong{font:800 .72rem Orbitron}.comment small{color:#666e82;margin-left:8px}.comment p{color:#c1c6d5}.toast{position:fixed;right:18px;bottom:105px;z-index:100;padding:13px 16px;border:1px solid rgba(0,229,255,.3);border-radius:12px;background:#080812;box-shadow:0 15px 50px #000;color:#fff}.sticky-mini{position:fixed;left:18px;right:18px;bottom:16px;z-index:80;padding:12px 15px;border:1px solid var(--cr-line);border-radius:18px;background:rgba(5,5,12,.9);backdrop-filter:blur(18px);display:flex;align-items:center;gap:14px;box-shadow:0 20px 70px #000}.mini-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}.mini-progress{height:3px;background:#20202c;position:absolute;left:0;right:0;top:0;border-radius:18px}.mini-progress i{display:block;height:100%;width:0;background:var(--cr-cyan)}@media(max-width:800px){.hero{grid-template-columns:1fr}.art{max-width:420px}.art-wrap{display:flex;justify-content:center}.player-bottom{flex-wrap:wrap}}
</style>
  <link rel="stylesheet" href="css/podcasting-enhanced.css">
</head>
<body data-crowrules-division="podcasting">
<header class="nav"><a class="brand" href="index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header>
<main class="episode-shell">
<section class="hero">
<div class="art-wrap"><img id="art" class="art" alt="Episode artwork"><span class="art-ring"></span></div>
<div>
<div class="eyebrow">CROWRULES PODCASTING · EPISODE</div>
<h1 id="title">Loading episode…</h1>
<div id="podcast" class="show"></div>
<p id="description" class="description"></p>
<div class="chips"><span id="durationChip" class="chip">--:--</span><span class="chip">Independent Audio</span><span class="chip">CrowRules Universe</span></div>
<div class="player">
<div class="player-top"><span id="trackStatus" class="track-status">READY TO LISTEN</span><span id="time" class="time">0:00 / 0:00</span></div>
<input id="seek" class="range" type="range" min="0" max="100" value="0" aria-label="Seek episode">
<div class="controls"><button class="ctrl" id="back" title="Back 15 seconds">↶</button><button class="ctrl play" id="play" title="Play">▶</button><button class="ctrl" id="forward" title="Forward 30 seconds">↷</button></div>
<div class="player-bottom"><select id="speed" class="speed" aria-label="Playback speed"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select><select id="sleep" class="sleep" aria-label="Sleep timer"><option value="0">Sleep timer</option><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60">60 minutes</option></select></div>
</div>
<div class="actions"><a id="showLink" class="btnx" href="podcasts.html">VIEW SHOW</a><button id="saveBtn" class="btnx">♡ SAVE</button><button id="likeBtn" class="btnx">♡ LIKE <span id="likeCount">0</span></button><button id="shareBtn" class="btnx">↗ SHARE</button></div>
</div>
</section>
<section class="section"><h2>SHOW NOTES</h2><div id="notes" class="notes">No show notes yet.</div></section>
<section class="section"><h2>TRANSCRIPT</h2><div id="transcript" class="transcript">Transcript not available.</div></section>
<section class="section"><h2>COMMUNITY</h2><p id="communityStatus" class="description">Loading community…</p><form id="commentForm" class="comment-form"><textarea id="commentBody" maxlength="2000" placeholder="Join the conversation…" required></textarea><button class="btnx" type="submit">POST COMMENT</button></form><div id="comments"></div></section>
</main>
<div class="sticky-mini"><div class="mini-progress"><i id="miniProgress"></i></div><button class="ctrl play" id="miniPlay">▶</button><div id="miniTitle" class="mini-title">CrowRules Podcasting</div><span id="miniTime" class="time">0:00</span></div>
<audio id="audio" preload="metadata"></audio>
<script src="assets/js/app.js"></script>
<script src="js/crowrules-membership.js"></script>
<script src="./js/crowrules-cinematic.js"></script>
<script>
(async()=>{
 const sb=await loadSupabase();const params=new URLSearchParams(location.search);const key=params.get('id')||params.get('episode')||params.get('slug');
 let q=sb.from('podcast_episodes').select('*,podcasts(id,title,slug,artwork_url,creator_id)').limit(1);q=key&&key.match(/^[0-9a-f-]{36}$/i)?q.eq('id',key):q.eq('slug',key||'');
 const {data,error}=await q.maybeSingle();if(error||!data){document.getElementById('title').textContent='Episode not found';return}
 const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
 $('title').textContent=data.title||'Untitled Episode';$('podcast').textContent=data.podcasts?.title?'From '+data.podcasts.title:'';$('description').textContent=data.description||'';$('notes').innerHTML=esc(data.show_notes||'No show notes yet.').replace(/\n/g,'<br>');$('transcript').innerHTML=esc(data.transcript||'Transcript not available.').replace(/\n/g,'<br>');$('art').src=data.thumbnail_url||data.podcasts?.artwork_url||'';document.title=(data.title||'Episode')+' | CrowRules Podcasting';$('miniTitle').textContent=data.title||'CrowRules Podcasting';if(data.podcasts?.slug)$('showLink').href='podcasts.html?podcast='+encodeURIComponent(data.podcasts.slug);
 const audio=$('audio'),play=$('play'),miniPlay=$('miniPlay'),seek=$('seek'),time=$('time'),miniTime=$('miniTime'),status=$('trackStatus');if(data.audio_url)audio.src=data.audio_url;else status.textContent='AUDIO NOT AVAILABLE';
 const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
 function toggle(){if(audio.paused){audio.play().catch(()=>{});play.textContent='❚❚';miniPlay.textContent='❚❚';status.textContent='NOW PLAYING'}else{audio.pause();play.textContent='▶';miniPlay.textContent='▶';status.textContent='PAUSED'}}play.onclick=toggle;miniPlay.onclick=toggle;
 audio.addEventListener('loadedmetadata',()=>{$('durationChip').textContent=fmt(audio.duration);time.textContent='0:00 / '+fmt(audio.duration)});
 audio.addEventListener('timeupdate',()=>{const pct=audio.duration?(audio.currentTime/audio.duration)*100:0;seek.value=pct;time.textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration);miniTime.textContent=fmt(audio.currentTime);$('miniProgress').style.width=pct+'%';});audio.addEventListener('ended',()=>{play.textContent='▶';miniPlay.textContent='▶';status.textContent='PLAYBACK COMPLETE'});seek.oninput=()=>{if(audio.duration)audio.currentTime=(seek.value/100)*audio.duration};$('back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-15);$('forward').onclick=()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+30);$('speed').onchange=e=>audio.playbackRate=Number(e.target.value);
 let sleepTimer=null;$('sleep').onchange=e=>{clearTimeout(sleepTimer);const mins=Number(e.target.value);if(mins){sleepTimer=setTimeout(()=>{audio.pause();play.textContent='▶';miniPlay.textContent='▶';status.textContent='SLEEP TIMER STOPPED PLAYBACK'},mins*60000);toast('Sleep timer set for '+mins+' minutes')}};
 function toast(msg){const n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),2500)}
 $('shareBtn').onclick=async()=>{const share={title:data.title||'CrowRules Podcasting',text:'Listen on CrowRules Podcasting',url:location.href};if(navigator.share){try{await navigator.share(share)}catch(e){}}else{await navigator.clipboard?.writeText(location.href);toast('Episode link copied')}};
 $('saveBtn').onclick=async()=>{const {data:u}=await sb.auth.getUser();if(!u.user){location.href='login.html';return}const r=await sb.from('podcast_saved_episodes').upsert({user_id:u.user.id,episode_id:data.id},{onConflict:'user_id,episode_id'});$('saveBtn').textContent=r.error?'SAVE FAILED':'✓ SAVED';if(!r.error)toast('Episode saved to your library')};
 async function community(){const c=await sb.from('podcast_episode_reactions').select('id',{count:'exact',head:true}).eq('episode_id',data.id);$('likeCount').textContent=String(c.count||0);const cr=await sb.from('podcast_comments').select('id,user_id,body,created_at').eq('episode_id',data.id).eq('is_approved',true).order('created_at',{ascending:false}).limit(50);$('comments').innerHTML=cr.data?.length?cr.data.map(x=>'<div class="comment"><strong>Listener</strong><small>'+new Date(x.created_at).toLocaleDateString()+'</small><p>'+esc(x.body)+'</p></div>').join(''):'<p class="description">No approved comments yet. Start the conversation.</p>';$('communityStatus').textContent=(cr.data?.length||0)+' approved comment'+((cr.data?.length||0)===1?'':'s')}
 $('likeBtn').onclick=async()=>{const {data:u}=await sb.auth.getUser();if(!u.user){location.href='login.html';return}const e=await sb.from('podcast_episode_reactions').select('id').eq('episode_id',data.id).eq('user_id',u.user.id).maybeSingle();if(e.data)await sb.from('podcast_episode_reactions').delete().eq('id',e.data.id);else await sb.from('podcast_episode_reactions').insert({episode_id:data.id,user_id:u.user.id,reaction:'like'});community()};
 $('commentForm').onsubmit=async e=>{e.preventDefault();const {data:u}=await sb.auth.getUser();if(!u.user){location.href='login.html';return}const body=$('commentBody').value.trim();if(!body)return;const r=await sb.from('podcast_comments').insert({episode_id:data.id,user_id:u.user.id,body,is_approved:false});if(r.error)toast(r.error.message);else{$('commentBody').value='';toast('Comment submitted for approval')}};
 community();
})();
</script>
<script src="js/crowrules-invite.js"></script>
<script src="js/crowrules-navigation.js"></script>

<script src="assets/js/crowrules-site-ux.js"></script>
