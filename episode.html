<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05050b">
<title>Episode | CrowRules Podcasting</title>
<link rel="stylesheet" href="css/podcasting.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ep-card:rgba(10,10,20,.86)}
.episode-hero{padding:52px 0 30px}.back{display:inline-flex;gap:8px;margin-bottom:25px;color:var(--muted);text-decoration:none;font-size:11px;text-transform:uppercase;letter-spacing:.12em}.back:hover{color:#fff}
.episode-layout{display:grid;grid-template-columns:minmax(260px,390px) 1fr;gap:38px;align-items:start}.cover{aspect-ratio:1/1;border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,#16162c,#07070d);box-shadow:0 25px 80px rgba(0,0,0,.35)}.cover img{width:100%;height:100%;object-fit:cover}.cover-fallback{height:100%;display:grid;place-items:center;font:700 90px Orbitron;opacity:.25}
.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}.episode-title{font-size:clamp(34px,5vw,68px);line-height:1.02;margin:10px 0 18px}.episode-description{color:var(--muted);line-height:1.8;max-width:800px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chip{border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:8px 11px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.player{margin-top:25px;padding:18px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:var(--ep-card)}audio{width:100%}.video{margin-top:18px;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000}.video iframe,.video video{width:100%;height:100%;border:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:38px 0 80px}.panel{padding:25px;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:var(--ep-card)}.panel h2{margin-top:0}.panel-body{white-space:pre-wrap;color:var(--muted);line-height:1.8;font-size:13px}.related{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.related-card{padding:18px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(10,10,20,.7);text-decoration:none;color:inherit}.related-card h3{font-size:15px;line-height:1.4}.related-card p{color:var(--muted);font-size:11px}.notice{padding:70px 20px;text-align:center;color:var(--muted)}.hidden{display:none!important}
@media(max-width:900px){.episode-layout{grid-template-columns:1fr}.cover{max-width:520px;margin:auto}.content-grid,.related{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.episode-hero{padding-top:30px}.content-grid,.related{grid-template-columns:1fr}.episode-title{font-size:38px}}
</style>
</head>
<body>
<div class="site-background" aria-hidden="true"><div class="background-stars"></div><div class="background-grid"></div><div class="background-glow background-glow-one"></div><div class="background-glow background-glow-two"></div><div class="background-noise"></div></div>
<header class="site-header"><div class="site-header-inner">
<a class="brand" href="home.html"><span class="brand-mark">CR</span><span class="brand-text"><span class="brand-name">CrowRules</span><span class="brand-section">PODCASTING</span></span></a>
<nav class="main-navigation"><a href="home.html">Home</a><a href="podcasts.html">Podcasts</a><a href="episodes.html">Episodes</a><a href="creator-studio.html">Creator Studio</a><a href="admin.html">Admin</a></nav>
</div></header>
<main id="main"><section class="wrap episode-hero"><a class="back" href="episodes.html">← Back to Episodes</a><div id="app"><div class="notice">Loading episode…</div></div></section></main>
<script src="js/config.js"></script>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search),slug=params.get("slug"),id=params.get("id");
let db,episode;
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const date=v=>v?new Date(v).toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"}):"";
const dur=s=>{s=Number(s||0);if(!s)return"";const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h?h+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"):m+":"+String(sec).padStart(2,"0")};
function yt(v){try{const u=new URL(v);if(u.hostname.includes("youtu.be"))return u.pathname.slice(1);if(u.hostname.includes("youtube.com"))return u.searchParams.get("v")||u.pathname.split("/").pop();}catch{}return null}
function mediaUrl(v){const x=yt(v);return x?"https://img.youtube.com/vi/"+encodeURIComponent(x)+"/hqdefault.jpg":v}
function youtubeEmbed(v){const x=yt(v);return x?"https://www.youtube.com/embed/"+encodeURIComponent(x)+"?rel=0&modestbranding=1":null}
function share(){if(navigator.share)navigator.share({title:episode.title,url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(location.href).then(()=>alert("Episode link copied."))}
async function init(){
 try{
  const url=window.CROWRULES_SUPABASE_URL||window.SUPABASE_URL,key=window.CROWRULES_SUPABASE_PUBLISHABLE_KEY||window.SUPABASE_PUBLISHABLE_KEY||window.SUPABASE_ANON_KEY;
  if(!url||!key)throw Error("Supabase configuration missing");
  db=window.supabase.createClient(url,key);
  let q=db.from("podcast_episodes").select("id,podcast_id,title,slug,description,episode_number,season_number,published_at,duration_seconds,audio_url,video_url,thumbnail_url,transcript,show_notes,play_count,is_explicit,status");
  q=slug?q.eq("slug",slug).eq("status","published").maybeSingle():q.eq("id",id).eq("status","published").maybeSingle();
  const r=await q;if(r.error)throw r.error;if(!r.data)throw Error("Episode not found.");
  episode=r.data;
  const p=await db.from("podcasts").select("id,title,slug,artwork_url,description,website_url").eq("id",episode.podcast_id).maybeSingle();
  if(p.error)throw p.error;
  const podcast=p.data||{};
  const related=await db.from("podcast_episodes").select("id,title,slug,episode_number,season_number,published_at,play_count,thumbnail_url").eq("podcast_id",episode.podcast_id).eq("status","published").neq("id",episode.id).order("published_at",{ascending:false}).limit(3);
  const art=mediaUrl(episode.thumbnail_url)||podcast.artwork_url;
  const embed=youtubeEmbed(episode.video_url);
  const audio=episode.audio_url?'<div class="player"><div class="eyebrow">AUDIO PLAYER</div><audio controls preload="metadata" src="'+esc(episode.audio_url)+'"></audio></div>':"";
  const video=episode.video_url?(embed?'<div class="video"><iframe src="'+esc(embed)+'" title="'+esc(episode.title)+'" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen></iframe></div>':'<div class="video"><video controls preload="metadata" src="'+esc(episode.video_url)+'"></video></div>'):"";
  $("app").innerHTML='<div class="episode-layout"><div><div class="cover">'+(art?'<img src="'+esc(art)+'" alt="'+esc(episode.title)+' cover art">':'<div class="cover-fallback">CR</div>')+'</div></div><div><div class="eyebrow">'+esc(podcast.title||"CrowRules Podcasting")+'</div><h1 class="episode-title">'+esc(episode.title)+'</h1><div class="chips"><span class="chip">S'+esc(episode.season_number||1)+' · E'+esc(episode.episode_number||"—")+'</span>'+(episode.duration_seconds?'<span class="chip">'+dur(episode.duration_seconds)+'</span>':"")+'<span class="chip">'+Number(episode.play_count||0).toLocaleString()+' plays</span>'+(episode.is_explicit?'<span class="chip">Explicit</span>':"")+'<span class="chip">'+esc(date(episode.published_at))+'</span></div><p class="episode-description">'+esc(episode.description||"No description yet.")+'</p>'+audio+video+'<div class="actions"><button class="btn primary" id="share">Share Episode</button><a class="btn" href="episodes.html">Browse Episodes</a>'+(podcast.slug?'<a class="btn" href="podcast.html?slug='+encodeURIComponent(podcast.slug)+'">View Podcast</a>':"")+'</div></div></div><div class="content-grid">'+(episode.show_notes?'<section class="panel"><h2>Show Notes</h2><div class="panel-body">'+esc(episode.show_notes)+'</div></section>':"")+(episode.transcript?'<section class="panel"><h2>Transcript</h2><div class="panel-body">'+esc(episode.transcript)+'</div></section>':"")+'</div>'+(related.data?.length?'<section><div class="eyebrow">MORE FROM THIS SHOW</div><div class="related">'+related.data.map(x=>'<a class="related-card" href="episode.html?slug='+encodeURIComponent(x.slug||x.id)+'"><div class="eyebrow">S'+esc(x.season_number||1)+' · E'+esc(x.episode_number||"—")+'</div><h3>'+esc(x.title)+'</h3><p>'+Number(x.play_count||0).toLocaleString()+' plays · '+esc(date(x.published_at))+'</p></a>').join("")+'</div></section>':"");
  $("share").onclick=share;
  document.title=episode.title+" | CrowRules Podcasting";
 }catch(e){$("app").innerHTML='<div class="notice"><h1>Episode unavailable</h1><p>'+esc(e.message)+'</p><a class="btn primary" href="episodes.html">Return to Episodes</a></div>'}
}
init();
})();
</script>
</body></html>
