<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Episode — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main id="episode" class="wrap hero"></main><section class="wrap section"><div class="card"><audio id="audio" controls style="width:100%"></audio><div class="progress" style="margin-top:12px"><i id="bar" style="width:0%"></i></div></div></section><script>const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));addEventListener("crow:ready",async()=>{const id=new URLSearchParams(location.search).get("id"),r=await CROW_APP.query("podcast_episodes","*,podcasts(title,slug,status)",{eq:{id}}),e=r.data?.[0];if(!e||e.podcasts?.status==="draft"){episode.innerHTML='<div class="notice">Episode not found.</div>';return}const feed=CROW_CONFIG.supabaseUrl+"/functions/v1/"+CROW_CONFIG.downloadFunction+"?episode_id="+encodeURIComponent(e.id)+(sessionStorage.crowDownloadSession?"&session="+encodeURIComponent(sessionStorage.crowDownloadSession):"");episode.innerHTML='<div class="eyebrow">'+esc(e.podcasts?.title||"PODCAST")+'</div><h1>'+esc(e.title)+'</h1><p class="lead">'+esc(e.description||"")+'</p><div class="actions"><button class="btn primary" id="playBtn">Play in universal player</button><a class="btn" href="'+feed+'" download>Download episode</a><a class="btn" href="podcast.html?id='+encodeURIComponent(e.podcast_id)+'">View podcast</a></div>';document.getElementById("playBtn").onclick=()=>window.CROW_PLAYER.play(e.audio_url||"",e.title,e.podcasts?.title||"CrowRules",e.id);audio.src=e.audio_url||"";const pr=__CROW_USER?await CROW_SUPABASE.from("podcast_episode_progress").select("*").eq("user_id",__CROW_USER.id).eq("episode_id",id).may
