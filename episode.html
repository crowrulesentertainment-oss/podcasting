<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Episode — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main id="episode" class="wrap hero"></main><section class="wrap section"><div class="card"><audio id="audio" controls style="width:100%"></audio><div class="progress" style="margin-top:12px"><i id="bar" style="width:0%"></i></div></div></section><script>addEventListener("crow:ready",async()=>{const id=new URLSearchParams(location.search).get("id"),r=await CROW_APP.query("podcast_episodes","*,podcasts(title)",{eq:{id}}),e=r.data?.[0];if(!e){episode.innerHTML='<div class="notice">Episode not found.</div>';return}episode.innerHTML='<div class="eyebrow">'+(e.podcasts?.title||"PODCAST")+'</div><h1>'+e.title+'</h1><p class="lead">'+(e.description||"")+'</p><div class="actions"><button class="btn primary" onclick="window.CROW_PLAYER.play(\''+(e.audio_url||"")+'\',\''+e.title.replace(/'/g,"\\'")+'\',\''+(e.podcasts?.title||"CrowRules")+'\',\''+e.id+'\')">Play in universal player</button></div>';audio.src=e.audio_url||"";const pr=__CROW_USER?await CROW_SUPABASE.from("podcast_episode_progress").select("*").eq("user_id",__CROW_USER.id).eq("episode_id",id).maybeSingle():{data:null};if(pr.data&&pr.data.position_seconds)audio.currentTime=pr.data.position_seconds;audio.addEventListener("timeupdate",()=>{bar.style.width=(audio.duration?(audio.currentTime/audio.duration*100):0)+"%";if(__CROW_USER)CROW_APP.saveProgress(id,audio.currentTime,audio.duration)});audio.addEventListener("ended",()=>CROW_APP.recordListen(id,audio.duration,true))});</script></body></html>
