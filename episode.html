<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listen to an Episode | CrowRules Podcasting</title><meta name="description" content="Listen to CrowRules Podcasting episodes, explore show notes, creators, and more."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="./css/crowrules-cinematic.css"><style>.episode-shell{max-width:1050px;margin:auto}.episode-hero{padding:70px 0 30px}.episode-card{padding:32px;border:1px solid rgba(255,255,255,.1);border-radius:28px;background:linear-gradient(145deg,rgba(10,10,22,.94),rgba(29,18,49,.88))}.episode-grid{display:grid;grid-template-columns:220px 1fr;gap:30px}.episode-art{width:100%;aspect-ratio:1;border-radius:20px;object-fit:cover;background:#11112a}.episode-kicker{color:#00e5ff;font:900 .72rem Orbitron;letter-spacing:.16em}.episode-title{font:900 clamp(2rem,5vw,4.2rem)/1 Orbitron;margin:10px 0}.episode-meta,.muted{color:#aeb6cb;line-height:1.8}.player-bar{margin-top:28px;padding:18px;border-radius:18px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08)}audio{width:100%}.episode-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.episode-section{margin:22px 0;padding:25px;border:1px solid rgba(255,255,255,.08);border-radius:22px;background:rgba(255,255,255,.025)}.episode-section h2{font-family:Orbitron}@media(max-width:700px){.episode-grid{grid-template-columns:1fr}.episode-art{max-width:260px}}</style></head><body data-crowrules-division="podcasting"><header class="nav"><a class="brand" href="index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header><main class="episode-shell"><section class="episode-hero"><div class="episode-card"><div class="episode-grid"><div><img id="art" class="episode-art" alt="Episode artwork"></div><div><div class="episode-kicker">NOW PLAYING · CROWRULES PODCASTING</div><h1 id="title" class="episode-title">Loading episode…</h1><p id="podcast" class="episode-meta"></p><p id="description" class="episode-meta"></p><div class="player-bar"><audio id="audio" controls preload="metadata"></audio><div id="playerStatus" class="muted">Preparing your episode.</div></div><div class="episode-actions"><a id="showLink" class="btn" href="podcasts.html">View Show</a><button id="saveBtn" class="btn secondary" type="button">Save Episode</button></div></div></div></div></section><section class="episode-section"><h2>Show Notes</h2><div id="notes" class="muted">No show notes yet.</div></section><section class="episode-section"><h2>Transcript</h2><div id="transcript" class="muted">Transcript not available for this episode.</div></section></main><footer class="footer">CrowRules Podcasting · Listen. Create. Share.</footer><script src="assets/js/app.js"></script><script src="js/crowrules-membership.js"></script><script src="./js/crowrules-cinematic.js"></script><script>
(async()=>{const sb=await loadSupabase();const p=new URLSearchParams(location.search);const key=p.get("id")||p.get("episode")||p.get("slug");let q=sb.from("podcast_episodes").select("*,podcasts(id,title,slug,artwork_url,creator_id)").limit(1);q=key&&key.match(/^[0-9a-f-]{36}$/i)?q.eq("id",key):q.eq("slug",key||"");const {data,error}=await q.maybeSingle();if(error||!data){document.getElementById("title").textContent="Episode not found";document.getElementById("playerStatus").textContent="Open an episode from the podcast library.";return}const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));document.title=(data.title||"Episode")+" | CrowRules Podcasting";document.getElementById("title").textContent=data.title||"Untitled Episode";document.getElementById("podcast").textContent=data.podcasts?.title?"From "+data.podcasts.title:"";document.getElementById("description").textContent=data.description||"";document.getElementById("notes").innerHTML=esc(data.show_notes||"No show notes yet.").replace(/\n/g,"<br>");document.getElementById("transcript").innerHTML=esc(data.transcript||"Transcript not available for this episode.").replace(/\n/g,"<br>");if(data.audio_url)document.getElementById("audio").src=data.audio_url;else document.getElementById("playerStatus").textContent="Audio is not available yet.";document.getElementById("art").src=data.thumbnail_url||data.podcasts?.artwork_url||"";if(data.podcasts?.slug)document.getElementById("showLink").href="podcasts.html?podcast="+encodeURIComponent(data.podcasts.slug);document.getElementById("saveBtn").onclick=async()=>{const {data:u}=await sb.auth.getUser();if(!u.user){location.href="login.html";return}const r=await sb.from("podcast_saved_episodes").upsert({user_id:u.user.id,episode_id:data.id},{onConflict:"user_id,episode_id"});document.getElementById("saveBtn").textContent=r.error?"Unable to save":"Saved ✓"};})();
</script></body></html>
