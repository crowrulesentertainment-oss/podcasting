<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Episode | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script><link rel="stylesheet" href="css/podcasting-v8.css?v=20261007-v8.0.0"><script src="js/podcasting-v8.js?v=20261007-v8.0.0" defer></script></head><body><div id="cr-app" data-cr-shell="crowrules-podcasting-sitewide-v7"></div><main class="page"><div id="episode" class="form-wrap"></div></main><div id="cr-player" data-cr-player="crowrules-podcasting-sitewide-v7"></div><script>
window.addEventListener('DOMContentLoaded',async()=>{const sb=window.CROW_PODCASTING,id=new URLSearchParams(location.search).get('id'),root=document.querySelector('#episode');if(!id){root.innerHTML='<div class="panel">Episode not found.</div>';return}const{data:e}=await sb.from('podcast_episodes').select('*,podcasts(id,title,artwork_url)').eq('id',id).maybeSingle();if(!e){root.innerHTML='<div class="panel">Episode not found.</div>';return}root.innerHTML='<img style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px" src="'+(e.thumbnail_url||e.podcasts?.artwork_url||'')+'" alt=""><span class="eyebrow">S'+(e.season_number||1)+' • E'+(e.episode_number||'')+'</span><h1 class="dash-title">'+e.title+'</h1><p class="hero-copy">'+(e.description||'')+'</p><div class="meta">'+Number(e.play_count||0).toLocaleString()+' PLAYS'+(e.published_at?' • '+new Date(e.published_at).toLocaleDateString():'')+'</div><div style="margin-top:22px"><button id="play" class="btn primary">PLAY EPISODE</button> <button id="queue" class="btn" type="button">ADD TO QUEUE</button> <button id="next" class="btn" type="button">PLAY NEXT</button> <a class="btn" href="show.html?id='+e.podcast_id+'">BACK TO SHOW</a></div>'+(e.show_notes?'<section><h2>Show notes</h2><div class="panel">'+e.show_notes+'</div></section>':'');document.querySelector('#play')?.addEventListener('click',()=>e.audio_url&&window.CrowPlayer.play({id:e.id,audio_url:e.audio_url,title:e.title,podcast_title:e.podcasts?.title,artwork_url:e.thumbnail_url||e.podcasts?.artwork_url}))});
document.querySelector('#queue')?.addEventListener('click',async()=>{if(window.CrowPlayer){const ok=await window.CrowPlayer.addToQueue({id:e.id,audio_url:e.audio_url,title:e.title,podcast_title:e.podcasts?.title,artwork_url:e.thumbnail_url||e.podcasts?.artwork_url||''});document.querySelector('#queue').textContent=ok?'QUEUED':'SIGN IN TO QUEUE'}});document.querySelector('#next')?.addEventListener('click',async()=>{if(window.CrowPlayer){const ok=await window.CrowPlayer.playNext({id:e.id,audio_url:e.audio_url,title:e.title,podcast_title:e.podcasts?.title,artwork_url:e.thumbnail_url||e.podcasts?.artwork_url||''});document.querySelector('#next').textContent=ok?'PLAY NEXT ADDED':'SIGN IN TO QUEUE'}});</script></body></html>
