<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>Creator Achievement Showcase | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>
.wrap{width:min(1100px,92vw);margin:auto;padding:38px 0 70px}.hero,.panel{padding:28px;border:1px solid #26263c;border-radius:22px;background:rgba(12,13,24,.9);margin-top:18px}.ey{color:#55e7ff;font:800 10px Orbitron;letter-spacing:.18em;text-transform:uppercase}h1{margin:9px 0;font:800 clamp(28px,5vw,50px) Orbitron}.desc,.muted{color:#9299b4;font-size:10px;line-height:1.75}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:18px}.card{padding:19px;border:1px solid rgba(255,255,255,.08);border-radius:17px;background:linear-gradient(145deg,rgba(85,231,255,.055),rgba(168,121,255,.045))}.icon{font-size:29px}.title{margin-top:9px;font:800 14px Orbitron}.copy{margin-top:7px;color:#aeb4ca;font-size:10px;line-height:1.7}.date{margin-top:12px;color:#55e7ff;font-size:9px;font-weight:800}.btn{display:inline-flex;padding:10px 13px;border:1px solid #34364e;border-radius:11px;background:rgba(255,255,255,.04);color:#fff;text-decoration:none;font-size:10px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.share-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.empty{padding:18px;border:1px dashed rgba(255,255,255,.1);border-radius:14px;color:#737b96;font-size:10px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="actions"><a class="btn" href="creator-studio.html">Creator Studio</a><a class="btn" id="profile">Creator Profile</a></div><div id="notice"></div><section id="hero" class="hero" hidden></section><section id="achievements" class="panel" hidden></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>
(()=>{const $=x=>document.getElementById(x),db=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),fmt=n=>Number(n||0).toLocaleString(),icons={published_episodes:"🎙️",total_plays:"▶️",unique_listeners:"👥",returning_listeners:"🔁",listening_seconds:"⏱️"};async function boot(){try{const creator=new URLSearchParams(location.search).get("creator");if(!creator)throw Error("Creator showcase link is missing.");const c=await db.from("creators").select("id").eq("id",creator).eq("is_active",true).maybeSingle();if(!c.data)throw Error("Creator not found.");const q=await db.rpc("get_public_creator_achievements",{p_creator_id:creator});if(q.error)throw q.error;const rows=q.data||[];const ids=[...new Set(rows.map(x=>x.podcast_id).filter(Boolean))];let names={};if(ids.length){const p=await db.from("podcasts").select("id,title").in("id",ids);(p.data||[]).forEach(x=>names[x.id]=x.title)}$("profile").href="profile.html";$("hero").innerHTML='<div class="ey">CrowRules Podcasting · Achievement Showcase</div><h1>Creator Achievements</h1><p class="desc">A public showcase of milestones this creator has chosen to share.</p>';$("achievements").innerHTML='<div class="ey">Milestone Archive</div><h2>Achievements Earned</h2><p class="muted">Only achievements marked public are displayed here. Private goals and analytics remain private.</p>'+(rows.length?'<div class="grid">'+rows.map(x=>'<article class="card"><div class="icon">'+(icons[x.goal_type]||"🏆")+'</div><div class="title">'+esc(x.title)+'</div><div class="copy">'+esc(x.description)+'</div><div class="copy"><b>'+fmt(x.achieved_value)+'</b> / '+fmt(x.target_value)+(names[x.podcast_id]?' · '+esc(names[x.podcast_id]):"")+'</div><div class="date">ACHIEVED '+new Date(x.achieved_at).toLocaleDateString()+'</div></article>').join("")+'</div>':'<div class="empty">No public achievements have been shared yet.</div>');$("hero").hidden=$("achievements").hidden=false;if(rows.length){$("achievements").innerHTML+='<div class="share-tools"><button class="btn" id="copyCreatorShare">COPY SHARE TEXT</button><button class="btn" id="nativeCreatorShare">SHARE SHOWCASE</button></div>';document.getElementById("copyCreatorShare").onclick=async()=>{const text="🏆 Check out my CrowRules Podcasting creator achievements! "+location.href;try{await navigator.clipboard.writeText(text);document.getElementById("copyCreatorShare").textContent="COPIED ✓"}catch{window.prompt("Copy your showcase link:",location.href)}};document.getElementById("nativeCreatorShare").onclick=async()=>{if(navigator.share){await navigator.share({title:"CrowRules Podcasting Creator Achievements",text:"🏆 Check out my CrowRules Podcasting creator achievements!",url:location.href})}else{window.prompt("Copy your showcase link:",location.href)}}}}catch(e){$("notice").innerHTML='<div class="panel">'+esc(e.message||"Unable to load creator showcase.")+'</div>'}}boot()})();
</script></body></html>
