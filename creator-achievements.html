(()=>{const $=x=>document.getElementById(x),db=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),fmt=n=>Number(n||0).toLocaleString(),icons={published_episodes:"🎙️",total_plays:"▶️",unique_listeners:"👥",returning_listeners:"🔁",listening_seconds:"⏱️"};async function boot(){try{const params=new URLSearchParams(location.search),creator=params.get("creator"),preview=params.get("preview")==="1";if(!creator)throw Error("Creator showcase link is missing.");if(preview){const u=await db.auth.getUser();if(!u.data.user)throw Error("Preview mode requires creator login.");const m=await db.from("members").select("id").eq("user_id",u.data.user.id).maybeSingle();const own=await db.from("creators").select("id").eq("id",creator).eq("member_id",m.data?.id||"").eq("is_active",true).maybeSingle();if(!own.data)throw Error("Preview access is limited to the creator.");document.querySelector("main").insertAdjacentHTML("afterbegin",'<div class="preview-bar"><div><strong>SHOWCASE PREVIEW MODE</strong><span> Only you can view this preview.</span></div><a href="creator-achievement-manager.html">← Back to Creator Controls</a></div>')}const c=await db.from("creators").select("id").eq("id",creator).eq("is_active",true).maybeSingle();if(!c.data)throw Error("Creator not found.");const q=await db.rpc("get_public_creator_achievements",{p_creator_id:creator});if(q.error)throw q.error;const rows=q.data||[];const settingsQ=preview?await db.rpc("get_my_podcast_creator_showcase_settings"):await db.rpc("get_public_creator_showcase_settings",{p_creator_id:creator});if(settingsQ.error)throw settingsQ.error;const settings=settingsQ.data?.[0]||{};const theme=settings.theme_key||"nebula";document.body.classList.add("theme-"+theme);const showFeatured=settings.show_featured!==false,showNote=settings.show_note!==false,showCollections=settings.show_collections!==false,showArchive=settings.show_archive!==false;const ids=[...new Set(rows.map(x=>x.podcast_id).filter(Boolean))];let names={};if(ids.length){const p=await db.from("podcasts").select("id,title").in("id",ids);(p.data||[]).forEach(x=>names[x.id]=x.title)}$("profile").href="profile.html";const featured=rows.find(x=>x.is_featured);$("hero").innerHTML='<div class="ey">CrowRules Podcasting · Achievement Showcase</div><h1>'+esc(settings.showcase_title||"Creator Achievements")+'</h1><p class="desc">'+esc(settings.showcase_tagline||"A public showcase of milestones this creator has chosen to share.")+'</p>'+(showNote&&settings.showcase_note?'<div class="copy" style="margin-top:12px">'+esc(settings.showcase_note)+'</div>':"")+''+(showFeatured&&featured?'<div class="card" style="margin-top:18px;border-color:rgba(85,231,255,.3);background:linear-gradient(135deg,rgba(85,231,255,.1),rgba(168,121,255,.1))"><div class="ey">Featured Achievement</div><div class="icon">'+(icons[featured.goal_type]||"🏆")+'</div><div class="title">'+esc(featured.title)+'</div><div class="copy">'+esc(featured.description)+'</div><div class="date">ACHIEVED '+new Date(featured.achieved_at).toLocaleDateString()+'</div></div>':'');const collectionKeys=[...new Set(rows.map(x=>x.collection_key||"milestones"))];const collectionNav=collectionKeys.length>1?'<div class="collections">'+collectionKeys.map((k,i)=>'<button class="collection-btn '+(i===0?"active":"")+'" data-collection="'+esc(k)+'">'+esc(k.replace(/[-_]/g," "))+"</button>").join("")+"</div>":"";$("achievements").innerHTML='<div class="ey">Milestone Archive</div><h2>Achievements Earned</h2>'+(showCollections?collectionNav:"")+'<p class="muted">Only achievements marked public are displayed here. Private goals and analytics remain private.</p>'+(showArchive&&rows.length?'<div class="grid">'+rows.map(x=>'<article class="card" data-collection="'+(x.collection_key||"milestones")+'"><div class="icon">'+(icons[x.goal_type]||"🏆")+'</div><div class="title">'+esc(x.title)+'</div><div class="copy">'+esc(x.description)+'</div><div class="copy"><b>'+fmt(x.achieved_value)+'</b> / '+fmt(x.target_value)+(names[x.podcast_id]?' · '+esc(names[x.podcast_id]):"")+'</div><div class="date">ACHIEVED '+new Date(x.achieved_at).toLocaleDateString()+'</div></article>').join("")+'</div>':'<div class="empty">No public achievements have been shared yet.</div>');const custom=[];function addSection(label,text,icon){if(text)custom.push('<section class="custom-section"><div class="ey">'+icon+' '+label+'</div><div class="copy">'+esc(text).replace(/\\n/g,"<br>")+'</div></section>')}if(settings.show_about_creator&&settings.about_creator)addSection("About the Creator",settings.about_creator,"👤");if(settings.show_podcast_highlights&&settings.podcast_highlights)addSection("Podcast Highlights",settings.podcast_highlights,"🎙️");if(settings.show_favorite_episodes&&settings.favorite_episodes)addSection("Favorite Episodes",settings.favorite_episodes,"⭐");if(settings.show_social_links&&settings.social_links){const links=settings.social_links.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean).map(x=>{const safe=/^https?:\\/\\//i.test(x)?x:"";return safe?'<a href="'+esc(safe)+'" target="_blank" rel="noopener">'+esc(safe)+'</a>':esc(x)}).join("");if(links)custom.push('<section class="custom-section"><div class="ey">🔗 Social Links</div><div class="custom-links">'+links+'</div></section>')}if(settings.show_creator_message&&settings.creator_message)addSection("Creator Message",settings.creator_message,"💬");if(settings.show_cta&&settings.cta_label&&/^https?:\\/\\//i.test(settings.cta_url||""))custom.push('<section class="custom-section"><div class="ey">Call-to-Action</div><a class="cta" href="'+esc(settings.cta_url)+'" target="_blank" rel="noopener">'+esc(settings.cta_label)+'</a></section>');const blockMap={hero:'',featured:showFeatured&&featured?$("hero").innerHTML:"",note:showNote&&settings.showcase_note?'<div class="custom-section"><div class="ey">Creator Note</div><div class="copy">'+esc(settings.showcase_note)+'</div></div>':"",about_creator:settings.show_about_creator&&settings.about_creator?custom.find(x=>x.includes("About the Creator"))||"":"",podcast_highlights:settings.show_podcast_highlights&&settings.podcast_highlights?custom.find(x=>x.includes("Podcast Highlights"))||"":"",favorite_episodes:settings.show_favorite_episodes&&settings.favorite_episodes?custom.find(x=>x.includes("Favorite Episodes"))||"":"",social_links:settings.show_social_links&&settings.social_links?custom.find(x=>x.includes("Social Links"))||"":"",creator_message:settings.show_creator_message&&settings.creator_message?custom.find(x=>x.includes("Creator Message"))||"":"",collections:showCollections?collectionNav:"",archive:showArchive&&rows.length?'<div class="grid">'+rows.map(x=>'<article class="card" data-collection="'+(x.collection_key||"milestones")+'"><div class="icon">'+(icons[x.goal_type]||"🏆")+'</div><div class="title">'+esc(x.title)+'</div><div class="copy">'+esc(x.description)+'</div><div class="copy"><b>'+fmt(x.achieved_value)+'</b> / '+fmt(x.target_value)+(names[x.podcast_id]?' · '+esc(names[x.podcast_id]):"")+'</div><div class="date">ACHIEVED '+new Date(x.achieved_at).toLocaleDateString()+'</div></article>').join("")+'</div>':'<div class="empty">No public achievements have been shared yet.</div>',cta:settings.show_cta&&settings.cta_label&&/^https?:\\/\\//i.test(settings.cta_url||"")?'<section class="custom-section"><div class="ey">Call-to-Action</div><a class="cta" href="'+esc(settings.cta_url)+'" target="_blank" rel="noopener">'+esc(settings.cta_label)+'</a></section>':""};const order=(settings.content_block_order||"hero,featured,note,about_creator,podcast_highlights,favorite_episodes,social_links,creator_message,collections,archive,cta").split(",");$("hero").innerHTML=blockMap.hero||$("hero").innerHTML;$("hero").insertAdjacentHTML("afterend",order.filter(k=>k!=="hero").map(k=>blockMap[k]||"").join(""));$("hero").hidden=$("achievements").hidden=false;document.querySelectorAll("[data-collection]").forEach(btn=>btn.onclick=()=>{document.querySelectorAll("[data-collection]").forEach(b=>b.classList.remove("active"));btn.classList.add("active");const key=btn.dataset.collection;document.querySelectorAll("#achievements article.card").forEach(card=>card.style.display=card.dataset.collection===key?"":"none")});if(rows.length){$("achievements").innerHTML+='<div class="share-tools"><button class="btn" id="copyCreatorShare">COPY SHARE TEXT</button><button class="btn" id="nativeCreatorShare">SHARE SHOWCASE</button></div>';document.getElementById("copyCreatorShare").onclick=async()=>{const text="🏆 Check out my CrowRules Podcasting creator achievements! "+location.href;try{await navigator.clipboard.writeText(text);document.getElementById("copyCreatorShare").textContent="COPIED ✓"}catch{window.prompt("Copy your showcase link:",location.href)}};document.getElementById("nativeCreatorShare").onclick=async()=>{if(navigator.share){await navigator.share({title:"CrowRules Podcasting Creator Achievements",text:"🏆 Check out my CrowRules Podcasting creator achievements!",url:location.href})}else{window.prompt("Copy your showcase link:",location.href)}}}}catch(e){$("notice").innerHTML='<div class="panel">'+esc(e.message||"Unable to load creator showcase.")+'</div>'}}boot()})();
