<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>Attestation Verification & Key Audit | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/global-navigation.css">
<style>.wrap{width:min(1180px,94vw);margin:auto;padding:44px 0 90px}.panel{padding:28px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(12,12,24,.92)}.eyebrow{color:#22e6ff;font:800 .7rem Orbitron;letter-spacing:.18em}.panel h1{font:900 clamp(2rem,6vw,4rem) Orbitron}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.actions button{padding:11px 15px;border:0;border-radius:11px;background:linear-gradient(135deg,#22e6ff,#9b5cff);font-weight:900;cursor:pointer}.search{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#090912;color:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px}.card{padding:18px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}.valid{color:#7fffd4}.invalid{color:#ff8b8b}.muted{color:#9da1bd;font-size:.82rem}.mono{font-family:monospace;word-break:break-all}.timeline{margin-top:26px}.event{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.08)}</style></head><body><main class="wrap"><section class="panel"><div class="eyebrow">CROWRULES CHAIN-OF-TRUST 23.0</div><h1>Attestation Verification & Key Audit</h1><p id="auth" class="muted">Checking administrator authorization…</p><div id="app" hidden><div class="actions"><button id="all">VERIFY ALL HISTORICAL ATTESTATIONS</button><button id="active">VERIFY ACTIVE RELEASE</button></div><input id="search" class="search" placeholder="Search release, attestation, reason, or key ID…"><div id="releases" class="grid"></div><div class="timeline"><h2>Verification Audit Timeline</h2><div id="events"></div></div><pre id="result" class="muted"></pre></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/domain-service-loader.js" defer></script>

<script src="js/recommendation-governance.js"></script><script>(async()=>{const g=window.CrowRulesRecommendationGovernance,a=document.querySelector('#auth'),app=document.querySelector('#app'),list=document.querySelector('#releases'),events=document.querySelector('#events'),res=document.querySelector('#result'),search=document.querySelector('#search');await g.init();if(!g.admin){a.textContent=g.user?'Administrator authorization required.':'Sign in with an administrator account.';return}a.textContent='Administrator authorization verified.';app.hidden=false;let releases=[],logs=[];async function load(){const rr=await g.db.from('podcast_recommendation_releases').select('id,model_version,status,created_at,promoted_at,recovery_generation,recovery_quarantined_at').order('created_at',{ascending:false});const aa=await g.db.from('podcast_recommendation_release_attestations').select('id,release_id,key_id,key_version,signing_algorithm,attestation_hash,created_at,authorized_creator_id').order('created_at',{ascending:false});const ee=await g.db.from('podcast_recommendation_attestation_verification_events').select('*').order('created_at',{ascending:false}).limit(200);releases=rr.data||[];const atts=aa.data||[];logs=ee.data||[];list.innerHTML=releases.map(r=>{const x=atts.find(a=>a.release_id===r.id);return `<article class="card" data-text="${JSON.stringify({...r,...x})}"><b>${r.model_version}</b><p>${r.status}</p><p class="muted mono">${r.id}</p><p class="muted">Generation ${r.recovery_generation||0}${r.recovery_quarantined_at?' · QUARANTINED':''}<br>Key ${x?.key_version??'—'} · ${x?.signing_algorithm??'—'}<br>Attestation ${x?.attestation_hash?.slice(0,18)??'—'}…</p><button onclick="verify('${r.id}')">VERIFY RELEASE</button><button onclick="chain('${r.id}')">VERIFY CHAIN</button></article>`}).join('');renderEvents();}function renderEvents(){const q=search.value.toLowerCase();events.innerHTML=logs.filter(e=>JSON.stringify(e).toLowerCase().includes(q)).map(e=>`<div class="event"><span class="${e.valid?'valid':'invalid'}"><b>${e.valid?'VALID':'INVALID'}</b></span> · ${e.action} · ${e.reason||''}<div class="muted mono">${e.release_id||''} · ${new Date(e.created_at).toLocaleString()}</div></div>`).join('')||'<p class="muted">No matching verification events.</p>'}window.verify=async id=>{res.textContent='Verifying release…';const {data,error}=await g.db.rpc('podcast_recommendation_verify_release_23',{p_release_id:id});res.textContent=error?error.message:JSON.stringify(data,null,2);await load()};window.chain=async id=>{res.textContent='Verifying entire lineage…';const {data,error}=await g.db.rpc('podcast_recommendation_verify_entire_chain_23',{p_release_id:id});res.textContent=error?error.message:JSON.stringify(data,null,2);await load()};document.querySelector('#all').onclick=async()=>{res.textContent='Verifying all historical attestations…';const {data,error}=await g.db.rpc('podcast_recommendation_verify_all_attestations_23');res.textContent=error?error.message:JSON.stringify(data,null,2);await load()};document.querySelector('#active').onclick=async()=>{const r=releases.find(x=>x.status==='promoted');if(r)await window.verify(r.id);else res.textContent='No promoted release found.'};search.oninput=renderEvents;await load()})().catch(e=>{document.querySelector('#auth').textContent='Audit console unavailable.';console.error(e)})</script></body></html>
