<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>
(()=>{const $=x=>document.getElementById(x),db=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),fmt=n=>Number(n||0).toLocaleString(),labels={published_episodes:"Published Episodes",total_plays:"Total Plays",unique_listeners:"Unique Listeners",returning_listeners:"Returning Listeners",listening_seconds:"Listening Seconds"},notice=m=>$("notice").innerHTML='<div class="panel">'+esc(m)+'</div>';
async function boot(){try{const id=new URLSearchParams(location.search).get("id");if(!id){location.href="podcast-manager.html";return}$("back").href="podcast-goals.html?id="+encodeURIComponent(id);const u=await db.auth.getUser();if(!u.data.user){location.href="login.html?redirect="+encodeURIComponent("podcast-goal-history.html?id="+id);return}const m=await db.from("members").select("id").eq("user_id",u.data.user.id).maybeSingle();if(!m.data)throw Error("No CrowRules membership profile found.");const c=await db.from("creators").select("id").eq("member_id",m.data.id).eq("is_active",true).maybeSingle();if(!c.data)throw Error("No active creator profile found.");const p=await db.from("podcasts").select("id,title,description").eq("id",id).eq("creator_id",c.data.id).maybeSingle();if(!p.data)throw Error("Podcast not found or you do not own it.");const q=await db.rpc("get_podcast_creator_goal_timeline",{p_podcast_id:id});if(q.error)throw q.error;const rows=q.data||[],groups={};rows.forEach(x=>(groups[x.goal_id]??=[]).push(x));const goals=Object.values(groups),latest=goals.map(g=>g[g.length-1]).filter(Boolean),complete=latest.filter(x=>Number(x.progress_percent)>=100).length,avg=latest.length?latest.reduce((a,x)=>a+Math.min(100,Number(x.progress_percent||0)),0)/latest.length:0;$("hero").innerHTML='<div class="ey">Milestone History & Progress Timeline</div><h1>'+esc(p.data.title)+'</h1><p class="desc">A historical record of how your creator goals have progressed over time.</p><div class="note">Snapshots are creator-owned progress records. Historical entries are not predictions and do not automatically change your goals.</div>';$("stats").innerHTML='<div class="stat"><div class="label">Tracked Goals</div><div class="value">'+fmt(goals.length)+'</div></div><div class="stat"><div class="label">Completed</div><div class="value">'+fmt(complete)+'</div></div><div class="stat"><div class="label">Current Avg</div><div class="value">'+avg.toFixed(1)+'%</div></div><div class="stat"><div class="label">Snapshots</div><div class="value">'+fmt(rows.length)+'</div></div>';$("main").innerHTML='<div class="ey">Creator Journey</div><h2>Progress over time</h2><p class="muted">Each goal is shown as its own timeline so growth can be viewed without collapsing different measurements into one score.</p>'+ (goals.length?goals.map(g=>'<article class="goal"><div class="row"><div><b>'+esc(labels[g[0].goal_type]||g[0].goal_type)+'</b><div class="muted">Target: '+fmt(g[0].target_value)+(g[0].deadline?' · Deadline: '+new Date(g[0].deadline+'T00:00:00').toLocaleDateString():'')+'</div></div><span class="pct">'+Math.min(100,Number(g[g.length-1].progress_percent||0)).toFixed(1)+'%</span></div><div class="timeline">'+g.map(x=>'<div class="point"><div class="date">'+new Date(x.snapshot_date+'T00:00:00').toLocaleDateString()+'</div><div class="muted">'+fmt(x.current_value)+' / '+fmt(x.target_value)+' · '+Number(x.progress_percent||0).toFixed(1)+'% progress</div><div class="bar"><i style="width:'+Math.min(100,Number(x.progress_percent||0))+'%"></i></div></div>').join("")+'</div></article>').join(""):'<div class="empty">No progress snapshots exist yet. Your goal history will appear as snapshots are recorded.</div>')+'<div class="actions"><a class="btn" href="podcast-goals.html?id='+id+'">Goals & Milestones</a><a class="btn" href="creator-action-center.html?id='+id+'">Action Center</a><a class="btn" href="podcast-performance.html?id='+id+'">Performance</a></div>';$("hero").hidden=$("stats").hidden=$("main").hidden=false}catch(e){console.error(e);notice(e.message||"Unable to load milestone history.")}}boot()})();
