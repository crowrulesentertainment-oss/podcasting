<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03040a"><title>Notifications — CrowRules Podcasting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>.notifications{width:min(1050px,92vw);margin:0 auto;padding:55px 0 110px}.notice-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.empty{padding:40px;text-align:center;color:var(--muted)}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px #55e7ff;margin-right:8px}@media(max-width:760px){.notice-grid{grid-template-columns:1fr}}</style>

<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
<link rel="stylesheet" href="css/podcasting.css?v=20261004-2"><link rel="stylesheet" href="css/podcasting.css?v=20261004-3">
<link rel="stylesheet" href="css/podcasting.css?v=20261004-3"><script src="js/config.js?v=20261004-3" defer></script><script src="js/app.js?v=20261004-3" defer></script><script src="js/podcasting-nav-v7.js?v=20261004-3" defer data-podcasting-nav-v7></script><script src="js/site-repair-v1.js?v=20261004-1" defer data-site-repair="v1"></script>



<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script>
</head><body>
<div data-nav data-nav-owner="crowrules-podcasting-nav-v7"></div>


<main class="notifications"><div class="eyebrow">Universal Member Center</div><h1 class="gradient">NOTIFICATIONS</h1><p class="lead">Account, creator, publishing, and platform activity in one place.</p>
<div class="notice-grid"><section class="card"><h2>Account</h2><div id="accountNotice" class="notice"><span class="status-dot"></span>Checking your account…</div></section>
<section class="card"><h2>Creator Activity</h2><div id="creatorNotice" class="notice">Sign in to see creator alerts.</div></section></div>
<section class="card" style="margin-top:18px"><h2>Live Status</h2><div id="status" class="empty">Connecting to CrowRules…</div></section></main>
<script>
(()=>{const set=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t};
async function run(){try{const sb=await (window.CROW_DATA?.ready?.(10000)||window.CROW_SUPABASE_READY);if(!sb)throw Error("Supabase unavailable.");const s=await sb.auth.getSession();const u=s.data?.session?.user||window.__CROW_USER;if(u){set("accountNotice","Your CrowRules Universal account is connected.");set("creatorNotice","Creator alerts are available from the Creator Activity page when a creator profile is linked.");set("status","LIVE • Supabase connected • Signed in as "+(u.email||"Member"));}else{set("accountNotice","You are browsing as a guest.");set("creatorNotice","Sign in to receive creator and account notifications.");set("status","LIVE • Supabase connected • Guest session");}}catch(e){console.error(e);set("status","Connection unavailable. Refresh to retry.");}}
window.addEventListener("crow:ready",run,{once:true});if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run,{once:true});else run();})();
</script></body></html>
