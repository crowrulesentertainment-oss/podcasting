<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | CrowRules Podcasting</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="css/crowrules-cinematic.css"><style>.shell{max-width:1000px;margin:auto;padding:70px 0}.hero{padding:32px;border:1px solid rgba(255,255,255,.1);border-radius:28px;background:linear-gradient(145deg,rgba(10,10,22,.95),rgba(35,17,58,.88));margin-bottom:22px}.k{font:900 .7rem Orbitron;color:#00e5ff;letter-spacing:.16em}.h{font:900 clamp(2rem,5vw,4rem) Orbitron;margin:10px 0}.notice{color:#aeb6cb}.tools{display:flex;gap:10px;justify-content:flex-end;margin:12px 0}.n{display:grid;grid-template-columns:50px 1fr auto;gap:15px;align-items:center;padding:17px;margin:10px 0;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:rgba(255,255,255,.035)}.n.unread{border-color:rgba(0,229,255,.3);box-shadow:0 0 25px rgba(0,229,255,.05)}.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(0,229,255,.08);font-size:1.2rem}.title{font-weight:800}.body,.date{color:#9da5bd;font-size:.8rem;margin-top:4px}.empty{text-align:center;padding:45px;color:#9da5bd;border:1px dashed rgba(255,255,255,.12);border-radius:20px}@media(max-width:650px){.n{grid-template-columns:44px 1fr}.n button{grid-column:2}.shell{width:92%}}</style></head><body data-crowrules-division="podcasting"><header class="nav"><a class="brand" href="index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header><main class="shell"><section class="hero"><div class="k">CROWRULES NOTIFICATIONS</div><h1 class="h">Your Activity Feed</h1><p class="notice">Followers, comments, likes and podcast activity — all in one place.</p></section><div class="tools"><button id="read" class="btn secondary">Mark all read</button></div><div id="list"><div class="empty">Loading notifications…</div></div></main><footer class="footer">CrowRules Podcasting · Listen. Create. Share.</footer><script src="assets/js/app.js"></script><script src="js/crowrules-membership.js"></script><script src="js/crowrules-cinematic.js"></script><script>(async()=>{const sb=await loadSupabase(),list=document.getElementById("list"),read=document.getElementById("read");const {data:u}=await sb.auth.getUser();if(!u.user){location.href="login.html";return}const icon=t=>({follow:"👤",comment:"💬",like:"♥",badge:"🏆",points:"⚡",live:"🔴"}[t]||"🔔");const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));async function load(){const r=await sb.from("podcast_notifications").select("*").eq("user_id",u.user.id).order("created_at",{ascending:false}).limit(100);if(r.error){list.innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}const rows=r.data||[];list.innerHTML=rows.length?rows.map(x=>'<article class="n '+(!x.is_read?'unread':'')+'"><div class="icon">'+icon(x.type)+'</div><div><div class="title">'+esc(x.title)+'</div><div class="body">'+esc(x.body||"")+'</div><div class="date">'+new Date(x.created_at).toLocaleString()+'</div></div>'+(!x.is_read?'<button class="btn secondary" data-id="'+x.id+'">Read</button>':'')+'</article>').join(""):'<div class="empty">You’re all caught up.</div>';document.querySelectorAll("[data-id]").forEach(b=>b.onclick=async()=>{await sb.from("podcast_notifications").update({is_read:true}).eq("id",b.dataset.id).eq("user_id",u.user.id);load()})}read.onclick=async()=>{await sb.from("podcast_notifications").update({is_read:true}).eq("user_id",u.user.id).eq("is_read",false);load()};load()})();</script></body></html>
