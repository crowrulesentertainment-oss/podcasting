<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>.notify-wrap{max-width:1000px;margin:auto;padding:40px 20px}.notify-item{padding:18px;margin:12px 0;border:1px solid #292941;border-radius:14px;background:#10101d}.notify-item.new{border-color:#00e5ff;box-shadow:0 0 18px #00e5ff18}.notify-time{opacity:.65;font-size:12px;margin-top:7px}.notify-type{display:inline-block;margin-left:8px;padding:4px 8px;border:1px solid #292941;border-radius:99px;font-size:11px} .view-btn{border:1px solid #292941;background:#161628;color:inherit;border-radius:8px;padding:8px 12px;cursor:pointer}.view-btn:hover{border-color:#00e5ff}.notify-empty{opacity:.7}</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js"></script><script>const db=supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabaseAnonKey);let user,rows=[],seen=new Set();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const r=await db.auth.getUser();user=r.data.user;if(!user){location.href='login.html?next=notifications.html';return}renderShell();await load();db.channel('cr-notifications').on('postgres_changes',{event:'INSERT',schema:'public',table:'podcast_sponsorship_activity'},()=>load()).subscribe()}async function load(){const d=await db.from('podcast_sponsorship_deals').select('id').eq('creator_user_id',user.id);if(d.error)return showError(d.error.message);const ids=(d.data||[]).map(x=>x.id);if(!ids.length)return render([]);const a=await db.from('podcast_sponsorship_activity').select('id,deal_id,event_type,event_text,created_at').in('deal_id',ids).order('created_at',{ascending:false}).limit(100);if(a.error)return showError(a.error.message);rows=a.data||[];await loadReadState();render(rows)}async function loadReadState(){seen=new Set();const r=await db.from('podcast_sponsorship_notification_reads').select('activity_id').eq('user_id',user.id);(r.data||[]).forEach(x=>seen.add(x.activity_id))}async function markViewed(ids){if(!ids.length)return;await db.from('podcast_sponsorship_notification_reads').upsert(ids.map(activity_id=>({user_id:user.id,activity_id})),{onConflict:'user_id,activity_id'});await loadReadState();render(rows)}function render(data){const unread=data.filter(x=>!seen.has(x.id)).length;document.getElementById('count').textContent=unread?unread+' new':'';document.getElementById('list').innerHTML=data.length?data.map(x=>'<article class="notify-item '+(seen.has(x.id)?'':'new')+'"><b>'+esc(x.event_text)+'</b><span class="notify-type">'+esc(x.event_type.replaceAll('_',' '))+'</span><div class="notify-time">'+new Date(x.created_at).toLocaleString()+'</div><p><button class="view-btn" onclick="markViewed([\''+x.id+'\'])">Mark viewed</button> <a href="creator-deal-room.html">Open Deal Room →</a></p></article>').join(''):'<div class="notify-item"><h2>No notifications yet</h2><p>Your sponsorship activity will appear here as campaigns progress.</p></div>'}async function markRead(){await markViewed(rows.map(x=>x.id))}function renderShell(){document.getElementById('app').innerHTML='<div class="notify-wrap"><p>CROWRULES PODCASTING</p><h1>Notifications</h1><p>Your sponsorship messages, campaign events, deliverable reviews, approvals and revisions.</p><button onclick="markRead()">Mark all as viewed</button> <span id="count"></span><div id="list">Loading…</div></div>'}function showError(m){document.getElementById('list').innerHTML='<p>'+esc(m)+'</p>'}init();</script></body></html>
