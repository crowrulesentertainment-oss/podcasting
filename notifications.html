<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>.notify-wrap{max-width:1000px;margin:auto;padding:40px 20px}.notify-item{padding:18px;margin:12px 0;border:1px solid #292941;border-radius:14px;background:#10101d}.notify-item.new{border-color:#00e5ff;box-shadow:0 0 18px #00e5ff18}.notify-time{opacity:.65;font-size:12px;margin-top:7px}.notify-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notify-actions a,.notify-actions button{font:inherit;text-decoration:none}.notify-type{display:inline-block;margin-left:8px;padding:4px 8px;border:1px solid #292941;border-radius:99px;font-size:11px} .view-btn{border:1px solid #292941;background:#161628;color:inherit;border-radius:8px;padding:8px 12px;cursor:pointer}.view-btn:hover{border-color:#00e5ff}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.filter{border:1px solid #292941;background:#10101d;color:inherit;border-radius:999px;padding:9px 14px;cursor:pointer}.filter.active{border-color:#00e5ff;box-shadow:0 0 12px #00e5ff18}.toast{position:fixed;right:18px;bottom:18px;max-width:360px;padding:14px 16px;border:1px solid #00e5ff;border-radius:12px;background:#10101d;box-shadow:0 0 24px #00e5ff22;z-index:50}.toast button{margin-top:9px}.notify-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.summary-card{border:1px solid #292941;border-radius:12px;padding:14px;background:#0d0d18}.summary-card strong{display:block;font-size:22px}.summary-card span{font-size:11px;opacity:.65}@media(max-width:700px){.notify-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js"></script><script>const db=supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabaseAnonKey);let user,rows=[],seen=new Set(),activeFilter='all',activeDealFilter='all',searchText='',pageSize=100,loadedCount=0,hasMore=false,loadingMore=false,notificationChannel=null,deals=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function showToast(text,dealId){const old=document.getElementById('notifyToast');if(old)old.remove();const el=document.createElement('div');el.id='notifyToast';el.className='toast';el.innerHTML='<b>New CrowRules notification</b><div style="margin-top:6px">'+esc(text)+'</div><button class="view-btn" onclick="openNotificationToast(\''+dealId+'\')">Open Deal Room →</button>';document.body.appendChild(el);setTimeout(()=>el.remove(),9000)} async function openNotificationToast(dealId){const el=document.getElementById('notifyToast');if(el)el.remove();location.href='creator-deal-room.html?deal='+encodeURIComponent(dealId)} async function init(){const r=await db.auth.getUser();user=r.data.user;if(!user){location.href='login.html?next=notifications.html';return}renderShell();await load();notificationChannel=db.channel('cr-notifications').on('postgres_changes',{event:'INSERT',schema:'public',table:'podcast_sponsorship_activity'},async payload=>{const n=payload.new;if(!n?.id||!deals.some(d=>d.id===n.deal_id)||rows.some(x=>x.id===n.id))return;if(n.actor_user_id!==user.id)showToast(n.event_text||'New activity',n.deal_id);rows=[n,...rows];loadedCount=rows.length;if(loadedCount<=pageSize)hasMore=false;await loadReadState();render(rows)}).subscribe();window.addEventListener('beforeunload',()=>{if(notificationChannel)db.removeChannel(notificationChannel)})}async function load(){loadedCount=0;hasMore=false;rows=[];const d=await db.from('podcast_sponsorship_deals').select('id,status,agreed_amount,campaign_start,campaign_end').eq('creator_user_id',user.id);if(d.error)return showError(d.error.message);deals=d.data||[];const ids=deals.map(x=>x.id);if(!ids.length)return render([]);const a=await db.from('podcast_sponsorship_activity').select('id,deal_id,event_type,event_text,created_at').in('deal_id',ids).order('created_at',{ascending:false}).order('id',{ascending:false}).limit(pageSize+1);if(a.error)return showError(a.error.message);const data=a.data||[];hasMore=data.length>pageSize;rows=data.slice(0,pageSize);loadedCount=rows.length;await loadReadState();renderDealOptions();render(rows)}async function loadReadState(){seen=new Set();const r=await db.from('podcast_sponsorship_notification_reads').select('activity_id').eq('user_id',user.id);(r.data||[]).forEach(x=>seen.add(x.activity_id))}async function markViewed(ids){if(!ids.length)return;const r=await db.from('podcast_sponsorship_notification_reads').upsert(ids.map(activity_id=>({user_id:user.id,activity_id})),{onConflict:'user_id,activity_id'});if(r.error){showError(r.error.message);return}await loadReadState();render(rows)}async function loadMore(){if(loadingMore||!hasMore)return;loadingMore=true;const d=await db.from('podcast_sponsorship_deals').select('id').eq('creator_user_id',user.id);const ids=(d.data||[]).map(x=>x.id);if(!ids.length){loadingMore=false;return}const last=rows[rows.length-1];const a=await db.from('podcast_sponsorship_activity').select('id,deal_id,event_type,event_text,created_at').in('deal_id',ids).or('created_at.lt.'+last.created_at+',and(created_at.eq.'+last.created_at+',id.lt.'+last.id+')').order('created_at',{ascending:false}).order('id',{ascending:false}).limit(pageSize+1);if(a.error){showError(a.error.message);loadingMore=false;return}const data=a.data||[];hasMore=data.length>pageSize;rows=rows.concat(data.slice(0,pageSize));loadedCount=rows.length;await loadReadState();loadingMore=false;render(rows)} async function openNotification(id,dealId){await markViewed([id]);location.href='creator-deal-room.html?deal='+encodeURIComponent(dealId)} function renderDealOptions(){const s=document.getElementById('dealFilter');if(!s)return;s.innerHTML='<option value="all">All Sponsorship Deals</option>'+deals.map(d=>'<option value="'+d.id+'">Deal #'+d.id.slice(0,8)+' • '+d.status+'</option>').join('');s.value=activeDealFilter} function setFilter(f){activeFilter=f;render(rows)} function setDealFilter(id){activeDealFilter=id;render(rows)} function setSearch(v){searchText=v.toLowerCase().trim();render(rows)}function matches(x){if(activeDealFilter!=='all'&&x.deal_id!==activeDealFilter)return false;if(searchText&&!((x.event_text||'').toLowerCase().includes(searchText)||(x.event_type||'').toLowerCase().replaceAll('_',' ').includes(searchText)))return false;if(activeFilter==='unread')return !seen.has(x.id);if(activeFilter==='all')return true;if(activeFilter==='messages')return x.event_type==='message_sent';if(activeFilter==='deals')return ['deal_created','deal_acknowledged','deal_completed'].includes(x.event_type);if(activeFilter==='deliverables')return x.event_type.startsWith('deliverable_');if(activeFilter==='approvals')return x.event_type==='deliverable_approved';if(activeFilter==='revisions')return x.event_type==='deliverable_revision_requested';return true}function render(data){const filtered=data.filter(matches),unread=data.filter(x=>!seen.has(x.id)).length,msgs=data.filter(x=>x.event_type==='message_sent').length,deliverables=data.filter(x=>x.event_type.startsWith('deliverable_')).length,approvals=data.filter(x=>x.event_type==='deliverable_approved').length;document.getElementById('count').textContent=unread?unread+' new':'';const summary=document.getElementById('notifySummary');if(summary)summary.innerHTML='<div class="summary-card"><strong>'+unread+'</strong><span>Unread</span></div><div class="summary-card"><strong>'+msgs+'</strong><span>Messages</span></div><div class="summary-card"><strong>'+deliverables+'</strong><span>Deliverable Events</span></div><div class="summary-card"><strong>'+approvals+'</strong><span>Approvals</span></div>';document.title=unread?'('+unread+') Notifications | CrowRules Podcasting':'Notifications | CrowRules Podcasting';document.getElementById('list').innerHTML=filtered.length?filtered.map(x=>'<article class="notify-item '+(seen.has(x.id)?'':'new')+'"><b>'+esc(x.event_text)+'</b><span class="notify-type">'+esc(x.event_type.replaceAll('_',' '))+'</span><div class="notify-time">'+new Date(x.created_at).toLocaleString()+'</div><p><button class="view-btn" onclick="markViewed([\''+x.id+'\'])">Mark viewed</button> <button class="view-btn" onclick="openNotification(\''+x.id+\'\',\''+x.deal_id+\'\')">Open Deal Room →</button></p></article>').join(''):'<div class="notify-item"><h2>No notifications in this filter</h2><p class="notify-empty">Try another notification category.</p></div>';renderDealOptions();document.getElementById('loadMoreWrap').innerHTML=hasMore?'<button class="view-btn" onclick="loadMore()">Load More Notifications</button>':'';const dealSelect=document.getElementById('dealFilter');if(dealSelect)dealSelect.value=activeDealFilter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===activeFilter))}async function markRead(){await markViewed(rows.map(x=>x.id))} function focusUnread(){activeFilter='unread';searchText='';const s=document.getElementById('notificationSearch');if(s)s.value='';render(rows)} async function markFilteredRead(){const ids=rows.filter(matches).filter(x=>!seen.has(x.id)).map(x=>x.id);if(!ids.length)return;await markViewed(ids)}function renderShell(){document.getElementById('app').innerHTML='<div class="notify-wrap"><p>CROWRULES PODCASTING</p><h1>Notifications <span id="count"></span></h1><button class="filter" onclick="focusUnread()">View Unread</button><p>Your sponsorship messages, campaign events, deliverable reviews, approvals and revisions.</p><div id="notifySummary" class="notify-summary"></div><input id="notificationSearch" type="search" placeholder="Search notifications…" oninput="setSearch(this.value)" style="width:100%;padding:12px;border-radius:10px;border:1px solid #292941;background:#0b0b14;color:inherit"><div class="filters"><select id="dealFilter" onchange="setDealFilter(this.value)" class="filter" style="min-width:220px"><option value="all">All Sponsorship Deals</option>'+deals.map(d=>'<option value="'+d.id+'">Deal #'+d.id.slice(0,8)+' • '+d.status+'</option>').join('')+'</select><button class="filter active" data-filter="all" onclick="setFilter(\'all\')">All</button><button class="filter" data-filter="unread" onclick="setFilter(\'unread\')">Unread</button><button class="filter" data-filter="messages" onclick="setFilter(\'messages\')">Messages</button><button class="filter" data-filter="deals" onclick="setFilter(\'deals\')">Deals</button><button class="filter" data-filter="deliverables" onclick="setFilter(\'deliverables\')">Deliverables</button><button class="filter" data-filter="approvals" onclick="setFilter(\'approvals\')">Approvals</button><button class="filter" data-filter="revisions" onclick="setFilter(\'revisions\')">Revisions</button></div><div class="notify-actions"><button class="view-btn" onclick="markFilteredRead()">Mark Filtered as Viewed</button><button class="view-btn" onclick="markRead()">Mark All Loaded as Viewed</button></div> <span class="muted" id="filterStatus"></span><div id="list">Loading…</div><div id="loadMoreWrap" style="text-align:center;margin:22px 0"></div></div>'}function showError(m){document.getElementById('list').innerHTML='<p>'+esc(m)+'</p>'}init();</script></body></html>
