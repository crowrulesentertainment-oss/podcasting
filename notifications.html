<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications • CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting-platform.css?v=6"><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=5" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script><script src="js/podcasting-config.js"></script><script src="js/podcasting-platform.js" defer></script></head><body><main class="cr-shell"><section class="hero"><div><div class="eyebrow">CrowRules Podcasting • V5.9</div><h1>NOTIFICATION<br>CENTER.</h1><p id="count">Loading…</p></div></section><section class="section"><div class="section-head"><h2>Social Notifications</h2><button id="all" class="btn">Mark All Read</button></div><div id="list" class="grid"></div></section></main><script>document.addEventListener('crow:ready',async()=>{const $=id=>document.getElementById(id),E=CrowPodcasting.esc;function target(n){if(n.notification_type==='follow'&&n.actor_id)return'listener-profile.html?user='+encodeURIComponent(n.actor_id);if(n.notification_type==='reaction'&&n.reference_id)return'podcast.html?id='+encodeURIComponent(n.reference_id);if(n.notification_type==='comment'&&n.reference_id)return'podcast.html?id='+encodeURIComponent(n.reference_id);return'community.html'}async function load(){const a=await CrowPodcasting.getSocialNotifications(100);$('count').textContent=a.filter(x=>!x.is_read).length+' unread • '+a.length+' total';$('list').innerHTML=a.map(n=>'<article class="card panel"><span class="badge">'+E(n.notification_type||'social')+'</span><h3>'+E(n.title||'CrowRules Podcasting')+'</h3><p>'+E(n.body||'You have a new social notification.')+'</p><small>'+new Date(n.created_at).toLocaleString()+'</small><div><a class="btn" href="'+target(n)+'">Open</a> '+(!n.is_read?'<button class="btn" data-read="'+E(n.id)+'">Mark Read</button>':'<span class="badge">Read</span>')+'</div></article>').join('')||'<div class="notice">You are all caught up.</div>';document.querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{await CrowPodcasting.markSocialNotificationRead(b.dataset.read);load()})}$('all').onclick=async()=>{const a=await CrowPodcasting.getSocialNotifications(100);for(const n of a.filter(x=>!x.is_read))await CrowPodcasting.markSocialNotificationRead(n.id);load()};await load();await CrowPodcasting.subscribeSocialRealtime({notifications:()=>load()})})</script></body></html>
