<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>.notify-wrap{max-width:1000px;margin:auto;padding:40px 20px}.notify-item{padding:18px;margin:12px 0;border:1px solid #292941;border-radius:14px;background:#10101d}.notify-item.new{border-color:#00e5ff;box-shadow:0 0 18px #00e5ff18}.notify-time{opacity:.65;font-size:12px;margin-top:7px}.notify-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notify-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}.notify-deal{font-size:11px;padding:4px 8px;border:1px solid #292941;border-radius:99px;opacity:.8}.notify-actions a,.notify-actions button{font:inherit;text-decoration:none}.notify-type{display:inline-block;margin-left:8px;padding:4px 8px;border:1px solid #292941;border-radius:99px;font-size:11px} .view-btn{border:1px solid #292941;background:#161628;color:inherit;border-radius:8px;padding:8px 12px;cursor:pointer}.view-btn:hover{border-color:#00e5ff}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.filter{border:1px solid #292941;background:#10101d;color:inherit;border-radius:999px;padding:9px 14px;cursor:pointer}.filter.active{border-color:#00e5ff;box-shadow:0 0 12px #00e5ff18}.toast{position:fixed;right:18px;bottom:18px;max-width:360px;padding:14px 16px;border:1px solid #00e5ff;border-radius:12px;background:#10101d;box-shadow:0 0 24px #00e5ff22;z-index:50}.toast button{margin-top:9px}.connection{display:inline-flex;align-items:center;gap:7px;font-size:12px;opacity:.8;margin:12px 0}.connection-dot{width:8px;height:8px;border-radius:50%;display:inline-block}.notify-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.summary-card{border:1px solid #292941;border-radius:12px;padding:14px;background:#0d0d18}.summary-card strong{display:block;font-size:22px}.summary-card span{font-size:11px;opacity:.65}.hidden{display:none!important}@media(max-width:700px){.notify-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/member-state.js"></script>
<script src="js/member-actions.js"></script><script src="js/app.js"></script><script>const db=supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabaseAnonKey);let user,rows=[],seen=new Set(),activeFilter='all',activeDealFilter='all',searchText='',pageSize=100,loadedCount=0,hasMore=false,loadingMore=false,notificationChannel=null,deals=[],dealLabels={},realtimeState='CONNECTING',prefs={messages_enabled:true,deals_enabled:true,deliverables_enabled:true,approvals_enabled:true,revisions_enabled:true};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function showToast(text,dealId,notificationId){const d=deals.find(x=>x.id===dealId);const label=d?(dealLabels[d.opportunity_id]||('Deal #'+dealId.slice(0,8))):('Deal #'+String(dealId||'').slice(0,8));const old=document.getElementById('notifyToast');if(old)old.remove();const el=document.createElement('div');el.id='notifyToast';el.className='toast';el.innerHTML='<b>New CrowRules notification</b><div style="margin-top:6px">'+esc(label)+'</div><div style="margin-top:6px">'+esc(text)+'</div><button class="view-btn" onclick="openNotificationToast(\''+dealId+'\',\''+notificationId+'\')">View & Mark Viewed →</button>';document.body.appendChild(el);setTimeout(()=>el.remove(),9000)} async function openNotificationToast(dealId,notificationId){const el=document.getElementById('notifyToast');if(el)el.remove();if(notificationId)await markViewed([notificationId]);location.href='creator-deal-room.html?deal='+encodeURIComponent(dealId)} async function applyDeepLink(){const p=new URLSearchParams(location.search),id=p.get('notification'),deal=p.get('deal');if(deal)activeDealFilter=deal;if(!id)return;let target=rows.find(x=>x.id===id);if(!target){const r=await db.from('podcast_sponsorship_activity').select('id,deal_id,event_type,event_text,created_at').eq('id',id).maybeSingle();if(!r.error&&r.data&&deals.some(d=>d.id===r.data.deal_id)){target=r.data;rows=[target,...rows];if(activeDealFilter==='all')activeDealFilter=target.deal_id;render(rows)}}if(target){seen.delete(id);render(rows);setTimeout(()=>{const card=document.querySelector('.notify-item[data-notification-id="'+id+'"]');if(card){card.scrollIntoView({behavior:'smooth',block:'center'});card.style.outline='2px solid #00e5ff';setTimeout(()=>card.style.outline='',2500)}},100)}}async function init(){const r=await db.auth.getUser();user=r.data.user;if(!user){location.href='login.html?next=notifications.html';return}await loadPrefs();renderShell();await load();await applyDeepLink();notificationChannel=db.channel('cr-notifications').on('postgres_changes',{event:'INSERT',schema:'public',table:'podcast_sponsorship_activity'},async payload=>{const n=payload.new;if(!n?.id||!deals.some(d=>d.id===n.deal_id)||rows.some(x=>x.id===n.id)||!categoryEnabled(n.event_type))return;if(n.actor_user_id!==user.id)showToast(n.event_text||'New activity',n.deal_id,n.id);if(n.actor_user_id===user.id){await loadReadState()}rows=[n,...rows];loadedCount=rows.length;if(loadedCount>pageSize){rows=rows.slice(0,pageSize);loadedCount=rows.length;hasMore=true}await loadReadState();render(rows)}).subscribe(status=>{realtimeState=status;renderConnection()});window.addEventListener('beforeunload',()=>{if(notificationChannel)db.removeChannel(notificationChannel)});document.addEventListener('keydown',handleNotificationKeys)}async function loadPrefs(){const r=await db.from('podcast_sponsorship_notification_preferences').select('messages_enabled,deals_enabled,deliverables_enabled,approvals_enabled,revisions_enabled').eq('user_id',user.id).maybeSingle();if(!r.error&&r.data)prefs={...prefs,...r.data}}async function savePrefs(){const r=await db.from('podcast_sponsorship_notification_preferences').upsert({user_id:user.id,...prefs,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(r.error){showError(r.error.message);return}showToast('Notification preferences saved');render(rows)}function categoryEnabled(t){if(t==='message_sent')return prefs.messages_enabled;if(['deal_created','deal_acknowledged','deal_completed'].includes(t))return prefs.deals_enabled;if(t==='deliverable_approved')return prefs.approvals_enabled;if(t==='deliverable_revision_requested')return prefs.revisions_enabled;if(t.startsWith('deliverable_'))return prefs.deliverables_enabled;return true}function togglePref(k,v){prefs[k]=!!v;savePrefs()}async function load(){loadedCount=0;hasMore=false;rows=[];const d=await db.from('podcast_sponsorship_deals').select('id,opportunity_id,status,agreed_amount,campaign_start,campaign_end').eq('creator_user_id',user.id);if(d.error)return showError(d.error.message);deals=d.data||[];dealLabels={};const oppIds=[...new Set(deals.map(x=>x.opportunity_id).filter(Boolean))];if(oppIds.length){const o=await db.from('podcast_sponsorship_opportunities').select('id,title,sponsor_name').in('id',oppIds);(o.data||[]).forEach(x=>dealLabels[x.id]=(x.sponsor_name?x.sponsor_name+' • ':'')+(x.title||'Sponsorship'));}const ids=deals.map(x=>x.id);if(!ids.length)return render([]);const a=await db.from('podcast_sponsorship_activity').select('id,deal_id,event_type,event_text,created_at').in('deal_id',ids).order('created_at',{ascending:false}).order('id',{ascending:false}).limit(pageSize+1);if(a.error)return showError(a.error.message);const data=a.data||[];hasMore=data.length>pageSize;rows=data.slice(0,pageSize);loadedCount=rows.length;await loadReadState();renderDealOptions();render(rows)}async function loadReadState(){seen=new Set();const r=await db.from('podcast_sponsorship_notification_reads').select('activity_id').eq('user_id',user.id);(r.data||[]).forEach(x=>seen.add(x.activity_id))}async function markViewed(ids){if(!ids.length)return;const before=new Set(seen);ids.forEach(id=>seen.add(id));render(rows);const state=window.CrowRulesMemberState;const commit=async()=>db.from("podcast_sponsorship_notification_reads").upsert(ids.map(activity_id=>({user_id:user.id,activity_id})),{onConflict:"user_id,activity_id"});if(state?.optimistic){const r=await state.optimistic({key:"sponsorship-notification-read:"+ids.slice().sort().join(","),label:"Mark notification viewed",apply:async()=>{},rollback:async()=>{seen=before;render(rows)},commit,success:ids.length===1?"Notification marked as viewed":ids.length+" notifications marked as viewed",failure:"Notification update failed — restored"});if(!r.ok)return}else{const r=await commit();if(r.error){seen=before;render(rows);showError(r.error.message);return}}await loadReadState();render(rows)}async function loadMore(){if(loadingMore||!hasMore)return;loadingMore=true;const d=await db.from('podcast_sponsorship_deals').select('id,opportunity_id,status').eq('creator_user_id',user.id);const ids=(d.data||[]).map(x=>x.id);if(!ids.length){loadingMore=false;return}const last=rows[rows.length-1];const a=await db.from('podcast_sponsorship_activity').select('id,deal_id,event_type,event_text,created_at').in('deal_id',ids).or('created_at.lt.'+last.created_at+',and(created_at.eq.'+last.created_at+',id.lt.'+last.id+')').order('created_at',{ascending:false}).order('id',{ascending:false}).limit(pageSize+1);if(a.error){showError(a.error.message);loadingMore=false;return}const data=a.data||[];hasMore=data.length>pageSize;rows=rows.concat(data.slice(0,pageSize));loadedCount=rows.length;await loadReadState();loadingMore=false;render(rows)} async function copyNotificationLink(id,dealId){const url=new URL('notifications.html',location.href);url.searchParams.set('notification',id);url.searchParams.set('deal',dealId);try{await navigator.clipboard.writeText(url.href);showToast('Notification link copied')}catch(e){showToast('Copy failed — use your browser share menu')}}async function openNotification(id,dealId){await markViewed([id]);location.href='creator-deal-room.html?deal='+encodeURIComponent(dealId)} function exportNotifications(){const data=rows.filter(matches);if(!data.length){showToast('No notifications to export');return}const escCsv=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=['Date,Type,Campaign,Message,Viewed'].concat(data.map(x=>[new Date(x.created_at).toISOString(),x.event_type,dealLabels[deals.find(d=>d.id===x.deal_id)?.opportunity_id]||('Deal #'+x.deal_id.slice(0,8)),x.event_text,seen.has(x.id)?'Yes':'No'].map(escCsv).join(','))).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='crowrules-podcast-notifications-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);showToast(data.length+' notifications exported')}
function renderConnection(){const el=document.getElementById('connectionStatus');if(!el)return;const ok=realtimeState==='SUBSCRIBED';el.innerHTML='<span class="connection-dot" style="background:'+(ok?'#00e5ff':'#888')+'"></span>'+(ok?'Live updates connected':('Realtime: '+realtimeState));} async function refreshNotifications(){const b=document.getElementById('refreshBtn');if(b){b.disabled=true;b.textContent='Refreshing…'}await load();renderConnection();if(b){b.disabled=false;b.textContent='Refresh'}} function renderDealOptions(){const s=document.getElementById('dealFilter');if(!s)return;s.innerHTML='<option value="all">All Sponsorship Deals</option>'+deals.map(d=>'<option value="'+d.id+'">'+esc(dealLabels[d.opportunity_id]||('Deal #'+d.id.slice(0,8)))+' • '+esc(d.status)+'</option>').join('');s.value=activeDealFilter} function setFilter(f){activeFilter=f;render(rows)} function setDealFilter(id){activeDealFilter=id;render(rows)} function setSearch(v){searchText=v.toLowerCase().trim();render(rows)}function matches(x){if(!categoryEnabled(x.event_type))return false;if(activeDealFilter!=='all'&&x.deal_id!==activeDealFilter)return false;if(searchText&&!((x.event_text||'').toLowerCase().includes(searchText)||(x.event_type||'').toLowerCase().replaceAll('_',' ').includes(searchText)))return false;if(activeFilter==='unread')return !seen.has(x.id);if(activeFilter==='all')return true;if(activeFilter==='messages')return x.event_type==='message_sent';if(activeFilter==='deals')return ['deal_created','deal_acknowledged','deal_completed'].includes(x.event_type);if(activeFilter==='deliverables')return x.event_type.startsWith('deliverable_');if(activeFilter==='approvals')return x.event_type==='deliverable_approved';if(activeFilter==='revisions')return x.event_type==='deliverable_revision_requested';return true}function render(data){const filtered=data.filter(matches),unread=filtered.filter(x=>!seen.has(x.id)).length,msgs=filtered.filter(x=>x.event_type==='message_sent').length,deliverables=filtered.filter(x=>x.event_type.startsWith('deliverable_')).length,approvals=filtered.filter(x=>x.event_type==='deliverable_approved').length;document.getElementById('count').textContent=unread?unread+' new':'';const fs=document.getElementById('filterStatus');if(fs){const dealName=activeDealFilter==='all'?'All sponsorship deals':(dealLabels[deals.find(d=>d.id===activeDealFilter)?.opportunity_id]||('Deal #'+String(activeDealFilter).slice(0,8)));const filterName=activeFilter==='all'?'All':activeFilter.charAt(0).toUpperCase()+activeFilter.slice(1);fs.textContent=filtered.length+' shown • '+filterName+' • '+dealName+(searchText?' • Search: “'+searchText+'”':'')}const summary=document.getElementById('notifySummary');if(summary)summary.innerHTML='<div class="summary-card"><strong>'+unread+'</strong><span>Unread</span></div><div class="summary-card"><strong>'+msgs+'</strong><span>Messages</span></div><div class="summary-card"><strong>'+deliverables+'</strong><span>Deliverable Events</span></div><div class="summary-card"><strong>'+approvals+'</strong><span>Approvals</span></div>';document.title=unread?'('+unread+') Notifications | CrowRules Podcasting':'Notifications | CrowRules Podcasting';const iconMap={message_sent:'💬',deal_created:'🤝',deal_acknowledged:'🤝',deal_completed:'🏁',deliverable_created:'📦',deliverable_submitted:'📤',deliverable_approved:'✅',deliverable_revision_requested:'🔄',deliverable_rejected:'⚠️'};document.getElementById('list').innerHTML=filtered.length?filtered.map(x=>'<article data-notification-id="'+esc(x.id)+'" class="notify-item '+(seen.has(x.id)?'':'new')+'"><b>'+esc(iconMap[x.event_type]||'🔔')+' '+esc(x.event_text)+'</b><span class="notify-type">'+esc(x.event_type.replaceAll('_',' '))+'</span><div class="notify-meta"><span class="notify-deal">'+esc(dealLabels[deals.find(d=>d.id===x.deal_id)?.opportunity_id]||('Deal #'+String(x.deal_id).slice(0,8)))+'</span><span class="notify-time">'+new Date(x.created_at).toLocaleString()+'</span></div><p><button class="view-btn" onclick="markViewed([\''+x.id+'\'])">Mark viewed</button> <button class="view-btn" onclick="openNotification(\''+x.id+\'\',\''+x.deal_id+\'\')">Open Deal Room →</button> <button class="view-btn" onclick="copyNotificationLink(\''+x.id+\'\',\''+x.deal_id+\')">Copy Link</button></p></article>').join(''):'<div class="notify-item"><h2>No notifications in this filter</h2><p class="notify-empty">Try another notification category.</p></div>';renderDealOptions();document.getElementById('loadMoreWrap').innerHTML=hasMore?'<button class="view-btn" onclick="loadMore()">Load More Notifications</button>':'';const dealSelect=document.getElementById('dealFilter');if(dealSelect)dealSelect.value=activeDealFilter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===activeFilter))}async function markRead(){await markViewed(rows.map(x=>x.id))} function focusUnread(){activeFilter='unread';searchText='';const s=document.getElementById('notificationSearch');if(s)s.value='';render(rows)}function focusNotificationSearch(){const s=document.getElementById('notificationSearch');if(s){s.focus();s.select()}}function handleNotificationKeys(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();focusNotificationSearch()}if(e.key==='Escape'){const s=document.getElementById('notificationSearch');if(s&&document.activeElement===s){s.value='';setSearch('')}}}function clearNotificationFilters(){activeFilter='all';activeDealFilter='all';searchText='';const s=document.getElementById('notificationSearch');if(s)s.value='';const d=document.getElementById('dealFilter');if(d)d.value='all';render(rows);showToast('Notification filters cleared')} async function markFilteredRead(){const ids=rows.filter(matches).filter(x=>!seen.has(x.id)).map(x=>x.id);if(!ids.length)return;await markViewed(ids)}function renderShell(){document.getElementById('app').innerHTML='<div class="notify-wrap"><p>CROWRULES PODCASTING</p><h1>Notifications <span id="count"></span></h1><div class="notify-actions"><button class="filter" onclick="focusUnread()">View Unread</button><button class="filter" onclick="document.getElementById('prefsPanel').classList.toggle('hidden')">Notification Settings</button><button id="refreshBtn" class="view-btn" onclick="refreshNotifications()">Refresh</button><button class="view-btn" onclick="exportNotifications()">Export CSV</button><button class="view-btn" onclick="clearNotificationFilters()">Clear Filters</button></div><div id="connectionStatus" class="connection"></div><p>Your sponsorship messages, campaign events, deliverable reviews, approvals and revisions.</p><div id="notifySummary" class="notify-summary"></div><input id="notificationSearch" type="search" placeholder="Search notifications…" oninput="setSearch(this.value)" style="width:100%;padding:12px;border-radius:10px;border:1px solid #292941;background:#0b0b14;color:inherit"><div id="prefsPanel" class="notify-item hidden" style="margin:12px 0"><h2>Notification Settings</h2><p class="notify-empty">Choose which sponsorship notification categories appear in your notification center.</p><label><input type="checkbox" '+(prefs.messages_enabled?'checked':'')+' onchange="togglePref(\'messages_enabled\',this.checked)"> Messages</label><br><label><input type="checkbox" '+(prefs.deals_enabled?'checked':'')+' onchange="togglePref(\'deals_enabled\',this.checked)"> Deal events</label><br><label><input type="checkbox" '+(prefs.deliverables_enabled?'checked':'')+' onchange="togglePref(\'deliverables_enabled\',this.checked)"> Deliverables</label><br><label><input type="checkbox" '+(prefs.approvals_enabled?'checked':'')+' onchange="togglePref(\'approvals_enabled\',this.checked)"> Approvals</label><br><label><input type="checkbox" '+(prefs.revisions_enabled?'checked':'')+' onchange="togglePref(\'revisions_enabled\',this.checked)"> Revision requests</label></div><div class="filters"><select id="dealFilter" onchange="setDealFilter(this.value)" class="filter" style="min-width:220px"><option value="all">All Sponsorship Deals</option>'+deals.map(d=>'<option value="'+d.id+'">Deal #'+d.id.slice(0,8)+' • '+d.status+'</option>').join('')+'</select><button class="filter active" data-filter="all" onclick="setFilter(\'all\')">All</button><button class="filter" data-filter="unread" onclick="setFilter(\'unread\')">Unread</button><button class="filter" data-filter="messages" onclick="setFilter(\'messages\')">Messages</button><button class="filter" data-filter="deals" onclick="setFilter(\'deals\')">Deals</button><button class="filter" data-filter="deliverables" onclick="setFilter(\'deliverables\')">Deliverables</button><button class="filter" data-filter="approvals" onclick="setFilter(\'approvals\')">Approvals</button><button class="filter" data-filter="revisions" onclick="setFilter(\'revisions\')">Revisions</button></div><div class="notify-actions"><button class="view-btn" onclick="markFilteredRead()">Mark Filtered as Viewed</button><button class="view-btn" onclick="markRead()">Mark All Loaded as Viewed</button></div> <span class="muted" id="filterStatus"></span><div id="list">Loading…</div><div id="loadMoreWrap" style="text-align:center;margin:22px 0"></div></div>'}function showError(m){document.getElementById('list').innerHTML='<p>'+esc(m)+'</p>'}init();</script></body></html>
