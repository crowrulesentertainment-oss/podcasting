<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plans • CrowRules Podcasting</title><link rel="stylesheet" href="css/app.css"></head><body><div id="app-shell"></div><main class="page"><section class="card form-card"><span class="eyebrow">PODCASTER STUDIO</span><h1>Your Subscription Plans</h1><p>Set your own plan name, description, and monthly price. Stripe creates the customer-facing recurring price securely on the server.</p><form id="plan-form"><label>Podcast<select id="podcast-select" required></select></label><label>Plan name<input id="name" required maxlength="80" placeholder="Supporter"></label><label>Description<textarea id="description" rows="3" placeholder="Support the show and get member-only episodes."></textarea></label><label>Monthly price (USD)<input id="price" type="number" min="1" max="999" step=".01" value="5.00" required></label><button class="btn primary">Create Plan</button><p id="status" class="status"></p></form><div id="existing" class="plan-grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/shell.js"></script><script src="js/manage-plans.js"></script></body></html>
