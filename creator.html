<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Studio</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script></head><body><div id="cr-app"></div><main class="page"><div class="form-wrap"><span class="eyebrow">CREATOR OPERATIONS</span><h1 class="dash-title">Creator Studio</h1><div class="panel"><h3>Build your show</h3><p class="status">Manage creator identity, shows and future monetization from one workspace.</p><a class="btn primary" href="signup.html">CREATE / SIGN IN</a></div><div class="panel" style="margin-top:15px"><h3>Stripe monetization</h3><p class="status">Checkout runs through a Supabase Edge Function so Stripe secret keys never ship to GitHub Pages.</p><button class="btn" id="checkout">OPEN CREATOR CHECKOUT</button><div id="msg" class="status"></div></div></div></main><script>addEventListener('load',()=>checkout.onclick=async()=>{const{data:{user}}=await CROW_PODCASTING.auth.getUser();if(!user)return location.href='login.html';msg.textContent='Starting secure Stripe Checkout…';const{data,error}=await CROW_PODCASTING.functions.invoke(CROW_PODCASTING_CONFIG.stripeCheckoutFunction,{body:{mode:'subscription'}});if(error)msg.textContent=error.message;else if(data?.url)location.href=data.url;else msg.textContent='Stripe checkout is not configured with a price yet.'})</script></body></html>
