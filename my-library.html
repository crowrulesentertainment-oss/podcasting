<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Library | CrowRules Podcasting</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/global-navigation.css">

</head><body><main><section class="section shell"><span class="kicker">LIBRARY</span><h1>Your listening universe.</h1><div id="library" class="grid" style="margin-top:25px"></div></section><script>document.addEventListener("DOMContentLoaded",async()=>{const s=await window.CrowRules.supabase.auth.getSession(),b=document.getElementById("library");if(!s.data.session){b.innerHTML='<div class="empty">Login to see your followed podcasts.</div>';return}const r=await window.CrowRules.supabase.from("podcast_subscriptions").select("podcast_id,podcasts(id,title,description)").eq("user_id",s.data.session.user.id);b.innerHTML=r.data?.length?r.data.map(x=>'<article class="card"><h3>'+x.podcasts.title+'</h3><p>'+((x.podcasts.description||""))+'</p><a class="btn" href="podcast.html?id='+x.podcast_id+'">Open</a></article>').join(""):'<div class="empty">Your library is empty.</div>'})</script></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js" defer></script></body></html>
