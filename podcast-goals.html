<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>
(()=>{const $=x=>document.getElementById(x),db=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),fmt=n=>Number(n||0).toLocaleString(),labels={published_episodes:"Published Episodes",total_plays:"Total Plays",unique_listeners:"Unique Listeners",returning_listeners:"Returning Listeners",listening_seconds:"Listening Seconds"},notice=m=>$("notice").innerHTML='<div class="panel">'+esc(m)+'</div>';
async function boot(){try{const id=new URLSearchParams(location.search).get("id");if(!id){location.href="podcast-manager.html";return}$("back").href="creator-action-center.html?id="+encodeURIComponent(id);const u=await db.auth.getUser();if(!u.data.user){location.href="login.html?redirect="+encodeURIComponent("podcast-goals.html?id="+id);return}const m=await db.from("members").select("id").eq("user_id",u.data.user.id).maybeSingle();if(!m.data)throw Error("No CrowRules membership profile found.");const c=await db.from("creators").select("id").eq("member_id",m.data.id).eq("is_active",true).maybeSingle();if(!c.data)throw Error("No active creator profile found.");const p=await db.from("podcasts").select("id,title,description").eq("id",id).eq("creator_id",c.data.id).maybeSingle();if(!p.data)throw Error("Podcast not found or you do not own it.");async function load(){await db.rpc("capture_podcast_creator_goal_snapshots",{p_podcast_id:id});const q=await db.rpc("get_podcast_creator_goal_progress",{p_podcast_id:id});if(q.error)throw q.error;const rows=q.data||[];const complete=rows.filter(x=>Number(x.progress_percent)>=100).length;const avg=rows.length?rows.reduce((a,x)=>a+Math.min(100,Number(x.progress_percent||0)),0)/rows.length:0;$("hero").innerHTML='<div class="ey">Creator Goals & Milestones</div><h1>'+esc(p.data.title)+'</h1><p class="desc">Set measurable milestones, watch progress from real podcast activity, and decide when you want to adjust your plan.</p><div class="note">Goals do not automatically publish, promote, monetize, or alter your podcast. They are planning and progress-tracking tools controlled by you.</div>';$("stats").innerHTML='<div class="stat"><div class="label">Active Goals</div><div class="value">'+fmt(rows.length)+'</div></div><div class="stat"><div class="label">Completed</div><div class="value">'+fmt(complete)+'</div></div><div class="stat"><div class="label">Avg Progress</div><div class="value">'+avg.toFixed(1)+'%</div></div><div class="stat"><div class="label">Podcast</div><div class="value" style="font-size:14px">'+esc(p.data.title)+'</div></div>';$("goals").innerHTML='<div class="ey">Milestone Board</div><h2>Your goals</h2><p class="muted">Progress is live from the podcast analytics tables.</p>'+ (rows.length?rows.map(x=>{const pct=Math.min(100,Number(x.progress_percent||0)),done=pct>=100;return '<article class="goal"><div class="row"><div><b>'+esc(labels[x.goal_type]||x.goal_type)+'</b><div class="muted">'+fmt(x.current_value)+' / '+fmt(x.target_value)+'</div></div><span class="badge '+(done?'done':'')+'">'+(done?'Complete':pct.toFixed(1)+'%')+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="muted">'+(x.deadline?('Deadline: '+new Date(x.deadline+'T00:00:00').toLocaleDateString()+' · '+fmt(x.days_remaining)+' days remaining'):'No deadline')+'</div></article>'}).join(""):'<div class="empty">No goals yet. Create your first milestone using the form.</div>')+'<div class="actions"><a class="btn" href="creator-action-center.html?id='+id+'">Action Center</a><a class="btn" href="podcast-goal-history.html?id='+id+'">Milestone History</a><a class="btn" href="podcast-achievements.html?id='+id+'">🏆 Achievements</a><a class="btn" href="podcast-performance.html?id='+id+'">Performance</a><a class="btn" href="podcast-growth.html?id='+id+'">Growth</a><a class="btn" href="payouts.html">Monetization</a></div>';$("hero").hidden=$("stats").hidden=$("grid").hidden=false}
await load();$("form").addEventListener("submit",async e=>{e.preventDefault();const target=Number($("target").value);if(!target)return;const q=await db.from("podcast_creator_goals").insert({creator_id:c.data.id,podcast_id:id,goal_type:$("type").value,target_value:target,deadline:$("deadline").value||null});if(q.error){notice(q.error.message);return}$("form").reset();await load()})}catch(e){console.error(e);notice(e.message||"Unable to load goals.")}}boot()})();
