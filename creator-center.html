<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creator Command Center | CrowRules Podcasting</title>
<link rel="stylesheet" href="css/podcasting.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js" defer></script>
<style>
.creator-wrap{max-width:1180px;margin:auto}.podcasts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.pod-card{overflow:hidden}.pod-art{aspect-ratio:1;background:#080b14}.pod-art img{width:100%;height:100%;object-fit:cover}.pod-body{padding:20px}.pod-body h3{margin:0 0 8px}.pod-body p{color:#9da7bb}.status{display:inline-block;padding:6px 10px;border:1px solid #ffffff18;border-radius:999px;font-size:11px;text-transform:uppercase}.empty{text-align:center;padding:50px}.error{color:#ff8cae}.loading{color:#55e7ff}
</style>
</head>
<body><div data-nav></div>
<main class="wrap hero creator-wrap">
<div class="eyebrow">CROWRULES PODCASTING</div><h1>Creator <span class="gradient">Command Center.</span></h1>
<p class="lead">Your podcasts, episodes, audience and publishing tools — powered directly by Supabase.</p>
<div id="account" class="notice loading">Connecting to your CrowRules account…</div>
<section class="section" id="dashboard" hidden>
<div class="actions"><a class="btn primary" href="create-podcast.html">＋ Create Podcast</a><a class="btn" href="episode-studio.html">Episode Studio</a><a class="btn" href="publishing-pipeline.html">Publishing Pipeline</a><button class="btn" id="refresh">Refresh</button></div>
<h2>Your Podcasts</h2><div id="podcasts" class="podcasts"></div>
</section></main>
<script>
(function(){
"use strict";
const accountEl=document.getElementById('account');
const dashboardEl=document.getElementById('dashboard');
const podcastsEl=document.getElementById('podcasts');
const refreshBtn=document.getElementById('refresh');

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(data){
 if(!data.length){podcastsEl.innerHTML='<div class="card empty"><h3>No podcasts found</h3><p>Create your first CrowRules podcast and it will appear here automatically.</p><a class="btn primary" href="create-podcast.html">Create Podcast</a></div>';return;}
 podcastsEl.innerHTML=data.map(p=>'<article class="card pod-card"><div class="pod-art">'+(p.artwork_url?'<img src="'+esc(p.artwork_url)+'" alt="'+esc(p.title)+' artwork" loading="lazy">':'<div class="empty">No artwork</div>')+'</div><div class="pod-body"><span class="status">'+esc(p.status||'draft')+'</span><h3>'+esc(p.title)+'</h3><p>'+esc(p.description||'No description yet.')+'</p><div class="actions"><a class="btn" href="podcast.html?id='+encodeURIComponent(p.id)+'">Open Podcast</a><a class="btn" href="episode-studio.html?podcast='+encodeURIComponent(p.id)+'">Create Episode</a></div></div></article>').join('');
}
function showError(e){
 accountEl.className='notice error';
 accountEl.textContent='Supabase error: '+(e?.message||e);
 dashboardEl.hidden=false;
 podcastsEl.innerHTML='<div class="card empty"><h3>Could not load podcasts</h3><p>'+esc(e?.message||e)+'</p><button class="btn primary" id="retry">Try Again</button></div>';
 document.getElementById('retry')?.addEventListener('click',loadPodcasts);
}
function getClient(){
 if(window.CROW_SUPABASE)return window.CROW_SUPABASE;
 const c=window.CROW_CONFIG||{};
 if(!window.supabase||!c.supabaseUrl||!c.supabaseKey)throw new Error('Supabase configuration is unavailable.');
 return window.supabase.createClient(c.supabaseUrl,c.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
}
async function loadPodcasts(){
 accountEl.className='notice loading';
 accountEl.textContent='Connecting to Supabase…';
 dashboardEl.hidden=false;
 podcastsEl.innerHTML='<div class="notice loading">Loading podcasts from Supabase…</div>';
 try{
   const sb=getClient();
   window.CROW_SUPABASE=sb;
   const result=await Promise.race([
     sb.from('podcasts').select('id,title,slug,status,artwork_url,description,created_at,creator_id').eq('status','published').order('created_at',{ascending:false}),
     new Promise((_,reject)=>setTimeout(()=>reject(new Error('Supabase request timed out after 10 seconds.')),10000))
   ]);
   if(result.error)throw result.error;
   const rows=result.data||[];
   accountEl.className='notice';
   accountEl.textContent='Supabase connected • '+rows.length+' published podcast'+(rows.length===1?'':'s');
   render(rows);
   dashboardEl.hidden=false;
 }catch(e){showError(e)}
}
refreshBtn.addEventListener('click',loadPodcasts);
loadPodcasts();
})();document.getElementById('account');
const dashboardEl=document.getElementById('dashboard');
const podcastsEl=document.getElementById('podcasts');
const refreshBtn=document.getElementById('refresh');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showError(e){
 accountEl.className='notice error';
 accountEl.textContent='Supabase error: '+(e?.message||e);
 dashboardEl.hidden=false;
}
function render(data){
 if(!data?.length){podcastsEl.innerHTML='<div class="card empty"><h3>No podcasts found</h3><p>Create your first CrowRules podcast and it will appear here automatically.</p><a class="btn primary" href="create-podcast.html">Create Podcast</a></div>';return;}
 podcastsEl.innerHTML=data.map(p=>'<article class="card pod-card"><div class="pod-art">'+(p.artwork_url?'<img src="'+esc(p.artwork_url)+'" alt="'+esc(p.title)+' artwork" loading="lazy">':'<div class="empty">No artwork</div>')+'</div><div class="pod-body"><span class="status">'+esc(p.status||'draft')+'</span><h3>'+esc(p.title)+'</h3><p>'+esc(p.description||'No description yet.')+'</p><div class="actions"><a class="btn" href="podcast.html?id='+encodeURIComponent(p.id)+'">Open Podcast</a><a class="btn" href="episode-studio.html?podcast='+encodeURIComponent(p.id)+'">Create Episode</a></div></div></article>').join('');
}
function timeout(p,ms=10000){
 return Promise.race([p,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Supabase request timed out.')),ms))]);
}
async function loadPodcasts(){
 podcastsEl.innerHTML='<div class="notice loading">Loading podcasts from Supabase…</div>';
 const sb=window.CROW_SUPABASE||window.supabase?.createClient?.(window.CROW_CONFIG?.supabaseUrl,window.CROW_CONFIG?.supabaseKey);
 if(!sb)throw new Error('Supabase client is not available yet.');
 window.CROW_SUPABASE=sb;

 const pub=await timeout(sb.from('podcasts')
   .select('id,title,slug,status,artwork_url,description,created_at,creator_id')
   .eq('status','published')
   .order('created_at',{ascending:false}));
 if(pub.error)throw pub.error;
 let rows=pub.data||[];

 let session=null;
 try{session=(await timeout(sb.auth.getSession(),8000)).data?.session||null}catch(e){console.warn('Session restore:',e.message)}

 if(session?.user){
   const own=await timeout(sb.from('podcasts')
     .select('id,title,slug,status,artwork_url,description,created_at,creator_id')
     .eq('creator_id',session.user.id)
     .order('created_at',{ascending:false}));
   if(own.error){
     console.warn('Owned podcast query:',own.error.message);
   }else{
     const map=new Map(rows.map(p=>[p.id,p]));
     (own.data||[]).forEach(p=>map.set(p.id,p));
     rows=Array.from(map.values()).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
   }
   accountEl.className='notice';
   accountEl.textContent='Signed in as '+(session.user.email||'CrowRules Member');
 }else{
   accountEl.className='notice';
   accountEl.textContent='Supabase connected • showing published podcasts';
 }
 dashboardEl.hidden=false;
 render(rows);
}
async function init(){
 try{
   if(window.CROW_SUPABASE){
     await loadPodcasts();
     return;
   }
   window.addEventListener('crow:ready',()=>loadPodcasts().catch(showError),{once:true});
   setTimeout(()=>{if(!window.CROW_SUPABASE)loadPodcasts().catch(showError)},5000);
 }catch(e){showError(e)}
}
refreshBtn.addEventListener('click',()=>loadPodcasts().catch(showError));
init();
</script></body></html>
