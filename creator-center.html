<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creator Command Center | CrowRules Podcasting</title>
<link rel="stylesheet" href="css/podcasting.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js" defer></script>
<style>
.creator-wrap{max-width:1180px;margin:auto}.podcasts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.pod-card{overflow:hidden}.pod-art{aspect-ratio:1;background:#080b14}.pod-art img{width:100%;height:100%;object-fit:cover}.pod-body{padding:20px}.pod-body h3{margin:0 0 8px}.pod-body p{color:#9da7bb}.status{display:inline-block;padding:6px 10px;border:1px solid #ffffff18;border-radius:999px;font-size:11px;text-transform:uppercase}.empty{text-align:center;padding:50px}.error{color:#ff8cae}.loading{color:#55e7ff}
</style>
</head>
<body><div data-nav></div>
<main class="wrap hero creator-wrap">
<div class="eyebrow">CROWRULES PODCASTING</div><h1>Creator <span class="gradient">Command Center.</span></h1>
<p class="lead">Your podcasts, episodes, audience and publishing tools — powered directly by Supabase.</p>
<div id="account" class="notice loading">Connecting to your CrowRules account…</div>
<section class="section" id="dashboard" hidden>
<div class="actions"><a class="btn primary" href="create-podcast.html">＋ Create Podcast</a><a class="btn" href="episode-studio.html">Episode Studio</a><a class="btn" href="publishing-pipeline.html">Publishing Pipeline</a><button class="btn" id="refresh">Refresh</button></div>
<h2>Your Podcasts</h2><div id="podcasts" class="podcasts"></div>
</section></main>
<script>
const SUPABASE_URL=window.CROW_CONFIG?.supabaseUrl||'https://cevylpnoexugwgygvtgu.supabase.co';
const SUPABASE_KEY=window.CROW_CONFIG?.supabaseKey;
let sb;
const accountEl=document.getElementById('account');
const dashboardEl=document.getElementById('dashboard');
const podcastsEl=document.getElementById('podcasts');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showError(e){accountEl.className='notice error';accountEl.textContent='Supabase error: '+(e?.message||e);}
function render(data){
 if(!data?.length){podcastsEl.innerHTML='<div class="card empty"><h3>No podcasts found</h3><p>Create your first CrowRules podcast and it will appear here automatically.</p><a class="btn primary" href="create-podcast.html">Create Podcast</a></div>';return;}
 podcastsEl.innerHTML=data.map(p=>'<article class="card pod-card"><div class="pod-art">'+(p.artwork_url?'<img src="'+esc(p.artwork_url)+'" alt="'+esc(p.title)+' artwork" loading="lazy">':'<div class="empty">No artwork</div>')+'</div><div class="pod-body"><span class="status">'+esc(p.status||'draft')+'</span><h3>'+esc(p.title)+'</h3><p>'+esc(p.description||'No description yet.')+'</p><div class="actions"><a class="btn" href="podcast.html?id='+encodeURIComponent(p.id)+'">Open Podcast</a><a class="btn" href="episode-studio.html?podcast='+encodeURIComponent(p.id)+'">Create Episode</a></div></div></article>').join('');
}
async function loadPodcasts(){
 podcastsEl.innerHTML='<div class="notice loading">Loading podcasts from Supabase…</div>';
 // Published podcasts are intentionally public in the database, so this query works
 // even if the browser session has not finished restoring yet.
 const pub=await sb.from('podcasts').select('id,title,slug,status,artwork_url,description,created_at,creator_id').eq('status','published').order('created_at',{ascending:false});
 if(pub.error) throw pub.error;
 let rows=pub.data||[];
 const {data:{session}}=await sb.auth.getSession();
 if(session?.user){
   const own=await sb.from('podcasts').select('id,title,slug,status,artwork_url,description,created_at,creator_id').eq('creator_id',session.user.id).order('created_at',{ascending:false});
   if(own.error) throw own.error;
   const map=new Map(rows.map(p=>[p.id,p]));
   (own.data||[]).forEach(p=>map.set(p.id,p));
   rows=Array.from(map.values()).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
   accountEl.className='notice';accountEl.textContent='Signed in as '+(session.user.email||'CrowRules Member');
 }else{
   accountEl.className='notice';accountEl.textContent='Supabase connected • showing published podcasts';
 }
 dashboardEl.hidden=false;
 render(rows);
}
async function init(){
 try{
  if(!SUPABASE_KEY) throw new Error('Supabase publishable key is missing from js/config.js.');
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  await loadPodcasts();
 }catch(e){showError(e);dashboardEl.hidden=false;}
}
document.getElementById('refresh').addEventListener('click',()=>loadPodcasts().catch(showError));
init();
</script></body></html>
