<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creator Command Center | CrowRules Podcasting</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.creator-wrap{max-width:1180px;margin:auto}.podcasts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.pod-card{overflow:hidden}.pod-art{aspect-ratio:1;background:#080b14}.pod-art img{width:100%;height:100%;object-fit:cover}.pod-body{padding:20px}.pod-body h3{margin:0 0 8px}.pod-body p{color:#9da7bb}.status{display:inline-block;padding:6px 10px;border:1px solid #ffffff18;border-radius:999px;font-size:11px;text-transform:uppercase}.empty{text-align:center;padding:50px}.error{color:#ff8cae}.loading{color:#55e7ff}
</style>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=1" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script>
<link rel="stylesheet" href="css/podcasting-v10.css?v=20261004-10">



<script src="js/crow-podcasting-player-v13-3.js?v=20261004-01" defer></script>
<link rel="stylesheet" href="css/crow-podcasting-player-v13-3.css?v=20261004-01">
</head>
<body><script src="js/crowrules-db-bootstrap-v2.js?v=20261004-v14"></script>
<script src="js/app.js?v=20261004-10" defer></script>
<script src="js/site-repair-v1.js?v=20261004-10" defer></script>

<div data-nav data-crow-v8-runtime="8"></div>
<div data-nav data-crow-v8-runtime="8"></div>
<div data-nav data-crow-v8-runtime="8"></div>
<div data-nav data-crow-v8-runtime="8"></div>
<div data-nav data-crow-v8-runtime="8"></div>
<div data-nav data-nav-owner="crowrules-podcasting-nav-v7"></div>


<main class="wrap hero creator-wrap">
<div class="eyebrow">CROWRULES PODCASTING</div><h1>Creator <span class="gradient">Command Center.</span></h1>
<p class="lead">Your podcasts, episodes, audience and publishing tools — powered directly by Supabase.</p>
<div id="account" class="notice loading">Connecting to your CrowRules account…</div>
<section class="section" id="dashboard" hidden>
<div class="actions"><a class="btn primary" href="create-podcast.html">＋ Create Podcast</a><a class="btn" href="episode-studio.html">Episode Studio</a><a class="btn" href="publishing-pipeline.html">Publishing Pipeline</a><a class="btn" href="creator-subscriptions.html">Subscriptions</a><button class="btn" id="refresh">Refresh</button></div>
<h2>Your Podcasts</h2><div id="podcasts" class="podcasts"></div>
</section></main>
<script>
(function(){
"use strict";
const accountEl=document.getElementById("account"),dashboardEl=document.getElementById("dashboard"),podcastsEl=document.getElementById("podcasts"),refreshBtn=document.getElementById("refresh");
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(data){if(!data.length){podcastsEl.innerHTML='<div class="card empty"><h3>No podcasts found</h3><p>Create your first CrowRules podcast and it will appear here automatically.</p><a class="btn primary" href="create-podcast.html">Create Podcast</a></div>';return}podcastsEl.innerHTML=data.map(p=>'<article class="card pod-card"><div class="pod-art">'+(p.artwork_url?'<img src="'+esc(p.artwork_url)+'" alt="'+esc(p.title)+' artwork" loading="lazy">':'<div class="empty">No artwork</div>')+'</div><div class="pod-body"><span class="status">'+esc(p.status||"draft")+'</span><h3>'+esc(p.title)+'</h3><p>'+esc(p.description||"No description yet.")+'</p><div class="actions"><a class="btn" href="podcast.html?id='+encodeURIComponent(p.id)+'">Open Podcast</a><a class="btn" href="episode-studio.html?podcast='+encodeURIComponent(p.id)+'">Create Episode</a></div></div></article>').join("")}
async function load(){try{await window.CROW_DATA?.bootstrap?.();const data=window.CROW_DATA?.snapshot?.()||{},u=window.__CROW_USER||data.account?.user;if(!u)throw Error("Sign in to your CrowRules account first.");const rows=(data.catalog?.podcasts||[]).filter(p=>String(p.creator_id)===String(u.id));accountEl.className="notice";accountEl.textContent="Signed in as "+(u.email||"CrowRules Member")+" · "+rows.length+" published podcast"+(rows.length===1?"":"s");dashboardEl.hidden=false;render(rows)}catch(e){accountEl.className="notice error";accountEl.textContent=e.message||"Supabase connection unavailable.";dashboardEl.hidden=false;podcastsEl.innerHTML='<div class="card empty"><h3>Could not load podcasts</h3><p>'+esc(e.message||e)+'</p></div>'}}
refreshBtn.addEventListener("click",load);window.addEventListener("crow:data:catalog",load);window.addEventListener("crow:data:account",load);window.addEventListener("crow:auth",load);load();
})();
</script></body></html>
