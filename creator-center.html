<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creator Command Center | CrowRules Podcasting</title>
<link rel="stylesheet" href="css/podcasting.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js" defer></script>
<style>
.creator-wrap{max-width:1180px;margin:auto}.podcasts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.pod-card{overflow:hidden}.pod-art{aspect-ratio:1;background:#080b14}.pod-art img{width:100%;height:100%;object-fit:cover}.pod-body{padding:20px}.pod-body h3{margin:0 0 8px}.pod-body p{color:#9da7bb}.status{display:inline-block;padding:6px 10px;border:1px solid #ffffff18;border-radius:999px;font-size:11px;text-transform:uppercase}.empty{text-align:center;padding:50px}.error{color:#ff8cae}.loading{color:#55e7ff}
</style>
</head>
<body><div data-nav></div>
<main class="wrap hero creator-wrap">
<div class="eyebrow">CROWRULES PODCASTING</div><h1>Creator <span class="gradient">Command Center.</span></h1>
<p class="lead">Your podcasts, episodes, audience and publishing tools — powered directly by Supabase.</p>
<div id="account" class="notice loading">Connecting to your CrowRules account…</div>
<section class="section" id="dashboard" hidden>
<div class="actions"><a class="btn primary" href="create-podcast.html">＋ Create Podcast</a><a class="btn" href="episode-studio.html">Episode Studio</a><a class="btn" href="publishing-pipeline.html">Publishing Pipeline</a><button class="btn" id="refresh">Refresh</button></div>
<h2>Your Podcasts</h2><div id="podcasts" class="podcasts"></div>
</section></main>
<script>
const SUPABASE_URL=window.CROW_CONFIG?.supabaseUrl||'https://cevylpnoexugwgygvtgu.supabase.co';
const SUPABASE_KEY=window.CROW_CONFIG?.supabaseKey;
let sb;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showError(e){account.className='notice error';account.textContent='Supabase error: '+(e?.message||e);}
async function init(){
 try{
  if(!SUPABASE_KEY) throw new Error('Supabase publishable key is missing from js/config.js.');
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data:{session},error}=await sb.auth.getSession();
  if(error) throw error;
  if(!session?.user){account.className='notice error';account.innerHTML='You are not signed in. <a href="account.html">Open Account</a> to sign in.';return;}
  account.className='notice';account.textContent='Signed in as '+session.user.email;
  dashboard.hidden=false;
  await loadPodcasts(session.user.id);
 }catch(e){showError(e)}
}
async function loadPodcasts(userId){
 podcasts.innerHTML='<div class="notice loading">Loading podcasts from Supabase…</div>';
 const {data,error}=await sb.from('podcasts').select('id,title,slug,status,artwork_url,description,created_at').eq('creator_id',userId).order('created_at',{ascending:false});
 if(error) throw error;
 if(!data?.length){podcasts.innerHTML='<div class="card empty"><h3>No podcasts yet</h3><p>Create your first CrowRules podcast and it will appear here automatically.</p><a class="btn primary" href="create-podcast.html">Create Podcast</a></div>';return;}
 podcasts.innerHTML=data.map(p=>`<article class="card pod-card"><div class="pod-art">${p.artwork_url?`<img src="${esc(p.artwork_url)}" alt="${esc(p.title)} artwork" loading="lazy">`:'<div class="empty">No artwork</div>'}</div><div class="pod-body"><span class="status">${esc(p.status||'draft')}</span><h3>${esc(p.title)}</h3><p>${esc(p.description||'No description yet.')}</p><div class="actions"><a class="btn" href="podcast.html?id=${encodeURIComponent(p.id)}">Open Podcast</a><a class="btn" href="episode-studio.html?podcast=${encodeURIComponent(p.id)}">Create Episode</a></div></div></article>`).join('');
}
document.getElementById('refresh').addEventListener('click',async()=>{try{const {data:{session}}=await sb.auth.getSession();if(session)await loadPodcasts(session.user.id)}catch(e){showError(e)}});
init();
</script></body></html>
