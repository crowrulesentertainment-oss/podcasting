<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>
(()=>{const $=x=>document.getElementById(x),db=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));function notice(m){$("notice").innerHTML='<div class="panel">'+esc(m)+'</div>'}
async function boot(){try{const id=new URLSearchParams(location.search).get("id");if(!id){location.href="podcast-manager.html";return}$("back").href="podcast-cohorts.html?id="+encodeURIComponent(id);const u=await db.auth.getUser();if(!u.data.user){location.href="login.html?redirect="+encodeURIComponent("podcast-journey.html?id="+id);return}const m=await db.from("members").select("id").eq("user_id",u.data.user.id).maybeSingle();if(m.error)throw m.error;if(!m.data)throw Error("No CrowRules membership profile found.");const c=await db.from("creators").select("id").eq("member_id",m.data.id).eq("is_active",true).maybeSingle();if(c.error)throw c.error;if(!c.data)throw Error("No active creator profile found.");const p=await db.from("podcasts").select("id,title,description").eq("id",id).eq("creator_id",c.data.id).maybeSingle();if(p.error)throw p.error;if(!p.data)throw Error("Podcast not found or you do not own it.");const q=await db.rpc("get_podcast_listener_journey",{p_podcast_id:id});if(q.error)throw q.error;const rows=q.data||[],trans=rows.filter(x=>x.metric_type==="transition"),disc=rows.filter(x=>x.metric_type==="discovery");const ids=[...new Set([...trans.map(x=>x.episode_id),...trans.map(x=>x.next_episode_id),...disc.map(x=>x.episode_id)].filter(Boolean))];let eps=[];if(ids.length){const z=await db.from("podcast_episodes").select("id,title,episode_number,season_number").in("id",ids);if(z.error)throw z.error;eps=z.data||[]}const names=Object.fromEntries(eps.map(e=>[e.id,e.title||"Untitled episode"]));const epLabel=id=>esc(names[id]||"Episode");
$("hero").innerHTML='<div class="ey">Listener Journey & Discovery Intelligence</div><h1>'+esc(p.data.title)+'</h1><p class="desc">'+esc(p.data.description||"See how signed-in listeners enter the catalog and move from one episode to another.")+'</p><div class="callout">Journey paths use signed-in listening events. A transition is counted when a listener starts a different episode within 24 hours of the previous recorded listening event. Raw listener identities are never returned to this dashboard.</div>';
const totalDisc=disc.reduce((a,x)=>a+Number(x.first_listens||0),0),totalTrans=trans.reduce((a,x)=>a+Number(x.transitions||0),0),uniqueEntries=disc.length;
$("stats").innerHTML='<div class="stat"><div class="label">Discovery Entries</div><div class="value">'+totalDisc.toLocaleString()+'</div><div class="muted">First catalog episode events</div></div><div class="stat"><div class="label">Journey Transitions</div><div class="value">'+totalTrans.toLocaleString()+'</div><div class="muted">Episode-to-episode moves</div></div><div class="stat"><div class="label">Entry Episodes</div><div class="value">'+uniqueEntries+'</div><div class="muted">Episodes that introduced a listener</div></div>';
const discovery=disc.sort((a,b)=>Number(b.first_listens)-Number(a.first_listens)).slice(0,10).map((x,i)=>'<div class="item"><div class="row"><span><b>'+String(i+1).padStart(2,"0")+'</b> '+epLabel(x.episode_id)+'</span><span class="badge">'+Number(x.first_listens).toLocaleString()+' entries</span></div></div>').join("")||'<div class="empty">No signed-in discovery events yet.</div>';
const journey=trans.sort((a,b)=>Number(b.transitions)-Number(a.transitions)).slice(0,12).map(x=>'<div class="item"><div class="flow"><div><b>'+epLabel(x.episode_id)+'</b><div class="muted">FROM</div></div><div class="arrow">→</div><div><b>'+epLabel(x.next_episode_id)+'</b><div class="muted">NEXT · '+Number(x.transitions).toLocaleString()+' transitions · '+Number(x.unique_listeners).toLocaleString()+' listeners · '+Number(x.avg_gap_minutes||0).toFixed(1)+' min avg gap</div></div></div></div>').join("")||'<div class="empty">No episode-to-episode journeys yet.</div>';
$("content").innerHTML='<section class="panel"><div class="ey">Discovery Sources</div><h2>Where listeners enter</h2><p class="muted">The first recorded episode listened to by each identified listener in this podcast.</p>'+discovery+'</section><section class="panel"><div class="ey">Catalog Paths</div><h2>What listeners play next</h2><p class="muted">Most common next-episode movements within a 24-hour journey window.</p>'+journey+'</section><section class="panel" style="grid-column:1/-1"><div class="ey">Interpretation</div><div class="callout"><b>Discovery episode:</b> the first recorded episode for an identified listener in this podcast. <br><br><b>Journey transition:</b> a different episode started by the same identified listener within 24 hours. This is an observed listening path, not a recommendation or prediction. Anonymous sessions remain outside person-based journey analysis.</div><div class="actions"><a class="btn" href="podcast-retention.html?id='+encodeURIComponent(id)+'">Listener Retention</a><a class="btn" href="podcast-cohorts.html?id='+encodeURIComponent(id)+'">Audience Cohorts</a><a class="btn" href="podcast-dashboard.html?id='+encodeURIComponent(id)+'">Dashboard</a></div></section>';
$("hero").hidden=$("stats").hidden=$("content").hidden=false}catch(e){notice(e.message||"Unable to load listener journey intelligence.")}}boot()})();
