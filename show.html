<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcast | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script></head><body><div id="cr-app"></div><main class="page"><div id="show"></div><section><div class="section-head"><div><span class="eyebrow">EPISODES</span><h2>Latest episodes</h2></div></div><div id="episodes" class="panel"></div></section></main><div id="cr-player"></div><script>
window.addEventListener('DOMContentLoaded',async()=>{const sb=window.CROW_PODCASTING,id=new URLSearchParams(location.search).get('id');const root=document.querySelector('#show'),list=document.querySelector('#episodes');if(!id){root.innerHTML='<div class="panel">Choose a podcast from Discover.</div>';return}const{data:p,error}=await sb.from('podcasts').select('*').eq('id',id).maybeSingle();if(error||!p){root.innerHTML='<div class="panel">Podcast not found.</div>';return}root.innerHTML='<section class="show-hero"><img src="'+(p.artwork_url||'')+'" alt=""><div><span class="eyebrow">'+(p.category||'PODCAST')+'</span><h1 class="dash-title">'+p.title+'</h1><p class="hero-copy">'+(p.description||'')+'</p><div class="meta">'+Number(p.total_plays||0).toLocaleString()+' PLAYS • '+Number(p.listener_count||0).toLocaleString()+'</div></div></section>';const{data:e}=await sb.from('podcast_episodes').select('id,title,slug,description,episode_number,season_number,published_at,duration_seconds,audio_url,thumbnail_url,play_count,status').eq('podcast_id',id).eq('status','published').order('published_at',{ascending:false}).limit(30);list.innerHTML=(e||[]).map(x=>'<article class="episode-row"><div><span class="eyebrow">S'+(x.season_number||1)+' • E'+(x.episode_number||'')+'</span><h3>'+x.title+'</h3><p>'+((x.description||'').slice(0,220))+'</p></div><div class="episode-actions"><button class="btn primary" data-play="'+x.id+'">PLAY</button><a class="btn" href="episode.html?id='+x.id+'">DETAILS</a></div></article>').join('')||'No published episodes yet.';document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{const x=(e||[]).find(v=>v.id===b.dataset.play);if(x&&x.audio_url)window.CrowPlayer.play({audio_url:x.audio_url,title:x.title,podcast_title:p.title,artwork_url:x.thumbnail_url||p.artwork_url})})});
</script><style>.show-hero{display:grid;grid-template-columns:260px 1fr;gap:30px;align-items:center}.show-hero img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:22px;border:1px solid var(--line)}.episode-row{display:grid;grid-template-columns:1fr auto;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}.episode-row h3{font:800 15px Orbitron;margin:8px 0}.episode-row p{color:var(--muted);line-height:1.6;font-size:11px}.episode-actions{display:flex;gap:8px;align-items:center}@media(max-width:700px){.show-hero{grid-template-columns:1fr}.episode-row{grid-template-columns:1fr}.episode-actions{flex-wrap:wrap}}</style></body></html>
