<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcast | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script><script src="js/show.js" defer></script></head><body><div id="cr-app" data-cr-shell="crowrules-podcasting-sitewide-v7"></div><main class="page"><div id="show"></div><section><div class="section-head"><div><span class="eyebrow">EPISODES</span><h2>Latest episodes</h2></div></div><div id="episodes" class="panel"></div></section><section><div class="section-head"><div><span class="eyebrow">SUPPORT THE CREATOR</span><h2>Creator monetization</h2></div></div><div id="support" class="card-grid"></div></section></main><div id="cr-player" data-cr-player="crowrules-podcasting-sitewide-v7"></div><style>.show-hero{display:grid;grid-template-columns:260px 1fr;gap:30px;align-items:center}.show-hero img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:22px;border:1px solid var(--line)}.show-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.episode-row{display:grid;grid-template-columns:1fr auto;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}.episode-row h3{font:800 15px Orbitron;margin:8px 0}.episode-row p{color:var(--muted);line-height:1.6;font-size:11px}.episode-actions{display:flex;gap:8px;align-items:center}.support-btn{margin-top:12px}@media(max-width:700px){.show-hero{grid-template-columns:1fr}.episode-row{grid-template-columns:1fr}.episode-actions{flex-wrap:wrap}}</style></body></html>
