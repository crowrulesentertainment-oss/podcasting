itle,description,artwork_url").eq("id",id).eq("published",true).maybeSingle(),db.from("podcasting_subscription_plans").select("*").eq("show_id",id).eq("active",true).order("amount_cents")]);if(se||!s){app.innerHTML="<p class=notice>Show not found.</p>";return}app.innerHTML="<h1>"+esc(s.title)+"</h1><p>"+esc(s.description||"")+"</p><h2>SUPPORT THIS SHOW</h2><div class=sub>"+(p||[]).map(x=>'<article class=plan><b>'+esc(x.name)+'</b><div class=price>$'+(Number(x.amount_cents)/100).toFixed(2)+'/'+(x.interval==="year"?"year":"month")+'</div><p>'+esc(x.description||"")+'</p><button data-plan="+x.id+">SUBSCRIBE</button></article>').join("")+"</div>";document.querySelectorAll("[data-plan]").forEach(b=>b.onclick=async()=>{const {data:{session}}=await db.auth.getSession();if(!session){location.href="accounts.html?return="+encodeURIComponent(location.href);return}const r=await fetch(U+"/functions/v1/podcasting-stripe-checkout-v2",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,"apikey":K,"content-type":"application/json"},body:JSON.stringify({plan_id:b.dataset.plan})});const j=await r.json();if(j.url)location.href=j.url;else alert(j.error||"Checkout could not start.")})})()</script></body></html>
