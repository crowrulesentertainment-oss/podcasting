<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcast | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script><script src="js/show.js" defer></script></head><body><div id="cr-app" data-cr-shell="crowrules-podcasting-sitewide-v7"></div><main class="page"><div id="show"></div><section><div class="section-head"><div><span class="eyebrow">EPISODES</span><h2>Latest episodes</h2></div></div><div id="episodes" class="panel"></div></section><section><div class="section-head"><div><span class="eyebrow">SUPPORT THE CREATOR</span><h2>Creator monetization</h2></div></div><div id="support" class="card-grid"></div></section></main><div id="cr-player" data-cr-player="crowrules-podcasting-sitewide-v7"></div><style>.show-hero{display:grid;grid-template-columns:260px 1fr;gap:30px;align-items:center}.show-hero img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:22px;border:1px solid var(--line)}.show-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.episode-row{display:grid;grid-template-columns:1fr auto;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}.episode-row h3{font:800 15px Orbitron;margin:8px 0}.episode-row p{color:var(--muted);line-height:1.6;font-size:11px}.episode-actions{display:flex;gap:8px;align-items:center}.membership-intro{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:22px}.membership-intro p{max-width:720px;color:var(--muted);line-height:1.7}.tier-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.tier-card{padding:24px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.012));box-shadow:0 15px 45px rgba(0,0,0,.18)}.featured-tier{border-color:rgba(125,95,255,.65);box-shadow:0 0 30px rgba(125,95,255,.12)}.tier-top{display:flex;gap:8px;align-items:center;min-height:20px}.tier-badge{font-size:8px;padding:4px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}.tier-card h3{font:800 18px Orbitron;margin:16px 0 8px}.tier-card p{color:var(--muted);font-size:11px;line-height:1.6;min-height:44px}.tier-price{font:800 30px Orbitron;margin:20px 0 4px}.tier-price small{font:600 10px Montserrat;color:var(--muted);margin-left:5px}.tier-alt,.tier-note,.checkout-note{color:var(--muted);font-size:10px}.tier-benefits{list-style:none;padding:0;margin:18px 0;min-height:64px}.tier-benefits li{font-size:11px;margin:8px 0}.tier-actions{display:grid;gap:8px}.support-btn:disabled{opacity:.55;cursor:not-allowed}.subscription-active{display:grid;gap:4px;padding:12px 15px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);min-width:190px}.subscription-active strong{font:800 10px Orbitron}.subscription-active span{font-size:9px;color:var(--muted)}.checkout-note{margin-top:15px}@media(max-width:700px){.show-hero{grid-template-columns:1fr}.episode-row{grid-template-columns:1fr}.episode-actions{flex-wrap:wrap}.membership-intro{display:block}.subscription-active{margin-top:15px}}.subscription-active span{display:block}.manage-subscription{margin-top:8px;width:100%}</style></body></html>
