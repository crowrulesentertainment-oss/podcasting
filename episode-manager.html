<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>Episode Manager | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>
body{margin:0;background:#05050b;color:#f7f8ff;font-family:Montserrat,Arial,sans-serif}.wrap{width:min(1250px,calc(100% - 28px));margin:auto}.hero{padding:45px 0 25px}.eyebrow{color:#55e7ff;font:800 10px Orbitron;letter-spacing:.18em;text-transform:uppercase}.hero h1{font:800 clamp(34px,6vw,65px) Orbitron;margin:8px 0}.hero p{max-width:750px;color:#9299b4;line-height:1.7}.toolbar{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;margin:18px 0}.toolbar input,.toolbar select{padding:12px;border:1px solid rgba(130,150,255,.18);border-radius:11px;background:#0c0d18;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{padding:18px;border:1px solid rgba(130,150,255,.16);border-radius:19px;background:rgba(12,13,24,.9)}.row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px}.art{width:64px;height:64px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#55e7ff,#a879ff);color:#05050b;font:900 15px Orbitron}.art img{width:100%;height:100%;object-fit:cover}.title{font:800 15px Orbitron}.meta{margin-top:6px;color:#69718c;font-size:10px}.desc{margin:10px 0;color:#9299b4;font-size:11px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{padding:9px 12px;border-radius:10px;border:1px solid rgba(130,150,255,.2);background:rgba(255,255,255,.04);color:#fff;font-size:10px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#55e7ff,#a879ff);color:#05050b;border:0}.danger{border-color:rgba(255,109,131,.3);color:#ff9dad}.notice{display:none;margin:12px 0;padding:12px;border-radius:10px;background:rgba(255,109,131,.06);border:1px solid rgba(255,109,131,.2);color:#ffabb7;font-size:11px}.notice.show{display:block}.empty{text-align:center;padding:50px;color:#9299b4;border:1px dashed rgba(255,255,255,.1);border-radius:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}}

</head><body><main class="wrap"><a href="creator-studio.html" style="display:inline-block;margin-top:24px;color:#55e7ff;font-size:11px">← Creator Studio</a><section class="hero"><div class="eyebrow">Creator Control Room</div><h1>Episode Manager</h1><p>Manage the episodes belonging to your signed-in creator profile. Search by title, filter by podcast, and move directly into editing or publishing workflows.</p></section><div id="notice" class="notice"></div><div class="toolbar"><input id="q" type="search" placeholder="Search your episodes…"><select id="pod"><option value="">All podcasts</option></select><a class="btn primary" href="upload-episode.html" style="display:grid;place-items:center">+ Upload Episode</a></div><div id="count" class="meta">Loading…</div><section id="grid" class="grid" style="margin-top:12px"></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script>
<script src="js/platform-data.js"></script><script>
(()=>{"use strict";const $=x=>document.getElementById(x),db=window.CrowRulesData.getClient();let creator,all=[];const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));const fmt=n=>Number(n||0).toLocaleString();
function notice(s){$("notice").textContent=s;$("notice").classList.add("show")}
function render(){let q=$("q").value.toLowerCase().trim(),pid=$("pod").value,a=all.filter(e=>(!pid||e.podcast_id===pid)&&(!q||((e.title||"")+" "+(e.description||"")).toLowerCase().includes(q)));$("count").textContent=a.length+" episode"+(a.length===1?"":"s");$("grid").innerHTML=a.map(e=>'<article class="card"><div class="row"><div class="art">'+(e.thumbnail_url?'<img src="'+esc(e.thumbnail_url)+'" alt="">':"CR")+'</div><div><div class="title">'+esc(e.title||"Untitled Episode")+'</div><div class="meta">'+esc(e.podcast_title||"Podcast")+" · S"+esc(e.season_number||1)+" E"+esc(e.episode_number||"—")+" · "+esc(e.status||"draft")+" · "+fmt(e.play_count)+" plays"+'</div></div></div><p class="desc">'+esc(e.description||"No description yet.")+'</p><div class="actions"><a class="btn primary" href="episode.html?slug='+encodeURIComponent(e.slug||e.id)+'">View</a><a class="btn" href="edit-episode.html?id='+encodeURIComponent(e.id)+'">Edit</a><button class="btn" data-toggle="'+esc(e.id)+'" data-status="'+esc(e.status||"draft")+'">'+(e.status==="published"?"Unpublish":"Publish")+'</button><button class="btn danger" data-delete="'+esc(e.id)+'">Delete</button></div></article>').join("")||'<div class="empty">No episodes found. Upload your first episode to begin.</div>'}
async function boot(){try{let a=await window.CrowRulesData.getUser().then(user=>({data:{user}}));if(a.error)throw a.error;if(!a.data.user){location.href="login.html?redirect="+encodeURIComponent("episode-manager.html");return}let m=await db.from("members").select("id").eq("user_id",a.data.user.id).maybeSingle();if(m.error)throw m.error;if(!m.data)throw Error("No CrowRules membership profile found.");let c=await db.from("creators").select("id").eq("member_id",m.data.id).eq("is_active",true).maybeSingle();if(c.error)throw c.error;if(!c.data)throw Error("No active creator profile found.");creator=c.data;let p=await db.from("podcasts").select("id,title").eq("creator_id",creator.id).order("title");if(p.error)throw p.error;p.data.forEach(x=>{let o=document.createElement("option");o.value=x.id;o.textContent=x.title;$("pod").appendChild(o)});let r=await db.from("podcast_episodes").select("id,podcast_id,title,slug,description,episode_number,season_number,status,thumbnail_url,play_count,created_at").in("podcast_id",(p.data||[]).map(x=>x.id)).order("created_at",{ascending:false});if(r.error)throw r.error;all=(r.data||[]).map(e=>({...e,podcast_title:p.data.find(x=>x.id===e.podcast_id)?.title||"Podcast"}));render()}catch(e){notice(e.message||"Unable to load episode manager.");$("count").textContent="Unable to load."}}
$("q").oninput=render;$("pod").onchange=render;
document.addEventListener("click",async e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.toggle){b.disabled=true;let next=b.dataset.status==="published"?"draft":"published",patch={status:next,published_at:next==="published"?new Date().toISOString():null},r=await db.from("podcast_episodes").update(patch).eq("id",b.dataset.toggle);if(r.error)notice(r.error.message);else{all=all.map(x=>x.id===b.dataset.toggle?{...x,...patch}:x);render()}}if(b.dataset.delete){if(!confirm("Delete this episode record? The stored audio file is not automatically removed."))return;b.disabled=true;let r=await db.from("podcast_episodes").delete().eq("id",b.dataset.delete);if(r.error)notice(r.error.message);else{all=all.filter(x=>x.id!==b.dataset.delete);render()}}});
boot();
})();
</script></body></html>
