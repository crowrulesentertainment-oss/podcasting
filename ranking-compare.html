<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking Compare • CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting-platform.css?v=6"><script src="js/podcasting-config.js"></script><script src="js/podcasting-platform.js" defer></script><script src="js/ranking-intelligence-v64.js" defer></script></head><body><main class="cr-shell"><section class="hero"><div><div class="eyebrow">CrowRules Podcasting • V6.7 Phase 2</div><h1>RANKING<br>COMPARE.</h1><p>Side-by-side ranking intelligence across score, movement, momentum and member role.</p><a class="btn" href="social-rankings.html">← Rankings</a></div></section><section class="section"><div class="card panel"><div class="form-grid"><div class="field"><label>Member A</label><select id="a"></select></div><div class="field"><label>Member B</label><select id="b"></select></div></div><div id="compare" style="margin-top:20px"></div></div></section></main><script>document.addEventListener('crow:ready',async()=>{const $=x=>document.getElementById(x),E=CrowPodcasting.esc;const profiles=await CrowPodcasting.rows('cr_podcast_profiles_v5','user_id,handle,display_name,avatar_url,bio',{eq:{is_public:true},limit:1000});const rows=await CrowRankingV67.windows(500),map=new Map(rows.map(x=>[x.user_id,x]));for(const id of ['a','b'])$(id).innerHTML=profiles.map(p=>'<option value="'+E(p.user_id)+'">'+E(p.display_name||p.handle||'Listener')+' (@'+E(p.handle||'listener')+')</option>').join('');if(profiles.length>1)$('b').selectedIndex=1;const pub=new Map();for(const p of profiles)pub.set(p.user_id,p);function card(id){const p=pub.get(id)||{},x=map.get(id)||{};const role=x.reputation_score>0?'Creator / Listener':'Listener';const d=Number(x.delta_24h||0),r=d>0?'🔥 Rising':d<0?'↓ Falling':'Steady';return '<div class="card panel"><div class="eyebrow">'+role+'</div><h2>'+E(p.display_name||'Listener')+'</h2><p class="muted">@'+E(p.handle||'listener')+'</p><div class="grid"><div><b>Rank</b><h3>#'+E(x.rank_position||'—')+'</h3></div><div><b>Social Score</b><h3>'+E(Number(x.social_score||0).toFixed(0))+'</h3></div><div><b>Status</b><h3>'+r+'</h3></div></div><p>Reputation <b>'+E(Number(x.reputation_score||0).toFixed(0))+'</b> • Momentum <b>'+E(Number(x.velocity_score||0).toFixed(1))+'</b> • Engagement <b>'+E(Number(x.engagement_score||0).toFixed(0))+'</b></p><p>24H '+(d>=0?'+':'')+E(d.toFixed(0))+'</p></div>'}function render(){const a=map.get($('a').value)||{},b=map.get($('b').value)||{};const metrics=[['Social Score','social_score'],['Reputation','reputation_score'],['Momentum','velocity_score'],['Engagement','engagement_score'],['Affinity','affinity_score'],['Similarity','similarity_score']];const higher=(k)=>Number(a[k]||0)>=Number(b[k]||0)?'A':'B';const winner=Number(a.social_score||0)>=Number(b.social_score||0)?'A':'B';$('compare').innerHTML='<div class="grid">'+card($('a').value)+card($('b').value)+'</div><div class="card panel" style="margin-top:18px"><h2>Why the ranking differs</h2><p>'+winner+' currently has the higher Social Score. '+metrics.map(m=>m[0]+': '+higher(m[1])).join(' • ')+'</p><p class="muted">Historical 24H / 7D / 30D rank baselines appear as snapshots accumulate.</p></div>'}$('a').onchange=render;$('b').onchange=render;render()})</script></body></html>
