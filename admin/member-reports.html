<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Reports | CrowRules Podcasting</title><link rel="stylesheet" href="../assets/css/style.css"><style>:root{--c:#00e5ff;--v:#8b5cf6;--m:#9da5bd;--l:rgba(255,255,255,.1)}body{background:#030308;color:#fff}.shell{width:min(1100px,94%);margin:auto;padding:50px 0}.panel{border:1px solid var(--l);border-radius:22px;background:#0a0a16e8;padding:24px;margin-bottom:16px}.ey{font:900 10px Orbitron;color:var(--c);letter-spacing:.16em}.h{font:900 42px Orbitron;margin:10px 0}.muted{color:var(--m)}.report{border:1px solid var(--l);border-radius:16px;padding:18px;margin:10px 0}.topline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.names{font-weight:900}.reason{margin:12px 0;line-height:1.5}.meta{font-size:12px;color:var(--m)}select,button,.btn{border:1px solid var(--l);border-radius:10px;background:#10101a;color:#fff;padding:9px 12px}.btn{text-decoration:none;display:inline-block}.primary{background:linear-gradient(90deg,var(--c),var(--v));color:#030308} .actions{display:flex;gap:8px;flex-wrap:wrap}.history{margin-top:12px;padding:10px 12px;border:1px solid var(--l);border-radius:10px;background:#070711}.history-item{font-size:12px;color:var(--m);padding:5px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filter{cursor:pointer}.filter.active{background:linear-gradient(90deg,var(--c),var(--v));color:#030308}.filter span{opacity:.75;font-weight:900}</style></head><body><main class="shell"><section class="panel"><div class="ey">CROWRULES PODCASTING // TRUST & SAFETY</div><h1 class="h">Member Reports</h1><p class="muted">Administrator review queue for member reports.</p><div class="actions"><a class="btn" href="../admin.html">Command Center</a><a class="btn" href="../index.html">Podcasting</a><button id="refresh" class="primary">Refresh</button></div></section><section id="gate" class="panel">Checking administrator access…</section><section id="app" class="panel" style="display:none"><div class="filters"><button class="filter active" data-filter="all">ALL <span id="countAll">0</span></button><button class="filter" data-filter="open">OPEN <span id="countOpen">0</span></button><button class="filter" data-filter="reviewing">REVIEWING <span id="countReviewing">0</span></button><button class="filter" data-filter="resolved">RESOLVED <span id="countResolved">0</span></button><button class="filter" data-filter="dismissed">DISMISSED <span id="countDismissed">0</span></button></div><div id="list"></div></section></main><script src="../assets/js/app.js"></script><script>(async()=>{const sb=await loadSupabase(),gate=document.getElementById("gate"),app=document.getElementById("app"),list=document.getElementById("list"),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));let allRows=[],activeFilter="all";
async function showHistory(id,h){h.hidden=false;h.innerHTML='<div class="history-item">Loading history…</div>';const q=await sb.rpc("podcasting_admin_member_report_events",{p_report_id:id});if(q.error){h.innerHTML='<div class="history-item">'+esc(q.error.message)+'</div>';return}const rows=q.data||[];h.innerHTML=rows.length?rows.map(e=>'<div class="history-item">'+esc((e.old_status||"NEW").toUpperCase())+' → '+esc(e.new_status.toUpperCase())+' · '+new Date(e.created_at).toLocaleString()+'</div>').join(""):'<div class="history-item">No status changes recorded yet.</div>'}
function updateCounts(){document.getElementById("countAll").textContent=allRows.length;["open","reviewing","resolved","dismissed"].forEach(k=>document.getElementById("count"+k.charAt(0).toUpperCase()+k.slice(1)).textContent=allRows.filter(x=>x.status===k).length)}
async function render(){const rows=activeFilter==="all"?allRows:allRows.filter(x=>x.status===activeFilter);if(!rows.length){list.innerHTML="<p>No reports in this view.</p>";return}list.innerHTML=rows.map(x=>'<article class="report"><div class="topline"><div class="names">'+esc(x.reporter_name)+' → '+esc(x.reported_name)+'</div><select class="status" data-id="'+esc(x.id)+'"><option value="open" '+(x.status==="open"?"selected":"")+'>OPEN</option><option value="reviewing" '+(x.status==="reviewing"?"selected":"")+'>REVIEWING</option><option value="resolved" '+(x.status==="resolved"?"selected":"")+'>RESOLVED</option><option value="dismissed" '+(x.status==="dismissed"?"selected":"")+'>DISMISSED</option></select></div><div class="reason"><strong>Report:</strong> '+esc(x.reason)+'</div><div class="meta"><strong>Admin notes:</strong> '+esc(x.admin_notes||"None")+'</div><div class="meta">'+esc(x.reporter_username?"@"+x.reporter_username:"")+' · '+esc(x.reported_username?"@"+x.reported_username:"")+' · '+new Date(x.created_at).toLocaleString()+'</div><button class="history-toggle btn" data-id="'+esc(x.id)+'" type="button">View History</button><div class="history" data-history="'+esc(x.id)+'" hidden></div></article>').join("");
list.querySelectorAll(".status").forEach(s=>s.onchange=async()=>{const q=await sb.rpc("podcasting_admin_update_member_report",{report_id:s.dataset.id,new_status:s.value,notes:prompt("Optional administrator note:",(allRows.find(x=>x.id===s.dataset.id)||{}).admin_notes||"")});if(q.error){alert(q.error.message);await load()}else{const row=allRows.find(x=>x.id===s.dataset.id);if(row)row.status=s.value;updateCounts();await render()}});
list.querySelectorAll(".history-toggle").forEach(b=>b.onclick=async()=>{const h=list.querySelector('[data-history="'+b.dataset.id+'"]');if(!h)return;if(!h.hidden){h.hidden=true;b.textContent="View History";return}await showHistory(b.dataset.id,h);b.textContent="Hide History"});}
async function load(){const r=await sb.rpc("podcasting_admin_member_reports");if(r.error){list.innerHTML='<p>'+esc(r.error.message)+'</p>';return}allRows=r.data||[];updateCounts();await render()}
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});
async function init(){const {data:u}=await sb.auth.getUser();if(!u.user){gate.textContent="Please sign in as a CrowRules administrator.";return}const v=await sb.rpc("crowrules_is_admin");if(v.error||v.data!==true){gate.textContent="Administrator access was not verified.";return}gate.style.display="none";app.style.display="block";await load()}document.getElementById("refresh").onclick=load;init()})()</script></body></html>
