<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Reports | CrowRules Podcasting</title><link rel="stylesheet" href="../assets/css/style.css"><style>:root{--c:#00e5ff;--v:#8b5cf6;--m:#9da5bd;--l:rgba(255,255,255,.1)}body{background:#030308;color:#fff}.shell{width:min(1100px,94%);margin:auto;padding:50px 0}.panel{border:1px solid var(--l);border-radius:22px;background:#0a0a16e8;padding:24px;margin-bottom:16px}.ey{font:900 10px Orbitron;color:var(--c);letter-spacing:.16em}.h{font:900 42px Orbitron;margin:10px 0}.muted{color:var(--m)}.report{border:1px solid var(--l);border-radius:16px;padding:18px;margin:10px 0}.topline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.names{font-weight:900}.reason{margin:12px 0;line-height:1.5}.meta{font-size:12px;color:var(--m)}.resolution{margin-top:8px;padding:10px;border-left:2px solid var(--c);background:#070711;border-radius:8px;font-size:12px;color:var(--m)}select,button,.btn{border:1px solid var(--l);border-radius:10px;background:#10101a;color:#fff;padding:9px 12px}.btn{text-decoration:none;display:inline-block}.primary{background:linear-gradient(90deg,var(--c),var(--v));color:#030308} .actions{display:flex;gap:8px;flex-wrap:wrap}.history{margin-top:12px;padding:10px 12px;border:1px solid var(--l);border-radius:10px;background:#070711}.history-item{font-size:12px;color:var(--m);padding:5px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filter{cursor:pointer}.filter.active{background:linear-gradient(90deg,var(--c),var(--v));color:#030308}.filter span{opacity:.75;font-weight:900}.filters input,.filters select{min-width:220px;flex:1}.bulkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:12px;border:1px solid var(--l);border-radius:12px}.bulkbar label{font-size:13px}.bulkbar select{min-width:170px}.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--l)}</style></head><body><header class="nav"><a class="brand" href="../index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header><main class="shell"><section class="panel"><div class="ey">CROWRULES PODCASTING // TRUST & SAFETY</div><h1 class="h">Member Reports</h1><p class="muted">Administrator review queue for member reports.</p><div id="live" class="meta">● Live updates connecting…</div><div class="actions"><a class="btn" href="../admin.html">Command Center</a><a class="btn" href="../index.html">Podcasting</a><button id="refresh" class="primary">Refresh</button><button id="export" type="button">Export CSV</button></div></section><section id="gate" class="panel">Checking administrator access…</section><section id="app" class="panel" style="display:none"><div class="bulkbar"><label><input id="selectAll" type="checkbox"> Select page</label><select id="bulkStatus"><option value="">Bulk status…</option><option value="reviewing">REVIEWING</option><option value="resolved">RESOLVED</option><option value="dismissed">DISMISSED</option></select><button id="bulkApply" type="button">Apply to selected</button></div><div class="filters"><input id="search" type="search" placeholder="Search reports, members, usernames, reasons…" aria-label="Search reports"><select id="sort" aria-label="Sort reports"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select><button class="filter active" data-filter="all">ALL <span id="countAll">0</span></button><button class="filter" data-filter="open">OPEN <span id="countOpen">0</span></button><button class="filter" data-filter="reviewing">REVIEWING <span id="countReviewing">0</span></button><button class="filter" data-filter="resolved">RESOLVED <span id="countResolved">0</span></button><button class="filter" data-filter="dismissed">DISMISSED <span id="countDismissed">0</span></button></div><div id="list"></div><div class="pager"><button id="prevPage" type="button">← Previous</button><span id="pageInfo" class="meta">Page 1</span><button id="nextPage" type="button">Next →</button></div></section><div id="detailModal" hidden style="position:fixed;inset:0;background:#000b;z-index:1000;padding:20px;overflow:auto"><div style="max-width:760px;margin:6vh auto;background:#0a0a16;border:1px solid var(--l);border-radius:20px;padding:24px"><div class="topline"><h2 style="font:900 24px Orbitron;margin:0">Report Details</h2><button id="closeDetail" type="button">Close</button></div><div id="detailContent" style="margin-top:18px"></div><div id="detailEditor" style="margin-top:18px"></div></div></div></main><script src="../assets/js/app.js"></script><script>(async()=>{const sb=await loadSupabase(),gate=document.getElementById("gate"),app=document.getElementById("app"),list=document.getElementById("list"),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));let allRows=[],activeFilter="all",searchTerm="",sortOrder="newest",page=1,pageSize=25;
async function showHistory(id,h){h.hidden=false;h.innerHTML='<div class="history-item">Loading history…</div>';const q=await sb.rpc("podcasting_admin_member_report_events",{p_report_id:id});if(q.error){h.innerHTML='<div class="history-item">'+esc(q.error.message)+'</div>';return}const rows=q.data||[];h.innerHTML=rows.length?rows.map(e=>'<div class="history-item">'+esc((e.old_status||"NEW").toUpperCase())+' → '+esc(e.new_status.toUpperCase())+' · '+new Date(e.created_at).toLocaleString()+'</div>').join(""):'<div class="history-item">No status changes recorded yet.</div>'}
function updateCounts(){document.getElementById("countAll").textContent=allRows.length;["open","reviewing","resolved","dismissed"].forEach(k=>document.getElementById("count"+k.charAt(0).toUpperCase()+k.slice(1)).textContent=allRows.filter(x=>x.status===k).length)}
async function render(){let rows=activeFilter==="all"?allRows:allRows.filter(x=>x.status===activeFilter);if(searchTerm){const q=searchTerm.toLowerCase();rows=rows.filter(x=>[x.reporter_name,x.reported_name,x.reporter_username,x.reported_username,x.reason,x.admin_notes].some(v=>String(v??"").toLowerCase().includes(q)))}rows=[...rows].sort((a,b)=>sortOrder==="newest"?new Date(b.created_at)-new Date(a.created_at):new Date(a.created_at)-new Date(b.created_at));const totalPages=Math.max(1,Math.ceil(rows.length/pageSize));if(page>totalPages)page=totalPages;const start=(page-1)*pageSize;const visibleRows=rows.slice(start,start+pageSize);document.getElementById("pageInfo").textContent="Page "+page+" of "+totalPages+" · "+rows.length+" reports";document.getElementById("prevPage").disabled=page<=1;document.getElementById("nextPage").disabled=page>=totalPages;if(!rows.length){list.innerHTML="<p>No reports in this view.</p>";return}list.innerHTML=visibleRows.map(x=>'<article class="report"><div class="topline"><label><input class="report-check" type="checkbox" data-id="'+esc(x.id)+'" aria-label="Select report"></label><div class="names">'+esc(x.reporter_name)+' → '+esc(x.reported_name)+'</div><select class="status" data-id="'+esc(x.id)+'"><option value="open" '+(x.status==="open"?"selected":"")+'>OPEN</option><option value="reviewing" '+(x.status==="reviewing"?"selected":"")+'>REVIEWING</option><option value="resolved" '+(x.status==="resolved"?"selected":"")+'>RESOLVED</option><option value="dismissed" '+(x.status==="dismissed"?"selected":"")+'>DISMISSED</option></select></div><div class="reason"><strong>Report:</strong> '+esc(x.reason)+'</div><div class="meta"><strong>Admin notes:</strong> '+esc(x.admin_notes||"None")+'</div><button class="details btn" data-id="'+esc(x.id)+'" type="button">Open Details</button><button class="note btn" data-id="'+esc(x.id)+'" type="button">Edit Note</button><div class="meta">'+esc(x.reporter_username?"@"+x.reporter_username:"")+' · '+esc(x.reported_username?"@"+x.reported_username:"")+' · '+new Date(x.created_at).toLocaleString()+'</div><div class="resolution" data-resolution="'+esc(x.id)+'" hidden></div><button class="history-toggle btn" data-id="'+esc(x.id)+'" type="button">View History</button><div class="history" data-history="'+esc(x.id)+'" hidden></div></article>').join("");
document.getElementById("selectAll").onchange=e=>{list.querySelectorAll(".report-check").forEach(x=>x.checked=e.target.checked)};list.querySelectorAll(".resolution").forEach(async box=>{const row=allRows.find(x=>x.id===box.dataset.resolution);if(!row||!["resolved","dismissed"].includes(row.status))return;const q=await sb.rpc("podcasting_admin_member_report_resolution",{p_report_id:box.dataset.resolution});if(q.error)return;const d=q.data||{};if(!d.resolved_at)return;box.hidden=false;box.innerHTML="<strong>"+(row.status==="resolved"?"Resolved":"Dismissed")+"</strong> "+new Date(d.resolved_at).toLocaleString()+" · "+esc(d.resolved_by_username?"@"+d.resolved_by_username:(d.resolved_by_display_name||"Administrator"));});list.querySelectorAll(".details").forEach(b=>b.onclick=async()=>{const x=allRows.find(r=>r.id===b.dataset.id);if(!x)return;const profile=id=>id?"member-profile.html?user="+encodeURIComponent(id):"#";const modal=document.getElementById("detailModal"),box=document.getElementById("detailContent"),editor=document.getElementById("detailEditor");box.innerHTML="<div class=\"reason\"><strong>Report ID:</strong> "+esc(x.id)+"</div><div class=\"reason\"><strong>Reporter:</strong> <a class=\"btn\" href=\""+profile(x.reporter_user_id)+"\">"+esc(x.reporter_name||"Unknown")+"</a> "+esc(x.reporter_username?"@"+x.reporter_username:"")+"</div><div class=\"reason\"><strong>Reported member:</strong> <a class=\"btn\" href=\""+profile(x.reported_user_id)+"\">"+esc(x.reported_name||"Unknown")+"</a> "+esc(x.reported_username?"@"+x.reported_username:"")+"</div><div class=\"reason\"><strong>Reason:</strong><br>"+esc(x.reason)+"</div><div class=\"resolution\" id=\"modalResolution\">Loading resolution…</div><div class=\"history\" id=\"modalHistory\">Loading audit history…</div><div class=\"meta\">Created "+new Date(x.created_at).toLocaleString()+"</div>";editor.innerHTML="<div style=\"border:1px solid var(--l);border-radius:14px;padding:14px;background:#070711\"><strong>Moderation Controls</strong><div style=\"display:grid;gap:10px;margin-top:10px\"><label>Status<select id=\"modalStatus\" style=\"margin-left:8px\"><option value=\"open\">OPEN</option><option value=\"reviewing\">REVIEWING</option><option value=\"resolved\">RESOLVED</option><option value=\"dismissed\">DISMISSED</option></select></label><label>Administrator notes<textarea id=\"modalNotes\" rows=\"4\" style=\"width:100%;box-sizing:border-box;margin-top:6px;border:1px solid var(--l);border-radius:10px;background:#10101a;color:#fff;padding:10px\"></textarea></label><div class=\"actions\"><button id=\"saveModal\" class=\"primary\" type=\"button\">Save Changes</button><span id=\"modalSaveState\" class=\"meta\"></span></div></div></div>";document.getElementById("modalStatus").value=x.status;document.getElementById("modalNotes").value=x.admin_notes||"";modal.hidden=false;const rq=await sb.rpc("podcasting_admin_member_report_resolution",{p_report_id:x.id});const rd=rq.data||{};document.getElementById("modalResolution").innerHTML=["resolved","dismissed"].includes(x.status)&&rd.resolved_at?"<strong>"+esc(x.status==="resolved"?"Resolved":"Dismissed")+"</strong> "+new Date(rd.resolved_at).toLocaleString()+" · "+esc(rd.resolved_by_username?"@"+rd.resolved_by_username:(rd.resolved_by_display_name||"Administrator")):"<strong>Resolution:</strong> Not resolved";const hq=await sb.rpc("podcasting_admin_member_report_events",{p_report_id:x.id});const hs=hq.data||[];document.getElementById("modalHistory").innerHTML="<strong>Audit history</strong>"+(hs.length?hs.map(e=>"<div class=\"history-item\">"+esc((e.old_status||"NEW").toUpperCase())+" → "+esc(e.new_status.toUpperCase())+" · "+new Date(e.created_at).toLocaleString()+"</div>").join(""):"<div class=\"history-item\">No status changes recorded yet.</div>");document.getElementById("saveModal").onclick=async()=>{const status=document.getElementById("modalStatus").value,notes=document.getElementById("modalNotes").value,state=document.getElementById("modalSaveState");state.textContent="Saving…";const sq=await sb.rpc("podcasting_admin_update_member_report",{report_id:x.id,new_status:status,notes:notes});if(sq.error){state.textContent=sq.error.message;return}const nq=await sb.rpc("podcasting_admin_update_member_report_notes",{report_id:x.id,notes:notes});if(nq.error){state.textContent=nq.error.message;return}const row=allRows.find(r=>r.id===x.id);if(row){row.status=status;row.admin_notes=notes.trim()||null}state.textContent="Saved";updateCounts();setTimeout(()=>{modal.hidden=true;render()},300)}});list.querySelectorAll(".note").forEach(b=>b.onclick=async()=>{const id=b.dataset.id||b.closest(".report").querySelector(".report-check").dataset.id;const row=allRows.find(x=>x.id===id)||{};const value=prompt("Administrator note:",row.admin_notes||"");if(value===null)return;const q=await sb.rpc("podcasting_admin_update_member_report_notes",{report_id:id,notes:value});if(q.error){alert(q.error.message);return}row.admin_notes=value.trim()||null;await render()});list.querySelectorAll(".status").forEach(s=>s.onchange=async()=>{const q=await sb.rpc("podcasting_admin_update_member_report",{report_id:s.dataset.id,new_status:s.value,notes:prompt("Optional administrator note:",(allRows.find(x=>x.id===s.dataset.id)||{}).admin_notes||"")});if(q.error){alert(q.error.message);await load()}else{const row=allRows.find(x=>x.id===s.dataset.id);if(row)row.status=s.value;updateCounts();await render()}});
list.querySelectorAll(".history-toggle").forEach(b=>b.onclick=async()=>{const h=list.querySelector('[data-history="'+b.dataset.id+'"]');if(!h)return;if(!h.hidden){h.hidden=true;b.textContent="View History";return}await showHistory(b.dataset.id,h);b.textContent="Hide History"});}
async function load(){const r=await sb.rpc("podcasting_admin_member_reports");if(r.error){list.innerHTML='<p>'+esc(r.error.message)+'</p>';return}allRows=r.data||[];updateCounts();await render()}
document.getElementById("bulkApply").onclick=async()=>{const ids=[...list.querySelectorAll(".report-check:checked")].map(x=>x.dataset.id);const status=document.getElementById("bulkStatus").value;if(!ids.length||!status){alert("Select reports and a status first.");return}if(!confirm("Apply "+status.toUpperCase()+" to "+ids.length+" selected report(s)?"))return;const notes=prompt("Optional administrator note (leave blank to keep existing notes):","");const q=await sb.rpc("podcasting_admin_bulk_update_member_reports",{p_report_ids:ids,new_status:status,notes:notes===null?null:notes});if(q.error){alert(q.error.message);return}await load()};document.getElementById("closeDetail").onclick=()=>document.getElementById("detailModal").hidden=true;document.getElementById("detailModal").onclick=e=>{if(e.target.id==="detailModal")e.currentTarget.hidden=true};document.getElementById("export").onclick=()=>{let rows=activeFilter==="all"?allRows:allRows.filter(x=>x.status===activeFilter);if(searchTerm){const q=searchTerm.toLowerCase();rows=rows.filter(x=>[x.reporter_name,x.reported_name,x.reporter_username,x.reported_username,x.reason,x.admin_notes].some(v=>String(v??"").toLowerCase().includes(q)))}rows=[...rows].sort((a,b)=>sortOrder==="newest"?new Date(b.created_at)-new Date(a.created_at):new Date(a.created_at)-new Date(b.created_at));const csvRow=r=>[r.id,r.status,r.reporter_username?"@"+r.reporter_username:"",r.reported_username?"@"+r.reported_username:"",r.reason,r.admin_notes||"",r.created_at].map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",");const csv=["Report ID,Status,Reporter,Reported Member,Reason,Admin Notes,Created At",...rows.map(csvRow)].join("\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="crowrules-member-reports-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)};document.getElementById("search").oninput=e=>{searchTerm=e.target.value.trim();page=1;render()};document.getElementById("sort").onchange=e=>{sortOrder=e.target.value;page=1;render()};document.getElementById("prevPage").onclick=()=>{if(page>1){page--;render()}};document.getElementById("nextPage").onclick=()=>{page++;render()};document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;page=1;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});
const auditChannel=sb.channel("admin-member-report-events").on("postgres_changes",{event:"*",schema:"public",table:"podcast_member_report_events"},()=>{document.getElementById("live").textContent="● Live moderation history updated";load()}).subscribe();const channel=sb.channel("admin-member-reports").on("postgres_changes",{event:"*",schema:"public",table:"podcast_member_reports"},()=>{document.getElementById("live").textContent="● Live updates connected";load()}).subscribe(status=>{if(status==="SUBSCRIBED")document.getElementById("live").textContent="● Live updates connected";else if(status==="CHANNEL_ERROR")document.getElementById("live").textContent="● Live updates unavailable";});async function init(){const {data:u}=await sb.auth.getUser();if(!u.user){gate.textContent="Please sign in as a CrowRules administrator.";return}const v=await sb.rpc("crowrules_is_admin");if(v.error||v.data!==true){gate.textContent="Administrator access was not verified.";return}gate.style.display="none";app.style.display="block";await load()}document.getElementById("refresh").onclick=load;init()})()</script><script src="../js/crowrules-invite.js"></script>
