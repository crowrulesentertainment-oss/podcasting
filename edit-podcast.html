<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Podcast — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">CREATOR STUDIO · PODCAST MANAGEMENT</div><h1>Manage your <span class="gradient">show.</span></h1><section class="card"><form id="form" class="form"><label>Title<input id="title" required></label><label>Slug<input id="slug" required></label><label>Category<input id="category"></label><label>Description<textarea id="description"></textarea></label><label>Artwork URL<input id="artwork_url" type="url" placeholder="https://…"></label><label>Website URL<input id="website_url" type="url" placeholder="https://…"></label><label>Author name<input id="author_name"></label><label>Author email<input id="author_email" type="email"></label><label>Language<input id="language" value="en"></label><label>Copyright<input id="copyright"></label><button id="save" class="btn primary">Save Podcast</button></form><div id="status" class="notice" style="margin-top:15px">Loading…</div></section></main><script>addEventListener("crow:ready",async()=>{if(!__CROW_USER){status.textContent="Sign in first.";return}const id=new URLSearchParams(location.search).get("id");if(!id){status.textContent="Missing podcast id.";return}const r=await CROW_SUPABASE.from("podcasts").select("*").eq("id",id).eq("creator_id",__CROW_USER.id).maybeSingle();if(r.error||!r.data){status.textContent=r.error?.message||"Podcast not found or not owned by you.";return}const p=r.data;for(const k of ["title","slug","category","description","artwork_url","website_url","author_name","author_email","language","copyright"])if(document.getElementById(k))document.getElementById(k).value=p[k]||"";status.textContent="Podcast loaded.";form.onsubmit=async e=>{e.preventDefault();save.disabled=true;const data={title:title.value.trim(),slug:slug.value.trim(),category:category.value.trim()||null,description:description.value.trim()||null,artwork_url:artwork_url.value.trim()||null,website_url:website_url.value.trim()||null,author_name:author_name.value.trim()||null,author_email:author_email.value.trim()||null,language:language.value.trim()||"en",copyright:copyright.value.trim()||null};const q=await CROW_SUPABASE.from("podcasts").update(data).eq("id",id).eq("creator_id",__CROW_USER.id);save.disabled=false;status.textContent=q.error?q.error.message:"Podcast saved.";}});</script></body></html>
