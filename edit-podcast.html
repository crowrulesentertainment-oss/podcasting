(()=>{"use strict";const $=x=>document.getElementById(x),db=window.CrowRulesData.getClient(),id=new URLSearchParams(location.search).get("id");let creator,p;const clean=v=>String(v||"").trim(),slug=v=>clean(v).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,120),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));function msg(s,ok=false){$("notice").textContent=s;$("notice").className="notice show"+(ok?" ok":"")}async function boot(){try{if(!id)throw Error("Missing podcast ID.");let a=await window.CrowRulesData.getUser().then(user => ({data:{user}}));if(!a.data.user){location.href="login.html?redirect="+encodeURIComponent("edit-podcast.html?id="+id);return}let m=await db.from("members").select("id").eq("user_id",a.data.user.id).maybeSingle();if(m.error)throw m.error;if(!m.data)throw Error("No CrowRules membership profile found.");let c=await db.from("creators").select("id").eq("member_id",m.data.id).eq("is_active",true).maybeSingle();if(c.error)throw c.error;if(!c.data)throw Error("No active creator profile found.");creator=c.data;let r=await db.from("podcasts").select("id,creator_id,title,slug,category,description,artwork_url,trailer_url,website_url,rss_url,status,is_featured,is_live,listener_count,total_plays").eq("id",id).eq("creator_id",creator.id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error("Podcast not found or access denied.");p=r.data;$("title").value=p.title||"";$("category").value=p.category||"";$("slug").value=p.slug||"";$("description").value=p.description||"";$("artwork").value=p.artwork_url||"";$("trailer").value=p.trailer_url||"";$("website").value=p.website_url||"";$("rss").value=p.rss_url||"";$("status").value=p.status||"draft";$("live").value=String(!!p.is_live);$("featured").value=String(!!p.is_featured);$("view").href="podcast.html?id="+encodeURIComponent(id);$("preview").style.display="flex";$("preview").innerHTML=(p.artwork_url?'<img src="'+esc(p.artwork_url)+'" alt="">':"")+"<div><strong>"+esc(p.title)+"</strong><div class=\"chips\"><span class=\"chip\">"+Number(p.listener_count||0).toLocaleString()+" listeners</span><span class=\"chip\">"+Number(p.total_plays||0).toLocaleString()+" plays</span></div></div>"}catch(e){msg(e.message||"Unable to load podcast.");$("form").style.display="none"}}$("form").addEventListener("submit",async e=>{e.preventDefault();$("save").disabled=true;try{let title=clean($("title").value),description=clean($("description").value),s=slug($("slug").value)||slug(title);if(!title||!description||!s)throw Error("Podcast name, slug, and description are required.");let patch={title,slug:s,category:clean($("category").value)||null,description,artwork_url:clean($("artwork").value)||null,trailer_url:clean($("trailer").value)||null,website_url:clean($("website").value)||null,rss_url:clean($("rss").value)||null,status:$("status").value,is_live:$("live").value==="true",is_featured:$("featured").value==="true",updated_at:new Date().toISOString()};let r=await db.from("podcasts").update(patch).eq("id",p.id).eq("creator_id",creator.id);if(r.error)throw r.error;msg("Podcast updated successfully.",true);setTimeout(()=>location.href="podcast-manager.html",900)}catch(e){msg(e.message||"Unable to save podcast.")}finally{$("save").disabled=false}});boot()})();
