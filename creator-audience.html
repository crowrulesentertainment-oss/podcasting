<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Audience — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">AUDIENCE</div><h1>Your <span class="gradient">listeners.</span></h1><div id="auth" class="notice">Loading audience…</div><div id="stats" class="grid"></div><section class="section"><div class="card"><h2>Shows</h2><div id="shows">Loading…</div></div></section></main><script>addEventListener("crow:ready",async()=>{if(!__CROW_USER){auth.textContent="Sign in to view your audience.";return}const p=await CROW_SUPABASE.from("podcasts").select("id,title,listener_count,total_plays").eq("creator_id",__CROW_USER.id);const ps=p.data||[];const follows=await CROW_SUPABASE.from("podcast_follows").select("id,podcast_id").in("podcast_id",ps.map(x=>x.id));const subs=await CROW_SUPABASE.from("podcast_subscriptions").select("id,podcast_id,status").in("podcast_id",ps.map(x=>x.id)).eq("status","active");const totalListeners=ps.reduce((n,x)=>n+Number(x.listener_count||0),0),plays=ps.reduce((n,x)=>n+Number(x.total_plays||0),0);stats.innerHTML=[[""+totalListeners,"Listeners"],[""+(follows.data||[]).length,"Follows"],[""+(subs.data||[]).length,"Active subscribers"],[""+plays,"Total plays"]].map(x=>'<div class="card"><div class="stat">'+x[0]+'</div><p>'+x[1]+'</p></div>').join("");shows.innerHTML=ps.map(x=>'<div class="activity-row"><strong>'+String(x.title).replace(/</g,"&lt;")+'</strong><span>'+Number(x.listener_count||0)+' listeners</span><span>'+Number(x.total_plays||0)+' plays</span></div>').join("")||"<p>No shows yet.</p>";auth.textContent="Audience data synced.";});</script></body></html>
