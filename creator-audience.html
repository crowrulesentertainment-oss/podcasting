<main class="wrap hero"><div class="eyebrow">AUDIENCE</div><h1>Your <span class="gradient">listeners.</span></h1><div id="auth" class="notice">Loading audience…</div><div id="stats" class="grid"></div><section class="section"><div class="card"><h2>Shows</h2><div id="shows">Loading…</div></div></section></main><script>addEventListener("crow:ready",async()=>{if(!window.__CROW_USER){auth.textContent="Sign in to view your audience.";return}try{const data=window.CROW_DATA?.snapshot?.()||{},ps=(data.catalog?.podcasts||[]).filter(p=>String(p.creator_id)===String(window.__CROW_USER.id)),ids=ps.map(x=>x.id);const follows=ids.length?await window.CROW_SUPABASE.from("podcast_follows").select("id,podcast_id").in("podcast_id",ids):{data:[]};const subs=ids.length?await window.CROW_SUPABASE.from("podcast_subscriptions").select("id,podcast_id,status").in("podcast_id",ids).eq("status","active"):{data:[]};const totalListeners=ps.reduce((n,x)=>n+Number(x.listener_count||0),0),plays=ps.reduce((n,x)=>n+Number(x.total_plays||0),0);stats.innerHTML=[[""+totalListeners,"Listeners"],[""+(follows.data||[]).length,"Follows"],[""+(subs.data||[]).length,"Active subscribers"],[""+plays,"Total plays"]].map(x=>'<div class="card"><div class="stat">'+x[0]+'</div><p>'+x[1]+'</p></div>').join("");shows.innerHTML=ps.map(x=>'<div class="activity-row"><strong>'+String(x.title).replace(/</g,"&lt;")+'</strong><span>'+Number(x.listener_count||0)+' listeners</span><span>'+Number(x.total_plays||0)+' plays</span></div>').join("")||"<p>No shows yet.</p>";auth.textContent="Audience catalog synced with CROW_DATA."}catch(e){auth.textContent="Audience unavailable: "+(e.message||e)}});</script>
