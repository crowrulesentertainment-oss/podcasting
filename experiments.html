<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Experiments — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script type="module" src="js/app.js"></script><style>.exp-form{display:grid;gap:14px}.exp-form input,.exp-form textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;background:#090914;color:inherit;border:1px solid rgba(255,255,255,.12)}.exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.exp-card{padding:20px}.delta{font-size:18px;font-weight:700}@media(max-width:800px){.exp-grid{grid-template-columns:1fr}}</style></head><body><div data-nav></div><main class="page"><section class="hero"><p class="eyebrow">CREATOR OS • 5.28</p><h1>Evidence-Aware Experiment Review</h1><p>Review the complete evidence packet before approving an experiment. Approval happens before baseline capture begins.</p></section><div class="exp-grid"><section class="panel exp-card"><h2>New Experiment</h2><form id="form" class="exp-form"><input id="name" placeholder="Experiment name" required><textarea id="hypothesis" rows="4" placeholder="What are you testing?"></textarea><input id="podcast" placeholder="Podcast ID (optional)"><label>Baseline days <input id="bd" type="number" min="1" max="90" value="7"></label><label>Measurement days <input id="md" type="number" min="1" max="90" value="7"></label><button class="btn primary">Start Experiment</button></form></section><section><div id="list" class="action-list">Loading experiments…</div></section></div></main><script type="module" src="js/experiments.js"></script></body></html>
