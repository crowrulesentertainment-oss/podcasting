<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Episode — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script type="module" src="js/app.js"></script></head><body><div data-nav></div><main class="page narrow"><header class="page-head"><p class="eyebrow">CREATOR STUDIO</p><h1>Add an episode.</h1><p>Prepare the next transmission for your audience.</p></header><form class="form panel" data-demo-form><label>Podcast<select name="podcast"><option>Bonded in Mystery</option><option>Tacoma Nights</option><option>Bird Brains</option></select></label><label>Episode title<input required name="title" placeholder="Episode title"></label><label>Audio URL<input required name="audio_url" placeholder="https://…"></label><label>Episode notes<textarea name="notes" rows="6" placeholder="Show notes, links and credits"></textarea></label><label><input type="checkbox" name="premium"> Premium subscriber episode</label><div class="form-actions"><a class="btn" href="studio.html">Cancel</a><button class="btn primary" type="submit">Publish episode</button></div></form></main></body></html>
