<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Episode — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script type="module" src="js/app.js"></script><script type="module" src="js/publishing.js"></script></head><body><div data-nav></div><main class="page narrow"><header class="page-head"><p class="eyebrow">CREATOR STUDIO / MEDIA PIPELINE</p><h1>Publish an episode.</h1><p>Upload real media, detect duration, add show notes and choose free or premium access. Save as a draft or submit it for review.</p></header><form class="form panel" data-add-episode><label>Podcast<select required name="podcast_id"></select></label><label>Episode title<input required name="title" placeholder="Episode title"></label><div class="split"><label>Season<input name="season_number" type="number" min="1"></label><label>Episode #<input name="episode_number" type="number" min="1"></label></div><label>Description<textarea name="description" rows="4" placeholder="Short episode description"></textarea></label><label>Show notes<textarea name="show_notes" rows="7" placeholder="Links, credits, resources and notes"></textarea></label><label>Audio / video file<input required name="media_file" type="file" accept="audio/*,video/mp4,video/webm,video/quicktime"></label><p class="notice" data-duration>Choose a media file to detect duration.</p><label>Episode artwork<input name="artwork_file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><label>Access<select name="access_level"><option value="free">Free — public episode</option><option value="premium">Premium — active subscribers only</option></select></label><label><input type="checkbox" name="is_explicit"> Mark as explicit</label><label><input type="checkbox" name="submit_review" checked> Submit for review after upload</label><div class="form-actions"><a class="btn" href="studio.html">Cancel</a><button class="btn primary" type="submit">Upload & submit</button></div></form></main></body></html>
