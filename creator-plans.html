<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Plans — CrowRules Podcasting</title><link rel="stylesheet" href="css/crow-podcasting-rebuild.css?v=20261004-v14.8"><link rel="stylesheet" href="css/halloween-cinematic-v2.css?v=20261004-v14.8"><link rel="stylesheet" href="css/crow-podcasting-player-v13-3.css?v=20261004-v14.8"><script src="js/crowrules-db-bootstrap-v2.js?v=20261004-v14.8"></script><script src="js/crow-podcasting-intelligence-v13.js?v=20261004-v14.8"></script><script src="js/crow-podcasting-player-v13-3.js?v=20261004-v14.8"></script><script src="js/sitewide-v13.js?v=20261004-v14.8"></script><style>.wrap{max-width:1200px;margin:auto}.panel{padding:22px;border:1px solid #ffffff16;border-radius:18px;background:#080710eF;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}label{font:800 9px Orbitron;letter-spacing:.12em;color:#9ba7ba}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ffffff16;border-radius:10px;background:#05040a;color:#fff}textarea{min-height:90px}.btn{padding:10px 14px;border-radius:10px;border:1px solid #ffffff18;background:#ffffff08;color:#fff;cursor:pointer;font:800 9px Orbitron}.primary{border-color:#65f2ff44}.danger{border-color:#ff526844;color:#ff9bac}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:18px;border:1px solid #ffffff12;border-radius:14px;background:#ffffff04}.muted,.small{color:#8793a7}.small{font-size:.68rem}.notice{padding:12px;border-radius:10px;border:1px solid #65f2ff22}.error{border-color:#ff526844;color:#ff9bac}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:800px){.grid,.cards{grid-template-columns:1fr}}</style>

</head><bodyclass="cr-halloween-theme"><main class="cr-main wrap"><header><div class="cr-kicker">CROWRULES CREATOR STUDIO / STRIPE</div><h1>Podcast Subscription Plans</h1><p class="muted">Choose the podcast first. Every recurring plan is owned by that podcast.</p></header><div id="status" class="notice">Connecting…</div><section class="panel"><h2>Create plan</h2><form id="form"><div class="grid"><div class="field full"><label>PODCAST</label><select id="podcast" required><option>Loading…</option></select></div><div class="field"><label>PLAN NAME</label><input id="name" maxlength="120" required placeholder="Supporter"></div><div class="field"><label>PRICE USD</label><input id="amount" type="number" min="0.50" step="0.01" required placeholder="5.00"></div><div class="field"><label>BILLING</label><select id="interval"><option value="month">Monthly</option><option value="year">Yearly</option></select></div><div class="field"><label>TRIAL DAYS</label><input id="trial" type="number" min="0" max="365" value="0"></div><div class="field full"><label>DESCRIPTION</label><textarea id="description" maxlength="2000"></textarea></div><div class="field full"><label>CONFIRM</label><label><input id="confirm" type="checkbox" required> I confirm this plan belongs to the selected podcast.</label></div></div><div class="actions"><button class="btn primary" id="create" type="submit">CREATE STRIPE PLAN</button></div></form></section><section class="panel"><div class="actions"><h2 style="margin-right:auto">Your Plans</h2><a class="btn" href="creator-monetization-center.html">Monetization</a></div><div id="plans" class="cards"><div class="card">Loading…</div></div></section></main><script>(()=>{const $=id=>document.getElementById(id),API='https://cevylpnoexugwgygvtgu.supabase.co/functions/v1/creator-subscription-manager',esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),money=v=>'$'+(Number(v||0)/100).toFixed(2);let podcasts=[],plans=[],creator=null;const say=(m,e=false)=>{$('status').textContent=m;$('status').classList.toggle('error',e)};async function call(action,data={}){const session=await (window.CROW_DATA?.getSession?.()||window.CROW_PODCASTING_V17_3?.getSession?.());if(!session?.access_token)throw Error('Session expired. Sign in again.');const r=await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action,...data})});const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw Error(d.error||'Subscription manager error.');return d}async function load(){const d=window.CROW_MONETIZATION_DOMAIN||window.CROW_DOMAIN_SERVICES?.monetization;if(!d)throw Error('Podcast monetization domain is still initializing.');const creatorService=window.CROW_DOMAIN_SERVICES?.creator;if(!creatorService)throw Error('Creator domain is still initializing.');creator=await creatorService.me();if(!creator?.id)throw Error('No active creator profile found.');const [owned,creatorPlans]=await Promise.all([creatorService.podcasts(creator.id),d.creatorPlans(creator.id)]);podcasts=owned||[];plans=creatorPlans||[];const s=$('podcast'),old=s.value;s.innerHTML='<option value="">Choose a podcast…</option>'+podcasts.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.title)+' · '+esc(p.slug)+'</option>').join('');if(podcasts.some(p=>p.id===old))s.value=old;render();say('SUPABASE DOMAIN ONLINE · STRIPE CATALOG READY')}function render(){const h=$('plans');if(!plans.length){h.innerHTML='<div class="card">No plans yet.</div>';return}h.innerHTML=plans.map(p=>{const pod=podcasts.find(x=>x.id===p.podcast_id);return '<article class="card"><b>'+esc(p.name)+'</b><div class="small">'+esc(pod?.title||'Podcast')+' · /'+esc(pod?.slug||'unknown')+'</div><h3>'+money(p.amount_cents)+' / '+esc(p.interval||'month')+'</h3><div class="small">'+Number(p.subscriber_count||0)+' active subscribers</div><div class="actions" style="margin-top:10px">'+(p.active?'<button class="btn danger" data-id="'+esc(p.id)+'" data-action="deactivate">ARCHIVE / DEACTIVATE</button>':'<button class="btn primary" data-id="'+esc(p.id)+'" data-action="activate">ACTIVATE</button>')+'</div></article>'}).join('')}$('form').onsubmit=async e=>{e.preventDefault();try{if(!$('podcast').value)throw Error('Choose a podcast first.');if(!$('confirm').checked)throw Error('Confirm the selected podcast.');const amount=Math.round(Number($('amount').value)*100);if(!Number.isInteger(amount)||amount<50)throw Error('Price must be at least $0.50.');$('create').disabled=true;say('Creating Stripe Product + Price…');await call('create',{podcast_id:$('podcast').value,name:$('name').value.trim(),amount_cents:amount,interval:$('interval').value,interval_count:1,trial_period_days:Number($('trial').value||0),description:$('description').value.trim()});e.target.reset();await load();say('PLAN CREATED · SUPABASE + STRIPE SYNCHRONIZED')}catch(x){say(x.message||'Unable to create plan.',true)}finally{$('create').disabled=false}};$('plans').onclick=async e=>{const b=e.target.closest('[data-action]');if(!b)return;try{b.disabled=true;const p=plans.find(x=>x.id===b.dataset.id);if(!p)throw Error('Plan not found.');if(b.dataset.action==='deactivate'){say('Deactivating Stripe Price + Product…');await call('deactivate',{id:p.id})}else{say('Activating plan…');await call('update',{id:p.id,name:p.name,description:p.description||'',amount_cents:p.amount_cents,interval:p.interval,interval_count:p.interval_count||1,trial_period_days:p.trial_period_days||0,active:true})}await load()}catch(x){say(x.message||'Plan update failed.',true)}finally{b.disabled=false}};async function boot(){try{const wait=async()=>{if(window.CROW_DOMAIN_SERVICES)return;await new Promise(r=>setTimeout(r,100));return wait()};await wait();const session=await (window.CROW_DATA?.getSession?.()||window.CROW_PODCASTING_V17_3?.getSession?.());if(!session?.user)throw Error('Sign in to manage creator plans.');await load()}catch(e){say(e.message||'Unable to initialize.',true)}}boot()})();</script><script>(function(){function boot(){const d=window.CROW_DOMAIN_SERVICES;if(!d)return setTimeout(boot,100);window.CROW_MONETIZATION_DOMAIN=d.monetization;window.dispatchEvent(new CustomEvent("crow:domain:monetization",{detail:d.monetization}))}boot()})();</script>
