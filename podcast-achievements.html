<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>
(()=>{const $=x=>document.getElementById(x),db=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),fmt=n=>Number(n||0).toLocaleString(),icons={published_episodes:"🎙️",total_plays:"▶️",unique_listeners:"👥",returning_listeners:"🔁",listening_seconds:"⏱️"},notice=m=>$("notice").innerHTML='<div class="panel">'+esc(m)+'</div>';
async function boot(){try{const id=new URLSearchParams(location.search).get("id");if(!id){location.href="podcast-manager.html";return}$("back").href="podcast-goals.html?id="+encodeURIComponent(id);const u=await db.auth.getUser();if(!u.data.user){location.href="login.html?redirect="+encodeURIComponent("podcast-achievements.html?id="+id);return}const m=await db.from("members").select("id").eq("user_id",u.data.user.id).maybeSingle();if(!m.data)throw Error("No CrowRules membership profile found.");const c=await db.from("creators").select("id").eq("member_id",m.data.id).eq("is_active",true).maybeSingle();if(!c.data)throw Error("No active creator profile found.");const p=await db.from("podcasts").select("id,title").eq("id",id).eq("creator_id",c.data.id).maybeSingle();if(!p.data)throw Error("Podcast not found or you do not own it.");await db.rpc("capture_podcast_creator_goal_snapshots",{p_podcast_id:id});await db.rpc("capture_podcast_creator_achievements",{p_podcast_id:id});const q=await db.rpc("get_podcast_creator_achievements",{p_podcast_id:id});if(q.error)throw q.error;const rows=q.data||[];$("hero").innerHTML='<div class="ey">Creator Milestone Celebrations</div><h1>'+esc(p.data.title)+'</h1><p class="desc">Your completed creator goals become permanent CrowRules achievements.</p><div class="note">Achievements are records of milestones already reached. They do not rank creators or predict future performance.</div>';$("stats").innerHTML='<div class="stat"><div class="label">Achievements</div><div class="value">'+fmt(rows.length)+'</div></div><div class="stat"><div class="label">Milestones Earned</div><div class="value">'+fmt(new Set(rows.map(x=>x.goal_id)).size)+'</div></div><div class="stat"><div class="label">Latest</div><div class="value" style="font-size:13px">'+(rows[0]?new Date(rows[0].achieved_at).toLocaleDateString():"—")+'</div></div>';$("share").innerHTML='<div class="ey">Celebration Card</div><div id="shareCard" class="share-card"><div class="big">🏆 '+esc(rows[0]?rows[0].title:"Creator Milestone")+'</div><div class="small">'+esc(rows[0]?rows[0].description:"A CrowRules Podcasting achievement.")+'</div><div class="brand">CROWRULES PODCASTING · THE NEXT CHAPTER</div></div><div class="share-tools"><button class="btn" id="copyShare">COPY SHARE TEXT</button><button class="btn" id="nativeShare">SHARE</button></div>';$("main").innerHTML='<div class="ey">Achievement History</div><h2>Milestones you reached</h2><p class="muted">Every card represents a completed goal recorded for this podcast.</p>'+(rows.length?'<div class="cards">'+rows.map(x=>'<article class="card"><div class="icon">'+(icons[x.goal_type]||"🏆")+'</div><div class="title">'+esc(x.title)+'</div><div class="copy">'+esc(x.description)+'</div><div class="copy"><b>'+fmt(x.achieved_value)+'</b> / '+fmt(x.target_value)+'</div><div class="date">ACHIEVED '+new Date(x.achieved_at).toLocaleString()+'</div></article>').join("")+'</div>':'<div class="empty">No achievements yet. When a goal reaches 100%, it can be preserved here as a permanent milestone.</div>')+'<div class="actions"><a class="btn" href="podcast-goals.html?id='+id+'">Goals & Milestones</a><a class="btn" href="podcast-goal-history.html?id='+id+'">Progress Timeline</a><a class="btn" href="creator-action-center.html?id='+id+'">Action Center</a></div>';$("hero").hidden=$("stats").hidden=$("main").hidden=$("share").hidden=false;
if(rows.length){document.getElementById("copyShare").onclick=async()=>{const x=rows[0];const text="🏆 "+x.title+" — I reached a CrowRules Podcasting creator milestone!";try{await navigator.clipboard.writeText(text);document.getElementById("copyShare").textContent="COPIED ✓"}catch{window.prompt("Copy your celebration text:",text)}};document.getElementById("nativeShare").onclick=async()=>{const x=rows[0];const text="🏆 "+x.title+" — I reached a CrowRules Podcasting creator milestone!";if(navigator.share){await navigator.share({title:x.title,text,url:location.href})}else{window.prompt("Copy your celebration text:",text)}}}}catch(e){console.error(e);notice(e.message||"Unable to load achievements.")}}boot()})();
