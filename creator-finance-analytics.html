<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance Analytics | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>:root{--bg:#05050b;--line:rgba(255,255,255,.1);--cyan:#55e7ff;--purple:#a879ff;--muted:#9ba3bb}body{margin:0;background:radial-gradient(circle at 15% 0%,rgba(85,231,255,.12),transparent 30%),var(--bg);color:#fff;font-family:Montserrat,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:44px 18px 80px}.ey{font:800 10px Orbitron;letter-spacing:.18em;color:var(--cyan)}h1{font:800 clamp(36px,6vw,68px)/.95 Orbitron;margin:10px 0}h1 span{color:var(--cyan)}.sub{color:var(--muted);line-height:1.7;max-width:760px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.btn{padding:10px 15px;border-radius:10px;border:1px solid var(--line);background:#0b0c16;color:#fff;cursor:pointer}.btn.active{border-color:var(--cyan);box-shadow:0 0 18px rgba(85,231,255,.12)}.card{border:1px solid var(--line);border-radius:18px;background:rgba(10,11,21,.9);padding:20px;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.label{font-size:9px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}.value{font:800 25px Orbitron;margin-top:8px}.chart{height:250px;display:flex;align-items:end;gap:5px;overflow-x:auto;padding-top:25px}.bar{min-width:22px;flex:1;max-width:60px;background:linear-gradient(180deg,var(--cyan),var(--purple));border-radius:5px 5px 0 0;position:relative}.bar i{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font:8px Orbitron;color:var(--muted);font-style:normal}.months{display:flex;gap:5px;overflow-x:auto}.month{min-width:22px;flex:1;max-width:60px;text-align:center;font-size:8px;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:right;font-size:10px}th:first-child,td:firs </head><body><header class="site-header"><div class="site-header-inner"><a class="brand" href="creator-finance-command-center.html"><span class="brand-mark">CR</span><span class="brand-text"><span class="brand-name">CROW<span class="glow">RULES</span></span><span class="brand-section">PODCASTING</span></span></a><nav class="main-navigation"><a href="creator-finance-command-center.html">Finance HQ</a><a href="payout-center.html">Payouts</a></nav></div></header><main class="wrap"><div class="ey">CREATOR FINANCE · ANALYTICS 23.0</div><h1>SEE THE <span>FINANCIAL STORY.</span></h1><p class="sub">Explore monthly revenue, creator earnings, adjustments and completed payouts from your authenticated creator ledger.</p><div class="toolbar"><button class="btn active" data-m="6">6 Months</button><button class="btn" data-m="12">12 Months</button><button class="btn" data-m="24">24 Months</button><button class="btn" data-m="36">36 Months</button></div><div id="app"><div class="notice">Loading analytics…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script>
<script src="js/platform-data.js"></script><script>(async()=>{const db=window.CrowRulesData.getClient(),app=document.getElementById('app');const {data:{user}}=await window.CrowRulesData.getUser().then(user=>({data:{user}}));if(!user){location.href='login.html?redirect=creator-finance-analytics.html';return}let months=12;const money=n=>Number(n||0)/100;async function load(){const {data,error}=await db.rpc('get_my_podcast_finance_trends',{p_months:months});if(error){app.innerHTML='<div class="notice">'+error.message+'</div>';return}if(!data?.length){app.innerHTML='<div class="notice">No financial activity is currently available.</div>';return}const cur=data[0].currency;const f=n=>money(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' '+cur.toUpperCase();const gross=data.reduce((a,x)=>a+money(x.gross_cents),0),net=data.reduce((a,x)=>a+money(x.creator_net_cents),0),paid=data.reduce((a,x)=>a+money(x.paid_out_cents),0),tx=data.reduce((a,x)=>a+Number(x.transaction_count||0),0),max=Math.max(...data.map(x=>money(x.gross_cents)),1);app.innerHTML='<div class="stats"><div class="card"><div class="label">Period Gross</div><div class="value">'+f(gross*100)+'</div></div><div class="card"><div class="label">Creator Net</div><div class="value">'+f(net*100)+'</div></div><div class="card"><div class="label">Paid Out</div><div class="value">'+f(paid*100)+'</div></div><div class="card"><div class="label">Transactions</div><div class="value">'+tx.toLocaleString()+'</div></div></div><div class="card"><div class="ey">MONTHLY GROSS REVENUE</div><div class="chart">'+data.map(x=>'<div class="bar" style="height:'+Math.max(4,money(x.gross_cents)/max*210)+'px"><i>'+Math.round(money(x.gross_cents))+'</i></div>').join('')+'</div><div class="months">'+data.map(x=>'<div class="month">'+new Date(x.month_start+'T12:00:00').toLocaleDateString(undefined,{month:'short',year:'2-digit'})+'</div>').join('')+'</div></div><div class="card"><div class="scroll"><table><thead><tr><th>MONTH</th><th>GROSS</th><th>FEES</th><th>REFUNDS</th><th>DISPUTES</th><th>CREATOR NET</th><th>PAID OUT</th></tr></thead><tbody>'+data.slice().reverse().map(x=>'<tr><td>'+new Date(x.month_start+'T12:00:00').toLocaleDateString(undefined,{month:'short',year:'numeric'})+'</td><td>'+f(x.gross_cents)+'</td><td>'+f(x.platform_fee_cents)+'</td><td>'+f(x.refund_cents)+'</td><td>'+f(x.dispute_cents)+'</td><td>'+f(x.creator_net_cents)+'</td><td>'+f(x.paid_out_cents)+'</td></tr>').join('')+'</tbody></table></div></div><div class="notice">Analytics summarize CrowRules financial records. They are not tax advice or an official tax statement.</div>'}load();document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('active'));b.classList.add('active');months=Number(b.dataset.m);load()})})()</script></body></html>
