<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>Financial Audit Center | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>body{background:#05050b;color:#fff;font-family:Montserrat,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:40px 20px}.hero{padding:36px 0}.eyebrow{letter-spacing:.18em;opacity:.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:1px solid #27273b;border-radius:16px;padding:20px;background:#0b0b16}.table{margin-top:20px;overflow:auto}.row{display:grid;grid-template-columns:1.5fr 2fr 1fr 1.5fr 1.5fr;gap:12px;padding:14px;border-bottom:1px solid #202033;min-width:850px}.head{font-size:12px;text-transform:uppercase;opacity:.6}.status{font-weight:700}.ok{color:#7fffd4}.bad{color:#ff8f8f}a{color:#8fdcff}</style></head><body><main class="wrap"><section class="hero"><div class="eyebrow">CROWRULES PODCASTING • MONETIZATION 16.0</div><h1>FINANCIAL AUDIT CENTER</h1><p>One place to inspect webhook integrity and financial processing history.</p></section><section class="grid"><div class="card"><small>WEBHOOK EVENTS</small><h2 id="count">—</h2></div><div class="card"><small>PROCESSED</small><h2 id="processed">—</h2></div><div class="card"><small>FAILED</small><h2 id="failed">—</h2></div></section><section class="card" style="margin-top:20px"><h2>Recent Financial Events</h2><div id="table" class="table">Loading secure audit data…</div></section><p style="margin-top:24px"><a href="creator-monetization.html">← Monetization</a> · <a href="payout-center.html">Payout Center</a> · <a href="revenue-reconciliation.html">Reconciliation</a></p></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_CONFIG.supabasePublishableKey||window.CROWRULES_SUPABASE_PUBLISHABLE_KEY);(async()=>{const {data:{user}}=await sb.auth.getUser();if(!user){location.href="login.html?redirect=financial-audit-center.html";return}const {data,error}=await sb.rpc("get_my_podcast_financial_audit");if(error){document.getElementById("table").textContent="Audit data unavailable.";return}document.getElementById("count").textContent=data.length;document.getElementById("processed").textContent=data.filter(x=>x.status==="processed").length;document.getElementById("failed").textContent=data.filter(x=>x.status==="failed").length;document.getElementById("table").innerHTML='<div class="row head"><div>Event</div><div>Type</div><div>Status</div><div>Received</div><div>Processed</div></div>'+data.map(x=>'<div class="row"><div>'+x.event_id+'</div><div>'+x.event_type+'</div><div class="'+(x.status==="processed"?"ok":"bad")+'">'+x.status+'</div><div>'+new Date(x.received_at).toLocaleString()+'</div><div>'+(x.processed_at?new Date(x.processed_at).toLocaleString():"—")+'</div></div>').join("")})();</script></body></html>
