<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03040a"><title>Podcasts | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/global-navigation.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/global-navigation.js" defer></script><script src="js/app.js" defer></script><script src="js/player.js" defer></script></head><body><main class="page shell"><div class="eyebrow">Catalog</div><h1 class="title">PODCASTS</h1><p class="lede">Explore the CrowRules audio universe.</p><div class="searchbar"><input id="q" placeholder="Search podcasts"><button class="btn" onclick="filter()">SEARCH</button></div><div id="catalog" class="grid" data-source="podcasts" data-limit="40"></div><script>function filter(){let q=document.getElementById("q").value.toLowerCase();document.querySelectorAll("#catalog .card").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?"":"none")}</script></main></body></html>
