<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05050b">
<meta name="description" content="Discover podcasts, creators, and stories across CrowRules Podcasting.">
<title>Podcasts | CrowRules Podcasting</title>
<link rel="stylesheet" href="css/podcasting.css">
</head>
<body data-cr-no-monetization-strip>
<a class="skip-link" href="#main-content">Skip to content</a>

<main id="main-content" class="wrap podcast-directory-page">
  <section class="podcast-directory-hero" aria-labelledby="page-title">
    <div class="eyebrow">CROWRULES PODCASTING</div>
    <h1 id="page-title">Every Voice. <span class="glow">Every Story.</span></h1>
    <p>Discover podcasts, creators, and conversations across the CrowRules universe. Search the directory, explore categories, and open a show to discover its episodes, membership options, and creator.</p>
  </section>

  <section aria-label="Podcast directory controls">
    <div class="podcast-directory-toolbar">
      <label class="visually-hidden" for="search">Search podcasts</label>
      <input id="search" class="input" type="search" placeholder="Search podcasts…" autocomplete="off">

      <label class="visually-hidden" for="category">Filter by category</label>
      <select id="category" class="select">
        <option value="">All categories</option>
      </select>

      <label class="visually-hidden" for="sort">Sort podcasts</label>
      <select id="sort" class="select">
        <option value="featured">Featured</option>
        <option value="newest">Newest</option>
        <option value="title">Title</option>
        <option value="plays">Most played</option>
      </select>

      <button id="refresh" class="btn" type="button">REFRESH</button>
    </div>

    <div id="count" class="podcast-directory-count" aria-live="polite"></div>
  </section>

  <section aria-label="Podcasts">
    <div id="grid" class="podcast-directory-grid" aria-live="polite">
      <div class="podcast-directory-loading">Loading podcasts…</div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/global-navigation.js"></script>
<script>
(() => {
  "use strict";

  const cfg = window.CROWRULES_CONFIG || {};
  const grid = document.getElementById("grid");
  const count = document.getElementById("count");
  const search = document.getElementById("search");
  const category = document.getElementById("category");
  const sort = document.getElementById("sort");
  const refresh = document.getElementById("refresh");

  const db =
    window.supabase &&
    cfg.supabaseUrl &&
    cfg.supabaseAnonKey
      ? window.supabase.createClient(
          cfg.supabaseUrl,
          cfg.supabaseAnonKey,
          { auth: { persistSession: true, autoRefreshToken: true } }
        )
      : null;

  let podcasts = [];

  const esc = value =>
    String(value ?? "").replace(/[&<>"]/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;"
    }[char]));

  const number = value =>
    new Intl.NumberFormat().format(Number(value) || 0);

  const dateValue = value => {
    const time = new Date(value || 0).getTime();
    return Number.isFinite(time) ? time : 0;
  };

  function showLoading(message = "Loading podcasts…") {
    grid.innerHTML =
      '<div class="podcast-directory-loading">' +
      esc(message) +
      "</div>";
  }

  function showError(message) {
    grid.innerHTML =
      '<div class="podcast-directory-error">' +
        "<strong>Podcasts unavailable</strong>" +
        "<span>" + esc(message) + "</span>" +
        '<div class="actions">' +
          '<button id="retry" class="btn primary" type="button">TRY AGAIN</button>' +
        "</div>" +
      "</div>";

    document.getElementById("retry")?.addEventListener("click", load);
  }

  function populateCategories() {
    const categories = [...new Set(
      podcasts
        .map(p => p.category)
        .filter(Boolean)
    )].sort((a, b) =>
      String(a).localeCompare(String(b))
    );

    category.innerHTML =
      '<option value="">All categories</option>' +
      categories
        .map(value =>
          '<option value="' + esc(value) + '">' +
          esc(value) +
          "</option>"
        )
        .join("");
  }

  function filteredPodcasts() {
    const term = search.value.trim().toLowerCase();
    const selectedCategory = category.value;
    const selectedSort = sort.value;

    const result = podcasts.filter(p => {
      const haystack = [
        p.title,
        p.description,
        p.category,
        p.slug
      ].join(" ").toLowerCase();

      return (!term || haystack.includes(term)) &&
             (!selectedCategory || p.category === selectedCategory);
    });

    result.sort((a, b) => {
      if (selectedSort === "title") {
        return String(a.title || "").localeCompare(
          String(b.title || "")
        );
      }

      if (selectedSort === "newest") {
        return dateValue(b.created_at) - dateValue(a.created_at);
      }

      if (selectedSort === "plays") {
        return Number(b.total_plays || 0) -
               Number(a.total_plays || 0);
      }

      return (
        Number(Boolean(b.is_featured)) -
        Number(Boolean(a.is_featured))
      ) || (
        dateValue(b.created_at) -
        dateValue(a.created_at)
      );
    });

    return result;
  }

  function render() {
    const visible = filteredPodcasts();

    count.textContent =
      visible.length +
      " podcast" +
      (visible.length === 1 ? "" : "s");

    if (!visible.length) {
      grid.innerHTML =
        '<div class="podcast-directory-empty">' +
          "<strong>No podcasts found</strong>" +
          "<span>Try another search or category.</span>" +
        "</div>";
      return;
    }

    grid.innerHTML = visible.map(renderCard).join("");
  }

  function renderCard(podcast) {
    const title = podcast.title || "Untitled Podcast";
    const artwork = podcast.artwork_url
      ? '<img src="' + esc(podcast.artwork_url) +
        '" alt="' + esc(title) + ' cover artwork" loading="lazy">' +
        '<div class="fallback" hidden>CR</div>'
      : '<div class="fallback">CR</div>';

    const liveChip = podcast.is_live
      ? '<span class="podcast-chip status">LIVE</span>'
      : '<span class="podcast-chip">' +
          esc((podcast.status || "PUBLISHED").toUpperCase()) +
        "</span>";

    const website = podcast.website_url
      ? '<a class="btn" href="' + esc(podcast.website_url) +
        '" target="_blank" rel="noopener noreferrer">WEBSITE</a>'
      : "";

    return (
      '<article class="podcast-card">' +
        '<div class="cover">' + artwork + "</div>" +
        '<div class="podcast-card-body">' +
          "<h2>" + esc(title) + "</h2>" +
          "<p>" + esc(
            podcast.description || "No description yet."
          ) + "</p>" +
          '<div class="podcast-chips">' +
            '<span class="podcast-chip">' +
              esc(podcast.category || "Podcast") +
            "</span>" +
            liveChip +
          "</div>" +
          '<div class="podcast-stats">' +
            "<span><b>" + number(podcast.listener_count) +
            "</b> listeners</span>" +
            "<span><b>" + number(podcast.total_plays) +
            "</b> plays</span>" +
          "</div>" +
          '<div class="podcast-card-actions">' +
            '<a class="btn primary" href="podcast.html?id=' +
              encodeURIComponent(podcast.id) +
              '">OPEN PODCAST</a>' +
            website +
          "</div>" +
        "</div>" +
      "</article>"
    );
  }

  async function load() {
    if (!db) {
      showError(
        "CrowRules configuration is unavailable. Please reload the page."
      );
      return;
    }

    showLoading();

    try {
      const response = await db
        .from("podcasts")
        .select(
          "id,title,slug,category,description,artwork_url,website_url,status,is_featured,is_live,listener_count,total_plays,creator_id,created_at"
        )
        .in("status", ["active", "published", "live"])
        .order("is_featured", { ascending: false })
        .order("created_at", { ascending: false });

      if (response.error) {
        throw response.error;
      }

      podcasts = response.data || [];
      populateCategories();
      render();
    } catch (error) {
      console.error("CrowRules Podcast Directory:", error);
      showError(
        error?.message ||
        "The podcast directory could not be loaded."
      );
    }
  }

  search.addEventListener("input", render);
  category.addEventListener("change", render);
  sort.addEventListener("change", render);
  refresh.addEventListener("click", load);

  load();
})();
</script>
</body>
</html>
