<main class="wrap page">
<section class="hero">
<div class="eyebrow">CROWRULES PODCASTING</div>
<h1>Discover <span class="gradient">shows.</span></h1>
<p class="lead">Explore published podcasts across the CrowRules universe. Follow a show and keep your listening journey connected to your CrowRules account.</p>
<div class="toolbar">
<input id="search" class="search" type="search" placeholder="Search podcasts, creators, categories…" autocomplete="off">
<a class="btn primary" href="create-podcast.html">Create a Podcast</a>
</div>
<div id="filters" class="filters"></div>
</section>
<section>
<div id="loading" class="loading">Loading podcasts from Supabase…</div>
<div id="grid" class="grid" hidden></div>
<div id="empty" class="empty" hidden></div>
<div id="status" class="status"></div>
</section>
</main>
<script>
(()=>{"use strict";
const search=document.getElementById("search"),filters=document.getElementById("filters"),grid=document.getElementById("grid"),loading=document.getElementById("loading"),empty=document.getElementById("empty"),status=document.getElementById("status");
let all=[],category="All",busy=false;
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const waitForClient=async()=>{
 const started=Date.now();
 while(!window.CROW_SUPABASE){
   if(window.CROW_APP?.init){try{await window.CROW_APP.init()}catch(_){}}
   if(Date.now()-started>15000)throw Error("Supabase client could not initialize.");
   await new Promise(r=>setTimeout(r,100));
 }
 return window.CROW_SUPABASE;
};
async function loadRows(){
 const sb=await waitForClient();
 const {data,error}=await sb.from("podcasts").select("id,title,slug,description,artwork_url,author_name,category,status,is_live,listener_count,total_plays,created_at").eq("status","published").order("created_at",{ascending:false});
 if(error)throw error;
 return data||[];
}
function buildFilters(){
 const cats=["All",...new Set(all.map(x=>x.category).filter(Boolean))].sort((a,b)=>a==="All"?-1:b==="All"?1:a.localeCompare(b));
 filters.innerHTML=cats.map(c=>'<button class="filter '+(c===category?"active":"")+'" data-category="'+esc(c)+'">'+esc(c)+'</button>').join("");
 filters.querySelectorAll(".filter").forEach(btn=>btn.onclick=()=>{category=btn.dataset.category;buildFilters();render()});
}
function render(){
 const q=search.value.trim().toLowerCase();
 const rows=all.filter(p=>(category==="All"||p.category===category)&&(!q||[p.title,p.author_name,p.category,p.description].join(" ").toLowerCase().includes(q)));
 grid.innerHTML=rows.map(p=>{
   const id=encodeURIComponent(p.id),title=esc(p.title||"Untitled Podcast"),art=esc(p.artwork_url||"assets/podcast-placeholder.svg");
   return '<article class="card podcast-card"><a href="podcast.html?id='+id+'"><img class="art" src="'+art+'" alt="'+title+' artwork" loading="lazy"></a><div class="card-body"><div class="eyebrow">'+esc(p.category||"PODCAST")+'</div><h2>'+title+'</h2><p>'+esc(p.description||"A CrowRules Podcasting show.")+'</p><div class="meta">'+(p.author_name?'<span class="pill">'+esc(p.author_name)+'</span>':"")+(Number(p.listener_count||0)?'<span class="pill">'+Number(p.listener_count).toLocaleString()+" listeners</span>":"")+(p.is_live?'<span class="pill">● Live</span>':"")+'</div><div class="card-actions"><a class="btn primary" href="podcast.html?id='+id+'">View Show</a></div></div></article>';
 }).join("");
 grid.hidden=!rows.length;empty.hidden=!!rows.length;
 empty.innerHTML='<div class="eyebrow">NO MATCHES</div><h2>No published podcasts found</h2><p>Try another search or category.</p>';
 status.textContent=rows.length+" published "+(rows.length===1?"podcast":"podcasts");
}
async function load(){
 if(busy)return;busy=true;loading.hidden=false;loading.textContent="Connecting to Supabase…";empty.hidden=true;
 try{all=await loadRows();loading.hidden=true;buildFilters();render()}
 catch(e){loading.hidden=true;empty.hidden=false;empty.innerHTML='<div class="eyebrow">CONNECTION ISSUE</div><h2>Unable to load podcasts</h2><p>'+esc(e.message||"Please try again.")+'</p><button class="btn primary" id="retry">Retry</button>';status.textContent="Supabase connection failed.";document.getElementById("retry").onclick=load}
 finally{busy=false}
}
search.addEventListener("input",render);
window.addEventListener("online",load);
window.addEventListener("crow:ready",()=>load());
load();
})();
</script>
<script src="js/podcasting-v19.js?v=20261005-19.1"></script>
