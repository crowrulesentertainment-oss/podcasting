<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b">
<title>Podcasts | CrowRules Podcasting</title><meta name="description" content="Discover podcasts across CrowRules Podcasting.">
<link rel="stylesheet" href="css/podcasting.css">
</head>
<body data-cr-no-monetization-strip>
<main class="page"><section class="hero"><span class="eyebrow">CROWRULES PODCASTING</span><h1><span>Every Voice. Every Story.</span></h1><p>Discover podcasts, creators, and episodes across the CrowRules universe. Open a show to explore its episodes, membership options, and creator.</p></section>
<div class="toolbar"><input id="search" class="input" placeholder="Search podcasts…" autocomplete="off"><select id="category" class="select"><option value="">All categories</option></select><select id="sort" class="select"><option value="featured">Featured</option><option value="newest">Newest</option><option value="title">Title</option><option value="plays">Most played</option></select><button id="refresh" class="btn">REFRESH</button></div>
<div id="count" style="color:var(--muted);font-size:10px;margin:0 0 10px"></div><div id="grid" class="grid"><div class="loading">Loading podcasts…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/global-navigation.js"></script>
<script>
(()=>{"use strict";const cfg=window.CROWRULES_CONFIG||{},grid=document.getElementById("grid"),count=document.getElementById("count"),db=window.supabase&&cfg.supabaseUrl&&cfg.supabaseAnonKey?window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}}):null;let all=[];
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const fmt=n=>new Intl.NumberFormat().format(Number(n)||0);
async function load(){if(!db){grid.innerHTML='<div class="error" style="grid-column:1/-1"><strong>Connection unavailable</strong>Check CrowRules configuration and reload.</div>';return}grid.innerHTML='<div class="loading" style="grid-column:1/-1">Loading podcasts…</div>';try{const r=await db.from("podcasts").select("id,title,slug,category,description,artwork_url,website_url,status,is_featured,is_live,listener_count,total_plays,creator_id,created_at").in("status",["active","published","live"]).order("is_featured",{ascending:false}).order("created_at",{ascending:false});if(r.error)throw r.error;all=r.data||[];populate();render()}catch(e){console.error("podcasts.html",e);grid.innerHTML='<div class="error" style="grid-column:1/-1"><strong>Podcasts unavailable</strong><span>'+esc(e.message||"The podcast directory could not load.")+'</span><br><button class="btn" id="retry">TRY AGAIN</button></div>';document.getElementById("retry")?.addEventListener("click",load)}}
function populate(){const cats=[...new Set(all.map(x=>x.category).filter(Boolean))].sort();document.getElementById("category").innerHTML='<option value="">All categories</option>'+cats.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join("")}
function render(){const term=document.getElementById("search").value.trim().toLowerCase(),cat=document.getElementById("category").value,sort=document.getElementById("sort").value;let a=all.filter(p=>(!term||[p.title,p.description,p.category,p.slug].join(" ").toLowerCase().includes(term))&&(!cat||p.category===cat));a.sort((x,y)=>sort==="title"?String(x.title||"").localeCompare(String(y.title||"")):sort==="newest"?new Date(y.created_at||0)-new Date(x.created_at||0):sort==="plays"?Number(y.total_plays||0)-Number(x.total_plays||0):Number(y.is_featured)-Number(x.is_featured)||new Date(y.created_at||0)-new Date(x.created_at||0));count.textContent=a.length+" podcast"+(a.length===1?"":"s");grid.innerHTML=a.length?a.map(card).join(""):'<div class="empty" style="grid-column:1/-1"><strong>No podcasts found</strong>Try another search or category.</div>'}
function card(p){const art=p.artwork_url?'<img src="'+esc(p.artwork_url)+'" alt="'+esc(p.title)+' cover artwork" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'">':'';return '<article class="card"><div class="cover">'+art+'<div class="fallback" style="'+(p.artwork_url?"display:none":"")+'">CR</div></div><div class="body"><h2>'+esc(p.title||"Untitled Podcast")+'</h2><p>'+esc(p.description||"No description yet.")+'</p><div class="chips"><span class="chip">'+esc(p.category||"Podcast")+'</span><span class="chip '+(p.is_live?"status":"")+'">'+(p.is_live?"LIVE":esc(p.status||"PUBLISHED").toUpperCase())+'</span></div><div class="stats"><span><b>'+fmt(p.listener_count)+'</b> listeners</span><span><b>'+fmt(p.total_plays)+'</b> plays</span></div><div class="actions" style="margin-top:14px"><a class="btn primary" href="podcast.html?id='+encodeURIComponent(p.id)+'">OPEN PODCAST</a>'+(p.website_url?'<a class="btn" href="'+esc(p.website_url)+'" target="_blank" rel="noopener">WEBSITE</a>':'')+'</div></div></article>'}
["search","category","sort"].forEach(id=>document.getElementById(id).addEventListener("input",render));document.getElementById("refresh").addEventListener("click",load);load();
})();
</script></body></html>
