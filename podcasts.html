<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcasts | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/global-navigation.css">
<link rel="stylesheet" href="css/site.css"></head><body><main class="page"><section class="hero"><span class="eyebrow">PODCAST CATALOG</span><h1>ALL THE <span>SHOWS.</span></h1><p>Published podcasts from the CrowRules Podcasting universe.</p></section><div id="grid" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/domain-service-loader.js" defer></script>
<script src="js/domain-service-loader.js" defer></script>
<script src="js/global-navigation.js" defer></script>
<script>const out=document.getElementById("grid");const esc=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));(async()=>{try{const db=supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabaseAnonKey);const r=await db.from("podcasts").select("id,title,slug,description,category,artwork_url,is_featured").eq("status","published").order("is_featured",{ascending:false}).order("title").limit(60);if(r.error)throw r.error;out.innerHTML=(r.data||[]).map(p=>'<article class="card"><h2>'+esc(p.title)+'</h2><p class="muted">'+esc(p.category||"Podcast")+'</p><p>'+esc(p.description||"")+'</p><a class="btn primary" href="podcast.html?id='+encodeURIComponent(p.id)+'">LISTEN</a></article>').join("")||'<div class="status">No published podcasts yet.</div>'}catch(e){out.innerHTML='<div class="status">Podcast catalog is temporarily unavailable.</div>'}})()</script></body></html>
