<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>Binge & Catalog Engagement | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>
(()=>{const $=x=>document.getElementById(x),db=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));function notice(m){$("notice").innerHTML='<div class="panel">'+esc(m)+'</div>'}
async function boot(){try{const id=new URLSearchParams(location.search).get("id");if(!id){location.href="podcast-manager.html";return}$("back").href="podcast-journey.html?id="+encodeURIComponent(id);const u=await db.auth.getUser();if(!u.data.user){location.href="login.html?redirect="+encodeURIComponent("podcast-binge.html?id="+id);return}const m=await db.from("members").select("id").eq("user_id",u.data.user.id).maybeSingle();if(m.error)throw m.error;if(!m.data)throw Error("No CrowRules membership profile found.");const c=await db.from("creators").select("id").eq("member_id",m.data.id).eq("is_active",true).maybeSingle();if(c.error)throw c.error;if(!c.data)throw Error("No active creator profile found.");const p=await db.from("podcasts").select("id,title,description").eq("id",id).eq("creator_id",c.data.id).maybeSingle();if(p.error)throw p.error;if(!p.data)throw Error("Podcast not found or you do not own it.");const q=await db.rpc("get_podcast_binge_metrics",{p_podcast_id:id});if(q.error)throw q.error;const data=q.data||{},s=data.summary||{},episodes=data.episodes||[],depth=data.binge_depth||[];const ids=episodes.map(x=>x.episode_id).filter(Boolean);let eps=[];if(ids.length){const z=await db.from("podcast_episodes").select("id,title").in("id",ids);if(z.error)throw z.error;eps=z.data||[]}const names=Object.fromEntries(eps.map(e=>[e.id,e.title||"Untitled episode"]));$("hero").innerHTML='<div class="ey">Binge & Catalog Engagement Intelligence</div><h1>'+esc(p.data.title)+'</h1><p class="desc">'+esc(p.data.description||"Measure multi-episode listening, binge depth, repeat behavior, and catalog breadth.")+'</p><div class="callout">A binge session is two or more episode listening events separated by no more than 60 minutes. Metrics use identified listeners so creator analytics can distinguish audience behavior without exposing listener identities.</div>';
const fmt=n=>Number(n||0).toLocaleString(),min=n=>Math.round(Number(n||0)/60).toLocaleString();
$("stats").innerHTML='<div class="stat"><div class="label">Listening Sessions</div><div class="value">'+fmt(s.session_count)+'</div></div><div class="stat"><div class="label">Binge Sessions</div><div class="value">'+fmt(s.binge_session_count)+'</div></div><div class="stat"><div class="label">Avg Binge Depth</div><div class="value">'+Number(s.avg_binge_depth||0).toFixed(1)+'</div><div class="muted">episodes per multi-episode session</div></div><div class="stat"><div class="label">Max Binge</div><div class="value">'+fmt(s.max_binge_depth)+'</div><div class="muted">episode events in one session</div></div>';
const max=Math.max(1,...episodes.map(x=>Number(x.listen_events||0)));const epRows=episodes.sort((a,b)=>Number(b.listen_events)-Number(a.listen_events)).slice(0,12).map(x=>{const repeat=Number(x.repeat_listeners||0),listeners=Number(x.listeners||0),rate=listeners?(repeat/listeners)*100:0;return '<div class="item"><div class="row"><b>'+esc(names[x.episode_id]||"Episode")+'</b><span class="badge">'+fmt(x.listeners)+' listeners</span></div><div class="bar"><i style="width:'+Math.min(100,Number(x.listen_events)/max*100)+'%"></i></div><div class="muted">'+fmt(x.listen_events)+' listen events · '+min(x.seconds_listened)+' min listened · '+fmt(repeat)+' listeners repeated the same episode consecutively ('+rate.toFixed(1)+'%)</div></div>'}).join("")||'<div class="muted">No listening data yet.</div>';
const depthRows=depth.map(x=>'<div class="item"><div class="row"><b>'+x.episodes+' episode events</b><span class="badge">'+fmt(x.sessions)+' sessions</span></div></div>').join("")||'<div class="muted">No multi-episode sessions yet.</div>';
$("content").innerHTML='<section class="panel"><div class="ey">Catalog Engagement</div><h2>Episode engagement profile</h2><p class="muted">The catalog view combines listener reach, listening volume, and consecutive repeat behavior.</p>'+epRows+'</section><section class="panel"><div class="ey">Binge Depth</div><h2>How deep listeners go</h2><p class="muted">Distribution of sessions containing at least two listening events.</p>'+depthRows+'<div class="callout"><b>Catalog breadth:</b> '+Number(s.avg_catalog_episodes_per_listener||0).toFixed(1)+' distinct episodes per identified listener on average. '+fmt(s.listeners_3plus)+' listeners reached 3+ distinct episodes; '+fmt(s.listeners_5plus)+' reached 5+.</div></section><section class="panel" style="grid-column:1/-1"><div class="ey">Audience Profile</div><div class="grid"><div><h3>Listener depth</h3><p class="muted">Average episodes per identified listener: <b>'+Number(s.avg_catalog_episodes_per_listener||0).toFixed(1)+'</b></p><p class="muted">Average listening time per identified listener: <b>'+min(s.avg_seconds_per_listener)+' minutes</b></p></div><div><h3>Binge reach</h3><p class="muted">Identified listeners participating in a multi-episode session: <b>'+fmt(s.binge_listener_count)+'</b></p></div></div><div class="actions"><a class="btn" href="podcast-journey.html?id='+encodeURIComponent(id)+'">Listener Journey</a><a class="btn" href="podcast-retention.html?id='+encodeURIComponent(id)+'">Retention</a><a class="btn" href="podcast-cohorts.html?id='+encodeURIComponent(id)+'">Cohorts</a><a class="btn" href="podcast-dashboard.html?id='+encodeURIComponent(id)+'">Dashboard</a></div></section>';
$("hero").hidden=$("stats").hidden=$("content").hidden=false}catch(e){notice(e.message||"Unable to load binge intelligence.")}}boot()})();
