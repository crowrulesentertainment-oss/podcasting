<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top 10 | CrowRules Podcasting</title><meta name="description" content="Explore current CrowRules Podcasting rankings and discover shows gaining attention."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="./css/crowrules-cinematic.css"><style>.rank-hero{padding:75px 0 35px}.rank-intro{max-width:780px;color:#aeb6cb;line-height:1.8}.rank-grid{display:grid;gap:12px;margin:25px 0 75px}.rank-row{display:grid;grid-template-columns:70px 80px 1fr auto;gap:18px;align-items:center;padding:15px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:rgba(255,255,255,.035);transition:.2s}.rank-row:hover{transform:translateX(4px);border-color:rgba(0,229,255,.35)}.rank-num{font:900 2rem Orbitron;color:#00e5ff}.rank-art{width:68px;height:68px;border-radius:14px;object-fit:cover;background:#11112a}.rank-title{font-weight:900}.rank-meta,.rank-value{color:#9da5bd;font-size:.78rem}.rank-meta{margin-top:5px}@media(max-width:650px){.rank-row{grid-template-columns:45px 60px 1fr}.rank-value{display:none}.rank-art{width:55px;height:55px}}</style></head><body data-crowrules-division="podcasting"><header class="nav"><a class="brand" href="index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header><main><section class="rank-hero"><div class="eyebrow">THE LISTENING SIGNAL</div><h1>TOP 10</h1><p class="rank-intro">A discovery board for current CrowRules Podcasting chart data. Rankings reflect platform data and are presented for discovery.</p></section><section><div id="rankings" class="rank-grid"><div class="rank-note">Loading the current chart…</div></div></section></main><footer class="footer">CrowRules Podcasting · Listen. Create. Share.</footer><script src="assets/js/app.js"></script><script src="assets/js/crowrules-player.js"></script><script src="js/crowrules-membership.js"></script><script src="./js/crowrules-cinematic.js"></script><script>(async()=>{const sb=await loadSupabase(),el=document.getElementById("rankings");const {data,error}=await sb.from("podcast_top10_podcasts_current").select("*").order("rank",{ascending:true}).limit(10);if(error||!data?.length){el.innerHTML='<div class="rank-note">The chart will appear as ranking data is populated.</div>';return}el.innerHTML=data.map((x,i)=>'<a class="rank-row" href="podcasts.html?podcast='+encodeURIComponent(x.slug||"")+'"><div class="rank-num">'+(x.rank||i+1)+'</div><div><img class="rank-art" src="'+(x.artwork_url||"")+'" alt="" onerror="this.style.display=\'none\'"></div><div><div class="rank-title">'+esc(x.title||x.podcast_title||"Podcast")+'</div><div class="rank-meta">'+esc(x.category||"Podcast")+'</div></div><div class="rank-value">'+(x.total_plays??x.plays??"—")+' plays</div></a>').join("")})();</script></body></html>
