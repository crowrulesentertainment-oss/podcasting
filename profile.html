<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcasting Profile</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script></head><body><div id="cr-app"></div><main class="page"><div class="form-wrap panel"><span class="eyebrow">MY PROFILE</span><h1 id="title">Profile</h1><p id="email" class="status"></p><form id="f"><div class="field"><label>DISPLAY NAME</label><input id="display"></div><div class="field"><label>USERNAME</label><input id="username"></div><div class="field"><label>BIO</label><textarea id="bio" rows="5"></textarea></div><button class="btn primary">SAVE PROFILE</button></form><button class="btn" id="logout" style="margin-top:10px">SIGN OUT</button><div id="msg" class="status"></div></div></main><script>addEventListener('load',async()=>{const{data:{user}}=await CROW_PODCASTING.auth.getUser();if(!user)return location.href='login.html';email.textContent=user.email;const{data:p}=await CROW_PODCASTING.from('podcasting_profiles').select('*').eq('id',user.id).maybeSingle();display.value=p?.display_name||user.user_metadata?.display_name||'';username.value=p?.username||'';bio.value=p?.bio||'';title.textContent=display.value||'Your Profile';f.onsubmit=async e=>{e.preventDefault();const{error}=await CROW_PODCASTING.from('podcasting_profiles').upsert({id:user.id,display_name:display.value,username:username.value,bio:bio.value,updated_at:new Date().toISOString()});msg.textContent=error?.message||'Profile saved.';title.textContent=display.value||'Your Profile'};logout.onclick=async()=>{await CROW_PODCASTING.auth.signOut();location.href='index.html'}})</script><div id="cr-player"></div></body></html>
