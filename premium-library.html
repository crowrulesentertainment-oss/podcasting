<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>My Premium Library | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#05050b;--panel:rgba(12,13,24,.9);--text:#f7f8ff;--muted:#98a0b8;--cyan:#55e7ff;--purple:#a879ff;--green:#69f5ae;--border:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(85,231,255,.1),transparent 30%),radial-gradient(circle at 90% 5%,rgba(168,121,255,.12),transparent 30%),var(--bg);color:var(--text);font-family:Montserrat,system-ui,sans-serif}.wrap{width:min(1250px,calc(100% - 30px));margin:auto;padding:30px 0 80px}.hero{padding:48px 0 30px}.ey{font:800 10px Orbitron;letter-spacing:.18em;color:var(--cyan)}h1{font:800 clamp(40px,7vw,76px)/.95 Orbitron;margin:12px 0}h1 span{color:var(--cyan)}.hero p{color:var(--muted);max-width:760px;line-height:1.8}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.btn{display:inline-block;border:1px solid var(--border);border-radius:11px;padding:11px 15px;background:rgba(255,255,255,.04);font-weight:800}.primary{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#05050b;border:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{overflow:hidden;border:1px solid var(--border);border-radius:20px;background:var(--panel)}.thumb{height:150px;background:linear-gradient(135deg,rgba(85,231,255,.18),rgba(168,121,255,.18));display:grid;place-items:center;font:800 25px Orbitron}.body{padding:18px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(105,245,174,.09);color:var(--green);font-size:9px;font-weight:900;letter-spacing:.08em}.card h2{font:800 17px Orbitron;margin:11px 0 7px}.meta{font-size:10px;color:var(--muted);line-height:1.7}.actions{display:flex;gap:8px;margin-top:16px}.notice{padding:32px;border:1px dashed var(--border);border-radius:18px;text-align:center;color:var(--muted)}.status{margin:15px 0;font-size:12px;font-weight:800}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}}

</head><body><main class="wrap"><section class="hero"><div class="ey">MEMBER HUB · PREMIUM LIBRARY 9.0</div><h1>YOUR <span>PREMIUM</span><br>LIBRARY.</h1><p>Everything you've unlocked through eligible CrowRules Podcasting memberships and support products, collected in one place.</p><div class="bar"><a class="btn primary" href="support.html">Explore Memberships</a><a class="btn" href="discover.html">Discover Podcasts</a></div></section><div id="status" class="status"></div><section id="library" class="grid"><div class="notice">Loading your premium library…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>(async()=>{const cfg=window.CROWRULES_CONFIG,db=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),library=document.getElementById('library'),status=document.getElementById('status');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html?redirect='+encodeURIComponent('premium-library.html');return}const r=await db.rpc('get_my_premium_library');if(r.error){library.innerHTML='<div class="notice">Your premium library is temporarily unavailable.</div>';status.textContent=r.error.message;return}const rows=r.data||[];status.textContent=rows.length?rows.length+' premium episode'+(rows.length===1?'':'s')+' unlocked.':'';library.innerHTML=rows.length?rows.map(x=>'<article class="card"><div class="thumb">CR+</div><div class="body"><span class="tag">PREMIUM UNLOCKED</span><h2>'+esc(x.episode_title)+'</h2><div class="meta">'+esc(x.podcast_title)+' · '+(x.season_number||1)+'×'+(x.episode_number||'—')+(x.duration_seconds?' · '+Math.round(x.duration_seconds/60)+' min':'')+'</div><div class="actions"><a class="btn primary" href="episode.html?id='+encodeURIComponent(x.episode_id)+'">Listen / Watch</a></div></div></article>').join(''):'<div class="notice">No premium episodes are unlocked yet.<br><br><a class="btn primary" href="support.html">Browse Memberships</a></div>'})().catch(e=>{document.getElementById('library').innerHTML='<div class="notice">Unable to load your premium library.</div>';document.getElementById('status').textContent=e.message||'Unknown error'})</script></body></html>
