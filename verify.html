<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03040a"><title>Verify Your Email — CrowRules Podcasting</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><style>
:root{--bg:#03040a;--cyan:#55e7ff;--purple:#a66cff;--text:#f5f7ff;--muted:#9da6bb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 15%,#55e7ff15,transparent 35%),radial-gradient(circle at 80% 25%,#a66cff18,transparent 40%),var(--bg);color:var(--text);font-family:Montserrat,Arial,sans-serif;display:grid;place-items:center}.card{width:min(650px,90vw);padding:48px 32px;text-align:center;background:#0b0e18ee;border:1px solid #ffffff14;border-radius:24px;box-shadow:0 25px 100px #0009}.brand{font:800 14px Orbitron;letter-spacing:.18em}.brand b{color:var(--cyan)}.eyebrow{margin-top:45px;font:700 10px Orbitron;letter-spacing:.28em;color:var(--cyan)}h1{font:800 clamp(34px,6vw,58px) Orbitron;margin:16px 0;background:linear-gradient(100deg,#fff,var(--cyan),var(--purple),#fff);background-size:220% auto;-webkit-background-clip:text;color:transparent;animation:shine 5s linear infinite}p{color:var(--muted);line-height:1.8;font-size:14px}.status{margin:25px 0;padding:16px;border:1px solid #ffffff10;border-radius:14px;color:#b9c2d5;background:#ffffff05}.btn{display:inline-block;margin-top:10px;padding:14px 22px;border-radius:12px;background:linear-gradient(100deg,var(--cyan),var(--purple));color:#03040a;text-decoration:none;font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.small{font-size:10px;color:#69738a;margin-top:22px}@keyframes shine{to{background-position:220% center}}
</style><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
</head><body><main class="card"><div class="brand">CROW<b>RULES</b> PODCASTING</div><div class="eyebrow">Universal Account Verification</div><h1 id="title">VERIFY YOUR EMAIL</h1><p id="message">We're confirming your CrowRules account and preparing your Podcasting creator access.</p><div class="status" id="status">CONNECTING TO CROW RULES…</div><a class="btn" id="continue" href="launch.html">Return to Launch</a><div class="small">One Account. One Universe. · CrowRules Podcasting launches January 1, 2027.</div></main>
<script>
(()=>{"use strict";const c=window.CROW_CONFIG||{},title=document.getElementById("title"),msg=document.getElementById("message"),status=document.getElementById("status"),btn=document.getElementById("continue");
async function run(){if(!window.supabase||!c.supabaseUrl||!c.supabaseKey){status.textContent="ACCOUNT SYSTEM UNAVAILABLE";msg.textContent="Please try the verification link again later.";return}
const sb=window.supabase.createClient(c.supabaseUrl,c.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
try{const {data,error}=await sb.auth.getSession();if(error)throw error;
if(data.session){title.textContent="EMAIL VERIFIED";msg.textContent="Your CrowRules Universal account is verified. You are ready to continue preparing your Podcasting creator profile.";status.textContent="VERIFICATION COMPLETE";btn.textContent="Continue to Creator Signup";btn.href="signup.html";return}
status.textContent="CHECK YOUR EMAIL";msg.textContent="If you just registered, open the confirmation link from Supabase Auth in your email. Then return here.";btn.textContent="Back to Signup";btn.href="signup.html";
}catch(e){console.error(e);status.textContent="VERIFICATION COULD NOT BE COMPLETED";msg.textContent=e.message||"Please request a new confirmation email and try again."}}
run()})();
</script></body></html>
