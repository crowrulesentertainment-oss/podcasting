<main class="card"><div class="brand">CROW<b>RULES</b> PODCASTING</div><div class="eyebrow">Universal Account Verification</div><h1 id="title">VERIFY YOUR EMAIL</h1><p id="message">We're confirming your CrowRules account and preparing your Podcasting creator access.</p><div class="status" id="status">CONNECTING TO CROW RULES…</div><a class="btn" id="continue" href="signup.html">Return to Signup</a><div class="small">One Account. One Universe. · CrowRules Podcasting launches January 1, 2027.</div></main>
<script>
(()=>{"use strict";
const c=window.CROW_CONFIG||{},title=document.getElementById("title"),msg=document.getElementById("message"),status=document.getElementById("status"),btn=document.getElementById("continue");
function done(){title.textContent="EMAIL VERIFIED";msg.textContent="Your CrowRules Universal account is verified. Your Podcasting creator onboarding is ready.";status.textContent="VERIFICATION COMPLETE";btn.textContent="Continue to Creator Studio";btn.href="create-podcast.html"}
async function run(){
 if(!window.CROW_SUPABASE&&!c.supabaseUrl){status.textContent="ACCOUNT SYSTEM UNAVAILABLE";msg.textContent="Please try the verification link again later.";return}
 const sb=window.CROW_SUPABASE||await window.CROW_DATA.ready(10000);
 let finished=false;
 const check=async()=>{const r=await sb.auth.getSession();if(r.error)throw r.error;if(r.data.session&&!finished){finished=true;done();return true}return false};
 sb.auth.onAuthStateChange((event,session)=>{if(session&&!finished){finished=true;done()}});
 try{
   if(await check())return;
   const hash=new URLSearchParams(location.hash.replace(/^#/,""));
   if(hash.get("error_description"))throw new Error(hash.get("error_description").replace(/\+/g," "));
   status.textContent="CHECK YOUR EMAIL";
   msg.textContent="Open the newest CrowRules confirmation email and click the verification link. If you already clicked it, wait a moment while the account session is established.";
   btn.textContent="Back to Signup";btn.href="signup.html";
   setTimeout(check,1500);setTimeout(check,4000);
 }catch(e){console.error(e);status.textContent="VERIFICATION COULD NOT BE COMPLETED";msg.textContent=e.message||"Please request a new confirmation email and try again.";btn.textContent="Back to Signup";btn.href="signup.html"}
}
run();
})();
</script></body></html>
