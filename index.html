<body>

  <!-- Cinematic intro -->

  <main
    id="intro"
    class="intro"
    aria-label="CrowRules Podcasting cinematic introduction"
  >

```
<!-- Ambient background -->
<div
  class="intro__background"
  aria-hidden="true"
></div>

<!-- Cinematic letterbox -->
<div
  class="letterbox letterbox--top"
  aria-hidden="true"
></div>

<div
  class="letterbox letterbox--bottom"
  aria-hidden="true"
></div>

<!-- Video -->
<section class="intro__stage">

  <video
    id="introVideo"
    class="intro__video"
    autoplay
    muted
    playsinline
    preload="auto"
    aria-label="CrowRules Podcasting cinematic introduction"
  >
    <source
      src="assets/podcasting-intro.mp4"
      type="video/mp4"
    >

    Your browser does not support HTML5 video.
  </video>

  <!-- Fallback -->
  <div
    id="videoFallback"
    class="video-fallback"
    hidden
  >
    <div class="video-fallback__logo">
      CROW<span>RULES</span>
    </div>

    <div class="video-fallback__title">
      PODCASTING
    </div>
  </div>

</section>

<!-- Branding overlay -->
<div
  class="intro__branding"
  aria-hidden="true"
>
  <div class="branding__top">
    CROW<span>RULES</span>
  </div>

  <div class="branding__bottom">
    PODCASTING
  </div>
</div>

<!-- Bottom status -->
<div
  class="intro__status"
  id="introStatus"
  aria-live="polite"
>
  ENTERING THE UNIVERSE
</div>

<!-- Progress -->
<div
  class="intro__progress"
  aria-hidden="true"
>
  <div
    id="progressBar"
    class="intro__progress-bar"
  ></div>
</div>

<!-- Skip -->
<button
  id="skipIntro"
  class="skip-button"
  type="button"
  aria-label="Skip cinematic introduction"
>
  SKIP
</button>

  </main>

  <!-- JavaScript -->

  <script src="js/intro.js" defer></script>

</body>
