  <title>CrowRules Podcasting | Launch</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #05050b;
      --text: #ffffff;
      --muted: #a7a7b8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Montserrat", sans-serif;
    }

    .entry {
      width: min(620px, 100%);
      text-align: center;
    }

    .logo {
      margin-bottom: 12px;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 800;
      letter-spacing: .08em;
    }

    .logo span {
      opacity: .65;
    }

    .title {
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1rem, 4vw, 1.5rem);
      letter-spacing: .25em;
      margin-bottom: 24px;
    }

    .message {
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .loader {
      width: 34px;
      height: 34px;
      margin: 0 auto 18px;
      border: 2px solid rgba(255,255,255,.15);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .fallback {
      color: var(--muted);
      font-size: .9rem;
    }

    .fallback a {
      color: inherit;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader {
        animation: none;
      }
    }
  </style>

</head>

<body>

  <main class="entry" aria-live="polite">

<div class="logo">
  CROW<span>RULES</span>
</div>

<div class="title">
  PODCASTING
</div>

<div
  class="loader"
  aria-hidden="true"
></div>

<p class="message">
  Entering the CrowRules Podcasting Universe…
</p>

<p class="fallback">
  If you are not redirected automatically,
  <a href="launch.html">enter the launch page</a>.
</p>

  </main>

  <script>
    /*
     * CrowRules Podcasting Entry Point
     *
     * index.html intentionally routes visitors
     * directly to launch.html.
     */

    (() => {
      const launchPage = "launch.html";

      /*
       * Replace the current history entry so that
       * Back does not create an unnecessary redirect loop.
       */
      if (window.location.pathname.endsWith("/index.html")) {
        window.location.replace(launchPage);
        return;
      }

      window.location.replace(launchPage);
    })();
  </script>

</body>
</html>
