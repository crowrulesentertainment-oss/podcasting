<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090c">
<meta name="robots" content="noindex,nofollow">
<title>CrowRules Podcasting — Temporarily Down</title>
<style>
:root{color-scheme:dark;--bg:#08090c;--panel:#11141b;--line:rgba(255,255,255,.12);--muted:#aab1bf;--red:#e33b45;--gold:#d7b46a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 15%,rgba(183,35,47,.2),transparent 48%),linear-gradient(145deg,#08090c,#11141b 55%,#090a0e);color:#f7f7f8;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:28px}
main{width:min(760px,100%);text-align:center;padding:clamp(30px,7vw,68px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(155deg,rgba(22,25,33,.94),rgba(10,12,17,.94));box-shadow:0 28px 100px rgba(0,0,0,.48)}
.mark{width:76px;height:76px;margin:0 auto 30px;border:1px solid rgba(215,180,106,.55);border-radius:22px;display:grid;place-items:center;color:var(--gold);font-size:36px;font-weight:900;letter-spacing:-4px;transform:rotate(-3deg)}
.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase}
h1{font-size:clamp(38px,8vw,68px);line-height:.99;letter-spacing:-.055em;margin:18px 0 20px}
h1 span{color:var(--red)}
p{color:var(--muted);font-size:clamp(15px,2.5vw,18px);line-height:1.75;max-width:540px;margin:0 auto}
.status{display:inline-flex;align-items:center;gap:10px;margin:32px 0 0;padding:11px 16px;border:1px solid var(--line);border-radius:999px;color:#f0dcae;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 16px var(--red)}
footer{margin-top:48px;padding-top:22px;border-top:1px solid var(--line);color:#747d8d;font-size:12px;letter-spacing:.04em}
footer strong{color:#c5cad3;font-weight:700}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">CR</div>
  <div class="eyebrow">CrowRules Entertainment presents</div>
  <h1>We’ll be <span>back shortly.</span></h1>
  <p>CrowRules Podcasting is temporarily down while we prepare what comes next. We’re working behind the scenes and look forward to welcoming you back soon.</p>
  <div class="status"><span class="dot"></span> Platform temporarily unavailable</div>
  <footer><strong>CROWRULES PODCASTING</strong><br>One company. One universe.</footer>
</main>
</body>
</html>
