<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>Creator Action Center | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>
.wrap{width:min(1280px,92vw);margin:auto;padding:26px 0 70px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.top{flex-wrap:wrap}.btn{display:inline-flex;padding:10px 13px;border:1px solid #3b3b5b;border-radius:11px;background:rgba(255,255,255,.04);color:#fff;text-decoration:none;font-size:10px;font-weight:800}.hero,.panel,.stat{margin-top:18px;padding:22px;border:1px solid #26263c;border-radius:20px;background:rgba(12,13,24,.9);box-shadow:0 15px 50px rgba(0,0,0,.22)}.hero{background:linear-gradient(135deg,rgba(18,18,35,.97),rgba(7,7,15,.97))}.ey{color:#55e7ff;font:800 10px Orbitron;letter-spacing:.18em;text-transform:uppercase}h1{margin:8px 0;font:800 clamp(28px,5vw,50px) Orbitron}.desc,.muted{color:#9299b4;font-size:10px;line-height:1.75}.muted{color:#737b96;font-size:9px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{padding:18px}.label{color:#707895;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.value{margin-top:8px;font:800 23px Orbitron}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.action{padding:17px;border:1px solid rgba(255,255,255,.07);border-radius:16px;background:rgba(255,255,255,.025);margin-bottom:10px}.action:last-child{margin-bottom:0}.tag{display:inline-block;padding:5px 8px;border-radius:999px;border:1px solid #34364e;color:#aeb4ca;font-size:8px;font-weight:900;text-transform:uppercase}.action h3{margin:9px 0 5px;font:800 14px Orbitron}.action p{margin:0;color:#9299b4;font-size:10px;line-height:1.65}.action .btn{margin-top:12px}.signal{display:grid;gap:10px}.signal .item{padding:13px;border-radius:13px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.025)}.callout{margin-top:14px;padding:14px;border:1px solid rgba(85,231,255,.15);border-radius:14px;background:rgba(85,231,255,.04);color:#aeb4ca;font-size:10px;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:500px){.stats{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top"><a class="btn" id="back">← Podcast Dashboard</a><a class="btn" href="creator-studio.html">Creator Studio</a></div><div id="notice"></div><section id="hero" class="hero" hidden></section><section id="stats" class="stats" hidden></section><div id="grid" class="grid" hidden><section id="actions" class="panel"></section><aside id="signals" class="panel"></aside></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>
(()=>{const $=x=>document.getElementById(x),db=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),fmt=n=>Number(n||0).toLocaleString(),notice=m=>$("notice").innerHTML='<div class="panel">'+esc(m)+'</div>';
async function boot(){try{const id=new URLSearchParams(location.search).get("id");if(!id){location.href="podcast-manager.html";return}$("back").href="podcast-dashboard.html?id="+encodeURIComponent(id);const u=await db.auth.getUser();if(!u.data.user){location.href="login.html?redirect="+encodeURIComponent("creator-action-center.html?id="+id);return}const m=await db.from("members").select("id").eq("user_id",u.data.user.id).maybeSingle();if(m.error)throw m.error;if(!m.data)throw Error("No CrowRules membership profile found.");const c=await db.from("creators").select("id").eq("member_id",m.data.id).eq("is_active",true).maybeSingle();if(c.error)throw c.error;if(!c.data)throw Error("No active creator profile found.");const p=await db.from("podcasts").select("id,title,description,created_at").eq("id",id).eq("creator_id",c.data.id).maybeSingle();if(p.error)throw p.error;if(!p.data)throw Error("Podcast not found or you do not own it.");
const [perf,life,cohort,binge]=await Promise.all([db.rpc("get_podcast_content_performance",{p_podcast_id:id}),db.rpc("get_podcast_episode_lifecycle",{p_podcast_id:id}),db.rpc("get_podcast_audience_cohorts",{p_podcast_id:id}),db.rpc("get_podcast_binge_metrics",{p_podcast_id:id})]);for(const q of [perf,life,cohort,binge])if(q.error)throw q.error;
const pr=perf.data||[],lr=life.data||[],cr=cohort.data||[],bj=binge.data||{},pub=lr.filter(x=>x.status==="published"),now=Date.now(),latest=pub.slice().sort((a,b)=>new Date(b.published_at)-new Date(a.published_at))[0],daysSince=latest?Math.floor((now-new Date(latest.published_at))/86400000):null,avgComp=pr.length?pr.reduce((a,x)=>a+Number(x.avg_completion||0),0)/pr.length:0,discovery=pr.reduce((a,x)=>a+Number(x.discovery_entries||0),0),trans=pr.reduce((a,x)=>a+Number(x.next_transitions||0),0),catalog=lr.filter(x=>x.lifecycle_stage==="CATALOG").length,bingeSessions=Number(bj.summary?.binge_session_count||0),return30=Number(cr.find(x=>x.cohort_window==="30D")?.returning_listeners||0),active30=Number(cr.find(x=>x.cohort_window==="30D")?.active_listeners||0);
const actions=[];if(!pub.length)actions.push(["Publishing","Publish your first episode","Your podcast has no published episodes yet. Open Episode Manager to review drafts and move the catalog forward.","episode-manager.html"]);else if(daysSince>30)actions.push(["Release cadence","Review the release gap","The latest published episode is "+daysSince+" days old. Review your publishing workflow and decide whether another release is appropriate.","episode-manager.html"]);if(avgComp<50&&pr.length)actions.push(["Listening depth","Inspect completion signals","Average recorded progress across the published catalog is "+avgComp.toFixed(1)+"%. Open Retention to inspect episode-level completion and progress.","podcast-retention.html?id="+id]);if(discovery>0)actions.push(["Discovery","Review discovery episodes","The current catalog has "+fmt(discovery)+" recorded first-listen entries. Open Content Performance to inspect which episodes introduce identified listeners.","podcast-performance.html?id="+id]);if(trans>0)actions.push(["Journey","Inspect catalog movement","There are "+fmt(trans)+" observed next-episode transitions. Review Listener Journey to see where listeners move after an episode.","podcast-journey.html?id="+id]);if(bingeSessions>0)actions.push(["Binge behavior","Inspect binge sessions","The catalog has "+fmt(bingeSessions)+" observed binge sessions. Review Binge Intelligence to understand multi-episode listening behavior.","podcast-binge.html?id="+id]);if(catalog>0)actions.push(["Catalog health","Review long-tail episodes","There are "+fmt(catalog)+" catalog-stage episodes. Review Lifecycle and Content Performance to understand their current observed activity.","podcast-lifecycle.html?id="+id]);if(!actions.length)actions.push(["Setup","Build the first signal","Publish episodes and collect listening activity. This center will surface more evidence-based review items as data accumulates.","episode-manager.html"]);
$("hero").innerHTML='<div class="ey">Creator Action Center</div><h1>'+esc(p.data.title)+'</h1><p class="desc">'+esc(p.data.description||"One place to review the measurable signals across your podcast and choose what to investigate next.")+'</p><div class="callout"><b>How this works:</b> This is a read-only decision-support layer. It surfaces observed conditions from your existing podcast data and links you to the underlying analytics. It does not automatically change, publish, delete, promote, or monetize anything.</div>';
$("stats").innerHTML='<div class="stat"><div class="label">Published</div><div class="value">'+fmt(pub.length)+'</div></div><div class="stat"><div class="label">Avg Progress</div><div class="value">'+avgComp.toFixed(1)+'%</div></div><div class="stat"><div class="label">Discovery</div><div class="value">'+fmt(discovery)+'</div></div><div class="stat"><div class="label">Transitions</div><div class="value">'+fmt(trans)+'</div></div><div class="stat"><div class="label">Binge Sessions</div><div class="value">'+fmt(bingeSessions)+'</div></div>';
$("actions").innerHTML='<div class="ey">Action Queue</div><h2>What to review next</h2><p class="muted">These are evidence-based review prompts, not automatic recommendations. Open the linked analytics page to inspect the underlying records.</p>'+actions.map(x=>'<article class="action"><span class="tag">'+esc(x[0])+'</span><h3>'+esc(x[1])+'</h3><p>'+esc(x[2])+'</p><a class="btn" href="'+x[3]+'">Open Related Analytics →</a></article>').join("");
$("signals").innerHTML='<div class="ey">Audience Snapshot</div><h2>Observed audience movement</h2><div class="signal"><div class="item"><div class="row"><span class="muted">30-day active listeners</span><b>'+fmt(active30)+'</b></div></div><div class="item"><div class="row"><span class="muted">30-day returning listeners</span><b>'+fmt(return30)+'</b></div></div><div class="item"><div class="row"><span class="muted">Catalog-stage episodes</span><b>'+fmt(catalog)+'</b></div></div><div class="item"><div class="row"><span class="muted">Latest release</span><b>'+(daysSince===null?"—":daysSince+" days ago")+'</b></div></div></div><div class="callout">Returning-listener and binge metrics currently use identified listening activity. Treat them as observed measurements of recorded events, not a complete picture of every listener.</div><div class="actions"><a class="btn" href="podcast-growth.html?id='+id+'">Growth</a><a class="btn" href="podcast-cohorts.html?id='+id+'">Cohorts</a><a class="btn" href="podcast-retention.html?id='+id+'">Retention</a><a class="btn" href="podcast-performance.html?id='+id+'">Performance</a><a class="btn" href="podcast-lifecycle.html?id='+id+'">Lifecycle</a></div>';
$("hero").hidden=$("stats").hidden=$("grid").hidden=false}catch(e){console.error(e);notice(e.message||"Unable to load Creator Action Center.")}}boot();
</script></body></html>
