<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Podcast — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script type="module" src="js/app.js"></script></head><body><div data-nav></div><main class="page narrow"><header class="page-head"><p class="eyebrow">CREATOR STUDIO</p><h1>Create a podcast.</h1><p>Give your show a home in the CrowRules universe.</p></header><form class="form panel" data-demo-form><label>Podcast name<input required name="name" placeholder="Your show name"></label><label>Tagline<input name="tagline" placeholder="A short promise to listeners"></label><label>Description<textarea name="description" rows="5" placeholder="Tell listeners what your show is about"></textarea></label><label>Genre<select name="genre"><option>Storytelling</option><option>Conversation</option><option>Mystery</option><option>Comedy</option><option>Education</option></select></label><label>Artwork URL<input name="artwork_url" placeholder="https://…"></label><div class="form-actions"><a class="btn" href="studio.html">Cancel</a><button class="btn primary" type="submit">Create podcast</button></div></form></main></body></html>
