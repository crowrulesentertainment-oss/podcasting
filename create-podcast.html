<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Podcast — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">CREATOR STUDIO</div><h1>Create a <span class="gradient">podcast.</span></h1><section class="card"><form id="form" class="form"><label>Title<input id="title" required></label><label>Slug<input id="slug" required></label><label>Category<input id="category" value="Talk & Commentary"></label><label>Description<textarea id="description"></textarea></label><label>Artwork URL<input id="artwork_url" type="url"></label><button class="btn primary">Create draft</button></form><div id="status" class="notice" style="margin-top:15px">Sign in first.</div></section></main><script>addEventListener("crow:ready",()=>{form.onsubmit=async e=>{e.preventDefault();if(!__CROW_USER){location.href="account.html";return}const r=await CROW_SUPABASE.from("podcasts").insert({creator_id:__CROW_USER.id,title:title.value,slug:slug.value,category:category.value,description:description.value,artwork_url:artwork_url.value,status:"draft",author_name:__CROW_USER.user_metadata?.full_name||__CROW_USER.email}).select().single();status.textContent=r.error?r.error.message:"Draft created.";if(r.data)location.href="creator-dashboard.html"}});</script></body></html>
