<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Podcast — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script type="module" src="js/app.js"></script><script type="module" src="js/publishing.js"></script></head><body><div data-nav></div><main class="page narrow"><header class="page-head"><p class="eyebrow">CREATOR STUDIO / NEW SHOW</p><h1>Create a podcast.</h1><p>Build the show record first. Artwork is uploaded into Supabase Storage and the new show begins as a real draft.</p></header><form class="form panel" data-create-podcast><label>Podcast name<input required name="name" placeholder="Your show name"></label><label>Description<textarea name="description" rows="5" placeholder="Tell listeners what your show is about"></textarea></label><label>Genre<select name="genre"><option>Storytelling</option><option>Conversation</option><option>Mystery</option><option>Comedy</option><option>Education</option><option>Talk & Commentary</option></select></label><label>Podcast artwork<input name="artwork_file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><p class="notice">Recommended artwork: square JPG, PNG or WebP.</p><div class="form-actions"><a class="btn" href="studio.html">Cancel</a><button class="btn primary" type="submit">Create draft</button></div></form></main></body></html>
