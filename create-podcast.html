<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Podcast | CrowRules Podcasting</title><link rel="stylesheet" href="assets/css/cinematic.css"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet"></head><body><main class="container form-shell"><div class="panel"><span class="eyebrow">CREATOR STUDIO</span><h1 style="font:800 42px Orbitron,sans-serif">Create Your Podcast</h1><p style="color:var(--muted)">Start a new show inside the CrowRules universe. Your podcast can later connect to RSS, episodes, creators, memberships, analytics and monetization.</p><form class="form-grid" data-demo data-message="Podcast draft created. Continue in Creator Studio."><div class="field full"><label>Podcast Name</label><input required placeholder="Enter your podcast name"></div><div class="field"><label>Category</label><select><option>Talk</option><option>Comedy</option><option>Sports</option><option>Stories</option><option>News</option><option>Entertainment</option></select></div><div class="field"><label>Publishing Frequency</label><select><option>Weekly</option><option>Twice Weekly</option><option>Daily</option><option>Seasonal</option></select></div><div class="field full"><label>Show Description</label><textarea required placeholder="What should listeners know about this show?"></textarea></div><div class="field"><label>Cover Art</label><input type="file" accept="image/*"></div><div class="field"><label>Trailer Audio</label><input type="file" accept="audio/*"></div><div class="field full"><label>Audience</label><select><option>Public</option><option>CrowRules Members</option><option>Private / Draft</option></select></div><div class="field full"><button class="btn primary" type="submit">Create Podcast</button></div></form></div></main><script src="assets/js/cinematic.js"></script><script>mountNav('create');mountPlayer('Creator Studio');</script></body></html>
