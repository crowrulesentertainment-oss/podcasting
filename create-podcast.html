<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Podcast | CrowRules Podcasting</title><link rel="stylesheet" href="assets/css/cinematic.css"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet"><style>body{background:#030308;color:#fff;font-family:Montserrat}.container{width:min(900px,94%);margin:auto;padding:40px 0 100px}.panel{padding:30px;border:1px solid #ffffff14;border-radius:24px;background:#0b0a14dd}.eyebrow{font:900 10px Orbitron;letter-spacing:.18em;color:#00e5ff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:10px;font-weight:900;color:#aab0c2;text-transform:uppercase}input,select,textarea{width:100%;box-sizing:border-box;background:#10101a;color:#fff;border:1px solid #ffffff14;border-radius:10px;padding:12px}textarea{min-height:140px;resize:vertical}.btn{border:1px solid #ffffff14;border-radius:10px;padding:12px 16px;background:#10101a;color:#fff;font-weight:900;cursor:pointer}.primary{background:linear-gradient(90deg,#00e5ff,#8b5cf6);color:#030308}.msg{margin-top:15px;padding:12px;border-radius:10px;background:#ffffff08;color:#aab0c2}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="nav"><a class="brand" href="index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header><main class="container"><div class="panel"><span class="eyebrow">CREATOR STUDIO · LIVE DATABASE</span><h1 style="font:800 42px Orbitron;margin:10px 0">Create Your Podcast</h1><p style="color:#9da3b8;line-height:1.7">Create a real CrowRules podcast. Once saved, it becomes available to your Creator Dashboard and Podcast Show system.</p><form id="form" class="form-grid"><div class="field full"><label>Podcast Name</label><input id="title" required placeholder="Enter your podcast name"></div><div class="field"><label>Category</label><select id="category"><option>Talk</option><option>Comedy</option><option>Sports</option><option>Stories</option><option>News</option><option>Entertainment</option></select></div><div class="field"><label>Publishing Frequency</label><select id="frequency"><option>Weekly</option><option>Twice Weekly</option><option>Daily</option><option>Seasonal</option></select></div><div class="field full"><label>Show Description</label><textarea id="description" required placeholder="What should listeners know about this show?"></textarea></div><div class="field"><label>Cover Art URL</label><input id="artwork" type="url" placeholder="https://..."></div><div class="field"><label>Trailer URL</label><input id="trailer" type="url" placeholder="https://..."></div><div class="field full"><label>Audience / Visibility</label><select id="visibility"><option value="published">Public</option><option value="members">CrowRules Members</option><option value="draft">Private / Draft</option></select></div><div class="field full"><button class="btn primary" id="submit" type="submit">Create Podcast</button></div></form><div id="msg" class="msg" hidden></div></div></main><script src="assets/js/app.js"></script><script>(async()=>{const form=document.getElementById('form'),msg=document.getElementById('msg'),button=document.getElementById('submit');const slugify=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80);const message=(t,bad=false)=>{msg.hidden=false;msg.textContent=t;msg.style.color=bad?'#fecaca':'#aab0c2'};form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='Creating…';try{const sb=await loadSupabase(),{data:u,error:ue}=await sb.auth.getUser();if(ue||!u.user){location.href='login.html?next='+encodeURIComponent(location.href);return}const title=document.getElementById('title').value.trim(),description=document.getElementById('description').value.trim(),slug=slugify(title)+'-'+crypto.randomUUID().slice(0,8);const payload={creator_id:u.user.id,title,slug,category:document.getElementById('category').value,description,artwork_url:document.getElementById('artwork').value.trim()||null,trailer_url:document.getElementById('trailer').value.trim()||null,status:document.getElementById('visibility').value};const r=await sb.from('podcasts').insert(payload).select('id,slug').single();if(r.error)throw r.error;const link='show.html?id='+encodeURIComponent(r.data.id);message('Podcast created successfully. Opening your new Show Page…');setTimeout(()=>location.href=link,500)}catch(err){console.error(err);message(err.message||'Unable to create podcast.',true);button.disabled=false;button.textContent='Create Podcast'}})})();</script><script src="js/crowrules-invite.js"></script>
<script src="js/crowrules-navigation.js"></script>

<script src="assets/js/crowrules-site-ux.js"></script>
<script src="assets/js/crowrules-player.js?v=4"></script>
</body></html>
