<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03040a"><title>Create a Podcast | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/global-navigation.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/global-navigation.js" defer></script><script src="js/app.js" defer></script><script src="js/player.js" defer></script></head><body><main class="page shell"><div class="eyebrow">Creator Studio · 01—06</div><h1 class="title">CREATE A PODCAST.</h1><p class="lede">Name → Identity → Creator → Monetization → Payouts → Launch.</p><form class="form" id="f"><div class="split"><div class="field"><label>Name</label><input name="title" required></div><div class="field"><label>Category</label><select name="category"><option>Talk</option><option>Comedy</option><option>Sports</option><option>Music</option><option>Community</option><option>Stories</option><option>Education</option><option>Entertainment</option></select></div></div><div class="field"><label>Description</label><textarea name="description" rows="6"></textarea></div><div class="field"><label>Artwork URL</label><input name="artwork_url" type="url"></div><div class="notice">Stripe secrets stay server-side. This public GitHub Pages app uses the existing Supabase creator and Stripe functions.</div><div class="actions"><button class="btn primary">CREATE DRAFT</button><a class="btn" href="monetization.html">Payouts</a></div></form><div id="msg" class="section"></div><script>f.onsubmit=async ev=>{ev.preventDefault();if(!CR.C.user)return location.href="../membership/login.html";let x=Object.fromEntries(new FormData(f)),slug=x.title.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),c=(await CR.rows("creators",{limit:1,eq:["member_id",CR.C.user.id]}))[0];if(!c){msg.innerHTML='<div class="notice">Create your universal CrowRules creator profile first.</div>';return}let r=await CR.C.db.from("podcasts").insert({...x,slug,creator_id:c.id,status:"draft",is_featured:false,is_live:false});msg.innerHTML=r.error?'<div class="notice">'+CR.esc(r.error.message)+'</div>':'<div class="notice">Podcast draft created.</div>'}</script></main></body></html>
