<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Podcast — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">CREATOR STUDIO</div><h1>Create a <span class="gradient">podcast.</span></h1><section class="card"><form id="form" class="form"><label>Title<input id="title" required></label><label>Slug<input id="slug" required></label><label>Category<input id="category"></label><label>Description<textarea id="description"></textarea></label><label>Cover URL<input id="cover" type="url"></label><button class="btn primary">Create podcast</button></form><div id="status" class="notice" style="margin-top:15px">Sign in first.</div></section></main><script>addEventListener("crow:ready",function(){form.onsubmit=async function(e){e.preventDefault();if(!window.CROW_SUPABASE){status.textContent="Configure Supabase first.";return}var u=await CROW_SUPABASE.auth.getUser();if(!u.data.user){location.href="account.html";return}var r=await CROW_SUPABASE.from("podcasts").insert({creator_id:u.data.user.id,title:title.value,slug:slug.value,category:category.value,description:description.value,cover_url:cover.value}).select().single();status.textContent=r.error?r.error.message:"Podcast created. Add an episode next.";if(r.data)location.href="create-episode.html?podcast="+r.data.id}});</script></body></html>
