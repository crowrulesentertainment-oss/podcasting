<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrowRules Podcasting — Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/podcasting-platform.css?v=6">\n<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/podcasting-config.js?v=5"></script>
<style>.auth{width:min(560px,94vw);margin:70px auto}.auth .panel{padding:30px}.auth .brand{font:800 18px Orbitron;color:#fff}.auth .brand b{color:var(--cyan)}.auth h1{font:800 34px Orbitron;margin:8px 0 12px}.auth-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.auth a{color:var(--cyan)}.status{margin-top:15px;min-height:20px}.status.error{border-color:#ff4f8b66;color:#ffd2df}.status.ok{border-color:#55e7ff66}.links{display:flex;justify-content:space-between;gap:12px;margin-top:18px;font-size:12px}</style></head>
<body><main class="auth"><div class="panel card">
<a class="brand" href="home.html"><b>CROW</b>RULES <span class="muted">PODCASTING</span></a>
<div class="eyebrow" style="margin-top:35px">One Account. One Universe.</div><h1>CREATE ACCOUNT</h1><p class="muted">Create your CrowRules universal account and use it across the CrowRules universe.</p>
<div id="status" class="notice status">Ready.</div>
<form id="signupForm">
<div class="field"><label for="name">Display Name</label><input id="name" type="text" autocomplete="name" maxlength="80"></div>
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div>
<div class="field"><label for="confirm">Confirm Password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required></div>
<div class="auth-actions"><button class="btn primary" type="submit" id="submit">Create Account</button><button class="btn" type="button" id="google">Sign up with Google</button></div>
</form>
<div class="links"><a href="login.html">Already have an account?</a><a href="home.html">Back to Podcasting</a></div>
</div></main>
<script>
(async()=>{const C=window.CROW_CONFIG||{},$=id=>document.getElementById(id),status=$('status');let sb;
function set(t,kind=''){status.textContent=t;status.className='notice status '+kind}
function redirect(){const p=new URLSearchParams(location.search).get('redirect');location.replace('login.html?redirect='+encodeURIComponent(p?decodeURIComponent(p):'home.html'))}
async function boot(){if(!window.supabase?.createClient)throw Error('Supabase client unavailable.');sb=window.supabase.createClient(C.supabaseUrl,C.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});const {data}=await sb.auth.getSession();if(data.session){set('You are already signed in.','ok');setTimeout(()=>{const p=new URLSearchParams(location.search).get('redirect');location.replace(p?decodeURIComponent(p):'home.html')},250)}}
$('signupForm').onsubmit=async e=>{e.preventDefault();if($('password').value!==$('confirm').value)return set('Passwords do not match.','error');$('submit').disabled=true;set('Creating your account…');try{const {data,error}=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{display_name:$('name').value.trim()||null},emailRedirectTo:new URL('login.html',location.href).toString()}});if(error)throw error;if(data.session){set('Account created. Redirecting…','ok');setTimeout(redirect,250)}else set('Account created. Check your email to confirm your address, then sign in.','ok')}catch(e){set(e.message||'Unable to create account.','error')}finally{$('submit').disabled=false}};
$('google').onclick=async()=>{try{set('Opening Google sign-in…');const redirectTo=new URL('login.html',location.href);redirectTo.searchParams.set('redirect',new URLSearchParams(location.search).get('redirect')||'home.html');const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:redirectTo.toString()}});if(error)throw error}catch(e){set(e.message||'Google sign-in is unavailable.','error')}};
try{await boot()}catch(e){set(e.message||'Authentication unavailable.','error')}})();
</script></body></html>
