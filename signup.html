<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcasting Sign Up</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script></head><body><div id="cr-app"></div><main class="page"><div class="form-wrap panel"><span class="eyebrow">DEDICATED PODCASTING ACCOUNT</span><h1>Join the network.</h1><p class="status">This account is for CrowRules Podcasting and is separate from universal CrowRules membership.</p><form id="f"><div class="field"><label>EMAIL</label><input id="email" type="email" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" minlength="8" required></div><div class="field"><label>DISPLAY NAME</label><input id="display" required></div><button class="btn primary">CREATE ACCOUNT</button><div id="msg" class="status"></div></form><p class="status">Already registered? <a href="login.html">Sign in →</a></p></div></main><script>addEventListener('load',()=>f.onsubmit=async e=>{e.preventDefault();const{data,error}=await CROW_PODCASTING.auth.signUp({email:email.value,password:password.value,options:{data:{display_name:display.value}}});if(error){msg.textContent=error.message;return}if(data.user)await CROW_PODCASTING.from('podcasting_profiles').upsert({id:data.user.id,display_name:display.value,account_type:'listener',is_creator:false});msg.textContent='Account created. Check your email if confirmation is enabled.'})</script><div id="cr-player"></div></body></html>
