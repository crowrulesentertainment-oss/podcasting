<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Monetization — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">MONETIZATION</div><h1>Creator <span class="gradient">revenue.</span></h1><div id="auth" class="notice">Loading monetization…</div><div id="stats" class="grid"></div><section class="section"><div class="grid two"><div class="card"><h3>Stripe Connect</h3><p>Manage your payout onboarding and account status through the existing CrowRules Connect flow.</p><a class="btn primary" href="creator-payouts.html">Open payout onboarding</a></div><div class="card"><h3>Episode attribution</h3><div id="episodes">Loading…</div></div></div></section></main><script>addEventListener("crow:ready",async()=>{if(!__CROW_USER){auth.textContent="Sign in to view monetization.";return}const r=await CROW_SUPABASE.from("cr_creator_revenue_transactions").select("creator_amount,gross_amount,status,transaction_type,episode_id,episode_title,created_at").eq("creator_id",__CROW_USER.id).order("created_at",{ascending:false});const rows=r.data||[],net=rows.reduce((n,x)=>n+Number(x.creator_amount||0),0),gross=rows.reduce((n,x)=>n+Number(x.gross_amount||0),0);stats.innerHTML=[["$"+(gross/100).toFixed(2),"Gross attributed"],["$"+(net/100).toFixed(2),"Creator net"],[""+rows.length,"Ledger events"],[""+rows.filter(x=>x.status==="paid").length,"Paid events"]].map(x=>'<div class="card"><div class="stat">'+x[0]+'</div><p>'+x[1]+'</p></div>').join("");episodes.innerHTML=rows.filter(x=>x.episode_id).slice(0,20).map(x=>'<div class="activity-row"><strong>'+String(x.episode_title||"Episode").replace(/</g,"&lt;")+'</strong><span>$'+(Number(x.creator_amount||0)/100).toFixed(2)+'</span><span class="pill">'+String(x.status||"pending")+"</span></div>").join("")||"<p>No episode-attributed revenue yet.</p>";auth.textContent="Monetization data synced with Supabase.";});</script></body></html>
