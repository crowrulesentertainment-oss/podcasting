<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules V7.55 Recovery Certificate</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="css/podcasting-platform.css?v=5"><script src="js/podcasting-config.js?v=5"></script></head><body><main class="cr-shell"><section class="hero"><div><div class="eyebrow">CrowRules Evidence Vault</div><h1>V7.55 RECOVERY CERTIFICATE</h1><p>Formal recovery-readiness evidence generated from the latest passed disaster drill.</p></div></section><section class="section"><div class="card panel"><div class="actions"><button class="btn primary" id="issue">Issue Certificate</button><button class="btn" id="history">Load History</button><button class="btn" id="print">Print / Save PDF</button></div><div id="notice" class="notice">Administrator authentication required.</div><div id="cert"></div><div id="historyBox"></div></div></section></main><script src="js/recovery-v755.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{const n=document.getElementById('notice');try{const c=window.supabase.createClient(CROW_CONFIG.supabaseUrl,CROW_CONFIG.supabaseKey);const u=await c.auth.getUser();if(!u.data?.user)throw Error('Sign in required.');const r=await c.rpc('get_recovery_readiness_v754',{p_limit:25});if(r.error)throw r.error;n.textContent='Readiness: '+(r.data?.grade||'NOT TESTED')+' • '+(r.data?.readiness_score??0)+'/100';}catch(e){n.textContent=e.message||String(e)}document.getElementById('issue').onclick=()=>CrowV755.issue();document.getElementById('history').onclick=()=>CrowV755.history();document.getElementById('print').onclick=()=>window.print();});
</script></body></html>
