<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">MEMBERSHIP</div><h1>Support the <span class="gradient">audio universe.</span></h1><p class="lead">Stripe subscriptions start through a Supabase Edge Function; secret Stripe credentials never belong in GitHub Pages.</p><div id="plans" class="grid"></div></main><script>addEventListener("crow:ready",async function(){var r=await CROW_APP.query("membership_plans","*",{order:"price_cents"});plans.innerHTML=(r.data||[]).map(function(p){return '<article class="card"><span class="eyebrow">MEMBERSHIP</span><h3>'+p.name+'</h3><div class="stat">$'+(p.price_cents/100).toFixed(2)+'/mo</div><p>'+(p.description||"")+'</p><button class="btn primary" onclick="CROW_APP.checkout(\''+p.stripe_price_id+'\')">Subscribe</button></article>'}).join("")||'<div class="notice">Add active plans in Supabase.</div>'});</script></body></html>
