<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://js.stripe.com/dahlia/stripe.js"></script><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=1" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">UNIVERSAL MEMBERSHIP</div><h1>Support the <span class="gradient">CrowRules universe.</span></h1><div id="plans" class="grid"></div><section class="card" style="margin-top:22px"><div class="eyebrow">SECURE STRIPE CHECKOUT</div><h2>Complete your membership</h2><div id="checkout-form"></div></section><div id="status" class="notice" style="margin-top:18px">Membership status loading…</div></main><script>addEventListener("crow:ready",async()=>{const r=await CROW_APP.query("membership_plans","*",{order:"sort_order",ascending:true});plans.innerHTML=(r.data||[]).filter(p=>p.is_active).map(p=>'<article class="card"><span class="eyebrow">'+p.name+'</span><h3>'+p.name+'</h3><div class="stat">'+(p.price_cents?'$'+(p.price_cents/100).toFixed(2):"Free")+(p.billing_interval?'/'+p.billing_interval:"")+'</div><p>'+(p.description||"")+'</p><button class="btn primary" onclick="CROW_APP.checkout(\''+(p.stripe_price_id||p.price_id||"")+'\')">Choose plan</button></article>').join("")||'<div class="notice">No active plans found.</div>';if(__CROW_USER){const m=await CROW_SUPABASE.from("membership_entitlements").select("*").eq("user_id",__CROW_USER.id).limit(10);status.textContent=m.error?"Unable to load membership status.":((m.data||[]).length+" membership entitlements found.")}else status.textContent="Sign in to subscribe and manage your Universal CrowRules membership."});</script></body></html>
