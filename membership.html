<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">UNIVERSAL MEMBERSHIP</div><h1>Support the <span class="gradient">CrowRules universe.</span></h1><div id="plans" class="grid"></div><div id="status" class="notice" style="margin-top:18px">Membership status loading…</div></main><script>addEventListener("crow:ready",async()=>{const r=await CROW_APP.query("membership_plans","*",{order:"sort_order",ascending:true});plans.innerHTML=(r.data||[]).filter(p=>p.is_active).map(p=>'<article class="card"><span class="eyebrow">'+p.name+'</span><h3>'+p.name+'</h3><div class="stat">'+(p.price_cents?'$'+(p.price_cents/100).toFixed(2):"Free")+(p.billing_interval?'/'+p.billing_interval:"")+'</div><p>'+(p.description||"")+'</p><button class="btn primary" onclick="CROW_APP.checkout(\''+p.plan_key+'\')">Choose plan</button></article>').join("")||'<div class="notice">No active plans found.</div>';if(__CROW_USER){const m=await CROW_SUPABASE.from("membership_entitlements").select("*").eq("user_id",__CROW_USER.id).limit(10);status.textContent=m.error?"Unable to load membership status.":((m.data||[]).length+" membership entitlements found.")}else status.textContent="Sign in to subscribe and manage your Universal CrowRules membership."});</script></body></html>
