<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Library — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">YOUR LIBRARY</div><h1>Keep <span class="gradient">listening.</span></h1><div id="continueListening" class="grid"></div><h2 style="margin-top:50px">Followed Podcasts</h2><div id="follows" class="grid"></div><h2 style="margin-top:50px">Listening History</h2><div id="history" class="grid"></div></main><script>addEventListener("crow:ready",async()=>{const c=document.getElementById("continueListening");if(!__CROW_USER){c.innerHTML='<div class="notice">Sign in to synchronize your library across CrowRules.</div>';return}const p=await CROW_SUPABASE.from("podcast_episode_progress").select("*,podcast_episodes(title,description,podcast_id,podcasts(title))").eq("user_id",__CROW_USER.id).eq("completed",false).order("last_played_at",{ascending:false}).limit(12);c.innerHTML=(p.data||[]).map(x=>'<a class="card" style="text-decoration:none" href="episode.html?id='+x.episode_id+'"><span class="eyebrow">CONTINUE</span><h3>'+x.podcast_episodes.title+'</h3><p>'+((x.podcast_episodes.podcasts&&x.podcast_episodes.podcasts.title)||"")+'</p><div class="progress"><i style="width:'+x.percent_complete+'%"></i></div></a>').join("")||'<div class="notice">Nothing waiting to be finished.</div>';const f=await CROW_SUPABASE.from("podcast_follows").select("podcasts(id,title,description,artwork_url)").eq("user_id",__CROW_USER.id).order("created_at",{ascending:false});document.getElementById("follows").innerHTML=(f.data||[]).map(x=>'<a class="card" style="text-decoration:none" href="podcast.html?id='+x.podcasts.id+'"><h3>'+x.podcasts.title+'</h3><p>'+((x.podcasts.description||"").slice(0,160))+'</p></a>').join("")||'<div class="notice">Follow podcasts to build your library.</div>';const h=await CROW_SUPABASE.from("podcast_listens").select("*,podcast_episodes(title,podcast_id)").eq("user_id",__CROW_USER.id).order("started_at",{ascending:false}).limit(12);document.getElementById("history").innerHTML=(h.data||[]).map(x=>'<a class="card" style="text-decoration:none" href="episode.html?id='+x.episode_id+'"><span class="eyebrow">'+new Date(x.started_at).toLocaleDateString()+'</span><h3>'+x.podcast_episodes.title+'</h3><p>'+x.seconds_listened+' seconds listened</p></a>').join("")||'<div class="notice">Your listening history will appear here.</div>'});</script></body></html>
