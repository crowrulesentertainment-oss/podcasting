<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script></head><body><div id="cr-app"></div><main class="page"><section><span class="eyebrow">YOUR PODCASTING</span><h1 class="dash-title">Library</h1><p class="hero-copy">Your follows, favorites and listening progress.</p><div id="library" class="card-grid"></div></section></main><div id="cr-player"></div><script>
window.addEventListener('DOMContentLoaded',async()=>{const sb=window.CROW_PODCASTING,g=document.querySelector('#library'),{data:{user}}=await sb.auth.getUser();if(!user){g.innerHTML='<div class="panel">Sign in to build your Podcasting library.<br><br><a class="btn primary" href="login.html">SIGN IN</a></div>';return}const{data}=await sb.from('podcast_user_library').select('podcast_id,item_type,podcasts(id,title,description,artwork_url,total_plays,listener_count)').eq('user_id',user.id);g.innerHTML=(data||[]).map(x=>x.podcasts?'<article class="pod-card"><img src="'+(x.podcasts.artwork_url||'')+'" alt=""><span class="eyebrow">'+x.item_type+'</span><h3>'+x.podcasts.title+'</h3><p>'+x.podcasts.description+'</p><a class="btn primary" href="show.html?id='+x.podcasts.id+'">OPEN SHOW</a></article>':'').join('')||'<div class="panel">Your library is empty. Visit Discover to follow a show.</div>'});
</script></body></html>
