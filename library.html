<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">YOUR LIBRARY</div><h1>Your <span class="gradient">audio world.</span></h1><div id="library" class="notice">Sign in to see followed podcasts.</div></main><script>addEventListener("crow:ready",async function(){if(!window.CROW_SUPABASE)return;var u=await CROW_SUPABASE.auth.getUser();if(!u.data.user)return;var r=await CROW_SUPABASE.from("podcast_subscriptions").select("podcasts(*)").eq("user_id",u.data.user.id);library.outerHTML='<div class="grid">'+(r.data||[]).map(function(x){return '<a class="card" style="text-decoration:none" href="podcast.html?id='+x.podcasts.id+'"><h3>'+x.podcasts.title+'</h3><p>'+(x.podcasts.description||"")+'</p></a>'}).join("")+'</div>'});</script></body></html>
