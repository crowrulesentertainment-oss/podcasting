<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Library | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script><script src="js/listener-engine.js" defer></script><link rel="stylesheet" href="css/podcasting-v8.css?v=20261007-v8.0.0"><script src="js/podcasting-v8.js?v=20261007-v8.0.0" defer></script></head><body><div id="cr-app" data-cr-shell="crowrules-podcasting-sitewide-v7"></div><main class="page"><section><span class="eyebrow">YOUR PODCASTING</span><h1 class="dash-title">My Library 3.0</h1><p class="hero-copy">Your personalized listening home — resume where you left off, follow shows, favorite episodes, and discover what fits your listening history.</p><div class="library-tabs" role="tablist"><button class="btn primary" data-tab="continue">CONTINUE LISTENING</button><button class="btn" data-tab="queue">QUEUE</button><button class="btn" data-tab="recent">RECENTLY PLAYED</button><button class="btn" data-tab="shows">SAVED SHOWS</button><button class="btn" data-tab="favorites">FAVORITES</button><span id="liveBadge" class="eyebrow" style="margin-left:auto">LIVE SYNC</span></div><div id="libraryStatus"></div><div id="librarySnapshot" class="library-snapshot"></div><div id="libraryPanels"></div></section></main><div id="cr-player" data-cr-player="crowrules-podcasting-sitewide-v7"></div><script>
window.addEventListener('DOMContentLoaded',async()=>{const sb=window.CROW_PODCASTING,panels=document.querySelector('#libraryPanels'),status=document.querySelector('#libraryStatus');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const time=s=>{s=Number(s||0);if(!s)return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};const{data:{user}}=await sb.auth.getUser(); const listener=await window.CrowListener?.profile();if(!user){status.innerHTML='<div class="panel">Sign in to build your personalized Podcasting library.<br><br><a class="btn primary" href="login.html">SIGN IN</a></div>';return}const episodeIds=async ids=>{if(!ids.length)return[];const{data}=await sb.from('podcast_episodes').select('id,podcast_id,title,description,audio_url,thumbnail_url,duration_seconds,play_count,published_at,podcasts(id,title,artwork_url)').in('id',ids);return data||[]};const card=(x,kind,extra='')=>'<article class="pod-card library-card"><img src="'+esc(x.thumbnail_url||x.podcasts?.artwork_url||'')+'" alt="'+esc(x.title)+' artwork" loading="lazy"><span class="eyebrow">'+esc(kind)+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.podcasts?.title||'CrowRules Podcasting')+'</p>'+extra+'<div class="library-actions"><button class="btn primary" data-play="'+esc(x.id)+'">PLAY</button><button class="btn" data-next="'+esc(x.id)+'">PLAY NEXT</button><button class="btn" data-add="'+esc(x.id)+'">ADD QUEUE</button><button class="btn" data-save="'+esc(x.id)+'">FAVORITE EPISODE</button><a class="btn" href="episode.html?id='+encodeURIComponent(x.id)+'">DETAILS</a></div></article>';async function load(){status.innerHTML='<div class="panel">LOADING YOUR LIBRARY…</div>';const[savedR,progR,queueR,recentR,libR]=await Promise.all([sb.from('podcast_user_saved_episodes').select('episode_id,created_at').eq('user_id',user.id).order('created_at',{ascending:false}),sb.from('podcast_user_episode_progress').select('episode_id,position_seconds,duration_seconds,updated_at').eq('user_id',user.id).eq('completed',false).order('updated_at',{ascending:false}).limit(20),sb.from('podcast_user_queue').select('episode_id,position').eq('user_id',user.id).order('position'),sb.from('podcast_user_recently_played').select('episode_id,last_played_at,play_position_seconds').eq('user_id',user.id).order('last_played_at',{ascending:false}).limit(20),sb.from('podcast_user_library').select('podcast_id,item_type,created_at,podcasts(id,title,description,artwork_url,total_plays,listener_count)').eq('user_id',user.id).order('created_at',{ascending:false})]);const saved=savedR.data||[],prog=progR.data||[],q=queueR.data||[],recent=recentR.data||[],lib=libR.data||[];const allIds=[...new Set([...saved.map(x=>x.episode_id),...prog.map(x=>x.episode_id),...q.map(x=>x.episode_id),...recent.map(x=>x.episode_id)])];const eps=await episodeIds(allIds),em=new Map(eps.map(x=>[x.id,x]));const {data:discoveryEpisodes}=await sb.from('podcast_episodes').select('id,podcast_id,title,description,audio_url,thumbnail_url,duration_seconds,play_count,published_at,podcasts(id,title,artwork_url,category)').eq('status','published').order('published_at',{ascending:false}).limit(30);(discoveryEpisodes||[]).forEach(x=>{if(x?.id&&!em.has(x.id))em.set(x.id,x)});const section=(title,body,empty)=>'<section class="library-section"><div class="section-head"><div><span class="eyebrow">'+title+'</span></div></div>'+(body||'<div class="panel">'+empty+'</div>')+'</section>';const continueHtml=prog.map(x=>{const e=em.get(x.episode_id);if(!e?.audio_url)return'';const pct=x.duration_seconds?Math.min(100,Math.round(x.position_seconds/x.duration_seconds*100)):0;return card(e,'CONTINUE LISTENING','<div class="progress-track"><i style="display:block;width:'+pct+'%;height:4px;background:linear-gradient(90deg,#5ff7ff,#a56cff)"></i></div><div class="meta">'+time(x.position_seconds)+' LISTENED • '+pct+'%</div>')}).join('');const savedHtml=saved.map(x=>{const e=em.get(x.episode_id);return e?.audio_url?card(e,'SAVED EPISODE','<div class="meta">SAVED '+new Date(x.created_at).toLocaleString()+'</div>'):''}).join('');const queueHtml=q.map((x,i)=>{const e=em.get(x.episode_id);return e?.audio_url?card(e,'QUEUE #'+(i+1)):''}).join('');const recentHtml=recent.map(x=>{const e=em.get(x.episode_id);return e?.audio_url?card(e,'RECENTLY PLAYED','<div class="meta">'+new Date(x.last_played_at).toLocaleString()+'</div>'):''}).join('');const follows=(lib||[]).filter(x=>x.podcasts&&String(x.item_type).toLowerCase()==='follow');const shows=follows.length?follows:(lib||[]).filter(x=>x.podcasts);const showHtml=shows.map(x=>'<article class="pod-card library-card"><img src="'+esc(x.podcasts.artwork_url||'')+'" alt="'+esc(x.podcasts.title)+' artwork" loading="lazy"><span class="eyebrow">'+esc(x.item_type||'SAVED SHOW')+'</span><h3>'+esc(x.podcasts.title)+'</h3><p>'+esc(x.podcasts.description||'')+'</p><div class="meta">'+Number(x.podcasts.total_plays||0).toLocaleString()+' PLAYS • '+Number(x.podcasts.listener_count||0).toLocaleString()+'</div><div class="library-actions"><a class="btn primary" href="show.html?id='+encodeURIComponent(x.podcasts.id)+'">OPEN SHOW</a><button class="btn" data-follow="'+encodeURIComponent(x.podcasts.id)+'">FOLLOW / UNFOLLOW</button></div></article>').join('');const favorite=saved.map(x=>em.get(x.episode_id)).filter(Boolean);const favoriteShows=shows.filter(x=>String(x.item_type||'').toLowerCase().includes('favorite'));const favHtml=favorite.map(x=>'<article class="pod-card library-card"><img src="'+esc(x.podcasts.artwork_url||'')+'" alt="'+esc(x.podcasts.title)+' artwork" loading="lazy"><span class="eyebrow">FAVORITE</span><h3>'+esc(x.podcasts.title)+'</h3><p>'+esc(x.podcasts.description||'')+'</p><div class="library-actions"><a class="btn primary" href="show.html?id='+encodeURIComponent(x.podcasts.id)+'">OPEN SHOW</a></div></article>').join('');panels.innerHTML=section('CONTINUE LISTENING','<div class="card-grid">'+continueHtml+'</div>','You are caught up. Start an episode and your progress will appear here.')+section('LISTENING QUEUE','<div class="queue-toolbar"><button class="btn" id="clearQueue">CLEAR QUEUE</button></div><div class="card-grid">'+queueHtml+'</div>','Your queue is empty. Add episodes from Discover, Show pages or the player.')+section('RECENTLY PLAYED','<div class="card-grid">'+recentHtml+'</div>','Your listening history will appear here.')+section('SAVED SHOWS','<div class="card-grid">'+showHtml+'</div>','Save or follow a show to build your library.')+section('FAVORITES','<div class="card-grid">'+favHtml+'</div>','Favorite episodes will appear here.')+section('SAVED EPISODES','<div class="card-grid">'+savedHtml+'</div>','Save episodes you want to hear later.');const listened=recent.length+prog.length;const followed=new Set(follows.map(x=>x.podcast_id));const topCategories={};eps.forEach(e=>{const cat=e.podcasts?.title||'';topCategories[cat]=(topCategories[cat]||0)+1});const recentShowIds=new Set(recent.map(x=>em.get(x.episode_id)?.podcast_id).filter(Boolean));const recPool=[...(discoveryEpisodes||[])].filter(e=>e.audio_url&&!recentShowIds.has(e.podcast_id)&&!saved.some(s=>s.episode_id===e.id)).slice(0,8);const engineRecs=listener?await window.CrowListener.recommendations(listener):[];const becausePool=engineRecs.length?engineRecs:recPool;const becauseHtml=becausePool.map(e=>card(e,'BECAUSE YOU LISTENED')).join('');panels.innerHTML+=section('BECAUSE YOU LISTENED','<div class="card-grid">'+becauseHtml+'</div>','Keep listening to unlock personalized recommendations.');document.querySelector('#librarySnapshot').innerHTML='<div class="snapshot-grid"><div><span class="eyebrow">IN PROGRESS</span><strong>'+prog.length+'</strong><small>episodes</small></div><div><span class="eyebrow">RECENT</span><strong>'+recent.length+'</strong><small>episodes</small></div><div><span class="eyebrow">QUEUE</span><strong>'+q.length+'</strong><small>episodes</small></div><div><span class="eyebrow">FOLLOWING</span><strong>'+followed.size+'</strong><small>shows</small></div></div><div class="library-quick"><button class="btn primary" id="playAllLibrary">PLAY ALL QUEUE</button><button class="btn" id="shuffleLibrary">SHUFFLE QUEUE</button></div>';status.innerHTML='';document.querySelector('#playAllLibrary')?.addEventListener('click',async()=>{if(q.length){const first=em.get(q[0].episode_id);if(first?.audio_url)await window.CrowPlayer.play({id:first.id,audio_url:first.audio_url,title:first.title,podcast_title:first.podcasts?.title,artwork_url:first.thumbnail_url||first.podcasts?.artwork_url})}});document.querySelector('#shuffleLibrary')?.addEventListener('click',()=>{const items=q.map(x=>em.get(x.episode_id)).filter(e=>e?.audio_url);if(items[0])window.CrowPlayer.play({...items[Math.floor(Math.random()*items.length)],podcast_title:items[Math.floor(Math.random()*items.length)]?.podcasts?.title})});document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{const e=em.get(b.dataset.play);if(e?.audio_url)window.CrowPlayer.play({id:e.id,audio_url:e.audio_url,title:e.title,podcast_title:e.podcasts?.title,artwork_url:e.thumbnail_url||e.podcasts?.artwork_url})});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{const e=em.get(b.dataset.add);const ok=e&&await window.CrowPlayer.addToQueue({id:e.id,audio_url:e.audio_url,title:e.title,podcast_title:e.podcasts?.title,artwork_url:e.thumbnail_url||e.podcasts?.artwork_url});b.textContent=ok?'QUEUED':'SIGN IN';});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const e=em.get(b.dataset.save);if(!e)return;const{data:existing}=await sb.from('podcast_user_saved_episodes').select('id').eq('user_id',user.id).eq('episode_id',e.id).maybeSingle();if(existing){await sb.from('podcast_user_saved_episodes').delete().eq('id',existing.id);b.textContent='SAVE EPISODE'}else{await sb.from('podcast_user_saved_episodes').insert({user_id:user.id,episode_id:e.id});b.textContent='SAVED ✓'}load()});document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=async()=>{const pid=decodeURIComponent(b.dataset.follow);const{data:existing}=await sb.from('podcast_user_library').select('id').eq('user_id',user.id).eq('podcast_id',pid).eq('item_type','follow').maybeSingle();if(existing){await sb.from('podcast_user_library').delete().eq('id',existing.id);b.textContent='FOLLOW SHOW'}else{await sb.from('podcast_user_library').insert({user_id:user.id,podcast_id:pid,item_type:'follow'});b.textContent='FOLLOWING ✓'}load()});document.querySelectorAll('[data-remove-queue]').forEach(b=>b.onclick=async()=>{await sb.from('podcast_user_queue').delete().eq('user_id',user.id).eq('episode_id',b.dataset.removeQueue);load()});document.querySelector('#clearQueue')?.addEventListener('click',async()=>{await sb.from('podcast_user_queue').delete().eq('user_id',user.id);load()});document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=async()=>{const pid=decodeURIComponent(b.dataset.follow);const{data:existing}=await sb.from('podcast_user_library').select('id').eq('user_id',user.id).eq('podcast_id',pid).eq('item_type','follow').maybeSingle();if(existing){await sb.from('podcast_user_library').delete().eq('id',existing.id)}else{await sb.from('podcast_user_library').insert({user_id:user.id,podcast_id:pid,item_type:'follow'})}load()});document.querySelectorAll('[data-next]').forEach(b=>b.onclick=async()=>{const e=em.get(b.dataset.next);const ok=e&&await window.CrowPlayer.playNext({id:e.id,audio_url:e.audio_url,title:e.title,podcast_title:e.podcasts?.title,artwork_url:e.thumbnail_url||e.podcasts?.artwork_url});b.textContent=ok?'PLAY NEXT ADDED':'SIGN IN';});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.library-section').forEach((s,i)=>s.hidden=s.querySelector('.eyebrow')?.textContent!==({continue:'CONTINUE LISTENING',queue:'LISTENING QUEUE',recent:'RECENTLY PLAYED',shows:'SAVED SHOWS',favorites:'FAVORITES'}[b.dataset.tab]));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('primary',x===b));});document.querySelectorAll('.library-section').forEach((s,i)=>s.hidden=i>0)}const channels=['podcast_user_queue','podcast_user_episode_progress','podcast_user_recently_played','podcast_user_library','podcast_user_saved_episodes'];channels.forEach(name=>sb.channel('library-live-'+name).on('postgres_changes',{event:'*',schema:'public',table:name,filter:'user_id=eq.'+user.id},()=>load()).subscribe());sb.auth.onAuthStateChange(()=>load());load()});
</script><style>.library-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0}.library-section{margin:34px 0}.library-section[hidden]{display:none}.library-card img{aspect-ratio:1;object-fit:cover}.library-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.library-actions .btn{font-size:10px;padding:10px 12px}.progress-track{height:4px;background:var(--line);margin:14px 0 8px;border-radius:99px;overflow:hidden}.progress-track i{display:block}.meta{margin-top:10px}.library-snapshot{margin:18px 0}.snapshot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.snapshot-grid>div{padding:18px;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:12px}.snapshot-grid strong{display:block;font-size:30px;margin:7px 0}.snapshot-grid small{color:var(--muted)}.library-quick{display:flex;gap:8px;margin:12px 0 25px;flex-wrap:wrap}@media(max-width:700px){.snapshot-grid{grid-template-columns:repeat(2,1fr)}} </style><script>window.addEventListener('DOMContentLoaded',async()=>{const p=await window.CrowListener?.profile();const el=document.querySelector('#librarySnapshot');if(p&&el){const insight='<div class="library-engine"><span class="eyebrow">LISTENER ENGINE</span><strong>'+p.streak+' DAY LISTENING STREAK</strong><span>TOP CATEGORIES: '+(p.topCategories.join(' • ')||'BUILDING YOUR PROFILE')+'</span></div>';el.insertAdjacentHTML('beforeend',insight)}});</script><style>.library-engine{margin:10px 0 20px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025);display:flex;gap:16px;align-items:center;flex-wrap:wrap}.library-engine strong{font:800 12px Orbitron}.library-engine span:last-child{color:var(--muted);font-size:10px}</style></body>
