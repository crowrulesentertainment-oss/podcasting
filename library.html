<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Library • CrowRules Podcasting</title>
<link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/sitewide.css">
<style>
.library-engine{display:grid;gap:22px}.engine-head{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}.engine-head h2{margin:.2rem 0}.engine-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.engine-card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));padding:14px;box-shadow:var(--shadow);transform:translateZ(0);transition:.25s}.engine-card:hover{transform:translateY(-5px) rotateX(2deg);border-color:rgba(72,220,255,.45)}.engine-art{aspect-ratio:1;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 30% 20%,rgba(72,220,255,.35),transparent 42%),#101525;margin-bottom:12px;display:grid;place-items:center}.engine-art img{width:100%;height:100%;object-fit:cover}.engine-art span{font:700 24px Orbitron;color:var(--cyan)}.engine-card h3{font-size:1rem;margin:5px 0}.engine-card p{font-size:.84rem;color:var(--muted);min-height:2.5em}.engine-actions{display:flex;gap:7px;flex-wrap:wrap}.engine-actions button,.engine-actions a{font-size:.76rem}.engine-section{display:grid;gap:12px}.engine-kicker{color:var(--cyan);font:700 .72rem Orbitron;letter-spacing:.12em;text-transform:uppercase}.engine-empty{padding:24px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.engine-note{color:var(--muted);font-size:.88rem}.progress-line{height:4px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin:10px 0}.progress-line i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));width:var(--progress,0%)}@media(max-width:1000px){.engine-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.engine-grid{grid-template-columns:1fr}}
</style></head>
<body><main class="page">
<section class="hero center"><span class="eyebrow">PERSONALIZED LISTENING ENGINE</span><h1>My <span class="gradient">Library.</span></h1><p>Your CrowRules listening universe now learns from follows, listening progress, queue activity and recently played shows.</p></section>
<section id="libraryContent" class="library-engine"><div class="loading-card">Building your personalized listening universe…</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/podcasting.js"></script><script src="js/sitewide.js"></script>
<script>
const escL=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const client=()=>window.CROW_SUPABASE;
const card=p=>{const pct=Math.max(0,Math.min(100,Number(p.progress||0)));return '<article class="engine-card"><div class="engine-art">'+(p.artwork_url?'<img src="'+escL(p.artwork_url)+'" alt="" loading="lazy">':'<span>CR</span>')+'</div><span class="meta">'+escL(p.category||"Podcast")+'</span><h3>'+escL(p.title||"Untitled")+'</h3><p>'+escL(p.description||"Independent voices from CrowRules Podcasting.")+'</p>'+(p.progress!=null?'<div class="progress-line" style="--progress:'+pct+'%"><i></i></div><div class="fine-print">'+Math.round(pct)+'% complete</div>':'')+'<div class="engine-actions"><button class="btn" onclick="playP(\''+escL(p.audio_url||"")+'\',\''+escL(p.episode_title||p.title||"Podcast")+'\')">▶ Play</button><a class="btn secondary" href="podcast.html?id='+encodeURIComponent(p.podcast_id||p.id)+'">Open →</a></div></article>'};
const section=(k,t,items,note)=>'<section class="panel engine-section"><div class="engine-head"><div><span class="engine-kicker">'+k+'</span><h2>'+t+'</h2></div>'+(note?'<span class="engine-note">'+note+'</span>':'')+'</div>'+((items||[]).length?'<div class="engine-grid">'+items.slice(0,8).map(card).join("")+'</div>':'<div class="engine-empty">Nothing here yet. Start listening and the engine will build this section automatically.</div>')+'</section>';
async function playP(src,name){if(!src){window.CrowRulesToast?.("This episode has no audio yet.");return}window.CrowRulesPlay?.(src,name,"CrowRules Podcasting");}
async function buildLibrary(){
 const box=document.getElementById("libraryContent"), s=(await client().auth.getSession()).data.session;
 if(!s){box.innerHTML='<section class="panel engine-empty"><h2>Sign in to activate your Personalization Engine.</h2><p>Follow shows, save episodes and listen across CrowRules to build a personalized feed.</p><a class="btn" href="auth.html?next=library.html">Sign In</a></section>';return}
 const uid=s.user.id;
 const [f,p,q,r]=await Promise.all([
  client().from("podcast_user_library").select("podcast_id,item_type").eq("user_id",uid).eq("item_type","follow"),
  client().from("podcast_user_episode_progress").select("episode_id,position_seconds,duration_seconds,updated_at").eq("user_id",uid).order("updated_at",{ascending:false}).limit(24),
  client().from("podcast_user_queue").select("episode_id,position,added_at").eq("user_id",uid).order("position",{ascending:true}).limit(24),
  client().from("podcast_user_recently_played").select("episode_id,last_played_at,play_position_seconds").eq("user_id",uid).order("last_played_at",{ascending:false}).limit(24)
 ]);
 const episodeIds=[...(p.data||[]).map(x=>x.episode_id),...(q.data||[]).map(x=>x.episode_id),...(r.data||[]).map(x=>x.episode_id)];
 let eps=[];
 if(episodeIds.length){const ids=[...new Set(episodeIds)];const e=await client().from("podcast_episodes").select("id,podcast_id,title,description,duration_seconds,audio_url,thumbnail_url,published_at").in("id",ids);if(e.error)console.warn(e.error);else eps=e.data||[]}
 const podcastIds=[...(f.data||[]).map(x=>x.podcast_id),...eps.map(x=>x.podcast_id)];
 let shows=[];if(podcastIds.length){const x=await client().from("podcasts").select("id,title,slug,category,category_id,description,artwork_url,status,listener_count,total_plays,created_at").in("id",[...new Set(podcastIds)]);shows=x.data||[]}
 const showMap=new Map(shows.map(x=>[x.id,x]));
 const epMap=new Map(eps.map(x=>[x.id,x]));
 const enrich=(x,prog)=>{const e=epMap.get(x.episode_id), sh=e&&showMap.get(e.podcast_id);if(!e||!sh)return null;const d=prog?.duration_seconds||e.duration_seconds||0,pos=prog?.position_seconds||x.play_position_seconds||0;return {...sh,podcast_id:sh.id,episode_id:e.id,episode_title:e.title,audio_url:e.audio_url,description:e.description||sh.description,artwork_url:e.thumbnail_url||sh.artwork_url,progress:d?pos/d*100:null}};
 const progress=(p.data||[]).map(x=>enrich(x,x)).filter(Boolean);
 const queue=(q.data||[]).map(x=>enrich(x,null)).filter(Boolean);
 const recent=(r.data||[]).map(x=>enrich(x,x)).filter(Boolean);
 const followed=shows.filter(x=>(f.data||[]).some(y=>y.podcast_id===x.id)).map(x=>({...x,progress:null}));
 const catCounts={};[...followed,...recent].forEach(x=>{if(x.category_id)catCounts[x.category_id]=(catCounts[x.category_id]||0)+1});
 const cats=Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
 let rec=[];
 if(cats.length){const z=await client().from("podcasts").select("id,title,slug,category,category_id,description,artwork_url,status,listener_count,total_plays,created_at").in("status",["published","active"]).in("category_id",cats).order("total_plays",{ascending:false,nullsLast:true}).limit(24);rec=(z.data||[]).filter(x=>!shows.some(y=>y.id===x.id)).map(x=>({...x,progress:null}))}
 const top=await client().from("podcasts").select("id,title,category,description,artwork_url,status,listener_count,total_plays,created_at").in("status",["published","active"]).order("total_plays",{ascending:false,nullsLast:true}).limit(8);
 box.innerHTML=section("CONTINUE LISTENING","Pick up where you left off",progress,"Resume your unfinished episodes")
 +section("UP NEXT","Your Queue",queue,"Ordered across the CrowRules universe")
 +section("RECENTLY PLAYED","Back In The Feed",recent,"Your latest listening activity")
 +section("FOLLOWING","Shows You Follow",followed.map(x=>({...x,episode_title:null,audio_url:null})),"Your personal show shelf")
 +section("BECAUSE YOU LISTENED","Recommended For You",rec,"Matched to your followed and recently played categories")
 +section("TRENDING NOW","Top 8 This Week", (top.data||[]).map(x=>({...x,progress:null})),"A general signal for discovery");
}
document.addEventListener("DOMContentLoaded",()=>setTimeout(buildLibrary,250));
</script></body></html>
