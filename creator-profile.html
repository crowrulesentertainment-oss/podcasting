<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Profile — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">CREATOR STUDIO · PROFILE</div><h1>Your creator <span class="gradient">identity.</span></h1><section class="card"><form id="form" class="form"><label>Display name<input id="display_name" required></label><label>Username<input id="username"></label><label>Headline<input id="headline"></label><label>Bio<textarea id="bio"></textarea></label><label>Avatar URL<input id="avatar_url" type="url" placeholder="https://…"></label><label>Portfolio URL<input id="portfolio_url" type="url" placeholder="https://…"></label><label>Location<input id="location"></label><label>Availability<input id="availability" placeholder="Available for podcast production, guests, collaborations…"></label><label><input id="discoverable" type="checkbox"> Make my creator profile discoverable</label><button id="save" class="btn primary">Save Creator Profile</button></form><div id="status" class="notice" style="margin-top:15px">Loading profile…</div></section></main><script>addEventListener("crow:ready",async()=>{if(!__CROW_USER){status.textContent="Sign in first.";return}const r=await CROW_SUPABASE.from("creator_profiles").select("*").eq("user_id",__CROW_USER.id).maybeSingle();if(r.error){status.textContent=r.error.message;return}const p=r.data;if(p){display_name.value=p.display_name||"";username.value=p.username||"";headline.value=p.headline||"";bio.value=p.bio||"";avatar_url.value=p.avatar_url||"";portfolio_url.value=p.portfolio_url||"";location.value=p.location||"";availability.value=p.availability||"";discoverable.checked=!!p.is_discoverable;status.textContent="Profile loaded."}else{display_name.value=__CROW_USER.user_metadata?.full_name||__CROW_USER.email?.split("@")[0]||"Creator";status.textContent="Create your public creator profile."}form.onsubmit=async e=>{e.preventDefault();save.disabled=true;const data={user_id:__CROW_USER.id,display_name:display_name.value.trim(),username:username.value.trim()||null,headline:headline.value.trim()||null,bio:bio.value.trim()||null,avatar_url:avatar_url.value.trim()||null,portfolio_url:portfolio_url.value.trim()||null,location:location.value.trim()||null,availability:availability.value.trim()||null,is_discoverable:discoverable.checked};const q=p?await CROW_SUPABASE.from("creator_profiles").update(data).eq("user_id",__CROW_USER.id):await CROW_SUPABASE.from("creator_profiles").insert(data);save.disabled=false;status.textContent=q.error?q.error.message:"Creator profile saved.";}});</script></body></html>
