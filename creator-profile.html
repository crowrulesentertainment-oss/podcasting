<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05050b"><title>Creator Profile — CrowRules Podcasting</title>
<link rel="stylesheet" href="css/podcasting.css?v=20261003-41">
<script src="js/config.js?v=20261003-41"></script><script src="js/podcasting.js?v=20261003-41" defer></script><script src="js/player.js?v=20261003-41" defer></script><script src="js/app.js?v=20261003-41" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=1" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
<style>
:root{--cyan:#55e7ff;--purple:#a66cff;--pink:#ff4fd8;--line:#ffffff14}
body{overflow-x:hidden;background:radial-gradient(circle at 8% 3%,#12304955,transparent 30rem),radial-gradient(circle at 92% 5%,#3a195555,transparent 32rem),linear-gradient(180deg,#04050a,#080914 50%,#05050b)}
.creator-page{padding:65px 0 120px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.25em;color:var(--cyan);text-transform:uppercase}
.profile-hero{display:grid;grid-template-columns:180px 1fr;gap:28px;align-items:center;padding:28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#101522dd,#080b12ee);box-shadow:0 25px 80px #0006}
.avatar{width:180px;height:180px;border-radius:50%;object-fit:cover;background:radial-gradient(circle,#302650,#0b0d15);border:1px solid #ffffff18}.profile-hero h1{font:900 clamp(34px,6vw,68px) Orbitron;line-height:1;margin:10px 0}.gradient{background:linear-gradient(105deg,#fff,var(--cyan),var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.headline{color:#c7ccda;font-size:16px;line-height:1.6}.bio{color:#9ca5b7;line-height:1.75;max-width:780px}.chips,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.chip{padding:7px 10px;border:1px solid #ffffff14;border-radius:999px;color:#aeb6c8;font-size:9px;font-weight:900;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.stat{padding:18px;border:1px solid var(--line);border-radius:16px;background:#ffffff03}.stat-label{font-size:8px;color:#778195;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.stat-value{font:900 24px Orbitron;margin-top:7px}
.section{margin-top:48px}.section h2{font:900 24px Orbitron;margin:7px 0}.sub{color:#7f8799;font-size:11px;line-height:1.6}.rail{display:flex;gap:13px;overflow-x:auto;padding:5px 2px 14px}
.show-card{flex:0 0 235px;border:1px solid var(--line);border-radius:17px;overflow:hidden;background:linear-gradient(145deg,#101522dc,#080b12ed);color:inherit;text-decoration:none;transition:.22s transform,.22s border-color}.show-card:hover{transform:translateY(-5px);border-color:#55e7ff35}.art{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:radial-gradient(circle,#243b5b,#0b0d15 70%)}.body{padding:14px}.title{font-size:14px;font-weight:900;line-height:1.35;margin-bottom:7px}.meta{color:#7f8799;font-size:9px}.empty{padding:40px 20px;border:1px dashed #ffffff18;border-radius:16px;text-align:center;color:#7f8799}.notice{padding:14px;border:1px solid #ffffff12;border-radius:12px;color:#aeb6c8;background:#ffffff03}
.editor{display:none}.editor.open{display:block}.public{display:none}.public.open{display:block}.form{display:grid;gap:14px}.form label{display:grid;gap:7px;color:#9da6b8;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.form input,.form textarea{width:100%;border:1px solid #ffffff14;border-radius:11px;background:#05070d;color:#fff;padding:12px;font:600 13px Montserrat}.form textarea{min-height:120px;resize:vertical}
@media(max-width:700px){.profile-hero{grid-template-columns:1fr;text-align:center}.avatar{margin:auto}.chips,.actions{justify-content:center}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.stats{grid-template-columns:1fr}}
</style></head>
<body><div data-nav></div><script src="js/creator-nav.js"></script>
<main class="wrap creator-page">
<section id="publicView" class="public"><div class="eyebrow">CROWRULES CREATOR NETWORK</div>
<div class="profile-hero" style="margin-top:12px"><div id="publicAvatar"></div><div><div class="eyebrow" id="publicRole">CREATOR</div><h1 id="publicName">Loading…</h1><div id="publicHeadline" class="headline"></div><div id="publicBio" class="bio"></div><div id="publicChips" class="chips"></div><div id="publicActions" class="actions"></div></div></div>
<div id="publicStats" class="stats"></div><section class="section"><div class="eyebrow">SHOWS</div><h2>Podcasts by this creator</h2><p class="sub">Explore published shows from this CrowRules host.</p><div id="publicShows" class="rail"></div></section><div id="publicStatus" class="notice" style="margin-top:20px">Loading creator profile…</div></section>
<section id="editorView" class="editor"><div class="eyebrow">CREATOR STUDIO · PROFILE</div><h1>Your creator <span class="gradient">identity.</span></h1><section class="card" style="padding:25px;margin-top:18px"><form id="form" class="form">
<label>Display name<input id="display_name" required></label><label>Username<input id="username"></label><label>Headline<input id="headline"></label><label>Bio<textarea id="bio"></textarea></label><label>Avatar URL<input id="avatar_url" type="url" placeholder="https://…"></label><label>Portfolio URL<input id="portfolio_url" type="url" placeholder="https://…"></label><label>Location<input id="location"></label><label>Availability<input id="availability" placeholder="Available for podcast production, guests, collaborations…"></label><label><input id="discoverable" type="checkbox"> Make my creator profile discoverable</label><button id="save" class="btn primary">Save Creator Profile</button></form><div id="status" class="notice" style="margin-top:15px">Loading profile…</div></section></section>
</main>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[c])),fmt=n=>Number(n||0).toLocaleString(),profileId=new URLSearchParams(location.search).get("id"),sb=()=>window.CROW_SUPABASE;
function cover(u){return u?'<img class="art" src="'+esc(u)+'" alt="" loading="lazy">':'<div class="art"></div>'}
async function publicProfile(){try{const s=sb();if(!s)throw Error("CrowRules Supabase client is not ready.");let p=(await s.from("creator_profiles").select("*").eq("id",profileId).maybeSingle()).data;if(!p)p=(await s.from("creators").select("*").eq("id",profileId).maybeSingle()).data;if(!p)throw Error("Creator profile not found.");if(p.is_discoverable===false)throw Error("This creator profile is not publicly available.");const shows=(await s.from("podcasts").select("*").eq("creator_id",p.creator_id||p.id).eq("status","published")).data||[];const name=p.display_name||p.name||"CrowRules Creator";$("publicView").classList.add("open");$("publicName").textContent=name;$("publicRole").textContent=p.role||p.discipline||"PODCAST CREATOR";$("publicHeadline").textContent=p.headline||"Creator on CrowRules Podcasting";$("publicBio").textContent=p.bio||"This creator has not added a public bio yet.";$("publicAvatar").innerHTML=p.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'" alt="'+esc(name)+'">':'<div class="avatar"></div>';const tags=[...(p.skills||[]),...(p.interests||[])].filter(Boolean).slice(0,10);$("publicChips").innerHTML=tags.map(x=>'<span class="chip">'+esc(x)+'</span>').join("");$("publicActions").innerHTML=(p.portfolio_url?'<a class="btn primary" target="_blank" rel="noopener" href="'+esc(p.portfolio_url)+'">Portfolio ↗</a>':"")+(p.username?'<span class="chip">@'+esc(p.username)+'</span>':"")+(p.location?'<span class="chip">'+esc(p.location)+'</span>':"");const plays=shows.reduce((n,x)=>n+Number(x.total_plays||0),0),listeners=shows.reduce((n,x)=>n+Number(x.listener_count||0),0);$("publicStats").innerHTML='<div class="stat"><div class="stat-label">Shows</div><div class="stat-value">'+fmt(shows.length)+'</div></div><div class="stat"><div class="stat-label">Total Plays</div><div class="stat-value">'+fmt(plays)+'</div></div><div class="stat"><div class="stat-label">Listeners</div><div class="stat-value">'+fmt(listeners)+'</div></div><div class="stat"><div class="stat-label">Availability</div><div class="stat-value" style="font-size:12px">'+esc(p.availability||"—")+'</div></div>';$("publicShows").innerHTML=shows.length?shows.map(x=>'<a class="show-card" href="podcast.html?id='+encodeURIComponent(x.id)+'">'+cover(x.artwork_url)+'<div class="body"><div class="title">'+esc(x.title||"Untitled Podcast")+'</div><div class="meta">'+esc(x.category||"Podcast")+' · '+fmt(x.total_plays)+' plays · '+fmt(x.listener_count)+' listeners</div></div></a>').join(""):'<div class="empty">No published podcasts are connected to this creator yet.</div>';$("publicStatus").textContent="Public creator profile";}catch(e){$("publicView").classList.add("open");$("publicName").textContent="Creator unavailable";$("publicStatus").textContent=e.message||"Could not load creator profile.";$("publicShows").innerHTML='<div class="empty">This creator profile could not be found or is not publicly available.</div>'}}
async function editor(){ $("editorView").classList.add("open");const status=$("status"),form=$("form"),save=$("save");if(!window.__CROW_USER){status.textContent="Sign in first.";return}const s=sb(),r=await s.from("creator_profiles").select("*").eq("user_id",window.__CROW_USER.id).maybeSingle();if(r.error){status.textContent=r.error.message;return}const p=r.data||null;if(p){["display_name","username","headline","bio","avatar_url","portfolio_url","location","availability"].forEach(k=>$(k).value=p[k]||"");$("discoverable").checked=!!p.is_discoverable;status.textContent="Profile loaded."}else{$("display_name").value=window.__CROW_USER.user_metadata?.full_name||window.__CROW_USER.email?.split("@")[0]||"Creator";status.textContent="Create your public creator profile."}form.onsubmit=async e=>{e.preventDefault();save.disabled=true;const data={user_id:window.__CROW_USER.id,display_name:$("display_name").value.trim(),username:$("username").value.trim()||null,headline:$("headline").value.trim()||null,bio:$("bio").value.trim()||null,avatar_url:$("avatar_url").value.trim()||null,portfolio_url:$("portfolio_url").value.trim()||null,location:$("location").value.trim()||null,availability:$("availability").value.trim()||null,is_discoverable:$("discoverable").checked};const q=p?await s.from("creator_profiles").update(data).eq("user_id",window.__CROW_USER.id):await s.from("creator_profiles").insert(data);save.disabled=false;status.textContent=q.error?q.error.message:"Creator profile saved.";};}
addEventListener("crow:ready",()=>profileId?publicProfile():editor(),{once:true});
})();
</script></body></html>
