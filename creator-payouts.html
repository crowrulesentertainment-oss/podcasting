<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Monetization — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">CREATOR MONETIZATION</div><h1>Get paid for your <span class="gradient">audio.</span></h1><div id="status" class="notice">Loading Stripe Connect status…</div><div class="card" style="margin-top:18px"><h3>Payout account</h3><div id="details"></div><button id="start" class="btn primary" style="margin-top:15px">Connect Stripe</button></div></main><script>addEventListener("crow:ready",async()=>{if(!__CROW_USER){status.textContent="Sign in first.";start.onclick=()=>location.href="account.html";return}const r=await CROW_SUPABASE.from("cr_podcast_stripe_accounts").select("*").eq("user_id",__CROW_USER.id).maybeSingle();if(r.data){details.innerHTML='<p>Status: <strong>'+r.data.onboarding_status+'</strong></p><p>Charges enabled: '+r.data.charges_enabled+'</p><p>Payouts enabled: '+r.data.payouts_enabled+'</p>';status.textContent=r.data.payouts_enabled?"Payouts are enabled.":"Stripe onboarding needs attention.";start.textContent=r.data.payouts_enabled?"Refresh Stripe status":"Continue Stripe onboarding"}else{details.innerHTML="<p>No Stripe Connect account is linked yet.</p>";status.textContent="Connect Stripe to begin creator payouts."}start.onclick=async()=>{start.disabled=true;const r=await CROW_SUPABASE.functions.invoke(CROW_CONFIG.connectFunction,{body:{return_url:location.href,refresh_url:location.href}});start.disabled=false;if(r.error){alert(r.error.message);return}if(r.data?.onboarding_url)location.href=r.data.onboarding_url;else alert(r.data?.error||"Stripe did not return an onboarding link.")}});</script></body></html>
