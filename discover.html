<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discover • CrowRules Podcasting</title>
<link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/sitewide.css">
<style>
.discovery{display:grid;gap:20px}.search-command{display:grid;grid-template-columns:minmax(0,1fr) 190px auto;gap:10px}.search-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.84rem}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:7px 12px;color:var(--text);cursor:pointer}.chip:hover,.chip.active{border-color:var(--cyan);color:var(--cyan)}.discovery-tabs{display:flex;gap:8px;overflow:auto}.discovery-tab{white-space:nowrap}.discovery-tab.active{box-shadow:0 0 24px rgba(72,220,255,.16)}.result-section{display:grid;gap:12px}.result-head{display:flex;justify-content:space-between;align-items:end;gap:12px}.result-head h2{margin:0}.episode-results{display:grid;gap:10px}.episode-row{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035)}.episode-thumb{width:70px;height:70px;border-radius:12px;overflow:hidden;background:#111827;display:grid;place-items:center;font:700 18px Orbitron;color:var(--cyan)}.episode-thumb img{width:100%;height:100%;object-fit:cover}.episode-row h3{margin:0 0 5px;font-size:.98rem}.episode-row p{margin:0;color:var(--muted);font-size:.82rem}.episode-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.history{display:flex;gap:7px;flex-wrap:wrap}.history button{font-size:.75rem}.discovery-count{font-family:Orbitron;color:var(--cyan)}@media(max-width:800px){.search-command{grid-template-columns:1fr}.episode-row{grid-template-columns:56px 1fr}.episode-thumb{width:56px;height:56px}.episode-actions{grid-column:2;justify-content:flex-start}}
</style></head><body><main class="page"><section class="hero center"><span class="eyebrow">CROWRULES DISCOVERY V3</span><h1>Find your next <span class="gradient">listen.</span></h1><p>Search shows and episodes, explore categories, discover creators, follow trends and get recommendations from your listening universe.</p></section>
<section class="panel discovery"><div class="search-command"><input id="search" class="field" type="search" autocomplete="off" placeholder="Search shows, episodes, creators, topics…"><select id="category" class="field"><option value="">All categories</option></select><select id="creator" class="field"><option value="">All creators</option></select><button id="searchBtn" class="btn">Search</button></div>
<div id="history" class="history"></div><div id="categoryChips" class="chips"></div>
<div class="discovery-tabs"><button class="btn discovery-tab active" data-tab="all">All</button><button class="btn secondary discovery-tab" data-tab="shows">Shows</button><button class="btn secondary discovery-tab" data-tab="episodes">Episodes</button><button class="btn secondary discovery-tab" data-tab="trending">Trending</button><button class="btn secondary discovery-tab" data-tab="new">New Releases</button><button class="btn secondary discovery-tab" data-tab="for-you">For You</button></div>
<div class="search-meta"><span><span id="resultCount" class="discovery-count">0</span> results</span><span id="resultMode">All discovery</span></div></section>
<div id="discoveryResults" class="discovery"><div class="loading-card">Scanning the CrowRules Podcasting universe…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/podcasting.js"></script><script src="js/sitewide.js"></script>
<script>
const escD=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));let shows=[],episodes=[],categories=[],activeTab="all",session=null;
const histKey="crowrules_discovery_history_v1";const historyGet=()=>{try{return JSON.parse(localStorage.getItem(histKey)||"[]")}catch{return[]}};const historySave=q=>{if(!q)return;let h=historyGet().filter(x=>x.toLowerCase()!==q.toLowerCase());h.unshift(q);localStorage.setItem(histKey,JSON.stringify(h.slice(0,8)));renderHistory()};function renderHistory(){const h=historyGet(),box=document.getElementById("history");box.innerHTML=h.length?'<span class="meta">Recent searches:</span>'+h.map(x=>'<button class="chip" data-history="'+escD(x)+'">'+escD(x)+'</button>').join(""):"";box.querySelectorAll("[data-history]").forEach(b=>b.onclick=()=>{document.getElementById("search").value=b.dataset.history;activeTab="all";render()})}
function card(p){return '<article class="podcast-card"><div class="art">'+(p.artwork_url?'<img src="'+escD(p.artwork_url)+'" alt="" loading="lazy">':'<span>CR</span>')+'</div><div class="podcast-body"><span class="meta">'+escD(p.category||"Podcast")+'</span><h3>'+escD(p.title||"Untitled Podcast")+'</h3><p>'+escD(p.description||"Independent voices from CrowRules Podcasting.")+'</p><span class="fine-print">'+escD(p.author_name||"Community Creator")+" • "+Number(p.total_plays||0).toLocaleString()+" plays</span><br><a class="card-link" href="podcast.html?id='+encodeURIComponent(p.id)+'>Open Podcast →</a></div></article>"}
function episodeRow(e){return '<article class="episode-row"><div class="episode-thumb">'+(e.thumbnail_url?'<img src="'+escD(e.thumbnail_url)+'" alt="" loading="lazy">':'EP')+'</div><div><span class="meta">'+escD(e.podcast_title||"Podcast")+'</span><h3>'+escD(e.title||"Episode")+'</h3><p>'+escD(e.description||"No episode description yet.")+'</p></div><div class="episode-actions">'+(e.audio_url?'<button class="btn" onclick="playEpisode('+JSON.stringify(e)+')">▶ Play</button>':"")+'<a class="btn secondary" href="podcast.html?id='+encodeURIComponent(e.podcast_id)+'">Open Show →</a></div></article>'}
function playEpisode(e){window.CrowRulesPlay?.(e.audio_url,e.title,e.podcast_title,{episodeId:e.id,podcastId:e.podcast_id,durationSeconds:e.duration_seconds||0});}
function matches(p,q){return !q||[p.title,p.category,p.description,p.author_name,p.slug].filter(Boolean).join(" ").toLowerCase().includes(q)}
function catMatch(p,c){return !c||String(p.category_id)===String(c)}
function render(){const q=(document.getElementById("search").value||"").trim().toLowerCase(),c=document.getElementById("category").value,creator=document.getElementById("creator").value,box=document.getElementById("discoveryResults");let s=shows.filter(p=>matches(p,q)&&catMatch(p,c)&&(!creator||p.author_name===creator)),e=episodes.filter(x=>matches(x,q)&&(!c||String(x.category_id)===String(c)));if(activeTab==="trending")s=[...shows].sort((a,b)=>(b.total_plays||0)-(a.total_plays||0)).filter(p=>catMatch(p,c)&&(!creator||p.author_name===creator)).slice(0,12);if(activeTab==="new")s=[...shows].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).filter(p=>catMatch(p,c)&&(!creator||p.author_name===creator)).slice(0,12);if(activeTab==="for-you"){const ids=new Set(shows.filter(x=>x.category_id).map(x=>x.category_id));s=shows.filter(x=>ids.has(x.category_id)&&catMatch(x,c)&&(!creator||x.author_name===creator)).sort((a,b)=>(b.total_plays||0)-(a.total_plays||0)).slice(0,12)}let html="";if(activeTab!=="episodes")html+='<section class="panel result-section"><div class="result-head"><h2>'+(activeTab==="trending"?"Trending Now":activeTab==="new"?"New Releases":activeTab==="for-you"?"For You":"Shows")+'</h2><span class="meta">'+s.length+' shows</span></div>'+(s.length?'<div class="podcast-grid">'+s.slice(0,24).map(card).join("")+'</div>':'<div class="empty-state">No shows match this discovery view yet.</div>')+'</section>';if(activeTab!=="shows"&&activeTab!=="trending"&&activeTab!=="new"&&activeTab!=="for-you")html+='<section class="panel result-section"><div class="result-head"><h2>Episodes</h2><span class="meta">'+e.length+' episodes</span></div>'+(e.length?'<div class="episode-results">'+e.slice(0,30).map(episodeRow).join("")+'</div>':'<div class="empty-state">No published episodes match your search yet.</div>')+'</section>';if(activeTab==="episodes")html='<section class="panel result-section"><div class="result-head"><h2>Episode Search</h2><span class="meta">'+e.length+' episodes</span></div>'+(e.length?'<div class="episode-results">'+e.slice(0,50).map(episodeRow).join("")+'</div>':'<div class="empty-state">No published episodes match your search yet.</div>')+'</section>';box.innerHTML=html||'<div class="empty-state">Nothing found.</div>';document.getElementById("resultCount").textContent=(s.length+(activeTab==="shows"?0:e.length));document.getElementById("resultMode").textContent=activeTab==="for-you"?"Personalized discovery":activeTab.replace("-"," ")+" discovery"}
async function load(){const c=window.CROW_SUPABASE||await getSupabase();session=(await c.auth.getSession()).data.session;const [sr,er,cr]=await Promise.all([c.from("podcasts").select("id,title,slug,category,category_id,description,artwork_url,author_name,status,is_featured,is_live,listener_count,total_plays,created_at").in("status",["published","active"]).order("created_at",{ascending:false}).limit(200),c.from("podcast_episodes").select("id,podcast_id,title,description,duration_seconds,audio_url,thumbnail_url,published_at,status").eq("status","published").order("published_at",{ascending:false}).limit(300),c.from("podcast_categories").select("id,name,slug").eq("is_active",true).order("sort_order",{ascending:true})]);if(sr.error)throw sr.error;shows=sr.data||[];categories=cr.data||[];const map=new Map(shows.map(x=>[x.id,x]));episodes=(er.data||[]).map(e=>({...e,podcast_title:map.get(e.podcast_id)?.title||"Podcast",category_id:map.get(e.podcast_id)?.category_id||null}));const sel=document.getElementById("category"),creatorSel=document.getElementById("creator");sel.innerHTML='<option value="">All categories</option>'+categories.map(c=>'<option value="'+escD(c.id)+'">'+escD(c.name)+'</option>').join("");const creators=[...new Set(shows.map(x=>x.author_name).filter(Boolean))].sort();creatorSel.innerHTML='<option value="">All creators</option>'+creators.map(x=>'<option value="'+escD(x)+'">'+escD(x)+'</option>').join("");document.getElementById("categoryChips").innerHTML=categories.slice(0,12).map(c=>'<button class="chip" data-cat="'+escD(c.id)+'">'+escD(c.name)+'</button>').join("");document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{sel.value=b.dataset.cat;render()});renderHistory();render()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>{x.classList.toggle("active",x===b);x.classList.toggle("secondary",x!==b)});render()});document.getElementById("searchBtn").onclick=()=>{historySave(document.getElementById("search").value.trim());render()};document.getElementById("search").onkeydown=e=>{if(e.key==="Enter"){historySave(e.target.value.trim());render()}};document.getElementById("category").onchange=render;document.getElementById("creator").onchange=render;document.addEventListener("DOMContentLoaded",()=>load().catch(e=>{console.error(e);document.getElementById("discoveryResults").innerHTML='<div class="empty-state">Podcast discovery is temporarily unavailable. Refresh to try again.</div>'}));
</script></body></html>
