<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script></head><body><div id="cr-app"></div><main class="page"><section><span class="eyebrow">DISCOVER</span><h1 class="dash-title">Find your next show.</h1><p class="hero-copy">Browse published CrowRules podcasts and jump straight into the latest episodes.</p><div class="discover-tools"><input id="search" placeholder="Search podcasts, creators or categories…" aria-label="Search podcasts"><select id="category"><option value="">All categories</option></select></div><div id="discoverGrid" class="card-grid"></div></section></main><div id="cr-player"></div><script>
window.addEventListener('DOMContentLoaded',async()=>{const sb=window.CROW_PODCASTING;const grid=document.querySelector('#discoverGrid'),search=document.querySelector('#search'),cat=document.querySelector('#category');let rows=[];const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function load(){const{data,error}=await sb.from('podcasts').select('id,title,slug,category,description,artwork_url,listener_count,total_plays,author_name').eq('status','published').order('is_featured',{ascending:false}).order('total_plays',{ascending:false});if(error){grid.innerHTML='<div class="panel">Unable to load the podcast catalog right now.</div>';return}rows=data||[];[...new Set(rows.map(x=>x.category).filter(Boolean))].sort().forEach(x=>cat.insertAdjacentHTML('beforeend','<option>'+esc(x)+'</option>'));render()}function render(){const q=search.value.toLowerCase().trim(),c=cat.value;const list=rows.filter(x=>(!q||[x.title,x.description,x.category,x.author_name].some(v=>String(v||'').toLowerCase().includes(q)))&&(!c||x.category===c));grid.innerHTML=list.map(p=>'<article class="pod-card"><img src="'+esc(p.artwork_url||'')+'" alt=""><span class="eyebrow">'+esc(p.category||'PODCAST')+'</span><h3>'+esc(p.title)+'</h3><p>'+esc(p.description||'Discover this show.')+'</p><div class="meta">'+Number(p.total_plays||0).toLocaleString()+' PLAYS • '+Number(p.listener_count||0).toLocaleString()+' LISTENERS</div><div style="margin-top:14px"><a class="btn primary" href="show.html?id='+encodeURIComponent(p.id)+'">OPEN SHOW</a></div></article>').join('')||'<div class="panel">No podcasts match that search.</div>'}search.addEventListener('input',render);cat.addEventListener('change',render);load()});
<script>window.addEventListener('DOMContentLoaded',()=>{const wire=()=>{document.querySelectorAll('[data-queue-id]').forEach(b=>{if(b.dataset.wired)return;b.dataset.wired='1';b.onclick=async()=>{const id=b.dataset.queueId,ep=window.__CR_EPISODES?.get(id);if(!ep||!window.CrowPlayer)return;b.textContent='ADDING…';const ok=await window.CrowPlayer.addToQueue(ep);b.textContent=ok?'QUEUED':'SIGN IN TO QUEUE';setTimeout(()=>b.textContent=ok?'REMOVE FROM QUEUE':'ADD TO QUEUE',1200)} });document.querySelectorAll('[data-next-id]').forEach(b=>{if(b.dataset.wired)return;b.dataset.wired='1';b.onclick=async()=>{const ep=window.__CR_EPISODES?.get(b.dataset.nextId);if(!ep||!window.CrowPlayer)return;b.textContent='ADDING…';const ok=await window.CrowPlayer.playNext(ep);b.textContent=ok?'PLAY NEXT ADDED':'SIGN IN TO QUEUE';setTimeout(()=>b.textContent=ok?'PLAY NEXT':'PLAY NEXT',1400)}})};wire();new MutationObserver(wire).observe(document.body,{subtree:true,childList:true})});</script><style>.discover-tools{display:grid;grid-template-columns:1fr 240px;gap:12px;margin:28px 0}.discover-tools input,.discover-tools select{padding:15px;border:1px solid var(--line);background:#060b14;color:#fff;border-radius:12px}@media(max-width:650px){.discover-tools{grid-template-columns:1fr}}</style></body></html>
