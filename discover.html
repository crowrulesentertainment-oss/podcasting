<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script><script src="js/listener-engine.js" defer></script></head><body><div id="cr-app"></div><main class="page"><section><span class="eyebrow">DISCOVER</span><h1 class="dash-title">Find your next show.</h1><p class="hero-copy">Browse published CrowRules podcasts and jump straight into the latest episodes.</p><div class="discover-tools"><input id="search" placeholder="Search podcasts, creators or categories…" aria-label="Search podcasts"><select id="category"><option value="">All categories</option></select></div><div id="discoverGrid" class="card-grid"></div><div id="listenerInsights" class="listener-insights"></div><section class="discover-group" id="becauseGroup" hidden><span class="eyebrow">PERSONALIZED</span><h2>Because You Listened</h2><div id="becauseGrid" class="card-grid"></div></section><section class="discover-group" id="trendingGroup"><span class="eyebrow">POPULAR NOW</span><h2>Trending For You</h2><div id="trendingGrid" class="card-grid"></div></section></section></main><div id="cr-player"></div><script>
window.addEventListener('DOMContentLoaded',async()=>{const sb=window.CROW_PODCASTING,grid=document.querySelector('#discoverGrid'),search=document.querySelector('#search'),cat=document.querySelector('#category');let rows=[],followed=new Set();const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const{data,error}=await sb.from('podcasts').select('id,title,slug,category,description,artwork_url,listener_count,total_plays,author_name').eq('status','published').order('is_featured',{ascending:false}).order('total_plays',{ascending:false});if(error){grid.innerHTML='<div class="panel">Unable to load the podcast catalog right now.</div>';return}rows=data||[];const{data:{user}}=await sb.auth.getUser();if(user){const{data:l}=await sb.from('podcast_user_library').select('podcast_id,item_type').eq('user_id',user.id);followed=new Set((l||[]).filter(x=>x.item_type==='follow').map(x=>x.podcast_id))}[...new Set(rows.map(x=>x.category).filter(Boolean))].sort().forEach(x=>{if(![...cat.options].some(o=>o.value===x))cat.insertAdjacentHTML('beforeend','<option value="'+esc(x)+'">'+esc(x)+'</option>')});render()}function card(p){return '<article class="pod-card discover-card"><img src="'+esc(p.artwork_url||'')+'" alt="" loading="lazy"><span class="eyebrow">'+esc(p.category||'PODCAST')+'</span><h3>'+esc(p.title)+'</h3><p>'+esc(p.description||'Discover this show.')+'</p><div class="meta">'+Number(p.total_plays||0).toLocaleString()+' PLAYS • '+Number(p.listener_count||0).toLocaleString()+' LISTENERS</div><div class="discover-actions"><a class="btn primary" href="show.html?id='+encodeURIComponent(p.id)+'">OPEN SHOW</a><button class="btn" data-follow-show="'+p.id+'">'+(followed.has(p.id)?'FOLLOWING ✓':'FOLLOW SHOW')+'</button><button class="btn" data-latest="'+p.id+'">ADD LATEST TO QUEUE</button></div></article>'}function render(){const q=search.value.toLowerCase().trim(),c=cat.value,list=rows.filter(x=>(!q||[x.title,x.description,x.category,x.author_name].some(v=>String(v||'').toLowerCase().includes(q)))&&(!c||x.category===c)),followedRows=list.filter(x=>followed.has(x.id)),rest=list.filter(x=>!followed.has(x.id));grid.innerHTML=(followedRows.length?'<div class="discover-group"><span class="eyebrow">YOUR SHOWS</span><div class="card-grid">'+followedRows.map(card).join('')+'</div></div>':'')+'<div class="discover-group"><span class="eyebrow">'+(q||c?'SEARCH RESULTS':'RECOMMENDED FOR YOU')+'</span><div class="card-grid">'+rest.map(card).join('')+'</div></div>'+(!list.length?'<div class="panel">No podcasts match that search.</div>':'');wire()}async function wire(){document.querySelectorAll('[data-follow-show]').forEach(b=>b.onclick=async()=>{const{data:{user}}=await sb.auth.getUser();if(!user){b.textContent='SIGN IN';return}const pid=b.dataset.followShow;if(followed.has(pid)){await sb.from('podcast_user_library').delete().eq('user_id',user.id).eq('podcast_id',pid).eq('item_type','follow');followed.delete(pid)}else{await sb.from('podcast_user_library').insert({user_id:user.id,podcast_id:pid,item_type:'follow'});followed.add(pid)}render()});document.querySelectorAll('[data-latest]').forEach(b=>b.onclick=async()=>{const p=rows.find(x=>x.id===b.dataset.latest);const{data}=await sb.from('podcast_episodes').select('id,title,audio_url,thumbnail_url').eq('podcast_id',p.id).eq('status','published').not('audio_url','is',null).order('published_at',{ascending:false}).limit(1);const ep=data?.[0];const ok=ep&&await window.CrowPlayer.addToQueue({id:ep.id,audio_url:ep.audio_url,title:ep.title,podcast_title:p.title,artwork_url:ep.thumbnail_url||p.artwork_url});b.textContent=ok?'QUEUED':'SIGN IN / NO AUDIO';setTimeout(()=>b.textContent='ADD LATEST TO QUEUE',1500)})}search.addEventListener('input',render);cat.addEventListener('change',render);await load();sb.auth.onAuthStateChange(()=>load());});
</script><style>.discover-tools{display:grid;grid-template-columns:1fr 240px;gap:12px;margin:28px 0}.discover-tools input,.discover-tools select{padding:15px;border:1px solid var(--line);background:#060b14;color:#fff;border-radius:12px}@media(max-width:650px){.discover-tools{grid-template-columns:1fr}}.discover-group{margin:28px 0 42px}.discover-group>.eyebrow{display:block;margin-bottom:14px}.discover-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.discover-actions .btn{font-size:10px;padding:10px 12px}</style><script>window.addEventListener('DOMContentLoaded',async()=>{const p=await window.CrowListener?.profile();if(!p)return;const rec=await window.CrowListener.recommendations(p);const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));const card=e=>'<article class="pod-card"><img src="'+esc(e.thumbnail_url||e.podcasts?.artwork_url||'')+'" alt="" loading="lazy"><span class="eyebrow">'+esc(e.podcasts?.category||'EPISODE')+'</span><h3>'+esc(e.title)+'</h3><p>'+esc(e.podcasts?.title||'CrowRules Podcasting')+'</p><div class="meta">'+Number(e.play_count||0).toLocaleString()+' PLAYS</div><div class="discover-actions"><button class="btn primary" data-engine-play="'+e.id+'">PLAY</button><a class="btn" href="episode.html?id='+encodeURIComponent(e.id)+'">DETAILS</a></div></article>';const bg=document.querySelector('#becauseGrid'),bs=document.querySelector('#becauseGroup');if(rec.length){bg.innerHTML=rec.slice(0,6).map(card).join('');bs.hidden=false}const tg=document.querySelector('#trendingGrid');const trending=[...rec].sort((a,b)=>Number(b.play_count||0)-Number(a.play_count||0)).slice(0,6);tg.innerHTML=trending.map(card).join('')||'<div class="panel">Start listening to personalize your recommendations.</div>';document.querySelector('#listenerInsights').innerHTML='<div class="insight-grid"><div><span class="eyebrow">LISTENING STREAK</span><strong>'+p.streak+' DAY'+(p.streak===1?'':'S')+'</strong></div><div><span class="eyebrow">TOP CATEGORIES</span><strong>'+esc(p.topCategories.slice(0,3).join(' • ')||'BUILDING')+'</strong></div><div><span class="eyebrow">FOLLOWING</span><strong>'+p.follows.length+' SHOWS</strong></div></div>';document.querySelectorAll('[data-engine-play]').forEach(b=>b.onclick=()=>{const e=rec.find(x=>x.id===b.dataset.enginePlay);if(e)window.CrowPlayer.play({id:e.id,audio_url:e.audio_url,title:e.title,podcast_title:e.podcasts?.title,artwork_url:e.thumbnail_url||e.podcasts?.artwork_url})})});</script><style>.listener-insights{margin:18px 0}.insight-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.insight-grid>div{padding:18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.insight-grid strong{display:block;margin-top:8px;font:800 15px Orbitron}.discover-group h2{font:800 25px Orbitron;margin:8px 0 18px}@media(max-width:700px){.insight-grid{grid-template-columns:1fr}}</style></body>
