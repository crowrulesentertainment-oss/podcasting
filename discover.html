<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script type="module" src="js/app.js"></script></head><body><div data-nav></div><main class="page"><header class="page-head"><p class="eyebrow">DISCOVER</p><h1>Find your next show.</h1><p>Browse the CrowRules podcast universe by mood, genre, creator and live transmission.</p><div class="search"><input id="discoverSearch" placeholder="Search podcasts, episodes or hosts…" aria-label="Search"><button class="btn primary" data-search>Search</button></div></header><div class="filter-row"><button class="chip active" data-filter="all">All</button><button class="chip" data-filter="storytelling">Storytelling</button><button class="chip" data-filter="conversation">Conversation</button><button class="chip" data-filter="mystery">Mystery</button><button class="chip" data-filter="comedy">Comedy</button></div><section class="card-grid" id="discoverGrid"></section><section class="card-grid" id="network65"></section></main><div data-player></div><script type="module">
import{getSupabase}from"./js/supabase.js";
const sb=await getSupabase(),box=document.getElementById("network65"),input=document.getElementById("discoverSearch");
async function load(){if(!sb){box.innerHTML="<div class='panel'>Network is connecting…</div>";return}let q=input.value.trim();let x=sb.from("cr_podcast_network_stats_65").select("*").order("is_original",{ascending:false}).order("plays",{ascending:false}).limit(50);if(q)x=x.or("title.ilike.%"+q+"%,description.ilike.%"+q+"%,category.ilike.%"+q+"%");const r=await x;if(r.error){box.innerHTML="<div class='panel'>"+r.error.message+"</div>";return}box.innerHTML=(r.data||[]).map(p=>'<article class="show-card"><a href="podcast.html?slug='+encodeURIComponent(p.slug)+'"><div class="card-copy"><span class="badge">'+(p.is_original?"CROWRULES ORIGINAL":(p.category||"PODCAST"))+'</span><h3>'+p.title.replaceAll("<","&lt;")+'</h3><p>'+String(p.description||"").replaceAll("<","&lt;")+'</p><small>'+p.plays+' plays · '+p.followers+' followers · '+p.subscribers+' subscribers</small></div></a></article>').join("")||"<div class='panel'>No public podcasts yet.</div>"}input.addEventListener("input",load);load();
</script></body></html>
