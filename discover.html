<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover • CrowRules Podcasting</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/sitewide.css"><style>.page{max-width:1250px;margin:auto;padding:75px 5vw 140px}.hero{text-align:center;margin-bottom:45px}.hero h1{font:900 clamp(40px,7vw,78px) Orbitron;margin:12px 0}.hero h1 span{color:var(--cyan)}.hero p{color:var(--muted)}.toolbar{display:grid;grid-template-columns:1fr 220px auto;gap:12px;margin-bottom:28px}.toolbar input,.toolbar select{min-height:48px;padding:0 15px;background:#0b1019;border:1px solid var(--line);border-radius:12px;color:#fff}.toolbar button{border:0;background:none;color:var(--cyan);font:800 11px Orbitron}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.toolbar button{padding:10px}}</style></head><body><header class="site-header"></header><main class="page"><div class="hero"><span class="kicker">CROWRULES PODCASTING</span><h1>Find your next <span>listen.</span></h1><p>Search shows, creators, categories and stories across the audio universe.</p></div><div class="toolbar"><input id="search" type="search" placeholder="Search podcasts, creators or topics…"><select id="category"><option value="">All categories</option></select><button id="refreshPodcasts">REFRESH ↻</button></div><div id="podcastGrid" class="podcast-grid"><div class="loading-card">Loading podcasts…</div></div></main><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/podcasting.js"></script><script src="js/sitewide.js"></script></body></html>
