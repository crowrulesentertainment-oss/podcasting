<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">DISCOVER</div><h1>Find your <span class="gradient">next listen.</span></h1><p class="lead">A live catalog of published CrowRules podcasts.</p></main><section class="wrap section"><div id="status" class="notice">Loading…</div><div id="cards" class="grid" style="margin-top:18px"></div></section><script>addEventListener("crow:ready",async function(){var r=await CROW_APP.query("podcasts","*",{order:"created_at",ascending:false,limit:30});status.textContent=r.error?"Supabase is not configured.":(r.data.length+" podcasts available.");cards.innerHTML=(r.data||[]).map(function(p){return '<a class="card" style="text-decoration:none" href="podcast.html?id='+p.id+'"><div class="cover">'+(p.title||"POD")+'<small>'+(p.category||"PODCAST")+'</small></div><h3>'+p.title+'</h3><p>'+(p.description||"Open the show.")+'</p></a>'}).join("")});</script></body></html>
