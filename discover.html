<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">DISCOVER</div><h1>Find your <span class="gradient">next listen.</span></h1><p class="lead">Search the live CrowRules catalog, browse categories and see current Top 10 podcasts.</p><div class="searchbar"><input id="q" class="form input" placeholder="Search podcasts, categories or creators"><button class="btn primary" onclick="load()">Search</button></div><div id="cats" class="actions"></div></main><section class="wrap section"><h2>Top 10</h2><div id="top10" class="grid"></div><h2 style="margin-top:50px">New Releases</h2><div id="new" class="grid"></div></section><script>async function load(){const term=(q.value||"").trim();let query=CROW_SUPABASE.from("podcasts").select("*").eq("status","published").order("created_at",{ascending:false}).limit(30);if(term)query=query.or("title.ilike.%"+term+"%,description.ilike.%"+term+"%,category.ilike.%"+term+"%,author_name.ilike.%"+term+"%");const r=await query;new.innerHTML=(r.data||[]).map(card).join("")||'<div class="notice">No podcasts found.</div>'}function card(p){return '<a class="card" style="text-decoration:none" href="podcast.html?id='+p.id+'"><div class="cover">'+(p.artwork_url?'<img src="'+p.artwork_url+'">':p.title)+' </div><span class="pill">'+(p.category||"Podcast")+'</span><h3>'+p.title+'</h3><p>'+(p.description||"")+'</p></a>'}addEventListener("crow:ready",async()=>{const c=await CROW_APP.query("podcast_categories","*",{order:"sort_order",limit:30});cats.innerHTML=(c.data||[]).map(x=>'<button class="btn" onclick="q.value=\''+x.name.replace(/'/g,"\\'")+'\';load()">'+x.name+"</button>").join("");const t=await CROW_APP.query("podcast_top10_podcasts_current","*",{order:"rank",limit:10});top10.innerHTML=(t.data||[]).map(x=>'<a class="card" style="text-decoration:none" href="podcast.html?id='+x.podcast_id+'"><span class="eyebrow">#'+x.rank+'</span><h3>'+x.title+'</h3><p>'+((x.plays||0).toLocaleString())+' plays · '+((x.followers||0).toLocaleString())+' followers</p></a>').join("")||'<div class="notice">Rankings are being prepared.</div>';load()});</script></body></html>
