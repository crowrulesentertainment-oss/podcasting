<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Trust Watchtower V9.53</title><style>body{margin:0;background:#03050b;color:#eef3ff;font:14px Arial}.w{max-width:1500px;margin:auto;padding:24px}.c{background:#090e18;border:1px solid #273249;border-radius:14px;padding:16px;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat,.row,.step{background:#070b14;border:1px solid #273249;border-radius:9px;padding:11px;margin:7px 0}.stat b{display:block;font-size:21px}.muted{color:#9da8bd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chain{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.step b{display:block;margin-bottom:6px}button,select,input{padding:9px;margin:4px;background:#070b14;color:inherit;border:1px solid #33405a;border-radius:7px}textarea{width:100%;box-sizing:border-box;background:#070b14;color:inherit;border:1px solid #273249;border-radius:8px;padding:9px}code{word-break:break-all}@media(max-width:900px){.grid,.chain{grid-template-columns:1fr}}</style></head><body><main class="w"><section class="c"><h1>V9.53 · AUDIT &amp; EVIDENCE LEDGER FORENSICS CENTER</h1><p class="muted">Search, inspect, replay, and compare browser-local audit events. This is an audit investigation surface, not an autonomous governance engine.</p><div id="stats" class="stats"></div></section><section class="c"><h2>Ledger investigation</h2><input id="q" placeholder="Search event, signal, forecast, calibration…" style="width:45%"><select id="status"><option value="all">All integrity</option><option value="valid">Valid</option><option value="failed">Failed</option></select><button id="refresh">REFRESH</button><div id="ledger"></div></section><section class="c"><h2>Selected event replay</h2><div id="replay"></div></section><div class="grid"><section class="c"><h2>Integrity diagnostics</h2><div id="diag"></div><button id="verify">VERIFY ALL</button><button id="json">EXPORT INVESTIGATION</button></section><section class="c"><h2>Forensic review</h2><textarea id="note" rows="5" placeholder="Document what was observed, what should be checked, or why an event needs review…"></textarea><button id="save">SAVE FORENSIC REVIEW</button><div id="reviews"></div></section></div></main><script>const LED="crowrules_trust_v952_ledger",REV="crowrules_trust_v953_reviews",read=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=s=>String(s??"").replace(/[&<>"]/g,""),finger=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return("00000000"+(h>>>0).toString(16)).slice(-8)},verify=()=>read(LED).map((x,i)=>{const raw={...x,integrity_fingerprint:null},int=finger(JSON.stringify(raw))===x.integrity_fingerprint,prev=x.previous_ledger_id===(i?read(LED)[i-1].event_id:null),chain=x.chain_fingerprint===finger((i?read(LED)[i-1].chain_fingerprint:"GENESIS")+"|"+x.integrity_fingerprint+"|"+x.event_id);return{...x,ok:int&&prev&&chain,checks:{fingerprint:int,previous:prev,chain}}});let selected=null;function render(){const a=verify(),q=document.querySelector("#q").value.toLowerCase(),st=document.querySelector("#status").value,filtered=a.filter(x=>(st==="all"||(st==="valid"?x.ok:!x.ok))&&JSON.stringify(x).toLowerCase().includes(q));document.querySelector("#stats").innerHTML=[["Events",a.length],["Valid",a.filter(x=>x.ok).length],["Failed",a.filter(x=>!x.ok).length],["Signals",new Set(a.map(x=>x.signal)).size],["Reviews",read(REV).length],["Chain depth",a.length]].map(z=>'<div class="stat"><b>'+z[1]+'</b><span class="muted">'+z[0]+"</span></div>").join("");document.querySelector("#ledger").innerHTML=filtered.slice().reverse().map((x,i)=>'<div class="row"><button onclick="pick(\''+x.event_id+'\')">INSPECT</button> <b>'+esc(x.event_id)+'</b> · '+(x.ok?"VALID":"FAILED")+'<br><span class="muted">'+esc(x.created_at)+' · '+esc(x.signal)+' · '+esc(x.forecast)+' → '+esc(x.observed_outcome)+' · '+esc(x.calibration)+'</span><br><code>'+esc(x.integrity_fingerprint)+' / '+esc(x.chain_fingerprint)+'</code></div>').join("")||'<p class="muted">No matching ledger events.</p>';const v=a.filter(x=>x.ok);document.querySelector("#diag").innerHTML='<div class="row">Fingerprint integrity: '+(a.length&&a.every(x=>x.checks.fingerprint)?"PASS":"ATTENTION")+'<br>Previous-link integrity: '+(a.length&&a.every(x=>x.checks.previous)?"PASS":"ATTENTION")+'<br>Chain integrity: '+(a.length&&a.every(x=>x.checks.chain)?"PASS":"ATTENTION")+'<br>Last valid event: '+(v.at(-1)?.event_id||"none")+'</div>';document.querySelector("#reviews").innerHTML=read(REV).slice(-10).reverse().map(x=>'<div class="row"><b>'+new Date(x.at).toLocaleString()+'</b><br>'+esc(x.note)+'<br><span class="muted">'+esc(x.target)+'</span></div>').join("")||'<p class="muted">No forensic reviews.</p>';if(selected)pick(selected,true)}function pick(id,silent){const x=verify().find(z=>z.event_id===id);if(!x){selected=null;document.querySelector("#replay").innerHTML='<p class="muted">Select an event.</p>';return}selected=id;document.querySelector("#replay").innerHTML='<div class="chain"><div class="step"><b>Source</b>Snapshot '+esc(x.source_snapshot_index)+'</div><div class="step"><b>Movement</b>Snapshot '+esc(x.movement_snapshot_index)+' · Δ '+esc(x.movement)+'</div><div class="step"><b>Forecast</b>'+esc(x.forecast)+' · '+esc(x.forecast_version)+'</div><div class="step"><b>Outcome</b>Snapshot '+esc(x.outcome_snapshot_index)+' · '+esc(x.observed_outcome)+'</div><div class="step"><b>Calibration</b>'+esc(x.calibration)+' · '+esc(x.calibration_version)+'</div><div class="step"><b>Integrity</b>'+(x.ok?"VALID":"FAILED")+'</div></div><div class="row"><b>Audit event:</b> '+esc(x.event_id)+'<br><b>Created:</b> '+esc(x.created_at)+'<br><b>Previous event:</b> '+esc(x.previous_ledger_id||"GENESIS")+'<br><b>Fingerprint:</b> <code>'+esc(x.integrity_fingerprint)+'</code><br><b>Chain:</b> <code>'+esc(x.chain_fingerprint)+'</code></div>'}window.pick=pick;document.querySelector("#q").oninput=render;document.querySelector("#status").onchange=render;document.querySelector("#refresh").onclick=render;document.querySelector("#verify").onclick=()=>{render();alert(verify().every(x=>x.ok)?"All ledger events passed integrity checks.":"One or more ledger events failed integrity checks.")};document.querySelector("#save").onclick=()=>{const n=document.querySelector("#note").value.trim();if(!n||!selected)return;const a=read(REV),x=verify().find(z=>z.event_id===selected);a.push({id:"FR-"+Date.now(),at:new Date().toISOString(),target:selected,signal:x?.signal||"",note:n});write(REV,a.slice(-300));document.querySelector("#note").value="";render()};function dl(name,type,data){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}document.querySelector("#json").onclick=()=>{const a=verify(),sel=selected? a.find(x=>x.event_id===selected):null;dl("crowrules-trust-v953-investigation.json","application/json",JSON.stringify({exported_at:new Date().toISOString(),selected_event:sel,integrity_summary:{events:a.length,valid:a.filter(x=>x.ok).length,failed:a.filter(x=>!x.ok).length},ledger:a,reviews:read(REV)},null,2))};render();addEventListener("storage",render);setInterval(render,15000)</script></body></html>
