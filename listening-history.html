</head><body><main id="main-content" class="x"><section class="hero"><div class="ey">MEMBER LIBRARY</div><h1>Listening History</h1><p>Pick up where you left off and review your recent listening activity.</p><div class="actions"><a class="btn primary" href="member-hub.html">← Member Hub</a><a class="btn" href="discover.html">Discover</a></div></section><section class="panel"><div id="list" class="grid"><div class="empty">Loading listening history…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/member-state.js"></script><script>const client=window.CrowRulesData?.getClient?.() || window.supabaseClient||supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY);async function auth(){const {data,error}=await client.auth.getUser();if(error||!data.user){location.href='login.html?redirect='+encodeURIComponent(location.pathname.split('/').pop());return null}return data.user}function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))};(async()=>{const u=await auth();if(!u)return;const {data,error}=await client.from('podcast_episode_progress').select('episode_id,position_seconds,duration_seconds,percent_complete,last_played_at,completed').eq('user_id',u.id).order('last_played_at',{ascending:false}).limit(24);if(error||!data?.length){document.getElementById('list').innerHTML='<div class="empty">No listening history yet. Start exploring podcasts.</div>';return}const ids=data.map(x=>x.episode_id);const q=await client.from('podcast_episodes').select('id,title,description').in('id',ids);const map=new Map((q.data||[]).map(x=>[x.id,x]));document.getElementById('list').innerHTML=data.map(x=>{const e=map.get(x.episode_id)||{};return '<article class="item"><h2>'+esc(e.title||'Episode')+'</h2><p>'+Math.round(Number(x.percent_complete||0))+'% complete · '+esc(x.last_played_at?new Date(x.last_played_at).toLocaleString():'Recently')+'</p><a href="episode.html?id='+encodeURIComponent(x.episode_id)+'">Continue →</a></article>'}).join('')})()</script></body></html>
