<main class="wrap hero"><div class="eyebrow">CREATOR SETTINGS</div><h1>Control your <span class="gradient">workspace.</span></h1><div id="auth" class="notice">Loading settings…</div><form id="settings" class="form" hidden><div class="card"><label>In-app notifications<select id="inapp"><option value="true">Enabled</option><option value="false">Disabled</option></select></label><label>Email notifications<select id="email"><option value="false">Disabled</option><option value="true">Enabled</option></select></label><label>Digest<select id="digest"><option>off</option><option>daily</option><option>weekly</option></select></label></div><div class="card"><label><input id="publishing" type="checkbox" checked> Publishing alerts</label><label><input id="revenue" type="checkbox" checked> Revenue alerts</label><label><input id="audience" type="checkbox" checked> Audience alerts</label><label><input id="goals" type="checkbox" checked> Goal alerts</label></div><button class="btn primary" type="submit">Save notification settings</button><div id="status" class="notice">Changes are saved to Supabase.</div></form></main><script>addEventListener("crow:ready",async()=>{if(!__CROW_USER){auth.textContent="Sign in to manage creator settings.";return}const r=await CROW_SUPABASE.from("cr_creator_notification_preferences").select("*").eq("creator_id",__CROW_USER.id).maybeSingle();const x=r.data||{};inapp.value=String(x.in_app_enabled!==false);email.value=String(x.email_enabled===true);digest.value=x.digest_frequency||"off";publishing.checked=x.publishing_enabled!==false;revenue.checked=x.revenue_enabled!==false;audience.checked=x.audience_enabled!==false;goals.checked=x.goals_enabled!==false;settings.hidden=false;auth.textContent="Settings loaded."});settings.addEventListener("submit",async e=>{e.preventDefault();if(!__CROW_USER)return;const r=await CROW_SUPABASE.from("cr_creator_notification_preferences").upsert({creator_id:__CROW_USER.id,in_app_enabled:inapp.value==="true",email_enabled:email.value==="true",digest_frequency:digest.value,publishing_enabled:publishing.checked,revenue_enabled:revenue.checked,audience_enabled:audience.checked,goals_enabled:goals.checked,updated_at:new Date().toISOString()},{onConflict:"creator_id"});status.textContent=r.error?r.error.message:"Settings saved.";});</script></body></html>
