<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playlist • CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting-platform.css?v=5"><script src="js/podcasting-config.js"></script><script src="js/podcasting-platform.js" defer></script><script src="js/podcasting-player.js" defer></script></head><body><main class="cr-shell"><section class="hero"><div><div class="eyebrow">CrowRules Podcasting • Playlist</div><h1 id="title">PLAYLIST</h1><p id="desc"></p><button id="share" class="btn">↗ Share Playlist</button></div></section><section class="section"><div id="items" class="grid"></div></section></main><script>document.addEventListener('crow:ready',async()=>{const $=x=>document.getElementById(x),E=CrowPodcasting.esc,id=new URLSearchParams(location.search).get('id');if(!id){$('title').textContent='Playlist not specified';return}const p=await CrowPodcasting.getPlaylist(id);if(!p||(!p.is_public&&p.user_id!==CrowPodcasting.user?.id)){$('title').textContent='Playlist unavailable';return}document.title=p.name+' • CrowRules Podcasting';$('title').textContent=p.name;$('desc').textContent=p.description||'';const items=await CrowPodcasting.getPlaylistItems(id);const ids=items.map(x=>x.episode_id);let eps=[];if(ids.length)eps=await CrowPodcasting.rows('podcast_episodes','id,podcast_id,title,description,audio_url,thumbnail_url,duration_seconds',{limit:500});eps=ids.map(i=>eps.find(e=>e.id===i)).filter(Boolean);$('items').innerHTML=eps.map((e,i)=>'<article class="card panel"><h3>'+(i+1)+'. '+E(e.title)+'</h3><p>'+E(e.description||'')+'</p><button class="btn primary" onclick="play(\''+E(e.id)+'\')">▶ Play</button>'+(p.user_id===CrowPodcasting.user?.id?'<button class="btn" onclick="removeItem(\''+E(e.id)+'\')">Remove</button>':'')+'</article>').join('')||'<div class="notice">This playlist has no episodes yet.</div>';window.play=id=>{const e=eps.find(x=>x.id===id);if(e)CrowPodcastPlayer.play({...e,podcast_title:'CrowRules Podcasting'})};window.removeItem=async e=>{await CrowPodcasting.removeFromPlaylist(id,e);location.reload()};$('share').onclick=async()=>{const url=location.href;if(navigator.share){try{await navigator.share({title:p.name,text:'CrowRules Podcasting playlist',url})}catch(_){}}else{await navigator.clipboard.writeText(url);alert('Playlist link copied.')}}})</script></body></html>
