<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revenue Intelligence | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>:root{--bg:#05050b;--line:rgba(255,255,255,.1);--cyan:#55e7ff;--purple:#a879ff;--muted:#9ba3bb}body{margin:0;background:radial-gradient(circle at 15% 0%,rgba(85,231,255,.12),transparent 30%),var(--bg);color:#fff;font-family:Montserrat,system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:44px 18px 80px}.ey{font:800 10px Orbitron;letter-spacing:.18em;color:var(--cyan)}h1{font:800 clamp(36px,6vw,68px)/.95 Orbitron;margin:10px 0}h1 span{color:var(--cyan)}p{color:var(--muted);line-height:1.7}.toolbar{display:flex;gap:9px;margin:24px 0;flex-wrap:wrap}.btn{padding:10px 15px;background:#0b0c16;color:#fff;border:1px solid var(--line);border-radius:10px;cursor:pointer}.active{border-color:var(--cyan)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}.card{padding:20px;border:1px solid var(--line);border-radius:18px;background:rgba(10,11,21,.9)}.label{font-size:9px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase}.value{font:800 24px Orbitron;margin-top:8px}.accent{color:var(--cyan)}.meter{height:10px;background:#11131d;border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));width:0}.notice{margin-top:18px;padding:15px;border-left:3px solid var(--cyan);color:var(--muted);font-size:12px;line-height:1.6}</style><link rel="stylesheet" href="css/global-navigation.css">

<script src="js/domain-service-loader.js" defer></script>

</head><body><header class="site-header"><div class="site-header-inner"><a class="brand" href="creator-finance-command-center.html"><span class="brand-mark">CR</span><span class="brand-text"><span class="brand-name">CROW<span class="glow">RULES</span></span><span class="brand-section">PODCASTING</span></span></a><nav class="main-navigation"><a href="creator-finance-command-center.html">Finance HQ</a><a href="creator-finance-analytics.html">Analytics</a><a href="creator-finance-export.html">Exports</a></nav></div></header><main class="wrap"><div class="ey">CREATOR FINANCE · REVENUE INTELLIGENCE 24.0</div><h1>UNDERSTAND <span>THE NUMBERS.</span></h1><p>Descriptive financial KPIs calculated from your authenticated creator ledger. No forecasts or financial predictions.</p><div class="toolbar"><button class="btn" data-m="6">6 Months</button><button class="btn active" data-m="12">12 Months</button><button class="btn" data-m="24">24 Months</button><button class="btn" data-m="36">36 Months</button></div><div id="app"><div class="notice">Loading intelligence…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>(async()=>{const db=supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabasePublishableKey),app=document.getElementById('app');const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html?redirect=creator-revenue-intelligence.html';return}let months=12;const money=n=>Number(n||0)/100;const pct=b=> (Number(b||0)/100).toFixed(2)+'%';async function load(){const {data,error}=await db.rpc('get_my_podcast_revenue_intelligence',{p_months:months});if(error){app.innerHTML='<div class="notice">'+error.message+'</div>';return}if(!data?.length){app.innerHTML='<div class="notice">No financial activity is currently available.</div>';return}app.innerHTML=data.map(x=>{const f=n=>money(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' '+x.currency.toUpperCase();return '<section class="card" style="margin-top:16px"><div class="ey">'+x.currency.toUpperCase()+' · '+months+' MONTHS</div><div class="grid" style="margin-top:15px"><div class="card"><div class="label">Gross Revenue</div><div class="value">'+f(x.total_gross_cents)+'</div></div><div class="card"><div class="label">Creator Net</div><div class="value accent">'+f(x.total_net_cents)+'</div></div><div class="card"><div class="label">Avg Transaction</div><div class="value">'+f(x.avg_transaction_cents)+'</div></div><div class="card"><div class="label">Transactions</div><div class="value">'+Number(x.total_transactions).toLocaleString()+'</div></div><div class="card"><div class="label">Refund Rate</div><div class="value">'+pct(x.refund_rate_bps)+'</div></div><div class="card"><div class="label">Dispute Rate</div><div class="value">'+pct(x.dispute_rate_bps)+'</div></div><div class="card"><div class="label">Payout Coverage</div><div class="value">'+pct(x.payout_coverage_bps)+'</div><div class="meter"><div class="fill" style="width:'+Math.min(100,Number(x.payout_coverage_bps)/100)+'%"></div></div></div><div class="card"><div class="label">Peak Month</div><div class="value" style="font-size:18px">'+(x.peak_month?new Date(x.peak_month+'T12:00:00').toLocaleDateString(undefined,{month:'short',year:'numeric'}):'—')+'</div><p>'+f(x.peak_month_gross_cents)+'</p></div></div></section>'}).join('')}load();document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('active'));b.classList.add('active');months=Number(b.dataset.m);load()})})()</script></body></html>
