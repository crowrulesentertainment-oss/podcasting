<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030308"><title>Member Activity | CrowRules Podcasting</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="css/crowrules-cinematic.css"><style>:root{--c:#00e5ff;--v:#8b5cf6;--m:#9da5bd;--l:rgba(255,255,255,.1)}body{background:radial-gradient(circle at 15% 0%,#00e5ff18,transparent 32%),radial-gradient(circle at 85% 0%,#8b5cf625,transparent 35%),#030308}.shell{width:min(900px,94%);margin:auto;padding:55px 0 110px}.hero,.panel{border:1px solid var(--l);border-radius:24px;background:#0a0a16e8;padding:28px}.hero{margin-bottom:16px}.ey{font:900 10px Orbitron;color:var(--c);letter-spacing:.16em}.h{font:900 clamp(30px,6vw,52px) Orbitron;margin:10px 0}.muted{color:var(--m);line-height:1.6}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab,.btn{border:1px solid var(--l);border-radius:10px;background:#10101a;color:#fff;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer}.tab.active,.primary{background:linear-gradient(90deg,var(--c),var(--v));color:#030308}.member{display:flex;align-items:center;gap:14px;padding:14px;margin:8px 0;border:1px solid var(--l);border-radius:16px;background:#ffffff05}.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#151522;display:grid;place-items:center;color:var(--c);font-weight:900}.grow{flex:1}.name{font-weight:900}.handle{color:var(--m);font-size:12px}.count{font:900 14px Orbitron;color:var(--c)}.mutual{font-size:10px;color:var(--c);font-weight:900;letter-spacing:.08em;margin-top:4px}.danger{border-color:#ff557755;color:#ff9b9b}.empty{text-align:center;padding:40px;color:var(--m);border:1px dashed var(--l);border-radius:18px}</style></head><body data-crowrules-division="podcasting"><header class="nav"><a class="brand" href="index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header><main class="shell"><section class="hero"><div class="ey">CROWRULES MEMBER ACTIVITY</div><h1 class="h">Your Member Network</h1><p class="muted">Manage the CrowRules members you follow and the members who follow you.</p><div class="tabs"><button class="tab active" data-mode="followers">Followers <span id="fc" class="count">0</span></button><button class="tab" data-mode="following">Following <span id="fg" class="count">0</span></button></div><a class="btn" href="notifications.html">Notifications</a> <a class="btn" href="listener-profile.html">Profile</a></section><section class="panel"><div id="list"><div class="empty">Loading…</div></div></section></main><footer class="footer">CrowRules Podcasting · One Account. One Universe.</footer><script src="assets/js/app.js"></script><script src="js/crowrules-membership.js"></script><script src="js/crowrules-cinematic.js"></script><script>(async()=>{const sb=await loadSupabase(),list=document.getElementById("list"),fc=document.getElementById("fc"),fg=document.getElementById("fg");const {data:u}=await sb.auth.getUser();if(!u.user){location.href="login.html?next="+encodeURIComponent(location.href);return}const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const profiles={};let followers=[],following=[],mode="followers";async function load(){const [a,b]=await Promise.all([sb.from("podcast_member_follows").select("id,follower_user_id,created_at").eq("followed_user_id",u.user.id).order("created_at",{ascending:false}),sb.from("podcast_member_follows").select("id,followed_user_id,created_at").eq("follower_user_id",u.user.id).order("created_at",{ascending:false})]);if(a.error||b.error){list.innerHTML='<div class="empty">'+esc((a.error||b.error).message)+'</div>';return}followers=a.data||[];following=b.data||[];fc.textContent=followers.length;fg.textContent=following.length;const ids=[...new Set([...followers.map(x=>x.follower_user_id),...following.map(x=>x.followed_user_id)])];if(ids.length){const p=await sb.from("podcast_member_profiles").select("user_id,display_name,username,avatar_url,is_public").in("user_id",ids);if(!p.error)(p.data||[]).forEach(x=>profiles[x.user_id]=x)}render()}function render(){const rows=mode==="followers"?followers:following;const followerSet=new Set(followers.map(x=>x.follower_user_id));if(!rows.length){list.innerHTML='<div class="empty">'+(mode==="followers"?"No members follow you yet.":"You are not following any members yet.")+'</div>';return}list.innerHTML=rows.map(x=>{const id=mode==="followers"?x.follower_user_id:x.followed_user_id,p=profiles[id]||{},name=p.display_name||p.username||"CrowRules Member";return '<div class="member"><div class="avatar">'+(p.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'" alt="">':esc(name.charAt(0).toUpperCase()))+'</div><div class="grow"><div class="name">'+esc(name)+'</div>'+(p.username?'<div class="handle">@'+esc(p.username)+'</div>':"")+(mode==="following"&&followerSet.has(id)?'<div class="mutual">↔ MUTUAL FOLLOW</div>':"")+'</div>'+(mode==="following"?'<button class="btn danger unfollow" data-id="'+encodeURIComponent(id)+'">Unfollow</button>':"")+'<a class="btn" href="member-profile.html?user='+encodeURIComponent(id)+'">View</a></div>'}).join("")}document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;render()});document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;render()});document.addEventListener("click",async e=>{const b=e.target.closest(".unfollow");if(!b)return;b.disabled=true;const id=decodeURIComponent(b.dataset.id);const q=await sb.from("podcast_member_follows").delete().eq("follower_user_id",u.user.id).eq("followed_user_id",id);if(q.error){b.disabled=false;return}following=following.filter(x=>x.followed_user_id!==id);fg.textContent=following.length;render()});load()})()</script></body></html>
