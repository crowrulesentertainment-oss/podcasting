<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Release Calendar — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">CROWRULES RELEASE CALENDAR 2.4</div><h1>Release <span class="gradient">calendar.</span></h1><p class="lead">Your creator schedule, upcoming releases and publication history in one view.</p><div id="auth" class="notice">Checking account…</div><div id="app" style="display:none"><div class="actions"><a class="btn" href="creator-dashboard.html">← Creator Studio</a><a class="btn" href="create-episode.html">＋ New episode</a></div><div id="calendar" class="grid"></div></div></main><script>const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));addEventListener("crow:ready",async()=>{if(!__CROW_USER){auth.textContent="Sign in to view your release calendar.";return}app.style.display="block";const p=await CROW_SUPABASE.from("podcasts").select("id,title").eq("creator_id",__CROW_USER.id);const ids=(p.data||[]).map(x=>x.id);const s=ids.length?await CROW_SUPABASE.from("podcast_schedule").select("id,podcast_id,episode_id,title,starts_at,ends_at,status,timezone,recurrence").in("podcast_id",ids).order("starts_at",{ascending:true}):{data:[]};const rows=s.data||[];calendar.innerHTML=rows.length?rows.map(x=>'<article class="card"><span class="pill">'+esc(x.status)+'</span><h2>'+esc(x.title)+'</h2><p>'+esc((p.data||[]).find(y=>y.id===x.podcast_id)?.title||"Podcast")+'</p><h3>'+new Date(x.starts_at).toLocaleString([], {dateStyle:"full",timeStyle:"short"})+'</h3><p>'+ (x.ends_at?"Ends "+new Date(x.ends_at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"") +(x.recurrence?" · "+esc(x.recurrence):"")+'</p><a class="btn" href="publishing-pipeline.html?episode='+x.episode_id+'">Open pipeline</a></article>').join(""):'<div class="card"><h2>No scheduled releases</h2><p>Your calendar is clear. Schedule an episode from Creator Studio.</p></div>'});</script></body></html>
