<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Release Calendar — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script><style>.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.month{font:800 22px Orbitron}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.dow{padding:8px;color:#98a1b7;font-size:9px;text-transform:uppercase;letter-spacing:.1em}.day{min-height:125px;border:1px solid #ffffff10;border-radius:14px;background:#080a12;padding:10px;overflow:hidden}.day.muted{opacity:.45}.day.today{border-color:#55e7ff66;box-shadow:inset 0 0 0 1px #55e7ff22}.num{font:700 12px Orbitron;margin-bottom:8px}.event{display:block;padding:7px 8px;margin:5px 0;border-radius:9px;background:#55e7ff0d;border:1px solid #55e7ff20;text-decoration:none}.event b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event small{color:#98a1b7;font-size:8px}@media(max-width:800px){.week{grid-template-columns:repeat(1,1fr)}.dow{display:none}.day{min-height:auto}.day.muted{display:none}} </style></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">CROWRULES RELEASE CALENDAR 2.5</div><h1>Release <span class="gradient">control room.</span></h1><p class="lead">A month view for scheduled audio releases, with direct links into the publishing pipeline.</p><div id="auth" class="notice">Checking account…</div><div id="app" style="display:none"><div class="actions"><a class="btn" href="creator-dashboard.html">← Creator Studio</a><a class="btn primary" href="create-episode.html">＋ New episode</a><button class="btn" id="prev">← Previous</button><button class="btn" id="next">Next →</button></div><section class="section"><div class="card"><div class="calendar-head"><div class="month" id="month"></div><span class="pill" id="count">0 releases</span></div><div class="week"><div class="dow">Sun</div><div class="dow">Mon</div><div class="dow">Tue</div><div class="dow">Wed</div><div class="dow">Thu</div><div class="dow">Fri</div><div class="dow">Sat</div></div><div class="week" id="days"></div></div></section></div></main><script>const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let current=new Date();current.setDate(1);let rows=[],shows=[];function draw(){const y=current.getFullYear(),m=current.getMonth();month.textContent=current.toLocaleString([],{month:"long",year:"numeric"});const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),prevLast=new Date(y,m,0).getDate(),cells=[];for(let i=0;i<42;i++){const n=i-first+1;let date,muted=false;if(n<1){date=new Date(y,m-1,prevLast+n);muted=true}else if(n>last){date=new Date(y,m+1,n-last);muted=true}else date=new Date(y,m,n);const key=date.toISOString().slice(0,10),events=rows.filter(x=>new Date(x.starts_at).toISOString().slice(0,10)===key);const today=new Date();const isToday=date.toDateString()===today.toDateString();cells.push('<div class="day '+(muted?"muted ":"")+(isToday?"today":"")+'"><div class="num">'+date.getDate()+'</div>'+events.map(e=>'<a class="event" href="publishing-pipeline.html?episode='+encodeURIComponent(e.episode_id)+'"><b>'+esc(e.title)+'</b><small>'+esc((shows.find(s=>s.id===e.podcast_id)||{}).title||"Podcast")+' · '+new Date(e.starts_at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+'</small></a>').join("")+'</div>')}days.innerHTML=cells.join("");count.textContent=rows.filter(x=>{const d=new Date(x.starts_at);return d.getFullYear()===y&&d.getMonth()===m}).length+" releases"}async function load(){if(!__CROW_USER){auth.textContent="Sign in to view your release calendar.";return}app.style.display="block";auth.textContent="Signed in as "+(__CROW_USER.email||"Creator");const p=await CROW_SUPABASE.from("podcasts").select("id,title").eq("creator_id",__CROW_USER.id);shows=p.data||[];const ids=shows.map(x=>x.id);const s=ids.length?await CROW_SUPABASE.from("podcast_schedule").select("id,podcast_id,episode_id,title,starts_at,ends_at,status,timezone,recurrence").in("podcast_id",ids).order("starts_at",{ascending:true}):{data:[]};rows=s.data||[];draw()}prev.onclick=()=>{current.setMonth(current.getMonth()-1);draw()};next.onclick=()=>{current.setMonth(current.getMonth()+1);draw()};addEventListener("crow:ready",load);</script></body></html>
