</head><body><main class="section wrap"><h1>REPLICA TRUST MESH <span>30.0</span></h1><p>Durable cryptographic identities, signed heartbeats, Byzantine quarantine, trust certificates and supermajority quorum monitoring.</p><section id="status" class="card"><p>Loading trust mesh…</p></section><section class="card"><h2>Register Replica</h2><input id="replica" placeholder="Replica ID"><input id="region" placeholder="Region"><button id="register">REGISTER</button><pre id="secret"></pre></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>(async()=>{const db=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const status=document.querySelector('#status');async function refresh(){const {data,error}=await db.from('podcast_recommendation_consensus_state_27').select('*').eq('id',true).maybeSingle();if(error){status.textContent='Trust mesh unavailable.';return}status.innerHTML='<h2>'+data.state+'</h2><p>Quorum: '+data.quorum_required+' · Active replicas: '+data.replica_count+' · Verified: '+data.verified_count+'</p><p>Divergence: '+(data.divergence_detected?'DETECTED':'NONE')+' · Cache epoch: '+data.consensus_cache_epoch+'</p>'}document.querySelector('#register').onclick=async()=>{const {data,error}=await db.rpc('podcast_recommendation_register_replica_30',{p_replica_id:document.querySelector('#replica').value.trim(),p_region:document.querySelector('#region').value.trim()});document.querySelector('#secret').textContent=error?error.message:'Heartbeat secret (store securely; shown once): '+data.heartbeat_secret;await refresh()};await refresh();setInterval(refresh,15000)})()</script></body></html>
