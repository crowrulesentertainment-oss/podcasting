<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030308"><title>Member Discovery | CrowRules Podcasting</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="css/crowrules-cinematic.css"><style>:root{--c:#00e5ff;--v:#8b5cf6;--m:#9da5bd;--l:rgba(255,255,255,.1)}body{background:radial-gradient(circle at 15% 0%,#00e5ff18,transparent 32%),radial-gradient(circle at 85% 0%,#8b5cf625,transparent 35%),#030308}.shell{width:min(950px,94%);margin:auto;padding:55px 0 110px}.hero,.panel{border:1px solid var(--l);border-radius:24px;background:#0a0a16e8;padding:28px}.hero{margin-bottom:16px}.ey{font:900 10px Orbitron;color:var(--c);letter-spacing:.16em}.h{font:900 clamp(30px,6vw,52px) Orbitron;margin:10px 0}.muted{color:var(--m);line-height:1.6}.search{display:flex;gap:10px;margin-top:22px}.search input{flex:1;min-width:0;background:#05050b;border:1px solid var(--l);border-radius:12px;padding:14px;color:#fff}.btn{border:1px solid var(--l);border-radius:10px;background:#10101a;color:#fff;padding:11px 15px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(90deg,var(--c),var(--v));color:#030308}.member{display:flex;align-items:center;gap:14px;padding:15px;margin:8px 0;border:1px solid var(--l);border-radius:16px;background:#ffffff05}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#151522;display:grid;place-items:center;color:var(--c);font-weight:900}.grow{flex:1}.name{font-weight:900}.handle{color:var(--m);font-size:12px}.bio{color:var(--m);font-size:12px;margin-top:5px}.status{font-size:10px;color:var(--c);font-weight:900;letter-spacing:.08em;margin-top:4px}.empty{text-align:center;padding:42px;color:var(--m);border:1px dashed var(--l);border-radius:18px}.hint{margin-top:12px;font-size:12px;color:var(--m)}</style></head><body data-crowrules-division="podcasting"><header class="nav"><a class="brand" href="index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header><main class="shell"><section class="hero"><div class="ey">CROWRULES MEMBER DISCOVERY</div><h1 class="h">Find Your People</h1><p class="muted">Search public CrowRules member profiles and build your Podcasting network.</p><div class="search"><input id="q" placeholder="Search by name or username…" autocomplete="off"><button class="btn primary" id="go">Search</button></div><div class="hint">Only public member profiles appear in discovery.</div></section><section class="panel"><div id="results"><div class="empty">Search for a CrowRules member.</div></div></section></main><script src="assets/js/app.js"></script><script src="js/crowrules-membership.js"></script><script src="js/crowrules-cinematic.js"></script><script>(async()=>{const sb=await loadSupabase(),q=document.getElementById("q"),go=document.getElementById("go"),results=document.getElementById("results");const {data:u}=await sb.auth.getUser();if(!u.user){location.href="login.html?next="+encodeURIComponent(location.href);return}const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));async function search(){const term=q.value.trim();if(term.length<2){results.innerHTML='<div class="empty">Enter at least 2 characters.</div>';return}results.innerHTML='<div class="empty">Searching…</div>';const [a,b]=await Promise.all([sb.from("podcast_member_profiles").select("user_id,display_name,username,bio,avatar_url").eq("is_public",true).ilike("display_name","%"+term+"%").limit(25),sb.from("podcast_member_profiles").select("user_id,display_name,username,bio,avatar_url").eq("is_public",true).ilike("username","%"+term+"%").limit(25)]);if(a.error||b.error){results.innerHTML='<div class="empty">'+esc((a.error||b.error).message)+'</div>';return}const map=new Map([...((a.data)||[]),...((b.data)||[])].map(x=>[x.user_id,x]));const rows=[...map.values()].filter(x=>x.user_id!==u.user.id);if(!rows.length){results.innerHTML='<div class="empty">No public members found for “'+esc(term)+'”.</div>';return}const ids=rows.map(x=>x.user_id);const f=await sb.from("podcast_member_follows").select("followed_user_id").eq("follower_user_id",u.user.id).in("followed_user_id",ids);const followed=new Set((f.data||[]).map(x=>x.followed_user_id));results.innerHTML=rows.map(p=>'<div class="member"><div class="avatar">'+(p.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'" alt="">':esc((p.display_name||p.username||"C").charAt(0).toUpperCase()))+'</div><div class="grow"><div class="name">'+esc(p.display_name||p.username||"CrowRules Member")+'</div>'+(p.username?'<div class="handle">@'+esc(p.username)+'</div>':"")+(p.bio?'<div class="bio">'+esc(p.bio)+'</div>':"")+(followed.has(p.user_id)?'<div class="status">✓ FOLLOWING</div>':"")+'</div>'+(followed.has(p.user_id)?'<button class="btn" disabled>Following</button>':'<button class="btn primary follow" data-id="'+encodeURIComponent(p.user_id)+'">Follow</button>')+'<a class="btn" href="member-profile.html?user='+encodeURIComponent(p.user_id)+'">View</a></div>').join("")}document.getElementById("go").onclick=search;q.addEventListener("keydown",e=>{if(e.key==="Enter")search()});results.addEventListener("click",async e=>{const b=e.target.closest(".follow");if(!b)return;b.disabled=true;const id=decodeURIComponent(b.dataset.id);const r=await sb.from("podcast_member_follows").insert({follower_user_id:u.user.id,followed_user_id:id});if(r.error){b.disabled=false;return}b.textContent="Following";b.classList.remove("primary");const st=document.createElement("div");st.className="status";st.textContent="✓ FOLLOWING";b.parentElement.querySelector(".grow").appendChild(st)});nav()})()</script></body></html>
