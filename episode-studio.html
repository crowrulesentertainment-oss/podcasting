<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Episode Studio — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">EPISODE STUDIO 5.0</div><h1>Build the <span class="gradient">episode.</span></h1><p class="lead">Upload audio, shape the metadata, preview the episode, then save it as a draft for publishing.</p><div id="auth" class="notice">Checking account…</div><form id="studio" class="form" hidden><div class="card"><label>Podcast<select id="podcast" required></select></label></div><div class="grid two"><div class="card"><label>Episode title<input id="title" required maxlength="180"></label><label>Slug<input id="slug" required></label><div class="grid two"><label>Season<input id="season" type="number" min="1"></label><label>Episode<input id="number" type="number" min="1"></label></div></div><div class="card"><label>Access<select id="access"><option value="free">Free</option><option value="members">Members</option><option value="premium">Premium</option></select></label><label><input id="explicit" type="checkbox"> Explicit content</label><label>Publish date<input id="publishAt" type="datetime-local"></label></div></div><div class="card"><label>Description<textarea id="description"></textarea></label><label>Show notes<textarea id="notes"></textarea></label><label>Transcript<textarea id="transcript"></textarea></label></div><div class="card"><label>Audio file<input id="audio" type="file" accept="audio/*,video/mp4,video/webm" required></label><div id="upload" class="notice">Audio uploads use the CrowRules podcast media storage.</div></div><div class="actions"><button class="btn primary" type="submit">Save episode draft</button><button class="btn" type="button" id="preview">Preview audio</button></div></form></main><script>const $=id=>document.getElementById(id);const slugify=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");addEventListener("crow:ready",async()=>{if(!__CROW_USER){$("auth").textContent="Sign in to use Episode Studio.";return}$("studio").hidden=false;$("auth").textContent="Creator workspace ready.";const r=await CROW_SUPABASE.from("podcasts").select("id,title").eq("creator_id",__CROW_USER.id).order("title");$("podcast").innerHTML=(r.data||[]).map(p=>'<option value="'+p.id+'">'+p.title.replace(/</g,"&lt;")+"</option>").join("");if(new URLSearchParams(location.search).get("podcast"))$("podcast").value=new URLSearchParams(location.search).get("podcast")});$("title").addEventListener("input",()=>{if(!$("slug").dataset.edited)$("slug").value=slugify($("title").value)});$("slug").addEventListener("input",()=>$("slug").dataset.edited="1");$("audio").addEventListener("change",()=>{const f=$("audio").files[0];$("upload").textContent=f?f.name+" · "+(f.size/1048576).toFixed(1)+" MB":"Audio uploads use the CrowRules podcast media storage."});$("preview").onclick=()=>{const f=$("audio").files[0];if(!f)return alert("Choose an audio file first.");const u=URL.createObjectURL(f);window.CROW_PLAYER?.play(u,$("title").value||"Episode preview","Unsaved preview","")};$("studio").addEventListener("submit",async e=>{e.preventDefault();if(!__CROW_USER)return;const file=$("audio").files[0];if(!file)return alert("Choose an audio file.");$("upload").textContent="Uploading audio…";const id=crypto.randomUUID();const ext=(file.name.split(".").pop()||"mp3").toLowerCase();const path=__CROW_USER.id+"/"+id+"."+ext;const up=await CROW_SUPABASE.storage.from("cr-podcast-media").upload(path,file,{upsert:false,contentType:file.type||"audio/mpeg"});if(up.error){$("upload").textContent=up.error.message;return}const audioUrl=CROW_SUPABASE.storage.from("cr-podcast-media").getPublicUrl(path).data.publicUrl;const payload={id,podcast_id:$("podcast").value,title:$("title").value.trim(),slug:$("slug").value.trim(),description:$("description").value.trim()||null,show_notes:$("notes").value.trim()||null,transcript:$("transcript").value.trim()||null,season_number:Number($("season").value)||null,episode_number:Number($("number").value)||null,duration_seconds:null,audio_url:audioUrl,status:"draft",is_explicit:$("explicit").checked,access_level:$("access").value,published_at:null};const ins=await CROW_SUPABASE.from("podcast_episodes").insert(payload).select("id").single();if(ins.error){$("upload").textContent=ins.error.message;return}
await CROW_SUPABASE.functions.invoke(CROW_CONFIG.pipelineFunction,{body:{action:"log",episode_id:ins.data.id,event_type:"created",to_status:"draft",message:"Episode draft created in Episode Studio."}});
await CROW_SUPABASE.functions.invoke(CROW_CONFIG.pipelineFunction,{body:{action:"log",episode_id:ins.data.id,event_type:"upload_completed",to_status:"draft",message:"Audio uploaded and attached to the episode draft.",metadata:{filename:file.name,size_bytes:file.size,mime_type:file.type||"audio/mpeg"}}});
$("upload").textContent="Draft saved. Episode ID: "+ins.data.id;location.href="publishing-pipeline.html?episode="+ins.data.id});</script></body></html>
