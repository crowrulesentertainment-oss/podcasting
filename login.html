<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcasting Sign In</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script></head><body><div id="cr-app" data-cr-shell="crowrules-podcasting-sitewide-v5"></div><main class="page"><div class="form-wrap panel"><span class="eyebrow">PODCASTING ACCOUNT</span><h1>Welcome back.</h1><form id="f"><div class="field"><label>EMAIL</label><input id="email" type="email" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" required></div><button class="btn primary">SIGN IN</button><div id="msg" class="status"></div></form><p class="status">New here? <a href="signup.html">Create your Podcasting account →</a></p></div></main><script>addEventListener('load',()=>f.onsubmit=async e=>{e.preventDefault();const{error}=await CROW_PODCASTING.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg.textContent=error.message;else location.href='profile.html'})</script><div id="cr-player" data-cr-player="crowrules-podcasting-sitewide-v5"></div></body></html>
