<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Studio — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">CREATOR STUDIO</div><h1>Build your <span class="gradient">show.</span></h1><div id="auth" class="notice">Checking account…</div><div id="dashboard" style="display:none"><div class="actions"><a class="btn primary" href="create-podcast.html">Create Podcast</a><a class="btn" href="create-episode.html">Create Episode</a><button class="btn" id="connect">Monetization & Payouts</button></div><div class="grid"><div class="card"><div class="stat" id="shows">0</div><p>Your podcasts</p></div><div class="card"><div class="stat" id="eps">0</div><p>Your episodes</p></div><div class="card"><div class="stat" id="earn">$0.00</div><p>Recorded earnings</p></div></div><h2 style="margin-top:45px">Your Podcasts</h2><div id="list" class="grid"></div></div></main><script>addEventListener("crow:ready",async()=>{if(!__CROW_USER){auth.textContent="Sign in to open Creator Studio.";return}dashboard.style.display="block";auth.textContent="Signed in as "+(__CROW_USER.email||"Creator");const p=await CROW_SUPABASE.from("podcasts").select("id,title,status,category,total_plays,listener_count").eq("creator_id",__CROW_USER.id).order("created_at",{ascending:false});shows.textContent=(p.data||[]).length;list.innerHTML=(p.data||[]).map(x=>'<article class="card"><span class="pill">'+x.status+'</span><h3>'+x.title+'</h3><p>'+(x.category||"Podcast")+' · '+(x.total_plays||0)+' plays</p><a class="btn" href="podcast.html?id='+x.id+'">View</a></article>').join("")||'<div class="notice">Create your first podcast.</div>';const ids=(p.data||[]).map(x=>x.id);if(ids.length){const e=await CROW_SUPABASE.from("podcast_episodes").select("id").in("podcast_id",ids);eps.textContent=(e.data||[]).length}const m=await CROW_SUPABASE.from("cr_podcast_revenue_snapshots").select("gross_revenue_cents,net_revenue_cents").eq("creator_id",__CROW_USER.id);const total=(m.data||[]).reduce((n,x)=>n+Number(x.net_revenue_cents||x.gross_revenue_cents||0),0);earn.textContent="$"+(total/100).toFixed(2);connect.onclick=()=>location.href="creator-payouts.html"});</script></body></html>
