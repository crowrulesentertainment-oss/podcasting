<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>
(()=>{const $=x=>document.getElementById(x),db=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));function notice(m){$("notice").innerHTML='<div class="panel">'+esc(m)+'</div>'}
async function boot(){try{const id=new URLSearchParams(location.search).get("id");if(!id){location.href="podcast-manager.html";return}$("back").href="podcast-binge.html?id="+encodeURIComponent(id);const u=await db.auth.getUser();if(!u.data.user){location.href="login.html?redirect="+encodeURIComponent("podcast-lifecycle.html?id="+id);return}const m=await db.from("members").select("id").eq("user_id",u.data.user.id).maybeSingle();if(m.error)throw m.error;const c=await db.from("creators").select("id").eq("member_id",m.data.id).eq("is_active",true).maybeSingle();if(c.error)throw c.error;if(!c.data)throw Error("No active creator profile found.");const p=await db.from("podcasts").select("id,title,description").eq("id",id).eq("creator_id",c.data.id).maybeSingle();if(p.error)throw p.error;if(!p.data)throw Error("Podcast not found or you do not own it.");const q=await db.rpc("get_podcast_episode_lifecycle",{p_podcast_id:id});if(q.error)throw q.error;const rows=q.data||[];const pub=rows.filter(x=>x.status==="published"),plays=rows.reduce((a,x)=>a+Number(x.plays||0),0),listeners=rows.reduce((a,x)=>a+Number(x.listeners||0),0),discovery=rows.reduce((a,x)=>a+Number(x.discovery_entries||0),0),avgComp=pub.length?pub.reduce((a,x)=>a+Number(x.avg_completion||0),0)/pub.length:0;const stageCounts={};rows.forEach(x=>stageCounts[x.lifecycle_stage]=(stageCounts[x.lifecycle_stage]||0)+1);
$("hero").innerHTML='<div class="ey">Episode Lifecycle & Content Performance Intelligence</div><h1>'+esc(p.data.title)+'</h1><p class="desc">'+esc(p.data.description||"Track each episode from launch through catalog life using audience, retention, discovery, and journey signals.")+'</p><div class="callout">Lifecycle stages are based on time since publication: Launch (0–7 days), Early (8–30), Established (31–90), and Catalog (91+). Performance metrics are observed from the current listening records.</div>';
const fmt=n=>Number(n||0).toLocaleString();$("stats").innerHTML='<div class="stat"><div class="label">Published Episodes</div><div class="value">'+fmt(pub.length)+'</div></div><div class="stat"><div class="label">Total Listen Events</div><div class="value">'+fmt(plays)+'</div></div><div class="stat"><div class="label">Discovery Entries</div><div class="value">'+fmt(discovery)+'</div></div><div class="stat"><div class="label">Avg Completion</div><div class="value">'+avgComp.toFixed(1)+'%</div></div>';
const max=Math.max(1,...rows.map(x=>Number(x.plays||0)));const cards=rows.map(x=>{const comp=Number(x.completion_rate||0),width=Math.min(100,Number(x.plays||0)/max*100);return '<div class="item"><div class="row"><div><b>'+esc(x.title||"Untitled episode")+'</b><div class="muted">'+esc(x.lifecycle_stage)+' · '+(x.published_at?new Date(x.published_at).toLocaleDateString():"Not published")+' · '+Number(x.age_days||0).toFixed(0)+' days</div></div><span class="badge">'+esc(x.status||"unknown")+'</span></div><div class="bar"><i style="width:'+width+'%"></i></div><div class="muted">'+fmt(x.plays)+' listens · '+fmt(x.listeners)+' listeners · '+Number(x.avg_completion||0).toFixed(1)+'% avg progress · '+comp.toFixed(1)+'% completed · '+fmt(x.discovery_entries)+' discovery entries · '+fmt(x.next_episode_transitions)+' next-episode transitions</div></div>'}).join("")||'<div class="muted">No episodes found.</div>';
const stage=["LAUNCH","EARLY","ESTABLISHED","CATALOG","PRE-RELEASE"].map(s=>'<div class="stat"><div class="label">'+s+'</div><div class="value">'+(stageCounts[s]||0)+'</div></div>').join("");
$("content").innerHTML='<section class="panel" style="grid-column:1/-1"><div class="ey">Lifecycle Map</div><h2>Catalog by episode age</h2><div class="stats">'+stage+'</div></section><section class="panel" style="grid-column:1/-1"><div class="ey">Episode Performance</div><h2>Lifecycle performance by episode</h2>'+cards+'</section><section class="panel" style="grid-column:1/-1"><div class="ey">Reading the Signals</div><div class="grid"><div><h3>Discovery</h3><p class="muted">Discovery entries identify episodes that were the first recorded episode for an identified listener in this podcast.</p></div><div><h3>Journey movement</h3><p class="muted">Next-episode transitions show observed movement from an episode into another episode within the journey window.</p></div><div><h3>Retention</h3><p class="muted">Average progress and completion are derived from listener tracking events.</p></div><div><h3>Lifecycle</h3><p class="muted">Age stages help separate launch performance from long-tail catalog performance without ranking episodes as inherently better or worse.</p></div></div><div class="actions"><a class="btn" href="podcast-binge.html?id='+encodeURIComponent(id)+'">Binge Intelligence</a><a class="btn" href="podcast-journey.html?id='+encodeURIComponent(id)+'">Listener Journey</a><a class="btn" href="podcast-retention.html?id='+encodeURIComponent(id)+'">Retention</a><a class="btn" href="podcast-dashboard.html?id='+encodeURIComponent(id)+'">Dashboard</a></div></section>';
$("hero").hidden=$("stats").hidden=$("content").hidden=false}catch(e){notice(e.message||"Unable to load episode lifecycle intelligence.")}}boot()})();
