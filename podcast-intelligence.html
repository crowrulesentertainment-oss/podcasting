<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>Podcast Audience & Performance Intelligence | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>.wrapx{width:min(1200px,92vw);margin:auto;padding:28px 0 70px}.top,.head,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.top{flex-wrap:wrap}.btn{display:inline-flex;padding:10px 13px;border:1px solid #3b3b5b;border-radius:11px;color:#fff;text-decoration:none;font-size:10px;font-weight:800}.hero,.panel{margin-top:18px;padding:22px;border:1px solid #26263c;border-radius:20px;background:rgba(12,13,24,.9)}h1{font:800 clamp(25px,5vw,44px) Orbitron;margin:8px 0}.ey{font:800 10px Orbitron;color:#55e7ff;letter-spacing:.18em;text-transform:uppercase}.muted{color:#727a96;font-size:9px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:16px;border:1px solid #26263c;border-radius:16px;background:rgba(12,13,24,.9);margin-top:18px}.val{font:800 24px Orbitron;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.bar{height:8px;background:#191a2b;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#55e7ff,#a879ff)}.item{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}.item:last-child{border:0}.pill{font-size:8px;text-transform:uppercase;padding:5px 7px;border:1px solid #34364e;border-radius:999px}.trend{height:170px;display:flex;align-items:end;gap:8px}.col{flex:1;height:var(--h);min-width:8px;background:linear-gradient(180deg,#55e7ff,#a879ff);border-radius:6px 6px 2px 2px;position:relative}.col span{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);font-size:7px;color:#727a96;white-space:nowrap}@media(max-width:800px){.cards,.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.card </head><body><main class="wrapx"><div class="top"><a href="podcast-dashboard.html" class="btn">← Podcast Dashboard</a><a href="creator-studio.html" class="btn">Creator Studio</a></div><div id="notice"></div><section id="app" hidden></section><div id="cards" class="cards" hidden></div><div id="grid" class="grid" hidden></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>(()=>{const $=x=>document.getElementById(x),db=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),fmt=n=>Number(n||0).toLocaleString();async function go(){try{const id=new URLSearchParams(location.search).get('id');if(!id){location.href='podcast-manager.html';return}const u=await db.auth.getUser();if(!u.data.user){location.href='login.html?redirect='+encodeURIComponent(location.pathname+'?id='+id);return}const m=await db.from('members').select('id').eq('user_id',u.data.user.id).maybeSingle();if(m.error)throw m.error;const c=await db.from('creators').select('id').eq('member_id',m.data.id).eq('is_active',true).maybeSingle();if(c.error)throw c.error;const p=await db.from('podcasts').select('id,title,category,description,artwork_url,status,is_live,listener_count,total_plays').eq('id',id).eq('creator_id',c.data.id).maybeSingle();if(p.error)throw p.error;if(!p.data)throw Error('Podcast not found or you do not own it.');const q=await db.from('podcast_episodes').select('id,title,episode_number,season_number,status,published_at,created_at,play_count,duration_seconds').eq('podcast_id',id).order('created_at',{ascending:false});if(q.error)throw q.error;const e=q.data||[],sum=e.reduce((a,x)=>a+Number(x.play_count||0),0),pub=e.filter(x=>x.status==='published'),avg=e.length?Math.round(sum/e.length):0,max=Math.max(1,...e.map(x=>Number(x.play_count||0)));const months=[];for(let n=5;n>=0;n--){const d=new Date();d.setMonth(d.getMonth()-n);months.push({k:d.getFullYear()+'-'+d.getMonth(),l:d.toLocaleDateString(undefined,{month:'short'}),n:0})}e.forEach(x=>{const d=new Date(x.created_at),z=months.find(a=>a.k===d.getFullYear()+'-'+d.getMonth());if(z)z.n++});const mm=Math.max(1,...months.map(x=>x.n));$('app').innerHTML='<section class="hero"><div class="ey">Audience & Performance Intelligence</div><h1>'+esc(p.data.title)+'</h1><div class="muted">'+esc(p.data.category||'Uncategorized')+' · '+esc(p.data.status||'draft')+(p.data.is_live?' · LIVE':'')+'</div><div class="top" style="margin-top:18px"><div>'+esc(p.data.description||'No description yet.')+'</div><a class="btn" href="analytics.html">Creator Analytics</a></div></section>';$('cards').innerHTML='<div class="card"><div class="muted">TOTAL PLAYS</div><div class="val">'+fmt(Math.max(Number(p.data.total_plays||0),sum))+'</div></div><div class="card"><div class="muted">LISTENERS</div><div class="val">'+fmt(p.data.listener_count)+'</div></div><div class="card"><div class="muted">AVG PLAYS / EPISODE</div><div class="val">'+fmt(avg)+'</div></div><div class="card"><div class="muted">PUBLISHED</div><div class="val">'+fmt(pub.length)+'</div></div>';$('grid').innerHTML='<section class="panel"><div class="head"><div><b>Top Episodes</b><div class="muted">Ranked by recorded plays</div></div></div>'+(e.length?[...e].sort((a,b)=>Number(b.play_count||0)-Number(a.play_count||0)).slice(0,7).map((x,i)=>'<div class="item"><div class="row"><span>'+esc((i+1)+'. '+x.title)+'</span><b>'+fmt(x.play_count)+'</b></div><div class="bar"><i style="--w:'+Math.round(Number(x.play_count||0)/max*100)+'%"></i></div><div class="muted">S'+(x.season_number||0)+' · E'+(x.episode_number||0)+' · '+esc(x.status||'draft')+'</div></div>').join(''):'<div class="muted">No episode data yet.</div>')+'</section><section class="panel"><div class="head"><div><b>Publishing Activity</b><div class="muted">Episodes created over the last six months</div></div></div><div class="trend">'+months.map(x=>'<div class="col" style="--h:'+Math.max(8,Math.round(x.n/mm*145))+'px"><span>'+x.l+' · '+x.n+'</span></div>').join('')+'</div><div class="item"><div class="row"><span>Published rate</span><b>'+ (e.length?Math.round(pub.length/e.length*100):0)+'%</b></div></div><div class="item"><div class="row"><span>Draft episodes</span><b>'+fmt(e.length-pub.length)+'</b></div></div><div class="item"><div class="row"><span>Catalog duration</span><b>'+fmt(Math.round(e.reduce((a,x)=>a+Number(x.duration_seconds||0),0)/60))+' min</b></div></div></section>';$('app').hidden=$('cards').hidden=$('grid').hidden=false}catch(x){$('notice').innerHTML='<div class="panel">'+esc(x.message||'Unable to load intelligence dashboard.')+'</div>'}}go()})();</script></body></html>
