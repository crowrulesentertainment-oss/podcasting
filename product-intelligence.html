<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Intelligence | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>:root{--c:#42e8ff;--p:#9b6cff;--m:#9ca3b7;--b:rgba(255,255,255,.1)}body{background:#05050b;color:#fff}.wrap{max-width:1200px;margin:auto;padding:36px 18px 80px}.ey{font:800 10px Orbitron;letter-spacing:.18em;color:var(--c)}h1{font:800 clamp(38px,7vw,68px) Orbitron;margin:10px 0}h1 span{color:var(--c)}p{color:var(--m);line-height:1.6}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.kpi,.card{background:rgba(12,13,24,.92);border:1px solid var(--b);border-radius:18px;padding:20px}.kpi strong{display:block;font:800 28px Orbitron;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.row{border:1px solid var(--b);border-radius:14px;padding:16px;margin-top:10px}.name{font:800 17px Orbitron}.meta{font-size:12px;color:var(--m);margin-top:6px}.bar{height:7px;background:#171827;border-radius:99px;margin-top:12px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--c),var(--p));width:0}.money{font:800 22px Orbitron;margin-top:8px}.empty{padding:40px;text-align:center;border:1px dashed var(--b);border-radius:18px}@media(max-width:800px){.kpis,.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.kpis,.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="css/global-navigation.css">

</head><body><header class="site-header"><div class="site-header-inner"><a class="brand" href="index.html"><span class="brand-mark">CR</span><span class="brand-text"><span class="brand-name">CROW<span class="glow">RULES</span></span><span class="brand-section">PODCASTING</span></span></a><nav class="main-navigation"><a href="creator-monetization.html">Monetization</a><a href="product-manager.html">Products</a></nav></div></header><main class="wrap"><div class="ey">CREATOR STUDIO · MONETIZATION 27.0</div><h1>PRODUCT <span>INTELLIGENCE.</span></h1><p>See which monetization products are generating revenue, subscribers, and premium-content reach.</p><section class="kpis"><div class="kpi">PRODUCTS<strong id="products">—</strong></div><div class="kpi">PAID REVENUE<strong id="revenue">$0</strong></div><div class="kpi">TRANSACTIONS<strong id="tx">0</strong></div><div class="kpi">ACTIVE ENTITLEMENTS<strong id="ent">0</strong></div></section><div id="grid" class="grid"><div class="empty">Loading intelligence…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>(async()=>{const sb=supabase.createClient(window.CROWRULES_CONFIG.supabaseUrl,window.CROWRULES_CONFIG.supabasePublishableKey),grid=document.getElementById("grid");const {data:{user}}=await sb.auth.getUser();if(!user){location.href="login.html?redirect=product-intelligence.html";return}const {data,error}=await sb.rpc("get_my_podcast_product_intelligence");if(error){grid.innerHTML="<div class=empty>"+error.message+"</div>";return}const rows=data||[];document.getElementById("products").textContent=rows.length;document.getElementById("revenue").textContent="$"+(rows.reduce((a,x)=>a+Number(x.paid_revenue_cents||0),0)/100).toLocaleString("en-US",{minimumFractionDigits:2});document.getElementById("tx").textContent=rows.reduce((a,x)=>a+Number(x.transaction_count||0),0);document.getElementById("ent").textContent=rows.reduce((a,x)=>a+Number(x.active_entitlements||0),0);const max=Math.max(1,...rows.map(x=>Number(x.paid_revenue_cents||0)));grid.innerHTML=rows.length?rows.map(x=>'<article class=card><div class=name>'+String(x.product_name).replace(/[<>]/g,"")+'</div><div class=meta>'+x.product_type+' · '+(x.billing_interval||"one-time")+' · '+(x.active?"ACTIVE":"ARCHIVED")+'</div><div class=money>$'+(Number(x.paid_revenue_cents||0)/100).toLocaleString("en-US",{minimumFractionDigits:2})+'</div><div class=meta>'+x.transaction_count+' paid transactions · '+x.active_entitlements+' active entitlements · '+x.premium_episodes+' premium episodes</div><div class=bar><div class=fill style="width:"+Math.min(100,Number(x.paid_revenue_cents||0)/max*100)+"%"></div></div></article>').join(""):'<div class=empty>No product intelligence yet. Create a monetization product to begin collecting performance data.</div>'})();</script></body></html>
