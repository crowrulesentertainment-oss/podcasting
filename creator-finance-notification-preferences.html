<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance Notification Preferences | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>:root{--bg:#05050b;--line:rgba(255,255,255,.1);--cyan:#55e7ff;--purple:#a879ff;--muted:#9ba3bb}body{margin:0;background:radial-gradient(circle at 12% 0%,rgba(85,231,255,.12),transparent 30%),var(--bg);color:#fff;font-family:Montserrat,system-ui,sans-serif}.wrap{max-width:850px;margin:auto;padding:45px 18px 80px}.ey{font:800 10px Orbitron;letter-spacing:.18em;color:var(--cyan)}h1{font:800 clamp(34px,6vw,62px)/.95 Orbitron;margin:10px 0}h1 span{color:var(--cyan)}p{color:var(--muted);line-height:1.7}.card{margin-top:22px;padding:22px;border:1px solid var(--line);border-radius:18px;background:rgba(10,11,21,.92)}.row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.name{font-weight:800}.desc{font-size:11px;color:var(--muted);margin-top:4px}.toggle{width:48px;height:27px;border-radius:20px;border:1px solid var(--line);background:#151724;cursor:pointer;position:relative}.toggle:after{content:"";position:absolute;width:21px;height:21px;top:2px;left:3px;border-radius:50%;background:#707891;transition:.2s}.toggle.on{background:rgba(85,231,255,.18);border-color:var(--cyan)}.toggle.on:after{left:23px;background:var(--cyan)}button.save{margin-top:20px;width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--cyan),var(--purple));font-weight:900;cursor:pointer}.status{margin-top:13px;color:var(--muted);font-size:12px}</style><link rel="stylesheet" href="css/global-navigation.css">

</head><body><header class="site-header"><div class="site-header-inner"><a class="brand" href="creator-finance-command-center.html"><span class="brand-mark">CR</span><span class="brand-text"><span class="brand-name">CROW<span class="glow">RULES</span></span><span class="brand-section">PODCASTING</span></span></a><nav class="main-navigation"><a href="creator-finance-alerts.html">Activity</a><a href="creator-finance-command-center.html">Finance HQ</a></nav></div></header><main class="wrap"><div class="ey">CREATOR FINANCE · NOTIFICATIONS 27.0</div><h1>CONTROL YOUR <span>ALERTS.</span></h1><p>Choose which finance events appear in your CrowRules creator activity feed.</p><section class="card" id="settings">Loading preferences…</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>(async()=>{const db=supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabasePublishableKey),box=document.getElementById('settings');const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html?redirect=creator-finance-notification-preferences.html';return}const items=[['payments','Payments','Successful payment activity'],['payouts','Payouts','Payout lifecycle updates'],['refunds','Refunds','Refund activity'],['disputes','Disputes','Dispute activity'],['account','Account','Stripe account and onboarding events'],['milestones','Milestones','Creator revenue milestone events'],['system','System','General finance system events']];let state={};const {data,error}=await db.rpc('get_my_podcast_finance_notification_preferences');if(error){box.textContent=error.message;return}state=data?.[0]||{};function render(){box.innerHTML=items.map(([k,n,d])=>'<div class="row"><div><div class="name">'+n+'</div><div class="desc">'+d+'</div></div><button class="toggle '+(state[k]!==false?'on':'')+'" data-k="'+k+'" aria-label="Toggle '+n+'"></button></div>').join('')+'<button class="save" id="save">SAVE PREFERENCES</button><div class="status" id="status"></div>';box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;state[k]=state[k]===false; b.classList.toggle('on',state[k])});document.getElementById('save').onclick=async()=>{const {error}=await db.rpc('update_my_podcast_finance_notification_preferences',{p_payments:state.payments!==false,p_payouts:state.payouts!==false,p_refunds:state.refunds!==false,p_disputes:state.disputes!==false,p_account:state.account!==false,p_milestones:state.milestones!==false,p_system:state.system!==false});document.getElementById('status').textContent=error?error.message:'Preferences saved.'} }render()})()</script></body></html>
