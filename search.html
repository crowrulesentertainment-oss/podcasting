<style>.sd{padding:42px 0 90px}.sd h1{font:800 clamp(2.3rem,6vw,5rem)/1 Orbitron;margin:.2em 0}.sd h1 span{color:#39e7ff}.searchbar{display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:10px;margin:25px 0}.searchbar input,.searchbar select{min-height:48px;padding:0 14px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.05);color:inherit}.searchbar button{border:0;border-radius:12px;padding:0 20px;background:linear-gradient(135deg,#39e7ff,#a96cff);font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tabs button{padding:9px 13px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.04);color:inherit}.tabs button.active{border-color:#39e7ff;background:rgba(57,231,255,.1)}.results{display:grid;gap:10px}.result{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:15px;align-items:center;padding:15px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(12,13,24,.78)}.thumb{width:60px;height:60px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,rgba(57,231,255,.25),rgba(169,108,255,.25));display:grid;place-items:center;font:700 12px Orbitron}.thumb img{width:100%;height:100%;object-fit:cover}.type{font-size:.65rem;letter-spacing:.12em;color:#39e7ff;text-transform:uppercase}.result h2{font-size:1rem;margin:4px 0}.meta{font-size:.75rem;color:#9d9eac}.open{padding:9px 12px;border:1px solid rgba(57,231,255,.25);border-radius:10px;color:#39e7ff;text-decoration:none}@media(max-width:700px){.searchbar{grid-template-columns:1fr}.result{grid-template-columns:48px minmax(0,1fr)}.open{grid-column:2}.thumb{width:48px;height:48px}}</style></head><body><main class="section wrap sd"><p class="eyebrow">CROWRULES DISCOVERY 2.0</p><h1>Find your <span>next listen.</span></h1><p>Search across podcasts, episodes, and creators in one place.</p><form id="searchForm" class="searchbar"><input id="q" type="search" placeholder="Search podcasts, episodes, creators…" autocomplete="off" aria-label="Search"><select id="type"><option value="all">Everything</option><option value="podcast">Podcasts</option><option value="episode">Episodes</option><option value="creator">Creators</option></select><button type="submit">SEARCH</button></form><div class="tabs"><button class="active" data-type="all" type="button">All</button><button data-type="podcast" type="button">Podcasts</button><button data-type="episode" type="button">Episodes</button><button data-type="creator" type="button">Creators</button></div><div id="status" class="count" aria-live="polite">Loading discovery index…</div><section id="results" class="results" aria-live="polite"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>
(function(){const sb=window.supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY),$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])),n=v=>String(v??"").toLowerCase().trim(),params=new URLSearchParams(location.search),state={items:[],type:params.get("type")||"all",category:params.get("category")||""};$("#q").value=params.get("q")||"";$("#type").value=["all","podcast","episode","creator"].includes(state.type)?state.type:"all";
function make(type,x){if(type==="podcast")return{type,id:x.id,title:x.title||"Untitled Podcast",description:x.description,meta:[x.category,x.status].filter(Boolean).join(" · "),image:x.artwork_url,url:"podcast.html?slug="+encodeURIComponent(x.slug||x.id),search:[x.title,x.description,x.category,x.slug].join(" ")};if(type==="episode")return{type,id:x.id,title:x.title||"Untitled Episode",description:"Episode "+(x.episode_number||""),meta:x.published_at?new Date(x.published_at).toLocaleDateString():"",image:x.thumbnail_url,url:"episode.html?id="+encodeURIComponent(x.id),search:[x.title,x.episode_number].join(" ")};return{type,id:x.id,title:x.name||"CrowRules Creator",description:x.bio,meta:[x.role,x.discipline].filter(Boolean).join(" · "),image:x.avatar_url,url:"creators.html#creator-"+encodeURIComponent(x.slug||x.id),search:[x.name,x.role,x.discipline,x.bio,x.slug].join(" ")}}
async function load(){const[p,e,c]=await Promise.all([sb.from("podcasts").select("id,title,slug,category,description,artwork_url,status").in("status",["active","published","live"]),sb.from("podcast_episodes").select("id,title,episode_number,published_at,thumbnail_url,status").in("status",["published","public","live"]),sb.from("creators").select("id,name,slug,role,discipline,bio,avatar_url,is_active").eq("is_active",true)]);state.items=[...(p.data||[]).map(x=>make("podcast",x)),...(e.data||[]).map(x=>make("episode",x)),...(c.data||[]).map(x=>make("creator",x))];render()}
async function track(event_name,metadata={}){try{const {data:{user}}=await sb.auth.getUser();await sb.from("analytics_events").insert({user_id:user?.id||null,event_name,property:"search",page_url:location.href,content_type:"search",metadata})}catch(e){console.debug("analytics event skipped",e)}}
function render(){const q=n($("#q").value),type=$("#type").value,cat=n(state.category),rows=state.items.filter(x=>(type==="all"||x.type===type)&&(!cat||x.type!=="podcast"||n(x.meta).includes(cat))&&(!q||n(x.search).includes(q))).slice(0,100);$("#status").textContent=rows.length+" result"+(rows.length===1?"":"s")+(q?" for “"+q+"”":"");$("#results").innerHTML=rows.length?rows.map(x=>'<article class="result"><div class="thumb">'+(x.image?'<img src="'+esc(x.image)+'" alt="">':esc(x.type))+'</div><div><div class="type">'+esc(x.type)+'</div><h2>'+esc(x.title)+'</h2><div class="meta">'+esc(x.meta||x.description||"")+'</div></div><a class="open" href="'+esc(x.url)+'">Open →</a></article>').join(""):'<div class="cr-empty"><strong>No results found</strong>Try a different keyword or content type.</div>';document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.type===type))}
$("#searchForm").addEventListener("submit",e=>{e.preventDefault();const q=$("#q").value.trim();if(q)track("discovery_search",{query:q,type:$("#type").value,category:state.category||null});if(state.category)track("category_exploration",{category:state.category,source:"search"});const p=new URLSearchParams();if($("#q").value.trim())p.set("q",$("#q").value.trim());if($("#type").value!=="all")p.set("type",$("#type").value);if(state.category)p.set("category",state.category);history.replaceState(null,"","search.html"+(p.toString()?"?"+p:""));state.type=$("#type").value;render()});$("#q").addEventListener("input",render);$("#type").addEventListener("change",()=>$("#searchForm").requestSubmit());document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{$("#type").value=b.dataset.type;$("#searchForm").requestSubmit()}));load().catch(err=>{$("#status").textContent="Discovery index unavailable.";$("#results").innerHTML='<div class="cr-empty"><strong>Search is temporarily unavailable</strong>Please try again shortly.</div>';console.error(err)})})();
</script></body></html>
