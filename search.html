<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/global-navigation.css">
<link rel="stylesheet" href="css/site.css"></head><body><main class="page"><section class="hero"><span class="eyebrow">SEARCH</span><h1>SEARCH THE <span>UNIVERSE.</span></h1><p>Find published podcasts by title.</p><div class="actions"><input id="q" aria-label="Search" placeholder="Search podcasts…" style="flex:1;min-width:240px;padding:12px;border-radius:11px;border:1px solid rgba(255,255,255,.12);background:#0b0b14;color:#fff"><button class="btn primary" id="go">SEARCH</button></div></section><div id="results" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/domain-service-loader.js" defer></script>
<script src="js/domain-service-loader.js" defer></script>
<script src="js/domain-service-loader.js" defer></script>
<script src="js/global-navigation.js" defer></script>
<script>const esc=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));document.getElementById("go").onclick=async()=>{const q=document.getElementById("q").value.trim(),o=document.getElementById("results");if(!q){o.innerHTML="";return}try{const db=supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabaseAnonKey),r=await db.from("podcasts").select("id,title,description,category").eq("status","published").ilike("title","%"+q+"%").limit(24);if(r.error)throw r.error;o.innerHTML=(r.data||[]).map(p=>'<article class="card"><h2>'+esc(p.title)+'</h2><p class="muted">'+esc(p.category||"Podcast")+'</p><p>'+esc(p.description)+'</p><a class="btn primary" href="podcast.html?id='+encodeURIComponent(p.id)+'">OPEN</a></article>').join("")||'<div class="status">No results.</div>'}catch(e){o.innerHTML='<div class="status">Search is temporarily unavailable.</div>'}};</script></body></html>
