<main class="wrap hero"><div class="eyebrow">SEARCH</div><h1>Search the <span class="gradient">audio universe.</span></h1><div class="searchbar"><input id="term" placeholder="Podcast title, creator, category"><button class="btn primary" onclick="run()">Search</button></div><div id="results" class="grid"></div></main><script>async function run(){const v=document.getElementById("term").value.trim();const host=document.getElementById("results");if(!v){host.innerHTML='<div class="notice">Enter a search term.</div>';return}try{const data=window.CROW_DATA?.snapshot?.(),catalog=data?.catalog||{};const q=v.toLowerCase();const shows=(catalog.podcasts||[]).filter(p=>(p.title+" "+(p.description||"")+" "+(p.author_name||"")+" "+(p.category||"")).toLowerCase().includes(q));const eps=(catalog.episodes||[]).filter(e=>(e.title+" "+(e.description||"")+" "+(e.podcast_title||"")).toLowerCase().includes(q));const creators=(catalog.creators||[]).filter(x=>(x.display_name||x.name||"").toLowerCase().includes(q));host.innerHTML=shows.map(p=>'<a class="card" style="text-decoration:none" href="podcast.html?id='+encodeURIComponent(p.id)+'"><span class="pill">'+(p.category||"Podcast")+'</span><h3>'+esc(p.title)+'</h3><p>'+esc(p.description||"")+'</p></a>').join("")+eps.map(e=>'<a class="card" style="text-decoration:none" href="episode.html?id='+encodeURIComponent(e.id)+'"><span class="pill">Episode</span><h3>'+esc(e.title)+'</h3><p>'+esc(e.description||"")+'</p></a>').join("")+creators.map(x=>'<a class="card" style="text-decoration:none" href="creator-profile.html?id='+encodeURIComponent(x.id)+'"><span class="pill">Creator</span><h3>'+esc(x.display_name||x.name||"Creator")+'</h3><p>'+esc(x.role||x.discipline||"")+'</p></a>').join("")||'<div class="notice">No matches.</div>'}catch(e){host.innerHTML='<div class="notice">Search is temporarily unavailable.</div>'}}function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}</script>
