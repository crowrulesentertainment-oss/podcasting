<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03040a"><title>Search | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/global-navigation.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/global-navigation.js" defer></script><script src="js/app.js" defer></script><script src="js/player.js" defer></script></head><body><main class="page shell"><div class="eyebrow">Universal search</div><h1 class="title">FIND YOUR NEXT VOICE.</h1><div class="searchbar"><input id="q" placeholder="Podcasts, episodes, creators, live"><button class="btn primary" onclick="go()">SEARCH</button></div><div id="r" class="grid"></div><script>async function go(){let q=document.getElementById("q").value.toLowerCase(),p=await CR.rows("podcasts",{limit:40}),e=await CR.rows("cr_podcast_episodes",{limit:40}),c=await CR.rows("creators",{limit:40}),a=[...p.map(x=>[x,"podcast"]),...e.map(x=>[x,"episode"]),...c.map(x=>[x,"podcast"])].filter(x=>(x[0].title||x[0].name||"").toLowerCase().includes(q));r.innerHTML=a.length?a.map(x=>CR.card(x[0],x[1])).join(""):'<div class="empty">No signals found.</div>'}</script></main></body></html>
