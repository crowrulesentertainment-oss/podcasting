<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">SEARCH</div><h1>Search the <span class="gradient">audio universe.</span></h1><div class="searchbar"><input id="term" placeholder="Podcast title, creator, category"><button class="btn primary" onclick="run()">Search</button></div><div id="results" class="grid"></div></main><script>async function run(){const v=term.value.trim();if(!v){results.innerHTML='<div class="notice">Enter a search term.</div>';return}const r=await CROW_SUPABASE.from("podcasts").select("*").eq("status","published").or("title.ilike.%"+v+"%,description.ilike.%"+v+"%,author_name.ilike.%"+v+"%,category.ilike.%"+v+"%").limit(50);results.innerHTML=(r.data||[]).map(p=>'<a class="card" style="text-decoration:none" href="podcast.html?id='+p.id+'"><span class="pill">'+(p.category||"Podcast")+'</span><h3>'+p.title+'</h3><p>'+(p.description||"")+'</p></a>').join("")||'<div class="notice">No matches.</div>'}</script></body></html>
