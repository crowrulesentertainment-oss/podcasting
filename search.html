<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | CrowRules Podcasting</title><meta name="description" content="Search the CrowRules Podcasting universe for shows and creators."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="./css/crowrules-cinematic.css"><style>.search-hero{padding:75px 0 30px}.search-hero p{max-width:760px;color:#aeb6cb;line-height:1.8}.search-box-wide{display:flex;gap:10px;margin:20px 0 30px}.search-box-wide input{flex:1;min-height:56px;padding:0 18px;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);color:white;outline:0}.search-box-wide input:focus{border-color:rgba(0,229,255,.5)}.search-status{color:#9da5bd;font-size:.8rem;margin-bottom:18px}.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-bottom:75px}.result-card{padding:20px;border:1px solid rgba(255,255,255,.08);border-radius:20px;background:rgba(255,255,255,.035)}.result-card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#11112a}.result-card h2{font:900 1rem Orbitron;margin:15px 0 7px}.result-card p{color:#9da5bd;font-size:.78rem;line-height:1.5}.tag{color:#00e5ff;font-size:.68rem;font-weight:900;text-transform:uppercase}</style></head><body data-crowrules-division="podcasting"><header class="nav"><a class="brand" href="index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header><main><section class="search-hero"><div class="eyebrow">DISCOVERY ENGINE</div><h1>FIND YOUR<br><span>NEXT LISTEN.</span></h1><p>Search shows, descriptions and categories across the CrowRules Podcasting library.</p><div class="search-box-wide"><input id="q" type="search" placeholder="Try a show, creator, category or topic…" autocomplete="off"><button id="go" class="btn">SEARCH</button></div><div id="status" class="search-status">Enter a search term to begin.</div></section><section id="results" class="result-grid"></section></main><footer class="footer">CrowRules Podcasting · Listen. Create. Share.</footer><script src="assets/js/app.js"></script><script src="assets/js/crowrules-player.js"></script><script src="js/crowrules-membership.js"></script><script src="./js/crowrules-cinematic.js"></script><script>(async()=>{const sb=await loadSupabase(),input=document.getElementById("q"),results=document.getElementById("results"),status=document.getElementById("status");async function run(){const q=input.value.trim();if(!q){results.innerHTML="";status.textContent="Enter a search term to begin.";return}status.textContent="Searching the network…";const {data,error}=await sb.from("podcasts").select("id,title,slug,category,description,artwork_url,is_featured,is_live,listener_count,total_plays").or("title.ilike.%"+q+"%,description.ilike.%"+q+"%,category.ilike.%"+q+"%").order("total_plays",{ascending:false}).limit(24);if(error){status.textContent="Search is temporarily unavailable.";return}status.textContent=data.length+" show"+(data.length===1?"":"s")+" found";results.innerHTML=data.length?data.map(x=>'<a class="result-card" href="podcasts.html?podcast='+encodeURIComponent(x.slug||x.id)+'"><img src="'+(x.artwork_url||"")+'" alt="" onerror="this.style.visibility=\'hidden\'"><div class="tag">'+(x.is_live?"● LIVE · ":"")+(x.category||"PODCAST")+'</div><h2>'+esc(x.title||"Untitled")+'</h2><p>'+esc(x.description||"No description yet.")+'</p></a>').join(""):'<div class="rank-note">No shows matched that search.</div>'}document.getElementById("go").onclick=run;input.addEventListener("keydown",e=>{if(e.key==="Enter")run()});const initial=new URLSearchParams(location.search).get("q");if(initial){input.value=initial;run()}})();</script></body></html>
