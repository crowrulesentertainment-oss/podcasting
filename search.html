<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | CrowRules Podcasting</title><link rel="stylesheet" href="css/app.css"></head><body><main><section class="section shell"><span class="kicker">SEARCH</span><h1>Search the universe.</h1><input id="q" class="input" placeholder="Search podcasts…" style="max-width:700px"><div id="results" class="grid" style="margin-top:25px"></div></section><script>q.addEventListener("input",async()=>{const v=q.value.trim();if(!v)return;const r=await window.CrowRules.supabase.from("podcasts").select("id,title,category,description").or("title.ilike.%"+v+"%,description.ilike.%"+v+"%").limit(24);results.innerHTML=r.data?.length?r.data.map(p=>'<article class="card"><span class="pill">'+(p.category||"Podcast")+'</span><h3>'+p.title+'</h3><p>'+((p.description||""))+'</p><a class="btn" href="podcast.html?id='+p.id+'">Open Show</a></article>').join(""):'<div class="empty">No matches.</div>'})</script></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js" defer></script></body></html>
