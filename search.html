<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/global-navigation.css"><link rel="stylesheet" href="css/site.css"></head><body><main class="page"><section class="hero"><span class="eyebrow">SEARCH</span><h1>SEARCH THE <span>UNIVERSE.</span></h1><p>Use the catalog search to find podcasts and creators.</p><div class="actions"><input id="q" aria-label="Search" placeholder="Search podcasts…" style="flex:1;min-width:240px;padding:12px;border-radius:11px;border:1px solid rgba(255,255,255,.12);background:#0b0b14;color:#fff"><button class="btn primary" id="go">SEARCH</button></div></section><div id="results" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/global-navigation.js" defer></script><script>document.getElementById("go").onclick=async()=>{const q=document.getElementById("q").value.trim();const out=document.getElementById("results");if(!q){out.innerHTML="";return}const db=window.supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabaseAnonKey);const r=await db.from("podcasts").select("id,title,slug,description,category,artwork_url").eq("status","published").ilike("title","%"+q+"%").limit(24);out.innerHTML=(r.data||[]).map(p=>'<article class="card"><h2>'+esc(p.title)+'</h2><p>'+esc(p.description||"")+'</p><a class="btn primary" href="podcast.html?id='+encodeURIComponent(p.id)+'">OPEN PODCAST</a></article>').join("")||'<div class="status">No podcasts found.</div>'};function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}</script></body></html>
