<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03050a"><title>Subscriptions — CrowRules Podcasting</title><link rel="stylesheet" href="css/crow-podcasting-rebuild.css?v=20261004-16"><style>.sub-page{max-width:1200px;margin:auto}.hero h1{font:900 clamp(2rem,5vw,4rem) Orbitron;margin:8px 0}.hero h1 span{background:linear-gradient(90deg,#65f2ff,#a778ff);-webkit-background-clip:text;color:transparent}.muted{color:var(--cr-muted);line-height:1.6}.panel{padding:22px;border:1px solid var(--cr-line);border-radius:18px;background:#0a1019ee;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:18px;border:1px solid #ffffff10;border-radius:15px;background:#ffffff03}.card h2{font:800 1rem Orbitron}.price{font:900 1.8rem Orbitron;margin:12px 0}.meta{font-size:.58rem;color:#65f2ff}.btn{border:1px solid #ffffff18;border-radius:10px;padding:10px 13px;background:#ffffff06;color:#fff;cursor:pointer;font:800 8px Orbitron}.btn.primary{border-color:#65f2ff44;background:#65f2ff0b}.notice{padding:12px;border:1px solid #65f2ff22;border-radius:10px;color:#aeb8c8;font-size:.68rem;margin-bottom:14px}.notice.error{border-color:#ff526844;color:#ff9bac}@media(max-width:800px){.cards{grid-template-columns:1fr}}</style><link rel="stylesheet" href="css/podcasting-v10.css?v=20261004-10">

</head><body><script src="js/crowrules-db-bootstrap-v2.js?v=20261004-v14"></script>

<main class="cr-main sub-page"><section class="hero"><div class="cr-kicker">CROWRULES PODCASTING / BILLING</div><h1>Creator <span>Subscriptions.</span></h1><p class="muted">Subscribe to creator membership plans using Stripe Checkout. Billing status is synchronized back to CrowRules through Stripe webhooks.</p></section><div id="status" class="notice">Loading subscription catalog…</div><section class="panel"><div class="cards" id="plans"><div class="card">Loading…</div></div></section></main>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id),cfg=window.CROW_CONFIG||{};let sb,user;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const msg=(x,b=false)=>{$("status").textContent=x;$("status").classList.toggle("error",b)};
async function boot(){try{for(let i=0;i<80&&!window.CROW_SUPABASE;i++)await new Promise(r=>setTimeout(r,100));sb=window.CROW_SUPABASE;if(!sb)throw Error("Supabase connection unavailable.");user=window.__CROW_USER||window.CROW_DATA?.snapshot?.().account?.user;if(!user)throw Error("Sign in to subscribe to creators.");await load();msg("SUPABASE ONLINE · STRIPE CHECKOUT READY")}catch(e){msg(e.message,true)}}
async function load(){const r=await sb.from("cr_podcast_monetization_products").select("id,creator_id,podcast_id,name,description,amount_cents,interval,currency,active").eq("product_type","membership").eq("active",true).order("created_at",{ascending:false});if(r.error)throw r.error;const rows=r.data||[];$("plans").innerHTML=rows.length?rows.map(p=>'<article class="card"><div class="meta">CREATOR MEMBERSHIP · '+esc(p.interval)+'</div><h2>'+esc(p.name)+'</h2><p class="muted">'+esc(p.description||"Support this creator on CrowRules Podcasting.")+'</p><div class="price">$'+(Number(p.amount_cents||0)/100).toFixed(2)+' <small>/ '+esc(p.interval)+'</small></div><button class="btn primary" data-id="'+p.id+'">SUBSCRIBE WITH STRIPE</button></article>').join(""):'<div class="card">No creator plans are published yet.</div>'}
$("plans").addEventListener("click",async e=>{const b=e.target.closest("[data-id]");if(!b)return;b.disabled=true;msg("Opening secure Stripe Checkout…");try{const s=await sb.auth.getSession(),token=s.data.session?.access_token;if(!token)throw Error("Session expired. Sign in again.");const base=cfg.supabaseUrl||"https://cevylpnoexugwgygvtgu.supabase.co";const res=await fetch(base+"/functions/v1/"+(cfg.podcastCheckoutFunction||"create-podcast-checkout"),{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({product_id:b.dataset.id,origin:cfg.siteUrl||location.origin+"/"})});const d=await res.json();if(!res.ok||d.error)throw Error(d.error||"Checkout could not be created.");location.href=d.url}catch(x){msg(x.message,true);b.disabled=false}});
boot();
})();
</script></body></html>
