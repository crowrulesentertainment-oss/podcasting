<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03040a"><title>Creator Studio | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/global-navigation.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/global-navigation.js" defer></script><script src="js/app.js" defer></script><script src="js/player.js" defer></script></head><body><main class="page shell"><div class="eyebrow">Creator Studio</div><h1 class="title">COMMAND YOUR UNIVERSE.</h1><div class="stats"><div class="stat"><b id="plays">0</b><span>Total Plays</span></div><div class="stat"><b id="shows">0</b><span>Shows</span></div><div class="stat"><b id="eps">0</b><span>Episodes</span></div><div class="stat"><b>—</b><span>Revenue</span></div></div><div class="actions"><a class="btn primary" href="create-podcast.html">Create Podcast</a><a class="btn" href="create-episode.html">Create Episode</a><a class="btn" href="analytics.html">Analytics</a><a class="btn" href="monetization.html">Monetization</a></div><script>addEventListener("DOMContentLoaded",async()=>{let p=await CR.rows("podcasts",{limit:200}),e=await CR.rows("cr_podcast_episodes",{limit:500});plays.textContent=p.reduce((a,x)=>a+Number(x.total_plays||0),0).toLocaleString();shows.textContent=p.length;eps.textContent=e.length})</script></main></body></html>
