<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Episode — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">CREATOR STUDIO</div><h1>Publish an <span class="gradient">episode.</span></h1><section class="card"><form id="form" class="form"><label>Podcast ID<input id="podcast_id" required></label><label>Title<input id="title" required></label><label>Slug<input id="slug" required></label><label>Audio URL<input id="audio_url" type="url" required></label><label>Description<textarea id="description"></textarea></label><label>Episode number<input id="number" type="number"></label><button class="btn primary">Save episode</button></form><div id="status" class="notice" style="margin-top:15px">Audio can be hosted in Supabase Storage or an authorized audio CDN.</div></section></main><script>var q=new URLSearchParams(location.search).get("podcast");if(q)podcast_id.value=q;addEventListener("crow:ready",function(){form.onsubmit=async function(e){e.preventDefault();var u=await CROW_SUPABASE.auth.getUser();if(!u.data.user){location.href="account.html";return}var own=await CROW_SUPABASE.from("podcasts").select("id").eq("id",podcast_id.value).eq("creator_id",u.data.user.id).single();if(own.error){status.textContent=own.error.message;return}var r=await CROW_SUPABASE.from("episodes").insert({podcast_id:podcast_id.value,title:title.value,slug:slug.value,audio_url:audio_url.value,description:description.value,episode_number:Number(number.value)||null}).select().single();status.textContent=r.error?r.error.message:"Episode saved."}});</script></body></html>
