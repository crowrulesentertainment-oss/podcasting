<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Episode — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">CREATOR STUDIO · AUDIO UPLOAD</div><h1>Create an <span class="gradient">episode.</span></h1><section class="card"><form id="form" class="form"><label>Podcast<select id="podcast_id" required></select></label><label>Title<input id="title" required></label><label>Slug<input id="slug" required></label><label>Description<textarea id="description"></textarea></label><label>Episode number<input id="episode_number" type="number"></label><label>Season number<input id="season_number" type="number"></label><label>Audio file<input id="audio" type="file" accept="audio/*" required></label><div id="uploadBox" class="notice">Large files use resumable Supabase Storage upload. Maximum configured bucket size: 500 MB.</div><div class="progress"><i id="uploadBar"></i></div><button id="submit" class="btn primary">Upload & Save Draft</button></form><div id="status" class="notice" style="margin-top:15px">Ready.</div></section></main><script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.3.1/dist/tus.min.js"></script><script>addEventListener("crow:ready",async()=>{if(!__CROW_USER){status.textContent="Sign in first.";return}const qs=new URLSearchParams(location.search);const p=await CROW_SUPABASE.from("podcasts").select("id,title").eq("creator_id",__CROW_USER.id).order("created_at",{ascending:false});podcast_id.innerHTML=(p.data||[]).map(x=>'<option value="'+x.id+'">'+x.title+'</option>').join("");if(qs.get("podcast"))podcast_id.value=qs.get("podcast");form.onsubmit=async e=>{e.preventDefault();const f=audio.files[0];if(!f)return;if(f.size>524288000){status.textContent="File exceeds the 500 MB bucket limit.";return}submit.disabled=true;status.textContent="Creating episode draft…";const r=await CROW_SUPABASE.from("podcast_episodes").insert({podcast_id:podcast_id.value,title:title.value,slug:slug.value,description:description.value,episode_number:Number(episode_number.value)||null,season_number:Number(season_number.value)||null,status:"draft"}).select().single();if(r.error){status.textContent=r.error.message;submit.disabled=false;return}const path=__CROW_USER.id+"/"+r.data.id+"/"+f.name.replace(/[^A-Za-z0-9._-]/g,"_");const {data:{session}}=await CROW_SUPABASE.auth.getSession();if(!session){status.textContent="Session expired. Sign in again.";submit.disabled=false;return}status.textContent="Uploading 0%";const upload=new tus.Upload(f,{endpoint:CROW_CONFIG.supabaseUrl+"/storage/v1/upload/resumable",retryDelays:[0,1000,3000,5000,10000],headers:{authorization:"Bearer "+session.access_token,"x-upsert":"false"},metadata:{bucketName:"podcast-audio",objectName:path,contentType:f.type||"audio/mpeg",cacheControl:"3600"},onError:err=>{status.textContent="Upload failed: "+err.message;submit.disabled=false},onProgress:(bytes,total)=>{const pct=Math.round(bytes/total*100);uploadBar.style.width=pct+"%";status.textContent="Uploading "+pct+"%";},onSuccess:async()=>{const url=CROW_SUPABASE.storage.from("podcast-audio").getPublicUrl(path).data.publicUrl;const u=await CROW_SUPABASE.from("podcast_episodes").update({audio_url:url}).eq("id",r.data.id);if(u.error){status.textContent=u.error.message;submit.disabled=false;return}await CROW_SUPABASE.from("podcast_episode_uploads").insert({episode_id:r.data.id,uploaded_by:__CROW_USER.id,storage_bucket:"podcast-audio",storage_path:path,original_filename:f.name,mime_type:f.type,file_size_bytes:f.size,status:"uploaded"});status.textContent="Upload complete. Episode saved as draft.";uploadBar.style.width="100%";submit.disabled=false}});upload.start()}});</script></body></html>
