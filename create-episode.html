<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03040a"><title>Create an Episode | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/global-navigation.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/global-navigation.js" defer></script><script src="js/app.js" defer></script><script src="js/player.js" defer></script></head><body><main class="page shell"><div class="eyebrow">Creator Studio · Episode Engine</div><h1 class="title">CREATE AN EPISODE.</h1><p class="lede">UPLOAD → PROCESS → DETAILS → ARTWORK → CHAPTERS → TRANSCRIPT → MONETIZATION → PREVIEW → SCHEDULE → PUBLISH.</p><form class="form" id="f"><div class="field"><label>Podcast ID</label><input name="podcast_id" required></div><div class="split"><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Audio URL</label><input name="audio_url" type="url"></div></div><div class="field"><label>Description</label><textarea name="description" rows="6"></textarea></div><div class="split"><div class="field"><label>Season</label><input name="season_number" type="number" value="1"></div><div class="field"><label>Episode</label><input name="episode_number" type="number" value="1"></div></div><div class="actions"><button class="btn primary">SAVE DRAFT</button></div></form><div id="msg" class="section"></div><script>f.onsubmit=async ev=>{ev.preventDefault();if(!CR.C.user)return location.href="../membership/login.html";let x=Object.fromEntries(new FormData(f));x.season_number=+x.season_number;x.episode_number=+x.episode_number;x.is_published=false;x.is_featured=false;x.is_explicit=false;let r=await CR.C.db.from("cr_podcast_episodes").insert(x);msg.innerHTML=r.error?'<div class="notice">'+CR.esc(r.error.message)+'</div>':'<div class="notice">Episode draft saved.</div>'}</script></main></body></html>
