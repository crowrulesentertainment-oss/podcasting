<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Episode — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">CREATOR STUDIO</div><h1>Publish an <span class="gradient">episode.</span></h1><section class="card"><form id="form" class="form"><label>Podcast<select id="podcast_id" required></select></label><label>Title<input id="title" required></label><label>Slug<input id="slug" required></label><label>Description<textarea id="description"></textarea></label><label>Episode number<input id="episode_number" type="number"></label><label>Audio file<input id="audio" type="file" accept="audio/*" required></label><button class="btn primary">Upload & Save Draft</button></form><div id="status" class="notice" style="margin-top:15px">Using the existing podcast-audio Supabase Storage bucket.</div></section></main><script>addEventListener("crow:ready",async()=>{if(!__CROW_USER){status.textContent="Sign in first.";return}const p=await CROW_SUPABASE.from("podcasts").select("id,title").eq("creator_id",__CROW_USER.id).order("created_at",{ascending:false});podcast_id.innerHTML=(p.data||[]).map(x=>'<option value="'+x.id+'">'+x.title+'</option>').join("");form.onsubmit=async e=>{e.preventDefault();const f=audio.files[0];if(!f)return;if(f.size>524288000){status.textContent="File exceeds the 500 MB bucket limit.";return}status.textContent="Creating episode…";const r=await CROW_SUPABASE.from("podcast_episodes").insert({podcast_id:podcast_id.value,title:title.value,slug:slug.value,description:description.value,episode_number:Number(episode_number.value)||null,status:"draft"}).select().single();if(r.error){status.textContent=r.error.message;return}const path=__CROW_USER.id+"/"+r.data.id+"/"+f.name.replace(/[^A-Za-z0-9._-]/g,"_");const up=await CROW_SUPABASE.storage.from("podcast-audio").upload(path,f,{contentType:f.type||"audio/mpeg",upsert:false});if(up.error){status.textContent=up.error.message;await CROW_SUPABASE.from("podcast_episodes").delete().eq("id",r.data.id);return}const url=CROW_SUPABASE.storage.from("podcast-audio").getPublicUrl(path).data.publicUrl;const u=await CROW_SUPABASE.from("podcast_episodes").update({audio_url:url}).eq("id",r.data.id);if(u.error){status.textContent=u.error.message;return}await CROW_SUPABASE.from("podcast_episode_uploads").insert({episode_id:r.data.id,uploaded_by:__CROW_USER.id,storage_bucket:"podcast-audio",storage_path:path,original_filename:f.name,mime_type:f.type,file_size_bytes:f.size,status:"uploaded"});status.textContent="Audio uploaded and episode saved as draft.";}});</script></body></html>
