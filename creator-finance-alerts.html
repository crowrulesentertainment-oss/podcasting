<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance Alerts | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>:root{--bg:#05050b;--line:rgba(255,255,255,.1);--cyan:#55e7ff;--purple:#a879ff;--muted:#9ba3bb}body{margin:0;background:radial-gradient(circle at 12% 0%,rgba(85,231,255,.12),transparent 30%),var(--bg);color:#fff;font-family:Montserrat,system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:45px 18px 80px}.ey{font:800 10px Orbitron;letter-spacing:.18em;color:var(--cyan)}h1{font:800 clamp(38px,6vw,65px)/.95 Orbitron;margin:10px 0}h1 span{color:var(--cyan)}.sub,.muted{color:var(--muted);line-height:1.7}.toolbar{display:flex;gap:10px;margin:22px 0}.btn{padding:10px 15px;border-radius:10px;border:1px solid var(--line);background:#0b0c16;color:#fff;cursor:pointer}.feed{display:grid;gap:12px}.alert{padding:18px;border:1px solid var(--line);border-radius:16px;background:rgba(10,11,21,.92);position:relative}.alert.unread{border-color:rgba(85,231,255,.45)}.type{font:800 9px Orbitron;color:var(--cyan);letter-spacing:.12em}.title{font-weight:800;margin-top:7px}.message{font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}.time{font-size:9px;color:#707891;margin-top:10px}.empty,.notice{padding:18px;border-left:3px solid var(--cyan);color:var(--muted);font-size:12px}</style></head><body><header class="site-header"><div class="site-header-inner"><a class="brand" href="creator-finance-command-center.html"><span class="brand-mark">CR</span><span class="brand-text"><span class="brand-name">CROW<span class="glow">RULES</span></span><span class="brand-section">PODCASTING</span></span></a><nav class="main-navigation"><a href="creator-finance-command-center.html">Finance HQ</a><a href="creator-revenue-intelligence.html">Intelligence</a><a href="payout-center.html">Payouts</a></nav></div></header><main class="wrap"><div class="ey">CREATOR FINANCE · ALERTS 25.0</div><h1>FINANCE <span>ACTIVITY.</span></h1><p class="sub">A dedicated feed for creator finance events and future milestone notifications.</p><div class="toolbar"><button class="btn" id="read">Mark visible as read</button><button class="btn" onclick="location.reload()">Refresh</button></div><div id="feed"><div class="notice">Loading finance activity…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>(async()=>{const db=supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabasePublishableKey),feed=document.getElementById('feed');const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html?redirect=creator-finance-alerts.html';return}let alerts=[];async function load(){const {data,error}=await db.rpc('get_my_podcast_finance_alerts',{p_limit:100});if(error){feed.innerHTML='<div class="notice">'+error.message+'</div>';return}alerts=data||[];feed.innerHTML=alerts.length?'<div class="feed">'+alerts.map(a=>'<article class="alert '+(!a.is_read?'unread':'')+'"><div class="type">'+String(a.alert_type).toUpperCase()+(a.is_read?'':' · NEW')+'</div><div class="title">'+String(a.title).replace(/[<>]/g,'')+'</div><div class="message">'+String(a.message).replace(/[<>]/g,'')+'</div><div class="time">'+new Date(a.created_at).toLocaleString()+'</div></article>').join('')+'</div>':'<div class="empty">No finance alerts yet. This feed is ready for payout, refund, dispute, account and milestone events as the finance automation layer grows.</div>'}document.getElementById('read').onclick=async()=>{const unread=alerts.filter(a=>!a.is_read);if(!unread.length)return;const ids=unread.map(a=>a.id);const {error}=await db.from('cr_podcast_finance_alerts').update({is_read:true}).in('id',ids);if(!error)load()};load()})()</script></body></html>
