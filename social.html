<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community - CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting-platform.css?v=3"><script src="js/podcasting-config.js"></script><script src="js/podcasting-platform.js" defer></script><script src="js/podcasting-player.js" defer></script></head><body><main class="cr-shell"><section class="hero"><div><div class="eyebrow">CrowRules Podcasting V5</div><h1>THE COMMUNITY<br>IS LISTENING.</h1><p>Listener profiles, activity, playlists, achievements, CrowPoints and social notifications.</p><a class="btn primary" href="listener-dashboard.html">My Dashboard</a></div></section><section class="section"><div class="card panel"><h2>My Listener Profile</h2><div id="profile"></div></div></section><section class="section"><div class="section-head"><h2>Community Activity</h2><button class="btn" id="refresh">Refresh</button></div><div id="feed" class="grid"></div></section><section class="section"><div class="card panel"><h2>My Playlists</h2><input id="name" placeholder="Playlist name"><input id="desc" placeholder="Description"><button class="btn primary" id="create">Create Playlist</button><div id="playlists" class="grid"></div></div></section><section class="section"><div class="section-head"><h2>Achievements and CrowPoints</h2></div><div id="achievements" class="grid"></div></section><section class="section"><div class="section-head"><h2>Social Notifications</h2></div><div id="notes" class="grid"></div></section></main><script>document.addEventListener('crow:ready',async()=>{const $=x=>document.getElementById(x),E=CrowPodcasting.esc;if(!CrowPodcasting.user){$('profile').innerHTML='<div class="notice">Sign in with your CrowRules account to activate V5.</div>';return}async function load(){const[p,f,l,a,n,pts]=await Promise.all([CrowPodcasting.getSocialProfile(),CrowPodcasting.getSocialFeed(),CrowPodcasting.getMyPlaylists(),CrowPodcasting.getAchievements(),CrowPodcasting.getSocialNotifications(),CrowPodcasting.getPoints()]);$('profile').innerHTML='<input id="display" value="'+E(p?.display_name||'')+'" placeholder="Display name"><input id="handle" value="'+E(p?.handle||'')+'" placeholder="Handle"><input id="bio" value="'+E(p?.bio||'')+'" placeholder="Bio"><button class="btn primary" id="save">Save Profile</button><span class="badge">★ '+pts+' CrowPoints</span>';$('save').onclick=async()=>{await CrowPodcasting.saveSocialProfile({display_name:$('display').value,handle:$('handle').value,bio:$('bio').value});$('save').textContent='Saved ✓'};$('feed').innerHTML=f.length?f.map(x=>'<article class="card panel"><span class="badge">'+E(x.activity_type)+'</span><p>Listener activity</p><small>'+new Date(x.created_at).toLocaleString()+'</small></article>').join(''):'<div class="notice">No activity yet.</div>';$('playlists').innerHTML=l.map(x=>'<article class="card panel"><h3>♫ '+E(x.name)+'</h3><p>'+E(x.description||'')+'</p></article>').join('')||'<div class="notice">No playlists yet.</div>';$('achievements').innerHTML=a.map(x=>'<article class="card panel"><h3>Achievement unlocked</h3><p>'+new Date(x.earned_at).toLocaleDateString()+'</p></article>').join('')||'<div class="notice">Keep listening to unlock achievements.</div>';$('notes').innerHTML=n.map(x=>'<article class="card panel"><h3>'+E(x.title)+'</h3><p>'+E(x.body||'')+'</p></article>').join('')||'<div class="notice">No social notifications.</div>'}await load();$('refresh').onclick=load;$('create').onclick=async()=>{await CrowPodcasting.createPlaylist($('name').value,$('desc').value,true);await load()}})</script></body></html>
