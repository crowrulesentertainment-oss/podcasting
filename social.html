<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community • CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting-platform.css?v=6"><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=5" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script><script src="js/podcasting-config.js"></script><script src="js/podcasting-platform.js" defer></script><script src="js/podcasting-player.js" defer></script></head><body><main class="cr-shell"><section class="hero"><div><div class="eyebrow">CrowRules Podcasting • V5.2</div><h1>COMMUNITY<br>IN MOTION.</h1><p>Real listeners. Real activity. Real-time social connections.</p><a class="btn primary" href="listener-dashboard.html">My Dashboard</a></div></section><section class="section"><div class="card panel"><h2>My Listener Profile</h2><div id="profile"></div></div></section><section class="section"><div class="section-head"><h2>Live Community Feed</h2><button class="btn" id="refresh">Refresh</button></div><div id="feed" class="grid"></div></section><section class="section"><div class="section-head"><h2>Discover Listeners</h2><input id="peopleSearch" placeholder="Search handles or names"></div><div id="people" class="grid"></div></section><section class="section"><div class="card panel"><h2>My Playlists</h2><input id="name" placeholder="Playlist name"><input id="desc" placeholder="Description"><button class="btn primary" id="create">Create Playlist</button><div id="playlists" class="grid"></div></div></section><section class="section"><div class="section-head"><h2>Achievements & CrowPoints</h2></div><div id="achievements" class="grid"></div></section><section class="section"><div class="section-head"><h2>Social Notifications</h2></div><div id="notes" class="grid"></div></section></main><script>document.addEventListener('crow:ready',async()=>{const $=x=>document.getElementById(x),E=CrowPodcasting.esc;if(!CrowPodcasting.user){$('profile').innerHTML='<div class="notice">Sign in with your CrowRules account to activate the Community.</div>';return}async function load(){const[p,f,l,a,n,pts]=await Promise.all([CrowPodcasting.getSocialProfile(),CrowPodcasting.getSocialFeed(),CrowPodcasting.getMyPlaylists(),CrowPodcasting.getAchievements(),CrowPodcasting.getSocialNotifications(),CrowPodcasting.getPoints()]);$('profile').innerHTML='<div class="form-grid"><input id="display" value="'+E(p?.display_name||'')+'" placeholder="Display name"><input id="handle" value="'+E(p?.handle||'')+'" placeholder="Handle"><input id="bio" value="'+E(p?.bio||'')+'" placeholder="Bio"></div><button class="btn primary" id="save">Save Profile</button> <a class="btn" href="listener-profile.html?user='+encodeURIComponent(p?.handle||CrowPodcasting.user.id)+'">View Public Profile</a><span class="badge">★ '+pts+' CrowPoints</span>';$('save').onclick=async()=>{await CrowPodcasting.saveSocialProfile({display_name:$('display').value,handle:$('handle').value,bio:$('bio').value});await load()};$('feed').innerHTML=f.map(x=>'<article class="card panel"><span class="badge">'+E(x.activity_type)+'</span><p>Listener activity</p><small>'+new Date(x.created_at).toLocaleString()+'</small></article>').join('')||'<div class="notice">Follow listeners to build your feed.</div>';$('playlists').innerHTML=l.map(x=>'<article class="card panel"><h3>♫ '+E(x.name)+'</h3><p>'+E(x.description||'')+'</p><a class="btn" href="playlist.html?id='+E(x.id)+'">Open</a></article>').join('')||'<div class="notice">No playlists yet.</div>';$('achievements').innerHTML=a.map(x=>'<article class="card panel"><h3>★ Achievement unlocked</h3><p>'+E(x.achievement_id)+'</p><small>'+new Date(x.earned_at).toLocaleDateString()+'</small></article>').join('')||'<div class="notice">Keep listening, commenting and connecting.</div>';$('notes').innerHTML=n.map(x=>'<article class="card panel '+(x.is_read?'':'notice')+'"><h3>'+E(x.title)+'</h3><p>'+E(x.body||'')+'</p><small>'+new Date(x.created_at).toLocaleString()+'</small></article>').join('')||'<div class="notice">No social notifications.</div>'}await load();$('refresh').onclick=load;$('create').onclick=async()=>{const n=$('name').value.trim();if(!n)return;await CrowPodcasting.createPlaylist(n,$('desc').value,true);$('name').value='';$('desc').value='';await load()};let people=[];async function discover(){people=await CrowPodcasting.rows('cr_podcast_profiles_v5','user_id,handle,display_name,bio,avatar_url',{eq:{is_public:true},limit:100});renderPeople()}function renderPeople(){const q=$('peopleSearch').value.toLowerCase();$('people').innerHTML=people.filter(p=>(p.handle||'').toLowerCase().includes(q)||(p.display_name||'').toLowerCase().includes(q)).filter(p=>p.user_id!==CrowPodcasting.user.id).map(p=>'<article class="card panel"><h3>'+E(p.display_name||'Listener')+'</h3><p class="muted">@'+E(p.handle||'listener')+'</p><p>'+E(p.bio||'')+'</p><a class="btn" href="listener-profile.html?user='+encodeURIComponent(p.handle||p.user_id)+'">View Profile</a></article>').join('')||'<div class="notice">No listeners found.</div>'}$('peopleSearch').oninput=renderPeople;await discover();await CrowPodcasting.subscribeSocialRealtime({comments:()=>load(),notifications:()=>load(),activity:()=>load()})})</script></body></html>
