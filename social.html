<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community • CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting-platform.css?v=6"><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=5" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script><script src="js/podcasting-config.js"></script><script src="js/podcasting-platform.js" defer></script><script src="js/podcasting-player.js" defer></script></head><body><main class="cr-shell"><section class="hero"><div><div class="eyebrow">CrowRules Podcasting • V5.4</div><h1>COMMUNITY<br>IN MOTION.</h1><p>Creators, listeners, shows and episodes — connected in real time.</p><a class="btn primary" href="listener-dashboard.html">My Dashboard</a></div></section><section class="section"><div class="card panel"><h2>My Listener Profile</h2><div id="profile"></div></div></section><section class="section"><div class="section-head"><h2>Live Community Feed</h2><button class="btn" id="refresh">Refresh</button></div><div id="feed" class="grid"></div></section><section class="section"><div class="section-head"><h2>My Social Graph</h2><a class="btn" href="social-graph.html">Followers & Following</a></div><div id="graph" class="grid"></div></section><section class="section"><div class="section-head"><h2>Discover Listeners</h2><input id="peopleSearch" placeholder="Search handles or names"></div><div id="people" class="grid"></div></section><section class="section"><div class="card panel"><h2>My Playlists</h2><input id="name" placeholder="Playlist name"><input id="desc" placeholder="Description"><button class="btn primary" id="create">Create Playlist</button><div id="playlists" class="grid"></div></div></section><section class="section"><div class="section-head"><h2>Achievements & CrowPoints</h2></div><div id="achievements" class="grid"></div></section><section class="section"><div class="section-head"><h2>Social Notifications <span id="unread" class="badge"></span></h2></div><div id="notes" class="grid"></div></section></main><script>document.addEventListener('crow:ready',async()=>{const $=x=>document.getElementById(x),E=CrowPodcasting.esc;if(!CrowPodcasting.user){$('profile').innerHTML='<div class="notice">Sign in with your CrowRules account to activate the Community.</div>';return}async function load(){const[p,f,l,a,n,pts]=await Promise.all([CrowPodcasting.getSocialProfile(),CrowPodcasting.getSocialFeed(),CrowPodcasting.getMyPlaylists(),CrowPodcasting.getAchievements(),CrowPodcasting.getSocialNotifications(),CrowPodcasting.getPoints()]);$('profile').innerHTML='<div class="form-grid"><input id="display" value="'+E(p?.display_name||'')+'" placeholder="Display name"><input id="handle" value="'+E(p?.handle||'')+'" placeholder="Handle"><input id="bio" value="'+E(p?.bio||'')+'" placeholder="Bio"></div><button class="btn primary" id="save">Save Profile</button> <a class="btn" href="listener-profile.html?user='+encodeURIComponent(p?.handle||CrowPodcasting.user.id)+'">View Public Profile</a><span class="badge">★ '+pts+' CrowPoints</span>';$('save').onclick=async()=>{await CrowPodcasting.saveSocialProfile({display_name:$('display').value,handle:$('handle').value,bio:$('bio').value});await load()};const ids=[...new Set(f.flatMap(x=>[x.user_id,x.podcast_id,x.episode_id]).filter(Boolean))];const eps=f.some(x=>x.episode_id)?await CrowPodcasting.rows('podcast_episodes','id,title,podcast_id,thumbnail_url,audio_url',{limit:500}):[];const pods=f.some(x=>x.podcast_id||x.episode_id)?await CrowPodcasting.rows('podcasts','id,title,slug,artwork_url,author_name',{limit:500}):[];const profiles=await CrowPodcasting.rows('cr_podcast_profiles_v5','user_id,handle,display_name,avatar_url',{limit:1000});const prof=id=>profiles.find(p=>p.user_id===id);const ep=id=>eps.find(e=>e.id===id);const pod=id=>pods.find(p=>p.id===id);$('feed').innerHTML=f.map(x=>{const a=prof(x.user_id),e=ep(x.episode_id),p=pod(x.podcast_id||e?.podcast_id),img=e?.thumbnail_url||p?.artwork_url||'';const label=x.activity_type==='comment'?'commented on':x.activity_type==='follow'?'followed a listener':x.activity_type==='reaction'?'reacted to':x.activity_type==='playlist'?'updated a playlist':'shared an activity';return '<article class="card panel feed-card">'+(img?'<img src="'+E(img)+'" alt="" loading="lazy" style="width:100%;max-height:180px;object-fit:cover;border-radius:12px">':'')+'<span class="badge">'+E(x.activity_type)+'</span><h3><a href="listener-profile.html?user='+encodeURIComponent(a?.handle||a?.user_id||x.user_id)+'">'+E(a?.display_name||'Listener')+'</a> '+label+'</h3>'+(p?'<p><strong>'+E(p.title||'Podcast')+'</strong>'+(e?' — '+E(e.title):'')+'</p>':'')+'<small>'+new Date(x.created_at).toLocaleString()+'</small></article>'}).join('')||'<div class="notice">Follow listeners or creators to build your personalized feed.</div>';$('playlists').innerHTML=l.map(x=>'<article class="card panel"><h3>♫ '+E(x.name)+'</h3><p>'+E(x.description||'')+'</p><a class="btn" href="playlist.html?id='+E(x.id)+'">Open</a></article>').join('')||'<div class="notice">No playlists yet.</div>';$('achievements').innerHTML=a.map(x=>'<article class="card panel"><h3>★ Achievement unlocked</h3><p>'+E(x.achievement_id)+'</p><small>'+new Date(x.earned_at).toLocaleDateString()+'</small></article>').join('')||'<div class="notice">Keep listening, commenting and connecting.</div>';$('unread').textContent=n.filter(x=>!x.is_read).length+' unread';$('notes').innerHTML=n.map(x=>'<article class="card panel '+(x.is_read?'':'notice')+'"><h3>'+E(x.title)+'</h3><p>'+E(x.body||'')+'</p><small>'+new Date(x.created_at).toLocaleString()+'</small></article>').join('')||'<div class="notice">No social notifications.</div>'}await load();$('refresh').onclick=load;$('create').onclick=async()=>{const n=$('name').value.trim();if(!n)return;await CrowPodcasting.createPlaylist(n,$('desc').value,true);$('name').value='';$('desc').value='';await load()};let people=[];async function discover(){people=await CrowPodcasting.rows('cr_podcast_profiles_v5','user_id,handle,display_name,bio,avatar_url',{eq:{is_public:true},limit:100});renderPeople()}function renderPeople(){const q=$('peopleSearch').value.toLowerCase();$('people').innerHTML=people.filter(p=>(p.handle||'').toLowerCase().includes(q)||(p.display_name||'').toLowerCase().includes(q)).filter(p=>p.user_id!==CrowPodcasting.user.id).map(p=>'<article class="card panel"><h3>'+E(p.display_name||'Listener')+'</h3><p class="muted">@'+E(p.handle||'listener')+'</p><p>'+E(p.bio||'')+'</p><a class="btn" href="listener-profile.html?user='+encodeURIComponent(p.handle||p.user_id)+'">View Profile</a></article>').join('')||'<div class="notice">No listeners found.</div>'}$('peopleSearch').oninput=renderPeople;await discover();async function graph(){const following=await CrowPodcasting.rows('cr_podcast_user_follows_v5','followed_id',{eq:{follower_id:CrowPodcasting.user.id},limit:500});const followers=await CrowPodcasting.rows('cr_podcast_user_follows_v5','follower_id',{eq:{followed_id:CrowPodcasting.user.id},limit:500});const ids=[...new Set([...following.map(x=>x.followed_id),...followers.map(x=>x.follower_id)])];let prof=[];if(ids.length)prof=await CrowPodcasting.rows('cr_podcast_profiles_v5','user_id,handle,display_name,bio',{limit:1000});const map=id=>prof.find(p=>p.user_id===id);$('graph').innerHTML='<article class="card panel"><h3>Following · '+following.length+'</h3><p>'+following.map(x=>map(x.followed_id)).filter(Boolean).map(p=>'<a class="btn" href="listener-profile.html?user='+encodeURIComponent(p.handle||p.user_id)+'">@'+E(p.handle||p.display_name)+'</a>').join(' ')||'None yet'+'</p></article><article class="card panel"><h3>Followers · '+followers.length+'</h3><p>'+followers.map(x=>map(x.follower_id)).filter(Boolean).map(p=>'<a class="btn" href="listener-profile.html?user='+encodeURIComponent(p.handle||p.user_id)+'">@'+E(p.handle||p.display_name)+'</a>').join(' ')||'None yet'+'</p></article>'}await graph();await CrowPodcasting.subscribeSocialRealtime({comments:()=>load(),notifications:()=>load(),activity:()=>load()})})</script></body></html>
