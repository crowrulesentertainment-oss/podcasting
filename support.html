<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>Support & Membership | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>:root{--c:#42e8ff;--p:#9b6cff;--m:#a6adc1;--b:rgba(255,255,255,.1)}body{background:#05050b;color:#fff}.wrap{max-width:1200px;margin:auto;padding:30px 18px 80px}.hero{padding:55px 0 30px}.ey{font:800 11px Orbitron,Arial;letter-spacing:.18em;color:var(--c)}h1{font:800 clamp(40px,7vw,78px)/.95 Orbitron,Arial;margin:10px 0}h1 span{color:var(--c)}p{color:var(--m);line-height:1.6}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid var(--b);border-radius:20px;background:rgba(12,13,24,.9);padding:22px;display:flex;flex-direction:column}.type{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--c)}.price{font:800 34px Orbitron,Arial;margin:18px 0}.price small{font:600 12px Arial;color:var(--m)}button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:linear-gradient(135deg,var(--c),var(--p));cursor:pointer;margin-top:auto}.msg{margin:18px 0;font-weight:700}.access{margin-top:28px;padding:20px;border:1px solid var(--b);border-radius:18px}.pill{display:inline-block;padding:5px 9px;border:1px solid var(--b);border-radius:999px;font-size:10px;margin:4px}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:600px){.cards{grid-template-columns:1fr}}</style><link rel="stylesheet" href="css/global-navigation.css">

</head><body><main class="wrap"><section class="hero"><div class="ey">CROW RULES PODCASTING · SUPPORT THE SHOWS</div><h1>ONE UNIVERSE.<br><span>MORE STORIES.</span></h1><p>Support independent creators, unlock eligible premium experiences, and help CrowRules Podcasting grow.</p></section><div id="msg" class="msg"></div><section id="products" class="cards"><p>Loading available products…</p></section><section class="access"><div class="ey">YOUR ACCESS</div><div id="access"><p>Sign in to view your active podcast entitlements.</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>(async()=>{const cfg=window.CROWRULES_CONFIG,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),msg=document.getElementById("msg"),grid=document.getElementById("products"),access=document.getElementById("access");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const {data:{user}}=await sb.auth.getUser();const podcastId=new URLSearchParams(location.search).get("podcast_id");async function load(){let q=sb.from("cr_podcast_monetization_products").select("id,name,description,product_type,amount_cents,interval").eq("active",true).order("created_at",{ascending:false});if(podcastId)q=q.eq("podcast_id",podcastId);const {data:p,error}=await q;if(error){grid.innerHTML="<p>Products are temporarily unavailable.</p>";return}grid.innerHTML=p?.length?p.map(x=>{const recurring=x.interval==="month"||x.interval==="year";return `<article class="card"><div class="type">${esc(x.product_type)}</div><h2>${esc(x.name)}</h2><p>${esc(x.description||"Support this CrowRules podcast experience.")}</p><div class="price">$${(Number(x.amount_cents||0)/100).toFixed(2)} <small>${recurring?"/ "+x.interval:"one time"}</small></div><button data-id="${x.id}">${x.product_type==="membership"?"SUBSCRIBE":"CONTINUE TO CHECKOUT"}</button></article>`}).join(""):"<p>No public monetization products are available yet.</p>";grid.querySelectorAll("button").forEach(b=>b.onclick=()=>checkout(b.dataset.id))}async function checkout(id){if(!user){location.href="login.html?redirect="+encodeURIComponent("support.html");return}msg.textContent="Opening secure Stripe Checkout…";const {data:{session}}=await sb.auth.getSession();const res=await fetch(cfg.supabaseUrl+"/functions/v1/create-podcast-checkout",{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify({product_id:id,success_url:location.origin+location.pathname+"?checkout=success",cancel_url:location.href})});const j=await res.json();if(!res.ok)throw new Error(j.error||"Checkout unavailable");location.href=j.url}async function loadAccess(){if(!user)return;const {data:e,error}=await sb.from("cr_podcast_entitlements").select("status,starts_at,ends_at,product_id").eq("member_user_id",user.id).order("created_at",{ascending:false});if(error){access.innerHTML="<p>Access status unavailable.</p>";return}access.innerHTML=e?.length?e.map(x=>`<span class="pill">${esc(x.status)}</span>`).join(""):"<p>No podcast entitlements yet.</p>"}load();loadAccess();if(new URLSearchParams(location.search).get("checkout")==="success")msg.textContent="Payment completed. Your access will appear here after Stripe confirms the payment.";})().catch(e=>{document.getElementById("msg").textContent=e.message})</script></body></html>
