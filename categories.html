<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Categories | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/global-navigation.css">
<script src="js/domain-service-loader.js" defer></script>
<script src="js/domain-service-loader.js" defer></script>
<script src="js/global-navigation.js" defer></script>
<style>.cat{padding:45px 0 90px}.cat h1{font:800 clamp(2.4rem,6vw,5rem)/1 Orbitron}.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:30px}.category{display:block;padding:24px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(12,13,24,.78);transition:.2s}.category:hover{transform:translateY(-3px);border-color:rgba(57,231,255,.4)}.category strong{display:block;font:700 1.1rem Orbitron}.category span{display:block;margin-top:8px;color:#9d9eac;font-size:.75rem}</style></head><body><main class="section wrap cat"><p class="eyebrow">CROWRULES DISCOVERY 2.0</p><h1>Explore by <span style="color:#39e7ff">category.</span></h1><p>Categories are generated from the published podcast catalog.</p><section id="cats" class="cats"><div class="cr-empty">Loading categories…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>
(async function(){const root=document.getElementById("cats"),sb=window.supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY);try{const{data,error}=await sb.from("podcasts").select("category").in("status",["active","published","live"]);if(error)throw error;const counts={};(data||[]).forEach(x=>{const k=String(x.category||"Other").trim()||"Other";counts[k]=(counts[k]||0)+1});const keys=Object.keys(counts).sort((a,b)=>a.localeCompare(b));root.innerHTML=keys.length?keys.map(k=>'<a class="category" href="search.html?type=podcast&category='+encodeURIComponent(k)+'"><strong>'+k.replace(/[&<>"]/g,"")+'</strong><span>'+counts[k]+' published podcast'+(counts[k]===1?"":"s")+'</span></a>').join(""):'<div class="cr-empty">No published categories yet.</div>'}catch(e){console.error(e);root.innerHTML='<div class="cr-empty"><strong>Categories unavailable</strong>Please try again shortly.</div>'}})();
</script></body></html>
