<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Episodes | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
.hero{padding:48px 0 25px}.hero h1{font-size:clamp(40px,7vw,76px);margin:8px 0}.hero p{max-width:760px;color:var(--muted);line-height:1.7}.eyebrow{font-size:10px;letter-spacing:.18em}.shell{padding:20px 0 100px}.controls{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin:20px 0}.controls input,.controls select{width:100%;box-sizing:border-box}.count{color:var(--muted);font-size:11px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{overflow:hidden;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:rgba(10,10,20,.84);display:flex;flex-direction:column}.art{aspect-ratio:16/9;background:linear-gradient(135deg,#111124,#07070d);display:grid;place-items:center;overflow:hidden;text-decoration:none}.art img{width:100%;height:100%;object-fit:cover}.art b{font:700 48px Orbitron;opacity:.25}.body{padding:18px}.meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.card h2{font-size:18px;line-height:1.35;margin:10px 0}.card p{font-size:12px;line-height:1.6;color:var(--muted);min-height:38px}.card small{display:block;color:var(--muted);margin:14px 0}.card .btn{display:inline-block}.center{text-align:center;margin-top:28px}.empty{grid-column:1/-1;padding:70px;text-align:center;border:1px dashed rgba(255,255,255,.12);border-radius:22px;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.hero{padding-top:30px}}

</head><body><div class="site-background" aria-hidden="true"><div class="background-stars"></div><div class="background-grid"></div><div class="background-glow background-glow-one"></div><div class="background-glow background-glow-two"></div><div class="background-noise"></div></div><main id="main"><section class="hero wrap"><div class="eyebrow">CROWRULES PODCASTING · EPISODES</div><h1>Every <span class="glow">Episode.</span><br>Every Story.</h1><p>Discover published episodes across the CrowRules universe. Search, filter, sort, and jump into an episode.</p></section><section class="wrap shell"><div class="controls"><input id="q" type="search" placeholder="Search episodes, shows, descriptions…"><select id="pod"><option value="">All podcasts</option></select><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="plays">Most played</option><option value="az">A–Z</option></select><button id="reset" class="btn">Reset</button></div><div id="status" class="count">Loading…</div><div id="grid" class="grid"></div><div class="center"><button id="more" class="btn primary hidden">Load More</button></div></section></main><script src="js/config.js"></script><script src="js/member-state.js"></script><script src="js/member-actions.js"></script><script>
(()=>{"use strict";const $=id=>document.getElementById(id);let db,all=[],shown=12;const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");const date=v=>v?new Date(v).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):"";const dur=s=>{s=Number(s||0);if(!s)return"";return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};function render(){let q=$("q").value.toLowerCase().trim(),pid=$("pod").value,sort=$("sort").value;let a=all.filter(e=>(!pid||e.podcast_id===pid)&&(!q||(e.title+" "+(e.description||"")+" "+e.podcast).toLowerCase().includes(q)));a.sort((x,y)=>sort==="plays"?Number(y.play_count||0)-Number(x.play_count||0):sort==="old"?new Date(x.published_at||x.created_at)-new Date(y.published_at||y.created_at):sort==="az"?x.title.localeCompare(y.title):new Date(y.published_at||y.created_at)-new Date(x.published_at||x.created_at));$("status").textContent=a.length+" published episode"+(a.length===1?"":"s");$("grid").innerHTML=a.slice(0,shown).map(e=>{let art=e.thumbnail_url||e.artwork_url;let link="episode.html?slug="+encodeURIComponent(e.slug||e.id);return '<article class="card"><a class="art" href="'+link+'">'+(art?'<img loading="lazy" src="'+esc(art)+'" alt="">':'<b>CR</b>')+'</a><div class="body"><div class="meta"><span>'+esc(e.podcast)+'</span><span>S'+esc(e.season_number||1)+' · E'+esc(e.episode_number||"—")+'</span>'+(e.duration_seconds?'<span>'+dur(e.duration_seconds)+'</span>':"")+'</div><h2>'+esc(e.title)+'</h2><p>'+esc(e.description||"No description yet.")+'</p><small>'+Number(e.play_count||0).toLocaleString()+' plays · '+date(e.published_at||e.created_at)+'</small><a class="btn primary" href="'+link+'">Open Episode</a></div></article>'}).join("")||'<div class="empty"><h2>No episodes found</h2><p>Try another search or filter.</p></div>';$("more").classList.toggle("hidden",shown>=a.length)}async function init(){try{let url=window.CROWRULES_SUPABASE_URL||window.SUPABASE_URL,key=window.CROWRULES_SUPABASE_PUBLISHABLE_KEY||window.SUPABASE_PUBLISHABLE_KEY||window.SUPABASE_ANON_KEY;if(!url||!key)throw Error("Supabase configuration missing");db=supabase.createClient(url,key);let p=await db.from("podcasts").select("id,title,artwork_url").eq("status","published").order("title");if(p.error)throw p.error;p.data.forEach(x=>{let o=document.createElement("option");o.value=x.id;o.textContent=x.title;$("pod").appendChild(o)});let r=await db.from("podcast_episodes").select("id,podcast_id,title,slug,description,episode_number,season_number,published_at,duration_seconds,thumbnail_url,play_count,created_at").eq("status","published").order("published_at",{ascending:false}).limit(500);if(r.error)throw r.error;all=(r.data||[]).map(e=>{let show=(p.data||[]).find(x=>x.id===e.podcast_id);return {...e,podcast:show?.title||"CrowRules Podcasting",artwork_url:show?.artwork_url||""}});render()}catch(e){$("status").textContent="Unable to load episodes: "+e.message}}$("q").oninput=()=>{shown=12;render()};$("pod").onchange=()=>{shown=12;render()};$("sort").onchange=()=>{shown=12;render()};$("reset").onclick=()=>{$("q").value="";$("pod").value="";$("sort").value="new";shown=12;render()};$("more").onclick=()=>{shown+=12;render()};init()})();
</script></body></html>
