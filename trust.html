<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Evidence Trust Center</title><style>body{margin:0;background:#03040a;color:#f5f7ff;font:15px Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:60px 24px}.card{background:#0a0d17;border:1px solid #20273a;border-radius:18px;padding:28px;margin:18px 0}.title{font-size:38px;font-weight:800}.muted{color:#9ba5bd;line-height:1.7}.btn{padding:12px 18px;border:1px solid #57e8ff;border-radius:9px;background:#07131b;color:#57e8ff;cursor:pointer}.ok{border-color:#4dffb3}.bad{border-color:#ff647c}.mono{font-family:monospace;word-break:break-all}</style></head><body><main class="wrap"><div class="card"><div class="title">CROWRULES EVIDENCE TRUST CENTER</div><p class="muted">Public certificate verification without disclosure of underlying forensic evidence.</p><input id="key" style="width:70%;padding:12px;background:#050810;color:#fff;border:1px solid #30394f;border-radius:8px" placeholder="Enter Trust Key"><button class="btn" id="verify">VERIFY</button></div><div id="result"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const S="https://cevylpnoexugwgygvtgu.supabase.co";const K=window.CROWRULES_SUPABASE_KEY||"";const sb=supabase.createClient(S,K);const out=document.getElementById("result");document.getElementById("verify").onclick=async()=>{const k=document.getElementById("key").value.trim();if(!k){out.innerHTML='<div class="card bad">Enter a Trust Key.</div>';return}const {data,error}=await sb.rpc("cr_podcast_recovery_evidence_trust_public_verify_v848",{p_trust_key:k});if(error){out.innerHTML='<div class="card bad"><h2>Verification unavailable</h2><p class="muted">'+String(error.message).replace(/[<>&]/g,"")+'</p></div>';return}const ok=data&&data.status==="VERIFIED";out.innerHTML='<div class="card '+(ok?'ok':'bad')+'"><h2>'+(ok?'✓ TRUST VERIFIED':'⚠ '+String(data.status||'UNKNOWN'))+'</h2><p class="muted">Trust Key</p><div class="mono">'+String(data.trust_key||k).replace(/[<>&]/g,"")+'</div><p class="muted">Certificate</p><div class="mono">'+String(data.certificate_key||"").replace(/[<>&]/g,"")+'</div><p class="muted">Certificate SHA-256</p><div class="mono">'+String(data.certificate_sha256||"").replace(/[<>&]/g,"")+'</div><p class="muted">'+String(data.verification_scope||"No forensic evidence is disclosed.").replace(/[<>&]/g,"")+'</p></div>'};</script></body></html>
