<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Following | CrowRules Podcasting</title><link rel="stylesheet" href="assets/css/cinematic.css"><link rel="stylesheet" href="assets/css/style.css"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet"><style>:root{--c:#00e5ff;--v:#8b5cf6;--bg:#030308;--m:#9299ae;--l:rgba(255,255,255,.09)}body{margin:0;background:radial-gradient(circle at 15% 0%,#00e5ff18,transparent 30%),radial-gradient(circle at 85% 0%,#8b5cf625,transparent 35%),var(--bg);color:#fff;font-family:Montserrat,Arial}.wrap{width:min(1100px,94%);margin:auto;padding:38px 0 110px}.hero,.card{border:1px solid var(--l);background:#0b0a14db;border-radius:22px}.hero{padding:30px}.ey{font:900 10px Orbitron;letter-spacing:.18em;color:var(--c)}h1,h2,h3{font-family:Orbitron}h1{font-size:clamp(30px,5vw,54px);margin:10px 0}.muted{color:var(--m);line-height:1.7;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{display:inline-block;padding:11px 15px;border:1px solid var(--l);border-radius:10px;background:#10101a;color:#fff;text-decoration:none;font-weight:900;cursor:pointer}.primary{background:linear-gradient(90deg,var(--c),var(--v));color:#030308}.list{margin-top:18px;display:grid;gap:11px}.show{display:grid;grid-template-columns:82px 1fr auto;gap:15px;align-items:center;padding:15px}.art{width:82px;height:82px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:#10101a;font:900 20px Orbitron}.art img{width:100%;height:100%;object-fit:cover}.show h3{margin:0 0 6px;font-size:14px}.show p{margin:0;color:var(--m);font-size:10px}.empty{text-align:center;padding:45px;color:var(--m);border:1px dashed var(--l);border-radius:16px}@media(max-width:600px){.show{grid-template-columns:60px 1fr}.art{width:60px;height:60px}.show .btn{grid-column:1/-1}} </style>  <link rel="stylesheet" href="css/podcasting-enhanced.css">
</head><body><header class="nav"><a class="brand" href="index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header><main class="wrap"><section class="hero"><div class="ey">CROWRULES PODCASTING · LISTENER</div><h1>Following</h1><p class="muted">Your followed podcasts live here. Follow a show from its Podcast Show Page and it will appear automatically on your Universal CrowRules listener account.</p><div class="actions"><a class="btn primary" href="podcasts.html">Discover Podcasts</a><a class="btn" href="listener-profile.html">Listener Profile</a><a class="btn" href="top-10.html">Top 10</a></div></section><section class="list" id="list"><div class="empty">Checking your CrowRules account…</div></section></main><script src="assets/js/app.js"></script><script>(async()=>{const list=document.getElementById('list'),nf=new Intl.NumberFormat(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));try{const sb=await loadSupabase(),{data:u}=await sb.auth.getUser();if(!u.user){list.innerHTML='<div class="empty">Sign in to see your followed podcasts.<br><br><a class="btn primary" href="login.html?next='+encodeURIComponent(location.href)+'">Sign In</a></div>';return}const r=await sb.from('podcast_follows').select('id,created_at,podcast_id,podcasts(id,title,slug,category,description,artwork_url,status,total_plays,listener_count)').eq('user_id',u.user.id).order('created_at',{ascending:false});if(r.error)throw r.error;const rows=r.data||[];list.innerHTML=rows.length?rows.map(x=>{const p=x.podcasts||{};return '<article class="card show"><div class="art">'+(p.artwork_url?'<img src="'+esc(p.artwork_url)+'" alt="'+esc(p.title)+'">':'CR')+'</div><div><h3>'+esc(p.title||'Podcast')+'</h3><p>'+esc(p.category||'Podcast')+' · '+nf.format(p.total_plays||0)+' plays · '+esc(p.description||'')+'</p></div><a class="btn primary" href="show.html?id='+encodeURIComponent(p.id||x.podcast_id)+'">Open Show</a></article>'}).join(''):'<div class="empty">You are not following any podcasts yet.<br><br><a class="btn primary" href="podcasts.html">Discover Podcasts →</a></div>'}catch(e){console.error(e);list.innerHTML='<div class="empty">Unable to load your following list.<br><br>'+esc(e.message||'Please try again.')+'</div>'}})();</script><script src="js/crowrules-invite.js"></script>
