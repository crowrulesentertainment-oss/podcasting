</head><body><main id="main-content" class="x"><section class="hero"><div class="ey">YOUR NETWORK</div><h1>Following</h1><p>Keep up with podcasts and people you've chosen to follow.</p><div class="actions"><a class="btn primary" href="member-hub.html">← Member Hub</a><a class="btn" href="creators.html">Creators</a></div></section><section class="panel"><div id="list" class="grid"><div class="empty">Loading your follows…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/member-state.js"></script><script>const client=window.CrowRulesData?.getClient?.() || window.supabaseClient||supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY);async function auth(){const {data,error}=await client.auth.getUser();if(error||!data.user){location.href='login.html?redirect='+encodeURIComponent(location.pathname.split('/').pop());return null}return data.user}function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))};(async()=>{const u=await auth();if(!u)return;const [p,c]=await Promise.all([client.from('podcast_follows').select('podcast_id,created_at').eq('user_id',u.id).order('created_at',{ascending:false}),client.from('podcast_member_follows').select('followed_user_id,created_at').eq('follower_user_id',u.id).order('created_at',{ascending:false})]);const box=document.getElementById('list');const ids=(p.data||[]).map(x=>x.podcast_id);const users=(c.data||[]).map(x=>x.followed_user_id);const pq=ids.length?await client.from('podcasts').select('id,title,description,slug').in('id',ids):{data:[]};const cq=users.length?await client.from('podcast_member_profiles').select('user_id,display_name,username,headline').in('user_id',users):{data:[]};const cards=[...(pq.data||[]).map(x=>'<article class="item"><h2>🎙️ '+esc(x.title)+'</h2><p>'+esc(x.description||'Podcast you follow')+'</p><a href="podcast.html?slug='+encodeURIComponent(x.slug||'')+'">Open Podcast →</a></article>'),...(cq.data||[]).map(x=>'<article class="item"><h2>👤 '+esc(x.display_name||x.username||'Member')+'</h2><p>'+esc(x.headline||'Member you follow')+'</p><a href="profile.html?user='+encodeURIComponent(x.user_id)+'">View Profile →</a></article>')];box.innerHTML=cards.join('')||'<div class="empty">You are not following any podcasts or members yet.</div>'})()</script></body></html>
