<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audience Center | CrowRules Podcasting</title><style>body{margin:0;background:#04050a;color:#fff;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:30px}.panel{background:#0c0e16;border:1px solid #ffffff15;border-radius:20px;padding:22px;margin:15px 0}h1,h2{font-family:Arial}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.btn{border:1px solid #ffffff18;background:#111522;color:#fff;padding:10px 13px;border-radius:10px;cursor:pointer;text-decoration:none}.tab.active,.primary{background:linear-gradient(90deg,#00e5ff,#8b5cf6);color:#020308}.row{padding:14px 0;border-bottom:1px solid #ffffff12}.muted{color:#9299ae;font-size:12px;line-height:1.6}.badge{font-size:9px;padding:4px 7px;border-radius:99px;background:#00e5ff18;color:#00e5ff}.empty{text-align:center;padding:35px;color:#9299ae}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#111522;padding:15px;border-radius:12px}.stat b{font-size:22px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style><link rel="stylesheet" href="../css/podcasting-enhanced.css">
</head><body><header class="nav"><a class="brand" href="../index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header><main class="wrap"><div class="panel"><div class="muted">CROWRULES PODCASTING · CREATOR STUDIO</div><h1>Audience Center</h1><p class="muted">See followers, listener profiles, episode comments, reactions and creator notifications from one place.</p><div class="tabs"><button class="tab active" data-tab="followers">Followers</button><button class="tab" data-tab="comments">Comments</button><button class="tab" data-tab="reactions">Reactions</button><button class="tab" data-tab="notifications">Notifications</button></div></div><div id="stats" class="grid"></div><section class="panel"><div id="content"><div class="empty">Loading audience…</div></div></section></main><script src="../assets/js/app.js"></script><script>(async()=>{let sb,uid,shows=[],followers=[],comments=[],reactions=[],notes=[];const content=document.getElementById('content'),stats=document.getElementById('stats'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function stat(n,l){return '<div class="stat"><b>'+n+'</b><div class="muted">'+l+'</div></div>'}async function init(){sb=await loadSupabase();const {data:u}=await sb.auth.getUser();if(!u.user){location.href='../login.html?next='+encodeURIComponent(location.href);return}uid=u.user.id;let r=await sb.from('podcasts').select('id,title').eq('creator_id',uid);if(r.error)throw r.error;shows=r.data||[];const ids=shows.map(x=>x.id);if(!ids.length){render();return}r=await sb.from('podcast_follows').select('user_id,podcast_id,created_at').in('podcast_id',ids).order('created_at',{ascending:false});followers=r.data||[];r=await sb.from('podcast_episode_comments').select('id,episode_id,user_id,author_name,body,status,created_at,podcast_episodes!inner(id,title,podcast_id)').in('podcast_episodes.podcast_id',ids).order('created_at',{ascending:false});comments=r.data||[];r=await sb.from('podcast_episode_reactions').select('id,episode_id,user_id,reaction,created_at,podcast_episodes!inner(id,title,podcast_id)').in('podcast_episodes.podcast_id',ids).order('created_at',{ascending:false});reactions=r.data||[];r=await sb.from('podcast_notifications').select('*').eq('user_id',uid).order('created_at',{ascending:false}).limit(50);notes=r.data||[];renderStats();render('followers')}function renderStats(){stats.innerHTML=stat(followers.length,'FOLLOW EVENTS')+stat(new Set(followers.map(x=>x.user_id)).size,'UNIQUE FOLLOWERS')+stat(comments.length,'COMMENTS')+stat(reactions.length,'REACTIONS')}function render(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));if(tab==='followers')content.innerHTML=followers.length?followers.map(x=>'<div class="row"><span class="badge">FOLLOW</span> Listener '+esc(x.user_id.slice(0,8))+' followed '+esc(shows.find(s=>s.id===x.podcast_id)?.title||'your podcast')+'<div class="muted">'+new Date(x.created_at).toLocaleString()+'</div></div>').join(''):'<div class="empty">No followers yet.</div>';if(tab==='comments')content.innerHTML=comments.length?comments.map(x=>'<div class="row"><b>'+esc(x.author_name||'Listener')+'</b> · '+esc(x.podcast_episodes?.title||'Episode')+'<p class="muted">'+esc(x.body)+'</p><span class="badge">'+esc(x.status||'pending')+'</span></div>').join(''):'<div class="empty">No episode comments yet.</div>';if(tab==='reactions')content.innerHTML=reactions.length?reactions.map(x=>'<div class="row"><b>'+esc(x.reaction||'reaction')+'</b> · '+esc(x.podcast_episodes?.title||'Episode')+'<div class="muted">'+new Date(x.created_at).toLocaleString()+'</div></div>').join(''):'<div class="empty">No episode reactions yet.</div>';if(tab==='notifications')content.innerHTML=notes.length?notes.map(x=>'<div class="row"><b>'+esc(x.title||'Notification')+'</b><p class="muted">'+esc(x.body||'')+'</p><span class="badge">'+(x.is_read?'READ':'NEW')+'</span></div>').join(''):'<div class="empty">No notifications.</div>'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));init().catch(e=>content.innerHTML='<div class="empty">Unable to load audience data.<br>'+esc(e.message||'')+'</div>')})();</script><script src="../js/crowrules-invite.js"></script>
<script src="../js/crowrules-navigation.js"></script>
