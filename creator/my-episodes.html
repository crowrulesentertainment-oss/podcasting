<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator · My Episodes | CrowRules Podcasting</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="nav"><a class="brand" href="../index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header><main><h1>My Episodes</h1><p>Your drafts and published episodes.</p><div class="notice">Episode management loads from Supabase for the signed-in creator.</div></main><footer class="footer">CrowRules Podcasting · Listen. Create. Share.</footer><script src="assets/js/app.js"></script><script>async function createPodcast(){const c=await loadSupabase();const {data:userData}=await c.auth.getUser();if(!userData.user)return location.href="../login.html";const {data,error}=await c.from("podcasts").insert({title:v("title"),slug:v("slug"),category:v("category"),description:v("description"),artwork_url:v("artwork_url"),creator_id:userData.user.id,status:"draft"}).select().single();msg(error?error.message:"Podcast created.");if(data)location.href="my-podcasts.html"}async function uploadEpisode(){const c=await loadSupabase();const {data:userData}=await c.auth.getUser();if(!userData.user)return location.href="../login.html";const f=document.getElementById("audio").files[0];if(!f)return msg("Choose an audio file.");const path=userData.user.id+"/"+Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_");const up=await c.storage.from("podcast-audio").upload(path,f,{upsert:false});if(up.error)return msg(up.error.message);const pub=c.storage.from("podcast-audio").getPublicUrl(path).data.publicUrl;const ins=await c.from("podcast_episodes").insert({podcast_id:v("podcast_id"),title:v("title"),slug:(v("title").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""))+"-"+Date.now(),description:v("description"),audio_url:pub,thumbnail_url:v("thumbnail_url"),status:"draft"});msg(ins.error?ins.error.message:"Episode uploaded and saved as draft.")}</script></body></html>
