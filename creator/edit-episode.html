<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Episode | CrowRules Podcasting</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet"><style>:root{--bg:#04050a;--panel:#0c0e16;--line:#ffffff14;--muted:#929aaf;--c:#27e6ff;--v:#9b5cff;--red:#ff5268}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#27e6ff14,transparent 30%),radial-gradient(circle at 90% 0%,#9b5cff18,transparent 30%),var(--bg);color:#fff;font-family:Montserrat}.wrap{width:min(900px,94%);margin:auto;padding:38px 0 100px}.panel{padding:28px;border:1px solid var(--line);border-radius:24px;background:#0c0e16dd}.ey{font:900 10px Orbitron;letter-spacing:.18em;color:var(--c)}h1{font:900 clamp(30px,5vw,48px) Orbitron;margin:9px 0}.muted{color:var(--muted);font-size:12px;line-height:1.65}.field{margin:17px 0}label{display:block;font-size:10px;font-weight:900;margin-bottom:7px;color:#dfe5f5}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;background:#080a11;color:#fff}textarea{min-height:150px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.btn{padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:#10131d;color:#fff;font-weight:900;cursor:pointer;text-decoration:none}.primary{background:linear-gradient(90deg,var(--c),var(--v));color:#030308}.danger{color:#ff9aa7;border-color:#ff526844}.msg{margin-top:16px;padding:12px;border-radius:10px;background:#ffffff08;font-size:12px}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info div{padding:13px;border:1px solid var(--line);border-radius:11px}.info small{display:block;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}.info b{display:block;margin-top:5px}@media(max-width:600px){.info{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="panel"><div class="ey">CREATOR STUDIO · EPISODE EDITOR</div><h1>Edit Episode</h1><p class="muted">Update episode metadata and publishing status. Changes are saved directly to your CrowRules Podcasting Supabase record.</p><div id="loading" class="msg">Loading episode…</div><form id="form" hidden><div class="info"><div><small>Podcast</small><b id="podcast">—</b></div><div><small>Episode ID</small><b id="idLabel">—</b></div></div><div class="field"><label>Episode Title</label><input id="title" required></div><div class="field"><label>Description / Show Notes</label><textarea id="description"></textarea></div><div class="field"><label>Status</label><select id="status"><option value="draft">Draft</option><option value="published">Published</option><option value="scheduled">Scheduled</option><option value="archived">Archived</option></select></div><div class="field"><label>Published / Scheduled Date</label><input id="publishedAt" type="datetime-local"></div><div class="actions"><button class="btn primary" type="submit" id="save">Save Changes</button><button class="btn danger" type="button" id="archive">Archive Episode</button><a class="btn" id="view" href="#">View Episode</a><a class="btn" href="my-episodes.html">Episode Library</a></div></form><div id="msg" class="msg" hidden></div></section></main><script src="../assets/js/app.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get('id'),loading=document.getElementById('loading'),form=document.getElementById('form'),msg=document.getElementById('msg');let sb,episode,user;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function show(t,bad=false){msg.hidden=false;msg.textContent=t;msg.style.color=bad?'#ffadb7':'#aab2c5'}function localDate(v){if(!v)return '';const d=new Date(v);if(Number.isNaN(d.getTime()))return '';const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes())}try{if(!id)throw Error('Missing episode ID.');sb=await loadSupabase();const au=await sb.auth.getUser();user=au.data.user;if(!user) {location.href='../login.html?next='+encodeURIComponent(location.href);return}let r=await sb.from('podcast_episodes').select('*,podcasts!inner(id,title,creator_id)').eq('id',id).single();if(r.error)throw r.error;if(r.data.podcasts.creator_id!==user.id)throw Error('You do not have permission to edit this episode.');episode=r.data;document.getElementById('podcast').textContent=episode.podcasts.title||'Podcast';document.getElementById('idLabel').textContent=episode.id;document.getElementById('title').value=episode.title||'';document.getElementById('description').value=episode.description||'';document.getElementById('status').value=episode.status||'draft';document.getElementById('publishedAt').value=localDate(episode.published_at);document.getElementById('view').href='../episode.html?id='+encodeURIComponent(id);loading.hidden=true;form.hidden=false}catch(e){loading.textContent=e.message||'Unable to load episode.';loading.style.color='#ffadb7';return}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('save');b.disabled=true;b.textContent='Saving…';try{const status=document.getElementById('status').value;const date=document.getElementById('publishedAt').value;const r=await sb.from('podcast_episodes').update({title:document.getElementById('title').value.trim(),description:document.getElementById('description').value.trim(),status,published_at:date?new Date(date).toISOString():null}).eq('id',id);if(r.error)throw r.error;show('Episode saved successfully.');setTimeout(()=>location.href='my-episodes.html',600)}catch(e){show(e.message||'Unable to save episode.',true);b.disabled=false;b.textContent='Save Changes'}});document.getElementById('archive').onclick=async()=>{if(!confirm('Archive this episode?'))return;const r=await sb.from('podcast_episodes').update({status:'archived'}).eq('id',id);if(r.error){show(r.error.message,true);return}location.href='my-episodes.html'})})();</script><script src="../js/crowrules-invite.js"></script>
<script src="../js/crowrules-navigation.js"></script>
</body></html>
