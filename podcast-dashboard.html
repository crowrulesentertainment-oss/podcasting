.dashboard{width:min(1240px,92vw);margin:auto;padding:28px 0 70px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.back{font-size:11px;color:#9da1bd}.hero{margin-top:18px;padding:28px;border:1px solid #26263c;border-radius:26px;background:linear-gradient(135deg,rgba(18,18,35,.97),rgba(7,7,15,.97));overflow:hidden}.hero-grid{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;align-items:center}.art{width:180px;aspect-ratio:1;border-radius:20px;overflow:hidden;border:1px solid rgba(34,230,255,.25);background:#101020;display:grid;place-items:center}.art img{width:100%;height:100%;object-fit:cover}.art span{font:800 32px Orbitron;color:#55e7ff}.eyebrow{color:#55e7ff;font:800 10px Orbitron;letter-spacing:.2em;text-transform:uppercase}h1{margin:8px 0;font:800 clamp(28px,5vw,52px) Orbitron}.desc{max-width:760px;color:#9da1bd;line-height:1.75}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.chip{padding:7px 10px;border:1px solid rgba(255,255,255,.1);border-radius:999px;color:#aeb4ca;font-size:9px;font-weight:800;text-transform:uppercase}.live{color:#69f5ae;border-color:rgba(105,245,174,.25)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 14px;border:1px solid #3b3b5b;border-radius:12px;background:rgba(255,255,255,.04);color:#fff;font-size:10px;font-weight:800;text-decoration:none}.primary{border:0;background:linear-gradient(135deg,#55e7ff,#a879ff);color:#05050b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat,.panel{border:1px solid #26263c;border-radius:18px;background:rgba(12,13,24,.9);box-shadow:0 15px 50px rgba(0,0,0,.22)}.stat{padding:17px}.label{color:#707895;font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.value{margin-top:8px;font:800 25px Orbitron}.detail{margin-top:4px;color:#69718c;font-size:9px}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,.7fr);gap:18px;margin-top:18px}.panel{padding:20px}.head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:13px}.title{font:800 16px Orbitron}.sub{color:#69718c;font-size:9px;margin-top:4px}.episode{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:13px;align-items:center;padding:12px;border:1px solid rgba(255,255,255,.055);border-radius:14px;background:rgba(255,255,255,.025);margin-bottom:9px}.thumb{width:52px;height:52px;border-radius:10px;overflow:hidden;background:#151527;display:grid;place-items:center;color:#55e7ff;font:800 11px Orbitron}.thumb img{width:100%;height:100%;object-fit:cover}.ep-title{font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ep-meta{margin-top:5px;color:#69718c;font-size:9px}.ep-stats{text-align:right;color:#9299b4;font-size:9px}.bar{height:7px;margin-top:7px;border-radius:99px;background:#191a2b;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#55e7ff,#a879ff);width:var(--w)}.check{display:flex;gap:10px;padding:12px;border-bottom:1px solid rgba(255,255,255,.06);font-size:10px;color:#9299b4}.check:last-child{border-bottom:0}.dot{width:9px;height:9px;margin-top:3px;border-radius:50%;background:#69f5ae}.dot.warn{background:#ffb86b}.notice,.empty{padding:20px;border:1px solid rgba(255,109,131,.2);border-radius:16px;color:#ffabb7;background:rgba(255,109,131,.06);font-size:11px}.empty{border-style:dashed;color:#9299b4;background:transparent;text-align:center}@media(max-width:800px){.hero-grid,.grid{grid-template-columns:1fr}.art{width:130px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.stats{grid-template-columns:1fr}.episode{grid-template-columns:44px minmax(0,1fr)}.ep-stats{grid-column:2;text-align:left}.thumb{width:44px;height:44px}}
</style>

<body>
<main class="dashboard">
<div class="top"><a class="back" href="podcast-manager.html">← Podcast Manager</a><a class="btn" href="creator-studio.html">Creator Studio</a></div>
<div id="notice"></div><section id="app" class="hero" hidden></section><section id="stats" class="stats" hidden></section><section id="content" class="grid" hidden></section>

<script>
(()=>{"use strict";const $=id=>document.getElementById(id),db=window.CrowRulesData.getClient();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));const fmt=n=>Number(n||0).toLocaleString();const dur=s=>{s=Number(s||0);if(!s)return"—";const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);return h?h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"):m+":"+String(x).padStart(2,"0")};const date=d=>d?new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"Not published";function notice(m){$("notice").innerHTML='<div class="notice">'+esc(m)+'</div>'}
async function boot(){try{const id=new URLSearchParams(location.search).get("id");if(!id){location.href="podcast-manager.html";return}const u=await window.CrowRulesData.getUser().then(user=>({data:{user}}));if(!u.data.user){location.href="login.html?redirect="+encodeURIComponent("podcast-dashboard.html?id="+id);return}const m=await db.from("members").select("id").eq("user_id",u.data.user.id).maybeSingle();if(m.error)throw m.error;if(!m.data)throw Error("No CrowRules membership profile found.");const c=await db.from("creators").select("id").eq("member_id",m.data.id).eq("is_active",true).maybeSingle();if(c.error)throw c.error;if(!c.data)throw Error("No active creator profile found.");const p=await db.from("podcasts").select("id,creator_id,title,slug,category,description,artwork_url,status,is_featured,is_live,listener_count,total_plays,created_at,updated_at").eq("id",id).eq("creator_id",c.data.id).maybeSingle();if(p.error)throw p.error;if(!p.data)throw Error("Podcast not found or you do not own it.");const e=await db.from("podcast_episodes").select("id,podcast_id,title,slug,description,episode_number,season_number,status,published_at,duration_seconds,thumbnail_url,play_count,created_at").eq("podcast_id",p.data.id).order("created_at",{ascending:false});if(e.error)throw e.error;const eps=e.data||[],published=eps.filter(x=>x.status==="published"),sum=eps.reduce((a,x)=>a+Number(x.play_count||0),0),total=Math.max(Number(p.data.total_plays||0),sum),max=Math.max(1,...eps.map(x=>Number(x.play_count||0))),latest=published[0]||eps[0];
$("app").innerHTML='<div class="hero-grid"><div class="art">'+(p.data.artwork_url?'<img src="'+esc(p.data.artwork_url)+'" alt="'+esc(p.data.title)+' artwork">':'<span>CR</span>')+'</div><div><div class="eyebrow">Podcast Overview</div><h1>'+esc(p.data.title)+'</h1><div class="desc">'+esc(p.data.description||"No description yet.")+'</div><div class="chips"><span class="chip">'+esc(p.data.category||"Uncategorized")+'</span><span class="chip">'+esc(p.data.status||"draft")+'</span>'+(p.data.is_live?'<span class="chip live">Live</span>':"")+(p.data.is_featured?'<span class="chip">Featured</span>':"")+'</div><div class="actions"><a class="btn primary" href="edit-podcast.html?id='+encodeURIComponent(p.data.id)+'">Edit Podcast</a><a class="btn" href="upload-episode.html?podcast_id='+encodeURIComponent(p.data.id)+'">+ Upload Episode</a><a class="btn" href="podcast.html?id='+encodeURIComponent(p.data.id)+'">View Podcast</a></div></div></div>';
$("stats").innerHTML='<div class="stat"><div class="label">Total Plays</div><div class="value">'+fmt(total)+'</div><div class="detail">Podcast total</div></div><div class="stat"><div class="label">Listeners</div><div class="value">'+fmt(p.data.listener_count)+'</div><div class="detail">Current audience</div></div><div class="stat"><div class="label">Episodes</div><div class="value">'+fmt(eps.length)+'</div><div class="detail">'+fmt(published.length)+' published</div></div><div class="stat"><div class="label">Latest</div><div class="value">'+(latest?esc(latest.episode_number||"—"):"—")+'</div><div class="detail">'+(latest?esc(latest.title):"No episodes yet")+'</div></div>';
$("content").innerHTML='<section class="panel"><div class="head"><div><div class="title">Episodes</div><div class="sub">Recent publishing activity and episode performance</div></div><a class="btn" href="episode-manager.html">Episode Manager</a></div>'+(eps.length?eps.map(x=>'<div class="episode"><div class="thumb">'+(x.thumbnail_url?'<img src="'+esc(x.thumbnail_url)+'" alt="">':esc(x.episode_number||"EP"))+'</div><div><div class="ep-title">'+esc(x.title)+'</div><div class="ep-meta">S'+esc(x.season_number||0)+' · E'+esc(x.episode_number||0)+' · '+esc(x.status||"draft")+' · '+date(x.published_at||x.created_at)+' · '+dur(x.duration_seconds)+'</div><div class="bar"><i style="--w:'+Math.round(Number(x.play_count||0)/max*100)+'%"></i></div></div><div class="ep-stats">'+fmt(x.play_count)+' plays</div></div>').join(""):'<div class="empty">No episodes yet. Upload your first episode to start building this podcast.</div>')+'</section><aside class="panel"><div class="head"><div><div class="title">Publishing Checklist</div><div class="sub">Quick health check</div></div></div>'+[[!!p.data.title,"Podcast title"],[!!p.data.description,"Description"],[!!p.data.artwork_url,"Artwork"],[p.data.status==="published","Published status"],[published.length>0,"At least one published episode"]].map(x=>'<div class="check"><span class="dot '+(x[0]?"":"warn")+'"></span><span>'+esc(x[1])+' — '+(x[0]?"Ready":"Needs attention")+'</span></div>').join("")+'<div class="actions"><a class="btn" href="analytics.html">Open Analytics</a><a class="btn" href="podcast-growth.html?id='+encodeURIComponent(p.data.id)+'">Growth & Retention</a><a class="btn" href="podcast-retention.html?id='+encodeURIComponent(p.data.id)+'">Listener Retention</a><a class="btn" href="podcast-journey.html?id='+encodeURIComponent(id)+'">Listener Journey</a><a class="btn" href="podcast-binge.html?id='+encodeURIComponent(id)+'">Binge Intelligence</a><a class="btn" href="podcast-lifecycle.html?id='+encodeURIComponent(id)+'">Episode Lifecycle</a><a class="btn" href="podcast-performance.html?id='+encodeURIComponent(id)+'">Content Performance</a><a class="btn" href="episode-manager.html">Manage Episodes</a></div></aside>';
$("app").hidden=$("stats").hidden=$("content").hidden=false}catch(e){notice(e.message||"Unable to load podcast dashboard.")}}boot()})();
</script>
