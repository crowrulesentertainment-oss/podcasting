<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Room — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script type="module" src="js/app.js"></script><script type="module" src="js/live-room.js"></script></head><body><div data-nav></div><main class="page"><header class="page-head"><p class="eyebrow"><span class="live-dot" id="roomBadge">LIVE</span> • 5.7</p><h1 id="roomTitle">Live Podcast Room.</h1><p id="roomDescription">Join the audience for a live CrowRules Podcasting transmission.</p></header><section class="live-grid"><div class="panel"><div class="viewer-frame"><video id="roomVideo" controls playsinline autoplay muted></video><div class="viewer-state" id="roomStatus">CONNECTING…</div></div><div class="actions"><button class="btn primary" id="unmuteBtn">🔊 Unmute</button><button class="btn" id="reactBtn">❤️ <span id="reactionCount">0</span></button><button class="btn" id="followBtn">＋ Follow</button></div><div class="viewer-meta"><span id="listenerCount">Connecting…</span><span id="roomStats"></span></div></div><div class="panel chat"><div class="chat-head"><h2>Live Chat</h2><span class="live-dot">REAL TIME</span></div><div class="messages" id="messages"></div><form class="chat-form" id="chatForm"><input id="chatInput" placeholder="Sign in to chat…" maxlength="500" autocomplete="off"><button class="btn primary" type="submit">Send</button></form><p id="chatNotice" class="eyebrow"></p></div></section></main></body></html>
