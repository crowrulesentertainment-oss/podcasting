<style>.wrap{width:min(1050px,92vw);margin:auto;padding:45px 0 90px}.panel{border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(13,13,24,.9);padding:28px}.k{color:#22e6ff;font:800 .7rem Orbitron;letter-spacing:.18em}.panel h1{font:900 clamp(2rem,6vw,4rem) Orbitron}.bar{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}button{padding:10px 14px;border:0;border-radius:12px;background:linear-gradient(135deg,#22e6ff,#9b5cff);font-weight:900;cursor:pointer}.danger{background:linear-gradient(135deg,#ff6b6b,#ff9f43)}.muted{color:#9da1bd;font-size:.85rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{padding:18px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}.active{color:#7fffd4}.retired{color:#ffd27a}.revoked{color:#ff8b8b}.result{margin-top:18px;white-space:pre-wrap;word-break:break-word}</style></head><body><main class="wrap"><section class="panel"><div class="k">CROWRULES CHAIN-OF-TRUST 22.0</div><h1>Attestation Key Governance</h1><p id="auth" class="muted">Checking administrator authorization…</p><div id="app" hidden><div class="bar"><button id="rotate">ROTATE ACTIVE KEY</button></div><div id="keys" class="grid"></div><div id="result" class="result muted"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/domain-service-loader.js" defer></script>

<script src="js/recommendation-governance.js"></script><script>(async()=>{const g=window.CrowRulesRecommendationGovernance,a=document.querySelector('#auth'),app=document.querySelector('#app'),keys=document.querySelector('#keys'),result=document.querySelector('#result');await g.init();if(!g.admin){a.textContent=g.user?'Administrator authorization required.':'Sign in with an administrator account.';return}a.textContent='Administrator authorization verified. Key material is never displayed.';app.hidden=false;async function load(){const {data,error}=await g.db.rpc('podcast_recommendation_attestation_key_status');if(error){result.textContent=error.message;return}keys.innerHTML=data.map(k=>`<article class="card"><b>Key v${k.key_version}</b><p class="${k.key_status}">${k.key_status.toUpperCase()}</p><p class="muted">Created: ${new Date(k.created_at).toLocaleString()}<br>Activated: ${new Date(k.activated_at).toLocaleString()}${k.retired_at?'<br>Retired: '+new Date(k.retired_at).toLocaleString():''}${k.revoked_at?'<br>Revoked: '+new Date(k.revoked_at).toLocaleString():''}</p>${k.key_status==='retired'?`<button class="danger" data-revoke="${k.key_version}">REVOKE KEY</button>`:''}</article>`).join('');keys.querySelectorAll('[data-revoke]').forEach(btn=>btn.onclick=async()=>{const version=Number(btn.dataset.revoke);const reason=prompt('Reason for revoking key v'+version+':','Administrative key revocation');if(reason===null)return;result.textContent='Revoking key…';const {data,error}=await g.db.rpc('podcast_recommendation_revoke_attestation_key',{p_key_version:version,p_reason:reason});result.textContent=error?error.message:'Key v'+data.key_version+' revoked. Historical attestations remain cryptographically identifiable but revoked keys cannot authorize production activation.';await load()})}await load();document.querySelector('#rotate').onclick=async()=>{result.textContent='Rotating key…';const {data,error}=await g.db.rpc('podcast_recommendation_rotate_attestation_key');result.textContent=error?error.message:'New attestation key activated: v'+data.key_version;await load()}})().catch(e=>console.error(e));</script></body></html>
