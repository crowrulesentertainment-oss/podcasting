<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b">
<title>Action Center — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css">
<style>
.action-hero{padding:32px;border:1px solid rgba(255,255,255,.09);border-radius:24px;background:linear-gradient(135deg,rgba(32,16,60,.7),rgba(5,5,11,.9));margin-bottom:20px}
.action-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.action-stat{padding:20px}.action-stat strong{display:block;font-size:30px;margin-top:7px}
.action-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.action-tabs button.active{outline:1px solid rgba(255,255,255,.45)}
.action-list{display:grid;gap:12px}.action-row{padding:20px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start}
.priority{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}.action-row h3{margin:5px 0}.action-row p{margin:0 0 10px;opacity:.78}.action-meta{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.07);font-size:12px}
@media(max-width:800px){.action-grid{grid-template-columns:repeat(2,1fr)}.action-row{grid-template-columns:1fr}}
</style><script type="module" src="js/app.js"></script><script type="module" src="js/action-center.js"></script></head>
<body><div data-nav></div><main class="page">
<header class="action-hero"><p class="eyebrow">CREATOR OS • 5.12</p><h1>Action Center</h1><p>Turn measured podcast signals into a focused workflow. Actions come from recorded intelligence and can be tracked through completion and outcome review.</p></header>
<div id="actionsPage"><div class="panel empty">Loading action center…</div></div>
</main></body></html>
