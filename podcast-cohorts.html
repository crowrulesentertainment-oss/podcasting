<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>Audience Cohorts | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>
.wrap{width:min(1240px,92vw);margin:auto;padding:26px 0 70px}.top,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.top{flex-wrap:wrap}.btn{display:inline-flex;padding:10px 13px;border:1px solid #3b3b5b;border-radius:11px;color:#fff;text-decoration:none;font-size:10px;font-weight:800}.hero,.panel,.stat{margin-top:18px;padding:22px;border:1px solid #26263c;border-radius:20px;background:rgba(12,13,24,.9)}.ey{color:#55e7ff;font:800 10px Orbitron;letter-spacing:.18em;text-transform:uppercase}h1{margin:8px 0;font:800 clamp(26px,5vw,48px) Orbitron}.muted{color:#737b96;font-size:9px;line-height:1.7}.desc{color:#9299b4;max-width:800px;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px}.label{color:#707895;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.value{margin-top:8px;font:800 25px Orbitron}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.item{padding:15px 0;border-bottom:1px solid rgba(255,255,255,.06)}.item:last-child{border:0}.bar{height:9px;margin-top:8px;background:#191a2b;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#55e7ff,#a879ff);width:var(--w)}.badge{padding:5px 8px;border:1px solid #34364e;border-radius:999px;font-size:8px;text-transform:uppercase}.callout{margin-top:14px;padding:14px;border:1px solid rgba(85,231,255,.14);border-radius:14px;background:rgba(85,231,255,.04);color:#aeb4ca;font-size:10px;line-height:1.7}@media(max-width:850px){.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>
(()=>{const $=x=>document.getElementById(x),db=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),fmt=n=>Number(n||0).toLocaleString(),hrs=s=>{s=Number(s||0);return s<3600?Math.round(s/60)+" min":(s/3600).toFixed(1)+" hr"};function notice(m){$("notice").innerHTML='<div class="panel">'+esc(m)+'</div>'}
async function boot(){try{const id=new URLSearchParams(location.search).get("id");if(!id){location.href="podcast-manager.html";return}$("back").href="podcast-growth.html?id="+encodeURIComponent(id);const u=await db.auth.getUser();if(!u.data.user){location.href="login.html?redirect="+encodeURIComponent("podcast-cohorts.html?id="+id);return}const m=await db.from("members").select("id").eq("user_id",u.data.user.id).maybeSingle();if(m.error)throw m.error;if(!m.data)throw Error("No CrowRules membership profile found.");const c=await db.from("creators").select("id").eq("member_id",m.data.id).eq("is_active",true).maybeSingle();if(c.error)throw c.error;if(!c.data)throw Error("No active creator profile found.");const p=await db.from("podcasts").select("id,title,description,creator_id").eq("id",id).eq("creator_id",c.data.id).maybeSingle();if(p.error)throw p.error;if(!p.data)throw Error("Podcast not found or you do not own it.");const q=await db.rpc("get_podcast_audience_cohorts",{p_podcast_id:id});if(q.error)throw q.error;const rows=q.data||[],by=Object.fromEntries(rows.map(x=>[x.cohort_window,x])),base=by["30D"]||{active_listeners:0,returning_listeners:0,new_listeners:0,sessions:0,avg_sessions_per_listener:0,total_seconds:0},ret=base.active_listeners?Math.round(base.returning_listeners/base.active_listeners*100):0;
$("hero").innerHTML='<div class="ey">Audience Cohort & Returning Listener Intelligence</div><h1>'+esc(p.data.title)+'</h1><p class="desc">'+esc(p.data.description||"Understand how listeners return, how often they listen, and how deeply they engage with the catalog.")+'</p><div class="callout">Cohorts are based on signed-in listener activity. The 7D, 30D and 90D windows are measured relative to the latest recorded signed-in listening event for this podcast.</div>';
$("stats").innerHTML='<div class="stat"><div class="label">30-Day Active</div><div class="value">'+fmt(base.active_listeners)+'</div><div class="muted">Unique signed-in listeners</div></div><div class="stat"><div class="label">Returning</div><div class="value">'+fmt(base.returning_listeners)+'</div><div class="muted">'+ret+'% of active audience</div></div><div class="stat"><div class="label">New / Re-engaged</div><div class="value">'+fmt(base.new_listeners)+'</div><div class="muted">No activity in prior window</div></div>';
const cards=rows.map(x=>{const rate=x.active_listeners?Math.round(x.returning_listeners/x.active_listeners*100):0;return '<section class="panel"><div class="row"><div><b>'+x.cohort_window+'</b><div class="muted">Audience window</div></div><span class="badge">'+rate+'% returning</span></div><div class="item"><div class="row"><span>Active listeners</span><b>'+fmt(x.active_listeners)+'</b></div><div class="bar"><i style="--w:'+Math.min(100,x.active_listeners/(Math.max(...rows.map(z=>Number(z.active_listeners||0)),1))*100)+'%"></i></div></div><div class="item"><div class="row"><span>Returning listeners</span><b>'+fmt(x.returning_listeners)+'</b></div></div><div class="item"><div class="row"><span>New / re-engaged</span><b>'+fmt(x.new_listeners)+'</b></div></div><div class="item"><div class="row"><span>Sessions</span><b>'+fmt(x.sessions)+'</b></div></div><div class="item"><div class="row"><span>Sessions / listener</span><b>'+Number(x.avg_sessions_per_listener||0).toFixed(2)+'</b></div></div><div class="item"><div class="row"><span>Listening time</span><b>'+hrs(x.total_seconds)+'</b></div></div></section>}).join("");
$("grid").innerHTML=cards+'<section class="panel"><b>How to read this</b><div class="callout"><b>Returning listener:</b> a signed-in listener who also had activity during the immediately preceding window of the same length. <br><br><b>New / re-engaged:</b> active in the current window but absent from that preceding window. Anonymous listens remain available in the Retention dashboard but cannot be assigned to a person-based cohort.</div><div class="actions"><a class="btn" href="podcast-retention.html?id='+encodeURIComponent(id)+'">Listener Retention</a><a class="btn" href="podcast-growth.html?id='+encodeURIComponent(id)+'">Growth Intelligence</a><a class="btn" href="podcast-dashboard.html?id='+encodeURIComponent(id)+'">Dashboard</a></div></section>';
$("hero").hidden=$("stats").hidden=$("grid").hidden=false}catch(e){notice(e.message||"Unable to load audience cohorts.")}}boot()})();
</script></body></html>
