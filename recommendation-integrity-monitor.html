<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>Continuous Integrity Monitor | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><link rel="stylesheet" href="css/global-navigation.css">
<style>.wrap{width:min(1180px,94vw);margin:auto;padding:44px 0 90px}.panel{padding:28px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(12,12,24,.92)}.eyebrow{color:#22e6ff;font:800 .7rem Orbitron;letter-spacing:.18em}.panel h1{font:900 clamp(2rem,6vw,4rem) Orbitron}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.actions button{padding:11px 15px;border:0;border-radius:11px;background:linear-gradient(135deg,#22e6ff,#9b5cff);font-weight:900;cursor:pointer}.state{font-size:1.1rem;padding:16px;border-radius:14px}.ok{color:#7fffd4;background:rgba(127,255,212,.06)}.bad{color:#ff8b8b;background:rgba(255,80,80,.06)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px}.card{padding:18px;border-radius:16px;background:rgba(255,255,255,.04)}.muted{color:#9da1bd;font-size:.82rem}.mono{font-family:monospace;word-break:break-all}.alert{border-left:3px solid #ff6b6b;padding:14px;margin:10px 0;background:rgba(255,80,80,.05)}.incident{border-left:3px solid #9b5cff;padding:14px;margin:10px 0;background:rgba(155,92,255,.06)}</style></head><body><main class="wrap"><section class="panel"><div class="eyebrow">CROWRULES CHAIN-OF-TRUST 25.0</div><h1>Continuous Integrity Monitor</h1><p id="auth" class="muted">Checking administrator authorization…</p><div id="app" hidden><div id="state" class="state">Loading production trust state…</div><div class="actions"><button id="run">RUN VERIFICATION &amp; AUTO-RECOVERY</button><button id="refresh">REFRESH</button></div><div class="grid"><div class="card"><b>Active Release</b><p id="release" class="mono muted">—</p></div><div class="card"><b>Last Monitor Run</b><p id="runinfo" class="muted">—</p></div><div class="card"><b>Open Alerts</b><p id="alerts" class="muted">—</p></div><div class="card"><b>Last Incident</b><p id="incident" class="muted">—</p></div></div><h2>Recovery Incidents</h2><div id="incidentList"></div><h2>Integrity Alerts</h2><div id="alertList"></div><pre id="result" class="muted"></pre></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/domain-service-loader.js" defer></script>

<script src="js/recommendation-governance.js"></script><script>(async()=>{const g=window.CrowRulesRecommendationGovernance,a=document.querySelector('#auth'),app=document.querySelector('#app');await g.init();if(!g.admin){a.textContent=g.user?'Administrator authorization required.':'Sign in with an administrator account.';return}a.textContent='Administrator authorization verified.';app.hidden=false;async function load(){const rr=await g.db.from('podcast_recommendation_integrity_monitor_runs').select('*').order('created_at',{ascending:false}).limit(1);const aa=await g.db.from('podcast_recommendation_integrity_alerts').select('*').is('resolved_at',null).order('created_at',{ascending:false}).limit(50);const ii=await g.db.from('podcast_recommendation_recovery_incidents_25').select('*').order('created_at',{ascending:false}).limit(20);const r=rr.data?.[0],alerts=aa.data||[],inc=ii.data||[];const valid=r?.valid===true;const st=document.querySelector('#state');st.className='state '+(valid?'ok':'bad');st.textContent=r?(valid?'PRODUCTION TRUST STATE: VERIFIED':'PRODUCTION TRUST STATE: ATTENTION REQUIRED'):'No monitor run recorded yet.';document.querySelector('#release').textContent=r?.result?.release_id||'—';document.querySelector('#runinfo').textContent=r?new Date(r.created_at).toLocaleString():'—';document.querySelector('#alerts').textContent=alerts.length;document.querySelector('#incident').textContent=inc[0]?(inc[0].status+' · '+new Date(inc[0].created_at).toLocaleString()):'None';document.querySelector('#incidentList').innerHTML=inc.map(x=>'<div class="incident"><b>'+x.status.toUpperCase()+'</b><div class="muted mono">'+(x.failed_release_id||'no active release')+(x.restored_release_id?' → '+x.restored_release_id:'')+' · '+new Date(x.created_at).toLocaleString()+'</div><div>'+ (x.failure_reason||'')+'</div></div>').join('')||'<p class="muted">No automated recovery incidents.</p>';document.querySelector('#alertList').innerHTML=alerts.map(x=>'<div class="alert"><b>'+x.severity.toUpperCase()+'</b> · '+x.alert_type+'<br>'+x.message+'<div class="muted mono">'+(x.release_id||'no release')+' · '+new Date(x.created_at).toLocaleString()+'</div></div>').join('')||'<p class="muted">No open integrity alerts.</p>'}document.querySelector('#run').onclick=async()=>{const {data,error}=await g.db.rpc('podcast_recommendation_run_integrity_monitor_24');document.querySelector('#result').textContent=error?error.message:JSON.stringify(data,null,2);load()};document.querySelector('#refresh').onclick=load;load()})().catch(e=>{document.querySelector('#auth').textContent='Integrity monitor unavailable.';console.error(e)})</script></body></html>
