<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Followers & Following • CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting-platform.css?v=6"><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=5" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script><script src="js/podcasting-config.js"></script><script src="js/podcasting-platform.js" defer></script><script src="js/podcasting-player.js" defer></script></head><body><main class="cr-shell"><section class="hero"><div><div class="eyebrow">CrowRules Podcasting • V5.4</div><h1>SOCIAL<br>GRAPH.</h1><p>Creators and listeners, connected beyond the episode.</p><a class="btn" href="social.html">← Community</a></div></section><section class="section"><div class="section-head"><h2>Following</h2><span id="fc" class="badge"></span></div><div id="following" class="grid"></div></section><section class="section"><div class="section-head"><h2>Followers</h2><span id="rc" class="badge"></span></div><div id="followers" class="grid"></div></section></main><script>document.addEventListener('crow:ready',async()=>{const $=x=>document.getElementById(x),E=CrowPodcasting.esc;if(!CrowPodcasting.user){document.body.innerHTML='<main class="cr-shell"><section class="hero"><h1>SIGN IN REQUIRED</h1><p>Sign in to view your social graph.</p></section></main>';return}const uid=CrowPodcasting.user.id;const[following,followers,profiles]=await Promise.all([CrowPodcasting.rows('cr_podcast_user_follows_v5','followed_id',{eq:{follower_id:uid},limit:1000}),CrowPodcasting.rows('cr_podcast_user_follows_v5','follower_id',{eq:{followed_id:uid},limit:1000}),CrowPodcasting.rows('cr_podcast_profiles_v5','user_id,handle,display_name,bio,avatar_url',{eq:{is_public:true},limit:1000})]);const fm=id=>profiles.find(p=>p.user_id===id);const followIds=new Set(following.map(x=>x.followed_id));const mutual=new Set(followers.map(x=>x.follower_id).filter(id=>followIds.has(id)));function card(id,kind){const p=fm(id);if(!p)return '';return '<article class="card panel">'+(p.avatar_url?'<img src="'+E(p.avatar_url)+'" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover">':'')+'<h3>'+E(p.display_name||'Listener')+'</h3><p class="muted">@'+E(p.handle||'listener')+'</p><p>'+E(p.bio||'')+'</p>'+(mutual.has(id)?'<span class="badge">↔ Mutual connection</span> ':'')+'<a class="btn" href="listener-profile.html?user='+encodeURIComponent(p.handle||id)+'">View Profile</a>'+(kind==='following'?'<button class="btn" data-unfollow="'+E(id)+'">Unfollow</button>':'')+'</article>'}$('fc').textContent=following.length+' following';$('rc').textContent=followers.length+' followers';$('following').innerHTML=following.map(x=>card(x.followed_id,'following')).join('')||'<div class="notice">You are not following anyone yet.</div>';$('followers').innerHTML=followers.map(x=>card(x.follower_id,'follower')).join('')||'<div class="notice">No followers yet.</div>';document.querySelectorAll('[data-unfollow]').forEach(b=>b.onclick=async()=>{await CrowPodcasting.unfollowListener(b.dataset.unfollow);location.reload()})})</script></body></html>
