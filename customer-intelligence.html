</head><body><header class="site-header"><div class="site-header-inner"><a class="brand" href="index.html"><span class="brand-mark">CR</span><span class="brand-text"><span class="brand-name">CROW<span class="glow">RULES</span></span><span class="brand-section">PODCASTING</span></span></a><nav class="main-navigation"><a href="product-intelligence.html">Products</a><a href="product-manager.html">Manage</a></nav></div></header><main class="wrap"><div class="ey">CREATOR STUDIO · MONETIZATION 28.0</div><h1>CUSTOMER <span>INTELLIGENCE.</span></h1><p>Understand subscriber and entitlement activity without exposing customer personal information.</p><section class="kpis"><div class="kpi">ACTIVE CUSTOMERS<strong id="active">0</strong></div><div class="kpi">TOTAL CUSTOMERS<strong id="total">0</strong></div><div class="kpi">NEW · 30 DAYS<strong id="new">0</strong></div><div class="kpi">PAID REVENUE<strong id="rev">$0</strong></div></section><div id="grid" class="grid"><div class="empty">Loading customer intelligence…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>(async()=>{const sb=supabase.createClient(window.CROWRULES_CONFIG.supabaseUrl,window.CROWRULES_CONFIG.supabasePublishableKey),g=document.getElementById("grid");const {data:{user}}=await sb.auth.getUser();if(!user){location.href="login.html?redirect=customer-intelligence.html";return}const {data,error}=await sb.rpc("get_my_podcast_customer_intelligence");if(error){g.innerHTML='<div class=empty>'+error.message+'</div>';return}const rows=data||[];const sum=k=>rows.reduce((a,x)=>a+Number(x[k]||0),0);document.getElementById("active").textContent=sum("active_customers");document.getElementById("total").textContent=sum("total_customers");document.getElementById("new").textContent=sum("new_customers_30d");document.getElementById("rev").textContent="$"+(sum("paid_revenue_cents")/100).toLocaleString("en-US",{minimumFractionDigits:2});g.innerHTML=rows.length?rows.map(x=>'<article class=card><div class=name>'+String(x.product_name).replace(/[<>]/g,"")+'</div><div class=meta>'+x.product_type+' · '+(x.billing_interval||"one-time")+'</div><div class=metric><div>ACTIVE<b>'+x.active_customers+'</b></div><div>TOTAL<b>'+x.total_customers+'</b></div><div>NEW 30D<b>'+x.new_customers_30d+'</b></div><div>CANCELED / EXPIRED<b>'+x.canceled_or_expired+'</b></div><div>PAYING CUSTOMERS<b>'+x.paying_customers+'</b></div><div>REV / CUSTOMER<b>$'+(Number(x.revenue_per_paying_customer_cents||0)/100).toFixed(2)+'</b></div></div></article>').join(""):'<div class=empty>No customer activity yet. Customer intelligence will populate as products gain entitlements and paid transactions.</div>'})();</script></body></html>
