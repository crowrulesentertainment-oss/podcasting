</head><body><main id="main-content" class="x"><section class="hero"><div class="ey">MEMBER LIBRARY</div><h1>Saved Episodes</h1><p>Your personal listening shelf.</p><div class="actions"><a class="btn primary" href="member-hub.html">← Member Hub</a><a class="btn" href="discover.html">Discover</a></div></section><section class="panel"><div id="list" class="grid"><div class="empty">Loading saved episodes…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/member-state.js"></script><script>const client=window.supabaseClient||supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY);async function auth(){const {data,error}=await client.auth.getUser();if(error||!data.user){location.href='login.html?redirect='+encodeURIComponent(location.pathname.split('/').pop());return null}return data.user}function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))};(async()=>{const u=await auth();if(!u)return;const {data,error}=await client.from('podcast_saved_episodes').select('id,created_at,episode_id').eq('user_id',u.id).order('created_at',{ascending:false});const box=document.getElementById('list');if(error||!data?.length){box.innerHTML='<div class="empty">No saved episodes yet. <a href="discover.html" style="color:#39e7ff">Discover something to save →</a></div>';return}const ids=data.map(x=>x.episode_id);const q=await client.from('podcast_episodes').select('id,title,description,duration_seconds,published_at,podcast_id').in('id',ids);box.innerHTML=(q.data||[]).map(e=>'<article class="item"><h2>'+esc(e.title)+'</h2><p>'+esc(e.description||'Saved episode')+'</p><a href="episode.html?id='+encodeURIComponent(e.id)+'">Open Episode →</a></article>').join('')||'<div class="empty">Saved items are currently unavailable.</div>'})()</script></body></html>
