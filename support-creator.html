<body>
<div class="site-background" aria-hidden="true"><div class="background-stars"></div><div class="background-grid"></div><div class="background-glow background-glow-one"></div><div class="background-glow background-glow-two"></div></div>
<header class="site-header"><div class="site-header-inner"><a class="brand" href="index.html"><span class="brand-mark">CR</span><span class="brand-text"><span class="brand-name">CROW<span class="glow">RULES</span></span><span class="brand-section">PODCASTING</span></span></span></a><nav class="main-navigation"><a href="podcasts.html">Podcasts</a><a href="support.html">Support</a><a href="membership.html">Membership</a><a href="profile.html">Profile</a></nav></div></header>
<main><section class="section wrap"><div id="state" class="card">Loading support profile…</div><div id="app" class="hidden"><div class="studioHero"><span id="eyebrow" class="eyebrow"></span><h1 id="title"></h1><p id="intro"></p></div><div id="show" class="card"></div><div><span class="eyebrow">SUPPORT OPTIONS</span><div id="tiers" class="grid"></div></div></div></section></main>
<footer class="site-footer"><div class="site-footer-inner"><div class="footer-brand"><strong>CROWRULES PODCASTING</strong><span>ONE ACCOUNT. ONE UNIVERSE.</span></div><div class="footer-copy">© 2026 CrowRules Entertainment</div></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script>
<script>
(async()=>{
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state=document.getElementById("state"),app=document.getElementById("app"),params=new URLSearchParams(location.search),creatorId=params.get("creator"),podcastId=params.get("podcast");
if(!creatorId&&!podcastId){state.innerHTML='<span class="eyebrow">SUPPORT DIRECTORY</span><h2>Select a creator or podcast first.</h2><a class="btn primary" href="support.html">BROWSE SUPPORT</a>';return;}
try{
const cfg=window.CrowRulesConfig||{};if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw Error("Missing configuration");
const db=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
let q=db.from("creator_support_tiers").select("id,creator_id,podcast_id,tier_name,label,description,benefits,featured,sort_order,stripe_price_id").eq("visibility","public");
if(podcastId)q=q.eq("podcast_id",podcastId);else q=q.eq("creator_id",creatorId);
const result=await q.order("sort_order",{ascending:true,nullsFirst:false});if(result.error)throw result.error;const tiers=result.data||[];
if(!tiers.length){state.innerHTML='<span class="eyebrow">NO PUBLISHED SUPPORT</span><h2>No published support tiers are available here yet.</h2><a class="btn" href="support.html">BACK TO SUPPORT</a>';return;}
const cid=tiers[0].creator_id,c=await db.from("creators").select("id,name,display_name,bio").eq("id",cid).maybeSingle();if(c.error)throw c.error;
let podcast=null;if(podcastId||tiers[0].podcast_id){const p=await db.from("podcasts").select("id,title,description").eq("id",podcastId||tiers[0].podcast_id).maybeSingle();if(p.error)throw p.error;podcast=p.data;}
const creator=c.data||{},name=creator.display_name||creator.name||"CrowRules Creator";
document.getElementById("eyebrow").textContent=podcast?"PODCAST SUPPORT":"CREATOR SUPPORT";
document.getElementById("title").innerHTML='SUPPORT <span class="glow">'+esc(name.toUpperCase())+'</span>';
document.getElementById("intro").textContent=podcast?"Explore support options connected to "+(podcast.title||"this podcast")+".":"Explore this creator's published support options.";
document.getElementById("show").innerHTML=podcast?'<span class="eyebrow">PODCAST</span><h2>'+esc(podcast.title||"Untitled Podcast")+'</h2><p class="muted">'+esc(podcast.description||"")+'</p>':'<span class="eyebrow">CREATOR</span><h2>'+esc(name)+'</h2><p class="muted">'+esc(creator.bio||"")+'</p>';
document.getElementById("tiers").innerHTML=tiers.map(t=>{const b=Array.isArray(t.benefits)?t.benefits:[],ready=!!t.stripe_price_id;return '<article class="card">'+(t.featured?'<span class="eyebrow">FEATURED</span>':'<span class="eyebrow">SUPPORT TIER</span>')+'<h2>'+esc(t.tier_name||"Support")+'</h2>'+(t.label?'<p><strong>'+esc(t.label)+'</strong></p>':'')+'<p class="muted">'+esc(t.description||"")+'</p><ul>'+((b.length?b.map(x=>'<li>'+esc(x)+'</li>').join(""):'<li>Benefits coming soon.</li>'))+'</ul><div class="actions"><a class="btn" href="login.html">SIGN IN</a>'+(ready?'<button class="btn primary" data-support="'+esc(t.id)+'">SUPPORT</button>':'<button class="btn primary" disabled>SUPPORT — COMING SOON</button>')+'</div></article>';}).join("");
document.querySelectorAll("[data-support]").forEach(btn=>btn.addEventListener("click",async()=>{btn.disabled=true;btn.textContent="OPENING CHECKOUT…";try{const {data:{session}}=await db.auth.getSession();if(!session){location.href="login.html?next="+encodeURIComponent(location.href);return;}const response=await fetch(cfg.supabaseUrl+"/functions/v1/podcast-support-checkout",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":cfg.supabaseAnonKey},body:JSON.stringify({tier_id:btn.dataset.support,origin:location.origin+"/podcasting/"})});const data=await response.json();if(!response.ok||!data.url)throw Error(data.error||"Checkout unavailable");location.href=data.url;}catch(e){alert(e.message||"Checkout is unavailable right now.");btn.disabled=false;btn.textContent="SUPPORT";}});
state.classList.add("hidden");app.classList.remove("hidden");
}catch(e){console.error(e);state.innerHTML='<span class="eyebrow">SUPPORT PROFILE UNAVAILABLE</span><h2>Unable to load this support profile.</h2><a class="btn" href="support.html">BACK TO SUPPORT</a>';}
})();
</script></body></html>
