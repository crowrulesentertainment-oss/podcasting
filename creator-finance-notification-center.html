</head><body><main class="wrap"><div class="ey">CROWRULES PODCASTING · FINANCE 29.0</div><h1>NOTIFICATION CENTER <span id="count" class="badge">0 unread</span></h1><div class="bar"><button class="btn active" id="all">ALL</button><button class="btn" id="unread">UNREAD</button><button class="btn" id="readAll">MARK ALL READ</button><a class="btn" href="creator-finance-notification-preferences.html">PREFERENCES</a><a class="btn" href="creator-finance-command-center.html">FINANCE HQ</a></div><section id="list" style="margin-top:20px">Loading…</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script>
<script src="js/platform-data.js"></script><script>(async()=>{const db=window.CrowRulesData.getClient();const {data:{user}}=await window.CrowRulesData.getUser().then(user=>({data:{user}}));if(!user){location.href='login.html?redirect=creator-finance-notification-center.html';return}let only=false;const list=document.getElementById('list'),count=document.getElementById('count');async function load(){const {data,error}=await db.rpc('get_my_podcast_finance_notification_center',{p_limit:100,p_unread_only:only});if(error){list.textContent=error.message;return}const rows=data||[];count.textContent=rows.filter(x=>!x.is_read).length+' unread';list.innerHTML=rows.length?rows.map(x=>'<article class="item '+(!x.is_read?'unread':'')+'"><b>'+x.title+'</b><span class="badge">'+x.alert_type+'</span><div class="msg">'+x.message+'</div><div class="meta">'+new Date(x.created_at).toLocaleString()+(x.threshold_cents!=null?' · '+(x.currency||'').toUpperCase()+' '+(x.threshold_cents/100).toFixed(2):'')+'</div></article>').join(''):'No notifications found.'}document.getElementById('all').onclick=()=>{only=false;load()};document.getElementById('unread').onclick=()=>{only=true;load()};document.getElementById('readAll').onclick=async()=>{await db.rpc('mark_my_podcast_finance_alerts_read');load()};await load();setInterval(load,30000)})()</script></body></html>
