<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Podcasting — Rankings</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/podcasting-platform.css?v=1"><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=5" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script><script src="js/podcasting-config.js?v=1"></script><script src="js/podcasting-platform.js?v=1" defer></script><script src="js/podcasting-player.js?v=1" defer></script></head><body><main class="cr-shell"><section class="hero"><div><div class="eyebrow">CrowRules Podcasting • Network Pulse</div><h1>THE RANKINGS</h1><p>Discover the podcasts moving the network right now. Rankings can evolve by total listening, follower growth, episode performance and completion.</p></div><div class="hero-orb"><div class="orb-text">LIVE<br><span style="color:var(--cyan)">SIGNAL</span></div></div></section><section class="card panel"><div class="form-grid"><div class="field"><label>Ranking</label><select id="mode"><option value="score">Network Score</option><option value="listens">Most Listened</option><option value="followers">Most Followed</option><option value="plays">Episode Performance</option></select></div><div class="field"><label>Search</label><input id="search" placeholder="Find a podcast…"></div></div><div id="rankings">Loading rankings…</div></section></main><script>document.addEventListener('crow:ready',async()=>{let rows=await CrowPodcasting.rows('podcast_rankings_live','ranking,podcast_id,podcast_title,slug,artwork_url,author_name,category,followers,listens,episode_plays,ranking_score',{limit:100});const esc=CrowPodcasting.esc;function render(){const q=document.querySelector('#search').value.toLowerCase(),m=document.querySelector('#mode').value;let a=rows.filter(r=>!q||[r.podcast_title,r.author_name,r.category].some(v=>String(v||'').toLowerCase().includes(q)));a.sort((x,y)=>m==='listens'?Number(y.listens||0)-Number(x.listens||0):m==='followers'?Number(y.followers||0)-Number(x.followers||0):m==='plays'?Number(y.episode_plays||0)-Number(x.episode_plays||0):Number(y.ranking_score||0)-Number(x.ranking_score||0));document.querySelector('#rankings').innerHTML=a.length?a.map((r,i)=>'<div class="rank-row"><div class="rank">#'+(i+1)+'</div><div><b>'+esc(r.podcast_title||'Untitled')+'</b><div class="muted">'+esc(r.author_name||'CrowRules Creator')+' • '+esc(r.category||'Podcast')+'</div></div><div>'+CrowPodcasting.fmt(r.listens)+' listens</div><div>'+CrowPodcasting.fmt(r.followers)+' followers</div></div>').join(''):'<div class="notice">No ranking matches yet.</div>'}['mode','search'].forEach(id=>document.querySelector('#'+id).oninput=render);render()})</script></body></html>
