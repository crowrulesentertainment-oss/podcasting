<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcasting Rankings</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script></head><body><div id="cr-app" data-cr-shell="crowrules-podcasting-sitewide-v7"></div><main class="page"><span class="eyebrow">LIVE PERFORMANCE BOARD</span><h1 class="dash-title">Rankings</h1><div class="panel" id="list">Loading…</div></main><script>addEventListener('load',async()=>{const{data,error}=await CROW_PODCASTING.from('crp_podcast_rankings').select('*').order('score',{ascending:false}).limit(50);list.innerHTML=error?'<p class="status">'+error.message+'</p>':(data||[]).map((p,i)=>'<div class="rank-row"><div class="rank">#'+(i+1)+'</div><div><div class="rank-title">'+(p.title||'Untitled')+'</div><div class="meta">'+Number(p.plays||0).toLocaleString()+' PLAYS • '+Number(p.follows||0).toLocaleString()+' FOLLOWS</div></div><div class="rank-score">'+Number(p.score||0).toLocaleString()+'</div></div>').join('')||'<p class="status">Rankings will appear as activity builds.</p>'})</script><div id="cr-player" data-cr-player="crowrules-podcasting-sitewide-v7"></div></body></html>
