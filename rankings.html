<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Podcasting — Rankings</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/podcasting-platform.css?v=1"><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=5" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script><script src="js/podcasting-config.js?v=1"></script><script src="js/podcasting-platform.js?v=1" defer></script><script src="js/podcasting-player.js?v=1" defer></script></head><body><main class="cr-shell"><section class="hero"><div><div class="eyebrow">CrowRules Podcasting • Network Pulse</div><h1>THE RANKINGS</h1><p>Discover the podcasts moving the network right now. Rankings can evolve by total listening, follower growth, episode performance and completion.</p></div><div class="hero-orb"><div class="orb-text">LIVE<br><span style="color:var(--cyan)">SIGNAL</span></div></div></section><section class="card panel"><div id="rankings">Loading rankings…</div></section></main><script>document.addEventListener('crow:ready',async()=>{const rows=await CrowPodcasting.rows('podcast_rankings_live','ranking,podcast_id,podcast_title,slug,artwork_url,author_name,category,followers,listens,episode_plays,ranking_score',{order:'ranking',ascending:true,limit:50});document.querySelector('#rankings').innerHTML=rows.length?rows.map((r,i)=>'<div class="rank-row"><div class="rank">#'+(r.ranking||i+1)+'</div><div><b>'+CrowPodcasting.esc(r.podcast_title||'Untitled')+'</b><div class="muted">'+CrowPodcasting.esc(r.author_name||'CrowRules Creator')+' • '+CrowPodcasting.esc(r.category||'Podcast')+'</div></div><div>'+CrowPodcasting.fmt(r.listens)+' listens</div><div>'+CrowPodcasting.fmt(r.followers)+' followers</div></div>').join(''):'<div class="notice">Rankings are warming up. Publish podcasts and start listening to generate the network chart.</div>'})</script></body></html>
