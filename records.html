<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcasting Record Book</title><link rel="stylesheet" href="css/podcasting.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js" defer></script><script src="js/podcasting.js" defer></script><link rel="stylesheet" href="css/podcasting-v8.css?v=20261007-v8.0.0"><script src="js/podcasting-v8.js?v=20261007-v8.0.0" defer></script></head><body><div id="cr-app" data-cr-shell="crowrules-podcasting-sitewide-v7"></div><main class="page"><span class="eyebrow">HISTORY & ACHIEVEMENTS</span><h1 class="dash-title">Record Book</h1><div id="records" class="record-grid"></div></main><script>addEventListener('load',async()=>{const{data,error}=await CROW_PODCASTING.from('crp_record_book').select('*').eq('is_published',true).order('metric_value',{ascending:false});records.innerHTML=error?'<div class="panel">'+error.message+'</div>':(data||[]).map(r=>'<article class="record-card"><strong>'+r.metric_value+'</strong><span>'+r.title+'</span><p>'+String(r.description||'')+'</p><div class="meta">'+String(r.metric_label||'')+'</div></article>').join('')||'<div class="panel">No official records yet.</div>'})</script><div id="cr-player" data-cr-player="crowrules-podcasting-sitewide-v7"></div></body></html>
