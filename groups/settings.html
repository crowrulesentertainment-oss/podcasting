<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group Settings | CrowRules Groups</title><link rel="stylesheet" href="../assets/css/groups-pages.css"><script type="module" src="../assets/js/groups-pages.js"></script></head><body data-groups-page="settings"><header class="gp-header"><a class="gp-brand" href="index.html">CROWRULES <b>GROUPS</b></a><nav><a href="discover.html">Discover</a><a href="my-groups.html">My Groups</a><a href="feed.html">Feed</a></nav></header><main class="gp-main gp-form-main"><span class="gp-kicker">COMMUNITY MANAGEMENT</span><h1>Group Settings</h1><p class="gp-lead">Manage the community you own. Only the group owner and authorized moderators can make permitted changes.</p><div id="gp-status" class="gp-status" aria-live="polite">Checking group permissions…</div><form id="gp-settings-form" class="gp-form" hidden><label>Group name<input name="name" required minlength="3" maxlength="90"></label><label>Category<select name="category"><option>Podcasting & Creators</option><option>Business & Entrepreneurship</option><option>Sports & Entertainment</option><option>Local Communities</option><option>Hobbies & Lifestyle</option><option>Social & General</option></select></label><label>Description<textarea name="description" maxlength="600"></textarea></label><label>Community rules<textarea name="community_rules" maxlength="3000"></textarea></label><label>Visibility<select name="visibility"><option value="public">Public</option><option value="private">Private — approval required</option><option value="hidden">Hidden — invitation only</option></select></label><label>Cover image URL<input name="cover_image_url" type="url"></label><label class="gp-check"><input name="group_chat_enabled" type="checkbox"> Enable member group chat (when supported by the installed database migration)</label><button class="gp-button" type="submit">Save settings</button></form></main><footer class="gp-footer"><span>© CrowRules Entertainment</span><a href="my-groups.html">My groups</a></footer></body></html>
