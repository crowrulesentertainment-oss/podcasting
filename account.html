<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">ONE ACCOUNT. ONE UNIVERSE.</div><h1>Your <span class="gradient">account.</span></h1><div class="grid two"><section class="card"><h3>Sign in</h3><form id="login" class="form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn primary">Sign in</button></form></section><section class="card"><h3>Create account</h3><form id="signup" class="form"><label>Email<input id="se" type="email" required></label><label>Password<input id="sp" type="password" minlength="8" required></label><button class="btn">Create account</button></form></section></div><div id="status" class="notice" style="margin-top:18px">Configure the Supabase publishable key to activate authentication.</div></main><script>addEventListener("crow:ready",function(){if(!window.CROW_SUPABASE)return;status.textContent="Supabase authentication is connected.";login.onsubmit=async function(e){e.preventDefault();var r=await CROW_SUPABASE.auth.signInWithPassword({email:email.value,password:password.value});status.textContent=r.error?r.error.message:"Signed in.";if(!r.error)location.href="home.html"};signup.onsubmit=async function(e){e.preventDefault();var r=await CROW_SUPABASE.auth.signUp({email:se.value,password:sp.value});status.textContent=r.error?r.error.message:"Account created. Check your email if confirmation is enabled."}});</script></body></html>
