<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal Account — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=1" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=1" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
</head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">UNIVERSAL CROWRULES ACCOUNT</div><h1>One account.<br><span class="gradient">One universe.</span></h1><div id="member" class="card"><div id="state" class="notice">Loading account…</div></div><div class="grid two" style="margin-top:18px"><section class="card"><h3>Sign in</h3><form id="login" class="form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn primary">Sign in</button></form>
<div style="margin:14px 0 8px;text-align:center;color:#707b91;font-size:10px;letter-spacing:.12em">OR CONTINUE WITH</div>
<div class="actions" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
<button type="button" class="btn" data-social="google">Google</button>
<button type="button" class="btn" data-social="discord">Discord</button>
<button type="button" class="btn" data-social="twitch">Twitch</button>
</div></section><section class="card"><h3>Create account</h3><form id="signup" class="form"><label>Email<input id="se" type="email" required></label><label>Password<input id="sp" type="password" minlength="8" required></label><button class="btn">Create account</button></form>
<div style="margin:14px 0 8px;text-align:center;color:#707b91;font-size:10px;letter-spacing:.12em">OR SIGN UP WITH</div>
<div class="actions" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
<button type="button" class="btn" data-social="google">Google</button>
<button type="button" class="btn" data-social="discord">Discord</button>
<button type="button" class="btn" data-social="twitch">Twitch</button>
</div>
</section></div></main><script>addEventListener("crow:ready",async()=>{
if(__CROW_USER){state.innerHTML="Signed in as <strong>"+(__CROW_USER.email||"Member")+"</strong><div class='actions'><button class='btn' onclick='CROW_APP.signOut()'>Sign out</button></div>";return}
state.textContent="Sign in or create your Universal CrowRules account.";
login.onsubmit=async e=>{e.preventDefault();const r=await CROW_SUPABASE.auth.signInWithPassword({email:email.value,password:password.value});state.textContent=r.error?r.error.message:"Signed in.";if(!r.error)location.reload()};
signup.onsubmit=async e=>{e.preventDefault();const r=await CROW_SUPABASE.auth.signUp({email:se.value,password:sp.value,options:{data:{app:"podcasting",account_type:"creator"}}});if(r.error){state.textContent=r.error.message;return}if(r.data?.session){state.textContent="Account created. Opening CrowRules Podcasting…";location.href="home.html";}else{state.innerHTML="Account created. If email confirmation is enabled, finish that step and then return here to enter the site.<div class="actions"><a class="btn primary" href="home.html">Enter Podcasting</a></div>";}};
document.querySelectorAll("[data-social]").forEach(btn=>btn.addEventListener("click",async()=>{
 const provider=btn.dataset.social; btn.disabled=true; state.textContent="Connecting to "+provider.charAt(0).toUpperCase()+provider.slice(1)+"…";
 const {error}=await CROW_SUPABASE.auth.signInWithOAuth({provider,options:{redirectTo:new URL("account.html?oauth=1",location.href).href}});
 if(error){state.textContent=error.message;btn.disabled=false}});
}));
});</script></body></html>
