<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal Account — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">UNIVERSAL CROWRULES ACCOUNT</div><h1>One account.<br><span class="gradient">One universe.</span></h1><div id="member" class="card"><div id="state" class="notice">Loading account…</div></div><div class="grid two" style="margin-top:18px"><section class="card"><h3>Sign in</h3><form id="login" class="form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn primary">Sign in</button></form><button class="btn" style="margin-top:12px" onclick="CROW_APP.google()">Continue with Google</button></section><section class="card"><h3>Create account</h3><form id="signup" class="form"><label>Email<input id="se" type="email" required></label><label>Password<input id="sp" type="password" minlength="8" required></label><button class="btn">Create account</button></form></section></div></main><script>addEventListener("crow:ready",async()=>{if(__CROW_USER){state.innerHTML="Signed in as <strong>"+(__CROW_USER.email||"Member")+"</strong><div class='actions'><button class='btn' onclick='CROW_APP.signOut()'>Sign out</button></div>";return}state.textContent="Sign in or create your Universal CrowRules account.";login.onsubmit=async e=>{e.preventDefault();const r=await CROW_SUPABASE.auth.signInWithPassword({email:email.value,password:password.value});state.textContent=r.error?r.error.message:"Signed in.";if(!r.error)location.reload()};signup.onsubmit=async e=>{e.preventDefault();const r=await CROW_SUPABASE.auth.signUp({email:se.value,password:sp.value});state.textContent=r.error?r.error.message:"Account created. Check your email if confirmation is enabled.";}});</script></body></html>
