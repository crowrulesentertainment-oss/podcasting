<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance Case Detail | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>:root{--bg:#05050b;--line:rgba(255,255,255,.1);--cyan:#55e7ff;--muted:#9ba3bb}body{margin:0;background:radial-gradient(circle at 20% 0%,rgba(85,231,255,.12),transparent 32%),var(--bg);color:#fff;font-family:Montserrat,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:44px 18px 80px}.ey{font:800 10px Orbitron;letter-spacing:.18em;color:var(--cyan)}h1,h2{font-family:Orbitron}.sub,.muted{color:var(--muted);line-height:1.6}.card{border:1px solid var(--line);border-radius:18px;background:rgba(10,11,21,.9);padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.label{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.value{font:800 24px Orbitron;margin-top:8px}.row{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}.error{color:#ff9b9b}.links{margin-top:20px}.links a{color:#fff;margin-right:12px}</style></head><body><header class="site-header"><div class="site-header-inner"><a class="brand" href="creator-dashboard.html"><span class="brand-mark">CR</span><span class="brand-text"><span class="brand-name">CROW<span class="glow">RULES</span></span><span class="brand-section">PODCASTING</span></span></a></div></header><main class="wrap"><div class="ey">FINANCE CASE · 53.0</div><h1>CASE <span style="color:var(--cyan)">DETAIL</span></h1><p class="sub">One auditable view connecting the case, transaction, adjustment ledger and resolution history.</p><div id="app" class="card">Loading…</div><div class="links"><a href="creator-finance-command-center.html">← Finance HQ</a><a href="creator-transaction-earnings.html">Transactions</a><a href="creator-finance-reconciliation.html">Reconciliation</a></div><section class="card"><div class="ey">CASE MANAGEMENT</div><h2>Update Status</h2><p class="muted">Status changes are recorded in the case audit history.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button data-status="open">OPEN</button><button data-status="investigating">INVESTIGATING</button><button data-status="resolved">RESOLVE</button></div><textarea id="caseNote" placeholder="Optional case note" style="width:100%;min-height:90px;margin-top:14px;background:#080912;color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;box-sizing:border-box"></textarea><p id="caseMsg" class="muted"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>(async()=>{const db=supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabasePublishableKey),el=document.getElementById('app'),id=new URLSearchParams(location.search).get('id');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=(n,c)=>((Number(n||0)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' '+String(c||'usd').toUpperCase());if(!id){el.innerHTML='<div class="error">Missing case ID.</div>';return}const {data,error}=await db.rpc('get_my_podcast_finance_case_detail',{p_case_id:id});if(error||!data){el.innerHTML='<div class="error">'+esc(error?.message||'Case not found.')+'</div>';return}const f=data.case||{},t=data.transaction||{},a=data.adjustments||[],e=data.events||[];el.innerHTML='<div class="grid"><div><div class="label">Status</div><div class="value">'+esc(f.status)+'</div></div><div><div class="label">Type</div><div class="value">'+esc(f.case_type)+'</div></div><div><div class="label">Amount</div><div class="value">'+money(f.amount_cents,f.currency)+'</div></div><div><div class="label">Created</div><div class="value">'+new Date(f.created_at).toLocaleDateString()+'</div></div></div><div class="card"><div class="ey">CASE</div><h2>'+esc(f.title)+'</h2><p class="muted">'+esc(f.description||'')+'</p><p class="muted">Resolution: '+esc(f.resolution_notes||'Not resolved')+'</p></div><div class="card"><div class="ey">TRANSACTION</div><div class="grid"><div><div class="label">Transaction</div><div class="muted">'+esc(t.id||'—')+'</div></div><div><div class="label">Gross</div><div class="value">'+money(t.gross_cents,t.currency)+'</div></div><div><div class="label">Creator Net</div><div class="value">'+money(t.creator_net_cents,t.currency)+'</div></div><div><div class="label">Status</div><div class="value">'+esc(t.status||'—')+'</div></div></div></div><div class="card"><div class="ey">ADJUSTMENT LEDGER</div>'+ (a.length?a.map(x=>'<div class="row"><span>'+esc(x.adjustment_type)+'<br><small class="muted">'+esc(x.reason||'')+'</small></span><strong>'+money(x.amount_cents,x.currency)+'</strong></div>').join(''):'<p class="muted">No linked adjustments.</p>')+'</div><div class="card"><div class="ey">CASE HISTORY</div>'+ (e.length?e.map(x=>'<div class="row"><span><b>'+esc(x.event_type)+'</b><br><small class="muted">'+esc(x.note||'')+'</small></span><small class="muted">'+new Date(x.created_at).toLocaleString()+'</small></div>').join(''):'<p class="muted">No case events.</p>')+'</div>'})()</script></body></html><script>(async()=>{const buttons=[...document.querySelectorAll('[data-status]')],msg=document.getElementById('caseMsg'),note=document.getElementById('caseNote');if(!buttons.length)return;buttons.forEach(b=>b.onclick=async()=>{if(b.dataset.status==='resolved'&&!confirm('Resolve this finance case? The resolution will be recorded in the audit history.'))return;msg.textContent='Saving…';const {error}=await db.rpc('update_my_podcast_finance_case_status',{p_case_id:id,p_status:b.dataset.status,p_note:note.value||null});if(error){msg.textContent=error.message;return}msg.textContent='Saved. Refreshing case history…';setTimeout(()=>location.reload(),400)})})()</script>
