<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Podcasting — Creators</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/podcasting-platform.css?v=1"><script src="js/podcasting-config.js?v=1"></script><script src="js/podcasting-platform.js?v=1" defer></script><script src="js/podcasting-player.js?v=1" defer></script></head><body><main class="cr-shell"><section class="hero"><div><div class="eyebrow">The Creator Network</div><h1>MEET THE VOICES</h1><p>Hosts, producers, commentators and storytellers building the next chapter of CrowRules Podcasting.</p></div><div class="hero-orb"><div class="orb-text">CREATOR<br><span style="color:var(--purple)">NETWORK</span></div></div></section><section class="section"><div id="creators" class="grid">Loading creators…</div></section></main><script>document.addEventListener('crow:ready',async()=>{const rows=await CrowPodcasting.rows('podcasting_creator_directory','id,name,slug,role,discipline,bio,avatar_url,is_active',{eq:{is_active:true},order:'name',limit:60});document.querySelector('#creators').innerHTML=rows.length?rows.map(c=>'<article class="card panel"><div style="display:flex;gap:14px;align-items:center"><img src="'+CrowPodcasting.esc(c.avatar_url||'')+'" style="width:64px;height:64px;border-radius:50%;object-fit:cover;background:#111827"><div><h3 style="margin:0;font:700 15px Orbitron">'+CrowPodcasting.esc(c.name||'Creator')+'</h3><div class="muted">'+CrowPodcasting.esc(c.role||c.discipline||'Podcast Creator')+'</div></div></div><p class="muted">'+CrowPodcasting.esc(c.bio||'Independent creator on CrowRules Podcasting.')+'</p></article>').join(''):'<div class="card panel">Creator profiles will appear here as shows launch.</div>'})</script></body></html>
