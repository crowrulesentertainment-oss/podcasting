<script>const out=document.getElementById("grid"),esc=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));(async()=>{try{const db=supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabaseAnonKey);const r=await db.from("creator_profiles").select("id,display_name,bio,avatar_url").limit(60);if(r.error)throw r.error;out.innerHTML=(r.data||[]).map(c=>'<article class="card"><h2>'+esc(c.display_name||"CrowRules Creator")+'</h2><p>'+esc(c.bio||"Creator in the CrowRules Podcasting universe.")+'</p></article>').join("")||'<div class="status">No public creators yet.</div>'}catch(e){out.innerHTML='<div class="status">Creator directory is temporarily unavailable.</div>'}})()</script></body></html>
