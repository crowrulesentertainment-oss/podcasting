<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>Content Performance | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>
(()=>{const $=x=>document.getElementById(x),db=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));function notice(m){$("notice").innerHTML='<div class="panel">'+esc(m)+'</div>'}
async function boot(){try{const id=new URLSearchParams(location.search).get("id");if(!id){location.href="podcast-manager.html";return}$("back").href="podcast-lifecycle.html?id="+encodeURIComponent(id);const u=await db.auth.getUser();if(!u.data.user){location.href="login.html?redirect="+encodeURIComponent("podcast-performance.html?id="+id);return}const m=await db.from("members").select("id").eq("user_id",u.data.user.id).maybeSingle();if(!m.data)throw Error("No CrowRules membership profile found.");const c=await db.from("creators").select("id").eq("member_id",m.data.id).eq("is_active",true).maybeSingle();if(!c.data)throw Error("No active creator profile found.");const p=await db.from("podcasts").select("id,title,description").eq("id",id).eq("creator_id",c.data.id).maybeSingle();if(!p.data)throw Error("Podcast not found or you do not own it.");const q=await db.rpc("get_podcast_content_performance",{p_podcast_id:id});if(q.error)throw q.error;const rows=q.data||[],fmt=n=>Number(n||0).toLocaleString(),avg=a=>a.length?a.reduce((x,r)=>x+Number(r),0)/a.length:0,scoreAvg=avg(rows.map(x=>x.engagement_score)),compAvg=avg(rows.map(x=>x.avg_completion)),disc=rows.reduce((a,x)=>a+Number(x.discovery_entries||0),0),trans=rows.reduce((a,x)=>a+Number(x.next_transitions||0),0),plays=rows.reduce((a,x)=>a+Number(x.plays||0),0);
$("hero").innerHTML='<div class="ey">Content Performance Intelligence</div><h1>'+esc(p.data.title)+'</h1><p class="desc">'+esc(p.data.description||"A unified view of discovery, listening depth, completion, and catalog movement.")+'</p><div class="callout">The engagement score is a transparent composite of observed plays-per-listener, completion/progress, and next-episode movement. It is an analytics aid—not a prediction, recommendation, or permanent quality label.</div>';
$("stats").innerHTML='<div class="stat"><div class="label">Published Episodes</div><div class="value">'+fmt(rows.length)+'</div></div><div class="stat"><div class="label">Listen Events</div><div class="value">'+fmt(plays)+'</div></div><div class="stat"><div class="label">Discovery Entries</div><div class="value">'+fmt(disc)+'</div></div><div class="stat"><div class="label">Avg Progress</div><div class="value">'+compAvg.toFixed(1)+'%</div></div>';
const max=Math.max(1,...rows.map(x=>Number(x.engagement_score||0)));const list=rows.map((x,i)=>'<div class="item"><div class="row"><div><b>'+String(i+1).padStart(2,"0")+' · '+esc(x.title||"Untitled episode")+'</b><div class="muted">'+Number(x.age_days||0).toFixed(0)+' days old · '+(x.published_at?new Date(x.published_at).toLocaleDateString():"")+'</div></div><span class="badge">'+Number(x.engagement_score||0).toFixed(1)+' signal</span></div><div class="bar"><i style="width:'+Math.min(100,Number(x.engagement_score)/max*100)+'%"></i></div><div class="muted">'+fmt(x.plays)+' listens · '+fmt(x.listeners)+' listeners · '+Number(x.plays_per_listener||0).toFixed(2)+' plays/listener · '+Number(x.avg_completion||0).toFixed(1)+'% avg progress · '+Number(x.completion_rate||0).toFixed(1)+'% completed · '+fmt(x.discovery_entries)+' entries · '+fmt(x.next_transitions)+' next-episode transitions</div></div>').join("")||'<div class="muted">No published episode listening data yet.</div>';
$("content").innerHTML='<div class="ey">Episode Signal Board</div><h2>Observed performance across the catalog</h2><p class="muted">Episodes are displayed by the composite signal returned from the analytics function. Individual metrics remain visible so creators can inspect the underlying behavior.</p>'+list+'<div class="callout"><b>Catalog averages:</b> '+scoreAvg.toFixed(1)+' composite signal · '+compAvg.toFixed(1)+'% average progress · '+fmt(trans)+' observed next-episode transitions. Use the underlying metrics—not the composite alone—to understand what is happening.</div><div class="actions"><a class="btn" href="podcast-lifecycle.html?id='+encodeURIComponent(id)+'">Episode Lifecycle</a><a class="btn" href="podcast-binge.html?id='+encodeURIComponent(id)+'">Binge Intelligence</a><a class="btn" href="podcast-journey.html?id='+encodeURIComponent(id)+'">Listener Journey</a><a class="btn" href="podcast-retention.html?id='+encodeURIComponent(id)+'">Retention</a><a class="btn" href="podcast-dashboard.html?id='+encodeURIComponent(id)+'">Dashboard</a></div>';
$("hero").hidden=$("stats").hidden=$("content").hidden=false}catch(e){notice(e.message||"Unable to load content performance intelligence.")}}boot()})();
