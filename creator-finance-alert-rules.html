<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance Alert Rules | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>body{background:#05050b;color:#fff;font-family:Montserrat,system-ui}.wrap{max-width:900px;margin:auto;padding:40px 18px}.ey{font:800 11px Orbitron;letter-spacing:.2em;color:#55e7ff}h1{font:800 42px Orbitron}.card{padding:20px;margin:18px 0;border:1px solid #ffffff14;border-radius:16px;background:#0b0d17}input,select{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 12px;background:#111421;color:#fff;border:1px solid #ffffff20;border-radius:9px}button{padding:11px 15px;border:1px solid #55e7ff55;background:#111421;color:#fff;border-radius:9px;cursor:pointer}.rule{padding:14px 0;border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between;gap:15px}.muted{opacity:.6;font-size:12px}</style></head><body><main class="wrap"><div class="ey">CROWRULES PODCASTING · FINANCE 30.0</div><h1>SMART ALERT <span>RULES</span></h1><p class="muted">Create thresholds that turn important financial milestones into creator notifications.</p><section class="card"><input id="name" placeholder="Rule name"><select id="type"><option value="payment_milestone">Payment milestone</option><option value="revenue_milestone">Revenue milestone</option><option value="payout_milestone">Payout milestone</option></select><input id="amount" type="number" min="1" step=".01" placeholder="Threshold amount (USD)"><label><input id="repeat" type="checkbox" style="width:auto"> Repeat when threshold is reached again</label><br><button id="add">CREATE RULE</button><div id="status" class="muted"></div></section><section class="card"><h2>YOUR RULES</h2><div id="rules">Loading…</div></section><section class="card"><h2>TRIGGER HISTORY</h2><div id="history">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>(async()=>{const db=supabase.createClient(CROWRULES_CONFIG.supabaseUrl,CROWRULES_CONFIG.supabasePublishableKey);const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html?redirect=creator-finance-alert-rules.html';return}const rules=document.getElementById('rules');async function load(){const {data,error}=await db.rpc('get_my_podcast_finance_alert_rules');if(error){rules.textContent=error.message;return}rules.innerHTML=(data||[]).map(r=>'<div class="rule"><div><b>'+r.rule_name+'</b><div class="muted">'+r.rule_type.replaceAll('_',' ')+' · '+r.currency.toUpperCase()+' '+(r.threshold_cents/100).toFixed(2)+(r.repeatable?' · repeatable':'')+'</div></div><div class="muted">'+(r.enabled?'ACTIVE':'OFF')+'</div></div>').join('')||'No alert rules yet.'}document.getElementById('add').onclick=async()=>{const status=document.getElementById('status');const amount=Number(document.getElementById('amount').value);const {error}=await db.rpc('create_my_podcast_finance_alert_rule',{p_rule_name:document.getElementById('name').value,p_rule_type:document.getElementById('type').value,p_threshold_cents:Math.round(amount*100),p_currency:'usd',p_repeatable:document.getElementById('repeat').checked});status.textContent=error?error.message:'Rule created.';if(!error)load()};load();async function history(){const {data,error}=await db.from('cr_podcast_finance_alert_rule_triggers').select('*').order('triggered_at',{ascending:false}).limit(50);document.getElementById('history').innerHTML=error?error.message:(data||[]).map(x=>'<div class="rule"><div><b>'+x.event_type+'</b><div class="muted">Threshold '+x.currency.toUpperCase()+' '+(x.threshold_cents/100).toFixed(2)+' · Actual '+(x.actual_cents/100).toFixed(2)+'</div></div><div class="muted">'+new Date(x.triggered_at).toLocaleString()+'</div></div>').join('')||'No rules triggered yet.'}history()})()</script></body></html>
