<style>:root{--c:#00e5ff;--v:#8b5cf6;--m:#9da5bd;--l:rgba(255,255,255,.1)}body{background:radial-gradient(circle at 15% 0%,#00e5ff18,transparent 32%),radial-gradient(circle at 85% 0%,#8b5cf625,transparent 35%),#030308}.shell{width:min(760px,94%);margin:auto;padding:70px 0 110px}.card{padding:34px;border:1px solid var(--l);border-radius:28px;background:linear-gradient(145deg,#0a0a16f5,#23113ae0);text-align:center}.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:2px solid #00e5ff66;background:#10101a;display:block;margin:0 auto 20px}.avatar.fallback{display:grid;place-items:center;font:900 38px Orbitron;color:var(--c)}.eyebrow{font:900 .7rem Orbitron;color:var(--c);letter-spacing:.16em}.name{font:900 clamp(2rem,6vw,3.5rem) Orbitron;margin:12px 0}.handle,.bio{color:var(--m)}.bio{line-height:1.7;max-width:600px;margin:18px auto}.badge{display:inline-block;padding:7px 12px;border:1px solid var(--l);border-radius:999px;color:#fff;background:#ffffff0a;font-size:.75rem;font-weight:800}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:25px}.btn{border:1px solid var(--l);border-radius:10px;background:#10101a;color:#fff;padding:11px 15px;font-weight:800;text-decoration:none}.primary{background:linear-gradient(90deg,var(--c),var(--v));color:#030308}.empty{padding:40px;color:var(--m);text-align:center}.member-stats{display:flex;justify-content:center;gap:28px;margin:18px 0;color:var(--m);font-size:.75rem;flex-wrap:wrap}.member-stats b{display:block;font:900 18px Orbitron;color:#fff}.network-list{margin-top:22px;text-align:left}.network-list h2{font:900 13px Orbitron;color:var(--c);letter-spacing:.08em}.network-grid{display:grid;gap:8px;margin-top:10px}.network-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--l);border-radius:12px;background:#ffffff05}.network-row img,.network-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover}.network-avatar{display:grid;place-items:center;background:#10101a;color:var(--c);font:800 14px Orbitron}.network-row a{color:#fff;text-decoration:none;font-weight:800}.follow-status{margin-top:16px;color:var(--m);font-size:.85rem}.btn[disabled]{opacity:.55;cursor:not-allowed}.activity{margin-top:22px;text-align:left}.activity h2{font:900 14px Orbitron;color:var(--c);letter-spacing:.08em}.activity-grid{display:grid;gap:10px;margin-top:12px}.activity-card{padding:14px;border:1px solid var(--l);border-radius:15px;background:#ffffff05}.activity-card a{color:#fff;text-decoration:none;font-weight:800}.activity-meta{color:var(--m);font-size:11px;margin-top:5px}.timeline{display:grid;gap:10px;margin-top:12px}.timeline-item{padding:14px;border:1px solid var(--l);border-radius:15px;background:#ffffff05}.timeline-item .type{font:900 9px Orbitron;color:var(--c);letter-spacing:.1em}.timeline-item .when{color:var(--m);font-size:11px;margin-top:6px}.timeline-item a{color:#fff;text-decoration:none;font-weight:800}.show-art{width:46px;height:46px;border-radius:10px;object-fit:cover;float:left;margin-right:12px}.edit-panel{margin-top:24px;text-align:left;border-top:1px solid var(--l);padding-top:24px}.field{margin:12px 0}.field label{display:block;color:var(--m);font-size:11px;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid var(--l);background:#080812;color:#fff;font:inherit}.field textarea{min-height:110px;resize:vertical}.check{display:flex;gap:9px;align-items:center;color:var(--m);font-size:12px}.save-msg{margin-top:10px;color:var(--m);font-size:12px}.upload-row{display:flex;gap:8px;align-items:center}.upload-row input{flex:1}.avatar-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid var(--l);margin:8px 0}</style></head>

<script>(async()=>{const el=document.getElementById("profile"),sb=await loadSupabase(),params=new URLSearchParams(location.search),id=params.get("user"),usernameParam=(params.get("username")||"").trim().toLowerCase();const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));if(!id&&usernameParam){const ur=await sb.from("podcast_member_profiles").select("user_id").eq("username",usernameParam).maybeSingle();if(!ur.error&&ur.data)location.replace("member-profile.html?user="+encodeURIComponent(ur.data.user_id));else{el.innerHTML='<div class="empty">Member not found.</div>';return}}if(!id){el.innerHTML='<div class="empty">No member was specified.</div>';return}const me=(await sb.auth.getUser()).data.user;const r=await sb.from("podcast_member_profiles").select("user_id,display_name,username,bio,avatar_url,badge,is_public,activity_public,network_public,followers_public,following_public").eq("user_id",id).maybeSingle();if(r.error||!r.data||(!r.data.is_public&&(!me||me.id!==id))){el.innerHTML='<div class="empty">This member profile is not publicly available.</div>';return}const p=r.data,name=p.display_name||p.username||"CrowRules Member",fc=await sb.from("podcast_member_follows").select("id",{count:"exact",head:true}).eq("followed_user_id",id),fg=await sb.from("podcast_member_follows").select("id",{count:"exact",head:true}).eq("follower_user_id",id),followers=fc.count||0,followingCount=fg.count||0,initial=(name.trim()[0]||"C").toUpperCase();let following=false,mutual=false;if(me&&me.id!==id){const [fq,mq]=await Promise.all([sb.from("podcast_member_follows").select("id").eq("follower_user_id",me.id).eq("followed_user_id",id).maybeSingle(),sb.from("podcast_member_follows").select("id").eq("follower_user_id",id).eq("followed_user_id",me.id).maybeSingle()]);following=!!fq.data;mutual=!!mq.data}const avatar=p.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'" alt="'+esc(name)+'">':'<div class="avatar fallback">'+esc(initial)+'</div>';const showNetwork=p.network_public!==false||!!(me&&me.id===id);const followButton=me&&me.id!==id?'<button id="followBtn" class="btn primary">'+(following?"Following":"Follow Member")+'</button>':"";el.innerHTML=avatar+'<div class="eyebrow">CROWRULES MEMBER</div><div class="member-stats">'+(showNetwork?'<span><b>'+followers+'</b> Followers</span><span><b>'+followingCount+'</b> Following</span>':"")+(showNetwork&&mutual?'<span><b>↔</b> Mutual</span>':"")+'</div><h1 class="name">'+esc(name)+'</h1>'+(p.username?'<div class="handle"><a style="color:var(--m);text-decoration:none" href="member-profile.html?username='+encodeURIComponent(p.username)+'">@'+esc(p.username)+'</a></div>':"")+(p.badge?'<div style="margin-top:14px"><span class="badge">'+esc(p.badge)+'</span></div>':"")+(p.bio?'<p class="bio">'+esc(p.bio)+'</p>':"")+'<div class="actions">'+followButton+'<a class="btn" href="member-activity.html">Member Network</a><a class="btn" href="index.html">Podcasting Home</a><a class="btn" href="notifications.html">Notifications</a></div><button id="shareProfile" class="btn" type="button" style="margin-top:12px">SHARE PROFILE</button><button id="blockMember" class="btn" type="button" style="margin-top:12px;margin-left:6px">BLOCK MEMBER</button><button id="reportMember" class="btn" type="button" style="margin-top:12px;margin-left:6px">REPORT MEMBER</button><div id="followStatus" class="follow-status">'+(mutual?"↔ You and this member follow each other.":"")+'</div><div class="network-list"><input id="networkSearch" placeholder="SEARCH THIS MEMBER NETWORK..." style="width:100%;padding:12px;border-radius:12px;background:#090912;color:#fff;border:1px solid var(--l);box-sizing:border-box"></div><div id="networkTabs" class="actions" style="margin-top:18px"><button class="btn primary" data-tab="all">ALL</button><button class="btn" data-tab="followers">FOLLOWERS</button><button class="btn" data-tab="following">FOLLOWING</button><button class="btn" data-tab="mutual">MUTUAL</button></div><div class="actions" style="margin-top:8px"><button id="networkSort" class="btn" type="button">SORT: RECENT</button></div><div id="networkLists" class="network-list"></div><div class="activity"><h2>PUBLIC PODCAST ACTIVITY</h2><div id="activity" class="activity-grid"><div class="empty">Loading activity…</div></div></div>';async function loadNetworkLists(){const box=document.getElementById("networkLists");if(!box)return;const owner=!!(me&&me.id===id);const canFollowers=owner||p.followers_public!==false;const canFollowing=owner||p.following_public!==false;let html="";const render=async(label,rows)=>{if(!rows.length)return "";const ids=rows.map(x=>x.user_id);const pr=await sb.from("podcast_member_profiles").select("user_id,display_name,username,avatar_url,is_public,network_public").in("user_id",ids);const map=new Map((pr.data||[]).map(x=>[x.user_id,x]));return '<div data-network="'+label.toLowerCase()+'" style="margin-top:18px"><h2>'+label+'</h2><div class="network-grid">'+rows.map(x=>{const q=map.get(x.user_id)||{};if(q.network_public===false&&q.user_id!==me?.id)return "";const n=q.display_name||q.username||"CrowRules Member";const av=q.avatar_url?'<img src="'+esc(q.avatar_url)+'" alt="">':'<div class="network-avatar">'+esc((n[0]||"C").toUpperCase())+'</div>';return '<div class="network-row">'+av+'<a href="member-profile.html?username='+encodeURIComponent(q.username||"")+'">'+esc(n)+'</a></div>'}).join("")+'</div></div>'};if(canFollowers){const q=await sb.from("podcast_member_follows").select("follower_user_id").eq("followed_user_id",id).order("created_at",{ascending:false}).limit(20);html+=await render("FOLLOWERS",(q.data||[]).map(x=>({user_id:x.follower_user_id})))}else html+='<div class="empty">Followers are private.</div>';if(canFollowing){const q=await sb.from("podcast_member_follows").select("followed_user_id").eq("follower_user_id",id).order("created_at",{ascending:false}).limit(20);html+=await render("FOLLOWING",(q.data||[]).map(x=>({user_id:x.followed_user_id})))}else html+='<div class="empty">Following is private.</div>';box.innerHTML=html||'<div class="empty">No public network connections yet.</div>'}
async function loadMutuals(){const box=document.getElementById("networkLists");if(!box||!me||me.id===id)return;const a=await sb.from("podcast_member_follows").select("followed_user_id").eq("follower_user_id",me.id);const b=await sb.from("podcast_member_follows").select("follower_user_id").eq("followed_user_id",me.id);const mine=new Set((a.data||[]).map(x=>x.followed_user_id));const mutualIds=(b.data||[]).map(x=>x.follower_user_id).filter(x=>mine.has(x));if(!mutualIds.length)return;const pr=await sb.from("podcast_member_profiles").select("user_id,display_name,username,avatar_url,network_public").in("user_id",mutualIds);const rows=(pr.data||[]).filter(x=>x.network_public!==false);if(!rows.length)return;const html='<div data-network="mutual" style="margin-top:18px"><h2>MUTUAL CONNECTIONS</h2><div class="network-grid">'+rows.map(q=>{const n=q.display_name||q.username||"CrowRules Member";const av=q.avatar_url?'<img src="'+esc(q.avatar_url)+'" alt="">':'<div class="network-avatar">'+esc((n[0]||"C").toUpperCase())+'</div>';return '<div class="network-row">'+av+'<a href="member-profile.html?username='+encodeURIComponent(q.username||"")+'">'+esc(n)+'</a><span style="margin-left:auto;color:var(--c);font-size:11px">↔ MUTUAL</span></div>'}).join("")+'</div></div>';box.insertAdjacentHTML("beforeend",html)}
async function loadActivity(){const box=document.getElementById("activity");if(p.activity_public===false&&(!me||me.id!==id)){box.innerHTML="<div class=\"empty\">This member has chosen to keep podcast activity private.</div>";return}const [f,s]=await Promise.all([sb.from("podcast_follows").select("podcast_id,created_at").eq("user_id",id).order("created_at",{ascending:false}).limit(8),sb.from("podcasts").select("id,title,artwork_url,category").eq("creator_id",id).eq("status","published").order("created_at",{ascending:false}).limit(8)]);let html="";if(!f.error&&f.data?.length){const ids=f.data.map(x=>x.podcast_id);const ps=await sb.from("podcasts").select("id,title,artwork_url,category").in("id",ids);const map=new Map((ps.data||[]).map(x=>[x.id,x]));html+=f.data.map(x=>{const sh=map.get(x.podcast_id);return sh?"<div class=\"activity-card\">"+(sh.artwork_url?"<img class=\"show-art\" src=\""+esc(sh.artwork_url)+"\" alt=\"\">":"")+"<a href=\"show.html?id="+encodeURIComponent(sh.id)+"\">"+esc(sh.title)+"</a><div class=\"activity-meta\">Following · "+esc(sh.category||"Podcast")+"</div><div style=\"clear:both\"></div></div>":""}).join("")}if(!s.error&&s.data?.length){html+="<div class=\"activity-meta\">PUBLISHED SHOWS BY THIS MEMBER</div>"+s.data.map(sh=>"<div class=\"activity-card\">"+(sh.artwork_url?"<img class=\"show-art\" src=\""+esc(sh.artwork_url)+"\" alt=\"\">":"")+"<a href=\"show.html?id="+encodeURIComponent(sh.id)+"\">"+esc(sh.title)+"</a><div class=\"activity-meta\">Published · "+esc(sh.category||"Podcast")+"</div><div style=\"clear:both\"></div></div>").join("")}const [cf,cr]=await Promise.all([sb.from("podcast_episode_comments").select("id,episode_id,body,status,created_at").eq("user_id",id).order("created_at",{ascending:false}).limit(8),sb.from("podcast_episode_reactions").select("id,episode_id,reaction,created_at").eq("user_id",id).order("created_at",{ascending:false}).limit(8)]);const episodeIds=[...(cf.data||[]),...(cr.data||[])].map(x=>x.episode_id).filter(Boolean);let episodeMap=new Map();if(episodeIds.length){const er=await sb.from("podcast_episodes").select("id,title,podcast_id").in("id",[...new Set(episodeIds)]);episodeMap=new Map((er.data||[]).map(x=>[x.id,x]))}const timeline=[];(f.data||[]).forEach(x=>{const sh=map.get(x.podcast_id);if(sh)timeline.push({date:x.created_at,type:"FOLLOWED SHOW",html:"Following <a href=\"show.html?id="+encodeURIComponent(sh.id)+"\">"+esc(sh.title)+"</a>"})});(s.data||[]).forEach(sh=>timeline.push({date:sh.created_at,type:"PUBLISHED SHOW",html:"Published <a href=\"show.html?id="+encodeURIComponent(sh.id)+"\">"+esc(sh.title)+"</a>"}));(cf.data||[]).forEach(x=>{if(x.status&&![\"approved\",\"published\",\"visible\"].includes(String(x.status).toLowerCase()))return;const ep=episodeMap.get(x.episode_id);if(ep)timeline.push({date:x.created_at,type:"COMMENTED",html:"Commented on <a href=\"episode.html?id="+encodeURIComponent(ep.id)+"\">"+esc(ep.title)+"</a>"+(x.body?" — “"+esc(String(x.body).slice(0,180))+(String(x.body).length>180?"…":"")+"”":"")})});(cr.data||[]).forEach(x=>{const ep=episodeMap.get(x.episode_id);if(ep)timeline.push({date:x.created_at,type:"REACTION",html:"Reacted "+esc(x.reaction||"")+" to <a href=\"episode.html?id="+encodeURIComponent(ep.id)+"\">"+esc(ep.title)+"</a>"})});timeline.sort((a,b)=>new Date(b.date)-new Date(a.date));const timelineHtml=timeline.slice(0,12).map(x=>"<div class=\"timeline-item\"><div class=\"type\">"+x.type+"</div><div>"+x.html+"</div><div class=\"when\">"+new Date(x.date).toLocaleString()+"</div></div>").join("");box.innerHTML=(timelineHtml?'<div class="activity-meta">RECENT ACTIVITY</div><div class="timeline">'+timelineHtml+"</div>":"")+(html?'<div class="activity-meta" style="margin-top:22px">PUBLIC PODCAST ACTIVITY</div>'+html:"")||"<div class=\"empty\">No public Podcasting activity yet.</div>"}document.getElementById("shareProfile").onclick=async()=>{const u=location.href;try{if(navigator.share){await navigator.share({title:(p.display_name||p.username||"CrowRules Member")+" | CrowRules Podcasting",url:u})}else if(navigator.clipboard){await navigator.clipboard.writeText(u);document.getElementById("followStatus").textContent="Profile link copied.";}}catch(e){}};document.querySelectorAll("#networkTabs [data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("#networkTabs [data-tab]").forEach(x=>x.classList.toggle("primary",x===b));const t=b.dataset.tab;document.querySelectorAll("#networkLists [data-network]").forEach(x=>x.style.display=t==="all"||x.dataset.network===t?"":"none")});document.getElementById("networkSort").onclick=()=>{const box=document.getElementById("networkLists");const sections=[...box.querySelectorAll("[data-network]")];sections.forEach(s=>{const grid=s.querySelector(".network-grid");if(!grid)return;[...grid.children].sort((a,b)=>a.textContent.localeCompare(b.textContent)).forEach(x=>grid.appendChild(x))});document.getElementById("networkSort").textContent="SORT: A–Z"};document.getElementById("networkSearch").oninput=()=>{const q=document.getElementById("networkSearch").value.toLowerCase().trim();document.querySelectorAll("#networkLists .network-row").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?"flex":"none")};loadActivity();loadNetworkLists();loadMutuals();if(me&&me.id===id){const panel=document.createElement("div");panel.className="edit-panel";panel.innerHTML='<div class="eyebrow">EDIT YOUR PROFILE</div><div class="field"><label>DISPLAY NAME</label><input id="epName" maxlength="80"></div><div class="field"><label>USERNAME</label><input id="epUsername" maxlength="40"></div><div class="field"><label>BIO</label><textarea id="epBio" maxlength="500"></textarea></div><div class="field"><label>AVATAR</label><div class="upload-row"><input id="epAvatar" maxlength="1000" placeholder="https://…"><input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp" style="display:none"><button type="button" id="chooseAvatar" class="btn">Choose Image</button></div><img id="avatarPreview" class="avatar-preview" alt="Avatar preview" style="display:none"></div><div class="field"><label>BADGE</label><input id="epBadge" maxlength="40"></div><label class="check"><input id="epPublic" type="checkbox"> Make my profile public</label><label class="check"><input id="epActivity" type="checkbox"> Show my podcast activity publicly</label><label class="check"><input id="epNetwork" type="checkbox"> Show my network stats publicly</label><label class="check"><input id="epFollowers" type="checkbox"> Show my followers publicly</label><label class="check"><input id="epFollowing" type="checkbox"> Show who I follow publicly</label><div class="actions"><button id="saveProfile" class="btn primary">Save Profile</button></div><div id="saveMsg" class="save-msg"></div>';el.appendChild(panel);document.getElementById("epName").value=p.display_name||"";document.getElementById("epUsername").value=p.username||"";document.getElementById("epBio").value=p.bio||"";document.getElementById("epAvatar").value=p.avatar_url||"";document.getElementById("epBadge").value=p.badge||"";document.getElementById("epPublic").checked=!!p.is_public;document.getElementById("epActivity").checked=p.activity_public!==false;document.getElementById("epNetwork").checked=p.network_public!==false;document.getElementById("epFollowers").checked=p.followers_public!==false;document.getElementById("epFollowing").checked=p.following_public!==false;const avatarPreview=document.getElementById("avatarPreview"),avatarInput=document.getElementById("epAvatar");if(p.avatar_url){avatarPreview.src=p.avatar_url;avatarPreview.style.display="block"}document.getElementById("chooseAvatar").onclick=()=>document.getElementById("avatarFile").click();document.getElementById("avatarFile").onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>5*1024*1024){document.getElementById("saveMsg").textContent="Avatar must be 5 MB or smaller.";e.target.value="";return}avatarPreview.src=URL.createObjectURL(f);avatarPreview.style.display="block"};document.getElementById("saveProfile").onclick=async()=>{const b=document.getElementById("saveProfile"),m=document.getElementById("saveMsg");b.disabled=true;m.textContent="Saving…";const username=document.getElementById("epUsername").value.trim().toLowerCase();if(username&&!/^[a-z0-9_]{3,30}$/.test(username)){m.textContent="Username must be 3–30 characters using only letters, numbers, or underscores.";b.disabled=false;return}const file=document.getElementById("avatarFile").files?.[0];if(file){const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");const path=id+"/avatar-"+Date.now()+"."+ext;const up=await sb.storage.from("podcast-avatars").upload(path,file,{upsert:false,contentType:file.type});if(up.error){m.textContent="Avatar upload failed: "+up.error.message;b.disabled=false;return}const pub=sb.storage.from("podcast-avatars").getPublicUrl(path);avatarInput.value=pub.data.publicUrl}const payload={display_name:document.getElementById("epName").value.trim()||null,username:username||null,bio:document.getElementById("epBio").value.trim()||null,avatar_url:document.getElementById("epAvatar").value.trim()||null,badge:document.getElementById("epBadge").value.trim()||null,is_public:document.getElementById("epPublic").checked,activity_public:document.getElementById("epActivity").checked,updated_at:new Date().toISOString()};const oldAvatar=p.avatar_url;payload.network_public=document.getElementById("epNetwork")?.checked!==false;payload.followers_public=document.getElementById("epFollowers")?.checked!==false;payload.following_public=document.getElementById("epFollowing")?.checked!==false;const q=await sb.from("podcast_member_profiles").update(payload).eq("user_id",id);if(q.error){m.textContent=(q.error.code==="23505"?"That username is already taken.":q.error.message);b.disabled=false;return}if(file&&oldAvatar&&oldAvatar.includes("/storage/v1/object/public/podcast-avatars/")){try{const marker="/storage/v1/object/public/podcast-avatars/";const oldPath=decodeURIComponent(oldAvatar.split(marker)[1].split("?")[0]);if(oldPath.startsWith(id+"/"))await sb.storage.from("podcast-avatars").remove([oldPath])}catch(e){}}m.textContent="Profile saved.";setTimeout(()=>location.reload(),500)}b.disabled=false}}if(me&&me.id!==id){const reportBtn=document.getElementById("reportMember");if(reportBtn){reportBtn.onclick=async()=>{const reason=prompt("Why are you reporting this member?");if(!reason||reason.trim().length<3)return;const ok=confirm("Submit this report to CrowRules administrators?");if(!ok)return;reportBtn.disabled=true;const rr=await sb.from("podcast_member_reports").insert({reporter_user_id:me.id,reported_user_id:id,reason:reason.trim()});document.getElementById("followStatus").textContent=rr.error?(rr.error.code==="23505"?"You already have an open report for this member.":rr.error.message):"Report submitted to CrowRules administrators.";reportBtn.disabled=false}}const blockBtn=document.getElementById("blockMember");if(blockBtn){const br=await sb.from("podcast_member_blocks").select("id").eq("blocker_user_id",me.id).eq("blocked_user_id",id).maybeSingle();let blocked=!!br.data;blockBtn.textContent=blocked?"UNBLOCK MEMBER":"BLOCK MEMBER";blockBtn.onclick=async()=>{blockBtn.disabled=true;const q=blocked?await sb.from("podcast_member_blocks").delete().eq("blocker_user_id",me.id).eq("blocked_user_id",id):await sb.from("podcast_member_blocks").insert({blocker_user_id:me.id,blocked_user_id:id});if(!q.error){blocked=!blocked;blockBtn.textContent=blocked?"UNBLOCK MEMBER":"BLOCK MEMBER";document.getElementById("followStatus").textContent=blocked?"Member blocked.":"Member unblocked."}else document.getElementById("followStatus").textContent=q.error.message;blockBtn.disabled=false}}const blockState=await sb.from("podcast_member_blocks").select("id").eq("blocker_user_id",me.id).eq("blocked_user_id",id).maybeSingle();if(blockState.data){document.getElementById("followBtn").disabled=true;document.getElementById("followBtn").textContent="BLOCKED";document.getElementById("followStatus").textContent="You have blocked this member.";return;}const btn=document.getElementById("followBtn");btn.onclick=async()=>{btn.disabled=true;const q=following?await sb.from("podcast_member_follows").delete().eq("follower_user_id",me.id).eq("followed_user_id",id):await sb.from("podcast_member_follows").insert({follower_user_id:me.id,followed_user_id:id});if(!q.error){following=!following;btn.textContent=following?"Following":"Follow Member";document.getElementById("followStatus").textContent=following?(mutual?"↔ You and this member follow each other.":"You are now following this member."):"You stopped following this member.";mutual=following&&mutual}else document.getElementById("followStatus").textContent=q.error.message;btn.disabled=false}}})()</script></body></html>
