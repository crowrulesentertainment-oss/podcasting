<style>
:root{--cyan:#55e7ff;--purple:#9b6cff;--panel:#090d17;--panel2:#0d1220;--muted:#8995aa}
*{box-sizing:border-box}body{margin:0;background:#05050b;color:#edf3ff}.profile-wrap{max-width:1180px;margin:auto;padding:34px 18px 100px}.hidden{display:none!important}.loading,.notice{padding:24px;border:1px solid #ffffff12;border-radius:18px;background:#090d17;color:#909bb0;line-height:1.6}.error{border-color:#ff657344!important;background:#ff65730d!important;color:#ffb6bf!important}
.cover{height:290px;border:1px solid #ffffff12;border-radius:24px 24px 0 0;overflow:hidden;position:relative;background:radial-gradient(circle at 15% 15%,#55e7ff35,transparent 35%),radial-gradient(circle at 80% 20%,#9b6cff35,transparent 36%),linear-gradient(135deg,#070a12,#151026 55%,#070910)}.cover img{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#05050b10,#05050b45 50%,#05050bf0)}.cover-label{position:absolute;left:24px;bottom:20px;display:flex;gap:7px;flex-wrap:wrap}.pill,.badge{padding:7px 10px;border-radius:999px;background:#05050b99;border:1px solid #ffffff18;color:#dce5f7;font-size:8px;text-transform:uppercase;letter-spacing:.1em}
.main{background:var(--panel);border:1px solid #ffffff12;border-top:0;border-radius:0 0 24px 24px;padding:0 28px 28px}.head{display:grid;grid-template-columns:145px minmax(0,1fr) auto;gap:20px;align-items:end;margin-top:-68px;position:relative}.avatar{width:145px;height:145px;border-radius:50%;border:5px solid var(--panel);overflow:hidden;background:radial-gradient(circle at 30% 20%,var(--cyan),#54308a 55%,#080a12);display:grid;place-items:center;box-shadow:0 15px 50px #000b}.avatar img{width:100%;height:100%;object-fit:cover}.avatar span{font:800 34px Orbitron;color:#fff}.eyebrow{font:800 8px Montserrat;text-transform:uppercase;letter-spacing:.16em;color:var(--cyan)}h1{font:800 clamp(26px,4vw,40px) Orbitron;margin:7px 0 5px;line-height:1.1}.username{font-size:11px;color:#7d899f}.tagline{font-size:12px;color:#aab4c6;line-height:1.55;margin-top:8px;max-width:680px}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #ffffff16;border-radius:10px;background:#ffffff07;color:#e7eefc;text-decoration:none;padding:9px 12px;font:700 9px Montserrat;text-transform:uppercase;letter-spacing:.07em;cursor:pointer}.btn.primary{border-color:#55e7ff44;background:#55e7ff0d;color:#8fefff}.btn:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:24px;padding-top:18px;border-top:1px solid #ffffff0c}.stat{padding:13px 10px;border:1px solid #ffffff0c;border-radius:13px;background:#080b13}.stat strong{display:block;font:800 18px Orbitron}.stat span{display:block;margin-top:5px;color:#707c92;font-size:8px;text-transform:uppercase;letter-spacing:.1em}.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;margin-top:16px}.card{background:var(--panel2);border:1px solid #ffffff10;border-radius:18px;padding:20px;margin-bottom:16px}.card:last-child{margin-bottom:0}.card h2{font-size:15px;margin:0 0 14px}.about{display:grid;gap:12px}.about-row{font-size:10px;color:#8792a6;line-height:1.55}.about-row b{display:block;color:#eef3ff;font-size:8px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:3px}.about-row a{color:var(--cyan);overflow-wrap:anywhere}.socials{display:flex;gap:7px;flex-wrap:wrap}.social{padding:8px 10px;border:1px solid #ffffff10;border-radius:9px;background:#ffffff05;color:#dce5f7;text-decoration:none;font-size:8px;text-transform:uppercase}.tabs{display:flex;gap:3px;overflow:auto;border-bottom:1px solid #ffffff0d;margin:-3px 0 16px}.tabs button{border:0;background:none;color:#7c879b;padding:11px 12px;font:700 8px Montserrat;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;cursor:pointer}.tabs button.active{color:#fff;border-bottom:2px solid var(--cyan)}.list{display:grid;gap:10px}.item{padding:13px;border:1px solid #ffffff0d;border-radius:13px;background:#080b13}.item strong{font-size:10px;color:#eaf1ff}.item p{margin:5px 0 0;color:#9ca6b8;font-size:10px;line-height:1.55}.item small{display:block;margin-top:6px;color:#657188;font-size:8px}.empty{padding:20px;border:1px dashed #ffffff12;border-radius:13px;color:#6f7b91;text-align:center;font-size:10px;line-height:1.6}.podcast-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pod{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid #ffffff0d;border-radius:13px;background:#080b13}.art{width:52px;height:52px;border-radius:10px;overflow:hidden;flex:none;background:linear-gradient(135deg,#55e7ff22,#9b6cff22);display:grid;place-items:center;font:800 10px Orbitron}.art img{width:100%;height:100%;object-fit:cover}.pod b{font-size:10px}.pod small{display:block;color:#68748a;font-size:8px;margin-top:4px}.editor{display:grid;gap:12px}.editor label{font-size:8px;text-transform:uppercase;letter-spacing:.12em;color:#8994a8}.editor input,.editor textarea{width:100%;margin-top:6px;background:#060912;border:1px solid #ffffff15;border-radius:10px;color:#fff;padding:11px;font:500 10px Montserrat;outline:none}.editor textarea{min-height:100px;resize:vertical}.editor-actions{display:flex;gap:8px;flex-wrap:wrap}.media-editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.media-box{border:1px solid #ffffff0d;border-radius:14px;background:#080b13;padding:13px}.media-box h3{font-size:10px;margin:0 0 9px}.media-preview{height:105px;border-radius:10px;overflow:hidden;background:#060912;border:1px dashed #ffffff15;display:grid;place-items:center;color:#68748a;font:700 8px Montserrat;text-transform:uppercase;margin-bottom:9px}.media-preview img{width:100%;height:100%;object-fit:cover}.media-box input[type=file]{width:100%;font-size:8px;color:#8792a6}.media-help{color:#66738a;font-size:8px;line-height:1.5;margin-top:7px}.status-line{display:flex;align-items:center;gap:7px;color:#748096;font-size:8px;text-transform:uppercase;letter-spacing:.1em}.dot{width:7px;height:7px;border-radius:50%;background:#35e2a0;box-shadow:0 0 10px #35e2a0}
.global{position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:18px;padding:13px 18px;background:#05050bf2;border-bottom:1px solid #ffffff0d;backdrop-filter:blur(12px)}.brand{font:900 14px Orbitron;color:#fff;text-decoration:none;white-space:nowrap}.brand span{color:var(--cyan)}.navDivider{height:22px;width:1px;background:#ffffff18}.globalnav{display:flex;gap:16px;flex:1}.navlink{color:#8d98ab;text-decoration:none;font:700 8px Montserrat;letter-spacing:.08em;padding:8px 0}.navlink:hover,.navlink.active{color:var(--cyan)}.navright{display:flex;align-items:center;gap:9px}.statusdot{width:7px;height:7px;border-radius:50%;background:#35e2a0}.navstate{font:700 7px Orbitron;color:#8190a5}.iconbtn,.join{border:1px solid #ffffff16;border-radius:9px;padding:8px 10px;color:#dfe8f8;text-decoration:none;font:700 8px Montserrat}.join{border-color:#55e7ff35;color:#8fefff;background:#55e7ff0a}.mobileNav{display:none;background:#ffffff07;color:#fff}.mobile-menu{display:none;padding:10px 18px 15px;background:#070912;border-bottom:1px solid #ffffff0d}.mobile-menu nav{display:grid;gap:4px}.mobile-menu .navlink{padding:11px}.mobile-account{display:flex;gap:7px;margin-top:9px}
@media(max-width:900px){.head{grid-template-columns:110px minmax(0,1fr)}.avatar{width:110px;height:110px}.actions{grid-column:1/-1;justify-content:flex-start}.stats{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.globalnav{display:none}.navright{display:none}.mobileNav{display:inline-flex}.mobile-menu.open{display:block}}@media(max-width:560px){.profile-wrap{padding:22px 12px 80px}.cover{height:210px}.main{padding:0 16px 22px}.head{grid-template-columns:82px minmax(0,1fr);gap:12px;margin-top:-42px}.avatar{width:82px;height:82px}.avatar span{font-size:22px}.stats{grid-template-columns:repeat(2,1fr)}.podcast-grid{grid-template-columns:1fr}.media-editor{grid-template-columns:1fr}.cover-label{left:13px;bottom:13px}}
</style>

<main class="profile-wrap">
<div id="loading" class="loading">Loading member profile…</div><div id="error" class="notice error hidden"></div>
<section id="profile" class="hidden"><div class="cover"><img id="coverImg" class="hidden" alt=""><div class="shade"></div><div class="cover-label"><span class="pill" id="memberType">CrowRules Member</span><span class="pill">Universal Account</span></div></div>
<section class="main"><div class="head"><div id="avatar" class="avatar"></div><div><div id="badge"></div><h1 id="name">Member</h1><div id="username" class="username"></div><div id="tagline" class="tagline"></div></div><div id="actions" class="actions"></div></div>
<div class="stats"><div class="stat"><strong id="podcastCount">0</strong><span>Podcasts</span></div><div class="stat"><strong id="followers">—</strong><span>Followers</span></div><div class="stat"><strong id="following">—</strong><span>Following</span></div><div class="stat"><strong id="points">0</strong><span>CrowPoints</span></div><div class="stat"><strong id="minutes">0</strong><span>Minutes</span></div></div></section>
<div class="layout"><aside><section class="card"><h2>About</h2><div id="about" class="about"></div></section><section class="card"><h2>Social Links</h2><div id="socials" class="socials"></div></section><section class="card"><div class="status-line"><span class="dot"></span><span id="connection">Connecting…</span></div></section></aside>
<section><div class="card"><div class="tabs" id="tabs"><button class="active" data-tab="overview">Overview</button><button data-tab="podcasts">Podcasts</button><button data-tab="activity">Activity</button><button data-tab="edit" id="editTab" class="hidden">Edit Profile</button></div><div id="tab-overview"></div><div id="tab-podcasts" class="hidden"></div><div id="tab-activity" class="hidden"></div><div id="tab-edit" class="hidden"></div></div></section></div></section></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://crowrulesentertainment-oss.github.io/crowspace/crowspace-auth.js?v=2"></script>
<script src="https://crowrulesentertainment-oss.github.io/crowspace/universal-profile-sync.js?v=2"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=s=>String(s||"CR").trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"CR";
const params=new URLSearchParams(location.search);
let db=null,user=null,targetId=(params.get("user")||params.get("id")||params.get("user_id")||"").trim(),profile=null,podcasts=[],loading=false,channel=null,refreshTimer=null;
const tables={profile:["podcast_member_profiles","crowspace_profiles","podcasting_member_directory","members"]};

function safeUrl(v){const s=String(v||"").trim();if(!s)return "";try{const u=new URL(/^https?:\/\//i.test(s)?s:"https://"+s);return /^https?:$/.test(u.protocol)?u.href:""}catch{return ""}}
function parseJson(v){if(v&&typeof v==="object"&&!Array.isArray(v))return v;if(typeof v==="string")try{const x=JSON.parse(v);return x&&typeof x==="object"?x:{}}catch{}return {}}
function date(v){if(!v)return "—";const d=new Date(v);return isNaN(d)? "—":d.toLocaleDateString()}
function hide(id){$(id)?.classList.add("hidden")} function show(id){$(id)?.classList.remove("hidden")} function txt(id,v){if($(id))$(id).textContent=v??""}

async function getDb(){
 if(window.CrowSpaceAuth?.ready){await window.CrowSpaceAuth.ready;if(window.CrowSpaceAuth.client)return window.CrowSpaceAuth.client}
 if(window.CROW_SUPABASE)return window.CROW_SUPABASE;
 if(window.CROW_SUPABASE_READY)try{return await window.CROW_SUPABASE_READY}catch{}
 if(window.supabase?.createClient&&window.CROW_CONFIG?.supabaseUrl&&window.CROW_CONFIG?.supabaseKey){
  window.CROW_SUPABASE=window.supabase.createClient(window.CROW_CONFIG.supabaseUrl,window.CROW_CONFIG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
  return window.CROW_SUPABASE;
 }
 throw Error("Supabase is not available.");
}
async function firstRow(table,uid){
 try{const r=await db.from(table).select("*").eq("user_id",uid).maybeSingle();return r.error?null:r.data}catch{return null}
}
function normalize(rows){
 const c=rows.find(x=>x)||{};
 return {
  user_id:targetId,display_name:c.display_name||[c.first_name,c.last_name].filter(Boolean).join(" ")||c.username||"Universal Member",
  username:c.username||"",bio:c.bio||"",tagline:c.tagline||c.portfolio_tagline||"",location:c.location||"",website_url:c.website_url||"",
  avatar_url:c.avatar_url||"",banner_url:c.banner_url||c.cover_url||"",social_links:parseJson(c.social_links),
  membership_type:c.membership_type||c.badge||"CrowRules Member",points:Number(c.points||0),watch_minutes:Number(c.watch_minutes||0),
  created_at:c.created_at,last_active_at:c.last_active_at
 };
}
async function loadIdentity(uid){
 const rows=[]; for(const t of tables.profile){const r=await firstRow(t,uid);if(r)rows.push(r)}
 const merged=normalize(rows);
 for(const r of rows){Object.keys(merged).forEach(k=>{if((merged[k]===""||merged[k]===0||merged[k]==null||Object.keys(merged[k]||{}).length===0)&&r[k]!=null)merged[k]=r[k]})}
 return merged;
}
async function loadPodcasts(uid){
 try{
  const cr=await db.from("creators").select("id,name,display_name,member_id").eq("member_id",uid).eq("is_active",true);
  if(cr.error||!cr.data?.length)return [];
  const ids=cr.data.map(x=>x.id);
  const r=await db.from("podcasts").select("id,creator_id,title,description,artwork_url,status,total_plays,listener_count,created_at").in("creator_id",ids).eq("status","published").order("created_at",{ascending:false});
  return r.error?[]:(r.data||[]);
 }catch{return []}
}
async function loadPoints(uid){
 try{const r=await db.from("crowpoints_ledger").select("points").eq("user_id",uid);return r.error?Number(profile?.points||0):(r.data||[]).reduce((n,x)=>n+Number(x.points||0),0)}catch{return Number(profile?.points||0)}
}
function render(){
 const p=profile||{};const name=p.display_name||"CrowRules Member";
 $("avatar").innerHTML=p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="'+esc(name)+'">':'<span>'+esc(initials(name))+"</span>";
 txt("name",name);txt("username",p.username?"@"+p.username:"CrowRules Member");txt("tagline",p.tagline||p.bio||"Part of the CrowRules Podcasting community.");
 $("badge").innerHTML='<span class="badge">'+esc(p.membership_type||"CrowRules Member")+"</span>";txt("memberType",p.membership_type||"CrowRules Member");
 if(p.banner_url){$("coverImg").src=p.banner_url;show("coverImg")}else hide("coverImg");
 const about=[];if(p.location)about.push(["Location",p.location]);if(p.created_at)about.push(["Member since",date(p.created_at)]);if(p.last_active_at)about.push(["Last active",date(p.last_active_at)]);
 if(p.website_url)about.push(["Website",safeUrl(p.website_url)]);
 $("about").innerHTML=about.length?about.map(([k,v])=>'<div class="about-row"><b>'+esc(k)+"</b>"+(k==="Website"&&safeUrl(v)?'<a href="'+esc(safeUrl(v))+'" target="_blank" rel="noopener">'+esc(safeUrl(v))+"</a>":esc(v))+"</div>").join(""):'<div class="empty">No public profile details have been added yet.</div>';
 const links=Object.entries(parseJson(p.social_links)).map(([k,v])=>[k,safeUrl(v)]).filter(x=>x[1]);if(p.website_url&&!links.some(x=>x[0].toLowerCase()==="website"))links.push(["Website",safeUrl(p.website_url)]);
 $("socials").innerHTML=links.length?links.map(([k,v])=>'<a class="social" href="'+esc(v)+'" target="_blank" rel="noopener">'+esc(k)+"</a>").join(""):'<div class="empty" style="width:100%">No public social links yet.</div>';
 txt("podcastCount",podcasts.length.toLocaleString());txt("points",Number(p.points||0).toLocaleString());txt("minutes",Number(p.watch_minutes||0).toLocaleString());
 $("tab-overview").innerHTML='<div class="eyebrow">CROWRULES // UNIVERSAL MEMBER</div><h2 style="margin:7px 0 8px">Universal CrowRules Profile</h2><p style="color:#919caf;font-size:11px;line-height:1.7;margin:0">'+esc(p.bio||"This member has not added a public bio yet.")+"</p>";
 $("tab-podcasts").innerHTML=podcasts.length?'<div class="podcast-grid">'+podcasts.map(x=>'<div class="pod"><div class="art">'+(x.artwork_url?'<img src="'+esc(x.artwork_url)+'" alt="">':"CR")+'</div><div><b>'+esc(x.title||"Untitled Podcast")+"</b><small>"+esc(x.description||"Published CrowRules Podcast")+"</small></div></div>").join("")+"</div>":'<div class="empty">No published podcasts are currently linked to this member.</div>';
 $("tab-activity").innerHTML='<div class="list"><div class="item"><strong>Profile connected</strong><small>Universal CrowRules identity · '+esc(date(p.updated_at||p.created_at))+"</small></div></div>";
 renderEditor();
}
function renderEditor(){
 if(!user||user.id!==targetId){hide("editTab");return}show("editTab");
 $("tab-edit").innerHTML='<div class="editor"><label>Display name<input id="eName" maxlength="120" value="'+esc(profile.display_name||"")+'"></label><label>Username<input id="eUser" maxlength="60" value="'+esc(profile.username||"")+'"></label><label>Tagline<input id="eTag" maxlength="180" value="'+esc(profile.tagline||"")+'"></label><label>Bio<textarea id="eBio" maxlength="2000">'+esc(profile.bio||"")+'</textarea></label><label>Location<input id="eLoc" maxlength="120" value="'+esc(profile.location||"")+'"></label><label>Website<input id="eWeb" maxlength="300" value="'+esc(profile.website_url||"")+'"></label><label>Social links<textarea id="eSocial" maxlength="4000" placeholder="YouTube=https://youtube.com/...\nDiscord=https://discord.gg/..."></textarea></label><div class="media-editor"><div class="media-box"><h3>Avatar</h3><div class="media-preview" id="avatarPreview">Current avatar</div><input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div class="media-help">JPG, PNG, WebP or GIF · max 5 MB.</div></div><div class="media-box"><h3>Banner</h3><div class="media-preview" id="bannerPreview">Current banner</div><input id="bannerFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div class="media-help">JPG, PNG, WebP or GIF · max 5 MB.</div></div></div><div id="saveStatus" class="notice hidden" style="padding:12px"></div><div class="editor-actions"><button id="saveBtn" class="btn primary" type="button">Save Universal Profile</button><button id="refreshBtn" class="btn" type="button">Refresh</button></div></div>';
 const social=parseJson(profile.social_links);$("eSocial").value=Object.entries(social).map(([k,v])=>k+"="+v).join("\n");
 if(profile.avatar_url)$("avatarPreview").innerHTML='<img src="'+esc(profile.avatar_url)+'" alt="">';if(profile.banner_url)$("bannerPreview").innerHTML='<img src="'+esc(profile.banner_url)+'" alt="">';
 ["avatarFile","bannerFile"].forEach(id=>$(id).addEventListener("change",()=>preview(id,id==="avatarFile"?"avatarPreview":"bannerPreview")));
 $("saveBtn").onclick=save; $("refreshBtn").onclick=()=>load(true);
}
function preview(fileId,previewId){const f=$(fileId).files?.[0];if(!f)return;if(!/^image\/(jpeg|png|webp|gif)$/i.test(f.type)||f.size>5*1024*1024){$(fileId).value="";alert("Use a JPG, PNG, WebP or GIF image no larger than 5 MB.");return}const u=URL.createObjectURL(f);$(previewId).innerHTML='<img src="'+u+'" alt="">'}
async function upload(kind,file){if(!file)return null;if(!/^image\/(jpeg|png|webp|gif)$/i.test(file.type))throw Error(kind+" must be a JPG, PNG, WebP, or GIF.");if(file.size>5*1024*1024)throw Error(kind+" must be 5 MB or smaller.");const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";const path=user.id+"/"+kind+"-"+Date.now()+"."+ext;const r=await db.storage.from("podcast-avatars").upload(path,file,{upsert:true,contentType:file.type,cacheControl:"3600"});if(r.error)throw r.error;return db.storage.from("podcast-avatars").getPublicUrl(path).data.publicUrl}
async function updateTable(table,patch,insertBase){
 let r=await db.from(table).update(patch).eq("user_id",user.id);if(!r.error)return;
 const row=Object.assign({user_id:user.id},insertBase||{},patch);r=await db.from(table).insert(row);if(r.error)throw r.error;
}
async function save(){
 const btn=$("saveBtn"),st=$("saveStatus");btn.disabled=true;btn.textContent="Saving…";
 try{
  const social={};String($("eSocial").value||"").split(/\r?\n/).forEach(line=>{const i=line.indexOf("=");if(i<1)return;const k=line.slice(0,i).trim().slice(0,40),v=safeUrl(line.slice(i+1).trim());if(k&&v)social[k]=v});
  const avatar=await upload("avatar",$("avatarFile").files?.[0])||profile.avatar_url||null;
  const banner=await upload("banner",$("bannerFile").files?.[0])||profile.banner_url||null;
  const display=$("eName").value.trim()||null,username=$("eUser").value.trim().toLowerCase().replace(/[^a-z0-9_.-]/g,"").slice(0,40)||null,bio=$("eBio").value.trim(),tag=$("eTag").value.trim()||null,loc=$("eLoc").value.trim()||null,web=safeUrl($("eWeb").value.trim())||null,now=new Date().toISOString();
  await updateTable("podcast_member_profiles",{display_name:display,username,bio,tagline:tag,location:loc,website_url:web,avatar_url:avatar,cover_url:banner,social_links:social,updated_at:now},{is_public:true,activity_public:true,network_public:true,followers_public:true,following_public:true});
  await updateTable("crowspace_profiles",{display_name:display,username,bio,avatar_url:avatar,banner_url:banner,social_links:social,portfolio_tagline:tag||"",portfolio_bio:bio,updated_at:now},{social_links:{},profile_theme:"cinematic",profile_sections:{}});
  await updateTable("members",{display_name:display,username,bio,avatar_url:avatar,updated_at:now});
  if(window.CrowRulesUniversalProfile?.save)try{await window.CrowRulesUniversalProfile.save(db,user.id,{display_name:display,username,bio,tagline:tag,avatar_url:avatar,banner_url:banner,portfolio_url:web,social_links:social})}catch(e){console.warn("Universal sync secondary warning:",e)}
  st.className="notice";st.textContent="✓ Universal profile saved across CrowRules.";show("saveStatus");await load(true);
 }catch(e){console.error(e);st.className="notice error";st.textContent="Profile could not be saved: "+(e.message||"Supabase error.");show("saveStatus")}
 finally{btn.disabled=false;btn.textContent="Save Universal Profile"}
}
function tabs(){$("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.classList.contains("hidden"))return;$("tabs").querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active");["overview","podcasts","activity","edit"].forEach(t=>document.getElementById("tab-"+t)?.classList.toggle("hidden",t!==b.dataset.tab))})}
function realtime(){
 if(!db||!targetId)return;if(channel)try{db.removeChannel(channel)}catch{}
 channel=db.channel("member-profile-"+targetId).on("postgres_changes",{event:"*",schema:"public",table:"podcast_member_profiles",filter:"user_id=eq."+targetId},()=>schedule()).on("postgres_changes",{event:"*",schema:"public",table:"crowspace_profiles",filter:"user_id=eq."+targetId},()=>schedule()).on("postgres_changes",{event:"*",schema:"public",table:"members",filter:"user_id=eq."+targetId},()=>schedule()).on("postgres_changes",{event:"*",schema:"public",table:"creators",filter:"member_id=eq."+targetId},()=>schedule()).subscribe(s=>{if(s==="SUBSCRIBED")txt("connection","LIVE SYNC · Supabase")});
}
function schedule(){clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>load(true),600)}
async function load(force){
 if(loading&&!force)return;loading=true;
 try{
  db=await getDb();user=(await db.auth.getUser()).data?.user||null;if(!targetId)targetId=user?.id||"";if(!targetId)throw Error("No member was specified. Sign in or open this page with ?user=<member-id>.");
  txt("navState",user?"MEMBER":"GUEST");profile=await loadIdentity(targetId);podcasts=await loadPodcasts(targetId);profile.points=await loadPoints(targetId);
  render();hide("loading");hide("error");show("profile");txt("connection","LIVE · Supabase connected");realtime();
 }catch(e){console.error("Member profile:",e);hide("loading");$("error").textContent="Unable to load this member profile. "+(e.message||"Please refresh.");show("error");txt("connection","Supabase error")}
 finally{loading=false}
}
$("mobileToggle").onclick=()=>$("mobileMenu").classList.toggle("open");tabs();load(false);
window.addEventListener("online",()=>load(true));window.addEventListener("crowspace-auth-ready",()=>load(true));window.addEventListener("crow:supabase-connected",()=>load(true));
})();
</script>
