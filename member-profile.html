<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030308"><title>Member Profile | CrowRules Podcasting</title>
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="css/crowrules-cinematic.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>:root{--c:#00e5ff;--v:#8b5cf6;--m:#9da5bd;--l:rgba(255,255,255,.1)}body{background:radial-gradient(circle at 15% 0%,#00e5ff18,transparent 32%),radial-gradient(circle at 85% 0%,#8b5cf625,transparent 35%),#030308}.shell{width:min(760px,94%);margin:auto;padding:70px 0 110px}.card{padding:34px;border:1px solid var(--l);border-radius:28px;background:linear-gradient(145deg,#0a0a16f5,#23113ae0);text-align:center}.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:2px solid #00e5ff66;background:#10101a;display:block;margin:0 auto 20px}.avatar.fallback{display:grid;place-items:center;font:900 38px Orbitron;color:var(--c)}.eyebrow{font:900 .7rem Orbitron;color:var(--c);letter-spacing:.16em}.name{font:900 clamp(2rem,6vw,3.5rem) Orbitron;margin:12px 0}.handle,.bio{color:var(--m)}.bio{line-height:1.7;max-width:600px;margin:18px auto}.badge{display:inline-block;padding:7px 12px;border:1px solid var(--l);border-radius:999px;color:#fff;background:#ffffff0a;font-size:.75rem;font-weight:800}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:25px}.btn{border:1px solid var(--l);border-radius:10px;background:#10101a;color:#fff;padding:11px 15px;font-weight:800;text-decoration:none}.primary{background:linear-gradient(90deg,var(--c),var(--v));color:#030308}.empty{padding:40px;color:var(--m);text-align:center}.member-stats{display:flex;justify-content:center;gap:28px;margin:18px 0;color:var(--m);font-size:.75rem}.member-stats b{display:block;font:900 18px Orbitron;color:#fff}.follow-status{margin-top:16px;color:var(--m);font-size:.85rem}.btn[disabled]{opacity:.55;cursor:not-allowed}</style></head>
<body data-crowrules-division="podcasting"><header class="nav"><a class="brand" href="index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header>
<main class="shell"><section id="profile" class="card"><div class="empty">Loading member profile…</div></section></main>
<footer class="footer">CrowRules Podcasting · Listen. Create. Share.</footer>
<script src="assets/js/app.js"></script><script src="js/crowrules-membership.js"></script><script src="js/crowrules-cinematic.js"></script>
<script>(async()=>{const el=document.getElementById("profile"),sb=await loadSupabase();const id=new URLSearchParams(location.search).get("user");const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));if(!id){el.innerHTML='<div class="empty">No member was specified.</div>';return}const r=await sb.from("podcast_member_profiles").select("user_id,display_name,username,bio,avatar_url,badge,is_public").eq("user_id",id).maybeSingle();if(r.error||!r.data||!r.data.is_public){el.innerHTML='<div class="empty">This member profile is not publicly available.</div>';return}const p=r.data,name=p.display_name||p.username||"CrowRules Member";const fc=await sb.from("podcast_member_follows").select("id",{count:"exact",head:true}).eq("followed_user_id",id);const fg=await sb.from("podcast_member_follows").select("id",{count:"exact",head:true}).eq("follower_user_id",id);const followers=fc.count||0,followingCount=fg.count||0;,initial=(name.trim()[0]||"C").toUpperCase();const me=(await sb.auth.getUser()).data.user; let following=false; if(me&&me.id!==id){const fq=await sb.from("podcast_member_follows").select("id").eq("follower_user_id",me.id).eq("followed_user_id",id).maybeSingle();following=!!fq.data} const followButton=me&&me.id!==id?'<button id="followBtn" class="btn primary">'+(following?"Following":"Follow Member")+'</button>':""; el.innerHTML='<img class="avatar '+(p.avatar_url?"":"fallback")+'" +(p.avatar_url?'src="'+esc(p.avatar_url)+'" alt="'+esc(name)+'" onerror="this.outerHTML=\'<div class=&quot;avatar fallback&quot;>'+initial+'</div>\'':'alt="">'+(p.avatar_url?"":initial)+'</div>'+'<div class="eyebrow">CROWRULES MEMBER</div><div class="member-stats"><span><b>'+followers+'</b> Followers</span><span><b>'+followingCount+'</b> Following</span></div><h1 class="name">'+esc(name)+'</h1>'+(p.username?'<div class="handle">@'+esc(p.username)+'</div>':"")+(p.badge?'<div style="margin-top:14px"><span class="badge">'+esc(p.badge)+'</span></div>':"")+(p.bio?'<p class="bio">'+esc(p.bio)+'</p>':"")+'<div class="actions">'+followButton+'<a class="btn" href="index.html">Podcasting Home</a><a class="btn" href="notifications.html">Notifications</a></div><div id="followStatus" class="follow-status"></div>'; if(me&&me.id!==id){const btn=document.getElementById("followBtn");btn.onclick=async()=>{btn.disabled=true;const q=following?await sb.from("podcast_member_follows").delete().eq("follower_user_id",me.id).eq("followed_user_id",id):await sb.from("podcast_member_follows").insert({follower_user_id:me.id,followed_user_id:id});if(!q.error){following=!following;btn.textContent=following?"Following":"Follow Member";document.getElementById("followStatus").textContent=following?"You are now following this member.":"You stopped following this member."}else document.getElementById("followStatus").textContent=q.error.message;btn.disabled=false}}})()</script></body></html>
