solid var(--l);border-radius:8px;background:#ffffff05}.friend-card img,.friend-fallback{width:48px;height:48px;border-radius:50%;object-fit:cover;margin:auto}.friend-fallback{display:grid;place-items:center;background:#10101a;color:var(--c);font:800 16px Orbitron}.friend-card a{display:block;color:#fff;text-decoration:none;font-size:10px;font-weight:800;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:500px){.friend-strip{grid-template-columns:repeat(2,1fr)}}@keyframes crSnow{to{transform:translateY(105vh) rotate(360deg)}}@keyframes crTwinkle{50%{opacity:.25;transform:scale(.7)}}@keyframes crFloat{50%{transform:translateY(-8px)}}.holiday-layer{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}.holiday-label{position:fixed;top:74px;right:12px;z-index:20;padding:7px 10px;border:1px solid #ffffff22;border-radius:999px;background:#05050bd9;color:#fff;font:900 9px Orbitron;letter-spacing:.12em}.holiday-snow{position:absolute;top:-10vh;color:#fff;text-shadow:0 0 10px #9eeaff;font-size:16px;animation:crSnow linear infinite}.holiday-star{position:absolute;color:#fff;font-size:15px;animation:crTwinkle 2s ease-in-out infinite}.holiday-pumpkin{position:absolute;font-size:28px;animation:crFloat 2.4s ease-in-out infinite}.holiday-heart{position:absolute;color:#ff5caa;font-size:20px;animation:crFloat 2s ease-in-out infinite}.holiday-bunny{position:absolute;font-size:25px;animation:crFloat 2.2s ease-in-out infinite}.holiday-confetti{position:absolute;width:7px;height:14px;background:currentColor;animation:crSnow linear infinite;opacity:.8}@media(prefers-reduced-motion:reduce){.holiday-snow,.holiday-star,.holiday-pumpkin,.holiday-heart,.holiday-bunny,.holiday-confetti{animation:none!important}} </style><style>.achievement-choice{width:100%;box-sizing:border-box;background:#0008;color:inherit;border:1px solid var(--c,#00e5ff)44;border-radius:10px;padding:8px;margin-top:8px}</style></head>

<script>(async()=>{const el=document.getElementById("profile"),sb=await loadSupabase(),params=new URLSearchParams(location.search),id=params.get("user"),usernameParam=(params.get("username")||"").trim().toLowerCase();const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));if(!id&&usernameParam){const ur=await sb.from("podcast_member_profiles").select("user_id").eq("username",usernameParam).maybeSingle();if(!ur.error&&ur.data)location.replace("member-profile.html?user="+encodeURIComponent(ur.data.user_id));else{el.innerHTML='<div class="empty">Member not found.</div>';return}}if(!id){el.innerHTML='<div class="empty">No member was specified.</div>';return}const me=(await sb.auth.getUser()).data.user;if(me&&me.id!==id){try{const key="crProfileViewed:"+id+":"+new Date().toISOString().slice(0,10);if(!sessionStorage.getItem(key)){const vr=await sb.from("podcast_profile_views").insert({profile_user_id:id,viewer_user_id:me.id});if(!vr.error)sessionStorage.setItem(key,"1")}}catch(e){}}const r=await sb.from("podcast_member_profiles").select("user_id,display_name,username,bio,tagline,location,website_url,cover_url,avatar_url,badge,is_public,activity_public,network_public,followers_public,following_public,mood,interests,favorite_music,favorite_movies,favorite_games,profile_theme").eq("user_id",id).maybeSingle();if(r.error||!r.data||(!r.data.is_public&&(!me||me.id!==id))){el.innerHTML='<div class="empty">This member profile is not publicly available.</div>';return}const p=r.data;document.body.dataset.profileTheme=p.profile_theme||"cyber";const name=p.display_name||p.username||"CrowRules Member",initial=(name.trim()[0]||"C").toUpperCase();const stats=await sb.from("podcast_member_profile_stats").select("published_podcasts,published_episodes,total_plays,member_followers,member_following,profile_views,episode_comments,episode_reactions,listening_seconds,crowpoints").eq("user_id",id).maybeSingle();const st=stats.data||{};const followers=Number(st.member_followers||0),followingCount=Number(st.member_following||0);const fmt=n=>Number(n||0).toLocaleString();const hours=(Number(st.listening_seconds||0)/3600).toFixed(1);let following=false,mutual=false;if(me&&me.id!==id){const [fq,mq]=await Promise.all([sb.from("podcast_member_follows").select("id").eq("follower_user_id",me.id).eq("followed_user_id",id).maybeSingle(),sb.from("podcast_member_follows").select("id").eq("follower_user_id",id).eq("followed_user_id",me.id).maybeSingle()]);following=!!fq.data;mutual=!!mq.data}const avatar=p.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'" alt="'+esc(name)+'">':'<div class="avatar fallback">'+esc(initial)+'</div>';const showNetwork=p.network_public!==false||!!(me&&me.id===id);const followButton=me&&me.id!==id?'<button id="followBtn" class="btn primary">'+(following?"Following":"Follow Member")+'</button>':"";el.innerHTML=(p.cover_url?'<img class="cover" src="'+esc(p.cover_url)+'" alt="Profile cover">':"")+avatar+'<div class="eyebrow">CROWRULES MEMBER</div><div class="member-stats">'+(showNetwork?'<span><b>'+followers+'</b> Followers</span><span><b>'+followingCount+'</b> Following</span>':"")+(showNetwork&&mutual?'<span><b>↔</b> Mutual</span>':"")+(showNetwork?'<div class="profile-stat-grid"><div class="profile-stat"><b>'+fmt(st.published_podcasts)+'</b><span>SHOWS</span></div><div class="profile-stat"><b>'+fmt(st.published_episodes)+'</b><span>EPISODES</span></div><div class="profile-stat"><b>'+fmt(st.total_plays)+'</b><span>PLAYS</span></div><div class="profile-stat"><b>'+fmt(st.profile_views)+'</b><span>PROFILE VIEWS</span></div><div class="profile-stat"><b>'+fmt(st.episode_comments)+'</b><span>COMMENTS</span></div><div class="profile-stat"><b>'+fmt(st.episode_reactions)+'</b><span>REACTIONS</span></div><div class="profile-stat"><b>'+hours+'</b><span>LISTENING HOURS</span></div><div class="profile-stat"><b>'+fmt(st.crowpoints)+'</b><span>CROWPOINTS</span></div></div>':"")+'</div><h1 class="name">'+esc(name)+'</h1>'+(p.tagline?'<div class="tagline">'+esc(p.tagline)+'</div>':"")+(p.location?'<div class="location">📍 '+esc(p.location)+'</div>':"")+(p.website_url?'<div class="website"><a style="color:var(--c)" href="'+esc(p.website_url)+'" target="_blank" rel="noopener">Visit website ↗</a></div>':"")+(p.username?'<div class="handle"><a style="color:var(--m);text-decoration:none" href="member-profile.html?username='+encodeURIComponent(p.username)+'">@'+esc(p.username)+'</a></div>':"")+(p.badge?'<div style="margin-top:14px"><span class="badge">'+esc(p.badge)+'</span></div>':"")+(p.bio?'<p class="bio">'+esc(p.bio)+'</p>':"")+'<div class="actions">'+followButton+'<a class="btn" href="member-activity.html">Member Network</a><a class="btn" href="index.html">Podcasting Home</a><a class="btn" href="notifications.html">Notifications</a></div><button id="shareProfile" class="btn" type="button" style="margin-top:12px">SHARE PROFILE</button><button id="blockMember" class="btn" type="button" style="margin-top:12px;margin-left:6px">BLOCK MEMBER</button><button id="reportMember" class="btn" type="button" style="margin-top:12px;margin-left:6px">REPORT MEMBER</button><section class="myspace-box" id="profileAchievements" style="margin-top:18px"><div class="section-title">🏆 ACHIEVEMENTS <span id="achievementCount" style="float:right;font-size:11px;opacity:.75"></span></div><div id="featuredAchievement" style="margin:0 0 12px;padding:12px;border-radius:12px;background:#0006;border:1px solid var(--c,#00e5ff)33"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><select id="achievementSort" class="achievement-choice" style="max-width:220px"><option value="newest">Newest Unlocked</option><option value="name">Name</option><option value="unlocked">Unlocked First</option></select></div><div id="achievementGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px"></div></section><div id="myspaceExtras"></div><div id="followStatus" class="follow-status">'+(mutual?"↔ You and this member follow each other.":"")+'</div><div class="network-list"><input id="networkSearch" placeholder="SEARCH THIS MEMBER NETWORK..." style="width:100%;padding:12px;border-radius:12px;background:#090912;color:#fff;border:1px solid var(--l);box-sizing:border-box"></div><div id="networkTabs" class="actions" style="margin-top:18px"><button class="btn primary" data-tab="all">ALL</button><button class="btn" data-tab="followers">FOLLOWERS</button><button class="btn" data-tab="following">FOLLOWING</button><button class="btn" data-tab="mutual">MUTUAL</button></div><div class="actions" style="margin-top:8px"><button id="networkSort" class="btn" type="button">SORT: RECENT</button></div><div id="networkLists" class="network-list"></div><div class="activity"><h2>PUBLIC PODCAST ACTIVITY</h2><div id="activity" class="activity-grid"><div class="empty">Loading activity…</div></div></div>';async function loadNetworkLists(){const box=document.getElementById("networkLists");if(!box)return;const owner=!!(me&&me.id===id);const canFollowers=owner||p.followers_public!==false;const canFollowing=owner||p.following_public!==false;let html="";const render=async(label,rows)=>{if(!rows.length)return "";const ids=rows.map(x=>x.user_id);const pr=await sb.from("podcast_member_profiles").select("user_id,display_name,username,avatar_url,is_public,network_public").in("user_id",ids);const map=new Map((pr.data||[]).map(x=>[x.user_id,x]));return '<div data-network="'+label.toLowerCase()+'" style="margin-top:18px"><h2>'+label+'</h2><div class="network-grid">'+rows.map(x=>{const q=map.get(x.user_id)||{};if(q.network_public===false&&q.user_id!==me?.id)return "";const n=q.display_name||q.username||"CrowRules Member";const av=q.avatar_url?'<img src="'+esc(q.avatar_url)+'" alt="">':'<div class="network-avatar">'+esc((n[0]||"C").toUpperCase())+'</div>';return '<div class="network-row">'+av+'<a href="member-profile.html?username='+encodeURIComponent(q.username||"")+'">'+esc(n)+'</a></div>'}).join("")+'</div></div>'};if(canFollowers){const q=await sb.from("podcast_member_follows").select("follower_user_id").eq("followed_user_id",id).order("created_at",{ascending:false}).limit(20);html+=await render("FOLLOWERS",(q.data||[]).map(x=>({user_id:x.follower_user_id})))}else html+='<div class="empty">Followers are private.</div>';if(canFollowing){const q=await sb.from("podcast_member_follows").select("followed_user_id").eq("follower_user_id",id).order("created_at",{ascending:false}).limit(20);html+=await render("FOLLOWING",(q.data||[]).map(x=>({user_id:x.followed_user_id})))}else html+='<div class="empty">Following is private.</div>';box.innerHTML=html||'<div class="empty">No public network connections yet.</div>'}

atar&&oldAvatar.includes("/storage/v1/object/public/podcast-avatars/")){try{const marker="/storage/v1/object/public/podcast-avatars/";const oldPath=decodeURIComponent(oldAvatar.split(marker)[1].split("?")[0]);if(oldPath.startsWith(id+"/"))await sb.storage.from("podcast-avatars").remove([oldPath])}catch(e){}}m.textContent="Profile saved.";setTimeout(()=>location.reload(),500)}b.disabled=false}}if(me&&me.id!==id){const reportBtn=document.getElementById("reportMember");if(reportBtn){reportBtn.onclick=async()=>{const reason=prompt("Why are you reporting this member?");if(!reason||reason.trim().length<3)return;const ok=confirm("Submit this report to CrowRules administrators?");if(!ok)return;reportBtn.disabled=true;const rr=await sb.from("podcast_member_reports").insert({reporter_user_id:me.id,reported_user_id:id,reason:reason.trim()});document.getElementById("followStatus").textContent=rr.error?(rr.error.code==="23505"?"You already have an open report for this member.":rr.error.message):"Report submitted to CrowRules administrators.";reportBtn.disabled=false}}const blockBtn=document.getElementById("blockMember");if(blockBtn){const br=await sb.from("podcast_member_blocks").select("id").eq("blocker_user_id",me.id).eq("blocked_user_id",id).maybeSingle();let blocked=!!br.data;blockBtn.textContent=blocked?"UNBLOCK MEMBER":"BLOCK MEMBER";blockBtn.onclick=async()=>{blockBtn.disabled=true;const q=blocked?await sb.from("podcast_member_blocks").delete().eq("blocker_user_id",me.id).eq("blocked_user_id",id):await sb.from("podcast_member_blocks").insert({blocker_user_id:me.id,blocked_user_id:id});if(!q.error){blocked=!blocked;blockBtn.textContent=blocked?"UNBLOCK MEMBER":"BLOCK MEMBER";document.getElementById("followStatus").textContent=blocked?"Member blocked.":"Member unblocked."}else document.getElementById("followStatus").textContent=q.error.message;blockBtn.disabled=false}}const blockState=await sb.from("podcast_member_blocks").select("id").eq("blocker_user_id",me.id).eq("blocked_user_id",id).maybeSingle();if(blockState.data){document.getElementById("followBtn").disabled=true;document.getElementById("followBtn").textContent="BLOCKED";document.getElementById("followStatus").textContent="You have blocked this member.";return;}const btn=document.getElementById("followBtn");btn.onclick=async()=>{btn.disabled=true;const q=following?await sb.from("podcast_member_follows").delete().eq("follower_user_id",me.id).eq("followed_user_id",id):await sb.from("podcast_member_follows").insert({follower_user_id:me.id,followed_user_id:id});if(!q.error){following=!following;btn.textContent=following?"Following":"Follow Member";document.getElementById("followStatus").textContent=following?(mutual?"↔ You and this member follow each other.":"You are now following this member."):"You stopped following this member.";mutual=following&&mutual}else document.getElementById("followStatus").textContent=q.error.message;btn.disabled=false}}})();
function initHolidayTheme(){const layer=document.getElementById("holidayLayer"),label=document.getElementById("holidayLabel");if(!layer||!label)return;const now=new Date(),m=now.getMonth()+1,d=now.getDate();let theme="";if(m===10){theme="HALLOWEEN";for(let i=0;i<16;i++){const x=document.createElement("div");x.className="holiday-pumpkin";x.textContent=i%2?"👻":"🎃";x.style.left=Math.random()*100+"%";x.style.top=8+Math.random()*82+"%";x.style.animationDelay=Math.random()*2+"s";layer.appendChild(x)}}else if(m===12){theme="HOLIDAY";for(let i=0;i<45;i++){const x=document.createElement("div");x.className="holiday-snow";x.textContent=i%8?"❄":"✦";x.style.left=Math.random()*100+"%";x.style.animationDuration=6+Math.random()*8+"s";x.style.animationDelay=-Math.random()*10+"s";x.style.fontSize=8+Math.random()*14+"px";layer.appendChild(x)}}else if(m===2&&d<=14){theme="VALENTINE'S";for(let i=0;i<20;i++){const x=document.createElement("div");x.className="holiday-heart";x.textContent=i%2?"♥":"❤";x.style.left=Math.random()*100+"%";x.style.top=Math.random()*90+"%";x.style.animationDelay=Math.random()*2+"s";layer.appendChild(x)}}else if(m===4&&d<=20){theme="EASTER";for(let i=0;i<12;i++){const x=document.createElement("div");x.className="holiday-bunny";x.textContent=i%2?"🌸":"🐰";x.style.left=Math.random()*100+"%";x.style.top=Math.random()*90+"%";x.style.animationDelay=Math.random()*2+"s";layer.appendChild(x)}}else if(m===3&&d<=17){theme="ST. PATRICK'S DAY";for(let i=0;i<24;i++){const x=document.createElement("div");x.className="holiday-heart";x.textContent=i%2?"☘":"🍀";x.style.color="#54e878";x.style.left=Math.random()*100+"%";x.style.top=Math.random()*90+"%";x.style.animationDelay=Math.random()*2+"s";layer.appendChild(x)}}else if(m===7&&d<=4){theme="INDEPENDENCE DAY";for(let i=0;i<35;i++){const x=document.createElement("div");x.className="holiday-confetti";x.style.left=Math.random()*100+"%";x.style.top="-10vh";x.style.color=i%2?"#ff5577":"#7de8ff";x.style.animationDuration=4+Math.random()*5+"s";x.style.animationDelay=-Math.random()*6+"s";layer.appendChild(x)}}else if(m===11&&d>=15){theme="THANKSGIVING";for(let i=0;i<18;i++){const x=document.createElement("div");x.className="holiday-pumpkin";x.textContent=i%2?"🍂":"🦃";x.style.left=Math.random()*100+"%";x.style.top=Math.random()*90+"%";x.style.animationDelay=Math.random()*2+"s";layer.appendChild(x)}}else if(m===1&&d<=7){theme="NEW YEAR";for(let i=0;i<35;i++){const x=document.createElement("div");x.className="holiday-confetti";x.style.left=Math.random()*100+"%";x.style.top="-10vh";x.style.color=i%3===0?"#ffd166":i%3===1?"#7de8ff":"#ff6bd6";x.style.animationDuration=4+Math.random()*5+"s";x.style.animationDelay=-Math.random()*6+"s";layer.appendChild(x)}}else{const effect=p.profile_theme;if(["stars","snow","hearts","confetti"].includes(effect)){theme=effect.toUpperCase();for(let i=0;i<35;i++){const x=document.createElement("div");x.className=effect==="stars"?"holiday-star":effect==="snow"?"holiday-snow":effect==="hearts"?"holiday-heart":"holiday-confetti";x.textContent=effect==="stars"?"✦":effect==="snow"?"❄":effect==="hearts"?"♥":"";x.style.left=Math.random()*100+"%";x.style.top=effect==="snow"||effect==="confetti"?"-10vh":Math.random()*90+"%";x.style.animationDuration=(5+Math.random()*7)+"s";x.style.animationDelay=-Math.random()*8+"s";layer.appendChild(x)}}}if(theme){label.textContent="✦ "+theme+" ✦";label.style.display="block"}document.body.dataset.profileEffect=theme?"seasonal":(p.profile_theme||"cyber")}initHolidayTheme();
