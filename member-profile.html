<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05050b">
<meta name="description" content="Universal CrowRules member profile.">
<title>Member Profile — CrowRules Podcasting</title>
<link rel="stylesheet" href="css/podcasting.css">
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/podcasting.js" defer></script>
<script src="js/player.js" defer></script>
<script src="js/app.js" defer></script>
<style>
:root{--cyan:#55e7ff;--purple:#9b6cff;--panel:#090d17;--panel2:#0d1220;--muted:#8c97ab}
.profile-wrap{padding:28px 0 110px}.profile-shell{max-width:1120px;margin:auto}
.profile-cover{height:320px;border:1px solid #ffffff12;border-radius:28px 28px 0 0;overflow:hidden;position:relative;background:radial-gradient(circle at 18% 15%,#55e7ff55,transparent 34%),radial-gradient(circle at 78% 20%,#9b6cff50,transparent 36%),linear-gradient(135deg,#080b14,#141025 55%,#070910)}
.profile-cover img{width:100%;height:100%;object-fit:cover}.cover-shade{position:absolute;inset:0;background:linear-gradient(180deg,#05050b05 15%,#05050b40 55%,#05050be8 100%)}
.cover-meta{position:absolute;left:28px;bottom:22px;display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#05050b9c;border:1px solid #ffffff18;color:#dce5f7;font-size:9px;text-transform:uppercase;letter-spacing:.1em}
.profile-main{background:var(--panel);border:1px solid #ffffff12;border-top:0;border-radius:0 0 28px 28px;padding:0 32px 28px}
.profile-head{display:grid;grid-template-columns:154px minmax(0,1fr) auto;gap:22px;align-items:end;margin-top:-76px;position:relative}
.avatar{width:154px;height:154px;border-radius:50%;border:5px solid var(--panel);background:radial-gradient(circle at 30% 25%,var(--cyan),#54308a 55%,#080a12);overflow:hidden;display:grid;place-items:center;box-shadow:0 18px 55px #000b}.avatar img{width:100%;height:100%;object-fit:cover}.avatar span{font:800 38px Orbitron;color:#fff}
.profile-name h1{font-size:36px;margin:0 0 5px;line-height:1.1}.username{color:#7f8ba3;font-size:12px}.tagline{color:#aeb8cb;font-size:13px;margin-top:8px;max-width:650px;line-height:1.5}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:#55e7ff10;border:1px solid #55e7ff28;color:#72eaff;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:9px}
.profile-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.profile-stats{display:flex;gap:0;margin:28px 0 0;border-top:1px solid #ffffff0d;border-bottom:1px solid #ffffff0d;overflow:auto}.profile-stat{padding:17px 26px 17px 0;margin-right:26px;min-width:82px}.profile-stat strong{display:block;font:800 20px Orbitron}.profile-stat span{font-size:9px;color:#7f899d;text-transform:uppercase;letter-spacing:.12em}
.profile-layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;margin-top:18px}.profile-card{background:var(--panel2);border:1px solid #ffffff10;border-radius:20px;padding:22px}.profile-card h2{font-size:17px;margin:0 0 16px}.profile-card h3{font-size:12px;margin:0 0 8px}
.about-list{display:grid;gap:14px}.about-item{display:flex;gap:11px;color:#9ba5b9;font-size:11px;line-height:1.5}.about-item b{color:#eef2ff;font-weight:700}.about-item a{color:var(--cyan);overflow-wrap:anywhere}
.profile-tabs{display:flex;gap:5px;border-bottom:1px solid #ffffff0d;margin:-4px 0 18px;overflow:auto}.profile-tabs button{background:none;border:0;color:#818ba0;padding:12px 13px;font:700 9px Montserrat;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;white-space:nowrap}.profile-tabs button.active{color:#fff;border-bottom:2px solid var(--cyan)}
.feed{display:grid;gap:14px}.feed-item{padding:18px;border:1px solid #ffffff0d;border-radius:16px;background:#080b13}.feed-top{display:flex;gap:10px;align-items:center}.feed-avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;background:#151b2d;display:grid;place-items:center;font:800 10px Orbitron}.feed-avatar img{width:100%;height:100%;object-fit:cover}.feed-item h3{font-size:13px;margin:12px 0 6px}.feed-item p{font-size:12px;color:#a0a9bb;line-height:1.65;margin:0;white-space:pre-wrap}.feed-time{font-size:9px;color:#68738a}.feed-source{font-size:8px;color:#657086;text-transform:uppercase;letter-spacing:.1em;margin-top:10px}
.composer{padding:20px;border:1px solid #ffffff10;border-radius:18px;background:linear-gradient(145deg,#0b1020,#080b13);margin-bottom:16px}.composer h3{margin:0 0 6px;font-size:15px}.composer p{margin:0 0 14px;color:#7f8ba1;font-size:10px}.composer-grid{display:grid;gap:10px}.composer input,.composer textarea{width:100%;box-sizing:border-box;background:#060912;border:1px solid #ffffff14;border-radius:11px;color:#fff;padding:12px;font:inherit}.composer textarea{min-height:105px;resize:vertical}.composer-footer{display:flex;justify-content:space-between;gap:10px;align-items:center}.char-count{font-size:9px;color:#69758b}.comment-thread{margin-top:14px;padding-top:14px;border-top:1px solid #ffffff0b}.comment{padding:11px 0}.comment.reply{margin-left:34px;padding-left:13px;border-left:1px solid #ffffff10}.comment-top{display:flex;gap:8px;align-items:center}.comment-avatar{width:28px;height:28px;border-radius:50%;overflow:hidden;background:#151b2d;display:grid;place-items:center;font:700 8px Orbitron;flex:none}.comment-avatar img{width:100%;height:100%;object-fit:cover}.comment-author{font-size:10px}.comment-time{font-size:8px;color:#667188}.comment-body{font-size:11px;line-height:1.55;color:#aab3c5;margin:6px 0 0 36px;white-space:pre-wrap}.comment-actions{display:flex;gap:10px;margin:7px 0 0 36px}.comment-actions button{border:0;background:none;color:#718099;font:700 8px Montserrat;text-transform:uppercase;letter-spacing:.08em;padding:0;cursor:pointer}.reply-box{margin:8px 0 0 36px;display:none;gap:7px}.reply-box.open{display:flex}.reply-box input{flex:1;background:#060912;border:1px solid #ffffff12;border-radius:9px;color:#fff;padding:9px;font:inherit}.post-card{padding:18px;border:1px solid #ffffff0d;border-radius:16px;background:#080b13}.post-card .post-meta{font-size:9px;color:#6f7a90}.post-card h3{margin:8px 0;font-size:14px}.post-card p{font-size:12px;line-height:1.65;color:#aeb7c9;white-space:pre-wrap}.post-actions{display:flex;gap:14px;font-size:9px;color:#738097;margin-top:12px}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mini-stat{padding:14px;border:1px solid #ffffff0d;border-radius:14px;background:#080b13}.mini-stat strong{display:block;font:800 17px Orbitron}.mini-stat span{display:block;margin-top:5px;color:#77839a;font-size:8px;text-transform:uppercase;letter-spacing:.1em}
.empty-profile{padding:30px;border:1px dashed #ffffff14;border-radius:16px;color:#788298;text-align:center;font-size:11px;line-height:1.7}.notice{padding:14px;border-radius:12px;background:#ffffff06;border:1px solid #ffffff0c;color:#8e99ad;font-size:11px;line-height:1.6}
.media-editor{display:grid;grid-template-columns:1fr 1fr;gap:12px}.media-box{border:1px solid #ffffff10;border-radius:15px;background:#080b13;padding:13px}.media-preview{height:105px;border-radius:11px;overflow:hidden;background:radial-gradient(circle at 30% 20%,#55e7ff30,#151022 55%,#060811);display:grid;place-items:center;margin-bottom:10px;color:#65728a;font-size:9px;text-align:center}.media-preview.banner{height:90px}.media-preview img{width:100%;height:100%;object-fit:cover}.media-box input[type=file]{width:100%;font-size:9px;color:#8b96aa}.media-help{font-size:8px;color:#68748a;line-height:1.5;margin-top:7px}.edit-grid{display:grid;gap:13px}.edit-grid label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#8d97aa}.edit-grid input,.edit-grid textarea{width:100%;box-sizing:border-box;margin-top:7px;background:#070a12;border:1px solid #ffffff16;border-radius:10px;color:#fff;padding:11px;font:inherit}.edit-grid textarea{min-height:90px;resize:vertical}.edit-checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{padding:12px;border:1px solid #ffffff10;border-radius:12px;background:#080b13;font-size:10px;color:#9aa5b8}.check input{margin-right:7px}
.hidden{display:none!important}.loading-screen{padding:55px;text-align:center}.error-box{border:1px solid #ff657533;background:#ff65730c;color:#ffb4bc}.skeleton{height:12px;border-radius:8px;background:#ffffff08;margin:10px 0}
@media(max-width:800px){.media-editor{grid-template-columns:1fr}.profile-cover{height:230px}.profile-main{padding:0 18px 24px}.profile-head{grid-template-columns:108px minmax(0,1fr);gap:14px;margin-top:-54px}.avatar{width:108px;height:108px}.avatar span{font-size:27px}.profile-name h1{font-size:25px}.profile-actions{grid-column:1/-1;justify-content:flex-start}.profile-layout{grid-template-columns:1fr}.profile-stat{min-width:95px}.edit-checks{grid-template-columns:1fr}.cover-meta{left:16px;bottom:14px}}
</style>
</head>
<body>
<div data-nav></div>
<main class="wrap profile-wrap"><div class="profile-shell">
<div id="loading" class="notice loading-screen">Loading member profile…</div>
<div id="error" class="notice error-box hidden"></div>
<div id="profile" class="hidden">
<section class="profile-cover">
<img id="coverImg" class="hidden" alt="">
<div class="cover-shade"></div>
<div class="cover-meta"><span class="pill" id="visibilityPill">Public profile</span><span class="pill" id="memberPill">CrowRules Member</span></div>
</section>
<section class="profile-main">
<div class="profile-head">
<div id="avatar" class="avatar"></div>
<div class="profile-name"><div id="badge"></div><h1 id="name">Member</h1><div id="username" class="username"></div><div id="tagline" class="tagline"></div></div>
<div id="actions" class="profile-actions"></div>
</div>
<div class="profile-stats">
<div class="profile-stat"><strong id="followers">0</strong><span>Followers</span></div>
<div class="profile-stat"><strong id="following">0</strong><span>Following</span></div>
<div class="profile-stat"><strong id="podcasts">0</strong><span>Podcasts</span></div>
<div class="profile-stat"><strong id="episodes">0</strong><span>Episodes</span></div>
<div class="profile-stat"><strong id="plays">0</strong><span>Plays</span></div>
<div class="profile-stat"><strong id="points">0</strong><span>CrowPoints</span></div>
</div>
</section>
<div class="profile-layout">
<aside>
<section class="profile-card"><h2>About</h2><div id="about" class="about-list"></div></section>
<section class="profile-card" style="margin-top:18px"><h2>Member since</h2><div id="since" class="notice"></div></section>
<section class="profile-card" style="margin-top:18px"><h2>Member Snapshot</h2><div id="snapshot" class="stats-grid"></div></section>
</aside>
<section class="profile-card">
<div class="profile-tabs">
<button class="active" data-tab="activity">Activity</button>
<button data-tab="posts">Posts</button>
<button data-tab="profileTab">Profile</button>
</div>
<div id="activityTab" class="feed"></div>
<div id="postsTab" class="feed hidden"></div>
<div id="profileTab" class="hidden"></div>
</section>
</div>
</div></div></main>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString();
const qs=new URLSearchParams(location.search);
const target=(qs.get("user")||qs.get("id")||"").trim();
let profileData=null, statsData={}, self=false, sessionUser=null;

function initials(name){return String(name||"Member").trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"M"}
function safeDate(v,full=false){if(!v)return"";const d=new Date(v);if(Number.isNaN(d.getTime()))return"";return d.toLocaleDateString(undefined,full?{month:"long",day:"numeric",year:"numeric"}:{month:"long",year:"numeric"})}
function safeTime(v){if(!v)return"";const d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})}
function imageMarkup(url,alt){return url?'<img src="'+esc(url)+'" alt="'+esc(alt||"")+'" loading="lazy">':""}
function linkMarkup(url){if(!url)return"";let href=String(url).trim();if(!/^https?:\/\//i.test(href))href="https://"+href;return '<a href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+esc(url)+'</a>'}
function showError(message){$("loading").classList.add("hidden");$("error").textContent=message;$("error").classList.remove("hidden")}
function getUser(){return window.__CROW_USER||sessionUser||null}

async async function waitForSupabase(timeout=12000){
 const start=Date.now();
 while(!window.CROW_SUPABASE){
  if(!window.supabase && !window.__CROW_SUPABASE_LOADER){
   window.__CROW_SUPABASE_LOADER=new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
   });
  }
  if(window.supabase && window.CROW_CONFIG && !window.CROW_SUPABASE){
   window.CROW_SUPABASE=window.supabase.createClient(window.CROW_CONFIG.supabaseUrl,window.CROW_CONFIG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
  }
  if(window.CROW_SUPABASE)break;
  if(window.CROW_APP?.init){try{await window.CROW_APP.init()}catch(e){}}
  if(window.CROW_SUPABASE)break;
  if(Date.now()-start>timeout)throw new Error("Supabase is still connecting. Please wait a moment and refresh.");
  await new Promise(r=>setTimeout(r,150));
 }
 return window.CROW_SUPABASE;
}
async function resolveSession(){
 const sb=await waitForSupabase();
 if(sb?.auth){
  const r=await sb.auth.getUser();
  if(!r.error&&r.data?.user)sessionUser=r.data.user;
 }
 return getUser();
}

async function loadProfile(){
 try{
  const sb=await waitForSupabase();
  const user=await resolveSession();
  let row=null;
  if(target){
   const r=await CROW_SUPABASE.from("podcast_member_profiles").select("*").eq("user_id",target).maybeSingle();
   if(r.error)throw r.error;
   row=r.data;
   if(!row){
    const m=await CROW_SUPABASE.from("members").select("user_id,display_name,username,first_name,last_name,bio,avatar_url,created_at").eq("user_id",target).maybeSingle();
    if(!m.error&&m.data&&user&&user.id===target)row={user_id:target,display_name:m.data.display_name||[m.data.first_name,m.data.last_name].filter(Boolean).join(" ")||"CrowRules Member",username:m.data.username,bio:m.data.bio,avatar_url:m.data.avatar_url,created_at:m.data.created_at,is_public:true,activity_public:true,network_public:true,followers_public:true,following_public:true};
   }
  }else if(user){
   const r=await CROW_SUPABASE.from("podcast_member_profiles").select("*").eq("user_id",user.id).maybeSingle();
   if(r.error)throw r.error;
   row=r.data;
   if(!row){
    const m=await CROW_SUPABASE.from("members").select("user_id,display_name,username,first_name,last_name,bio,avatar_url,created_at").eq("user_id",user.id).maybeSingle();
    if(!m.error&&m.data)row={user_id:user.id,display_name:m.data.display_name||[m.data.first_name,m.data.last_name].filter(Boolean).join(" ")||"CrowRules Member",username:m.data.username,bio:m.data.bio,avatar_url:m.data.avatar_url,created_at:m.data.created_at,is_public:true,activity_public:true,network_public:true,followers_public:true,following_public:true};
   }
  }else{
   showError("Sign in to view your member profile.");
   return;
  }
  if(!row){showError("This member profile is unavailable or private. If this is your profile, open Account first to initialize your CrowRules account.");return}
  if(row.is_public===false && (!user||user.id!==row.user_id)){showError("This member profile is private.");return}
  profileData=row;self=!!user&&user.id===row.user_id;
  renderProfile();
  await Promise.all([loadStats(),loadActivity(),loadPosts()]);
  }catch(e){
  console.error("CrowRules member profile:",e);
  const message=e?.message||"Unknown profile error.";
  showError("Unable to load this member profile right now. "+message);
 }
}

function renderProfile(){
 const p=profileData,name=p.display_name||p.username||"CrowRules Member";
 $("loading").classList.add("hidden");$("error").classList.add("hidden");$("profile").classList.remove("hidden");
 $("name").textContent=name;$("username").textContent=p.username?"@"+p.username:"";$("tagline").textContent=p.tagline||p.bio||"Part of the CrowRules universe.";
 $("badge").innerHTML=p.badge?'<span class="badge">'+esc(p.badge)+"</span>":"";
 $("avatar").innerHTML=imageMarkup(p.avatar_url,name)||"<span>"+esc(initials(name))+"</span>";
 if(p.cover_url){$("coverImg").src=p.cover_url;$("coverImg").alt=name+" cover";$("coverImg").classList.remove("hidden")}
 $("visibilityPill").textContent=p.is_public===false?"Private profile":"Public profile";
 $("actions").innerHTML=self?'<button class="btn primary" id="editBtn">Edit profile</button><a class="btn" href="account.html">Account</a>':'<button class="btn primary" id="followBtn">Follow</button><button class="btn" id="messageBtn">Message</button>';
 $("about").innerHTML=aboutHtml(p);
 $("since").textContent=safeDate(p.created_at,true)||"CrowRules member";
 $("profileTab").innerHTML=profileDetailsHtml(p)+(self?profileMediaEditorHtml(p):""); if(self) wireMediaEditor();
 $("snapshot").innerHTML='<div class="mini-stat"><strong id="snapMinutes">0</strong><span>Listening min</span></div><div class="mini-stat"><strong id="snapComments">0</strong><span>Comments</span></div><div class="mini-stat"><strong id="snapReactions">0</strong><span>Reactions</span></div><div class="mini-stat"><strong id="snapViews">0</strong><span>Profile views</span></div>';
 if(self)$("editBtn").onclick=editProfile;
}

function aboutHtml(p){
 const rows=[
  p.location?'<div class="about-item">📍 <span><b>Lives in</b><br>'+esc(p.location)+"</span></div>":"",
  p.website_url?'<div class="about-item">🔗 <span><b>Website</b><br>'+linkMarkup(p.website_url)+"</span></div>":"",
  p.interests?'<div class="about-item">✨ <span><b>Interests</b><br>'+esc(p.interests)+"</span></div>":"",
  p.favorite_music?'<div class="about-item">🎵 <span><b>Music</b><br>'+esc(p.favorite_music)+"</span></div>":"",
  p.favorite_movies?'<div class="about-item">🎬 <span><b>Movies</b><br>'+esc(p.favorite_movies)+"</span></div>":"",
  p.favorite_games?'<div class="about-item">🎮 <span><b>Games</b><br>'+esc(p.favorite_games)+"</span></div>":"",
  p.mood?'<div class="about-item">🌙 <span><b>Current mood</b><br>'+esc(p.mood)+"</span></div>":"",
  p.featured_achievement?'<div class="about-item">🏆 <span><b>Achievement</b><br>'+esc(p.featured_achievement)+"</span></div>":""
 ];
 return rows.filter(Boolean).join("")||'<div class="empty-profile">This member has not added profile details yet.</div>';
}
function profileMediaEditorHtml(p){
 return '<div style="margin-top:22px"><h2>Profile Media</h2><div class="notice" style="margin-bottom:14px">Upload a square avatar and a cinematic profile banner. Images are stored in your CrowRules member media folder.</div><div class="media-editor"><div class="media-box"><div class="media-preview" id="avatarPreview">'+(p.avatar_url?imageMarkup(p.avatar_url,"Avatar"):"Current avatar")+'</div><strong style="font-size:11px">Avatar</strong><div class="media-help">PNG, JPG, WEBP · max 5 MB · recommended 800×800</div><input id="avatarUpload" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="media-box"><div class="media-preview banner" id="bannerPreview">'+(p.cover_url?imageMarkup(p.cover_url,"Banner"):"Current banner")+'</div><strong style="font-size:11px">Banner</strong><div class="media-help">PNG, JPG, WEBP · max 10 MB · recommended 1600×500</div><input id="bannerUpload" type="file" accept="image/png,image/jpeg,image/webp"></div></div></div>';
}
function wireMediaEditor(){
 const a=$("avatarUpload"),b=$("bannerUpload"); if(a)a.onchange=()=>uploadMemberImage(a.files[0],"avatar"); if(b)b.onchange=()=>uploadMemberImage(b.files[0],"banner");
}
async function uploadMemberImage(file,type){
 if(!file)return;
 const max=type==="avatar"?5:10;
 if(!/^image\/(png|jpeg|webp)$/i.test(file.type)||file.size>max*1024*1024){alert("Please choose a PNG, JPG, or WEBP image under "+max+" MB.");return}
 const user=getUser();if(!user){alert("Sign in to upload profile media.");return}
 const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
 const path=user.id+"/member/"+type+"-"+Date.now()+"."+ext;
 try{
  const sb=await waitForSupabase();
  const up=await sb.storage.from("podcast-avatars").upload(path,file,{contentType:file.type,upsert:true,cacheControl:"3600"});
  if(up.error)throw up.error;
  const pub=sb.storage.from("podcast-avatars").getPublicUrl(path);
  const url=pub.data.publicUrl;
  const patch=type==="avatar"?{avatar_url:url}:{cover_url:url};
  const save=await sb.from("podcast_member_profiles").update(patch).eq("user_id",user.id);
  if(save.error)throw save.error;
  profileData={...profileData,...patch};
  if(type==="avatar"){ $("avatar").innerHTML=imageMarkup(url,profileData.display_name||"Member"); const preview=$("avatarPreview");if(preview)preview.innerHTML=imageMarkup(url,"Avatar");}
  else { const img=$("coverImg");img.src=url;img.alt="Profile banner";img.classList.remove("hidden");const preview=$("bannerPreview");if(preview)preview.innerHTML=imageMarkup(url,"Banner");}
  alert(type==="avatar"?"Avatar uploaded.":"Banner uploaded.");
 }catch(e){console.error("member media upload",e);alert("Upload failed. "+(e?.message||"Please try again."))}
}
function profileDetailsHtml(p){
 return '<div class="about-list"><div><h3>Bio</h3><div class="notice">'+esc(p.bio||"No bio has been added yet.")+'</div></div><div><h3>Tagline</h3><div class="notice">'+esc(p.tagline||"No tagline has been added yet.")+'</div></div><div><h3>Interests</h3><div class="notice">'+esc(p.interests||"No interests have been added yet.")+'</div></div></div>';
}

async function loadStats(){
 try{
  const r=await CROW_SUPABASE.from("podcast_member_profile_stats").select("published_podcasts,published_episodes,total_plays,member_followers,member_following,episode_comments,episode_reactions,profile_views,listening_seconds,crowpoints").eq("user_id",profileData.user_id).maybeSingle();
  if(r.error)throw r.error;
  statsData=r.data||{};
  $("followers").textContent=fmt(statsData.member_followers);$("following").textContent=fmt(statsData.member_following);$("podcasts").textContent=fmt(statsData.published_podcasts);$("episodes").textContent=fmt(statsData.published_episodes);$("plays").textContent=fmt(statsData.total_plays);$("points").textContent=fmt(statsData.crowpoints);
  $("snapMinutes").textContent=fmt(Math.floor(Number(statsData.listening_seconds||0)/60));$("snapComments").textContent=fmt(statsData.episode_comments);$("snapReactions").textContent=fmt(statsData.episode_reactions);$("snapViews").textContent=fmt(statsData.profile_views);
 }catch(e){console.warn("profile stats unavailable",e)}
}

async function loadActivity(){
 if(profileData.activity_public===false){$("activityTab").innerHTML='<div class="empty-profile">Activity is private.</div>';return}
 try{
  const r=await CROW_SUPABASE.from("cr_platform_recent_activity").select("id,event_type,message,metadata,created_at,division_key,entity_type,entity_id").eq("user_id",profileData.user_id).order("created_at",{ascending:false}).limit(15);
  if(r.error)throw r.error;
  const rows=r.data||[];
  $("activityTab").innerHTML=rows.map(a=>'<article class="feed-item"><div class="feed-top"><div class="feed-avatar">'+(profileData.avatar_url?imageMarkup(profileData.avatar_url,""):esc(initials(profileData.display_name)))+'</div><div><strong>'+esc(profileData.display_name||"Member")+'</strong><div class="feed-time">'+esc(a.event_type||"Activity")+(a.created_at?" · "+esc(safeTime(a.created_at)):"")+'</div></div></div><p style="margin-top:12px">'+esc(a.message||"Activity in CrowRules.")+'</p><div class="feed-source">'+esc(a.division_key||"CrowRules")+(a.entity_type?" · "+esc(a.entity_type):"")+'</div></article>').join("")||'<div class="empty-profile">No public activity yet. New CrowRules activity will appear here.</div>';
 }catch(e){$("activityTab").innerHTML='<div class="empty-profile">No public activity is available yet.</div>'}
}

async function loadPosts(){
 if(profileData.network_public===false){$("postsTab").innerHTML='<div class="empty-profile">Posts are private.</div>';return}
 try{
  const r=await CROW_SUPABASE.from("community_posts").select("id,title,body,post_type,status,visibility,is_pinned,is_locked,like_count,comment_count,view_count,published_at,created_at").eq("author_id",profileData.user_id).eq("status","published").eq("visibility","public").order("published_at",{ascending:false}).limit(20);
  if(r.error)throw r.error;
  const rows=r.data||[];
  let comments=[];
  if(rows.length){
   const cr=await CROW_SUPABASE.from("community_comments").select("id,post_id,author_id,parent_comment_id,body,status,like_count,created_at").in("post_id",rows.map(x=>x.id)).eq("status","published").order("created_at",{ascending:true});
   if(!cr.error)comments=cr.data||[]; else console.warn("comments unavailable",cr.error);
  }
  const authors=[...new Set(comments.map(x=>x.author_id))];
  let profiles=[];
  if(authors.length){
   const pr=await CROW_SUPABASE.from("podcast_member_profiles").select("user_id,display_name,username,avatar_url").in("user_id",authors);
   if(!pr.error)profiles=pr.data||[];
  }
  const pmap=Object.fromEntries(profiles.map(x=>[x.user_id,x]));
  const commentHtml=(postId)=>{
   const list=comments.filter(x=>x.post_id===postId);
   if(!list.length)return'<div class="notice" style="margin-top:12px">No replies yet. Start the conversation.</div>';
   const roots=list.filter(x=>!x.parent_comment_id);
   const children=list.filter(x=>x.parent_comment_id);
   const renderComment=x=>{
    const a=pmap[x.author_id]||{};const nm=a.display_name||a.username||"CrowRules Member";
    return '<div class="comment '+(x.parent_comment_id?'reply':'')+'" data-comment="'+esc(x.id)+'"><div class="comment-top"><div class="comment-avatar">'+(a.avatar_url?imageMarkup(a.avatar_url,nm):esc(initials(nm)))+'</div><div><strong class="comment-author">'+esc(nm)+'</strong><div class="comment-time">'+esc(safeTime(x.created_at))+'</div></div></div><div class="comment-body">'+esc(x.body)+'</div><div class="comment-actions"><button data-reply="'+esc(x.id)+'">Reply</button><span>'+fmt(x.like_count)+' likes</span></div><div class="reply-box" id="reply-'+esc(x.id)+'"><input maxlength="1000" placeholder="Write a reply…"><button class="btn" data-submit-reply="'+esc(x.id)+'">Reply</button></div></div>';
   };
   return '<div class="comment-thread">'+roots.map(renderComment).join('')+children.map(renderComment).join('')+'</div>';
  };
  const postHtml=rows.map(p=>'<article class="post-card" data-post="'+esc(p.id)+'"><div class="post-meta">'+esc(p.post_type||"Post")+' · '+esc(safeTime(p.published_at||p.created_at))+(p.is_pinned?" · Pinned":"")+'</div>'+(p.title?'<h3>'+esc(p.title)+'</h3>':"")+'<p>'+esc(p.body)+'</p><div class="post-actions"><span>♥ '+fmt(p.like_count)+'</span><span>💬 '+fmt(p.comment_count)+'</span><span>◉ '+fmt(p.view_count)+'</span></div>'+commentHtml(p.id)+'</article>').join('');
  const composer=self?'<form id="postComposer" class="composer"><h3>Share with the CrowRules community</h3><p>Post an idea, update, question, recommendation or conversation starter.</p><div class="composer-grid"><input id="postTitle" maxlength="160" placeholder="Title (optional)"><textarea id="postBody" maxlength="5000" required placeholder="What do you want to share?"></textarea><div class="composer-footer"><span id="postCount" class="char-count">0 / 5000</span><button class="btn primary" type="submit">Publish Post</button></div></div></form>':'';
  $("postsTab").innerHTML=composer+(postHtml||'<div class="empty-profile">No public posts yet. Be the first to start the conversation.</div>');
  wirePostComposer();
  wireReplies();
 }catch(e){console.error("posts unavailable",e);$("postsTab").innerHTML='<div class="empty-profile">Community posts are not available right now.</div>'}
}
function wirePostComposer(){
 const form=$("postComposer");if(!form)return;
 const body=$("postBody");const count=$("postCount");body.oninput=()=>count.textContent=body.value.length+" / 5000";
 form.onsubmit=async e=>{
  e.preventDefault();const btn=form.querySelector("button[type=submit]");const bodyVal=body.value.trim();if(!bodyVal)return;
  btn.disabled=true;btn.textContent="Publishing…";
  try{
   const user=getUser();if(!user)throw new Error("Sign in to publish a post.");
   const r=await CROW_SUPABASE.from("community_posts").insert({community_id:"975f140a-30b9-4dc8-9105-ac7fcd69663c",author_id:user.id,title:$("postTitle").value.trim()||null,body:bodyVal,post_type:"post",status:"published",visibility:"public",published_at:new Date().toISOString()}).select("id").single();
   if(r.error)throw r.error;
   await loadPosts();$("postsTab").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(err){alert("We couldn't publish your post. "+(err?.message||"Please try again."))}finally{btn.disabled=false;btn.textContent="Publish Post"}
 };
}
function wireReplies(){
 document.querySelectorAll("[data-reply]").forEach(btn=>btn.onclick=()=>{const box=$("reply-"+btn.dataset.reply);if(box)box.classList.toggle("open")});
 document.querySelectorAll("[data-submit-reply]").forEach(btn=>btn.onclick=async()=>{
  const box=$("reply-"+btn.dataset.submitReply);const input=box?.querySelector("input");const body=input?.value.trim();if(!body)return;
  btn.disabled=true;btn.textContent="…";
  try{
   const user=getUser();if(!user)throw new Error("Sign in to reply.");
   const post=btn.closest("[data-post]");const r=await CROW_SUPABASE.from("community_comments").insert({post_id:post.dataset.post,author_id:user.id,parent_comment_id:btn.dataset.submitReply,body,status:"published"}).select("id").single();
   if(r.error)throw r.error;
   await loadPosts();
  }catch(err){alert("We couldn't post your reply. "+(err?.message||"Please try again."))}finally{btn.disabled=false;btn.textContent="Reply"}
 });
}
}
function wireTabs(){
 document.querySelectorAll("[data-tab]").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  ["activity","posts","profileTab"].forEach(id=>{const el=$(id+"Tab");if(el)el.classList.toggle("hidden",id!==btn.dataset.tab);});
 });
}
function editProfile(){
 const p=profileData,tab=$("profileTab");if(!tab)return;
 tab.classList.remove("hidden");
 document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x.dataset.tab==="profileTab"));
 tab.innerHTML='<div class="edit-grid"><h2>Edit Profile</h2><label>Display name<input id="editDisplayName" maxlength="120" value="'+esc(p.display_name||"")+'"></label><label>Tagline<input id="editTagline" maxlength="180" value="'+esc(p.tagline||"")+'"></label><label>Bio<textarea id="editBio" maxlength="2000">'+esc(p.bio||"")+'</textarea></label><label>Location<input id="editLocation" maxlength="120" value="'+esc(p.location||"")+'"></label><label>Website<input id="editWebsite" maxlength="300" value="'+esc(p.website_url||"")+'"></label><button class="btn primary" id="saveProfileBtn">Save Profile</button></div>'+profileMediaEditorHtml(p);
 wireMediaEditor();
 $("saveProfileBtn").onclick=async()=>{
  const user=getUser();if(!user)return;
  const btn=$("saveProfileBtn");btn.disabled=true;btn.textContent="Saving…";
  try{
   const patch={display_name:$("editDisplayName").value.trim()||null,tagline:$("editTagline").value.trim()||null,bio:$("editBio").value.trim()||null,location:$("editLocation").value.trim()||null,website_url:$("editWebsite").value.trim()||null,updated_at:new Date().toISOString()};
   const r=await CROW_SUPABASE.from("podcast_member_profiles").update(patch).eq("user_id",user.id);
   if(r.error)throw r.error;
   profileData={...profileData,...patch};renderProfile();wireTabs();alert("Profile updated.");
  }catch(e){alert("Profile update failed. "+(e?.message||"Please try again."))}
  finally{btn.disabled=false;btn.textContent="Save Profile"}
 };
}
wireTabs();
loadProfile();
