<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CrowRules Member Profile</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="css/crowrules-cinematic.css">

<style>
:root{--c:#00e5ff;--v:#8b5cf6;--m:#a9b0c4;--l:#ffffff18;--fb:#05050b;--panel:#11131a;--panel2:#191c24;--line:#303540}
*{box-sizing:border-box}
body{margin:0;background:#07080c;color:#e8eaf0;font-family:Montserrat,Arial,sans-serif}
.shell{width:min(1120px,96%);margin:auto;padding:24px 0 90px}
.card{padding:0;border:1px solid var(--line);border-radius:14px;background:#0d0f14;box-shadow:0 14px 45px #0009;overflow:hidden}
.profile-cover{width:100%;height:300px;object-fit:cover;display:block;background:#151822}
.profile-head{position:relative;padding:0 28px 22px;border-bottom:1px solid var(--line);background:#11131a}
.profile-avatar-wrap{height:86px;position:relative}
.avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;border:5px solid #11131a;display:block;position:absolute;left:4px;top:-70px;background:#181b24}
.avatar-fallback{display:grid;place-items:center;font:900 48px Orbitron;color:var(--c);background:#181b24}
.eyebrow{font:900 10px Orbitron;color:var(--c);letter-spacing:.16em}
.name{font:800 clamp(1.8rem,5vw,2.8rem) Montserrat;margin:4px 0}.handle,.meta{color:var(--m);font-size:13px}.tagline{color:#fff;font-weight:700;margin:8px 0}.bio{color:#d7d9e2;line-height:1.65;max-width:780px;margin:12px 0}
.actions{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;margin:16px 0 0}.btn{border:1px solid #3a3f4a;border-radius:8px;background:#252932;color:#fff;padding:10px 16px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:#1877f2;border-color:#1877f2;color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:0;margin:0;background:#11131a;border-bottom:1px solid var(--line)}.stat{min-width:120px;flex:1;padding:13px 10px;text-align:center;border-right:1px solid #252a34}.stat:last-child{border-right:0}.stat b{display:block;font:800 16px Montserrat;color:#fff}.stat span{display:block;color:var(--m);font-size:9px;font-weight:800;margin-top:4px;letter-spacing:.06em}
.feed-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;padding:18px;background:#090a0e}
.box{margin-top:0;margin-bottom:18px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.box h2{font:800 14px Montserrat;color:#fff;letter-spacing:0;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr;gap:8px}.detail{padding:10px 0;border-bottom:1px solid #242832}.detail:last-child{border-bottom:0}.detail b{font-size:10px;color:var(--m)}.detail p{margin:4px 0 0;color:#fff;white-space:pre-wrap}
.network-grid{display:grid;gap:8px}.network-row{display:flex;align-items:center;gap:10px;padding:9px;border-radius:9px;background:#181b22}.network-row img,.network-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover}.network-avatar{display:grid;place-items:center;background:#242833;color:var(--c);font:800 14px Orbitron}.network-row a{color:#fff;text-decoration:none;font-weight:700}
.edit-panel input,.edit-panel textarea,.edit-panel select,.guestbook textarea{width:100%;box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #3a3f4a;background:#090b10;color:#fff;font:inherit}.edit-panel textarea,.guestbook textarea{min-height:85px;resize:vertical}.field{margin:11px 0}.field label{display:block;color:var(--m);font-size:10px;font-weight:800;margin-bottom:5px}.check{display:block;color:var(--m);font-size:11px;margin:8px 0}.empty{text-align:center;padding:35px;color:var(--m)}.guest{padding:12px 0;border-top:1px solid #242832}.guest:first-child{border-top:0}.guest a{color:#fff;font-weight:800;text-decoration:none}.guest small{display:block;color:var(--m);margin-top:4px}
@media(max-width:760px){.feed-layout{grid-template-columns:1fr}.profile-cover{height:220px}.profile-head{padding:0 18px 18px}.profile-avatar-wrap{height:74px}.avatar{width:120px;height:120px;top:-58px}.stats .stat{min-width:25%;flex:1 0 25%}}

.profile-tabs{display:flex;gap:4px;padding:0 18px;background:#11131a;border-bottom:1px solid var(--line);overflow:auto}.profile-tabs button{border:0;background:transparent;color:var(--m);padding:14px 16px;font-weight:800;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}.profile-tabs button.active{color:#fff;border-bottom-color:#1877f2}.profile-section{display:none}.profile-section.active{display:block}.profile-head .actions{margin-top:14px}.profile-head .meta a{font-weight:700;text-decoration:none}.network-row:hover{background:#20242d}.guest{line-height:1.55}

.profile-tabs{position:sticky;top:0;z-index:5}.profile-tabs button:focus-visible{outline:2px solid #1877f2;outline-offset:-2px}.profile-tabs::-webkit-scrollbar{height:4px}.profile-tabs::-webkit-scrollbar-thumb{background:#3b404b;border-radius:8px}.profile-section{animation:profileFade .18s ease}@keyframes profileFade{from{opacity:.35;transform:translateY(3px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.profile-section{animation:none}}

/* V19 social profile polish */
.profile-cover{min-height:180px;background:linear-gradient(135deg,#111827,#182033 48%,#0b1020);object-position:center}.profile-head{min-height:205px}.profile-head:after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,#1877f2,#8b5cf6,#00e5ff);opacity:.9}.profile-avatar-wrap{z-index:2}.avatar{box-shadow:0 4px 20px #0008}.name{letter-spacing:-.035em}.profile-head .handle{margin-top:-2px}.profile-head .actions{margin-top:16px}.profile-head .actions .btn{min-height:40px}.stats{position:relative}.stats .stat{transition:background .15s ease}.stats .stat:hover{background:#171a22}.profile-tabs{background:#0f1117;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.profile-tabs button{font-size:11px}.profile-tabs button.active{box-shadow:inset 0 -2px 0 #1877f2}.box{box-shadow:0 4px 18px #0005}.box h2{display:flex;align-items:center;gap:8px}.box h2:before{content:"";width:3px;height:15px;border-radius:4px;background:#1877f2}.actions .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.actions .btn{transition:transform .12s ease,filter .12s ease}.profile-empty-state{padding:48px 20px;text-align:center}.profile-status{min-height:20px;margin:10px 0}.profile-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#20242d;border:1px solid #3a3f4a;color:#fff;font-size:11px;font-weight:800}
@media(max-width:760px){.profile-cover{min-height:150px}.profile-head{min-height:220px}.profile-head .actions{gap:6px}.profile-head .actions .btn{flex:1 1 auto}.stats .stat{min-width:33.333%;flex:1 0 33.333%}.profile-tabs button{padding:13px 14px}}
</style>
</head>
<body data-crowrules-division="podcasting">
<header class="nav"><a class="brand" href="index.html">CROWRULES <span>PODCASTING</span></a><nav class="navlinks"></nav></header>
<main class="shell"><section id="profile" class="card"><div class="empty">Loading member profile…</div></section></main>
<footer class="footer">CrowRules Podcasting · Listen. Create. Share.</footer>
<script src="assets/js/app.js"></script>
<script src="js/crowrules-membership.js"></script>
<script src="js/crowrules-cinematic.js"></script>
<script>
(function(){
  const SUPABASE_URL="https://cevylpnoexugwgygvtgu.supabase.co";
  const SUPABASE_KEY=window.CROWRULES_SUPABASE_KEY||"sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-";
  let profileSupabase=null;
  window.loadSupabase=async function(){
    if(profileSupabase)return profileSupabase;
    if(window.supabase&&window.supabase.createClient){
      profileSupabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
      return profileSupabase;
    }
    const script=document.createElement("script");
    script.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    await new Promise(function(resolve,reject){
      const timer=setTimeout(function(){reject(new Error("Supabase library timed out loading."))},10000);
      script.onload=function(){clearTimeout(timer);resolve()};
      script.onerror=function(){clearTimeout(timer);reject(new Error("Unable to load Supabase library."))};
      document.head.appendChild(script);
    });
    if(!window.supabase||!window.supabase.createClient)throw new Error("Supabase library loaded but was unavailable.");
    profileSupabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    return profileSupabase;
  };
})();
</script>
<script>
(async function(){
  const el=document.getElementById("profile");
  try{
    const sb=await loadSupabase();
    const params=new URLSearchParams(location.search);
    let id=params.get("user");
    const username=(params.get("username")||"").trim().toLowerCase();
    const esc=function(v){return String(v==null?"":v).replace(/[&<>"]/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]})};
    if(!id&&username){
      const lookup=await sb.from("podcast_member_profiles").select("user_id").eq("username",username).maybeSingle();
      if(lookup.error)throw lookup.error;
      if(!lookup.data){el.innerHTML='<div class="empty">Member not found.</div>';return}
      id=lookup.data.user_id;
      history.replaceState(null,"","member-profile.html?user="+encodeURIComponent(id));
    }
    const authResult=await sb.auth.getUser();
    const me=authResult&&authResult.data?authResult.data.user:null;
    if(!id){
      if(!me){
        el.innerHTML='<div class="empty">Please log in to view your member profile.</div>';
        return;
      }
      id=me.id;
      history.replaceState(null,"","member-profile.html?user="+encodeURIComponent(id));
    }
    const profileResult=await sb.from("podcast_member_profiles").select("user_id,display_name,username,bio,tagline,location,website_url,cover_url,avatar_url,badge,is_public,activity_public,network_public,followers_public,following_public,mood,interests,favorite_music,favorite_movies,favorite_games,profile_theme,featured_achievement").eq("user_id",id).maybeSingle();
    if(profileResult.error)throw profileResult.error;
    const p=profileResult.data;
    if(!p||(!p.is_public&&(!me||me.id!==id))){el.innerHTML='<div class="empty">This member profile is not publicly available.</div>';return}
    document.body.dataset.profileTheme=p.profile_theme||"cyber";
    const name=p.display_name||p.username||"CrowRules Member";
    const initial=(name.trim()[0]||"C").toUpperCase();
    if(me&&me.id!==id){
      const key="crProfileViewed:"+id+":"+new Date().toISOString().slice(0,10);
      if(!sessionStorage.getItem(key)){
        const vr=await sb.from("podcast_profile_views").insert({profile_user_id:id,viewer_user_id:me.id});
        if(!vr.error)sessionStorage.setItem(key,"1");
      }
    }
    const statsResult=await sb.from("podcast_member_profile_stats").select("published_podcasts,published_episodes,total_plays,member_followers,member_following,profile_views,episode_comments,episode_reactions,listening_seconds,crowpoints").eq("user_id",id).maybeSingle();
    const st=statsResult.data||{};
    const fmt=function(n){return Number(n||0).toLocaleString()};
    const hours=(Number(st.listening_seconds||0)/3600).toFixed(1);
    let following=false,mutual=false;
    if(me&&me.id!==id){
      const pair=await Promise.all([
        sb.from("podcast_member_follows").select("id").eq("follower_user_id",me.id).eq("followed_user_id",id).maybeSingle(),
        sb.from("podcast_member_follows").select("id").eq("follower_user_id",id).eq("followed_user_id",me.id).maybeSingle()
      ]);
      following=!!pair[0].data;mutual=!!pair[1].data;
    }
    const avatar=p.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'" alt="'+esc(name)+'" loading="eager" referrerpolicy="no-referrer">':'<div class="avatar avatar-fallback">'+esc(initial)+'</div>';
    const networkVisible=p.network_public!==false||!!(me&&me.id===id);
    let html=(p.cover_url?'<img class="profile-cover" src="'+esc(p.cover_url)+'" alt="Profile cover">':"")+'<div class="profile-head"><div class="profile-avatar-wrap"></div>'+avatar+
      '<div class="eyebrow">CROWRULES MEMBER</div><h1 class="name">'+esc(name)+'</h1>'+
      (p.username?'<div class="handle">@'+esc(p.username)+'</div>':"")+
      (p.tagline?'<div class="tagline">'+esc(p.tagline)+'</div>':"")+
      (p.location?'<div class="meta">📍 '+esc(p.location)+'</div>':"")+
      (p.website_url?'<div class="meta"><a style="color:var(--c)" target="_blank" rel="noopener" href="'+esc(p.website_url)+'">Visit website ↗</a></div>':"")+
      (p.badge?'<div style="margin-top:10px"><span class="profile-badge">✓ '+esc(p.badge)+'</span></div>':"")+
      (p.bio?'<p class="bio">'+esc(p.bio)+'</p>':"")+'</div>';
    if(networkVisible){
      html+='<div class="stats"><div class="stat"><b>'+fmt(st.published_podcasts)+'</b><span>SHOWS</span></div><div class="stat"><b>'+fmt(st.published_episodes)+'</b><span>EPISODES</span></div><div class="stat"><b>'+fmt(st.total_plays)+'</b><span>PLAYS</span></div><div class="stat"><b>'+fmt(st.profile_views)+'</b><span>PROFILE VIEWS</span></div><div class="stat"><b>'+fmt(st.episode_comments)+'</b><span>COMMENTS</span></div><div class="stat"><b>'+fmt(st.episode_reactions)+'</b><span>REACTIONS</span></div><div class="stat"><b>'+hours+'</b><span>LISTENING HOURS</span></div><div class="stat"><b>'+fmt(st.crowpoints)+'</b><span>CROWPOINTS</span></div></div>';
    }
    html+='<div class="actions">'+(me&&me.id!==id?'<button id="followBtn" class="btn primary">'+(following?"Following":"Follow Member")+'</button>':"")+
      '<button id="shareBtn" class="btn">SHARE PROFILE</button>'+
      (me&&me.id!==id?'<button id="blockBtn" class="btn">BLOCK MEMBER</button><button id="reportBtn" class="btn">REPORT MEMBER</button>':"")+
      '<a class="btn" href="member-activity.html">NETWORK</a></div>'+
      '<div id="status" class="meta profile-status" aria-live="polite"></div>'+
      '<section class="box"><h2>MYSPACE DETAILS</h2><div class="grid">'+
      '<div class="detail"><b>MOOD</b><p>'+esc(p.mood||"Online")+'</p></div>'+
      '<div class="detail"><b>INTERESTS</b><p>'+esc(p.interests||"Not added yet.")+'</p></div>'+
      '<div class="detail"><b>FAVORITE MUSIC</b><p>'+esc(p.favorite_music||"Not added yet.")+'</p></div>'+
      '<div class="detail"><b>FAVORITE MOVIES</b><p>'+esc(p.favorite_movies||"Not added yet.")+'</p></div>'+
      '<div class="detail"><b>FAVORITE GAMES</b><p>'+esc(p.favorite_games||"Not added yet.")+'</p></div>'+
      '<div class="detail"><b>NETWORK</b><p>'+fmt(st.member_followers)+' followers · '+fmt(st.member_following)+' following</p></div></div></section>'+
      '<section class="box"><h2>GUESTBOOK</h2><div id="guestbook"></div></section>'+
      '<section class="box"><h2>PUBLIC NETWORK</h2><div id="network"><div class="empty">Loading network…</div></div></section>';
    html=html.replace('</div><div class="stats">','</div><div class="stats">');
    el.innerHTML=html;
    const tabs=document.createElement("div");
    tabs.className="profile-tabs";
    tabs.innerHTML='<button class="active" data-tab="about">ABOUT</button><button data-tab="networkTab">NETWORK</button><button data-tab="guestbookTab">GUESTBOOK</button>'+(me&&me.id===id?'<button data-tab="editTab">EDIT PROFILE</button>':'');
    el.appendChild(tabs);
    const moveSections=function(){
      const boxes=[...el.querySelectorAll(":scope > .box")];
      if(boxes.length<3)return;
      const details=boxes.find(x=>x.querySelector("h2")&&x.querySelector("h2").textContent.includes("MYSPACE"));
      const guest=boxes.find(x=>x.querySelector("h2")&&x.querySelector("h2").textContent.includes("GUESTBOOK"));
      const net=boxes.find(x=>x.querySelector("h2")&&x.querySelector("h2").textContent.includes("PUBLIC NETWORK"));
      [details,guest,net].forEach(function(x){if(x)x.classList.add("profile-section")});
      if(details)details.dataset.tab="about"; if(guest)guest.dataset.tab="guestbookTab"; if(net)net.dataset.tab="networkTab";
      const show=function(name){tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));[details,guest,net].forEach(x=>{if(x)x.classList.toggle("active",x.dataset.tab===name)});};
      tabs.querySelectorAll("button").forEach(b=>b.onclick=function(){show(b.dataset.tab);history.replaceState(null,"","#"+b.dataset.tab)});
      const initialTab=(location.hash||"").replace("#","");
      show(["about","networkTab","guestbookTab","editTab"].includes(initialTab)?initialTab:"about");
    };
    moveSections();
    const cover=document.querySelector(".profile-cover");
    if(cover)cover.addEventListener("error",function(){this.style.display="none"});
    document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;const active=tabs.querySelector("button.active");if(active&&active.dataset.tab!=="about"){const about=tabs.querySelector('[data-tab="about"]');if(about)about.click()}});
    document.getElementById("shareBtn").onclick=async function(){try{if(navigator.share){await navigator.share({title:name+" | CrowRules Podcasting",url:location.href})}else{await navigator.clipboard.writeText(location.href);document.getElementById("status").textContent="Profile link copied."}}catch(e){}};
    if(me&&me.id!==id){
      const followBtn=document.getElementById("followBtn");
      const blockBtn=document.getElementById("blockBtn");
      const reportBtn=document.getElementById("reportBtn");
      followBtn.onclick=async function(){followBtn.disabled=true;const q=following?await sb.from("podcast_member_follows").delete().eq("follower_user_id",me.id).eq("followed_user_id",id):await sb.from("podcast_member_follows").insert({follower_user_id:me.id,followed_user_id:id});if(q.error)document.getElementById("status").textContent=q.error.message;else{following=!following;followBtn.textContent=following?"Following":"Follow Member";document.getElementById("status").textContent=following?"You are now following this member.":"You stopped following this member."}followBtn.disabled=false};
      const blockState=await sb.from("podcast_member_blocks").select("id").eq("blocker_user_id",me.id).eq("blocked_user_id",id).maybeSingle();
      let blocked=!!blockState.data;
      blockBtn.textContent=blocked?"UNBLOCK MEMBER":"BLOCK MEMBER";
      blockBtn.onclick=async function(){blockBtn.disabled=true;const q=blocked?await sb.from("podcast_member_blocks").delete().eq("blocker_user_id",me.id).eq("blocked_user_id",id):await sb.from("podcast_member_blocks").insert({blocker_user_id:me.id,blocked_user_id:id});if(!q.error){blocked=!blocked;blockBtn.textContent=blocked?"UNBLOCK MEMBER":"BLOCK MEMBER";document.getElementById("status").textContent=blocked?"Member blocked.":"Member unblocked."}else document.getElementById("status").textContent=q.error.message;blockBtn.disabled=false};
      reportBtn.onclick=async function(){const reason=prompt("Why are you reporting this member?");if(!reason||reason.trim().length<3)return;reportBtn.disabled=true;const q=await sb.from("podcast_member_reports").insert({reporter_user_id:me.id,reported_user_id:id,reason:reason.trim()});document.getElementById("status").textContent=q.error?(q.error.code==="23505"?"You already have an open report for this member.":q.error.message):"Report submitted.";reportBtn.disabled=false};
    }
    async function loadNetwork(){
      const box=document.getElementById("network");
      if(!networkVisible){box.innerHTML='<div class="empty">This member keeps their network private.</div>';return}
      const rows=[];
      if(p.followers_public!==false||me&&me.id===id){const q=await sb.from("podcast_member_follows").select("follower_user_id,created_at").eq("followed_user_id",id).order("created_at",{ascending:false}).limit(12);(q.data||[]).forEach(function(x){rows.push(x.follower_user_id)})}
      if(p.following_public!==false||me&&me.id===id){const q=await sb.from("podcast_member_follows").select("followed_user_id,created_at").eq("follower_user_id",id).order("created_at",{ascending:false}).limit(12);(q.data||[]).forEach(function(x){rows.push(x.followed_user_id)})}
      const ids=[...new Set(rows)].filter(function(x){return x!==id});
      if(!ids.length){box.innerHTML='<div class="empty">No public network connections yet.</div>';return}
      const q=await sb.from("podcast_member_profiles").select("user_id,display_name,username,avatar_url,network_public").in("user_id",ids);
      box.innerHTML='<div class="network-grid">'+(q.data||[]).filter(function(x){return x.network_public!==false||me&&me.id===x.user_id}).map(function(x){const n=x.display_name||x.username||"CrowRules Member";return '<div class="network-row">'+(x.avatar_url?'<img src="'+esc(x.avatar_url)+'" alt="">':'<div class="network-avatar">'+esc((n[0]||"C").toUpperCase())+'</div>')+'<a href="member-profile.html?user='+encodeURIComponent(x.user_id)+'">'+esc(n)+'</a></div>'}).join("")+'</div>';
    }
    async function loadGuestbook(){
      const box=document.getElementById("guestbook");
      const q=await sb.from("podcast_profile_comments").select("id,author_user_id,body,created_at").eq("profile_user_id",id).order("created_at",{ascending:false}).limit(20);
      const ids=[...new Set((q.data||[]).map(function(x){return x.author_user_id}))];
      let profiles=new Map();
      if(ids.length){const pr=await sb.from("podcast_member_profiles").select("user_id,display_name,username").in("user_id",ids);profiles=new Map((pr.data||[]).map(function(x){return [x.user_id,x]}))}
      let out=(q.data||[]).map(function(x){const a=profiles.get(x.author_user_id)||{};return '<div class="guest"><a href="member-profile.html?user='+encodeURIComponent(x.author_user_id)+'">'+esc(a.display_name||a.username||"CrowRules Member")+'</a><div>'+esc(x.body)+'</div><small>'+new Date(x.created_at).toLocaleString()+'</small></div>'}).join("");
      if(!out)out='<div class="empty">No guestbook messages yet.</div>';
      if(me&&me.id!==id)out='<div style="margin-bottom:14px"><textarea id="guestText" maxlength="500" placeholder="Write a message…"></textarea><button id="guestPost" class="btn primary" style="margin-top:8px">POST MESSAGE</button></div>'+out;
      box.innerHTML=out;
      const post=document.getElementById("guestPost");
      if(post)post.onclick=async function(){const t=document.getElementById("guestText");if(!t.value.trim())return;post.disabled=true;const r=await sb.from("podcast_profile_comments").insert({profile_user_id:id,author_user_id:me.id,body:t.value.trim()});if(r.error)document.getElementById("status").textContent=r.error.message;else await loadGuestbook();post.disabled=false};
    }
    await Promise.all([loadNetwork(),loadGuestbook()]);
    if(me&&me.id===id){
