<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Charts — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script type="module" src="js/app.js"></script></head><body><div data-nav></div><main class="page"><header class="page-head"><p class="eyebrow">CROWRULES CHARTS</p><h1>The network pulse.</h1><p>Discover the shows, episodes and hosts getting attention across the universe.</p></header><div class="chart-tabs"><button class="chip active">Top podcasts</button><button class="chip">Top episodes</button><button class="chip">Top hosts</button></div><section class="rank-list" id="charts"></section></main><script type="module">import{getSupabase}from"./js/supabase.js";const sb=await getSupabase(),box=document.getElementById("charts");async function load(){if(!sb)return;const r=await sb.from("cr_podcast_network_stats_65").select("*").order("plays",{ascending:false}).limit(20);if(r.error)return;box.innerHTML=(r.data||[]).map((p,i)=>'<a class="rank-item" href="podcast.html?slug='+encodeURIComponent(p.slug)+'"><div><b>#'+(i+1)+' · '+p.title+'</b><small>'+p.plays+' plays · '+p.followers+' followers</small></div><span>'+(p.is_original?"ORIGINAL":"")+'</span></a>').join("")||"<div class='panel'>No network data yet.</div>"}load();</script></body></html>
