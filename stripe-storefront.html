<body><div class="wrap"><h1>Creator Storefront</h1><p id="intro" class="muted">Loading products…</p><div id="products" class="grid"></div></div>
<script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://cevylpnoexugwgygvtgu.supabase.co";
const SUPABASE_ANON_KEY=window.CROWRULES_CONFIG?.supabasePublishableKey||""; // Browser-safe publishable key loaded from js/config.js.
const params=new URLSearchParams(location.search);
const accountId=params.get("accountId");
const defaultPodcastId=params.get("podcastId")||"";
const defaultEpisodeId=params.get("episodeId")||"";
const root=SUPABASE_URL+"/functions/v1/stripe-connect-demo";
async function load(){
 if(!accountId){document.getElementById("intro").textContent="Missing connected account ID.";return;}
 const r=await fetch(root+"?action=list-products&accountId="+encodeURIComponent(accountId),{headers:{apikey:SUPABASE_ANON_KEY}});
 const d=await r.json();
 if(!r.ok||d.error){document.getElementById("intro").textContent=d.error||"Unable to load products.";document.getElementById("intro").className="error";return;}
 document.getElementById("intro").textContent="Products from this connected creator.";
 document.getElementById("products").innerHTML=d.products.map(p=>{
   const price=p.default_price;
   const amount=price?.unit_amount!=null?(price.unit_amount/100).toFixed(2):"";
   return '<article class="card"><h2>'+escapeHtml(p.name)+'</h2><p class="muted">'+escapeHtml(p.description||"")+'</p><strong>$'+amount+'</strong><br><br><button onclick="buy(\''+price.id+'\')">Buy</button></article>';
 }).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function buy(priceId,podcastId="",episodeId=""){
 const r=await fetch(root+"?action=checkout",{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE_ANON_KEY},body:JSON.stringify({accountId,priceId,podcastId,episodeId})});
 const d=await r.json(); if(!r.ok||d.error){alert(d.error||"Checkout failed.");return;} location.href=d.url;
}
load();
</script></body></html>
