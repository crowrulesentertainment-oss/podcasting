<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05050b"><title>Creator Podcast Manager | CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><style>
body{margin:0;background:#05050b;color:#f7f8ff;font-family:Montserrat,Arial,sans-serif}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.hero{padding:44px 0 24px}.eyebrow{color:#55e7ff;font:800 10px Orbitron;letter-spacing:.18em;text-transform:uppercase}.hero h1{font:800 clamp(34px,6vw,62px) Orbitron;margin:8px 0}.hero p{color:#9299b4;line-height:1.7;max-width:760px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:18px 0}.btn{display:inline-block;padding:10px 14px;border:1px solid rgba(130,150,255,.2);border-radius:11px;background:rgba(255,255,255,.04);color:#fff;text-decoration:none;font-size:10px;font-weight:800}.primary{background:linear-gradient(135deg,#55e7ff,#a879ff);color:#05050b;border:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{overflow:hidden;border:1px solid rgba(130,150,255,.17);border-radius:21px;background:rgba(12,13,24,.93)}.art{aspect-ratio:16/8;background:linear-gradient(135deg,#101125,#07070d);overflow:hidden}.art img{width:100%;height:100%;object-fit:cover}.body{padding:19px}.title{font:800 17px Orbitron}.meta{color:#69718c;font-size:10px;margin-top:7px}.desc{color:#9299b4;font-size:11px;line-height:1.6;min-height:35px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.chip{padding:6px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.1);font-size:9px;color:#9299b4}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{display:none;padding:12px;border-radius:11px;margin:12px 0;background:rgba(255,109,131,.07);border:1px solid rgba(255,109,131,.2);color:#ffabb7;font-size:11px}.notice.show{display:block}.empty{padding:50px;text-align:center;border:1px dashed rgba(255,255,255,.12);border-radius:20px;color:#9299b4}@media(max-width:700px){.grid{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}}
</style></head><body><main class="wrap"><a class="btn" href="creator-studio.html" style="margin-top:24px">← Creator Studio</a><section class="hero"><div class="eyebrow">Creator Control Room</div><h1>Podcast Manager</h1><p>Manage the podcasts owned by your CrowRules creator profile. Update branding, metadata, publishing status, and podcast links from one place.</p></section><div id="notice" class="notice"></div><div class="toolbar"><span id="count" class="meta">Loading podcasts…</span><a class="btn primary" href="create-podcast.html">+ Create Podcast</a></div><section id="grid" class="grid"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>
(()=>{"use strict";const $=x=>document.getElementById(x),db=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY);let all=[];const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));function notice(s){$("notice").textContent=s;$("notice").classList.add("show")}function render(){$("count").textContent=all.length+" podcast"+(all.length===1?"":"s");$("grid").innerHTML=all.map(p=>'<article class="card"><div class="art">'+(p.artwork_url?'<img src="'+esc(p.artwork_url)+'" alt="'+esc(p.title)+' artwork">':"")+'</div><div class="body"><div class="title">'+esc(p.title)+'</div><div class="meta">'+esc(p.category||"Uncategorized")+" · "+esc(p.status||"draft")+'</div><div class="chips"><span class="chip">'+Number(p.listener_count||0).toLocaleString()+" listeners</span><span class="chip">"+Number(p.total_plays||0).toLocaleString()+" plays</span>"+(p.is_live?'<span class="chip">LIVE</span>':"")+"</div><p class="desc">"+esc(p.description||"No description yet.")+'</p><div class="actions"><a class="btn primary" href="podcast.html?id='+encodeURIComponent(p.id)+'">View</a><a class="btn" href="edit-podcast.html?id='+encodeURIComponent(p.id)+'">Edit Podcast</a></div></div></article>').join("")||'<div class="empty">You have no podcasts yet. Create your first CrowRules podcast to get started.</div>'}async function boot(){try{let a=await db.auth.getUser();if(!a.data.user){location.href="login.html?redirect="+encodeURIComponent("podcast-manager.html");return}let m=await db.from("members").select("id").eq("user_id",a.data.user.id).maybeSingle();if(m.error)throw m.error;if(!m.data)throw Error("No CrowRules membership profile found.");let c=await db.from("creators").select("id").eq("member_id",m.data.id).eq("is_active",true).maybeSingle();if(c.error)throw c.error;if(!c.data)throw Error("No active creator profile found.");let r=await db.from("podcasts").select("id,creator_id,title,slug,category,description,artwork_url,trailer_url,website_url,rss_url,status,is_featured,is_live,listener_count,total_plays,created_at,updated_at,category_id").eq("creator_id",c.data.id).order("updated_at",{ascending:false});if(r.error)throw r.error;all=r.data||[];render()}catch(e){notice(e.message||"Unable to load podcasts.");$("count").textContent="Unable to load."}}boot()})();
</script></body></html>
