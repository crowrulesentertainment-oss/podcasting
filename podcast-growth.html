.wrap{width:min(1240px,92vw);margin:auto;padding:26px 0 70px}.top,.head,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.top{flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 13px;border:1px solid #3b3b5b;border-radius:11px;background:rgba(255,255,255,.04);color:#fff;text-decoration:none;font-size:10px;font-weight:800}.primary{border:0;background:linear-gradient(135deg,#55e7ff,#a879ff);color:#05050b}.hero,.panel,.stat{border:1px solid #26263c;border-radius:20px;background:rgba(12,13,24,.9);box-shadow:0 15px 50px rgba(0,0,0,.22)}.hero{margin-top:18px;padding:26px;background:linear-gradient(135deg,rgba(18,18,35,.97),rgba(7,7,15,.97))}.ey{color:#55e7ff;font:800 10px Orbitron;letter-spacing:.18em;text-transform:uppercase}h1{margin:8px 0;font:800 clamp(26px,5vw,48px) Orbitron}.muted{color:#737b96;font-size:9px;line-height:1.7}.desc{color:#9299b4;max-width:800px;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}.stat{padding:17px}.label{color:#707895;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.value{margin-top:8px;font:800 23px Orbitron}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:18px}.panel{padding:20px}.title{font:800 16px Orbitron}.item{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06)}.item:last-child{border:0}.bar{height:8px;margin-top:8px;background:#191a2b;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#55e7ff,#a879ff)}.badge{padding:5px 8px;border:1px solid #34364e;border-radius:999px;font-size:8px;text-transform:uppercase}.good{color:#69f5ae}.warn{color:#ffb86b}.callout{margin-top:12px;padding:14px;border:1px solid rgba(85,231,255,.15);border-radius:14px;background:rgba(85,231,255,.04);color:#aeb4ca;font-size:10px;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:480px){.stats{grid-template-columns:1fr}}

<body><main class="wrap">
<div class="top"><a class="btn" href="podcast-dashboard.html" id="back">← Podcast Dashboard</a><a class="btn" href="creator-studio.html">Creator Studio</a></div>
<div id="notice"></div><section id="hero" class="hero" hidden></section><section id="stats" class="stats" hidden></section><section id="grid" class="grid" hidden></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script>
<script>
(()=>{"use strict";const $=x=>document.getElementById(x),db=supabase.createClient(window.CROWRULES_SUPABASE_URL,window.CROWRULES_SUPABASE_PUBLISHABLE_KEY),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),fmt=n=>Number(n||0).toLocaleString(),days=(a,b)=>Math.max(0,Math.floor((new Date(a)-new Date(b))/86400000)),pct=(a,b)=>b?Math.round(a/b*100):0;
function notice(m){$("notice").innerHTML='<div class="panel">'+esc(m)+'</div>'}
async function boot(){try{
 const id=new URLSearchParams(location.search).get("id");if(!id){location.href="podcast-manager.html";return}
 const u=await db.auth.getUser();if(!u.data.user){location.href="login.html?redirect="+encodeURIComponent("podcast-growth.html?id="+id);return}
 const m=await db.from("members").select("id").eq("user_id",u.data.user.id).maybeSingle();if(m.error)throw m.error;if(!m.data)throw Error("No CrowRules membership profile found.");
 const c=await db.from("creators").select("id").eq("member_id",m.data.id).eq("is_active",true).maybeSingle();if(c.error)throw c.error;if(!c.data)throw Error("No active creator profile found.");
 const p=await db.from("podcasts").select("id,title,category,description,status,is_live,listener_count,total_plays,created_at,updated_at").eq("id",id).eq("creator_id",c.data.id).maybeSingle();if(p.error)throw p.error;if(!p.data)throw Error("Podcast not found or you do not own it.");
 const q=await db.from("podcast_episodes").select("id,title,episode_number,season_number,status,published_at,created_at,play_count,duration_seconds").eq("podcast_id",id).order("created_at",{ascending:false});if(q.error)throw q.error;
 const e=q.data||[],pub=e.filter(x=>x.status==="published"&&x.published_at),plays=e.reduce((a,x)=>a+Number(x.play_count||0),0),total=Math.max(Number(p.data.total_plays||0),plays),avg=e.length?Math.round(plays/e.length):0;
 const now=new Date(),last=pub.slice().sort((a,b)=>new Date(b.published_at)-new Date(a.published_at))[0],lastDays=last?days(now,last.published_at):null;
 const intervals=pub.slice().sort((a,b)=>new Date(a.published_at)-new Date(b.published_at)).slice(1).map((x,i)=>days(x.published_at,pub.slice().sort((a,b)=>new Date(a.published_at)-new Date(b.published_at))[i].published_at));
 const cadence=intervals.length?Math.round(intervals.reduce((a,b)=>a+b,0)/intervals.length):null;
 const recent=pub.filter(x=>new Date(x.published_at)>=new Date(now.getTime()-90*86400000)),older=pub.filter(x=>new Date(x.published_at)<new Date(now.getTime()-90*86400000));
 const recentAvg=recent.length?Math.round(recent.reduce((a,x)=>a+Number(x.play_count||0),0)/recent.length):0,olderAvg=older.length?Math.round(older.reduce((a,x)=>a+Number(x.play_count||0),0)/older.length):0;
 const max=Math.max(1,...e.map(x=>Number(x.play_count||0)));
 const trend=[];for(let n=5;n>=0;n--){const d=new Date(now.getFullYear(),now.getMonth()-n,1),next=new Date(d.getFullYear(),d.getMonth()+1,1);const arr=pub.filter(x=>{const z=new Date(x.published_at);return z>=d&&z<next});trend.push({label:d.toLocaleDateString(undefined,{month:"short"}),count:arr.length,plays:arr.reduce((a,x)=>a+Number(x.play_count||0),0)})}
 const consistency=pub.length>1?Math.max(0,Math.min(100,100-Math.max(0,(cadence||0)-30)*2)):pub.length?25:0;
 $("hero").innerHTML='<div class="ey">Growth & Listener Retention Intelligence</div><h1>'+esc(p.data.title)+'</h1><p class="desc">'+esc(p.data.description||"Build a sustainable release rhythm and understand how your catalog is performing over time.")+'</p><div class="actions"><a class="btn primary" href="podcast-intelligence.html?id='+encodeURIComponent(id)+'">Performance Intelligence</a><a class="btn" href="podcast-retention.html?id='+encodeURIComponent(id)+'">Listener Retention</a><a class="btn" href="podcast-journey.html?id='+encodeURIComponent(id)+'">Listener Journey</a><a class="btn" href="podcast-binge.html?id='+encodeURIComponent(id)+'">Binge Intelligence</a><a class="btn" href="podcast-lifecycle.html?id='+encodeURIComponent(id)+'">Episode Lifecycle</a><a class="btn" href="podcast-performance.html?id='+encodeURIComponent(id)+'">Content Performance</a><a class="btn" href="analytics.html">Creator Analytics</a></div>';
 $("stats").innerHTML='<div class="stat"><div class="label">Total Plays</div><div class="value">'+fmt(total)+'</div><div class="muted">Recorded podcast total</div></div><div class="stat"><div class="label">Listeners</div><div class="value">'+fmt(p.data.listener_count)+'</div><div class="muted">Current listener count</div></div><div class="stat"><div class="label">Published</div><div class="value">'+fmt(pub.length)+'</div><div class="muted">'+fmt(e.length-pub.length)+' not published</div></div><div class="stat"><div class="label">Avg Plays</div><div class="value">'+fmt(avg)+'</div><div class="muted">Per catalog episode</div></div><div class="stat"><div class="label">Last Release</div><div class="value">'+(lastDays===null?"—":fmt(lastDays))+'</div><div class="muted">'+(lastDays===null?"No published episode":"days ago")+'</div></div>';
 const months=trend.map(x=>'<div class="item"><div class="row"><span>'+x.label+' · '+x.count+' published</span><b>'+fmt(x.plays)+' plays</b></div><div class="bar"><i style="--w:'+Math.round(x.plays/Math.max(1,...trend.map(z=>z.plays))*100)+'%"></i></div></div>').join("");
 const top=[...e].sort((a,b)=>Number(b.play_count||0)-Number(a.play_count||0)).slice(0,6).map((x,i)=>'<div class="item"><div class="row"><span>'+esc((i+1)+". "+x.title)+'</span><b>'+fmt(x.play_count)+'</b></div><div class="bar"><i style="--w:'+Math.round(Number(x.play_count||0)/max*100)+'%"></i></div></div>').join("");
 $("grid").innerHTML='<section class="panel"><div class="head"><div><div class="title">Catalog Growth</div><div class="muted">Published episodes and recorded plays by month</div></div></div>'+months+'<div class="callout"><b>Publishing rhythm:</b> '+(cadence===null?"Not enough published episodes to measure cadence.": "Average time between published episodes: "+cadence+" days.")+' '+(lastDays!==null?(lastDays>30?"Your latest release is more than 30 days old.":"Your latest release is within the last 30 days."):"")+'</div></section><section class="panel"><div class="head"><div><div class="title">Growth Signals</div><div class="muted">Catalog-level indicators, not predictions</div></div></div><div class="item"><div class="row"><span>Publishing consistency</span><b>'+fmt(consistency)+'%</b></div><div class="bar"><i style="--w:'+consistency+'%"></i></div></div><div class="item"><div class="row"><span>Recent 90-day avg plays</span><b>'+fmt(recentAvg)+'</b></div></div><div class="item"><div class="row"><span>Earlier catalog avg plays</span><b>'+fmt(olderAvg)+'</b></div></div><div class="item"><div class="row"><span>Recent vs earlier episodes</span><b>'+((recent.length&&older.length)?(recentAvg>=olderAvg?"+":"")+pct(recentAvg-olderAvg,Math.max(1,olderAvg))+"%":"—")+'</b></div></div><div class="callout"><span class="badge warn">Retention data</span><br><br>True listener retention is not yet measurable from the current podcast tables. The current build has episode play counts and listener totals, but no verified play-progress/session events.</div></section><section class="panel"><div class="head"><div><div class="title">Top Performing Episodes</div><div class="muted">Ranked by recorded play count</div></div></div>'+(top||'<div class="muted">No episode performance data yet.</div>')+'</section><section class="panel"><div class="head"><div><div class="title">Retention Readiness</div><div class="muted">What the next analytics layer needs</div></div></div>'+["Play session started","25% / 50% / 75% progress events","Episode completion event","Anonymous or member-level listener identifier","Session timestamp and episode duration"].map(x=>'<div class="item"><div class="row"><span>'+x+'</span><span class="badge">Not connected</span></div></div>').join("")+'<div class="callout">Once event-level listening data exists, this page can calculate completion rate, average listen duration, drop-off points, returning listeners, and episode-to-episode retention without guessing from play counts.</div><div class="actions"><a class="btn primary" href="episode-manager.html">Manage Episodes</a><a class="btn" href="podcast-dashboard.html?id='+encodeURIComponent(id)+'">Back to Dashboard</a></div></section>';
 $("hero").hidden=$("stats").hidden=$("grid").hidden=false;
}catch(e){notice(e.message||"Unable to load growth intelligence.")}}boot()})();
</script></body></html>
