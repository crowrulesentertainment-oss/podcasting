<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listener Dashboard • CrowRules Podcasting</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/podcasting-platform.css?v=1"><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=5" defer></script><script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-universal-member.js?v=2" defer></script><script src="js/podcasting-config.js"></script><script src="js/podcasting-platform.js" defer></script><script src="js/podcasting-player.js" defer></script></head><body><main class="cr-shell"><section class="hero"><div><div class="eyebrow">CrowRules Podcasting • Listener Experience V4</div><h1>YOUR PODCAST<br>UNIVERSE.</h1><p id="welcome">Loading your listener profile…</p></div><div class="hero-orb"><div class="orb-text">LISTEN<br><span style="color:var(--cyan)">YOUR WAY</span></div></div></section><section class="stats"><div class="stat"><strong id="nSaved">—</strong><span>Saved</span></div><div class="stat"><strong id="nHistory">—</strong><span>History</span></div><div class="stat"><strong id="nUnread">—</strong><span>Unread</span></div><div class="stat"><strong id="nFollow">—</strong><span>Following</span></div></section><section class="section"><div class="section-head"><h2>Continue Listening</h2></div><div id="history" class="grid"></div></section><section class="section"><div class="section-head"><h2>Saved Episodes</h2></div><div id="saved" class="grid"></div></section><section class="section"><div class="section-head"><h2>Recommended For You</h2></div><div id="recs" class="grid"></div></section><section class="section"><div class="section-head"><h2>Notifications</h2></div><div id="notes" class="grid"></div></section></main><script>document.addEventListener('crow:ready',async()=>{const $=id=>document.getElementById(id),E=CrowPodcasting.esc;if(!CrowPodcasting.user){$('welcome').innerHTML='Sign in with your CrowRules account to unlock your listener dashboard.';return}const u=CrowPodcasting.user;$('welcome').textContent='Welcome back, '+(u.user_metadata?.display_name||u.email||'listener')+'. Your listening activity stays connected to your CrowRules account.';const [h,s,n,r]=await Promise.all([CrowPodcasting.getHistory(30),CrowPodcasting.getSaved(30),CrowPodcasting.getNotifications(30),CrowPodcasting.getRecommendations(8)]);$('nSaved').textContent=s.length;$('nHistory').textContent=h.length;$('nUnread').textContent=n.filter(x=>!x.is_read).length;const follows=await CrowPodcasting.rows('cr_podcast_follows_65','id',{eq:{follower_id:u.id},limit:1000});$('nFollow').textContent=follows.length;$('history').innerHTML=h.length?h.map(x=>'<article class="card panel"><h3>Episode '+E(x.episode_id)+'</h3><p>'+Number(x.seconds||0)+' seconds listened'+(x.completed?' • Completed':'')+'</p><button class="btn" onclick="openEpisode(\''+E(x.episode_id)+'\')">Open</button></article>').join(''):'<div class="notice">Nothing in your listening history yet. Start exploring.</div>';$('saved').innerHTML=s.length?s.map(x=>'<article class="card panel"><h3>Saved episode</h3><p class="muted">'+E(x.episode_id)+'</p><button class="btn" onclick="openEpisode(\''+E(x.episode_id)+'\')">Open</button></article>').join(''):'<div class="notice">Save episodes from any show to build your personal library.</div>';$('recs').innerHTML=r.map(p=>'<article class="card pod-card"><div class="art" style="background-image:url('+JSON.stringify(p.artwork_url||'')+')"></div><div class="pod-body"><h3>'+E(p.title)+'</h3><p>'+E(p.description||'')+'</p><div class="pod-meta"><span>'+E(p.category||'Podcast')+'</span><a class="btn" href="podcast.html?id='+encodeURIComponent(p.id)+'">Explore</a></div></div></article>').join('')||'<div class="notice">Recommendations will appear as more podcasts are published.</div>';$('notes').innerHTML=n.map(x=>'<article class="card panel '+(x.is_read?'':'notice')+'"><h3>'+E(x.title)+'</h3><p>'+E(x.body||'')+'</p><small>'+new Date(x.created_at).toLocaleString()+'</small>'+(x.is_read?'':' <button class="btn" onclick="readNote(\''+E(x.id)+'\')">Mark read</button>')+'</article>').join('')||'<div class="notice">No notifications.</div>';window.openEpisode=id=>location.href='podcast.html?episode='+encodeURIComponent(id);window.readNote=async id=>{await CrowPodcasting.markNotificationRead(id);location.reload()}})</script></body></html>
