<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distribution — CrowRules Podcasting</title><link rel="stylesheet" href="css/podcasting.css"><script src="js/config.js"></script><script src="js/podcasting.js" defer></script><script src="js/player.js" defer></script><script src="js/app.js" defer></script></head><body><div data-nav></div><main class="wrap hero"><div class="eyebrow">CROWRULES DISTRIBUTION 2.4</div><h1>RSS & <span class="gradient">distribution.</span></h1><p class="lead">Manage live podcast feeds, validate them, and prepare your shows for external podcast directories.</p><div id="auth" class="notice">Checking account…</div><div id="app" style="display:none"><div id="shows" class="grid"></div></div></main><script>const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));addEventListener("crow:ready",async()=>{if(!__CROW_USER){auth.textContent="Sign in to manage distribution.";return}app.style.display="block";const p=await CROW_SUPABASE.from("podcasts").select("id,title,slug,status,website_url").eq("creator_id",__CROW_USER.id);shows.innerHTML=(p.data||[]).map(x=>{const feed=CROW_CONFIG.supabaseUrl+"/functions/v1/"+CROW_CONFIG.rssFunction+"?slug="+encodeURIComponent(x.slug);return '<article class="card"><span class="pill">'+esc(x.status)+'</span><h2>'+esc(x.title)+'</h2><p>Live RSS feed generated from your published catalog.</p><p class="mono">'+esc(feed)+'</p><div class="actions"><a class="btn" target="_blank" rel="noopener" href="'+feed+'">Open RSS</a><a class="btn primary" href="publishing-pipeline.html">Validate feed</a><a class="btn" href="edit-podcast.html?id='+x.id+'">Edit show metadata</a></div></article>'}).join("")||'<div class="notice">Create a podcast to begin distribution.</div>'});</script></body></html>
